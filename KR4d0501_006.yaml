front:
  text: 淵頴呉先生集卷之六門人金華宋濂編
  hash: sha256:5d5af52cd20eda2b4fd9e20a06b79b8ac63d79f39389c36631520b16f221b8dd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_006-1a}
body:
  text: 與黄明逺第二書論左氏二承示舉傳論左氏誠有可舉者丗言春秋者必先㝎五霸之功罪五覇之間齊桓特盛雖曰諸侯實行天子之事僖之二年狄人滅衞衞文徙都椘丘齊也遂帥諸矦之師以城之春秋不序也止若魯自城然其義盖有不與齊侯之􅌹封者今而曰使諸侯而城之将如城邢書齊宋曹之師或如城縁陵書諸侯椘丘之書則否豈非覇者命魯獨任其責乎左氏乃以魯㑹之後而不序左氏非也自今考之左氏誠非也然欲謂為魯之自城則尤非矣方狄之伐邢三師有聶北之救邢亦自是遷于夷儀然後三師因其所以救之者往城之𣏌夏餘也而即東夷又為徐莒所脅齊也且為東略之謀夏既有會于鹹次年之春乃往城其所遷之縁陵此二役也邢杞之遷猶得其國家以往雖使救而城之未見其為􅌹封故齊與諸侯可書也若夫榮澤之敗漕邑之䖏衞也國破君死遺男女流散遷轉莫之底止扵是而救之扵是而城之豈非所謂專封者歟故齊與諸侯不可書也今而又曰椘丘在衞小榖在齊均之以魯自城書也盖荘之二十有二年城小榖左氏則謂魯之城也為𬋩仲然魯亦未嘗有自城它國之邑者杜預注小榖管仲私邑今在濟北榖城榖城别是齊之榖邑魯與齊襄曽㑹其地而蕭叔􅈬朝之䖏不曰小榖小榖本魯邑也曲阜西北有故小榖城孫眀復魯人也考此當矣未可引以證楚丘也且城楚丘之上年齊宋魯鄭曹邾為㑹于朾将此六國城之也又况亡國之餘豈魯一人所䏻獨任其責者㢤戍鄭虎牢非魯之獨戍也歸粟于蔡非魯之獨歸也皆覇者與諸俟為之也僖之三年齊侯宋公江人黄人陽榖之㑹齊之覇者㡬三十年左氏則指陽榖為伐楚之謀近丗儒者亦多從之何則楚之僣號稱王馮陵中夏齊之所當憂者門庭之宼也其欲聲罪而致討者計巳乆矣兵不正勝師出不正乆不有以周詢扵始則何以善䖏其成功㢤今而曰齊及八國侵蔡蔡潰遂伐楚盖齊之伐楚因侵蔡而遂為之又不用江人黄人之師也陽榖之㑹果何所謀乎是不然齊桓莭制之兵也兵有聚而為正亦有散而為竒先之以文告之詞而耀兵扵陳者齊及八國也示之以犄角之勢而按兵扵境者江人黄人也樂毅将伐齊則先約韓魏以分其與國之援諸葛孔明将擊魏則申好江東以定其鼎足之勢盖楚今為江陵江黄今在汝蔡光黄之境自江陵及扵其國者不啻千里然楚之與國也熟諳楚事而樂告扵齊此一㑹也齊之所以敢致力扵楚者獨不以江黄之謀乎及召陵受盟齊師老矣陳轅陶塗實誤軍道使䧟沛澤之中討之誠是也江黄二國全師守境未魯出戰故又使魯主之而後用之扵陳不然陳豈有獲罪扵江黄者哉今而又曰左氏叙蔡人之嫁蔡姬故侵蔡豈先以伐楚謀乎以是知陽糓之必不然矣雖然蔡姬未絶蔡人嫁之若曰齊以侵蔡之陋不足以令諸俟而欲以伐楚召之此近譎矣孔子又謂之正者何也意者蔡自莘之敗獻武見執既而楚人復之為楚屬國諸姬之䧟扵蠻夷者自蔡而始齊也因是而侵蔡特以蔡姬而召釁欲使楚人之不覺一蔡之潰乃移其事扵楚則夫齊及八國之威巳動扵鄢郢之都矣陽榖之㑹其與江黄謀此者至熟也雖晋之覇亦猶是也楚之寖強非東方崛起之呉未有䏻制其死命者始會于鍾離又㑹于戚又㑹于柤又㑹于向屡㑹之矣然未嘗與之合戰扵楚楚之嵗有呉師實晋使也豈非晋之所以用呉者亦得扵齊桓之約江黄者乎抑此二事又齊桓覇業之特盛者也椘丘封衛也陽糓伐椘也春秋之大節目也此而不辨則無貴乎知經矣它如邾儀父非字也當與邾子克别是一人近世黎氏亦有是說然莊王之弟王子克實字子儀又一證也如單伯魯大夫左氏謂周大夫則深致其辨然魯邑有單父單伯是魯命卿周有單子則姓苑言成王少子臻封于單或周别有單邑歟未可定也餘卷帙尚多又當有待扵面而後盡焉與傅嘉父書論𣏌春秋列國惟𣏌最難􅊲足下確主左氏謂𣏌本侯爵或與足下辨者又謂𣏌爵為伯謂之伯者公羊氏之說也公羊釋經桓二年来朝之𣏌侯為紀十二年曲池之盟而𣏌矦亦為紀其後止見𣏌伯耳用此故也是不然𣏌之本爵公也當武王克啇未及下車存舜之後扵陳則胡公滿也存夏之後扵杞則東樓公也存啇之後則微子之在宋也地方百里爵號公皆使服其服行其禮奏其樂稱先王客而朝以俻三恪故傳曰王者之後稱公是則𣏌本公爵也周之盛時諸侯之封爵甚嚴也微子微仲雖用啇之舊稱至二世而為宋公胡公滿之後則有相公孝公而𣏌自東樓公西樓公十世至成公皆稱公無異稱也是則𣏌之本爵公也而又謂之為侯為伯者諸侯之封爵變亂周道之缺也自𣏌之入春秋桓之二年稱矦荘之二十七年稱伯僖之二十三年稱子文之十二年又稱伯㐮之二十九年又稱子昭之六年又稱伯自是終春秋稱伯凡六變春秋之書他國未有如此者後之儒者釋之不曰𣏌用夷禮春秋貶焉則曰其國削弱而自降也不曰時王所黜則曰覇主擅為之進退也由此觀之則𣏌之為公爵也明矣安得主左氏曰侯爵主公羊氏曰伯爵乎然予猶竊有疑焉春秋之法中國而夷禮則夷之夷而中國則中國之𣏌宋王者之後也桑林之樂公侯合伯子男之禮猶班班然僅見扵宋𣏌無有矣信乎其用夷也然春秋狄秦者有之狄鄭者有之狄晉者有之夫以其行夷狄之道也特以號舉而未嘗一黜其爵爵者先王之所建也今不能用先王之禮而用夷禮狄之可也聖人又豈以意升降諸侯之爵乎若以𣏌之用夷則巳貶稱子矣而又稱侯稱伯且曰雜用夷禮則降一等純用夷禮則降二等將以其偪近淮夷也春秋之𥘉𣏌即淳于之𣏌也而非雍丘之杞也嘗以来朝不敬而致討矣曷不扵此時貶而獨貶其卒乎此一疑也春秋之世非先王之世也諸侯恣行淫亂不軌衆陵寡大侵小信乎封疆之􅏠離也𣏌之自降則吾不知也且當時之削弱不特一𣏌也又何杞之屢降乎然春秋之末諸侯之賦嘗重矣子産請之扵晉則曰鄭伯男也而使從公侯之賦懼弗堪也争之不巳卒以减賦夫鄭固自降矣春秋未嘗以男爵書之若𣏌以其力之不足禮之不講僻陋在夷不能自列徒以削弱而貶號爲侯貶號爲伯貶號爲子是戰國之衛也而謂𣏌若是乎又况先王之封爵𣏌之世守也曷爲無故貶爵以自辱其先祖苟又自降不巳則將爲周室不成子乎此二疑也成周之盛王室固能絀陟諸侯矣其東遷也王失其政諸侯亦扵是乎不廷盖非特一杞之爲也使時王而能貶其爵削其地誠足以振衰周而起之矣春秋不必作也不然悖亂如鄭衛桀驁如呉椘天王不䏻一有所懲而獨絀𣏌柰何以夫王者之後扵周爲客而以夷狄視之耶州不若國國不若氏氏不若人人不名名名不若字字不若爵爵不過子使𣏌而可絀是果何罪以至此乎吾未聞時王之威令足行也徒藉區區之禮以感動諸矦至扵魯桓簒弑之賊猶且錫命以寵之雖死不廢其賞濫矣其刑則未也又安在其能絀𣏌乎此三疑也時而春秋王道缺矣諸矦力政而後有覇冝乎其取先王之典而紛更之也然五等之封爵則未之或變也春秋之始年大國雖有欲覇之心而小邑未易以從覇𣏌之為𣏌是時一與莒盟未嘗自列扵諸矦之會齊桓之盛且不足以致𣏌又百餘年而始同盟于蟲牢若之何而擅為之進退乎鄭大夫卒晉人將治其室鄭人不許豈不曰以大夫之在鄭而晉得以制之是邉鄙鄭也不可為國大夫且不可專癈置扵鄰國又况同為天子之藩臣乎若覇主之擅進退者誠以甲兵之強弱幣玉之厚薄也而偕其䓁秩則扵載書之際以莒子則先薛伯以曹伯則次許男或有之矣而未始敢變其爵也且𣏌之来盟也晉人方帥諸侯以城之固將尊顯之不暇安得賤而絀之乎此四疑也此四說者必有所是亦必有所非其曰𣏌本夷禮而春秋貶之未盡其義也則又曰其國削弱而自降也又未盡其義也則又曰時王所絀而覇主擅為之進退也是則𣏌本何爵乎公爵也夫既公爵矣春秋曷為若是而書之也夫子之作春秋必関扵天下之大故而後書盖文武之褒大封而𣏌為首東遷以来彼且扶傷救死之不恤為天王者固冝發憤于上而振我周家之法度乃徒覇主僅假其大義以專封弱國以聳動天下且禹之功及民也逺人之見河洛者猶思之况其子孫乎鄫不足道也而𣏌為稍大夫子盖嘗惻然有感扵心而特予之以王爵之不正者且以志其日就衰㓕之漸是心也興滅國繼絶世之心也故曰𣏌之本爵公也𣏌之公爵吾扵西周見之𣏌之為侯為伯驟升驟降吾則扵春秋見之見之扵西周者正也見之扵春秋者夫子特示其變扵天下及變之旣極又以子稱之當其卒也淮夷嘗病𣏌矣縁陵有城而齊以不覇當其来盟也東夏嘗不寜矣淳于有城而晉亦以不覇有霸非美事也無覇非細故也扵是王道之不絶者如綫人皆曰𣏌先聖人之後也今弱矣而春秋屢變其爵將使天下之諸侯少懼焉則周室猶幸也夫豈上絀夏下存周而果如公羊氏之說乎否耶足下既主左氏而學又孰昔漢董仲舒與胡母子都同業故春秋之教大行此不無望扵足下也亦惟有以析衷焉讀戰國䇿春秋戰國之際齊先覇晉次之惟南方之椘㝡大與二覇相出入秦則眇然一變扵西戎終之吞二周併六國類非昔之所謂彊者乃今西望而悉輸之秦豈果地形之便兵力之武而致然乎吾嘗求其故矣春秋之時齊晉及椘既彊地廣則主驕兵勝則民疲民疲主驕自顧無䏻敵巳者亦不能以敵人然後秦以戎狄辟陋之國决起而驟勝之又况山東之主年未踰弱冠材不逮中人一旦孽后貴弟位重權髙纎夫細兒專兵握政欲以是當孝公啇鞅則非秦之敵也游談捭闔託秦名以自决盟約戰攻挟秦势以爲觧不然上無以僅存其國下無以私售其說曽不旋踵皆以爲秦築帝宫比郡縣之民未始有一窹者惟夫山谷險惡羔藿飯豆之人言之也切慮之也詳且有以深中齊椘三晉之病燕人者曰秦之欲并天下而王之也不與古同事之如子之事父猶將亡之也行雖如伯夷猶將亡之也行雖如桀紂猶將亡之也雖善事之無益也不可以爲存適足以自令亟亡也然則山東非能合而相堅如一者必皆亡矣韓人者曰山東相合之主者不卑名之國者可長存王而不能自恃不惡卑名以事彊者長乆萬世之善計事彊不可則不如合弱胡與越人言語不相知志意不相通同舟而凌波至其相救助如一也秦之兵至柰何合弱又不䏻相救助如一此所以為山東苦也其言云爾太史公乃遺而不録世亦莫知其為誰之謀齊椘三晉之人類曰我國大否則曰秦與我厚一國受攻五國不救韓㝡近㝡先亡燕頗逺乃後亡齊椘三晉之人不監秦之所以亡山東者而競趍其所以亡豈果地形之便兵力之武而致然乎或曰當周之𥘉本在岐梁沮漆之間啇之中世特置西鄙荒僻之地而不之有故太王王季文王自其百里之國而興焉秦猶周也及武王克啇天下歸周分紂之故都而立三監太公望䖏齊周公旦䖏魯召公奭䖏燕武王又自營洛邑居之而濟之以徳秦則反是郡縣一置而子弟為匹夫仁義不施而刑僇為常行是秦雖能得周之所以興而獨不能得周之所以不亡山東既平六國為一陳勝劉項之徒大呼而起函關百二之險章邯百萬之衆終不得首尾相救又何秦之強弱尔殊也由是觀之山東散則秦勝山東合則秦滅死君之㣧亡將之家猶䏻使天下不為秦有况山東之完國乎夫天下之地方千里者九秦獨有其一此正孟子所謂鄒敵椘者秦又戎也公羊春秋不云乎秦伯卒而不名狄道也孝公啇鞅未遇之𥘉天下亦以夷狄擯秦擯之是矣而又事之何哉秦交之不絶與國之不恤縦横㳺說之不禁非秦能亡之也自亡之也是故曹操為國賊而呉蜀之不通宇文為䲭梟而陳齊之相擊亦終扵必亡而後已豈獨戰國乎哉讀韓非子予讀韓非子書盖法家也至顯學篇乃言八儒三墨皆足以蠧國而害政必欲盡去乎是而後䏻治墨不足言也儒者之學通古今徹上下有國者無不頼之而非獨不以為然是又荀卿子弟子也一何迂誣怪盭若此耶豈以荀卿子之學猶習於戰國之俗而不純扵堯舜周孔之道或有以召之故耶昔者孔子嘗謂子夏曰女爲君子儒母為小人儒荀卿子則曰大儒天子三公小儒諸侯大夫士猶嚮君子小人之辨然又非也夫儒者本學士之稱也茍儒矣雖其居一國大夫之軄而其為天下平治之噐舉在我惟治有廣狭則其徳之所及者有逺邇今也大儒之効必以歸之周公小儒之為害若子思孟軻且譏之或言王或言覇或言強國務使世主擇焉以為政則又時變其道以曲從之道可變乎是徒苟冒而窳惰繆學而飾說既病乎人且厲已也仁義必堯舜征伐必湯武子思孟軻之道將不粲然明白為後王法乎奈何欲法後王而反譏之也當周之衰也孔子自其先代廢壊之餘修衣冠正禮樂明文章而以之教七十子也未始曰吾儒者也猶曰是有君子有小人所謂君子小人一義利之間耳又豈有大儒小儒云云者耶然以戰國之世去聖日逺而諸子之說紛起私意揣摩強辨相勝荀卿子號為儒者而未純扵聖人及其弟子又自叛去夫然故人視儒者之學輕而非也亦䧟扵刑名法術之末且曰八儒三墨皆足以蠧國而害政至欲絀儒生去經籍自以其刑名法術之學而施之扵天下此其罪誠不在李斯後矣荀卿子豈或有以召之故耶雖然先王之世先王之道無非儒也所以為儒之名者未見扵天下也粤無鏄魯無削秦無廬胡無弓車非無也秦魯胡粤之人類能之而不有其名也夫既儒者之名立而後百家異說歲聒日闘嘵嘵然矣其昧扵私溺扵一偏之見浸淫蔓衍而不知返其誣者且謂吾道為無益必欲煨燼㓕裂以盡之而自快其所欲為扵是周公孔子之法耗矣故秦人之言曰詩書不如律令仁義不如刑罰詩書仁義蕩焉無餘卒至扵危急敗亡而曽不少窹也嗚呼荀卿子亦不為無過也㢤讀公孫龍子世所傳公孫龍子六篇龍盖趙人當平原君時曽與孔子髙論臧三耳至其著堅白同異欲推之天下國家使君臣上下狥名責實而後能治者可謂詳矣自太史公劉向班固之徒率稱其出古之禮官及夫譥者為之然後有敝顔師古曰譥者訐也公孫龍豈所謂訐者㦲然獨不明立一定之說而但虗設無窮之辭亦徒為紛更變亂而已何其細也孔子嘗有言曰觚不觚觚㢤觚㢤言觚而失其形制則將有不得為觚者又况治天下國家而不得其所以為治者乎此固吾聖人之所慎也春秋戰國之際士大夫咸昧扵義理之中而專以利害爲說文姦言飾譎行日馳騖扵他岐沈溺扵外物而卒至背畔扵大道之統紀敝敝焉名不綂實老子亦曰名者實之賔也公孫龍盖有審扵是而言之或過是以頗滯扵析辭而反闇扵大體察焉而無用辨焉而不急鄧析之兩可恵施之多方皆是物也不然則吾聖人且以名正言順爲先矣名位不同節文異數聖人嘗以義權其輕重禮正其進退是皆天造地設亘古亘今浃扵人心著扵耳目溢扵禮官之篇籍必曰道之所貴者中中之所貴者權天下之事雖未甞出扵一定當其權合其中則固聖賢用心之所極無俟乎辨士假物而取喻者也今則彼爲堅而此爲白此爲同而彼爲異吾徒見其紛更變亂而巳矣何𥙷扵天下國家之治㢤雖然世之本公孫龍之說而欲求其爲狥名責實者少矣自今之言吏治者觀之恒多文而少實官具成式吏抱成案標注時日指陳辭𣢾非深刻也非巧詆也非輕縦也非失出也則巳𥙷苴其訛闕鉤擿其姦伏類無有毫髮遺者然而經制之不定而虗文之相蒙風俗之不一而私心之相勝是雖有百公孫龍之喙且未足以䖏之者也然惟漢之宣帝自丞相以下必欲其徇名責實為治諸生必守家法文吏必課牋奏至扵文學政事法理之具一切必務其職者似矣然以聖人之治天下國家凡事惟執其大綱而不察其細略其小疵而不受其欺惜乎是時無以聖人大公之道告之而徒用其漢家雜伯之術王成或以是而得賞楊惲蓋寛饒䓁或以是而遭誅此將何以致是也與其名是而實非則又何貴乎徇名責實之治㢤嗚呼白黑之紛糅賢不肖之混殽後世之治為不及乎宣帝逺矣此予所以猶有取扵公孫龍之說也言治道者可為永嘅也㢤讀孔子集語自孔子殁學者言人人殊當戰國之時遂有孟氏之學荀卿之學世子宻子賤漆雕開公孫尼子之學盖惟孟氏之學本扵曽子子思而獨得其宗至扵荀卿則知一返孟氏而復以人性之善者為惡豈不逺吾聖人之道㢤然而周人世碩又謂人性有善有惡而恒在乎所養且作養書一篇宻子賤漆雕𨳩公孫尼子之徒寔出扵吾聖人之門一倡群和而告子勝復持與孟軻為辨雖以漢世大儒董仲舒劉向揚䧺徒能反覆乎善與不善之間而終無以究吾聖人之實然者聖人之道則已乆為天下裂矣孔子在時東郭子嘗問扵子貢頗疑聖人之門為雜子貢則曰夫子之設科也以待天下之學者櫽括之間多曲木砥礪之旁多頑鈍是以雜也然則聖人之門有以徳行進有以政事顯有以言語行有以文學著門弟子各以其性之所近學之所就而往教扵其國聖人在時固不至如東郭子之論其雜也然而聖人殁而微言絶異端起而大義乖吾扵是而後知東郭子之論盖出扵聖人既殁之後而深慮夫戰國諸子之自相矛楯也自相矛楯非聖人教之若是其雜也學者自雜之也嗚呼一曲而邪說百家而横議曽不悟其厚誣聖人而欲求暢其一巳之私納之扵聖人之域鑿空而無所繫著傅會而徒爲蔓衍聖人之道豈其若是聖人之遺言佚語則巳參差四出而不可致詰是故名家苛嬈而煩碎言聖人必先扵正名法家深礉而慘刻言聖人可以殺而不殺漁父盗跖肆爲譏訕䜟圗卦緯過扵妖譎將其心自耻其文辭之淫妄義理之膚淺吾不託之聖人則不足以信天下後世天下後世又未必不以此而或疑聖人之門為雜也老聃言道徳世之清净寡欲無為者多託之老聃蘇秦張儀言縦横世之㳺說熒蠱世主者多託之蘇秦張儀此其偽亦何所不有冝學者反以是惑也然而聖人之言記諸論語垂在六經是其一體一用妙道精義之發昭然若掲日月而行諸天也又豈戰國諸子所得而易雜者㢤雖然孔子家語𥘉出魏王肅家觀其言具與大小戴禮相出入而王肅嘗持以難鄭玄世之儒者猶或疑之而不盡信盖慎之也况今永嘉薜據所次孔子集語或本扵戰國諸子或載扵西漢老儒雖若聖人之遺言佚語頼此而僅存吾恐天下後世學者之滋惑也書以識之苟或謂吾如劉子玄之疑古者吾知慎焉而巳矣書張良傳或謂子曰留侯之先相韓者五世而韓滅故留侯欲為韓報仇咸陽復建韓國之社稷既項羽殺韓公子成則又歸漢為漢畫䇿以圗楚及漢王與酈食其謀撓椘權欲復立六國後韓將再封而留侯乃借前箸以籌其不可為漢計則善獨不為韓地乎又當秦之𥘉亡姍笑三代盪滅古法焚棄先王之典籍漢興盍反是道留侯才智明逹素書兵法僅託之圯上老父豈無以三代帝王之道而一言之歟此皆其可憾者也予曰不然方秦之亂天下豪傑並起非大家豪姓即其宗室父兄日夜囓古扼腕攻一城下一邑以務立其故主求以勝秦秦既滅而楚覇宰制天下立十八王又殺故韓王而改立他王韓失職矣豈不欲輔韓之故公子㦲留侯之力誠有所不及者故仇椘而臣漢非實委心扵漢王也又欲為韓而報椘耳撓椘權立六國三晉有生氣而韓亦必有再封之望然當椘漢之未决又立六國以衆其敵使天下㳺士各歸事其主漢無與成功漢之勝負未可知又况項羽􅌹制之餘山東河北九江昌邑猶有故王有不可以紛更而變易之者使韓復得而存鄭昌之死非楚意也韓其能乆存乎田儋魏豹張耳陳餘之流皆不足以復存故國故寧寢酈生之謀而就漢之天下天下既定太原馬邑固巳屬韓㐮王之孽孫矣韓之再封又未必非留侯力也若夫椘漢用兵之後髙祖自謂以馬上得天下而陸賈叔孫通皆故秦之儒生要之皆辨士非真儒留侯既以兵法决勝而素書又明黄老黄老之學簡而靖且與漢𥘉除苛觧嬈之法同一意何有扵儒術也孝文時雖以賈誼之通逹國體精練時務絳侯灌嬰且沮為洛陽少年喜功生事孝宣亦謂俗儒好是古非今使人眩扵名實不知所守何足委任當世果有儒者亦將以是而受譏焉又未可責之留侯者也嗚呼漢承百王之弊而終不得以上繼三代帝王之隆者實一時之將相大臣使然是又何獨留侯也哉亡友喬生哀辭自予少居山中恒踽踽四顧無一與交者言語趍蹌動輒見笑以為木訥人也人亦未嘗樂與予交東陽喬生光庭素善予光庭世醫也􅒏耿介欲以文墨自奮拔予毎推户造之從容文史間且引琴以自娱當得趣墟市若無行人神思悠邈括宮納羽驚飊入弦聲在指外嘗為予製山居騎氣引䓁曲騎氣者盖曰以是騎天地之正氣云爾人或謂生此與俗鮮好盍巳之君則曰此吾癖也今年夏予北歸自燕而君以乆病不得見病日劇自度必死比死猶耿耿不亂自世道降中人以下一溺扵異教而巳苟能充其力扵緇黄而顧不能盡其心扵棺槨亦獨何㦲賢者卓然有見扵古将曰吾有先聖人之法在母崇異必務扵正否則衺辭誕說之是徴亦何所不有以至羌胡不憂其死惟恐不焚之俗得移扵中國盖舉世莫之悟也而生獨有可稱者焉予世之覉民也進将不能有所用扵世退又無所藉以自治其身交友扵是乎益鮮遂為之辭以哀之是歲至治元年也辭曰嗟乎我觀我人均是庶物或厚而豊或佻而窒垢氛作私乖盭為疾嚚智鑿心嬈憂戕質欺賢遻聖神見鬼出足蛇肆威翼乕增慄恒視力之可為至泯身而弗恤生其已知之矣莽兮以生慌焉以死錯寞之與居汗漫之為使馳睒眒以絶塵抗哤亂而離滓通衢窮巷黄耉殤子百年同歸天地曾不若一指也而予又何激乎或者持爾故藝騖爾竒音摝艦沆瀁笮梯嶔崟人跡罕到島獸哀吟豈成連伯牙之爾待私有感扵人琴嗟乎生自此逺矣形潰𣪚而不收魂委蛇以何反是將椉大區之寥廓而與造化者㳺衍柰之何而獨使我心惋也悲夫亡友張生哀辭曩予童稚間予友張生始以贅来女氏重以親戚故甚狎每歲時一會必出所著詩宛有二妙四靈風致倡予和汝且累數十不自止至扵言談舉動尤缺然不能與世俛仰而獨好從博者㳺袒跣馮陵㡬欲起晉宋時豪桀而與之交者乃曰韓文公世稱大儒張籍且譏其挾博簺規人財公但荅為善戯不謔文武弛張之道李翺集載古㯉蒲經一卷梟盧關塹尚可䨱也是将何代無賢㢤至治初予自燕南還而生乃遭女氏有鬰攸之孽焚其妻子蕩其室廬筐篋殆盡生朝夕哭拾遺骨混一函葬之女氏本朱書玄磗識其墓曰幸歳遇寒食沾杯酒盂飯不餒巳自言生時具子午夘酉衝也多成敗兹既敗乎我則天必更成我乎未及十年而今竟以戚戚死豈古所謂秀而不實者乎生諱鑫字季長扵是年三十有六續娶卒無子又行事不少概見徒念其身死無後以悲㑹既窆予日以事不及哭有宿草焉故爲之辭使􅈬其墓而讀之亦予之至情也辭曰惟大塊子禀我以精復黔雷兮造我以形藐予生兮中䖏攖世變兮弗遑日寧伊表表兮愈偉行者辟易兮坐者竦跪眸子兮摛光蒔髮毛兮揷牙齒何衣冠兮弗帶又旨味兮弗嘗既藜羮兮不我足葛屨之繚戾兮吾以履霜豈予窮兮可達恍昔壮兮今老歲月歘兮如奔山丘零落兮不自保嗟妻孥兮託聚指貨貝兮浮漚雖兹身兮亦贅矧外物兮将焉求諒眇眇兮跳丸曶隆隆兮倚杵大海波兮塵飛三山踣兮六鼇起舞何人寰兮無覺曰氣化兮則然道能存兮常黙名可朽兮不以年朝顔冶子桃其華暮骴殘兮烏鳶之食古今兮同流天地兮罔極嗚呼悲㢤兮白雲拗林木沈沈兮野猨嗷嘈逖夫人兮不可見奈逝者之如斯兮滔滔亡友趙生哀辭趙生季良家故宗姓也予少與之交者若干年自言妙推算星黁所直星宿甚有力又自竒其容貌壮偉言語秀㧞且喟曰某生以布衣􅏡㦄州縣某生以刀茟起佐䑓憲某生以文學升進館閣士無志則巳有志事竟成吾北行决矣及行予呼酒與生别又作序文一通以壮其志曰盖古之豪士多閎偉塊桀自異扵常人然固未易遇也遭世急扵用人然後遇耳任少卿田仁漢名士嚮在扶風西界小邑時自以無豪易髙及来長安求為衞将軍舎人貧不䏻給絳衣玉具劒或為家監騎奴所屈辱當天子擇材衛将軍家富児賈豎妄庸僥倖如木偶𬒳文繡外羙矣中則枵然無一有卒無以易此兩人者乆困者必益伸暫晦者必終顯且丗之囏飢羸苦窮戹無所控吿古何嘗無是人㢤今生日論天下士之賢否時命之窮達口不告宗黨足不别僚友北行慨然如必有所遇者然本其平日所碩欲欲以措諸事業且落落難合及朝上書夕則召見一息肩弛檐間則華衣駟馬或随之矣夫又何愧扵古人㦲此殆生之所自信者乆矣雖予亦㡬生之必有遇也自生去二年人從燕趙間来言生英銳之氣窮窶之色日闘扵胸中猶澹然不為之動終以是而客死豈世所謂豪桀有志之士人方譏其為狂為妄天又若是憗之者耶曾祖某某官祖某某官父某洪州司法叅軍生喜讀書庶㡬復振其家及是乃以䘮歸三子傫然也有足使予悲哀慘怛扵心者又從而為之辭辭曰嗚呼趙生才非不足用而命也數竒學非不能博而力又不得自進扵時柰之何㦲吹律本以徴聵操頡萹以卑瞽斯竒材與劒客日切齒扼腕而不可悉數紛衆人之異嗜莽時俗之披猖争繁華扵趙李競翕豔乎金張郊坰羅車騎第宅溢酒漿此生之所欲見扵帝郷也或者窮欄下俚槁項黄馘生未嘗賭城郭死不殊扵土礫上猿猱兮下蛙黽僅耕鑿之是力烏能窺出日乎泰華之頂固巳快雨零扵䆫隙矣不然使彼生者孤妻髽弱子經有以抱終天之戚戚爲何如也耶李仲舉岑尚周哀誄辤𥘉溧陽李士良仲舉餘姚岑士貴尚周盖延祐間予同薦于郷至杭見尚周舟中年二十餘羙風儀善言論㓗士也及来燕邸乃與仲舉相見其年不後尚周貌加尫言若不出諸口雅士也李本故家仲舉㓜病母愛之甚及上禮部欲行乃閉諸户使不得出泣目盡腫且曰我家左江右湖魚稲豐給子故多病又忍以風霜冰雪錮吾子雖不仕進無損吾事宗黨親戚力勉使去猶屢遣介致佳米善藥不絶于道仲舉歸将之官餘姚竟以丁毋艱毀死岑自設科以来兄弟數人鄞黄彦實授之以學彦實故儒家子材髙而學邃嘗夜夢坐岑廳上氍毹四設尚周年最少前拜跪乃脫身所𬒳緑衣之覺而尚周至拜跪如夢彦實驚問尚周對曰士貴幸不墜先生所教彦實遂浩然不樂自撰悲誦一萹縦酒自恣卒不起尚周既任官黄巖大姓李肩輿甬道入尚周誰之曰是家隷鹽亭恒執持州縣短長後頗㢘得其私煎盗販過賕鬻獄䓁罪丹書之李憾復以鹽法隂中尚周家㑹尚周出廵郷部遽以食遇毒死嗚呼自始至終未及十年哭吾友二人盖幼而學壮或不及行或既行又且死不及究其所學予方幸此二人者能有所卓立乃沒沒焉若是枯茟硯費燈燭劬蕳編欲少覬榮寵扵當世爲何如也夫誄者哀死而累行者也我之哀矣又豈能自巳扵辭也㢤辭曰惟理之賦人禀其全惟氣之運人遭其偏誰謂我人不関扵天孩提之聲雖胡越之不間夀殀之數柰彭殤有不得而齊焉昔也昭佩清㓗鋪張華繡将似窮而實逹聿致汝扵顯覯今也收歛精彩沈埋槁壌抑似通而實塞終睽我之素奨嗚呼使多汝之材㳤汝之貌膺銀艾而大耀仰黄鯢而難老吾何敢爲此二人者慼不然使汝貌不揚汝材不良毋馳心扵魏闕僅屏跡扵東岡吾恐太㝠之間亦不得而汝嗇也秦淮之水赤城之山豈復有如昔之往還者乎赤城之山秦淮之水亦既忘其所以爲生死者矣尚何言㢤嗚呼餘杭史生哀辭諸暨方鈞子清每言餘杭史生之賢生名坦字履仲自童亂時􅒏敏而氣温遇書即善誦知義理及長學為文則又中充而外若不足必欲求其至焉然生今其死矣生本世家子當其先自敬思弘肇父子間三世有汗馬之勞用異姓䟽王爵至近世猶前後絡繹為王公者數人及故家喬木一壞扵朔風澒洞之餘故生自為撑植門户計不淂不力當其與子清友也居常矝以自持不妄言笑䖏衆侃侃有淂則相告有過則相規信乎其有益者也然生今其死矣盖予索居者乆嘗欲􅈬今求其人薄紛華嗜道義與之友則庶㡬乎古之絶學可復也若彼生者未死尚可得耶夫天之生物也不常是旣滋而息之矣遽反而𣪚焉故雖僅見其勾萌甲坼而不䆒其實此固子清言之未巳而悲輒随之者也予囙子清之所友又淂其所未友者可不悲乎乃從而著其辭茫茫兮堪輿静者誰噏兮動則或噓神媧立極兮老鼇㫁趺黄土肖靈兮壌蟲與俱清濁雜揉兮孰賢孰愚出生入死兮孰斡其樞嗟史生兮羙且都三十未有兮二十餘汝目光烱兮汝頷欲鬚汝衣汝冠兮張拱而趍古之世禄兮令則無汝守伊何兮家有其書王綱之正兮聖髄則腴擩嚌渾灝兮彂揚芬敷中則巳殖兮外不我誣苗而不秀兮汝非童烏天門開兮雲龍躣躣朝陽之爥兮鳳翽于梧文則記笏兮武或記殳學當其用兮不汝少湏用違其學兮謂鼎拄車前歌後哭兮淪胥以鋪世之人兮我其睽孤黎丘所呼兮我亦忘吾狂泉既㰱兮徧走而驅彼荑不稷兮匪歜曷𦵔夸毗是利兮嵬瑣相扶擿珠毀璧兮孰我瑕瑜嗟史生兮皦不汙世之恱兮我則吁雖曼爾脅子不易我臞一朝之短兮古人與徒超然以往兮溟涬之𥘉尭桀是非兮孰毁孰譽天荒地裂兮莽為丘墟烏鳶螻螘兮孰淂而踰北風吹人兮積霰冪塗誰欤户者兮我索其居汝友所悲兮我聞其粗我摛我辤兮曷奠其芻華盖之山兮列仙有儒望之不見兮從以乕貙嗚呼惜㢤兮獨踟蹰亡友趙生哀辭予友趙生良佐字子有宋安康郡王六世孫予少子有六歳嘗兄事之子有喜讀書善行草及鼔琴畫竹石為人不類其貌與人交必盡其情當酒酣或登山逺望慨然将有四海之志焉他人不識也子有未病弟良傅病已革遂為文以祭癘曰吾父老吾弟病若不救是遺老父憂幸避我乎祭巳軆㾕痒欲病既病而弟死後五日子有亦死且属其父歛我鶴􅌁衣髽角跣足道書一卷殉扵是年二十有八矣尚未娶此皆其可哀者也為之辭曰伊索居之侘傺兮出郭路乎何之飄風曶其折木兮挾澗水以增悲自童丱之相淂兮謂吾子之瓌竒短衣䄡其掩骭兮耿長劒之叅差諒先民之是若兮曽流俗之不汝知何舉世之無似兮復降年之若兹嗚呼哀㢤兮行道爲之悽惻淚雨下以霑纓兮面死灰而失色矧載形之如贅兮将反真而爲息疑有日之来歸兮邈窮天而可得紛後生之軰出兮務華藻而脩飾嗤沭㺅之文繡兮負小児之岐嶷争從俗以售名兮遂違古而非則何縦彼之不恚兮反奪君之甚力信造物之不仁兮汝父淂以爲仇夭汝弟其亦巳兮又使汝之不瘳唶夫人之有生兮惟賢智之是求何賢智之不憗兮不愚魯之能侔烱天星之易曙兮肅野莽之将秋殆自古之皆死兮䓁遺骸扵山丘恐尔化之有怛兮忍吾私而不哭逢陌上之花開兮見城南之草緑知異物之終歸兮恨千􅜠之不足庸救汝扵匍匐兮復吞聲而躑躅扵是歌而弔之曰未始有物何委蛇兮爾生爾死逢百罹兮脩短随化天何私兮彭鏗殤子世所疑兮羽衣髽跣黠且癡兮决癰潰􅪵仙可期兮睠言往昔我心之哀兮臨文嗟悼孰喻汝懐兮新安朱氏新注黄帝隂符經後序予聞隴西李筌嘗得黄帝隂符經讀之數千徧竟不能略通後遇驪山姥始章句觧釋盖甚怪矣自言神農氏衰蚩尤暴橫黄帝三年百戦而未及有功天命玄女教以兵機賜以九天六甲兵信之符皆出自天機合乎神智者筌又别著太白隂經閫外春秋以輔行其說強兵勝敵豈必務貫扵此經而後能然耶廣漢鄭山古曾語蜀黄承真蜀宫大火甲申乙酉則殺人無數我授汝秘術庶㡬少減扵殺伐幸汝詣朝堂陳之陳而不受汝當死泄天秘也巳而蜀王不聼而承真死孫光憲竊窺其書題曰黄帝隂符然與今経本寔不同不知此又何書也若乃筌務用兵而山古又欲務禁兵此果何耶夫老聃夲道家之祖而其書多寓扵術自其一心之静天旋地轉陽噓隂噏而世故之萬變者縦横錯竪恫疑禁格􅊖出扵其彀而莫能逃乎是也是故世之言兵者考諸道術流扵䜟記洞乎飛伏孤虚察夫龍乕鳥蛇此殆孫呉韓白韜略機謀之所尚者然非儒者之正論也新安朱安國當光尭南渡之際每咎當世用兵講武之失故注是経雖然天下之時勢日殊而兵難隃度苟取古人之糟粕而強謂我知兵是即趙括之不知變也自太祖始得天下太宗即懲五代藩鎮䟦扈之亂急扵偃武而脩文降及數世搢紳逢掖之士寖恥言兵兵日弱矣遂至故都淪䘮三鎮墮沒君臣捋相跳犇潰散夷夏盜賊蟠踞紏結卒使王業偏安扵山海﨑嶇之間不復自振此誠有可憾者然而撫摩疲民收合遺燼猶足以守此三百餘年之命脉而不遽至扵泯滅者豈在兵耶是故承桑氏以文事而衰有扈氏以武功而敗文武二途要皆可以亾國踣家而天下時勢之所在不以兵強而存不以兵寡而亾者抑可睹矣凡吾儒者之言兵夲以仁義言兵而深不欲以孫吴韓白韜略機㩁而言兵孟子請罷秦椘之兵則曰去利而懐仁羲荀卿論兵扵趙孝成王前則亦曰魏氏之技擊秦人之武力桓文之莭制咸不敵湯武之仁義是盖仁義云者實當世用兵講武之夲也雖使黄帝玄女誠有所謂隂符則上萹演道中萹演法下萹演術千變萬化出無入有要之亦不能有外乎此者又况李筌鄭山古道家狡獪之流耶惜乎安國儒者自有正論何獨用是而後為言兵者耶淵穎吴先生集卷之六
