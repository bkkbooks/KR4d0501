front:
  text: 淵穎吳先生集卷之四門人金華宋濂編
  hash: sha256:d3cd9de76dde673d091946463d23a029351b20c5c4bdc6df5430b24aee89cb43
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_004-1a}
body:
  text: 古屏上宮人戲嬰圗我愛古宮掖岧嶤凌碧空美人拂旦起殘月愁簾櫳小鬟捧香立飄作煙霧𪷟弄嬰偶一笑舞鶴遽來同新花正炫晝側手碎繁紅亦有雙蛺蝶踉蹡撲深叢豈其聖賢書行墨曾未通儼然𫀆笏具意氣早稱雄云胡歉汝內但取華厥躬塵凝孔鸞扇繡蹙鸚鵡籠紛紜爭旗鼓出入雜冠童凡諸戲玩物色色各論功太平忽巳久天地廽春風能群禮序鴈絶妬詩歌螽常嗟汝齒壯得不苦乃公却令十六院弗及少從戎心知一以痼鼻息徒長虹世故多變易家居果癡聾惜哉歲月老千里吹蒿蓬為撫腰下玦烏啼洛城東粵山白鵲陳彥理同賦粵山白鵲何毿毿今所驟見古所談滿地蓬蒿出復沒凡禽豈或同鳩䳺如何天然有此潔直以日浴無餘黔金精煉成向月窟縞夜飛過凌霜潭靈須駕河恍若一靜欲繞樹驚能三玉臼藍橋質巳蛻霓裳水殿神猶酣休徴不使畢弋得異羽未許樊籠諳􅒏耿終隨處士傳音和盍趂彌陀龕鴻鷹寒門但鄉北鷓鴣祼壤空思南晉人禽經此或載蕭氏瑞志吾將參情知太古至德世謂巢可俯􅑹可探投詩與君且一笑幸勿緇涅令渠慙夜聽楊元度説宣和內冥雜事北風吹庭柯秋士慘不恱頗懷炎德衰一旦幅貟裂當思付卑重但孕驕淫􅖈中宮日沈湎內伎增舞列聖人自鳴筝丞相齊按莭竒花入綱運法酒從流啜畫圗恍有見帷薄知甚藝辭寧廽波奏賦豈好色設君心既巳蕩國步驚欲蹶妖狐空獻顰幸鼠不塞穴坐令汴河冰變作燕塞雪玉鉉乃一震金甌可無缺由來治亂間一是興亡轍豐侯早著戒褒姒竟為厲乾坤獨不大甕盎相起滅于兹聞十愆得不仰前哲寄喻國輔張宜之手挾殘編只蠧塵山林著我最間身稿梧可據暝須熟華黍雖亡輔欲真危坐但看燈作暈逺遊還覺劍生鱗相思正是多風雨滄海無涯可問津檢故庋得故洪貴叔所書李鐵槍本末寄洪德器天地昔未一朔南遂分疆中原久喪亂白刃皎如霜李全本崛強手挾但鐵槍山東數十城叱作古戰場茫然即斷指設誓如刳羊一朝與旌節正面將假王云何引盜賊遽尓升堂隍豈其弱能立當彼驕則亡日落山海暗群龍血玄黃陳安偶從晉侯景徒禍梁于人欲使詐在國須謀長大福豈無妄佳兵終不祥誰令送死處竟以抱甲僵漢盤忽巳折周鼎那能常吁兹撫舊墨我涕徒為滂俯仰千古意悲風嘯枯桑讀漢武內傳寄戴仲遊我問學仙子神仙何所求翩然王毋使特降五城樓白雲起復滅丹掖戒涼秋黃麟雜赤乕旌幟欎蚴蟉上元三角髻聞命亦來遊玉女列左右容眸眄如流神光乃上爥衆樂彂空謳益易尚可化奢淫直難抽從知扶廣受或用柏梁收五嶽形巳祕靈飛籙仍幽毋將刳尓命但欲返諸柔一洗狐鳥爼長辭蟪蛄丘向時恍有見方士殊悠悠平準暴海內彂兵困遐陬琪花栖倒景瑤草隔玄洲終成泄道要寖使增愆尤鄙夫忽自笑穨俗奚其偷機關出鬼蜮利欲生螟蟊昆崘一萬里得去那能留為尓遣此什塵簮早須投同喻國輔題人溫日觀蒲萄佛者本西域蒲萄亦來西奈何此善畫無或渠所携我曾考其故𥘉與漢使偕上林乃有館蔥嶺何須梯天時自不同地氣忽以迷結子且磊磊懸藤更髙低先幾日巳露薄德不及稽終令白㲲像逺從雙狻猊從兹故國木伴尓禪家栖幽心恍有得爛墨研為泥宜哉一揮灑遽若無町畦依稀可少辨變作天投霓萬古空朔色南山竟朝躋畫工尚逸品遊戲徒筌蹄豈伊吾無人何往非耄倪豈伊吾無物桃李總成蹊此皆外所産敢與中州齊為爾撫此卷長歌欲驚嘶歲晚懷戴子夀就寄翁君授東南大海吹長波亂山幾疊堆嵯峨我所思兮欲如何戴子謂我不我過四眀學官列象犧書則稽古詩猗那六經聖髓工漸摩倉頡字林考隸科青燈挂壁豈有他黃虀苦澀餘醎鹺平湖沆瀣足芰荷目力可及彂詠歌慈溪先生雙鬢皤小出乃為禮所羅曲臺淹中却不頗擩嚌道真得者多先生昔曾舉漢科我亦同往超江河仰窺天門光可劘豁然叱落千丈坡就中乖龍卧為梭掀雲噴雹輸蛟鼉吕梁懸水無盤渦况肻遽數蟹與螺彼哉貧女凝秋蛾地窄袖短空傞傞郤鐘毁釡不必和靈談鬼嘯衆所呵北行何有塵沒靴南歸詎可夢駱駝一朝竟撤碼瑙珂獨立吾今衣薜蘿芝餐竹飲皆沉痾十載未復仍委蛇先生一再來揮戈坐將挾箸嘗其膰大松偃蹇徒髙歌小草樂育尚菁莪清廟梁柱可堊磨萬世學術從丘軻文風自振祛煩苛士論况辨仡與番分正句讀嗟吾訛丘園嵗暮猶婆娑明當沭髮陽之阿從公共飽天山禾更不去理墻頭莎浦陽舊有眀月泉久而不應今乃疏道其源似頗與弦望晦朔之間相為消長者遂作是詩大區何渾淪元氣乃潛泄忽然為山水無往不融結遙天偶一照􅌋地空餘冽盈將光共生涸與魄同滅玄機自消長至理誰圓缺彂揮雖有在窺測尚未決枯查曾幾棲斷洑遽中裂半倚嵐翠雲微通海潮雪昔人來推求于此淂表蕝虗亭奚其敞靜甃獨不囓歲年竟悠逺沙石漸填咽寧加疏瀹功肯使見聞褻恍疑合圗經環坐到稚耊倘非蟹投崎幾類鮒處轍纎纎浮晶彩湛湛浸寥泬舊觀方尓還真源可吾􅓟爭言彼月行豈為兹泉設蕭丘胡長寒漢井或再熱逝尋白兔公直探神龍穴狂歌水仙詞擊碎如意鐵吉祥寺一昔逢寒食行吟採物華風生𫾣檻竹雨濕墮船花曲塢青龍樹長灘白鷺沙回看江上水直去到吾家病齒我生本多病一瘦恆踽踽試問玉隴君何為忍吾苦自其初齔時排次巳不伍每聞編貝如方朔僅虗語信哉骨之餘所託車與輔舌神乃中居猶賴汝疆圉有身竟攻殘元氣徒啙窳母庸蠧斯蝕尚謂剛可吐尋常薄滋味勢不勞吞咀粗殽及硬餅錯列空七爼豈伊類門樞不動固先腐軟糜幸能餐梨栗稀復睹我思天地間民物揔胞與尓自本屬吾安能遽秦楚齟齬或更生華池仍彂乳當樅真我師為説養生主今年吾壯強三十逾六五更後三十年零落何足數起呼白驢公堇酒且酌取誰歟劉師服髙詠聊戲侮王滹南太山石室我將呼巨鰲滄海欲掀播于兹玉鼎淪遽使金甌破兵氛塞中原卦氣協大過誰封函谷關便掃太微座長矛左右盤徑矢五十箇歌鳳幾能來􅘳騾吾得莝當其一手麾豈止千夫和力須坼老拳事且居竒貨真儒雖有材用武竟無佐青雲飛遐心白羽灑寶唾撫時乃紛綸結客仍轗軻人生足窮通世故更弔賀熒然凍霧中仰見眀星大宜哉泰階平返汝雲壑卧専門尚吾醇致幣徒尓蓌既為梁鴻逃復厄龔勝餓從知大耄嗟肯以淫威挫抆淚且泣歧聞風猶起懦滹河自波濤石室今堀堁寥寥紓我哀苦語不成些樓光逺出示先賢圗像及漢季石本雜碑世人不好古我獨思古先居然圖像間得見古聖賢逺之或千載近亦數百年精神果何在面貌猶爾妍凡民一其生覆幬乃同天紛紜日就滅委棄隨烏鳶矧兹丹青筆巧類造化甄惟心却不死匪繪尚能􅌹豈伊祝畏壘仍似畫凌煙衣冠從代改爼豆與周旋前人後所哀後者復為前展轉哀未盡蒼茫但長川我今己後古古碣空餘鎸水石久欲泐蛟虯起相纏當風遽墮淚詎減峴山巔庶以名德在終為日星懸寄陳生落日未落山􅢋􅢋我所思兮抗嶄巖豈其徒行固不可亦有健馬可著銜胡然獨處不我即坐以魯史攻詀喃更疑弄茟彂古帖先漢廢碣求鎸劖于兹孰不我傾倒但或嗜好殊酸醎結交似子乃有得肯使繫屬非斿縿今年一出本浪戰滿地插棘疇能監􅎷盧大劍區冶鑄靈鬼夜泣蛟龍函早是鉊銛不我辨彎弧􅔄用窺熒攙縱尓竒文聚怪鷸政如絶力鞭神羬邯鄲道上尚故步我要我襋空餘攕母寧容刀與墨水柱使衆口相為讒秋風吹江晚正急薄暮徑去懸蒲帆自期共作制勝䇿酷類田父收盧㺥杏花一色直不逺繡線巧蹙行春衫黃精苗枯不足惜白木敢負吾長鑱嗟哉鹵莽又滅裂但有荑稗無人芟待教將投乃壷哨猶恐未陳即鼓儳參乎賜也必貫一曰啖曰陸俱通凡尋常可力自不力不畏天顯兼民嵓子來不來我亦别深裊深處多松檆臨萹草草遽報我愁思滿臆何庸緘寄相仲積求觀鄭北山雪竹賦并畫卷古人不可作雪竹有竒思鄭公詠騷詞或者攻繪事向來拈筆間才士巧相值誰從嵗寒窺便得瑚璉器東國正擾攘靖康更元二上天忽同雲大地惟朔吹玄隂知巳凝積羽忍不墜狂曾鵝炙求困及蟻漿饋離眀乃煌煌徑莭特一致秦關收甲兵蜀閫擁旗幟每疑一寸心長挺千畞翠學行尚吾時窮達等墨戲相君本彌甥年耄常拭眥自應守遺文重襲在篋笥滿山蒼竹林凡木總憔悴因之寄君詩為灑懷古淚西域種羊皮書褥歌寄李仲羽波斯谷中神夜語波斯牧羊供雜虜當道剚刀羊可食土城留種羊胚骨四圍築垣聞杵聲羊子還從脛骨生青草叢抽臍未斷馬蹄踣鐡繞垣行羊子跳踉却在草鼠王如拳不同老飫肉筵開塞饌肥裁皮祳作書林寶南州俠客遇西人昔得手褥今無倫君不見冰蠶之錦欲盈尺康洽年來貧不貧同方子清觀𬋩子內業之人東鄰居為彂架上齒吁嗟管夷吾遺我以內業古書本少見古道終不跲遺文久灰燼瑣語特枝葉為儒每更端務學多涉獵逺馳盍求心近眩將失睫紛綸諸子間變亂聖王法百家各為主一理寧足攝彼哉所施教何得不我協士鄉自冝然伯政吾甚捷當其解而囚豈謂射中脅利源魚鹽開兵武劍戟接私疑聃莊言或混孔孟牒鬼神通幽奧詩禮借光曄操存􅒏情常食飲精氣浹于焉核天人不獨滕齒頰楊朱説力命列子亦巳雜管氏役權謀聖門詎容躐茫茫大江流可望不可楫朝來有微雲却倚青岌嶪陳彥理有漢一字石經云是王魏公家故物豫得其六紙蓋石文剝落者太半紙尾猶存蔡雍馬日磾字先聖去巳久世傳惟六籍後儒各専門穿鑿多變易蔡雍在季漢章句攻指擲八分自為書刋定乃勒石太學諸老生講論頗充斥逺方競來觀摹倣無不獲東亰忽喪亂盜賊恣跳躑古碑四十六兵火空餘迹熹平𩔶正始洛土重求索衛侯師邯鄲三體精茟畫煌然立其西學者常嘖嘖史書竟差舛一字幾不覿北都如遷鼎西國類藏璧砥柱或淪亡隨宫猶作磶于兹特隸科早巳等瓦礫寧知一字遺不與中郎隔唐人試書學小學彂光賾魏公蓄紙本六𥿄忍捐釋糢糊千莓苔紏結萬􅔼蜴聖文空往燼聖髓尚餘瀝粵從秦以來儒術經五厄到今厄者幾日月愈輝赫甚哉石為經爭似經在壁此石不獨存吾心竟誰惕和陶淵眀詠貧士長吟望天地宛轉無所依豈不有達者窮櫩少光輝此心未能信何力求奮飛生雖百夫特死共一貉歸行尋靈芝草不救歲晚飢去矣甔石竭焉知溝壑悲大道忽巳喪翻然念羲軒今我去之久十年躬灌園存者耿日月餘如飄風煙身名易汨沒文字勤磨研磨研何所事先覺有遺言楊朱談力命列子亦稱賢山日凄以夕起彈緑綺琴清哉積雪曲自昔無知音世間紛且擾貧與憊相尋春江變作酒野鳥令人斟敝衣時所棄華駟衆爭欽不有丈夫氣徒為行路心上天無停曜日月會降婁山林少過轍二鳥鳴相酬亦有五采鳯飛來為岐周姬公世不作白屋多懷憂逢時倘一用華士非吾儔函谷空逐客傅巖乃旁求人生自沉靜豈得非意干宜哉揚執戟三丗不徙官窮冬無完褐盡日止一餐美芹終不獻晨曝尚餘寒手種老松樹蒼然霜雪顔政尓有佳思清風吾掩關舉世尚馳騖飄如風中蓬上書爭眩鬻言語自稱工誰歟持清莭乃見楚兩龔黃塵隨手掃白月與心同有榮方覺辱無屈豈求通誓追遼海鶴插翅以相從少小負竒志常思觀九州垂成捨冠冕去結巢許儔朝餐秋柏實夕漱醴泉流長貧士之常獨往非我憂求馬但得骨尚能千金酬日望芳草長毋煩怨靈修望會稽山自我行至越因之成越吟會稽乃巨鎮雄拔天東南東南誰開闢大禹世所欽外夷鳥嶼接支子祧廟臨磬鞀或聲諌欙橇惟力任收功黃能化畫道應龍深衣冠千年窆玉帛萬國沉荒煙􅌹車骨落日望狩心盛德蔑以過遺祠尚兹歆渤澥斂餘漲蒼梧分逺隂前迎蓮花渚後擁竹箭林猶廽剡曲棹肯鼓玉門琴秦皇舊時輦散亂何可尋欲去不忍去追逰更耒今次定海候濤山悲歌忽無奈天海何渺茫放舟桃花渡回首不可量南條山斷脈北界水畫疆居然清泠淵枕彼黃芽岡朝滲日星黑夜凄金碧光蹲乕巖掎伏鬪雞石乖張磨礱越湛盧蕩汨吳餘皇幽波視若畒巨壑深扶桑招徠或外域貿易業兹鄉嗢咿燕國語傎倒龍文裳方物抽所寶水犀警非常驅鰌作旗幟駕鱉為橋梁似豫萬里眼徒倚千尺檣稍疑􅒏命輕終覺意氣強寄言漆國叟此去真望洋便携學仙子被髮窮大荒登岸泊道隆觀觀有金人闖海時斫桂刀迹因聽客話蓬萊山𬗋霞洞我舟半夜彂舉目流滔滔倐然風萬里誰謂水一篙幽島不可辨亂嶕出如鰲侵晨始登岸身靜心實勞小徑連沮洳玄扃閟蓬蒿彈塗爭走穴傑步擁朱􅚺怪花絡璀璨隂木森蕭騷東都昔奔潰南海紛戰艘簷楹偶潛伏部伍爭遁逃將施攻城火尚見斫柱刀黃屋祛曉祲翠華濕秋濤運往龍蛻久人來鶴飛髙曲戀迷丹鼎清沼燭鬢毛毋煩踞龜殼自此辭盧敖起行海東洲重險忽巳渡由來産神竒政為孤絶故幽芳岝㟯搜修蟄髙嶅赴荒煙凄暗潮旭日照晴樹似聞蓬萊山去此特跬步蟠根迄中立彂乳森外護𬗋氛蒸作霞玄浪激為霧古穴通若輿靈文讀不句赤玉舄者誰黃金闕何處常疑方士説未省仙子遇芝草空漢廷鯨魚壓秦路彼猶莫能得今我獨何據馮夷開水宮禦寇控風馭從渠指虗無此計恐遲暮次韻姚思得日豫北渡黃河淵春秋大法孰敢姦讀書未成復學劒徑去有若脫兔然少年結束多紈綺酒酣擊築忘宮徴浩歌揮淚望諸墳千載玉龍吟不死中州小立交遊絶夢落蓬萊天海闊乖螭倚石氣猶雲老蚌凌波光亦月逢人浪説文字場久矣相馬悲驪黃薛劦紉衣白谷裏蒹葭拂棹滄洲旁荒塵滿眼誰知已子獨來看能屣倚試裁五色絺繪紋機杼無聲幾寒女涼風雕鶚髙復髙力掃培塿增岧嶤仙槎一往劃河漢肯踏人間金背鼇夕泛海東尋梅岑山觀音大士洞遂登盤陀石望日出處及東霍山回過翁浦問徐偃王舊城山月出天末水風生晚寒扁舟劃然往萬項相渺漫星河白搖撼島嶼青屈盤逺應壷嶠接深巳雲蘿吞蟠木繫豫纜扶桑纓我冠寸心役兩目少試鯨魚竿起尋千步沙穹石塞行路怒濤所摐擊徒以頑險故卓哉梅子真與世良不遇上書空雪衣燒藥乃煙樹玄螭時側行縞鶴一廽顧從之招羡門滄海晝多霧茫茫瀛海間海岸此孤絶飛泉亂垂纓險洞森削鐡天香固遙聞梵相俄一瞥魚龍互圍繞仙鬼驚變滅舟航來旅遊鐘磬聚禪恱笑撚小白花秋潮落如雪長嘯山石裂我今在東溟遊目出重徼搴衣窮絶陘竒氛抱珥赤逺影摩空青想像暘谷水俳佪爥龍形晨昏相經絡稚耋不得寧豈若柯斧爛看棊了千齡遙觀杳無極宛與東霍鄰悲夫童男女去作魚鱉民紵嶼尚餘聚蓬山寧尓神古棹苔駐迹仙枰竹祛塵短褐徒為拂飛槎邈難親好携支機石去躍織女津笑揮百川流東赴無􅔄壑青天分極邉白浪屹為郭卉裳或時來椎髻亦不惡投珠鮫人泣淬劒龍子愕海宮眩鱗纕商舶豐貝錯盍不呼臣鵬因風泝寥廓老篙廽我舟沙􅓝晚煙起蒼茫魚鹽場寂𩔶鼓吹里人民悲舊主嵗月祀遺趾終損玉几研不救朱弓矢東西八駿馬今古萬螻蟻此事如或然須湔會稽水我行半天下始到東海隅水落嶕石出中飛兩鵜鶘情知瓌竒産勢與險阻俱在夷豈必陋雖聖猶乘桴吭風丹穴鳯尾雨青丘狐幸隨任公子不愧七尺軀𥘉海食乍秋冒重險增我愁恨端故人喜我來為我具杯盤盤中何所有海族紛攢攢盲風吹衣慘蛋雨灑席寒春魚白如刀小棹凌碧湍淡菜類山結巨钁就石剜水毋或潮捲蝤蛑乃泥蟠蛟鼉惜不得况間龜與黿其餘亦瑣碎充此一日歡洗濯煙瘴氣磨礱沙淤瘢非歟嗜土炭否則殊醎酸珍須壓豚臠異且輕馬肝褻味分罩網腥涎雜瓢簞奈何齊魯邦徒設邾莒餐對之輒棄置誰謂吾腹寬川澤禮當爾勿云行路難望馬秦桃花諸山問安期生隱處此去何可極中心忽傷悲亂山插滄海千疊壯且竒信哉神仙宅而養雲霧姿錭鎪鬼斧觖刮濯龍湫移坎窞森立劍槎牙割靈旗微涵赤岸水暗産瓊田芝老生今安在方士不我欺經過燕齊靡出沒椘漢危挾山作書鎮分海為硯池殘花錦石爛淡墨珠巗披東溟地涵蓄北極天斡維玉舄投巳逺桑田變難期誓追凌波步行折拂日枝羽丘杳如蘿玄圃深更疑豈無抱朴子去我乃若遺空餘煉藥鼎尚有樵人知次髙橋觀張循王戰處日落見煙火江流秋漸清髙橋足舟楫小浦連茭菁尚聞父老語前此盜縱橫悲心北嶽狩灑淚南海征疲民挈衣避義士嚼血爭呌囂無人境墮突七十城磨楯掃急檄擊銅持短兵病巡魚麗陳窮涓伏弩營水犀怒且武風鶴遙傳聲彂揮鐃鼓曲申畫帶礪盟文石班不紊黃金鼎重撑漢儀整以暇唐室尤光晶搜箭巳林剃泊帆仍陸行舊廟凋細栁新田滿香粳豺狼久息鬪罔兩空餘驚竒哉第一戰永激萬古情還舍後人來問海上事詩以答之去家才五旬恍若度一歲豈不道路艱周流東海㵝故人喜我返來問海何如所經何城邑相去幾里餘我言始戒塗尚在越西鄙隨波到勾章滿目但積水人云古翁洲遙隔水中央一夜三百里猛風吹倒檣𥘉從蛟門入極是險與惡白浪髙于山神龍曶以躍似雪復非雪倚檣欲上看舟子禁不可使入舟中蟠尋常重􅒏命今特類兒戲信哉昌黎言有海無天地掀掀終達岸鹽鹵間黃蘆人煙寄鳥嶼官府猶村墟水族紛異嗜魚蟹及螊􅒹我寧不忍餐救爾相吐沫荒塵栖豫髮旭日照我身似聞六國港東壓扶桑津或稱列仙居去此亦不逺蟠木秋更花蓬萊闢真館我非不願往此險何可當天吳布牙瓜出沒黑水洋于竒豈易得似足直一死方去徒自驚既歸亦云喜珍重故人言勿以險為竒兹行巳僥幸慎勿疾平夷雖然此異鄉固是難久客聖出風且恬時清海如席我猶愛其然恨不少淹留尓毋為我懼遭此千丈虬試看塵世間甚彼大瀛海衣裳日沉溺篙櫓相奔潰奔潰孰能救沉溺將奈何口呿舌不下聊為故人歌夜讀魏伯陽參同契大道如大鎛人誰撞寸莛竒音一以振俗耳焉能聆伯陽崛且異真契垂光熒文詞信博贍緯候兼通靈收功水火鼎泄祕龍乕經元象既自育化機那得停金砂漸合質玉液𥘉流形鴻𪷟鑿臣竅太一臨玄扃易繫夲覆謬關睢仍丁寧孔子或尸假文王猶夢齡庶聖雖不語神仙豈徒冥下愚等蠕動塵骨多羶腥彼殊不我即異學遂蝗螟夜寐恍一接晝思轉拘囹八石搜燥烈胡麻擷芳馨漢祀窮五畤秦遊俯滄溟非麟尚絆足類鳯甘笯翎似此期不死哀哉幾時醒鄙夫亦素隱妙語思黃庭勿為兩髙苐傎倒迷日星俳佪化鶴柱想像屠牛硎伏苓儻可煮笑倚長松青去歲留杭德興傅子建夢得句云黿鼉滄海賦龍馬赤文書間以語豫及其鄉人董與幾山空歲晚恍然有懷為續此詩却寄董觸目懷招隱興歌託遂初俗塵多汨沒天籟幾吹噓晚景翻濛汜秋潮泄尾閭祥雲旗鳯鳥瘴雨弩鯨魚灑淚鮫人室漂魂建木墟黿鼉滄海賦龍馬赤文書上谷空豪舉西河久索居蠻琛遺翡翠魯價掩璠璵逺矣鳴􅐴箭悠哉薄笨車影搖青薜荔光璨白芙蕖自昔攻占畢于今載耒鋤彈冠身有待鑄硯志非虗蘇子從橫術韓生內外儲乾坤瞻魏闕日月夢周廬炫耀螭雕珮蹁蹮隼建旟裂衣騰朔漠膠棹入黃淤趙女絃鴻鵠奚兒駕駏驉詞林應聘汝俠窟肯愁豫結騎幽并窄掄交楚越踈竒功生鼎鼐猛氣死蘧除藥物金鵝採兵鈐赤鯉漁中條分雍豫四序出堪輿小榻琴心展長纓劒瞻舒按圗稽獬豸􅜠酒笑鶢鶋野屐偏求蠟山巾尚著綀貧猶思祿仕老不廢耕畬卓踔才終用猖狂習未除文章同一默歲月或三餘策竹登玄圃然藜問石渠㝎須追樂毅端為謝曺蜍得杭州書聞虞紹宗新為文學掾歸建安起紓千里懷雲物轉寥邈想像閩橋間虞生實超卓自云後雍公光彩動南朔昔曾郎孝廉今乃掾文學私悲窘時命念欲從先覺詞章竟韜晦意氣終堅確栽培信梁柱剪截徒楹桷凖繩縱不頗斤斧虗加斫大將比伊周小或希管樂母然櫟社散亦勿牛山濯猶思浪奔走豈料俱屯剝搜林拔鳯毛掠野㓟麟角舂撞航大河犖崅屐喬嶽麻衣半塵土綵筆紛電雹駿馬恆苦飢蛾眉復謡諑心迷燕士金淚盡椘臣璞彼賢猶簞瓢雖聖且獵較長疑返舊隱稍見蒙新渥泰壇禮尊彞清廟歌籥簫行乘德輝下遽忍雞鶩啄貧居豫薜蘿友道尓蘭藥青燈供􅓎悠白屋許敦朴才踈世不用達者譏數數有暇姑治田相看在帷幄杜鵑行南山北山啼杜鵑杜鵑花彂山欲然千枝萬朵惜未得中有一抹巴陵煙休説銅梁并玉壘搖蕩春光餘淚水五丁鑿路少人行石鏡生塵妖骨死東風青鳥來何處中宫移植銷魂樹不如歸去便歸家誰其友者楊州花題韓蘄王湖上騎驢圗秋風泗水沉周鼎淚濕吳天荆棘冷黃河北岸旌莭回信誓如城打不開沿邉撤備無人守蟣蝨塵埃生甲胄散盡千兵只童騎餐來斗飯空壼酒西湖楊栁煙波寒照見從前刀劍瘢宮中孰與論頗牧塞上寧知無范韓事去英雄甘老死此手猶能為公起勸人莫問故將軍身是清涼一居士夢巗南老人文章餘耿光耆舊日僵卧晝思見其人夜夢如識路恍惚疑尚存蒼茫杳難據青山真隱淪縞髮老韋素修名可千年狹世空旦暮何哉白玉理肻有黃金鑄從知蕭散姿巳是神仙具閶闔摩日月蓬萊拂雲霧玄鶴來頡頏赤虬下馳騖車輿清泠風糧食沆瀣露憐豫此流落愛我終遊豫云胡縈苦心曷不縱遐步巖香返梅魂嶺物輸桂蠧鏗其弄琴書儼若陪杖屨凄涼枳棘叢寂𩔶芭樵樹我淚無處傾荒江自東注山中人白日出復沒胡獨勞我生所務在卒歲朝夕強營營當春治農器土脈亦疸盈薄言藝黍稷庶以觀其成涼風一披拂場圃如丘亰凍户猶畞首康衢或歌聲于兹尚不給野有菜色氓毋寧拾橡栗起視床頭瓶貧賤素所有豈辭􅉝與勤清晨腰我斧往伐西山薪髙巖屹巨壑蛇乕氣逼人衣裳既不完出入在荆榛日日一接淅釜甑恆生塵白石幾時爛青煙空滿鄰家徒四立壁冬令方行春亦有偓佺子修然為世珍歲晚筋力倦長歌守窮廬塵函散縹帙且復少囁嚅文章信小技世故交相驅撥書置床上我豈為蠧魚自從童習之白首愈紛如卓彼先聖人欲開後世愚文繡豈不佳輿臺同一軀但當樂道義肻恤吾身癯去經十數里霜露凄枯田簑笠既桂壁桔槹亦倚垣相從盡鄰曲言笑仍喧喧惟此老瓦盆酒漿稍羅前奈何不解飲而喜鯨吸川有如善泅人觀者乃在船寸心久巳醉雙眼方醒然世俗正馳騖悲哉東西阡仙華巖麓尋釋子若空不遇仙華山髙髙岌峩峭壁攢峰飛欲墮之人辟世此結廬林末蕭然見煙火來穿線路一何危擁出蓮宮兹亦夥青蘚生階本不芟白雲著户元無鎖麋􅎷能遊侣豈非鷦鷯易足巢應可泉經臣石沼分聲花亞修篁簷映朵屈伏心機入幽險安排位置歸平妥私鄰海鶴相頡頏竟類春𧖟自纒褁鄙夫多病每栖遲奔走十年增坎坷徒思一枕學吐納甚似同川譏袒裸𬗋芝舊曲歌尚憤黃獨長鑱種仍惰功名欲達擬烹鮮道路雖遙寧駟跛晚彩凝霞谷倚筠朝光出日潮移柁信哉神仙最踈曠悲矣習俗真叢脞當今大隱招巳久或者玄居到還頗云胡虗室却栖塵矧肻縱談能炙輠紏結蛇蛟翠走根熒煌火齊香懸果假饒人境不相關題破芭蕉知有我畫馬行􅋽秋八月霜皓皓白鴈驚飛散蓬葆川原蓄牧萬馬來揚鬛攢蹄齕枯草漁陽突騎自有真奚官翦拭傾城闉素絲結轡美無價繡罽披韉驕向人當塗奮擲森崛壯一旦紛騰入天仗父老東城接鬪雞胡兒內苑隨調象煌煌亰洛鳴和鈴奔走萬里如流星筋力追風烏鵲厲精神噴霧蛟龍冥往年踴躍將一􅘳寂寞而今空見畫黃金鑄式猶峥嶸多少地上騏驎行秋夜效梁蕳文宫體無奈涼夜永起登樓上頭鵲翻金殿宿螢近玉階流梧桐老兼恨芙蓉新蕊愁婕妤團扇上那得不驚秋曾是昔年寵如今誰與同秋獵長楊苑夜幸猗蘭宮瓊杯香泫露翠袖薄禁風將心與眀月流入君帷中栁博士自太常出提舉江西儒學來訪宿山中一掃空山􅎷豕蹤車如流水馬如龍黃麾法仗知宸輦青史勳名問景鐘宣室受釐端有召曲臺傳禮尚為容少年作賦將投獻東北孤雲是岱宗尚有歐曾舊典刑森然人物照青冥身從北闕攀燕桂夢壓西江食楚萍萬里毳𫀆春值雪千年龍劍夜占星此身恨不輕簦笈的的根源在一經送俞子琦赴鄱陽却寄董與幾髙駿良李仲羽昔豫泊亰都逆旅無所館栁侯教國子子實同里閈洎君中外􅊚辛苦託螢案聊希邯鄲步共灑臨淄汗北風吹老榆青莢落零亂流來金水河一派春波渙上林始罷獵萬姓方縱觀畫車挾緹騎衝突何可算故人我董生曾是秋闈冠相携髙李徒往往妙辭翰當場許英俊與國峙楨幹雍容講都俞潔淨稽象彖心懷有道徴迹逐交遊散豈非泛駕材中路乃羈絆去矣江上居蒹葭渺無岸幸君捧省檄而此蒞侯頖尚應念爾祖文采殊煥爛儒科既褒然閣職仍宣贊直將逺猶告慎勿細娛玩焉能尊瓦缶反不用圭瓉卓彼九臯鶴長鳴知夜半毰毸吾羽毛踴躍在雲漢桞慱士出示太原欎金江陵三脊茅汝寧蓍草桞侯往亰國十載却歸沐自言守奉常朝夕近黃屋乾包暨坤涵上下俱滲漉從知敬神人豈止蕃草木欎鬯本晉産始祼巳芬馥菁茅楚所貢既奠酒以縮靈蓍上蔡來五十備一束九疇乃稽疑𥘉筮曽不瀆恭惟當寧聖永錫中國福廟堂有垂紳邉境無折鏃禮經官並舉宗祀物眥足陟降儼如在馨香薦惟肅夏后列包匭周家用圭玉方修四時祭㝎取柔日卜八佾陳羽籥鸞刀割騂犢郊丘遞云講柴望隨可復幸兹敦孝理久則變風俗似渠不世見焜耀驚我目旑那特不墜綿蕞何煩録太平此其符有暇彂汝櫝江南曲寄周公甫東風吹人千萬里青蘋花彂前湖水江南女子木蘭舟却採蘋花泛流水水流花彂春光好失時不採花應老年少吳儂歌懊惱白晳容顔半枯稿倐然來矣雙彩鳬化作汝舄穿雲衢汝珮復解江妃珠龍宮蛟室本不隔相期更有瀟湘客鞦韆行寄趙季良時趙留京邑亰城寒食來沽酒城北城南映楊栁人家歡笑踏鞦韆杏板絲繩相對懸宮錦翻衣真富貴俗軀走肉盡神仙俳徊宛轉當風立春晚多風吹汝急鞦韆巳墜蹴踘空華鏕翠鞁擁青驄軒轅臺前日月近無終國裏山川同逺方羈旅紛馳逐燕趙佳人美如玉燕歌趙舞歡未足去年芳草今年緑讀諸子嗟嗟父后師下及周公政豈待戰無為戎衣天下定鬻子何年守藏吏默默與道居玄牝儻不死青牛空著書老子大道終自然王家始多難益人不在賢卜鼎年巳半文子不仁為人害仁反愁我身毋為小堯舜有愧猖狂民亢倉子不忘中帶鈎解縛堂阜下徒知領一鄉劍戟試狗馬管子徒聞處士議未有救時功為賢倘不尚淪沒草萊中慎子同異既莫辨堅白何由分徒將臧三耳驚倒平原君公孫龍子真夢夲非夢萬事蕉下􅎷力命每相持御風身乃足列子其書雖瓌瑋其言乃參差自齒百家學仲尼何可欺莊子用兵捷如神四國莫豫侮宮中斬愛姬取勝在柏舉孫子勒兵既有令處戰豈無權事功不見世徒説尉秦年尉繚子儒服説兵機愛兵如愛子能勸魏侯德終隨楚王死吳子人仁國無功人勇國無法名實兩俱存何從操賞罰尹文子莭用禮益奢非攻戰愈多堯舜病博施其如兼愛何墨子隂陽或為災天地豈無􅌋身殺道不行竹刑果何有鄧析子稷下三祭酒蘭陵陳詭詩剛道人􅒏惡坑儒將自兹荀子小夫太多端秦法日巳變咄哉文武都在德不在戰商子羈臣用密策身死不得保意將取邯鄲宗國巳如掃韓非子子思言仁義不愧素王孫王風委戰國賴有壁書存孔叢子淮南招九流好道不能一空讀方士書寧知左官律淮南子法言準論語三世不徙官草玄固自好美新良獨難揚子三光正分裂世士有不遇雖通百家言尚著六合賦劉子續書不到秦元經猶數魏徒操虞氏琴孰識河汾意文中子瑣微論之妙欷歔哀之深五代干戈際千年鄒魯心聱隅子荔枝行寄王善父炎雲六月光陸離人在閩南餐荔枝荔支日餐三百顆紅緑亞林欺衆果絳羅繫樹蠟封􅺓尚食擎盤獻青瑣涪州歲貢與此同意欲移根耒漢宮天生尤物不用世沾灑蛋雨吹蠻風蠻風蛋雨振林藪西域蒲萄秋壓酒勸君莫近楊太真傳説驪山塵汙人眀月行寄傅嘉父上天有眀月來自滄海東蠻潮夜捲馮夷宮海門一線驚欲射江面樓臺聳千尺冰岸雪崖屹不動水犀組練皆勍敵越人善泅技巳癢明月光中吾得賞飛來白鶴晉清角跳出長魚漢踈網北風吹起蘆花秋笑撫錢王鐵箭頭襆衣枕斧此何處烏鵲無枝空繞樹寄張子長世豈無推挽人誰有典刑稍懷南國彥恆愧北山靈萬里麻衣敝千年竹簡青羲文先索象魯頌或歌駉𣏌􅎚儒林挺魚龍俠窟鯹塵埃完結緑粉黛飾娉婷脫略蘇張穽漸摩管樂硎道途餘雪屫巗穴但雲扃本擬陳三策吁嗟守一經迹卑淪燕雀迹逺及猱㹶種菊行荒援看松俯絶陘仙棋間度日旅劒懶占星故里青桐巷雙溪白鷺汀交遊多握手歲月此忘形志氣需來哲才華壓妙齡秦坑收末燼漢粕浸竒馨正器陳籩豆􅌹門識鼎鉶奔騰鞭用駿袒禓割分腥卓立撑喬嶽孤流混濁涇鵲飛持或布鯨吼扣非莛别𬒮逢秋怯鄰燈入夜熒沉沉猶在野憲憲欲揚廷舜殿瞻儀鳯堯階數曆蓂螭拗文錦褥獸闥𬗋金釘列徼環霄漢遊車彂震霆紬書官命史吹律樂求伶迅奮君須􅔡栖遲我未寧簷風欹警枕井雨泣羸瓶古陌垂楊栁空山老伏苓只今馳尺楮何所問南溟二月六日雨書都城舊事燕南趙北吹黃塵九天宮闕生𬗋雲十二門開衢路直畫輪驄馬多行客歲寒殿外栁才青金水河邉冰尚白雞人傳漏放曉朝文石分斑押百僚南陽近親最舞蹈亰兆耆舊爭歌謡教坊供奉飾玉女鐘能鐘聲鼓能鼓錦來西蜀𬒳玄駝肉出太官飱猛乕𥘉日扶桑稍照人內筵錫燕杏花春沭犢騂牲泰畤祀鸞旗翠蓋驪山巡東風萬里飄寒雨我昔所聞今不睹怏然呼酒擊酒壼茂陵徐生曾上書姑蘇臺歌寄方養心姑蘇臺南閶闔開姑蘇臺北鴻鴈來春花秋月幾時好步􅓏尋香去如掃冤胥憤血空海潮老濞妖粧又煙草少年為客誰我令千里汝猶談一經黃龍挾舟夜有兩白乕司劍天無星山中昌蒲十二莭未肻落盡青頭髮姑蘇臺上愁殺人身在勾吳望勾越遣兒諤初􅈬學起攀青桂枝髙蹈素所仰嘗言天下事𩔶𩔶指諸掌滄海杳無波泰階真有象􅉝勤餘十年盍不愧吾黨童髫尚豫曾稚齒巳在襁儒術云世傳聖功要蒙養豐芭務詒謀宋苗寧揠長逺遊且今非多學肻汝強薜蘿衣相結沙石劒可磢于心苟深造舉世獨不賞薰風昨夜至韶樂鏘遺響邈然懷古人我豈久榛莽觀梁四公記竒士自古有我聞梁四公來從何處所遂到大江東舉朝無留難當扆亦動容胸襟狹海嶽舌頰翻雷風彂揮衆女國充拓扶桑宫巨鶩産駿逸靈貂披蒙茸非歟沉淵鼎或者射日弓至人倘可遇天地那能窮孔姬著禮法嬴漢流橫縱淫辭一以詖幻術紛如蜂齊人頗志怪晉室餘談空豈其羈狂猘猶謂得象龍洞冥久不作神異將無同咄哉衆耳目千載多肓聾書宗蕳忠公家傳及部曲記勢極崇必圯天方獵元元兵甲暴草野大河為塞垣猗歟我宗公往作汴北門蕃戎斜曳戟盜賊望風奔老羆尚當道力攫氣欲吞四顧萬騎集中嚴一旗尊吳越僻且遐梁宋仍垕完逝廽龍頭幰身屬豹尾鞬周鼎沒未獲魯戈揮轉昏居巢有死憤駱谷無留屯一二遺部曲東南却軒騫猶撑半天下少救千丈渾雞鳴夜舞劒邈矣逖與琨于兹讀公傳義士古所敦瓊花引重寄方養心揚州瓊花天下無揚州眀月照江都青鸞縞鳯何翅翅神仙司花不委地瑤宫玉色空彩侍十里珠簾揾春淚東風半夜吹城郭梁宋山川一盤礴冰懸雪積不改柯二十四橋餘水波揚州瓊花人不睹揚州眀月來無所世上繁華我不知揚州芍藥猶傳譜哭妙觀上人試續髙僧傳之人又寂寥降婁星野近印度雪山遙頗憶連床夜相逢輔衲朝名詮披梵庋妙趣挹詩瓢鹿苑千年振龍宫一念超舐斷看上界收涕隱南條玉麈懸青壁金環攪素潮松花香雨熟柏子縷煙消入觀占流注持齋洗血縈慧刀中寶劒禪樂裏雲韶日月蓮珠轉塵埃㲲像飄交參秦嶺屐夢壓楚江橈策竹曾幽石煎茶或墮樵病從天海窄愁向歲寒凋古澗猶泉水荒園但藥苗黔婁衾不足靈運笠空挑土淨隨心淂池灰付劫燒斷磚開士塔飛瀑應真橋巳矣成長往悲哉擬大招向來吟息處秋氣日蕭蕭婁約禪師玻璃瓶子歌秋晚寄一公玻璃瓶子西國來顔色紺碧量容杯老婁禪師澡身處秋水浸空菱葉開大身無邊小無礙天地山河等塵壒收藏霹靂歸沈寥束縛蛟龍作澎湃浮屠善幻夲犂靬同泰佞佛多衣冠壼公樓宇猶魂夢媚兒綱運絶胝瘢北山杉槽定湢室梁皇肉眼徒屈膝松花玉露洗還香柏子金煙熏欲漆靈璨閣前逢一師手親傳玩到今疑尚針膏肓起廢疾稽首乞師楊栁枝昭華琯歌咸陽宮昭華琯白玉琢成三尺短美人南國遙輦來齊謳趙瑟巧盤廽洞房更衣待月上音伎逐色穿雲開天光搖地勢動山林冥海水湧奔騰萬騎壓城破錯愕雙矛鏖敵悚臨洮舉杵送役夫碣石挾弩射鯨魚泗亭夜行老嫗泣蘄澤秋戍妖狐呼一吹吹向樂中變再吹吹作寰內戰天教漢祖見還驚可惜秦皇驚不見豈伊伶倫嶰谷法鳯鳴莭莭足足久無聲豈伊後庭伴侣戒亡國璧月瓊枝樂不淂自時厥後日淫荒立部坐部陳絲簧花奴羯鼓打漁陽祿山舞馬登舞床昭華吹秦不吹唐嗚呼昭華落何鄉宋沇尚及萬寶常何如聽風聼水奏伊涼悔不去問龜兹王古俠客行長安天闕制九州河北列鎮類諸侯私劍縱橫常滿路錦𫀆結束耀珠韝初月三更動千里紅線女郎勝男子金合書名斗柄髙繡幃𬒳髮心神死使臣單騎急叩城唇齒兩河休用兵帳前盜賊在鄰道陴外旌旗無硬營浩歌置酒紅線去夜義飛天渺何處昔日驕鶯曉雨花今朝脫兔秋風樹當筵一笑却生塵纍賜千金豈顧身磨勒踏垣熬犬伏水精縋海蟄龍嗔世上出沒幾紅線纎夫細兒徒股戰不盡英雄草澤間教人恨殺虬鬚傳觀唐昭陵六駿石像圖汾陽帝子天下雄起乘六駿即六龍掃除關河玉腕雪芟刈隴坂花鬛風長安渭水開前殿梟摧獍殄聞酣戰芻料登槽徹鼓鉦陳瘢著體傳弓箭人馬驍矜一代豪治功底定聖躬勞羽林旌旗曉色靜沙苑監牧秋雲髙磊磈拳毛􅚷奔騰特勒驃武周金剛驚走趠熒煌颯雲𬗋錯愕什伐赤建德世充愁辟易最好青騅骨相殊魁竒更淂白蹄烏千官盡堋山溝域萬騎齊瘖石像圗九堫寢園壓幽阻太子率更題贊語形容迅奮銀甲鬪汗雨沾濡鐡衣舉周王八駿但周流王毋樂宴昆崘丘漢家九駿空逸軌神駒逺産余吾水壯哉六駿古今稀金粟堆南又一時後代子孫曾不鑒詩人腸斷望雲騅東吳行我懷天地開闢初乾動坤靜焉能踰女媧斷鼇立四極鰲足峙峙交相扶窮山絶谷總一水千里萬里澆歸墟就中積隂不得泄日劘月蕩淫為瀦似聞東吳薄海際天欲少卑蛟龍居驚飈捲浪類鶻沒漲霧磢石疑鯨呿大田黍稻一以盡寧獨岸葦兼汀蘆規撫西方失塔廟想像北里移笙竽甚哉善崩不可築哀爾民物空號呼碣石苞淪豈或有淇園下楗渾如無人言白圭過夏禹歲晚多涷猶徴夫爰居避風亦巳久精衛銜木徒區區又聞杭睦二州境前者淫潦忍見屠秖憐吾嫗視龜眼孰使汝頭真戴魚洪範五行竟不􅊰春秋災異何其愚從來妖德不相勝幸為泰階陳六符女殺虎行山深日落猛虎行長風振木威鬇鬡父樵未歸女在室心巳與虎同死生揚睛掉尾腥滿地狹路殘榛苦遭噬豈非一氣通呼吸徒以柔軀扼強鷙君不見馮婦來下車衆中無人尚負嵎又不見裴將軍出鳴鏑一時鞍馬俱辟易丈夫英雄却不武臨事趑趄汗流雨關東賢女不足數孝女千年傳殺虎揚子江頭遇仙行晴沙獵獵吹林莽日晚南奔命如縷延秋門上鳥更啼揚子江頭暗風雨就中五馬一馬龍獨據滄海超河宗塵侵犀筯不復飫鬼瞰寶玦難為容蓬萊仙人按城堡蕭國芎藭何足道氏族無慿指素波刀圭不用挼靈草萬里蒼茫豈所聞須臾變滅但荒雲東南王氣今溟漠夢入三山見樓閣送揚文仲典史歸餘姚楊君東去山巃嵸白髮三年餘種種我耒相送出江郊飛絮撲舟煙霧重回思始見色可挹豈恨屢往門能踵美蓉映幕雲氣生苜蓿分盤日光動信知邑舍頗清淨疇謂民㕓極單覂芳春有景僅桑麻儉歲無秋徒秸總徴科得考寧敢問案櫝持平終不擁間因武具治穀煆恆啓刑書蘇梏拲惟其巺入混瑕垢直以優遊傲榮寵素鷴久蓄衣共潔瘦馬多騎骨尤聳香凝圖畫居自間味絶葷羶食非冗且將厚本植根莖何况推仁完毨􅩝嗟哉丗事更變化眼識兒郎盡圭珙臯比擁座早私淑筆墨專場乃真勇劒馳梁宋或撡鐔弦擊邳郯行繳鸗交遊巳定肯論心學習相符須貫統曩曽大海泝空闊聊擬翁洲覔鉊澒蠟屐穿林草木愁蒲帆壓島鯨鼉悚每令故友役吟夢猶笑青年伏耕隴道途窅窅身更逺勳業悠悠志仍鞏送君便欲東過越龍井泉頭看晴湧山杯一釂復愴然古曲何能效羅嗊烈婦行落日沉海雲壓城官軍多載婦女行大弓徑箭自山下顔色如灰愁上馬我生不慣生馬駒存者吾子亡吾夫毋寧完身吐玉雪忍使餒肉當熊貙青楓嶺頭望回浦血指畫巖心獨苦老螭扣地救未及芳草迷天淚零雨卓哉一死可百年此事巳過永泰前黃沙野塞多降骨忠義傳中收不得月出東林客窗上疑梅花影朔風何處寒梅發江水悠悠路超忽逢花不語疑見人對影非真却因月縱使無花意自同誰知有影色俱空回頭不見東林樹猶勝羅浮是夢中秋日雜詩六首和黃明逺京露幾時白朔風吹鴈寒遊俠豈不樂山林巳摧殘晶熒龍尾劒錯落虎皮冠寄謝五陵子焉知行路難明月出東山流光射窗牖美人曼聲歌翠袖拂南斗别離終不常歡樂詎能久笑折青桂枝涼風吹我手黃塵滿天地滄海悲鶻沒從耒學仙人不在豪俠窟豹舄既飄颻霓旌何翕忽因之把酒杯坐嘯青山月西風披白蘋楚客自枯稿扳龍思上天勳業苦不早遐心隨落鴻短髮等衰草亦有夫容花嫣然為誰好寂厯林下扉莓苔日應積少年非隱淪南陌事行役書劒稍猖狂衣冠多烜赫何用擊樹枝空山歌白石代有逺遊子出門獨徘徊自託羽林籍誰傾鸚鵡杯塵生走焉將草上呼鷹臺極目渺滄海聊紓千里懷次韻吳正傳觀栁林罷獵又見天星動羽林東風罷獵總駸駸麒麟剪罽雕鞍密翡翠翻裙彩仗深三月宜春多别館百年正始自遺音相如縱有千金賦未必君王肯幸臨次韻吳正傳都城寒食悠然獨酌舞春衫手障黃塵客未諳鐡騎引駝沙草北雕弧驚鴈塞雲南太平天子回中望齊國先生稷下談猶有七香車幾兩曉耒風雨定誰驂從丞相花園入慶夀寺我耒燕山遊俠場九衢飛沙白日黃大車髙馬紛騰驤賔客追逐如風狂丞相花園雕玉房杏枅枌橑相低昻雪崖氷谷寒不僵土脈疸盈芒樹長美人素手行瓊觴清歌艷舞調絲簧鶯金蝶粉醉有香燕丹遺俗今則常倚城孤塔屹寶坊天仙夕降飄鳴鐺青旗絳莭狻猊床凌冬翠柏列兩行下引碧竇跨虹梁誰歟造者完顔王衰年上壽靣生光第一齋僧無諌章九州四海遂不康寒煙蔓草吁可傷蕭然極目捎平岡燕南趙北天茫茫快騎黃鵠歸故鄉漷州四月一日尚綿衣知是故鄉花片飛白頭慈毋倚門久目斷天南無鴈歸數株楊栁弄輕煙舟泊漷州河水邊牛羊散野春草短敕勒老公方醉眠滄州荒亭貫酒壯心違目極東州霧雨微百里齊封滄海接千年禹迹濁河非暗塵掉馬呈金轡衰草看羊著錦衣猶記上元鳴鼓夜滿船燈火越歌歸次韻傳適道虎陂閘舟中少年解唱邯鄲曲惟有垂楊夾堤緑夜來誰弄焦尾琴彈作東風雉登木乕陂閘裏水生煙荆門山頭星照船爭似楊州春十里一雙鸞信待君傳方養心欲遊泰山用前韻作思仙詞復和之浩歌起作遊仙曲黃鶴無期瑶草緑神人結屋泰山顛手拂浮雲扳建木一笑齊州九點煙天風吹斷蓬萊船還上髙丘看逺海有書莫遣麻姑傳夕乘月渡荆門閘𥘉更渡荆門觸眼舟楫亂堤吏時一呼舉篙類魚貫野雞悄無聲行子空扼腕緑樹煙靄沉清波月光爛分涼短衣披習靜單幘岸畸愁本難祛美景聊此玩荒荒東原平泯泯魯濟斷歲儉菅蒯繁時康萑苻散秋槎别星河曉夢窺日觀懸知平生竒𩔶覽天下半長衢紅塵腥古調白石粲徒聚幾州鐵肯餐三斗炭人生空自憐歲序忽巳換出門更呼車春淺氷未泮新開河口同方飬心望東嶽羣山突兀耒崑崙綿亘萬里如兒孫云何泰山壓東魯峭立獨作羣山尊髙摩蒼穹幾千仭倒入巨海相吐吞風雲欲納制水旱日月隱見開晨昏嘗思一舉小天下俯視人丗爭喧喧鄒嶧如錐掎逺翠黃河若帶澆餘渾自從無懷講封禪金繩石䃭半不存文園草文亦巳死漢帝需禮終難論朝馳蒲輪木石老夜弭玉節虬龍翻丗今極治四海謐事有未舉羣目奔伊豫逺遊困畸旅復此翹望愁攀援偏憐靈芝太古色不到上界勾陳垣浮雲微茫數尺樹落日慘淡三家村寧知東巡頌功德但祝南靣安黎元之人素謝域中戀誰遣巫陽招尓魂平生空持赤玉舄此去恐負青霞言苦吟夢入太白雪長嘯衣帶扶桑􅚐居然飄零斷地脈久矣惝恍談天根我還呼酒酹蒼蘚笑挾服閭驂羡門醉中同駕六鰲去何用回首悲乾坤皂角林觀劉錡戰處東都何慘淡南土劇蕭騷往往隳戰鬪于焉出英髦為君竟如寄立國巳不髙家供敵人賂歲奉使客艘乾坤忽掀簸城郭皆動搖狡兔手可攫長蛇心更叨精熒金鎖甲翕赩橘紅𫀆厲矛終抉腕投鞭遽填壕云何大兵壓尚謂和好牢白波橫天險清野捲地毛將營皂林斫軍艦采石鏖大星遽崩殞滄海爭遁逃向非斯人在久矣凄煙蒿龍虎空野􅔡狐狸遂寒嘷信史猶未著竒功果誰褒因之懷舊迹一吊楚江臯風雨渡揚子江大江西耒自巴蜀直下萬里澆吳椘我從揚子指蒜山舊讀水經今始睹平生壯志此最竒一葉輕舟傲煙雨怒風鼓浪屹于城滄海輸潮開水府凄迷灔澦恍如見漭滉扶桑杳何所須臾草樹皆動搖稍稍黿鼉欲掀舞黑雲鯨漲頗心掉明月貝宫終色侮吟倚金山有暮鐘望窮采石無朝櫓誰歟𫾣齒呪能神或有傴身言莫吐向來天塹如有限日夜軍書費傳羽三楚畸民類魚鱉兩淮大將猶熊乕錦帆十里徒映空鐵鎖千尋竟然炬桑麻夾岸收戰塵蘆葦成林出漁户寧知造物揔兒戲且攬長川入樽爼悲哉險阻惟白波往矣英雄幾黃土獨思萬載疏鑿功吾欲持觴酹神禹送方飬心歸餘姚切切復切切行子慘不恱嗟此四方志出門彌激烈孤蹤眇泗沂逺眼窮恆碣急吹半天耒曽氷千尺裂髙車少停輪健馬空嚼雪雄劒彈無聲敝衣不得結魯鄒誰學經齊趙幾竒節商歌敲樹枝漢禮表茅蕝向時曽買舟一往脫羈紲汴流入汪洋廬阜陵嵽嵲棄家洗塵埃求道希老耋微煙錦囊鮮宿露瑶草茁故國尚遺雉前王多覆轍夷門迷戰區艮嶽守狐孽輕鞍小駟殘徑矢天狼折肯動箕子歌虛貽晉人吷從耒識時務往往在俊傑神仙真繆悠民物正騷屑兹遊固云佳所學終不竭縞髮寧恕人寒燈遽明滅歸尋赤城幽坐視滄海泄遙空飛胥濤􅌋地坼禹穴窮冬息山樊長夏仍擉鱉那能事輕舉但可容踈拙一笑同越吟母煩用燕説為君看白雲還記此時别至杭聞胡汲仲先生沒去秋奉柩葬建昌我舟東至杭直下追落鶻悲風吹白蘋胡子聞巳卒時秋載柩去素紼照揚粵卜兹建昌城無地可泣骨上天果何心耆舊半巳沒英豪氣俱凋蓋壤名獨兀斯文西漢耒大旨六朝歇其間雖振之與丗每摩窣紛拏曲學阿磔裂淫辭淈獰飈劒蒯緱幻彩衣繍􅜎聖經䵝日晶賢傳䫜煙㶿終無萌蘖生就此斷災蹶嘻公追古先曠視眇窮髮陳言去如遺至理昭若揭逺唳翀泬孤撑植摧杌舜韶資搏拊般斧賴剞劂以兹白谷遺而有金鑾謁調琴空緇帷掞賦止鎩瞂征塵恆碣𪷟教雨淮海浡守儒終勦剛從仕類熛彂漉鹽數泥銼飛檄沼島筏幸焉櫛民垢殊莫禆主闕平時負韋素晚節老占畢佳友將米醪野僧獻衣襪耵聹耳鶴泉眼昏目鯨月生為列仙臞立謝豪俠窟似豫本踈庸為士非詭崛持衡乃藻鑑泛駕略銜橛同門溢江漢共道耀參伐將令異蚖肆肯使增獸狘于今我多慚固巳遭一刖悁結餘舊氊軒騫豈黔突將耒杳微茫逝者真咄咄宜哉貞耀諡稱彼甘棠笏公往知我誰翻然採螊􅒹怊悵西北雲從以泛溟渤寄栁博士試續儒林傳南州定幾人清標騰鳯翼素手截鯨鱗卓犖𥘉觀國軒騰早致身燕秦爭騁俠鄒魯共稱醇旅劒渾如淬家氈在一振于焉徴有道自此教成均學術諸生識才名六館親土床然燭夜茸帳結餐晨上下笙鏞間縱橫爼豆陳岐原周鼓老闕里魏碑真白日需前席青雲仰後塵山林稽猛駮文字到祥麟豈獨呻占畢猶應逐縉紳討論抽祕典扈從得良臣絶漠幽洲暗滄波碣石鄰鸞旗飛旖旎革輅壓輪囷御苑材官集離宮突騎巡赤狐翻逺譯黃鼠割時珍法酒蒲萄熟天花芍藥春遡風沙鶻健衝雪野駝馴北海誰求隱東都或對賔三關寧設險八極揔歸仁悵望懷今古賡歌邁等倫短衣曽見寵長鋏每忘貧共往仍聮駟同吟更接茵玉山森巨石金水濯芳津夲擬追枚乘終然愧郤詵􅎷鳴來巳再鵬擊去何因色挺淮王桂香生楚客蘋聖朝𥘉薦士江漢有垂綸寄吳正傳自昔携手燕南門長風灑雪衣不溫向來所見夢一覺今縱欲語舌復吞日斜慷慨與子别班馬跳躍東西奔色摩中州翠嶽聳波濯列壤黃河渾指麾齊秦擊快鶻凌厲楚漢抽枯黿彼雖失矣幸得此英氣挾酒猶飛騫常憶仲春大羽獵九衢絃直歸乘轅綵女紛行引樂伎材官夾道羅弓鞬須臾紛騰一萬騎足所未及塵為昏中使計功促莚秩崑崙玄圃惟目存威鳳文章倐能集祥麟郊藪將不喧信知天邑自壯麗誰使遊士爭扳援悲哉小草有逺志隨即大挫栖丘樊恢竒俊偉莫子若便可上拂勾陳垣來乘東楚又一載此地聞舊稱雄藩居民雜作他郡劇治道小試平生言秋行荒壖翠稻實夜艤巨濼眀珠燉定應矯首謂豫懶青桂無花能返魂幽屐穿林鸞鵠唳大瓢挹海魚龍掀達須出仕窮且隱肯以一腐終乾坤一笑一笑長竿折徒憐大海魚文章猶醬瓿塵土只鹽車白日燕臺劒清風禹穴書上林誰獻賦愁絶馬相如范蠡宅淡淡寒雲􅔏影邉荒山故宅忽千年大夫巳賜平吳劍西子還隨去越船白石撑空留罔象青松落井化蜿蜒徒憐此地無章甫只解區區學計然烏震古錢烏震何年自鑄錢偏爐彂冶光燭天方圜肉好本不變百萬戍卒橫戈鋋鎮州城南塵霧起雖有忠臣無孝子殘膚毁鼻遣還軍老毋孱妻傾淚水一時富貴千載凶摹為騎將空英雄天子真傳內藏竭小臣别賜銅山銅似此頗期邦國活却因貨利􅌹生殺但能擲地作金聲九府終存太公法聽客話熊野山徐市廟大瀛海岸古紀州山石萬仞插海流徐市求仙乃得死𬗋芝老盡令人愁􅈬中滿載童男女南面稱王自民伍蒼劔凌天化曉雲鐡船赴壑沉秋雨琅琊臺上望欲空日出未出扶桑紅魂漂三神入夢幻淚灑萬鬼爭英雄真人獨見阜鄉舄奉使遙傳鎬池壁桃源草樹同一香紵嶼蛟龍𣪚無迹古往今來亦可憐世間何處有神仙文成五利猶騰説不惜秦年惜漢年題米元暉青山白雲圗一簇空𪷟杳靄間嵓花穴枼鬪斕斑若為看盡雲生滅還我青然萬古山題李西臺真迹去矣昭陵瘞帖空西臺茟力到江東知渠尚賴毛錐子氣壓長槍大劍中淵穎吳先生集卷之四
