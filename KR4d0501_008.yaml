body:
  text: 釋迦方域志後序終南山僧道宣嘗著釋迦方域志二卷言西域諸國佛經行乞食營建塔廟處與其風土物産甚悉文又足以發之唐藝文志載其目豫始從學佛者遊頗究其所為志者蓋漢之𥘉世烏孫大月氏本在敦煌祈連間胸奴冒頓攻大月氏大月氏西赱破塞王奪居其地而塞王南君罽賔塞種分散自疏勒以西休循捐毒之屬皆故塞種顔師古曰塞今釋種也塞釋聲相近大月氏既居故塞王地烏孫昆莫又擊破之而大月氏西徙大夏故烏孫民有塞種大月氏種休循捐毒國絶小依蔥嶺而居民俗衣服又多類烏孫張騫云在大夏時賈人往市身毒得卭竹杖蜀布身毒居大夏東南有蜀物度去蜀不逺上乃令自蜀發間使四道並出指求身毒率為西南夷所閉不得通李竒曰身毒一名天篤即今浮屠胡也按此身毒塞種之捐毒也捐毒治衍敦谷西北至大宛九百二十里西至大夏千有六百一十里故大夏賈人云在其東南虛稱里數至于數千欲以誇漢使為逺實一國也漢西域傳止載捐毒而張騫傳乃引身毒特疑之也要之烏孫所治赤谷本塞王故國東去長安八千九可里而近漢擊胸奴收休屠王祭天金人金人蓋今佛氏遺像休屠王漢張掖郡地將近故塞國也而身毒及東漢又稱天竺摩騰竺法蘭之徒始持白㲲之像及所譯四十二章到洛楚王英乃首盛齋戒之祀范曄曰佛道神化興自身毒二漢方志莫有稱者然則身毒本蔥嶺間小國後漸大或為他國所併仍冒舊國之號蔥嶺以西乃為塞種蔥嶺以東多是雜胡亦不待辨而可知者也及唐之盛天竺有五方制萬里號為大國東天竺乃與雪山吐蕃分界北天竺直接突厥塞王所君罽賔陏唐之間别曰漕或曰短吒且在西天竺之列東南海外扶南林邑又南天竺之鄰境也今方域志殊不詳始本塞種獨稱中印度印度天竺之𣑽言猶捐毒也至謂其道則巳幾遍天地之所覆載與夫貫古今而不可終窮者吁怪矣哉先王之世道德同風俗一文為制度悉巳定竒言嵬行淫巧異技之人卒不自容于執法之吏去古日逺民不見聖甚則立枯抱石以為行髠首祼身以為飾或曰是方外之士也至于傷教害義亂大倫而猶不少顧始基之矣及漢而後天竺浮屠之教熾然乘之逹賢君子反受其法又文以老莊列子之旨且曰史蘇嘗紀其異矣仲尼亦嘗許其聖矣何不可者吁西極之多幻也世之政教陵夷民惟異物之是遷宋何承天善天文星曆而胡僧所論冬至日晷與天竺占異周白蘇秪婆善胡琵琶一均之中間有七聲則又得之西域於是西􅋽龜茲之樂陳于立部婆羅門九執之曆厠于大衍矣甚者周孔與釋迦並稱亦毋慮乎書革旁行而與韋編鐵擲之經混為一録也雖然天地之一氣既眹而萬形有變化容者羽者毛者鱗者介者根茇者浮生者而恆出入于一機區巳别矣安在其精靈之起滅因報之相尋哉夫何造化之功用隂陽之屈伸又與吾儒惑也傳曰五帝以前無傳人又曰六合之外聖人存而不議今浮屠氏乃索言之始于無所始也窮于無所窮也殆有出于心志耳目之所不能及者吁怪矣哉自漢宣元以後西域服從于是土地山川王侯户數道里逺近翔實可􅊲陏唐之世裴矩賈耽則又皆圗而志之若夫道宣之作本為其徒設也吾頗見其與前史有異故特為紀地理者述其槩焉春秋繁露後題昔豫自京師還過樂陵問董仲舒所居處無有云遺廟在河壖廢者三十年或云荏平有别廟廟有元祐間碑未知荏平何以得祠也時會新御史上章議揚雄不當列祀孔子廟廷林宗起者閩人顧謂豫是未能刺舉當世乃剽竊先儒緒餘欲絀死揚雄耶然漢儒獨仲舒未列從𣏌不冝後碓竟未有言者仲舒所著書玉杯繁露清明竹林之屬多説春秋事得失公羊之義疏也今具存又總名繁露而章苐或標玉杯竹林且雜取所對制䇿語是豈對制䇿時徴諸所著之書歟或後人附會之歟傳稱朝廷每有大議使使者及廷尉張湯就其家問今猶載湯問郊祀一事若夫求雨止雨推隂陽所以錯行者類淫巠瞽史所為非純儒之道矣蓋春秋一經書雩書大雩書大水鼓用牲于社于門是皆實事非欲使後之説者因是以推災異之變而且流于術數之學也漢之諸儒乃相承言之豈或求諸聖人之過歟京房之于易劉向之于洪範五行亦猶此也吁仲舒有以發之矣然而推明孔氏罷絀百家使學者有所統一卓然漢承秦滅學之後歷千載不可泯滅又何待乎從祀與否耶胡氏𬋩見唐栁宗元封建論後題豫嘗觀栁宗元封建論言封建之法更古聖王堯舜禹湯文武莫能去之是非不能去也勢不可也故封建非聖人意也勢也胡氏讀史𬋩見則曰封建之法聖人所以順天理承人心而為公天下之大端大本也宗元説非是豫蓋因是而求之則天下古今之變日趨于無窮又不可以一概論矣夫自夏后氏之衰有扈之戰洛汭之畋啇丘之徙斟尋斟灌之依禹祀之不絶者如線昆吾之強自衛遷許又彰彰然自號於世曰霸此一變也而啇周亦以是而得天下及周之東諸侯削弱世室擅權魯有三桓晉有六卿鄭有七穆孫寧在衛崔髙在齊滔滔者天下皆是雞澤一會溴梁一盟君如贅旒於上而大夫自相歃血於下此又一變也而三晉田和亦以是而得國孔子曰天下有道禮樂征伐自天子出天下無道禮樂征伐自諸侯出自諸侯出十世希不失矣自大夫出五世希不失矣陪臣執國命三世希不失矣此蓋通論天下之勢也夫何戰國之世兵力日用遊説肆行申韓以法術啇李以耕戰蘇張犀首以合從連衡各以其能分適諸侯之國始皇雖大索逐客卒就其吞併六國之謀者又客之功也此天下之一變也而卒歸于士及天下既一始皇自以為前世莫能及遂舉封建而廢之郡縣自置殺豪傑銷鋒鏑墮名城欲盡屏天下之兵而不用又且貪鷙亡厭科謫日發民不堪命陳勝吳廣攘臂一呼執農器以為兵而民之從亂十室而七項羽以亡楚故將之子劉季以泗上亭長分割天下立十八王又五歲而盡屬漢此又天下之一變也而卒歸于庶人於乎聖王不作世道愈下天下之變則亦不知其所終者矣是豈宗元之所謂勢者非耶抑又􅊲之堯舜禹湯逺矣及周而始詳啇紂之亂天下之歸周者三分之二武王既以是而勝啇啇之頑民雖遷于洛猶且弗率則又告之以啇之自絶於天與周之受有天命勞來安集無所不用其心然猶不能巳夫啇奄四國之禍也當是時周幸不至于奔潰動搖者豈無其故哉蓋周都豐鎬而文王之德化南𬒳于汝墳漢廣之域自洛以東冀青兖三州昔本屬紂且大封同姓與異姓功臣以鎮之魯周公之國也齊太公之國也表在東海淮夷徐莒之屬有所畏焉而不敢動燕召公之國也成王滅唐而唐又以之封唐叔介在北邉北戎追貊之類有所懼焉而不敢越成王在豐周公又自居洛以統之啇奄既滅康叔以之國于衛微子以之國于宋雖曰治之以德亦以示天下形勢也始皇始一天下據關中廢封建勿王子弟及二世而關東盜起郡縣吏或降或死無一肯堅守者漢興鑑秦之弊當項羽專制之餘燕趙梁椘太原淮南多王異姓故終髙帝之世用兵不息韓王信上所親幸盧綰又故人也使當胸奴卒亡入胸奴吳苪乃以長沙卑濕之國使當南越則以國小僅存耳故又大封同姓荆以王賈椘以王交代以王喜齊以王肥吳以王濞然非制也是以卒有吳楚七國之亂何則漢天子止有關中巴蜀等十五郡而諸侯王連城列邑𬒳于三邊固不可與成周並論矣記曰禮時為大順次之三代封國後世郡縣時也因時制冝以便其民順也是又豈宗元之所謂勢者非耶於乎自豫前説而觀之則天下古今之變至秦而勢為巳極自豫後説而觀之則天下古今之變至漢而勢有不同𬋩見之説守儒之常論也然而又曰欲行封建先自井田始夫封建井田二者蓋同出于堯舜禹湯文武之盛時上之則分土列爵以建國下之則分田畫野以居民井田小封建也封建大井田也秦漢以來井田廢矣則是封建之法雖欲不廢而為郡縣也尚可得哉張氏大樂玄機賦論後題鄊豫北逰京師聞太常所用樂本大晟之遺法也自東都不守大樂氏奉其樂器北趍燕都燕都喪亂又徙汴蔡汴蔡陷沒而東平嚴侯獨得其故樂部人國初有旨徴樂東平太常徐公遂典樂向日月山奏觀乞增宫縣登歌文武二舞令舊工教習以備大祀故今樂户子孫猶世籍河汴間僅能隸其鐘鼓鏗鏘不復能究其義矣豫因􅊲求前代議樂自和現以下更六七巨公而議論莫之有定前日之宿縣者本謂樂和曽未幾時倐巳改鑄或云樂失之清或云樂過于濁樂工冶卒且深猒其爐鞴鼓鑄之勞則或自取其樂之協時加銅齊以濟之當軒臨試雖以老師宿儒終不能必悟其銅齊之輕重而徒論其銅律之清濁也逮夫崇寧之世魏漢津乃以蜀一黥卒為造大晟樂府遂頒其樂書于天下蓋謂古之制樂者惟黃帝夏禹得樂之正何則聖主之稟賦上與天地隂陽為一體聲則為律身則為度故夫黃帝夏禹之制樂實自其身而得之臣今請以聖主中指三節三寸定黃鐘之律中指之徑圍又即據而定為度量權衡樂以是制則臣將見其合天地之正備隂陽之和而得夫金石清濁之冝矣當是時惟丞相蔡京最神其説先鑄帝鼐八鼎復造金石鐘簴雕幾刻鏤蓋極後世之選巳然以崇寧之指尺既長而樂律遂髙雖漢津亦自知之嘗私謂其弟子任宗堯曰樂律髙北方玄鼎水又溢出律髙則聲過哀而國亂水溢出則國有變而境土喪沒是不久矣嗚呼漢津所制豈復有加于和現以下諸人所論之樂哉然且至今沿襲相承未聞有所改作樂殊不可以草創苟且而遽定也雖然崇寧之樂亦可變矣蓋古之論樂者一曰古雅樂二曰俗部樂三曰胡部樂古雅樂更春亂而廢漢世惟采荆楚燕代之謳稍協律吕以合八音之調不復古矣晉宋六代以降南朝之樂多用吳音北國之樂僅襲夷虜及隋平江左魏三祖清啇等樂存者什四世謂為華夏正聲蓋俗樂也至是沛國公鄭譯復因龜兹人白蘇祇婆善胡琵琶而翻七調遂以制樂故今樂家猶有大石小石大食般涉等調大石等國本在西域而般涉即是般瞻華言羽聲陏人且以是為太簇羽矣由是觀之漢世徒以俗樂定雅樂陏氏以來則復悉以胡樂定雅樂唐至玄宗胡部坐俗部立樂工肄樂坐技不通然後發為立技立技不精然後使教雅樂天下後世卒不復知有古雅樂之正聲矣自唐歷宋大抵皆然是猶未能究夫樂律之元而僅拳拳于黍尺指尺之同異及乎大晟樂府之立吾殆未知其尚有胡俗之雜耶抑果雅樂之正也夫以雅樂平淡而聲緩胡俗繁碎而聲急今大晟之樂律太髙樂聲急矣當大晟樂書之行教坊色長張俁曽製大樂玄機賦論七音六十律八十四調本不脫乎龜兹白蘇祗婆之舊正行四十大曲常行小令四部絃𬋩猶或尚循乎大唐五代黎園法曲之遺此非胡俗之雜行者乎冝雅樂之未易遽復也然吾就俁之所學嘗謂樂工肄樂先須通逹強記巧妙斡旋復窮十載曉夜之思而務諳前人格範之正固不可以草茅無識而輕議樂又况漢津蜀一黥卒稍窺范景仁司馬君實之議論而且得與夫黃帝夏禹配食於樂成之廟尚可至今沿襲而不變耶於乎誠以世之通音曉律者或少也夫何天下四方之所尚胡俗伎樂率多輕儇剽殺嘷呶縱肆前緩後驟不中音莭它則倡優雜劇類且青紅塗抹子女雜擾導淫教媟不得禁止然以胡俗之樂音節不中則聲氣淺浮而日趨于薄倡優之伎禁止不行則風俗流蕩而不知所返此雖小節所繫甚大漢諺有云宫中好髙髻城中髙一尺宫中好長袖城中全匹帛意者朝廷合議先正雅樂然後天下四方悉更胡俗二部之不正者悉歸於正而後止殆不可視是為千古之絶學也然古者律曆二事更相為用太史郭公一嘗定曆誠曠世所未有豫謂冝依古法緹室葭灰隨月候氣天地之中氣既應則鐘律之中聲當無有不應者要在久而後驗樂殊不可以草創苟且而遽定也嗚呼崇寧之樂亦可變矣吾又安得夫伶倫榮援之徒而與之共論樂哉續琴操哀江南宋季有以善鼓琴見上者出入宫掖間汪姓忘其名臨安不守太后嬪御北汪從之宿留葪門數年而文丞相𬒳執在獄汪上謁且勉丞相必以忠孝白天下豫將歸死江南及歸舊宫人會者十八人釃酒城隅與之别援琴鼓再行淚雨下悲不自勝後竟不知所在嘻汪蓋死矣客有感之者為續琴操曰哀江南凡四章我赴薊門四之一我赴薊門我心何苦我本南人我行北土視彼翼􅎮客星光光自陪輦轂久沙戎行靡歲不戰何兵不潰偷生有戚就死無罪莽莽黃沙依依翠華我皇何在忍恤我家瞻彼江漢四之二瞻彼江漢截淮及楚起兵海隈亡命無所枕戈待且憤不顧身我視王室誰非國人噫嘻昊天使汝縲絏姦黨心寒健兒膽裂黃河萬里氷雪峨峨爾死得死我生謂何我操南音四之三我操南音爰我酒風摧我裳氷裂我手薄送于野曷云同歸自貽伊阻不得奮飛持此盈觴化為别淚昔也姬薑今焉憔悴山髙水逺無相見時各保玉體將死為期興言自古四之四興言自古使我速老麋鹿是遊姑蘇荒草起秣我馬裴回舊鄉江山不改風景忘亡誰觸塵埃不見日月梨園雲散羽林鳥沒吞聲躑躅悲風四來爾非遺民何獨不哀右續琴操哀江南者四章章四解或傳粵人謝翺作讀其辭甚悲因其辭以推其心則其所悲又有甚于此辭者謂非翺作不可也當宋季年大兵壓境兩官且以琴酒自娛故老言度宗在宫中嘗以壼觴自隨盡日不醉權臣弄國江上之師不暇一戰反以捷聞蓋必有以壅塞其耳目蠱惑其心志而然歟否則栗栗危懼之不恤而又何樂于酒藉令長江天塹北軍不能飛渡安能坐守東南數郡為一龜兹國哉梁蕭繹時江陵戒嚴百官戒服聽講老子中既輟講諜者言魏軍不出四境帖然又復開講一日以至力屈就擒身困縵幕雖拔刀斫桉不得悔嘻宋季然矣夫人者乃能以善鼓琴見上吾意其不為鄒忌必為雍門周縱不能一悟主聽使之少有更張亦能使之立若破國亡邑至聞疾風飛鳥之聲窮窮焉固無樂巳及大事巳去獨其心怏怏奔走萬里若不釋然者嘻亦晚矣天寶盛時歌者李龜年恩遇無比祿山亂龜年流落江南每歌數闋四座莫不嘆息泣下又况天地黯然山河頓異使夫人者尚在庸不有以泣龜年者泣之乎豫謂琴操多出于憂愁窮苦之人而有所守者翺之于辭適契焉故録之若曰南風不競則自古見之矣尚何言哉尚何言哉伊耆氏大蠟樂歌辭大蠟之禮廢矣記禮暏伊耆氏始為蠟蠟也者索也嵗十二月合聚萬物索饗之也又曰天子大蠟八八蠟以記四方四方年不順成八蠟不通順成之方其蠟乃通以移民也蓋夫天地之大德曰生發之而為庶人庶物陽舒而隂斂雲行而雨施功加於嵗則報之以歲事之成勞著于民則饗之以國典之正伊耆氏果何氏也將始之教民以田者也三禮義宗曰伊耆氏神農之别號後之蠟者先嗇祀神農司嗇祀后稷則固非伊耆氏之蠟也烈山氏之子柱本為稷而周人更用棄禮且有若是者明堂位載魯有伊耆氏之樂而周官籥章掌豳籥者鄭玄又析豳風七月一詩以配之或祈田祖或樂田畯或息老物籥豈伊耆氏之葦籥者乎自秦始置臘漢魏之間二禮並行魏髙堂隆曰古之王者各用其五行之運盛者為蠟終者為臘及陏開皇乃停十月之蠟而但行十二月之臘唐貞觀𥘉因之前以寅蠟百神卯祭社宫辰然後臘宗廟近世則蠟臘又特通行于一日矣夫以夏正十月周正為十二月由周夏之正所建不同卒致蠟臘之禮相襲無别吕不韋月令孟冬之月勞民休息臘先祖五祀鄭玄注曰此周之蠟也然而蠟之為蠟未嘗及先祖五祀豈秦制巳混之乎于乎大蠟之禮廢矣記禮者尚存其祝曰土反其宅水歸其壑昆蟲母作草木歸其澤樂則無可􅊲者欲輔是無益也雖然載芟良耜聖人之經巳吾猶後世之復古者輔焉庸不有土鼓葦籥寂寥之末音者乎遂從而録其辭於穆泰鴻俶降嘉穀神莫帝隗肖靈之鞠經營標野改薦腥熟沐哉恤兹億載蒙福先嗇一皇監下民云胡其穡篤生厥􅈱克用封殖協風鳴條壚土疸發嘉承天常式保爾極司嗇二倬彼田畯人遭阻艱茅蒲襏襫銚耨以完率育稚耋告成萬寶越睊乃粒我王之造農三我田甫田我行畷郵翳桑之饁童莠何秋逖惟風后井畫九丘盍不古處允兹民逑郵表畷四大哉者川疏寫中野稻人瀦波災暵以雨膏潤畢逮畚鍤具舉豐年穰穰永得我所坊五先王授民兆濬兹洫宿荄敷與胼胝是力從橫川􅎌經緯國都自西徂東慎不可踰水庸六自古在昔虔共粢盛有函斯活田稚乃榮晝穴何竊獖牙弗獰莫贙匪武用迪厥成貓虎七玄冥盛隂十月霜雪草枯木凋壞户咸閉祛除妖盩􅗴滅蠱􅖈暑生寒死不瑕有害昆蟲八田居子黃隱君哀頌辭始豫弱冠時從黃隱君遊隱君諱景昌字明逺世為婺之浦江人自幼敦朴而開悟及長益通五經諸子詩賦百家之言巖南公嘗一再携豫詣隱君質春秋隱君則曰墨守是非𥘉不可以草草矣巳而豫授其孫迪學且盡發其春秋公穀舉傳論及三代用正日夜食之辨每言春秋一書自公穀氏口説相傳至漢然後著之竹帛是故經有脫編有錯簡學者上畏聖經下避賢傳訛舛誣漏不敢較也辨用正曰三代正朔改正者必改月數而春秋左氏為最明大史推日食則曰當夏四月是謂孟夏而經且書日食為六月梓慎占星孛則又曰火之出也在夏為三月在啇為四月在周為五月而經且書宋衛陳鄭之災為五月它如晉卜偃因童謡而驗晉人之滅虢又極有以見夫夏周數月之不同矣蔡氏傳書乃曰三代之建正不同月數不改凡朝覲會同巡狩承享之事必以所建之正至于數月皆起于寅嗚呼蔡氏之為是説豈欲以嬴秦視三代耶秦史所書冬十月以為歲首後九月以為閏月月建一差閏法不合後九非戌而十月亦非亥矣然而秦人自以端月為正史以十月書於元年之首者大𥘉曆行漢世追改之也孰謂三代類是而伊訓必以十有二月而首嵗者乎辨日夜食曰天之七政日月五星皆動物也而日月且有薄蝕之變春秋據見而録故言日有食之不言所食蓋慎之也穀梁言王者朝日日出而有虧傷即是夜食是以經不書日日辰晦朔言日夜食不可以日定也雖然王者朝日則巳見為晝食非夜食矣聖人豈能據所不見而即書之經耶或曰春秋之經無日夜食曆家之算天度必知有日夜食是傳者因經以著曆數也豫謂經書日食三十有六後世善曆者推之或有甲乙或無晦朔不聞言有日夜食學聖人之學豈不反為巫史家所笑乎或曰世之登泰山者夜半見海出日當是而食將夜食乎抑晝食乎豫謂古人之占天者當晝則測日景當𥘉昏則驗中星自帝堯之分命羲和者此其職矣又何敢以瑣聞雜説而輕議聖經者乎自豫當時觀其辨日夜食凛凛不可屈後得巴川陽恪春秋􅊲正一卷言三代悉用夏時不改月數出入絰史無慮數百千言隱君且明其不然乃作周正如傳􅊲章分條析文極多此最其善持論者嘗又考古今諸家所賦詩上起漢魏下迄于六代陳陏而止唐以來古體之作一變今體不盡録也間則致書巖南公有古今體樂府之辨曰夫古詩三百篇之外後人所為準者惟漢魏為古體之宗而唐沈宋則始為今體之倡然樂府辭乃具古今體何者漢魏以還言樂府者本是古體及唐李太白宫中行樂辭梨園之伎悉絃歌之特是今體律詩王摩詰渭城歌世以小秦王調歌之又謂之陽關詞復是今體絶句它如古挽歌辭左氏傳所載歌虞殯者雖不可􅊲漢魏之間所歌薤露蒿里則猶古也自唐至今之為挽歌者必以今體五七言四韻為之何耶又如古樂府題胡無人釣竿等篇唐徐彥伯沈雲卿方以五言今體為之河滿子一曲司空文明又以五言二韻為之盡今日之所謂律詩絶句者也此果何耶唐人詩集每有標題古詩律詩古樂府歌引吟行者杜少陵集中獨無樂府舊嘗纍讀而深疑之蓋夫古人之詩一章一句動合律吕𬒳之金石管絃播之羽旄干戚與夫唱嘆於工師瞽矇之口皆是詩也何有詩與樂府之别哉或者不悟且曰此為四言此為五言此為七言此為古詩此為歌行此為琴操嗚呼陋矣此皆後世擬古者之一失也昔者曹孟德召李堅為鞞舞辭欲以聞西園鼓吹之舊堅以亂離久廢不悉古曲子建乃不泥古曲之名遂别搆之何後世之言古曲者就題立意若宋齊梁諸人之所為者耶宋齊梁諸人之所為猶若是則今體之拘拘者吾可得而盡録耶欲觀古今體樂府之變考吾之所自録者概可見矣隱君晚自號田居子因作田居古調辭九章一章曰耕田二章曰抱甕三章曰濯澗四章曰暴日五章曰候樵六章曰倚囱七章曰聮蓑八章曰釀酒九章曰開徑每一客至霑醉恆擊莭髙歌超然自得然頗自謂東都名士大夫不欲以文士得名及老猶親自刪𫐠不巳且曰吾耄矣恐一旦即死無以藉手見古人吾又豈得與夫文士齒哉於乎揚雄法言書鄭子真李仲元王充論衡書谷子雲吳君髙子真名動京師子雲身為五侯之客仲元非不有隱德君髙非不有文翰而終以不顯奈之何哉此殆當世逢遇之不同𥘉不可以士論賢否定也隱君巳矣豫故悉疏其文且作哀頌一篇就以祭之使後人之讀是者知吾之所以哀隱君與夫隱君之所以自哀者矣於乎悲夫頌曰於乎自古皆有死今之死者巳乎可哀方來如秋濤之未息既往類老樹之先摧當其壯年卓落呻吟占畢聖賢合席逮其晚莭偃蹇浮湛里閈漁釣爭隈生而無爵沒而無諡直隱居行義而止耳心之所存道之所統則或前有千古後有萬世內有中國外有九垓豫嘗觀其著書成篋揮筆成甕將以窮經而致用猶恐一旦先拘馬填溝壑無以自見于世眼光流月古音轉雷倐焉榮華兹固不能必料其播之簡牘刻之琬琰忽爾變滅抑亦不得必禁其聚為磷火委諸塵埃於乎就君平日之所自論者不待後世而悉驗雖使投冢兮赴弼冶銅兮鑄島孰知其學孰慕其材幸而屬纊幸而蓋棺幸而得塴則終身之願已哀又何猜有肴在爼有酒在杯歷上下四方曽不可以復作盍歸乎來觀生堂銘義烏樓君國禎善醫自闢堂扁曰觀生請豫銘夫天地之大德曰生而我觀其生雖以聖人對時而育物者率不逃乎肖象與形聲誠推其本則民不夭札物無疵癘特在乎風雨之調寒暑之平遂充其技則炎冷迭變燥濕殊施乃欲寄命乎虻蟲之甲翅草樹之根莖上追苗父僦貸季之神賾下逮桑君秦越人之智精每能洞見乎心肝膽肺之系絡實有以雜徑乎針砭湯尉之重輕我求我醫何異操兵視一身百骸之會如國之有政察山林海陸之産則辛醎苦滑猶干楯矛戟或冝野戰或類防城然則兵本所以活國醫本所以活民而特繫于我用之能否彼不度地而浪戰不診脈而試藥者亦徒使夫天人之交戾龍􅍑之妄爭是固未足以以究夫觀生之易而盡彼衛生之經猗歟樓君幼通難素長識運氣遂以醫鳴居藥在􅍥蓄書塞楹吾然後知夫周秦邯鄲之所貴者悉踵于户而無遁其情矣義烏樓君玉汝墓碣銘并序義烏樓君玉汝既卒豫􅈬其家求書子光亨出學童識字一編請豫序曰凡盈天地之兩間者莫非物也史皇倉頡始制文字而正名百物天下之物舉之而無窮故古今字書之學亦與之變而無窮形聲事意轉注假借音同字異音異字同雖自一起而成文極其變或至于什伯倍蓰而不止兩漢之世悉隸小學學童習之罔有遺者晉魏以降士不師古而俗書偽學之日勝造字偏傍點畫亂讀字輕淺重濁盩小學學童識字日少涉事日踈造理日窒馮私臆決傎倒錯遻或以目前近事幾不名六畜幾不辨菽麥况天下之物可舉者若是之無窮哉嗚呼弊也久矣蓋今玉汝頗以暇日輯古今字書尤注意音義聲韻訓詁同異題曰學童識字是雖未足以盡繼古小學然皆精緻可傳豫蓋序是語巳復還其書光亨泣且請曰書幸序巳墓上之碣獨未有表者敢重賜以銘按君樓氏諱有成字玉汝世為婺之義烏人曽祖昺祖琰父建中咸業儒君自宋季早以善詞賦有聲會江南內附而君遂老家居教授江淮提舉司聞君名􅈬檄君無為路儒學學録君竟以不覬聞逹卒家實至順元年冬十一月十八日享年七十八配童氏子男四人長曰則仁次曰于義次曰彌老幼則光亨也孫男十三人曰慧曰用曰性曰韶曰祐曰武曰行曰善曰與曰玓曰瓅曰珍曰璉曽孫男六人致寧致康致愷致中致和致悌光亨等即以卒月三十日葬君于智者鄉梅口山之原自墓去家不越百舉武而近豫觀宋季以來東南學者多承故家文獻之遺彬彬間出而義烏何茂恭喻叔竒兄弟最為翹楚曾未百年文墨寂寥簡編零落可以使人長嘆而于邑者光亨每言君輯古今字書年巳衰耄然猶日夜發聖經賢傳諸子雜書而誦之隨得隨抄遂成卷帙嗚呼其老且勤也若是豈冝使之泯沒無聞哉是可銘巳銘曰有嚴斯栽有瀐斯瀦誰歟窆者曰老一儒妥爾魂魄仞爾室廬爾嘗爾蒸子孫靡不承淵頴吳先生集卷之八
