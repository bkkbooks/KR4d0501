body:
  text: 釋迦方域志後序終南山僧道宣嘗著釋迦方域志二卷言西域諸國佛經行乞食營建塔廟䖏與其風土物産甚悉文又足以發之唐藝文志載其目予始從學佛者㳺頗䆒其所為志者盖漢之𥘉世烏孫大月氏本在敦煌祈連間匈奴冒頓攻大月氏大月氏西赱破塞王奪居其地而塞王南君罽賔塞種分散自䟽勒以西休循捐毒之属皆故塞種顔師古曰塞今釋種也塞釋聲相近大月氏既居故塞王地烏孫昆莫又擊破之而大月氏西徙大夏故烏孫民有塞種大月氏種休循捐毒國絶小依葱嶺而居民俗衣服又多類烏孫張騫云在大夏時賈人往市身毒得卭竹杖蜀布身毒居大夏東南有蜀物度去蜀不逺上乃令自蜀發間使四道並出指求身毒率為西南夷所閉不得通李竒曰身毒一名天䔍即今浮屠胡也按此身毒塞種之捐毒也捐毒治衍敦谷西北至大宛九百二十里西至大夏千有六百一十里故大夏賈人云在其東南虚稱里數至扵數千欲以誇漢使為逺實一國也漢西域傳止載捐毒而張騫傳乃引身毒特疑之也要之烏孫所治赤谷本塞王故國東去長安八千九可里而近漢擊匈奴収休屠王祭天金人金人盖今佛氏遺像休屠王漢張掖郡地將近故塞國也而身毒及東漢又稱天竺摩騰竺法蘭之徒始持白㲲之像及所譯四十二章到洛楚王英乃首盛齋戒之祀范曄曰佛道神化興自身毒二漢方志莫有稱者然則身毒本葱嶺間小國後漸大或為他國所併仍冒舊國之號葱嶺以西乃為塞種葱嶺以東多是雜胡亦不待辨而可知者也及唐之盛天竺有五方制萬里號為大國東天竺乃與雪山吐蕃分界北天竺直接突厥塞王所君罽賔陏唐之間别曰漕或曰短吒且在西天竺之列東南海外扶南林邑又南天竺之隣境也今方域志殊不詳始本塞種獨稱中印度印度天竺之𣑽言猶捐毒也至謂其道則巳幾徧天地之所覆載與夫貫古今而不可終窮者吁恠矣㢤先王之世道徳同風俗一文為制度悉巳定竒言嵬行淫巧異技之人卒不自容扵執法之吏去古日逺民不見聖甚則立枯抱石以為行髠首祼身以為飾或曰是方外之士也至扵傷教害義亂大倫而猶不少顧始基之矣及漢而後天竺浮屠之教熾然乗之逹賢君子反受其法又文以老荘列子之㫖且曰史蘇嘗紀其異矣仲尼亦嘗許其聖矣何不可者吁西極之多幻也世之政教陵夷民惟異物之是遷宋何承天善天文星暦而胡僧所論冬至日晷與天竺占異周白蘇秪婆善胡琵琶一均之中間有七聲則又得之西域於是西􅋽龜玆之樂陳扵立部婆羅門九執之暦厠扵大衍矣甚者周孔與釋迦並稱亦毋慮乎書革旁行而與韋編鐵擿之經混為一録也雖然天地之一氣旣眹而萬形有變化容者羽者毛者鱗者介者根茇者浮生者而恒出入扵一機區巳别矣安在其精靈之起㓕因報之相尋㢤夫何造化之功用隂陽之屈伸又與吾儒惑也傳曰五帝以前無傳人又曰六合之外聖人存而不議今浮屠氏乃索言之始扵無所始也窮扵無所窮也殆有出扵心志耳目之所不能及者吁恠矣㢤自漢宣元以後西域服從扵是土地山川王侯户數道里逺近翔實可􅊲陏唐之世裴矩賈躭則又皆圗而志之若夫道宣之作本為其徒設也吾頗見其與前史有異故特為紀地理者述其槩焉春秋繁露後題昔予自京師還過樂陵問董仲舒所居䖏無有云遺廟在河壖廢者三十年或云荏平有别廟廟有元祐間碑未知荏平何以得祠也時會新御史上章議揚䧺不當列祀孔子廟廷林宗起者閩人顧謂予是未能刺舉當世乃剽竊先儒緒餘欲絀死揚䧺耶然漢儒獨仲舒未列從𣏌不冝後碓竟未有言者仲舒所著書玉杯繁露清明竹林之属多說春秋事得失公羊之義䟽也今具存又総名繁露而章苐或標玉杯竹林且雜取所對制䇿語是豈對制䇿時徴諸所著之書歟或後人附㑹之欤傳稱朝廷毎有大議使使者及廷尉張湯就其家問今猶載湯問郊祀一事若夫求雨止雨推隂陽所以錯行者類淫巠瞽史所為非純儒之道矣盖春秋一經書雩書大雩書大水鼓用牲于社于門是皆實事非欲使後之說者因是以推灾異之變而且流扵術數之學也漢之諸儒乃相承言之豈或求諸聖人之過歟京房之扵易劉向之扵洪範五行亦猶此也吁仲舒有以發之矣然而推明孔氏罷絀百家使學者有所統一卓然漢承秦滅學之後歷千載不可泯滅又何待乎從祀與否耶胡氏𬋩見唐栁宗元封建論後題予嘗觀栁宗元封建論言封建之法更古聖王堯舜禹湯文武莫能去之是非不能去也勢不可也故封建非聖人意也勢也胡氏讀史𬋩見則曰封建之法聖人所以順天理承人心而爲公天下之大端大本也宗元說非是予盖因是而求之則天下古今之變日趋扵無竆又不可以一㮣論矣夫自夏后氏之衰有扈之戰洛汭之畋啇丘之徙斟尋斟灌之依禹祀之不絶者如綫昆吾之強自衛遷許又彰彰然自號於世曰覇此一變也而啇周亦以是而得天下及周之東諸侯削弱世室擅權魯有三桓晉有六卿鄭有七穆孫寗在衛崔髙在齊滔滔者天下皆是雞澤一會溴梁一盟君如贅旒於上而大夫自相歃血於下此又一變也而三晉田和亦以是而得國孔子曰天下有道禮樂征伐自天子出天下無道禮樂征伐自諸侯出自諸侯出十世希不失矣自大夫出五世希不失矣陪臣執國命三世希不失矣此盖通論天下之勢也夫何戰國之世兵力日用㳺說肆行申韓以法術啇李以耕戰蘇張犀首以合從連衡各以其能分適諸侯之國始皇雖大索逐客卒就其吞併六國之謀者又客之功也此天下之一變也而卒歸扵士及天下既一始皇自以爲前世莫能及遂舉封建而廢之郡縣自置殺豪傑銷鋒鏑堕名城欲盡屏天下之兵而不用又且貪鷙亡厭科讁日發民不堪命陳勝呉廣攘臂一呼執農噐以爲兵而民之從亂十室而七項羽以亡楚故將之子劉季以泗上亭長分割天下立十八王又五歲而盡属漢此又天下之一變也而卒歸扵庻人於乎聖王不作世道愈下天下之變則亦不知其所終者矣是豈宗元之所謂勢者非耶抑又􅊲之尭舜禹湯逺矣及周而始詳啇紂之亂天下之歸周者三分之二武王既以是而勝啇啇之頑民雖遷于洛猶且弗率則又告之以啇之自絶於天與周之受有天命勞来安集無所不用其心然猶不能巳夫啇奄四國之禍也當是時周幸不至扵犇潰動揺者豈無其故㢤盖周都豐鎬而文王之徳化南𬒳扵汝墳漢廣之域自洛以東冀青兖三州昔本属紂且大封同姓與異姓功臣以鎮之魯周公之國也齊太公之國也表在東海淮夷徐莒之属有所畏焉而不敢動燕召公之國也成王滅唐而唐又以之封唐叔介在北邉北戎追貊之類有所懼焉而不敢越成王在豐周公又自居洛以統之啇奄既滅康叔以之國扵衛微子以之國扵宋雖曰治之以徳亦以示天下形勢也始皇始一天下據關中廢封建勿王子弟及二世而關東盗起郡縣吏或降或死無一肯堅守者漢興鑑秦之弊當項羽專制之餘燕趙梁椘太原淮南多王異姓故終髙帝之世用兵不息韓王信上所親幸盧綰又故人也使當匈奴卒亡入匈奴呉苪乃以長沙卑濕之國使當南越則以國小僅存耳故又大封同姓荆以王賈椘以王交代以王喜齊以王肥呉以王濞然非制也是以卒有呉楚七國之亂何則漢天子止有關中巴蜀䓁十五郡而諸侯王連城列邑𬒳于三邊固不可與成周並論矣記曰禮時為大順次之三代封國後世郡縣時也因時制冝以便其民順也是又豈宗元之所謂勢者非耶於乎自予前說而觀之則天下古今之變至秦而勢為巳極自予後說而觀之則天下古今之變至漢而勢有不同𬋩見之說守儒之常論也然而又曰欲行封建先自井田始夫封建井田二者盖同出扵堯舜禹湯文武之盛時上之則分土列爵以建國下之則分田畫野以居民井田小封建也封建大井田也秦漢以来井田廢矣則是封建之法雖欲不廢而為郡縣也尚可得㦲張氏大樂玄機賦論後題鄊予北逰京師聞太常所用樂本大晟之遺法也自東都不守大樂氏奉其樂噐北趍燕都燕都䘮亂又徙汴蔡汴蔡䧟沒而東平嚴侯獨得其故樂部人國初有㫖徴樂東平太常徐公遂典樂向日月山奏觀乞增宫縣登歌文武二舞令舊工教習以備大祀故今樂户子孫猶世籍河汴間僅能隷其鐘鼓鏗鏘不復能究其義矣予因􅊲求前代議樂自和現以下更六七鉅公而議論莫之有定前日之宿縣者本謂樂和曽未幾時倐巳改鑄或云樂失之清或云樂過扵濁樂工冶卒且深猒其爐鞴皷鑄之勞則或自取其樂之恊時加銅齊以濟之當軒臨試雖以老師宿儒終不能必悟其銅齊之輕重而徒論其銅律之清濁也迨夫崇寜之世魏漢津乃以蜀一黥卒爲造大晟樂府遂頒其樂書扵天下盖謂古之制樂者惟黄帝夏禹得樂之正何則聖主之禀賦上與天地隂陽爲一體聲則爲律身則爲度故夫黄帝夏禹之制樂實自其身而得之臣今請以聖主中指三節三寸定黄鐘之律中指之徑圍又即據而定爲度量權衡樂以是制則臣将見其合天地之正備隂陽之和而得夫金石清濁之冝矣當是時惟丞相蔡京最神其說先鑄帝鼐八鼎復造金石鐘簴雕幾刻鏤盖極後世之選巳然以崇寧之指尺既長而樂律遂髙雖漢津亦自知之嘗私謂其弟子任宗尭曰樂律髙北方玄鼎水又溢出律髙則聲過哀而國亂水溢出則國有變而境土䘮沒是不乆矣嗚呼漢津所制豈復有加扵和現以下諸人所論之樂㦲然且至今沿襲相承未聞有所改作樂殊不可以草創苟且而遽定也雖然崇寜之樂亦可變矣盖古之論樂者一曰古雅樂二曰俗部樂三曰胡部樂古雅樂更春亂而廢漢世惟采荆楚燕代之謳稍恊律吕以合八音之調不復古矣晋宋六代以降南朝之樂多用呉音北國之樂僅襲夷虜及隋平江左魏三祖清啇䓁樂存者什四世謂為華夏正聲盖俗樂也至是沛國公鄭譯復因龜兹人白蘇祇婆善胡琵琶而翻七調遂以制樂故今樂家猶有大石小石大食般渉等調大石等國本在西域而般渉即是般瞻華言羽聲陏人且以是為太簇羽矣由是觀之漢世徒以俗樂定雅樂陏氏以来則復悉以胡樂定雅樂唐至玄宗胡部坐俗部立樂工肄樂坐技不通然後發為立技立技不精然後使教雅樂天下後世卒不復知有古雅樂之正聲矣自唐歴宋大抵皆然是猶未能究夫樂律之元而僅拳拳扵黍尺指尺之同異及乎大晟樂府之立吾殆未知其尚有胡俗之雜耶抑果雅樂之正也夫以雅樂平淡而聲緩胡俗繁碎而聲急今大晟之樂律太髙樂聲急矣當大晟樂書之行教坊色長張俁曽製大樂玄機賦論七音六十律八十四調本不脫乎龜兹白蘇祗婆之舊正行四十大曲常行小令四部絃𬋩猶或尚循乎大唐五代黎園法曲之遺此非胡俗之雜行者乎冝雅樂之未易遽復也然吾就俁之所學嘗謂樂工肄樂先湏通逹強記巧妙斡旋復窮十載曉夜之思而務諳前人格範之正固不可以草茅無識而輕議樂又况漢津蜀一黥卒稍窺范景仁司馬君實之議論而且得與夫黄帝夏禹配食於樂成之廟尚可至今㳂襲而不變耶於乎誠以世之通音曉律者或少也夫何天下四方之所尚胡俗伎樂率多輕儇剽殺嘷呶縦肆前緩後驟不中音莭它則倡優雜劇類且青紅塗抹子女雜擾導淫教媟不得禁止然以胡俗之樂音節不中則聲氣淺浮而日趋扵薄倡優之伎禁止不行則風俗流蕩而不知所返此雖小節所繫甚大漢諺有云宫中好髙髻城中髙一尺宫中好長袖城中全匹帛意者朝廷合議先正雅樂然後天下四方悉更胡俗二部之不正者悉歸於正而後止殆不可視是為千古之絶學也然古者律暦二事更相為用太史郭公一嘗定暦誠曠世所未有予謂冝依古法緹室葭灰随月候氣天地之中氣既應則鐘律之中聲當無有不應者要在乆而後験樂殊不可以草創苟且而遽定也嗚呼崇寜之樂亦可變矣吾又安得夫伶倫榮援之徒而與之共論樂㢤續琹操哀江南宋季有以善鼓琴見上者出入宫掖間汪姓忘其名臨安不守太后嬪御北汪從之宿留葪門數年而文丞相𬒳執在獄汪上謁且勉丞相必以忠孝白天下予將歸死江南及歸舊宫人㑹者十八人釃酒城隅與之别援琹鼔再行淚雨下悲不自勝後竟不知所在嘻汪盖死矣客有感之者為續琴操曰哀江南凡四章我赴薊門四之一我赴薊門我心何苦我本南人我行北土眎彼翼􅎮客星光光自陪輦轂乆沙戎行靡歲不戰何兵不潰偷生有慼就死無罪莽莽黄沙依依翠華我皇何在忍恤我家瞻彼江漢四之二瞻彼江漢截淮及楚起兵海隈亡命無所枕戈待且憤不顧身我眎王室誰非國人噫嘻昊天使汝縲絏姦黨心寒徤兒膽裂黄河萬里氷雪峨峨尔死得死我生謂何我操南音四之三我操南音爰我酒風摧我裳氷裂我手薄送于野曷云同歸自貽伊阻不得奮飛持此盈觴化爲别淚昔也姬姜今焉憔悴山髙水逺無相見時各保玉體將死爲期興言自古四之四興言自古使我速老麋鹿是㳺姑蘇荒草起秣我馬裴囬舊郷江山不改風景忘亡誰觸塵埃不見日月梨園雲散羽林鳥沒吞聲躑躅悲風四来尔非遺民何獨不哀右續琴操哀江南者四章章四觧或傳粤人謝翺作讀其辭甚悲因其辭以推其心則其所悲又有甚扵此辭者謂非翺作不可也當宋季年大兵壓境兩官且以琴酒自娛故老言度宗在宫中甞以壼觴自隨盡日不醉權臣弄國江上之師不暇一戰反以捷聞盖必有以壅塞其耳目蠱惑其心志而然歟否則慄慄危懼之不䘏而又何樂扵酒藉令長江天塹北軍不䏻飛渡安能坐守東南數郡爲一龜兹國㢤梁蕭繹時江陵戒嚴百官戒服聽講老子中既輟講諜者言魏軍不出四境帖然又復開講一日以至力屈就擒身困縵幕雖抜刀斫桉不得悔嘻宋季然矣夫人者乃能以善鼓琹見上吾意其不爲邹忌必爲雍門周縦不能一悟主聽使之少有更張亦能使之立若破國亡邑至聞疾風飛鳥之聲窮竆焉固無樂巳及大事巳去獨其心怏怏犇走萬里若不釋然者嘻亦晚矣天寳盛時歌者李龜年恩遇無比禄山亂龜年流落江南每歌數闋四座莫不嘆息泣下又况天地黯然山河頓異使夫人者尚在庸不有以泣龜年者泣之乎予謂琹操多出扵憂愁竆苦之人而有所守者翺之扵辭適契焉故録之若曰南風不競則自古見之矣尚何言㢤尚何言㢤伊耆氏大蜡樂歌辭大蜡之禮廢矣記禮暏伊耆氏始為蜡蜡也者索也嵗十二月合聚萬物索饗之也又曰天子大蜡八八蜡以記四方四方年不順成八蜡不通順成之方其蜡乃通以移民也盖夫天地之大德曰生發之而為庻人庻物陽舒而隂歛雲行而雨施功加於嵗則報之以歲亊之成勞著扵民則饗之以國典之正伊耆氏果何氏也將始之教民以田者也三禮義宗曰伊耆氏神農之别號後之蜡者先嗇祀神農司嗇祀后稷則固非伊耆氏之蜡也烈山氏之子柱本為稷而周人更用棄禮且有若是者明堂位載魯有伊耆氏之樂而周官籥章掌豳籥者鄭玄又析豳風七月一詩以配之或祈田祖或樂田畯或息老物籥豈伊耆氏之葦籥者乎自秦始置臘漢魏之間二禮並行魏髙堂隆曰古之王者各用其五行之運盛者爲蜡終者爲臘及陏開皇乃停十月之蜡而但行十二月之臘唐貞觀𥘉因之前以寅蜡百神夘祭社宫辰然後臘宗廟近世則蜡臘又特通行扵一日矣夫以夏正十月周正爲十二月由周夏之正所建不同卒致蜡臘之禮相襲無别吕不韋月令孟冬之月勞民休息臘先祖五祀鄭玄注曰此周之蜡也然而蜡之爲蜡未甞及先祖五祀豈秦制巳混之乎扵乎大蜡之禮廢矣記禮者尚存其祝曰土反其宅水歸其壑昆蟲母作草木歸其澤樂則無可􅊲者欲𥙷是無益也雖然載芟良耜聖人之經巳吾猶後世之復古者𥙷焉庸不有土皷葦籥寂寥之末音者乎遂從而録其辭於穆泰鴻俶降嘉糓神莫帝隗肖靈之鞠經營標野改薦腥熟沐哉恤兹億載䝉福先嗇一皇監下民云胡其穡篤生厥􅈱克用封殖恊風鳴條壚土癉發嘉承天常式保爾極司嗇二倬彼田畯人遭阻艱茅蒲襏襫銚鎒以完率育稚耋告成萬寳越睊乃粒我王之造農三我田甫田我行畷郵翳桑之饁童莠何秋逖惟風后井畫九丘盍不古䖏允兹民逑郵表畷四大㢤者川䟽冩中野稲人瀦波菑暵以雨膏潤畢逮畚鍤具舉豐年穣穣永得我所坊五先王授民兆濬兹洫宿荄旉与胼胝是力從横川􅎌經緯國都自西徂東慎不可踰水庸六自古在昔虔共粢盛有函斯活田穉乃榮晝穴何竊獖牙弗獰莫贙匪武用迪厥成猫虎七玄冥盛隂十月霜雪草枯木凋坏户咸閉祛除妖盭􅗴㓕蠱􅖈暑生寒死不瑕有害昆蟲八田居子黄隱君哀頌辭始予弱冠時從黄隱君㳺隱君諱景昌字明逺世為婺之浦江人自㓜敦樸而開悟及長益通五經諸子詩賦百家之言巖南公嘗一再携予詣隱君質春秋隱君則曰墨守是非𥘉不可以草草矣巳而予授其孫廸學且盡發其春秋公糓舉傳論及三代用正日夜食之辨每言春秋一書自公糓氏口說相傳至漢然後著之竹帛是故經有脫編有錯簡學者上畏聖經下避賢傳訛舛誣漏不敢較也辨用正曰三代正朔改正者必改月數而春秋左氏為㝡明大史推日食則曰當夏四月是謂孟夏而經且書日食為六月梓慎占星孛則又曰火之出也在夏為三月在啇為四月在周為五月而經且書宋衛陳鄭之灾為五月它如晉卜偃因童謡而験晉人之㓕虢又極有以見夫夏周數月之不同矣蔡氏傳書乃曰三代之建正不同月數不改凡朝覲㑹同廵狩承享之亊必以所建之正至扵數月皆起扵寅嗚呼蔡氏之為是說豈欲以嬴秦視三代耶秦史所書冬十月以為歲首後九月以為閏月月建一差閏法不合後九非戌而十月亦非亥矣然而秦人自以端月為正史以十月書於元年之首者大𥘉暦行漢世追改之也孰謂三代類是而伊訓必以十有二月而首嵗者乎辨日夜食曰天之七政日月五星皆動物也而日月且有薄蝕之變春秋據見而録故言日有食之不言所食盖慎之也糓梁言王者朝日日出而有虧傷即是夜食是以經不書日日辰晦朔言日夜食不可以日定也雖然王者朝日則巳見為晝食非夜食矣聖人豈能據所不見而即書之經耶或曰春秋之經無日夜食暦家之算天度必知有日夜食是傳者因經以著暦數也予謂經書日食三十有六後世善暦者推之或有甲乙或無晦朔不聞言有日夜食學聖人之學豈不反為巫史家所笑乎或曰世之登泰山者夜半見海出日當是而食將夜食乎抑晝食乎予謂古人之占天者當晝則測日景當𥘉昏則驗中星自帝堯之分命羲和者此其職矣又何敢以瑣聞雜說而輕議聖經者乎自予當時觀其辨日夜食凛凛不可屈後得巴川陽恪春秋􅊲正一卷言三代悉用夏時不改月數出入絰史無慮數百千言隱君且明其不然乃作周正如傳􅊲章分條析文極多此㝡其善持論者嘗又考古今諸家所賦詩上起漢魏下迄于六代陳陏而止唐以来古體之作一變今體不盡録也間則致書巖南公有古今體樂府之辨曰夫古詩三百篇之外後人所為準者惟漢魏為古體之宗而唐沈宋則始為今體之倡然樂府辭乃具古今體何者漢魏以還言樂府者本是古體及唐李太白宫中行樂辭梨園之伎悉絃歌之特是今體律詩王摩詰渭城歌世以小秦王調歌之又謂之陽關詞復是今體絶句它如古挽歌辭左氏傳所載歌虞殯者雖不可􅊲漢魏之間所歌薤露蒿里則猶古也自唐至今之為挽歌者必以今體五七言四韻為之何耶又如古樂府題胡無人釣竿等篇唐徐彦伯沈雲卿方以五言今體為之河滿子一曲司空文明又以五言二韻為之盡今日之所謂律詩絶句者也此果何耶唐人詩集每有標題古詩律詩古樂府歌引吟行者杜少陵集中獨無樂府舊嘗累讀而深疑之盖夫古人之詩一章一句動合律吕𬒳之金石筦絃播之羽旄干戚與夫唱嘆於工師瞽矇之口皆是詩也何有詩與樂府之别㢤或者不悟且曰此為四言此為五言此為七言此為古詩此為歌行此為琹操嗚呼陋矣此皆後世擬古者之一失也昔者曹孟徳召李堅為鞞舞辭欲以聞西園鼓吹之舊堅以亂離乆廢不悉古曲子建乃不泥古曲之名遂别搆之何後世之言古曲者就題立意若宋齊梁諸人之所為者耶宋齊梁諸人之所為猶若是則今體之拘拘者吾可得而盡録耶欲觀古今體樂府之變考吾之所自録者㮣可見矣隱君晚自號田居子因作田居古調辭九章一章曰耕田二章曰抱甕三章曰濯澗四章曰暴日五章曰候樵六章曰倚囱七章曰聮蓑八章曰醸酒九章曰開徑毎一客至霑醉恒擊莭髙歌超然自得然頗自謂東都名士大夫不欲以文士得名及老猶親自刪𫐠不巳且曰吾耄矣恐一旦即死無以藉手見古人吾又豈得與夫文士齒㢤於乎揚䧺法言書鄭子真李仲元王充論衡書谷子雲呉君髙子真名動京師子雲身為五侯之客仲元非不有隱徳君髙非不有文翰而終以不顯奈之何㢤此殆當世逢遇之不同𥘉不可以士論賢否定也隱君巳矣予故悉䟽其文且作哀頌一篇就以祭之使後人之讀是者知吾之所以哀隱君與夫隱君之所以自哀者矣於乎悲夫頌曰於乎自古皆有死今之死者巳乎可哀方来如秋濤之未息既往類老樹之先摧當其壯年卓落呻吟佔畢聖賢合席迨其晚莭偃蹇浮湛里閈漁釣争隈生而無爵沒而無謚直隱居行義而止耳心之所存道之所統則或前有千古後有萬世内有中國外有九垓予嘗觀其著書成篋揮筆成甕將以竆經而致用猶恐一旦先拘馬填溝壑無以自見扵世眼光流月古音轉雷倐焉榮華兹固不䏻必料其播之簡牘刻之琬琰忽爾變滅抑亦不得必禁其聚為燐火委諸塵埃於乎就君平日之所自論者不待後世而悉験雖使投塚兮赴弼冶銅兮鑄島孰知其學孰慕其材幸而属纊幸而盖棺幸而得塴則終身之願已哀又何猜有肴在爼有酒在盃歴上下四方曽不可以復作盍歸乎来觀生堂銘義烏樓君國禎善醫自闢堂扁曰觀生請予銘夫天地之大徳曰生而我觀其生雖以聖人對時而育物者率不逃乎肖象與形聲誠推其本則民不夭札物無疵癘特在乎風雨之調寒暑之平遂充其技則炎冷迭變燥濕殊施廼欲寄命乎蝱蟲之甲翅草樹之根莖上追苗父僦貸季之神賾下逮桑君秦越人之智精毎䏻洞見乎心肝膽肺之系絡實有以雜䑒乎鍼砭湯熨之重輕我求我醫何異操兵視一身百骸之㑹如國之有政察山林海陸之産則辛醎苦滑猶干楯矛㦸或冝野戰或類防城然則兵本所以活國醫本所以活民而特繫扵我用之能否彼不度地而浪戰不診脉而試藥者亦徒使夫天人之交戾龍􅍑之妄争是固未足以以究夫觀生之易而盡彼衛生之經猗歟樓君㓜通難素長識運氣遂以醫鳴居藥在􅍥蓄書塞楹吾然後知夫周秦邯鄲之所貴者悉踵扵户而無遁其情矣義烏樓君玉汝墓碣銘并序義烏樓君玉汝旣卒予􅈬其家求書子光亨出學童識字一編請予序曰凡盈天地之兩間者莫非物也史皇倉頡始制文字而正名百物天下之物舉之而無窮故古今字書之學亦與之變而無窮形聲事意轉注假借音同字異音異字同雖自一起而成文極其變或至扵什伯倍蓰而不止兩漢之世悉隷小學學童習之罔有遺者晉魏以降士不師古而俗書僞學之日勝造字偏傍點畫亂讀字䡖淺重濁盭小學學童識字日少渉事日踈造理日窒馮私臆决傎倒錯遻或以目前近事幾不名六畜幾不辨菽麥况天下之物可舉者若是之無窮哉嗚呼弊也乆矣盖今玉汝頗以暇日輯古今字書尤注意音義聲韻訓詁同異題曰學童識字是雖未足以盡繼古小學然皆精緻可傳予盖序是語巳復還其書光亨泣且請曰書幸序巳墓上之碣獨未有表者敢重賜以銘按君樓氏諱有成字玉汝世為婺之義烏人曽祖昺祖琰父建中咸業儒君自宋季早以善詞賦有聲會江南内附而君遂老家居教授江淮提舉司聞君名􅈬檄君無為路儒學學録君竟以不覬聞逹卒家寔至順元年冬十一月十八日享年七十八配童氏子男四人長曰則仁次曰扵義次曰彌老㓜則光亨也孫男十三人曰慧曰用曰性曰韶曰祐曰武曰行曰善曰與曰玓曰瓅曰珍曰璉曽孫男六人致寕致康致愷致中致和致悌光亨䓁即以卒月三十日葬君于智者郷梅口山之原自墓去家不越百舉武而近予觀宋季以来東南學者多承故家文獻之遺彬彬間出而義烏何茂恭喻叔竒兄弟最爲翹楚曾未百年文墨寂寥簡編零落可以使人長嘆而扵邑者光亨毎言君輯古今字書年巳衰耄然猶日夜發聖經賢傳諸子雜書而誦之随得随抄遂成卷帙嗚呼其老且勤也若是豈冝使之泯沒無聞㢤是可銘巳銘曰有嚴斯栽有瀐斯瀦誰歟窆者曰老一儒妥爾魂魄仞爾室廬爾嘗爾烝子孫靡不承淵頴呉先生集卷之八
