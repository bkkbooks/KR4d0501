一元不汝體萬蟄安能醒自今彂孔璧兹欲論漢廷春秋紀災害河洛㩲奧靈日星夲照耀川嶽恆流停奔騰狗吠野播蕩鯨翻溟于丗或間有匪天誰所令天功巧旋斡聖造務德刑勾萌草荄甲氄􆈯鳥羽翎和風足氣運化景多年齡私疑彼磬錯否者此鍾莛徴冬即花綻羽夏因雪零隂陽特揮霍律吕暫聽熒毋庸緹室琯便叶茅階蓂嗟豫偶撫卷默坐但空廳亞歲肇曆數祥雲滿郊坰羲和不可作蠧蕳猶餘青董生尚爾溺霆也吾鎸銘大食瓶西南有大食國自波斯傳兹人最解寶厥土善陶埏素瓶一二尺金碧燦相鮮晶熒龍宫獻錯落鬼斧鎸粟紋起點綴花穟蟠蜿蜒定州讓巧薄卭邑鬪清堅脫指滑欲墮凝瞳冷將穿逖哉賈胡力直致鮫鰐淵常嗟古器物頗為世所捐襆衫易冠衮盤盎改豆籩禮圗日以變戎索豈其然在時苟適用重譯悉來前大寰幸混一四海際幅貟縣度縛繩絙娑夷航革船鑿空彂使莭隨俗混民編漢玉堆櫝笥蕃羅塞鞍韉城池信不隔服食奈渠遷輪囷即上據鼎釜疇能肩插葩奪豔冶盛酪添馨羶當筵特見異博識無庸詮藏之或論價裹此猶吾氈珊瑚尚可擊磧路徒飛煙彼還彼互市我且我杯圈角貒獨不出記取征西年時儺古人重儺疫時俗事繪禳歲陽欲改律輿鬼䆮耀鋩厲神乃恣肆魃􅈮併猖狂侲徸幸成列巫覡陳禁方􅍑頭眩金目玄製炳赤裳桃弧驅災沴豆礫斃疸剛八靈悉震懾六合髙褰張清寧信不害動靜維吾常丗塗頗險盩人魅更跳梁狐鼠戴介幘夔魖竊香囊煎熬到膏髓擊剝成疕瘍乘風作國蠧抵隙為民殃自從九鼎沒誰使百怪藏瘃寒服禠帛飢窶食閉糧蘆花敝汝體橡栗饞吾腸地膚竟捲去天孽俱凋傷神荼欲呀啖蟠木蔓不長蒙倛強顔貌枯竹無耿光聖言謂近戲五祀徒驚惶惜哉六典廢述此時儺章歲𥘉喜大人回自嶺南遂携兒諤北行送之乍喜吾親返還携稚子行風沙千里道雨露九重城舊帆江潮逺新裝嶺瘴清長秋官屬盛去可接簮纓此去知何處飄然惜爾年塵飛馳馬埒雪擁讀書氈日觀躋攀外雲臺獻納邊文園寧久病要奏上林萹溪行望故友黃眀逺槐塘新墓往代衣冠日已賖故山棺槨此為家經荃義闢中州魯樂調辭譏下里巴涕淚無從餘宿草文章可惜等風花嗟兹便𣣔酬雞絮目駐前溪有落霞嶺南宜濛子解渴水歌廣州園官進渴水天風夏熟宜𪷟子百花醖作甘露漿南國烹成赤龍髓棕櫚亭髙內撤餐梧桐井壓滄江乾柏觀金莖擎未濕藍橋玉臼搗空寒小罌封出香覆錦古鼎貢餘聲撼䆮酒客心情辟酒兵茶僧手假侵茶品阿瞞口酸那淂梅茂陵肺消誰賜杯液奪胡酥有氣味波凝海椹無塵埃向來暑殿評湯物沉木𬗋蘇聞弟一嶺南六祖禪師菩提樹下藏髮甕子圗歌蘄州黃梅峙佛場新州獦獠識水香菩提樹間好宴坐五色頭髮騰毫光金刀剔落受法戒瓦甕瘞藏傳不壞捩廽萬夫矗梁棟陶冶千聖掀爐鞴南海標來剎十圍北宗望斷六銖衣塵鏡本空空即夲風幡非動動還非山僧禮拜山鬼護一花五葉開如故寶縷青懸雪嶺煙神珠紺結丹丘露世人長物合剃除謝公枉矣施髭鬚唐年畫筆石未泐大鑒壇經誰讀淂夜聽李仲宏説廣州石門貪泉大粵控南海茫然天地陬石門屹有限巗瀑蓄為湫何哉清潔名坐與貪濁侔使軺一杯飲蠻賄即繭抽金珠混寶蛤孔翠爛相繆烏文映呿陀器物窮雕鎪㓟鬐蛟龍悚織毳乕豹愁島嶼刮欲竭民夷起爭仇聖王不忘逺姧暴合汝郵靈若尚嗇貨惡風無時休饞波半杯杓渴沫萬戟矛氣機乃日變棓克非人謀私疑勢至極實尓釁所由妖巫挾左道洞獠稱豪酋支祁妄解鎖蝘蜓怒翻舟人鮓或併命吏商豈良籌逝將尋泉源纎滓忽不留復思漱泉瀨粗穢悉以􅪜洗除昆崘窟疏瀹渤澥流一塵了不動六合嚴如秋嗟吾此身小幸獨為國憂從兹斥聚斂矧彼畜羊牛馬援空薏苡王陽但衣裘百世不易操嗚呼我賢侯北方巫者降神歌天深洞房月􅃮黑巫女擊鼓唱歌彂髙梁鐵鐙懸半空塞向墐户疏不通酒肉滂沱靜几席筝琶朋掯凄霜風暗中鏗然那敢觸塞外祅神喚來速隴坻水草肥馬群門巷光輝耀狼纛舉家側耳聽語言出無入有凌昆崘妖狐聲音共呌嘯健鶻影勢同飛翻甌脫故王大獵處燕支廢磧黃沙樹休屠收像接秦宮于闐請騧開漢路古今世事一渺茫楚禨越女幾災祥是邪非邪降靈場麒麟𬒳髮跨地荒天台山花蕊石茟架歌天台髙山屹蒼空山神染石填青紅良工琢之手運風閣我綵茟虗玲瓏勾芒香動上膏彂蓬萊髓流花作骨一雙粉蝶迷宿魂五色斑龍蛻幽窟古硯南披黯淡灘摩挲鴝眼映豬肝低窺墨池渤澥碧仰倚書鎮嵩峰寒滿案層巒何處所宛陵老兔論功緒錦繡心腸吐有雲莓苔面貌凝為雨翰林學士花生茟亰洛新來花樣出浮花浪蕊一掃間嘆息揚雄白我玄題南平王鍾傳酌搏乕圗南平酒行山險巇日暮猛乕相抱持㒒夫辟易不敢近雙手現出十狻猊口乾大喊眼光爍腰無寸鐵起徒搏沙飛石走風爪牙草折林摧雪齦齶人強獸勇盡力爭形格勢禁過用兵英雄變化動霹靂冨貴逼拶收欃槍老羆當路叱貉子指揮六州稱刺史摩挲乕鬚淮甸鬪啖嚼虎膽閩城靡少年本是貧少年狂卒成功等醉癲盜應有道幸竊柄王竟不死還橫鋋一時豪特誰與畫千古畫圗専足戒投弓棄箭浪紛紛馬上愧殺裴將軍題袁子仁所藏巴船出峽圗巴山一帶髙崔嵬巴江萬里從天來前夫疾挽後夫摧黃牛白狗遽船開曉風東回水西上淫澦堆頭伏如象盤旋鳥道怕張帆汨沒龍淵驚掉槳世人性命重濤波吳鹽蜀麻得利多怪石急流須勇退貪夫險魄謾悲歌神禹釃江江更惡五丁鑿路空巗崿舟船可坐尚髮危棧閣能行終淚落嗟兹舉目無不然直愁平地即山川至喜亭邉聊酹酒長年三老好攤錢觀唐眀皇羯鼓録後賦歌上皇天寶全盛年花奴抱鼓踏御莚頭如青山屹不動手似白雨敲圎棬大聲嘈嘈忽放肆都曇答臘矧敢前小聲籠籠復嘌殺耶婆色雞最可憐風吹宮墻欲罷笛月照邏逤徒揮絃纎蘿不起見秋爽萬杏爭彂催春妍雅琴清商却尓叱蕃部坐伎還相宣招來燕薊有臣盜打破河渭無人煙古先聖人本淡薄堂上堂下俱宿縣音和氣順遽感召鳥獸率舞殊蹁蹮後世辟王寖靡靡朝歌北里因師延迷魂淫思苦宛轉鍾磬𣪚亂終沉淵吁嗟西亰正宸極騁望兩海際幅貟金甌一缺遂不輔寶鼎大震幾于遷心貪音技日蝕甚坐剷藩限空茫然一時戎夷共祍席滿耳鼓樂皆戈鋋宋公守正好宰相魯山花瓷聞獻􆇤百年治亂總由天羯鼓遺聲傅不傳觀陏王度古鏡記後題王家有古鏡軒氏昔鑄成太一來護冶玄冥與儲精日月鍾璀璨龜蛇助威獰萬靈吐真水全體洞泰清綵奩出未半冰片弄光晶寶匣收不動玉鱗聞詬聲有身尚變化無翼欲飛行恍然百世後流落汾隂城髙士觀即賞胡僧識還驚金鉛拭膏澤絳碧穿屋楹墻垣照可徹臟腑爥能縈涕泣念鸚鵡悲酸逢豹生一朝忽屏迹六幕黯不眀狐狸遞隱現魑魅莽縱橫皮膚峻刮削骨髓窮𫾣榜雷風儻有作厲虐敢紛更嗟吾幸居山猿鹿與我爭嗟吾願渡海鮫鰐恐並迎楊氏雀環在張公龍劒并因兹訪洞穴淂不振冠纓葉天師松陽卯山石螺子歌松陽卯山屹嵯峨滿山靈蚌攢蜂窠化生形摸但土石融結渾沌空江河天髙地老忽古色海漲桑淪千載黑蝸兒舍窄雨含漿螺女泉枯風隕翼岷峨劫灰本島湄上黨亂殼寧流澌依俙巗妖弄伎倆想像洞乳堆蛟螭元造出生還入死百萬裸蟲那淂似神仙道術徒銷解螻蟻烏鳶盡殘胔嗚呼靈蚌定終天葉師法筵尚幾傳問何不種丹丘不死草人世食之無死稿觀淮隂龔翠巗所修古棋經淮隂老人古棋經廣陵大幕青油廳一江對壘靜晝日三楚結陳鏗流星東南賓客少馳檄白黑紋楸即強敵坐隱縈廽建旌斾手談劈䃗藏矛戟世間風雨長百變身佩安危知幾戰昆河割破半藩籬漲海掃空全局面樂矣軍中有此娛攻城掠野類兵書宫殿寢園終草莽冕旒章服到鮫魚君不見驪山婦姑三十六破屋數間昏不燭夜來教淂王積薪滿眼長安胡馬塵觀唐薛調劉無雙傳戲作劉無雙歌劉家無雙妙春華雙眉楊栁臉蓮花父母衣裳惜不嫁黃銀蹙繡鴛鴦紗涇原軍動霜創起灞滻塵揚奔騎止宮闕廽兵掃荆棘掖庭數罪輸桃李富平押衙老有心句曲道士藥如金氈車開幕望陵樹綵茟襞箋聽苑禽一時刎頸空來送中路贖骸還掩慟收魂召魄秦地愁詭姓藏身楚鄉夢古今俠者天下聞當風瀝血即功勳手摽長劍重死許薄命佳人淚零雨東夷倭人小摺疊畫扇子歌東夷小扇來東溟粉箋摺疊類鳯翎微飈出入揮不停素繪巧艷含光熒銀泥蚌淚移杳冥綿屏罨畫𣪚紅青皓月半割蟾蜍靈𬗋雲暗惹鮫魚腥徐市子孫附飛舲奝然家世雜𣑽經文身戴辨舊儀形對馬絶景兩浮萍殊方異物須陳廷富賈巨舶窺天星祝融噓火時所丁島濵賣箑送清泠白龍浸皮暑欲醒玉階涵水夜撲螢蓬萊仙人降輜軿扶桑繭絲結綵綎祖洲芝草釀緑醽穹龜巨黿動遭刑海神惜寶轟雷霆鄙夫卧病臨虗扃蒲葵百柄稱使令冰漿蔗液但滿瓶石榻𬒳髮氣自寧新羅一念終飄零塗修雉尾吾何銘題晉劉琨雞鳴舞劒圗我行洛陽大道邊一雙蒼鵝飛上天惜哉春水御溝去化作胡兒飲馬泉前山雞鳴夜𣣔半古劒隨身舞凌亂白光􅍑躍騰雪霜神氣龍蟠貫星漢望中沙漠衣正寒舉手傎倒髮衝冠鹿盧蹻動即千里蘭子戲成徒七盤人生豈無志事往僅有淚疲兵獨困守劇虜翻強鷙孔融才踈不足多袁紹衆盛空黃河代公土地仍同患假國風塵謾助戈世間壯士但老死凍鐵沉理何處使千秋萬歲青金虬恨不鑄淂劉并州讀書我病久不出滿床攤我書困仍枕書卧醒即味道腴上下千百載纍然猶貫珠夏啇既相因秦漢漸不如辭華日已勝理義幾精粗但要務真實何心成蠧魚古人有精力常𣣔開廣塗聖文尚埃滅鉛槧寧復餘誰歟志氣鋭或者事功趍數行史家紙隨作黃土墟吾誠不及此矯首歎以􅒣撥書置床上所愧為世儒飲酒昔我不解飲病來持一觥一觥亦巳醉二竪敢相攖忽然秋毫大况乃泰華輕豈其隂陽足妄使龍乕爭氷蠶氷為山火鼠火烘城一元本同氣萬物却異情機關有大運稟受通群氓轉移苟不定顛倒尚何營百年定幾時愁賦空餘聲跰􅓷起自鑒面目吁可驚試攀松樹枝復攬芝草莖但當盡此酒不在學長生黃布幬歌吳中女兒工治莎織成黃布輕綺羅裁為黃幬四角起覆我病體清涼多平生受用白木碗人參草席團花錦長吟或似間攻戰大隱全勝好官品上天下地我中央昆崘海水瀉四傍南通炎丘日色熾北委寒壑凝冰霜彼哉寒凍此炎燬穿透皮膚蒸骨髓招徠獨鶴風有聲掃退群蚊月如水流金爍石况可逃磨牙吮血尚呶呶心煩欲待竹奴尉背癢詎淂麻姑㧓我曽無術蔭天下天如穹廬蓋四野困來一覺少行人夢過十洲猶走馬君不見黃布幬昨日夏去今日秋珍重少陵詩語在微軀此外更何求夜觀古樂府詞憶故友黃眀逺眀逺曾作樂府考録漢魏晉宋以來樂歌古詞憶昔黃君美如玉老屋青燈雨間宿起翻案上竒佹詞前後千年樂家曲豫方弱冠學謳歌去問詩騷法若何偉兹欲繼三百五他盡蝦蟹此蛟鼉就中齊代及秦楚巾拂鞞鐸爭傳譜清商雅部粲然文騎吹簫鐃雄者武心力涵泳到手力抄撮來口力有白醭目力無纎埃時時弄筆便著句花木禽魚古今趣北岸垂綸楊栁枝東鄰著屐櫻桃樹自此相逢二十春一朝門巷閴生塵淺殯蓬虆凍蟻嘬荒廬寂寞妖狐嚬人世夲無金石夀蕳編零落安能久藝文著録數百家一二僅存誰不朽一二不朽終峥嶸歲逺寖恐山淵平嗟君尚愛古樂府夜半松風知此聲觀唐沈玢續仙傳手展仙書向此朝起豫俗病對芭樵室間半夜雲璈動嵓縫千年雪髓消間説茅龍騎太白賸聞木鶴降仁嬌秦車漢輦窮天下望斷蓬萊併寂寥華山仙子𬗋絲盛露囊歌華山西望屹蒼空甘露曉降柏葉中紅繡絲囊挹在手赤松鶴馭翩長風太平天子千秋莭花萼樓前百􅜠撤黳珀含光映凍酒𬗋霜結液涵甜雪問囊經緯何所成桑洲蠶繭五色眀問囊噓吸何所似柏觀銅掌抗髙莖誰歟獻螢弄輝霩或者貢雲合溟漠神仙可學僅沾濡壽祿無期還笑樂古來服食乃若兹一掃穢濁餘肝脾啖蛤踞龜何處覔伐毛洗髓到今疑秋月泓泓露泚泚華山玉漿起人死彼哉醉胡彼渴羌朱顔緑髮安淂常諸暨張敬仲家有太一真人蓮葉舟及海上人槎二畫軸胡允文題豫亦效作二首寄之華山青蓮搖上清白玉巨藕浸碧泓太一真人來降精黃鬚紺葉浮滄瀛手披素書悄無聲坐喝眀月逆雲行蓬萊駕羽飊風輕宛渠乘螺島雪縈芰荷裳衣挾仙瓊魚鱉媵御神媧迎大遊小遊按層城君棊臣棊鎮威獰九宫五福莽縱橫祠官修爼靈爽呈閟殿留鎖光嶽爭欃槍遁芒天路平蛟龍捧跌溘上征卯金校讎欎萬嶸藜杖吹焌奪目睛扶桑暘谷曉曜頳龜臺石室暮飛霙東公西毋擁回旌望中滅沒曶若驚海祗稽首西南傾曷不從之學長生琅琊臺上望海門西厭澒洞尋河源神濤八月吐復吞靈槎萬里擁蛟黿風號雨蝕硬輪囷苔葑枝莭蟲蟻根海人愛竒踏飛掀瓊纓玉辨秋􅌭翻乾糒熟脯歲饔飱黃龍叱作蝘蜓奔天吳拔首懼却蹲前竀倒景放光燉髙攀鐵鎖拓藩垣彼牽者牛孰烏犍彼織有女孰嬋媛箕斗龜鱉蕩若噴雷公霹靂慘無魂老石支機類瑶琨客星犯漢極怪惛周伯蓬芮𩔶劫存剛飊浩氣蕩尓痕上帝馮怒罪厥閽叱下直瞰扶桑􅚐蜀莊大笑手欲捫及早來歸到昆崘憶寄方子清時子清久留吳中一别嗟何處相思撫舊蹊月眀施瀨圵雲起蠡巗西跋涉舟車動過從笈篋携鄰光因借燭道味肻吹虀好學螢分照論交鷹擇栖丘園心薜荔海國氣鯨鯢卷帙籖翻蠧謳吟硯彂黳經筌參老易樂府録鐃鼙治法推周稼淳風仰漢綈談玄知野馬考字守家雞土域標鞮象天圗辨輝鐫遺文多廢墜妙契極端倪獨樹盤桓久平蕪眺望低霜林紅玳瑁霧雨碧玻璃屏迹依狐兔銷愁對鷺鷖塵書投𣑽夾美餉挈童觿槲葉時遮洞藤梢或罥溪龍居瞡雪瀑乕路躡霞梯出入恆聮𬒮追隨幾杖藜竹山香嶺嶠花島繡湖隄尚義開黌始延儒振席齊生徒修棗䀯祭品授𦵔臡錦石看還數蒼松倚却題吾伊朝屢集渾灝夜同稽自謂菖為歜人疑榖似稊中悁真抑鬱外物總筌蹄歲序空流邁濤波益慘悽故𫀆寒擘繭雄劒滑膏鵜緑映牽帆水紅黏曳屧泥娃宫叉鈿拾甫里茟床齎鶴市歌喉引鱸鄉鱠手攙吳趍誇粉黛越産購珠犀富業連橙圃災霖潰稻畦占歸仍浩渺結客重酸嘶彼此身如寄參商夢欲迷蓬飛甘掃軌桂落得通閨俠眼收丹電仙襟化素霓貧期金埒騁賤許玉階躋病矣長憂痼間哉敢恨睽揃除須尓鑷磨刮更豫箆本欲睎王貢兹猶慕阮嵆猖狂疏奏櫝軟弱謝耕犂習靜求神悟超群畏俗擠清琴桑有鯉巨弩跖非鼷教駕傳銜轡觀隅識橑枅鋤芝黧受謫抱璞跀聞蹄性命緣窮鬼功名屬嬖奚悠悠鸞與鳯泯泯鹿將麑白谷今安駟青霄古執圭毋寧枉隱逸􅉝苦等黔黎碗珠伎碗珠聞自宮掖來長竿寶碗手中廽日光正髙竿影直風力旋空珠勢側當時想像鼻生蔥宛轉向額栽芙蓉筯頭交筯忽神駭矛葉舞矛憂技窮昔人因戲存戒懼後人忘戒但戲豫漢朝索撞險還愁晉世杯柈危不窹徘徘徊徊奪目睛欹欹傾傾獻玉瓔滑涎器從龍堂出輝穫禾火命與鬼骨爭君不見王家大娘材藝絶勤政樓前戴竿折市人歡笑便喧城驚動金吾白挺聲宋度宗御書福王慶夀宮扇漢家諸侯奉大統會稽故恤王封重歲周甲子夀筵開賔客滿堂宮扇來掖庭嬪御侍圗史聖茟逡巡鸞鳯似清風外撲龍阜花眀月中涵鏡湖水南國為家日巳微禮官考禮是邪非前殿君臣朝玉笏後宮父子曳珠衣火德盛時尚有扇金商振處無兵戰兵頭老鐵化降雲扇底生綃沾淚霰自從一葬息婦原恨身不見孝崇園越州司户眉勝雪舊篋凄􅋽那忍説方景賢宋景濂夜坐觀吳中雜詩遂及宣和博古圗為賦此壯歲何心老一􅚨東遊飽食有江鱸詩宗鶴膝蜂腰體禮象龍頭豕腹圗三士操琴知爾逹八公遺藥忍吾臞吳中勝處多朋故話盡寒宵燎葉爐寒夜憶吳伯雍摘阮寄歌錢唐吳肅善四絃始平太守舊曲傳晉人風流百世後鏗我手指抱膝前鄒嶧孤桐斫美玉神螭拔首蟾嵌腹檿桑繭韌氷色絲孔翠翎敷錦香褥一摘再摘秋風微三摘四摘秋月嶺頭輝五摘徘徊南國泣楚女歎湘妃六摘揄揚古調韶咸象聽來稀七摘八摘復九摘乾旋坤回群龍百怪盡屏迹髙如海門潮水飛劈𩔶逺似天河瀉出大荒零數滴驟如昆陽戰鬪犀象乕豹股栗亂投橶緩似句曲燕飲雲璈洞簧宛轉降瑶席恍兮清角惚流徴騶虞伐檀鏘以起悽兮􅕭鐘憀韻泉折楊黃花空嗑然信哉阮咸出入琴琶造此法豈用蓬萊海上艤棹萬里求成連妙得伶倫律吕玄中玄粵從東都官大豫洛陽焚燒到鐘簴杜夔柴玉各有主宋識擊節餘歌舞西朝荀勗親校來杜夔舊律多不諧阮咸却趍太樂論新律樂莭髙厲民風哀當時謂咸神解勗暗解土中玉尺短一米古來成均雅樂竟沉沉幸爾故冢阮琴傳到今嗚呼今樂與古樂辟雍老儒悲絶學桑濮巴渝日巳繁翕純皎繹俱綿邈南風久不生鳯皇久不鳴斂君四絃我耳清天下耳根無正聲淵頴吳先生集卷之二
