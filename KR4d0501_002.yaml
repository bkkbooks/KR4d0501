front:
  text: 淵頴吳先生集卷之二門人金華宋濂編
  hash: sha256:2adfb6d31a204c638b337fca84967a2574d098dd84aaa3be4d7297af411f6720
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_002-1a}
body:
  text: 觀孫太古周天二十八宿星君像圗大圜杳何極鼇柱屹不傾日月光最耀衆星莽縱橫周天二十八錯粲各有名荒哉審厥象晃奪目睛東垣青龍崛西圉白乕獰翾飛鳥隼狀偃伏龜蛇精𬗋宮自然拱銀漢無復聲五行所經緯甘石知性情上界足官府神人居穆清韡曄逞幻怪顤顟振鏗轟跳踉鬼腳捷舑舕獸面頳裳衣互裸襲角鬛紛披鬇豈其太白變嬉戲類孲嬰或者熒惑動威怒流欃槍照臨多芒角躔次在縮贏揣摩過人料綵繪匪世程伊誰駕一氣得以導九坑想像陵倒景觀遊撫澮城虗空何宮宇蒼莽孰莭旌毋寧秉筆際溘此埃風征凡夫本狹見四顧惟寰瀛夜義冰澨呀羅剎炎徼瞪鮫女賣綃出狗夫㗸筯爭祗疑列宿質却混殊方氓山神對我博刻石華山陘海神靳我畫浪捲滄海鯨天神詎可識萬古欺聾盲星占丗有職畫史吾奚評病起讀列子沖虛至德真經雜題八首太虛無停運萬化總一區機鈴妙出入氣質敻然殊春鳥春花艷秋蟲秋草枯榮華豈我有變滅僅須臾彭殤何夀夭堯跖孰賢愚生年甘肉食死骨委鳶烏吾知形骸在坐此力命拘扢扢焉得已悲哉天地爐世間豈有極海外猶齊州日月更出沒江河却同流本娥追即死章亥步曷周蠓蚋生不久鯤鵬背吾遊神瀵湧滋穴巨鼇戴蓬丘想像或可到徘徊獨懷憂南方祝髮祼北國鞨巾裘逍遙特爾分智者善自謀黃帝居大庭華胥嘗默存穆王望西極肆意遊昆崘虗空乃不閡夢覺絶無垠感變互起滅精神遽飛騫魯儒久迷錯周役恆囈昏蕉鹿真未辨爥龍妄相燉古莾多睡眠阜落但步奔幻化自來往至人寧汝論世人有至巧何者能自然作邪出技藝行險弄機權孔周神劒光偃師舞倡妍泰豆計木塗甘蠅觀蝨懸氣鈞但一􅚘物化匪吾鎸洪纎各以正動植悉根天公輸制雲梯墨翟獻飛鳶微矣執規矩彼夫惡得賢神巫善相人壷子如濕灰扁鵲巧發藥季梁病弗治一形苟脫落純氣固委蛇隨火出石壁泳珠沒淫隈彼或蜩翼得此猶漚鳥疑中心既怵殆外物盡坑溪幹殼即木葉皮膚類嬰孩逺矣列姑射吾為榮啓期古人合神物螭魅􅊖將迎蟲蛾亦麇至鷹雕即旗旌分廬通異類禽獸解音聲牧正得乕心狙公識狙情羲農狀牛蛇聖德泊無名廉來挾犀象暴行恣狺爭淳澆日以𣪚物我兩相驚後世自魚肉傷兹橫目氓大道無崛曲多岐竟忘羊窮通偶然值倚伏焉可防枯梧元若險白犢詎非祥棄車儒著盜墜鼠俠攻倡情欲心不滅宦婚迭相攘君臣道未息服食􅔡奔亡日暄疑狐貉芹枲勝肉梁宜哉爰旌日喀喀死路傍此日忽過隙居人恆鮮歡毫毛􅊖為我體莭欲求完大盜竊名爵小廉捨豆簞熊魚徒兩得利義肻兼安馬醫自不辱燕技毋庸干時勢苟未至事功良獨難蕭條白麻履慘淡青蘚冠長嘯答鳴鶴北風江水寒送鄭獻可南歸莆田寄周公甫自昔道術本一原後來雜沓乃異轅粵從西漢始立傅獨守章句稱􅌹門唐人疏義不改舊宋代理學交相敦吾知衆儒此間出遂指濂洛為雄藩當時莆田有先達信爾夾漈好弟昆彂揮聖賢本根殖評駁遷固枝葉繁典禮會通尚可志儀章器數疇能言居然韋編塞篋笥旋用束帛徴丘園惠施五車却狹隘方翔千櫝徒飛騫公車奏上欠大用屋壁藏在傅諸孫世家相承幾譜系宗庿所重真璵璠馬圗隂陽太極祕麟史衮斧天王尊文苑儒林各突奧父風祖德猶光燉一朝便簉列宿次何事敻隔勾陳垣歲晚東遊幸我接江城極論餘空樽海上山川恍可到閩中耆舊嗟無存考亭過從即闕里麗澤講習或艾軒至正須求汝墨斫大和定許吾箎塤微飊翾翻剔橘蠧積霰呌嘯招梅魂别懷未盡苦竹雨歸路亟趂扶桑暾周君故人我同病名郡重席特爾溫尺劍母令𬗋氣隱寸膠曷救黃流渾子魚舟通牡蠣浦丹荔樹暗桄榔村摛箋送客復有憶卓矣人物撑乾坤新得南海志觀宋季崖山事迹故國今安在新營忽此山藩王收未燼義將扞邊關典禮存周法威儀復漢班開衙旗幟動結寨舳艫環莭制通江邏槍牌集洞蠻瀧濤多擊磢嶺嶠半榛菅置陳移官港惟宮泊女灣狗流疑尾掃龍殞莫髯攀奠殯須求繼驅馳獨任艱搶攘殘戍屋殺僇罄居闤玳瑁洲仍隔珊瑚島併跧乾餐烓竈減鹵飲轆轤慳道斷無前援民哀有老鰥颶掀雲赤暈鯨鬪雹朱殷大業從舟盡元戎棄仗間炎丘朝服襲貝闕御弓彎􅉏僕隨冠冕嬌嬰泣劒鐶駃騠衝柵象精衛避籠鷴敗氣徒延湍英飊欲起孱一沈知有決再縛懼何顔去矣曽青蓋行哉彼翠鬟城危嗟唄閙井辱痛脂斑出督空懸令廽軍却算鍰蜀瀘家失奧襄漢國忘􅗚月照丹心苦風楊白骨頑諛儒輕戰勇穢史進降姧世逺神終在天髙淚或澘綺羅歸北府疆理混南寰毒浪悲潺內煙氛蒼莽間一時磨石處萬里凱歌還早秋偶然作寄宋景濂我病三月久問言此何時山林日搖落草木欲變衰忽來臨青鏡何故摘白髭千里復萬里逺哉鴻雁期去年憶吾父羇客在廣州今年憶吾父官屬大長秋漢宮戒服御周典進膳羞惜兹不得去目斷五城樓西風吹梧桐一葉兩葉積故書翻有塵雄劍挂在壁時非合窮困事到即輝赫除却雙鹿行門前少人迹故人三兩人江北久羇旅尋香古徑風步屧修廊雨􅐜鱸最有味稻蟹紛難數我欲往從之蠻潮正掀舞悠悠秋夜長夢覺秋月霽有材寧及人無學敢求蛻揮來河水絃削作泰山礪吁嗟祁孔賔得失毫髮際士欲知自重今人猶古人馬卿志封禪揚子述美新當時文字間萬丗寵辱伸董京不可作愁絶麟乎麟北山有古寺修竹炎天涼蛟龍踞兩澗鸛鶴鳴層岡心臺月照白鼻觀煙通香可思未可到詠此招隱章陳生愛神仙百日常病十手攀琪樹枝口誦蕊珠笈山衣縱橫披石廪傴僂入何如一尊酒自解憂思集自來間作詩瘦島與窮郊瘦將闕粱肉窮或潛榛茅水流苔間石花亞竹外梢聖愚總灰滅何苦彂笑嘲往者東入海飄然任所如大風戕波浪飛雪灑舳艫壯志昔尚少狂遊今併無誓登盤陀石重望扶桑墟泰山髙寄陳彥正泰山一何髙髙哉極青天世人欲上不可上層巗峭壁徒攀緣望中絶頂路巳斷石穴上出鐵鎖下絙𩔶趢相鈎連誰歟愛竒者步步喜若癲一心不顧死隻手捩長煙毛群驚回少乕豹羽族跕墮多烏鳶浩氣剛風搏結虗空作世界蜚龍捷鬼鑿開混沌巢神仙道逢四五叟含笑使來前黃冠皓髮傲凡榻野菜素粥鋪盤筵自非爾願力何計此留連當知仰扣曖昧雲霄有頂處淂不俯懾嶄巗箐棧無窮淵嗟兹大凡夫行尸走肉真腥羶假䂮思家最可惜李紳戀俗終難鎸舉頭告神人苦乏風馬與電鞭藤蘿束縛即縋下但見松柏櫹槮數萬仞石􅏢突屼橫戈鋋古來秦漢東封不到此惟問梁父併肅然日觀嵯峨恍在下蓬萊浩渺空樓船彼云鯨可射此謂狗能牽安期羡門一往不復返文成五利受寵驟貴祈長年仙人自有真至道何由傳逖焉龍漢延康紀去授金璫玉珮萹胡仲申至自豫與子别三載不幾見白雲日髙飛恍若覿子面我病久不出衡門寄函敻子來尚豫思嶺路踏蒼蒨當軒坐甫定笑語起我倦新文十餘萹茟墨擅百錬口傳彂秦壁竹簡鑿晉竁考論無差爽風雅有正變丗􅚨弄俗學雅曲極熒衒群羊雖冒乕草恱豺則戰誰其制橫潰或者􅪜瞑眩牛毛獨不多麟角時一現朝廷方太平炎海忽馳箭人材需更急巗谷遽乘傳終然務涵蓄可以待推薦問子古丈夫何人久貧賤首峩逺逰冠雙眼爛如電西上石頭城大江流一線袖中羽獵賦雲氣擁宮殿燕山去子咫萬里障冰霰壯哉子此志我喜手腳旋撫劒為子歌張燈趣豫宴俄其送子歸贈子端溪硯行行恐自今宛轉異鄉縣天霜𬒳四野老馬困蒿菣聖人猶待時中道匪狂狷蠧魚不負子籖架三萬卷我豈奔競從東勞復西燕觀陳彥正觀景拄梜歌山人拄杖手自携滿杖刻畫類土圭春秋星辰本不錯彼啓我閉疇能齊日出扶桑照濛汜南北廣輪定幾里老羲奉駕何太速三足神烏為之使旦朝舉杖向天移插表測景少參羌騏驥過隙不踰晷蟾蜍吐波同報時世間惜把天機泄杖底強稱量日月蛟螭變去甲鱗生霹靂搜來光彩滅自從宣夜無法傳紛然周髀與渾天嵩髙窺候尚一律二極隱見仍分躔日南交愛通海陸海中諸星却未矚雁門寰蔚絶龍沙鐡勒須臾羊胛熟天髙地逺渺眇紘章亥竪亥腳力爭出入安穹足議論絰營鮮洛空璣衡我朝華戎早一統山梯海航萬國共火嵪尾閭侵暑熱骨橋魑魅壓氷凍古今陽城一嶽臺三十六度增減來郭公新製十五表天下日影無纎埃吾知渾天為中國東南海際殊傾側周髀夲因勾股淂昆崘當中標四極茫茫堪輿一氣浮鄒衍九州復九州蚍蜉蟻子託大樹大樹所託終難求嗟哉周渾説未定拄杖在手與日􅔡一行曆術久成書康莭算學知何如觀秦丞相斯鄒嶧山刻石墨夲碑鄒嶧之山在何處始皇立石改名號史籀古文相斯變蛟龍盤崛獨精到自都咸陽制六合曰救黔首烹強暴盩深擅更秦新法繁縟盡剗周未造掃除井田設斗角蕩滅封建廢圭瑁收兵鑄鐻銷凶器斥塞築城斫梟驁當時大開阿房殿萬世永戴黃屋纛胡亥矜慢不改轍趙髙指麾豈謂孝四極巡遊何功德群臣刻頌直羿奡金乕淪亡竟不守白蛇劒死徒驚譟荀卿著書本性惡弟子承學愈言耄古今聖賢使閣束五三載藉遭煨爆越人鳥駭汝苦兵蘄卒狐呼汝召盜宜哉東市得具刑矧痛吾儒有名教太平真君一拽倒枯篁野莾火􅈬燥篆家法妙尚鈎勒棗木字肥略顔貌陽冰石經欲􅑹乳楚金蟲匾猶躇蹈文章諛佞合鎸削茟墨瓌絶強則效小齋客至無寒具眀窗淨几急灑掃後代續刋縱膚淺先秦遺迹信堂奧鵝鼻峰頭不可上魑魅晝泣駭熊豹會尋碣石探之罘乘興去浮滄海棹觀齊謝玄卿五泄山遇仙記寄題五泄山寺曩聞一竒士深入五泄行五泄何處所長溪繞崇岡微風生天籟急瀑灑石梁金磬敻欲響縞衣爛廽光綺妓開朱閣靈仙坐玉堂傴僂即進謁裴􅏆遽鳴璫幸汝得大藥于兹赴玄鄉玄鄉且留宴穢臟勿彂狂髙座瓊輝施碧幃琳華張芝英雜桂腦螭髓間鳯漿太容揮四弦王母彈八琅羽旗素霓騫黼轂螣蛇􅋮眼珠便爽朗肌骨遂馨香日星恍在下海嶽極眇茫嗟豫頗探勝古路但縱橫青童邈不見寶剎屹相望山峰插煙霧潭級跳氷霜螻蟻小窟穴蜉蝣亂飛揚終然雲錦笈照以乕鞶囊千年或頃刻萬里忽扶桑謝卿自獨往矯首盍回翔笑採金眀草浮顔安可常送鄭彥貞仲舒叔姪北遊亰師鄭君系本自義門門首植表孝義敦祖孫九世類一日聚族千指通晨昏酒食巵匜口共飫衣裳椸架身同溫家宜富饒積粟布里或飢窶資饔飱大宗小宗寖以邈東眷西眷疇尋源復除曷下省府令延譽靡間鄉閭言禮俗興衰顧不重風聲勸慕猶兹存袖中懷文扣所部行矣望闕期軒騫燕然何許水陸隔越驛踰月舟車奔鄒嶧邳山岱嶽竦蜀江邦瀆河流渾榆關崇墉峙乕駮碣石漲海澆蛟黿北州塵沙遽萬里天邑氣象雄微垣升平多年正黼扆郡國麇至駢肩跟五柞長楊劍戟接控弦突騎旌旗翻鴻鴈飛鳴羽未肅魚龍變化光相燉世塗人事豈可測儒術政理須攀援嗟豫昔者忝俊造翹足到今勞蘿魂乘時一去欲迅奮枹病日劇徒丘園阮郎竹林夕並秀韋氏花樹春仍繁榮親顯已在此舉惜不往餞空罍樽嚴陵應仲章自杭寄書至賦此答之故舊何懸絶間居欲反招幽并風雪緊楚越水雲遙短褐緇塵破長鐔寶氣銷門垣成隱逸茟櫝到耕樵逆旅呼燈夕修闈徹棘朝囊書題薈蕞彂論獻芻蕘舌熖真熏灼胸兵劇煆穀乘軒南國鶴解鏇朔庭雕斡運天垂斗蜚騰海作潮荃蘭騷地變橘柚貢年凋色采黃朱黻音聲徴角韶潛身甘蟄蠖賦命類茗鷯筮仕龜無兆攻經教有條秦灰完竹帛漢粕味簞瓢畫品翎毛貴雞場瓜距驕文章通政理道義勝官僚歲月嗟悠久湖江耐寂寥花濃携酒