front:
  text: 淵頴吳先生集卷之一門人金華宋濂編
  hash: sha256:e4ed239f8a920e4887cd197f0366a38f89596242db42b3491a6ae4684f422a9b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_001-1a}
body:
  text: 大遊賦并序毗陵道士盛允升東遊會稽豫聞其風神頴異𬒳服蕭爽蓋將自是而汗漫六合者也張君子長約同送之賦用是作遂題曰大遊夫何一髙士兮獨曠視乎八區朝吾車之夙駕兮夕豫至于清都仰天路之迢遞兮挾陵陽而與俱遡剛風而俯倒景兮浮沆瀣而吸青霞蜚廉起而前導兮􅌛靊霳使後驅素霓夭矯而為纓茀子神鳯離褷以揭旟恍大遊之所𩔶兮撫四海其無家唶塵濁之不可以止息兮吾將抵乎昆崘之遺墟嗟東轅之我蹞兮探宛委之嵌穴帝禹告豫以所藏兮彂濤江之漲雪登桐柏之嶄巖兮瞰赤城之嶱􅣈飊蓬嶠而我欲徑到兮恐蜃樓之明滅歘南轉而弭莭兮過灊霍之層峰放盛唐之匯怒兮梁魚鱉而踊蛟龍掎巫峽之臺觀兮莽峨嵋之雲松泝丹丘豫㝎不死兮躋羽國以從容曶浩歌而西邁兮適金天之沃野遵黃河而趿石室兮王母𬒳髮以嘯處尋泰一與九嵕兮貫華隂之幽岨招韓衆而許度世兮固肉人之弗遑遽覩乃北折而亟去兮出鴈門之嚴寒恆嶽綿亘乎不絶兮縋碣石于瀰漫搜赤舄于遺榛兮簸樓船乎狂瀾候雞鳴而直上日觀兮吾特痛夫仙學之艱難伊天地之晦冥兮倐陵谷之遷徙邅女媧之陮阜兮顧嵩少之􅕲起經陽都之酒家兮嚌王屋之石髓披河上之靈筌兮擲􅃮園之奧指惟小别而千齡兮復一瞬以萬里劃狐鳥之丘垤兮洞蟪蛄之年紀心委蛇而自神兮形曠蕩其離滓信吹萬之不同兮恆抱一以終始胡久居乎寰內兮欲絶出于大荒扳建木而與為􅕾降兮絙鐵鎖于無傍瞻帝車之中運兮闖閶闔以上征屈軒轅之踡伏兮耿招搖之耀鋩引弧井之壘落兮炫奎璧之圗章翻龍漢之寶曆兮徹鬱繿之神鄉幸置身于一氣兮卒齊夀于三光宜凡夫之穢濁兮又孰契夫大道而翶翔自放懷于天外兮眇纍塊于千億惕世途之嶮巇兮厄蜂蟻之營役豈耽名而嗜利兮或酣酒而溺色諒金石之銷泐兮竟丘壟之堆積唉吉雲之巨藪兮緤步景而我服歎甘露之靈甕兮和水玉以為食彼策精之有書兮吾尚懼夫骨籙之弗得將蘂珠之不逺兮盡蝌蚪而莫識懿周流而至此兮聿笑傲以言旋樂自然之日月兮攬無鞅之風煙壓洞庭之浩渺兮屣林屋之聮綿龍威蚴蟉而跱踞兮寶鎮晃而瑛鮮乃霄峥之欲枿兮覺鼎竈之猶燃爥大還而蟾蛻兮擊小有以鶴翩躬虗無而不宅兮味淡泊以為淵等古今于一軌兮混生死其同鄽儼坐在而立蛻兮藴執𬒮與拍肩真山澤之一臞兮夫豈論乎三墨暨九仙固道術之所致兮曷曲謏而究旃馳箋語而往訣兮却永存于上玄海東洲磐陀石上觀日賦粵東遊乎海􅗲兮得偉觀于陽阿登盤陀之疊石兮路崴􅪾以巍峩天雞號而夜半兮暾欲出于重波恍玄幕之沉黑兮惚火輪之蕩摩緬羲和之有御兮扶木燁其將花渺湯谷之不可以里兮屆髙春其幾何嗟世寰之安在兮尚昧冥而未旦睹帝車之邪迤兮耿星宿于霄漢漸島嶼之奣鮮兮益渺茫而瀰漫恐闤闠之猶尓夢寐兮類蟄蟲之惛亂胡乾極之牽掣兮儼機軸之翕張固隂泉之吹炯兮煥􅑒燧之奮揚煒踆烏之霩煟燦爛兮渴喙解羽藐以迭碭戫爥龍之燬焫颯昱兮熾額煽目其方􅋮縣燔鏡之熒灼炭熺兮鮫人泉客劀濯有光振赬鼓之焱熽炫輝兮北落壁壘嶙前行指綵虹之抱戴珥璚兮璀錯爣􅓎綢遹皇想朱鳥之次舍軌度兮豁逹藺轢閜耀鋩乘寒潦潮水之傎倒推蕩兮散曉赮霞氣之轇轕彩章乃蜚騰于寥霩兮竟瞑眩于混茫繄髙抗乎氛曀兮僅啓眀之獨爍歘逺麾之黂爝兮遽群動之盡躩川后潛精而窟藏兮海童覷曜以奔愕鮫鼉揚鬐撥鬛以悠漾兮鴻鶴刷毛挾翅而陵薄莽琅琊之躋臺兮㴐鯨山而晝其穫禾火也閴羅浮之瞷井兮滉蜃穴而夜其爚也迅夸娥之杖䇿兮懼追逐而莫之跳逴也怒魯陽之揮戈兮怪盤礡之弗吾規彠也惟圭臬之可測兮奈隙駒之焉託恆鞠眀而究曛兮遂壯凋而老鑠昔聖賢之有法兮實蓋渾之同天矧錬石而凝質兮復斷鼇而鎮淵將渤澥之鑿竁兮淪谷底而迭燃抑昆崘之峙兮繞巖腹而互旋豈文身黑齒之俯邇所出兮貫祼壤以相連或崦嵫濛汜之逺壓所沒兮罄汃國之窮壖歎嚴冰與嬲雪兮曠古莽之鮮覺常眠惕重蒸與疊爇兮焮炎丘之毒瘴霾煙諒衆人之懵狹兮特蜂蟻之撲緣偉小兒之辨智兮雖睿哲而勿宣彼凡俗之多故兮遇曙朝而即􅔡誠旦晝之梏亡兮嚮晦昏而暫定紛仕學之攘爭兮集農商之鬪迸淫末作以相資兮侈利心之百穽儻桑榆之不復滅沒兮盡奪時而力政願鬱儀之恆若溟涬兮庶保躬而固命器曉籌而催闢兮警宵柝而告靜信舉策而豫知兮幸聞鍾而深省何觀瞻之不足兮重徙倚以盤桓光巳通于一躍兮影奚候于三竿逯層溟之畢露兮屹東霍之巖巒念列仙之獨往兮扼羡門于波瀾劃孤嘯而陟降兮撤蒙蔀以欣歡顧秦越之邈不相及兮又焉論夫逺近于長安羅浮鳯賦并序羅浮鳯者海南小禽也家君自嶺嶠回挈之北上豫嘉其身負文采拔去幽阻而欲自售其羽儀也是知士之抱道德懷文章無微不聞無逺不達豈肯久滯于天涯海角之墟而遂已乎雖然豫愧多矣乃為賦曰惟海邦之異産挺羽族之光華育火德而有耀控離垣以為家迆赤土之重漲眇丹丘之僻遐顧性命之淺薄特般桓于煙霞原夫自南自北載蜚戴止蜚不妄集捿必倒跱青飾衣襟紺流爪觜信鳳藪之多竒類龜臺之所使吮夕秀于𬗋芝嚼寒香于瓊花雖斥鷃之同羣固鸞皇之等美于是本山川之迢遞羡體氣之自然胡虞衡之弗及隔瘴癘以能全戒羅氏而弋舉命鳥夷以籠遷望上林而奉進跋神嶽以增妍念安期之蓄養受抱朴之矜憐守一枝于嶺木得數粒于嵓泉曶獸圈之可近任蛇􅗲之長捐尚蓬蒿之改觀何鼎爼之容羶當其𬗟南國之蒸爍泝古龍之沉隘冝稟賦之爾殊渺狼昏之昏昧祼黑質而無繒甕鱗軀以弗靧奈屋居之何有望魚鱉而奔沛胡鷦之種族獨黼黻以藻繪矧鞦莎而臆蘭匪距金與羽芬獻麗容而自媒炫靈表而岡害將尤物之移人豈凡禽之一槩若乃考黔嬴之所育鍾品彚而降祥負英姱而可貴閟草莽而愈彰心恆馳于北闕迹曷屏于東岡薦董賈之術業熾淵雲之辭章偉畎谷之文翟諒備采而有光逖炎洲之孔鷸或聚冠以見戕幸全生而特遇肯處逺以回翔儻遲延于歲月恐滅沒于殊荒然則偶時景之和暢跋閶闔以凝佇稽師曠之輔經驗冶長之辨語感軒閣之銜圗副舜庭之率舞聲格磔而應弦勢盤旋而列簴祠爰居而眩惑奏鶡雀以笑侮卵條支而必致毛拂菻而曷舉彼尋常之猥陋雖籬落其若阻相盛德之休眀謂萬里而來覩是故士當貴而自重世何嫌于處卑罄山谷之巢穴奓朝廷之羽儀仰天地之廣大拔聖賢于窮羇極英材之衒鬻忍道德之擲遺惻朔風以吹壄慘寒雪以刮肌屹碧梧而弗實挺篁竹以無枝鼓乘傳之壯志藴棄繻之妙姿奈負二之久梏窘侏儒之長飢庶飛搏于鵬路終飲啄于龍池尚兹鳥之吐數遂厯言而詠斯歎疾賦伊天地之常運兮何我生之遘屯罹終歲之竒蹇兮斫一元之淑醇莽門徑其委草兮凄户牗以疑塵置冠衣而不理兮念動履之艱辛揆世寰之有植兮本胎氣之稟育粵襁抱而多厄兮謂乳湩之不足胡肌髓之朘削兮僅側身而于陸矧食飲之稀薄兮略餔麋于鼎餗顧廬伍之同處兮雜悲歡與慘哭唶寒暑之中人兮逞災淫而疸毒諒膠轕之無已兮竟沉痼而反覆尚何藥之起豫兮幸我神之來復惟聖人之所慎兮儼前訓之蓍龜信軀命之實切兮曷戰兢而自持奈衰風之竊彂兮挾沴血以侵欺漸黃稿而痿蹶兮致漦泗以殿屎髙山其傷陽兮痛壞木之無枝廣澤淤而積隂兮懼窮魚之弗移儻湔腸而浣胃兮特湯齊之我遺庶扶形而矯摩兮固臾扁之可期當田野之蕭索兮曶雪霜之交摯彼蠢翹之有知兮乃坯蟄而日閟龍何潛而弗蜚兮蠖何屈而弗肆相昆蚑之各以其時兮豈長裸之多懟晝奔躩而亟思兮夜睅鰥以忘寐人痾攻螫而戕賊兮世恙灌熏而顛躓煽狐狸之老姧兮舞鬼蜮之遺智恐病危之或然兮臨淵谷而增惴紛遂古之開物兮實巨靈之育和精日月之照爥兮竅風雷之噓呀置頭顱而上峙兮象山嶽之巍峩縣肺臟以中居兮通脈絡若江河蓋全軀而至貴兮冝攝􅒏以享遐肯莭宣之乖逆兮恣榮衛之慝訛搏羽苞而覔燧兮殆憢焫之見加揚凌杯以攪沸兮雖金石其謂何彼衆人之豐碩兮胡衰我而黴瘠舉世競于塗隧兮獨床祍以栖息矧一旦之即安兮置事功而弗獲恐後日之併無此身兮虛名實而岡績緬嵩少之有隱兮曰煙霞之膏肓指龜策之可簭兮懷椒醑而降祥彭祖傴僂而下窺兮尚援藤乎若驚接輿跰􅓷以自鑒兮窘霖雨而肆狂漢史病而留滯兮感封禪之從行唐傑憊而悲憤兮賦棠梨以惋傷顧真材之豈不爾遇兮恍景耀之弗彰笯鸞翎而使飛兮􅔗驥足以待􅋮况我躬之蹭蹬兮愈遲暮以潛藏惜修名之未立兮笑鬢髮之先霜抗龍文之鼎鼐兮擲􅍑首之鞶囊吾尚擬夫列仙之可學兮佩丹訣而不敢忘起病鶴賦并序豫少多病嘗作病鶴賦以自况蓋言呐然如不出口身退然如不勝衣後雖稍自振于時亦不克也然其稿巳不存矣嗚呼豫病久且痼其尚可以未起乎起之在我而巳于是復作起病鶴賦并以示知我者伊元造之播物有九臯之靈禽稟幽心于藻質𣪚縞翅與玄襟掎嵩丘之石室瞰蓬島之清潯眇八紘于一舉曠千里之遙臨然而山多歲隂野積氷雪老松無柯百草肅殺圎吭塞喑弱脛摧折赤精眵昏纎趾蹩􅍷胡志向之殊卑尚光儀之迥潔匿平林而羃迷壓臣壑之谺裂是以前詹恍敞後顧襂褷投蹤灌木憩影沙坻靜非馴擾動若􅎗羈俳佪蕭索躑躅險巇奈世氛之混濁憶天路之孤危望鴻鶬而不及慜燕雀之陵欺俯爭枝于斥鷃逺絶軌于長離顧雲海之日隔窘稻粱之恆飢幸樊籠之匪觸豈繒繳之來施亦何恙之不巳乃厯年而留兹至若髙步自怡嘯呼同侣拉颯思奮踉蹡起舞風生則虗曠露隕則凄楚拊青田之故巢睨華表之遺柱夷采薇于嵓谷憲含糗于環堵駟蹇剝而罕逢鴻激亢以多忤唏胎化之尚然眷帝鄉而延佇抗衆彚而不群懼終身之畸旅于是韜養既久栖跱載寧土木內蓄火金外形梳理碎玉劀除殘腥羡門許其彳亍玄俗惜其竛竮擲武丁之寓篆彂緱嶺之藏經服仙人之上乘擁太古之遐齡故能一洗塵滓直遡寥廓仰拂𬗋宮廽翔金閣過夷羊于南維窺壁壘于北落濯長河之奔流凌倒景之照爚導素霓之飄掦攖鶉鳥以距攫躔建木之絶標嚌神芝之竒藥然後希一真而永固超無極而磅礴曰復豫之本𥘉竟誰辨其所至之垠鄂惟天地之一指忽古今之紛更人何窮而不逹物何悴而不榮將人物之多變豈禽鳥之異情苟相時而能動雖處困而必亨是故邦治身出身顯道行奉周廬于旦夕視萬乘若友生負文章之綺麗馳論議之崇谹一賜則眀珠白璧再竉則三事九卿方解兹之舊縶庶息我之前黥可無心于祿位終不日而蜚鳴大舜來鳯于樂奏宣尼致麟于文成聊援毫而興起又孰不仰德而聞聲狙賦我觀世間何異厥狙狙公執技役我庭除投瓜齕果豢飬飽腴牽繩拽鎖奮躑嘯呼側身舑舕恐􅋏足跗項矐矆變幻首顱動因頥指靜類橛株恍惚錯愕滿堂盧胡粵自童幼𬒳彩弄雛長跳短躩嬉戲有餘忽然壯強精幹猛軀急操襲取智慮畢輸亦復病苦憔悴困臞徉顛詐死靈藥在壷豈或老衰涕泗垢汙曲顒傴臏鳩杖給扶相彼仕逹綽有時譽巧張鄉評雄􅘳宦衢文馳觚櫝武執戟殳橫施爪距憤磔牙鬚髙門縣薄伺候趑趄豪戚勢卿語話囁嚅白􅍑獻議銅龍握樞摸稜唐手霹靂漠苻升堂踞坐呵喝擁驅棄律舞法鞭梏刻刳神姧出沒拉彘扼貙頑貪奊戾盜鹿攘羭貴與利期貨貝其儲寵則驕至跋躓同塗膠目塞耳禠冠裂𥚑行遭僇辱泣赴刑辜載觀冨盛擅尓里閭經營家室粉飾體膚連檣白粲負郭黃淤沼池魚鱉塒檻鴨豬業可必得事在必啚姱奢服履湎液杯杅窮聲絲竹極色麗姝弗農崇廥匪賈積帑自晨及暮鴻弋兔罦分房割奧誶帚德鋤齒霜㘖齾舌電噓侵貧併弱欺懵侮愚春花秋葉更菀遞枯先笑後號去車就􅞁胡然比附竟作暌孤餒哉氣力孰不丘墟當其為人尚有以娛殘骸斷胔螻蟻鳶烏或者為鬼抑又可歔鱗肌角鬛魑魅夔魖一時之頃幸不汝拘衆人盡然殆不我誣周公之衣勉強曳婁吳王之矢巧捷速殂身何置網手且捋荼疇云智譎有是勤劬假靈木客通怪山都雖則多幻盍忘爾𥘉呼呼兹世莽矣一區視其有作意在覬覦悲歡交禪福禍並趍小苛可略山嶽弗殊治安何玩兵亂卒瘏暴秦殄楚徑越戕吳三國鼎立材勇與俱龍􅍑鳥蛇陽陳隂謀五胡雲擾羌羯相屠弓弩甲旗北騎南艫椎􅌛敲批却􅑆骨軱攻戰圍噤形勢亢虛塞關在前慎不可踰邪孽在後淪胥以鋪時風哀樂史筆賞誅醫國無術鑄人曷模天開地闢四海蘧廬人消物盡萬世斯臾惟狙拔己盤踞自如昔非刻狗今豈乘狐我思丗故何計有無緝之成賦用戒薄夫定命賦昔岐周之懿哲兮垂末躅于勾吳延州來之閎博兮秉世德以作摹豫既稟此美質兮參兩間而與俱日礲礪以頡頏兮違陋巷而適通都膺文華之𬒳體兮結俊逸以先驅翩黃鵠之千里兮炯驪龍之吐珠掎山丘其峻峭兮汨河海之盤盓竒材未得以自致兮恐薄俗之淪胥叱玄夫為豫枚卜兮徴吉繇以弗渝曰心逺而迹滯兮何時命之獨拘怊怊其曠懷兮惕惕以深省收群囂于一默兮守不動于真靜規豪舉于鴻冥兮混牧芻乎鹿町胡魁梧之數竒兮彼朴鈍則猶天幸遵大路豈不可兮莽荆棘使吾騁亦欲逃于空虗兮走赤日將焉避影聿軒騫以有行兮仍轗軻甘所屏離當世之紛紜兮合自然于溟涬羌造化之無象兮妙機關之翕張叢生植之各異兮肖智愚以何常役中心之閧雜兮煽六鑿之披猖朝奔騰靡所止兮夕偃息恍若有亡灑屏翳之淋漓兮吹招搖之耿光曶而出于神竒兮倏又臭腐不得當邈自古之若兹兮哀吾生之不淑畸汝形而益臞兮怪汝志之彌蹙言謇澀以少味兮步跰􅓷無所投足奮骹䶗而衆㘖兮割肯綮以旁觸惟先儒之談王兮固卓立以忤俗環車轍而至老兮陳詭詩以遭逐問蘭陵悲芳草兮登鄒嶧感喬木慊素衷之堙厄兮綿千祀其芬馥彼瞢暗之弗思兮行狹邪如平陸託黃老而險盩兮攻春秋以阿曲亂鳬鶴之短長兮衝涇渭之清濁不率循于中正兮每僥幸以致夫顛覆豈昔吾之自奮兮今獨有此沉憂託松柏之幽蔭兮招鹿麋而與儔俯環堵之湫隘兮猶采椽之雕鎪駕柴車之朴素兮亦炫耀其華輈等羮藜乎粱肉兮齊衣敝于貂裘窮匪通其不鄙兮賤無貴以何羞嗤豫音之寡和兮譽汝器之無不周斯視聽之既狹兮曽不遇曠與婁麒麟出而野死兮鳴鸞鳯之啾啾幸定分之有在兮肯他岐之往謀何艷陽之駘蕩兮破寒谷之颼飀諒勾萌之畢逹兮雖壅閼其無由不吾用則亦巳兮况斗絶于荒陬終越秣以燕刷兮夫何足以自疑尚志賦惟太區之寥霩兮紛庶物之馮生藐豫身之中處兮欎豫志而不得逞竊獨嗜此古學兮指前哲以作程味詩書之醇粹兮獵道德之精英悼世俗之馳騖兮吾何有乎我行將歲月之不我與兮兀淹留而無所成沉憂以氣索兮却立而質薤攻蹩􅍷而狹步兮守耵聹謂真聵䁇瞭目以霧披兮焱竒肱而風厲墮泰華以施簮兮縮長河約之帶翔矞皇之暗藹兮叱麒麟使承蓋神若唏而奔騰兮劒黿鼉乎濤瀨招屏翳豫劈帷兮斬蚩尤以褰斾折建木以指麾兮唉曜靈之西邁將欲往彼鴻濛兮授豫策乎霄漢亦或悲此骯髒兮彂商歌于達旦溘世氛之溷濁兮噓天籟乎崖􅑆薄髙丘以闖逺海兮恆敞恍而不顧返何儃佪以難進兮曰而則然顔子默而樂道兮曽不滿夫一簞原生淡其居貧兮尚蓬蒿之沒垣彼豈不談王術兮甘窮櫩之藐艱秉中心之皎日兮輕外物若浮雲諒當時之謂憊兮猶千載稱其賢阽吾生之沉抑兮將有繼乎古先炳豫室之虛白兮纚豫文于太玄莽歙歘與時化兮希噌泓而道存棄騏驥而蹀躞兮登蹇􅐒乎前軒淫桑濮之嘈雜兮九韶嗼焉無聞固泰豆之不世出兮又何見夫榮猿彼何人哀時命兮每嗟卑而嘆屈曷不尚豫之志兮仰孟氏之遺則繄老農之力田兮且多種而鮮穫矧竒士之環轍兮雖凍餒其奚恤增螢爝以日晶兮積埃壒而山嶷向汙泥求夜光兮經劫火見垂棘惟傳險之版築兮扳南箕以興國亦有漁厥磻溪兮擢赤鯉以豫翼挺爾躬之豪崛兮肯受人之羇勒惇鄒魯之雅言兮建燕趙之姱莭糅瓊靡而我餐兮羅翡翠以為服秉剞劂而剸裁兮鏘和鵉以遊息撫鴻荒其若今兮觀六合為豫窄齊窮達于一塗兮與聖賢而同域翩丹穴之蜚鳯兮粲九苞之翕赩將乘之以覲舜文兮孰知豫情之至極索居賦粵吾生之寡好兮恆孤陋以索居步中庭以自念兮心抑鬱而不舒阽豫身之兀處兮撫萬化之殊塗豈寰區之汝狹兮杳不知其所趍惟世氛之溷濁兮尚蓬藋之藏匿將奮迅而激昻兮又邅廽以沉默去衆人之佻巧兮膺泰朴以堅飭紛荆棘之柅行兮謂卭崍其繩直肩重任之迢遙兮固邪軤之不力儻泛駕之有求兮䇿罷駑且焉止息巡簷隙而詠歌兮撼户􅗚以悲惻何𥘉日之成言兮乃棄豫而不我即彼昔遊之為豪舉兮曽同處乎險囏羌結交以鼓勇兮肯羈圉之遑安抗沙塵而志得兮巍辨冕之星攢既文虉之炳耀兮嗤薜蘿以為寒仰睇逺而弗及兮莽浮雲之瀰漫俯聽幽而若來兮哀風激夫溪湍汨寥其無景兮甘崛強以此蟠徒離群以蕭颯兮庶神氣之我完折松枝而拂石兮又植之以青蘭宜道義之擩嚌兮肯肥癯之異觀董生之談王兮且有稱于不遇賈誼之眀治兮謫長沙而徑去將屠販之汙下兮恐紛紛而改度逮曲學之肆行兮使吾儒之愆素古固有此渾肴兮矧豫今之馳騖寧窮達之措懷兮曰美人之遲暮循自然之天運兮芳草藹其彂榮倚巑岏之絶壁兮臨萬仭之潭泓欵淺渚以淡濘兮樂倏魚之不驚構危巢其惴栗兮恍若聞乎鼯鼪非山林之忘反兮奈世務之所嬰手不得以竪指兮目又何能以逃晴因㯉𣪚之乏用兮託考槃之遺聲永言抱此幽獨兮庸詎釋夫我怦貪女賦并序豫春秋二十有二嘗偃蹇不得志因讀史記感甘茂貧女分輝鄰燭之語故作是賦以廣之伊太鈞之坱圠兮敷動植于八紘兹女蹇其居貧兮乃困苦而不得生惟室家之蕭索兮屬多難之來并空展轉其窹寐兮魂惕惕如有驚顧儋石之不儲兮支墻屋之欹傾印鼠迹于床塵兮网蛛絲于門楹胡藍縷而不完兮又機杼之無聲凛寒風之中人兮感促織之宵鳴拂敗奩之殘蠧兮舊鏡黯以羞眀銅叉折其半股兮亂鬟鬢之縱橫拈竹筐之素縷兮針欲澀而不行亦何心于組紃兮况鴛鴦之能成挾故絮以假寐兮耿寒熖于孤檠誰哀吾之窈窕兮幸自保其堅貞嗟父母之鞠我兮美裳衣而藏匿矧櫛風而沐雨兮身乃罹于荆棘忍須臾于溝壑兮豈敢休乎蠶織欲一眩其盛年兮縱粉黛而無色羌鑽穴與踰垣兮謂善淫之為惑庶容德之可全兮雖凍餒其奚恤彼鄰姬之纎巧兮日靚粧以登樓綴木難之充耳兮插翡翠之搔頭騁兹心之􅯾冶兮學趙舞與齊謳佩階蘭以求媚兮祇怨曠之懷憂信怙寵以取樂兮盡夙夜于衾禱飛瓊觴以嬌醉兮秉銀燭而歡逰恨兀兀以獨處兮欲從汝以為謀細娛聿其可玩兮重桑濮之貽羞寫豫心于溝水兮恐年華之遲暮甘蓬葆而不恥兮豈蛾眉之見妬且絶世而特立兮逮傾城而弗窹乃蕉萃之或棄兮縱效顰而罔顧紛來彼之柔桑兮輕擲金于行路苟力操乎井臼兮微隱德吾誰慕繄二南之彂政兮由夫婦之所椎化尚及于草木兮獨不撫乎􅑱嫠利遺秉與滯穗兮豈年登而啼飢儻卒歲之無褐兮何功裘之足為慨兹道之愈逺兮指古人以自期聊援瑟而一鼓兮遂聲之以為詩詩曰有美一人兮東鄰子耀金珠兮列紈綺弄姿飾鬢兮匪桃伊李朝為春風兮暮則流水曰妍曰醜兮云誰之使見肘決踵兮我樂乎此樂吾之樂兮勿傷吾貧寵之一失兮金屋生塵固榮艷之匪望兮又何必怨夫陽春淵穎吳先生集卷之一
