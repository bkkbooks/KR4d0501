front:
  text: 淵頴呉先生集卷之十一門人金華宋濂編
  hash: sha256:beebc6a8a278ea5a34adb1685f9aa7e43d8f619ef4c3d99e3c095f0993c63cd5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_011-1a}
body:
  text: 石塘先生胡氏文抄後序郷予甞見永康先生胡公錢唐寓舍毎嘆古今道術之異及今覧其所論著則尤得其父兄淵源師友講習是非取舎之或不同者盖自近世周邵二程始推聖賢理數之學以淑諸人然而學者秘之則謂其學之所出者逺有端緒不言師承而今說者乃稱濂溪之所授受寔本於夀崕佛者之徒先生至為論辨以著明之曽不容喙是殆當丗士君子之所深感者也夫以周程理學之盛而邵之數學且不䏻能以並傳於是朱子乃以東都文獻之餘一傳於閩之延平而又兼講於椘之嶽麓誠可謂集濂洛諸儒之大成矣當是時也二陸復自奮於撫之金溪欲踵孟子曽不以循序漸進為階梯而特以一超頓悟為究竟今則至謂朱為支離陸為簡易必使其直見人心之妙而義理自明然後為學自謂為陸實即禅也故曰丗之學者知禪不知學知學不知禪是豈深溺乎異端外學之故而遂誣其祖乃舉堯舜以来七聖相授洙泗以降四子所傳道而悉謂之禪耶惜乎予年甚少僅得一再見焉而不得親扣其詳也雖然春秋戰國之丗聖人不作䖏士横議天下之雜治方術者不為不多是故老與易並稱儒与墨並譽丗之學者或欲援􅚨而入扵彼推彼而附扵􅚨卒無益也然亦用是而日雜矣流及後丗秦謂方士􅚨漢謂治黄老者􅚨晋王弼遂用老氏之說以注易唐韓愈至謂孔墨之道同道不同則不足以為孔墨然而佛者徒以西方之傑戎暴入中國言語之不達𬒳服之不合趍向之不正而今乃欲一混而大同之不㡬於蕩然而無辨矣哉必也天下人心之義理無古今無彼我無華夷無内外雖欲一混而大同之亦可也此其道術之所在苟或不契於古之聖賢則其所以召夫後丗之嘵辨讙咋者不䏻遽巳先生曽不此憚而直以此道為已任又著明之予殆不可得而妄測者也夫自江左始平上即遣使重選南士之賢者士之一時幸脫兵燹擾攘城郭墟莽之後當天下大㝎懐才抱藝不肯一出而少試焉是亦終於㓗身亂倫而已矣先生盖自宋季為渝酒人因得陪四川大幕府末議號稱南中八士及宋内附或以先生妵名薦遂召見意謂先生且大用復出而教授廣陵凡歷數任僅尓没没於州縣之下僚不至甚顯然觀其所至教士也必曰嚴恭寅畏其敎民也必曰孝弟忠信此其道術之正仕䖏之合文章之懿政事之著誠有大勝扵今人而且不後扵古人是豈苟然之故而遂已者㢤當予𥘉見先生時先生甞語予面膚黑而多䵟唇齶掀而不閉䵟則無澤不閉将失氣無澤而又失氣匪夀徴也爾曷不閉汝氣而後瞑且爾獨不見尓家甕之盛酒者乎夜甕或不覆則酒旦失味而不中飲汝之失氣亦猶是也予固疑先生或得乎攝生養氣之道者及予自燕南還予又與鄱陽董仲可㑹稽方九思福唐髙驥生建安虞光祖及金谿傅斯正五六人者再見先生先生則且指語予曰丗之觀人者自夫出䖏進退用舍得喪之際有㝎論矣尓等得無頗有怨尤者乎傅之曽祖父夲學於陸亦喜談陸者自近年科舉行朱學盛矣而陸學殆絶丗之學者玩常襲故㝷行擿墨益見其為學術之弊意者其幸彂金谿之故櫝而少濯其心耶曽不數年而先生竟以衣冠沐浴端坐嗒然而遽化予方無以終事則徒識其遺言撫其墜藁而且繼之以涕泣不能自巳嗚呼臨長川而後嘆逝者尚可得耶尚可得耶范氏莛篿卜法序莛篿卜法者夲椘越間小術也自椘屈原始稱有莛篿之卜越相范蠡頗有其書然今特類後丗術者所託要之亦必古有此法矣當卜時自其所向得草木枝𥘉不計多寡左右手一縦一横揲之以三而數用其仂然後一時之吉凶從違休咎福旤立可見者達賢君子或棄之而不道或時有可采是豈所謂椘人鬼而越人禨者乎盖昔越相范蠡曽与大夫文種事濮上計然計然世所號文子者也而蠡種實為楚人而往仕越悉通天地隂陽之紀察日月星宿之㑹明鬼神幽顯之理達龜筮鈐决之奥治國臨政謀敵用武莫不如其所碩欲越以覇强何蠡種之能有以盡乎其術也予甞考之大抵本出扵太一六壬玄女遁甲風鳥雲氣之道越王勾踐宦呉呉将赦越蠡占則曰王聞喜時日加戊時加卯功曹為螣蛇青龍在勝先是謂時尅其日用又助之事不利而有傷巳而子胥諌不果赦及越王勾踐歸國越既沼呉而蠡去種占則曰王勿追蠡蠡去時隂画六陽画三後入天一前翳神光是謂玄武天空無有止者言則死視則狂巳而蠡去匆復追呉越春秋具載其事而史記特推蠡種之術乃出扵計然然自越王勾踐之還臨明堂悉練時日又類後丗五行堪輿叢辰䓁家脫有不合則指為事犯玉門𥘉未審所謂玉門者果何術也吴越春秋盖輯扵東漢趙曄或時漢季頗以天文䜟緯九宫八卦占候之書為内學而曄自以其說勦入之欤不然史記之言隂陽多忌諱而太詳者蠡種毋乃酷似之欤是故丗之學為天目計神孤單閉杜奄迫關格制客主别勝負之術者毎託扵蠡而行之莛篿之卜特其細也然則陽至而隂隂至而陽陽莭剛強而力疾隂莭安徐而重固又且㳺觀乎天地四時贏縮進退以爲常是豈但古之善用兵者爲然哉雖一恒人之欲卜其動作云爲亦不過此而巳夫然故微而思慮之所形著而言行之所廢至以天地之霛変鬼神之幽賾而吉凶悔吝之来若有應焉誠有不容揜其偽者雖微端龜正筞旋式布棊人心之皎然常足以先知而預㝎矣又况達賢君子出入起居浩乎与天同運彂號施令窅乎与神俱化然且不能不假是以示諸人也莛篿之細時有可采豈謂其果足以盡乎天人之道者哉雖然越王勾踐之隂謀譎術苟他無所徴纎毫瑣末類出於隂陽時日之占而後用事吾猶恐其未必致霸必也五榖蓄金銀實府庫滿兵甲利然後用是以㝎王心之疑動越民之所欲報讎而威敵者則庶㡬焉是故今一恒人之所卜雖以民俗間小事亦必天地之氣應与人事相叅乃可以見其成功不然則龜爲枯骨蓍爲朽幹猶不必泥况莛篿之細者哉予具録之又足以通知古之多異術矣唐律刪要序予甞讀唐律每患其繁賾難省故頗刪其要且務觀乎古今立法之淺深用刑之䡖重又從而序論之曰夫古者先王之治人也以徳而輔之以刑後丗之治人也徳則不足而惟刑辟之是用春秋傳所謂三代之衰然後制刑者也自戰國之丗魏李悝始造法經商君受之以相秦及漢悉踵秦故歴代相因至唐則又承陏開皇之律是盖唐律夲陏漢律夲秦其實一出扵戦國李悝盜賊囚捕之緒餘而巳不復二帝三王忠厚哀怛刑期無刑之夲意矣然以秦之為秦焚滅先代之典籍坑僇􅚨生猜鷙強暴嚴戾刻深而詔天下學法令而師吏惟陏則亦庶㡬近之而任法者也盖當秦之時孔子没而異端起䖏士横議而說客妄售其所自為術是非矛盾紛盭相勝然秦方遺仁㤙尚首功而􅚨者又不入冝其一意任法用吏以為治若夫陏氏之初江左齊梁貴淫靡代北周齊習蕃夷天下幸歸扵一而風俗未淳朝廷議政之臣類皆俗吏米䀋之徒苛刻煩碎未甚有紀故陏且悪其連萹風雲滿箧月露華而不實者而猶未甞識夫儒者之真亦宜其一意任法用吏以為治孟子盖曰言非禮義謂之自暴吾身不能居仁由義謂之自棄秦則不知儒而不用非自暴欤陏則不知真􅚨而不淂用非自棄欤是殆秦之任法雖暴扵陏而陏之任律則猶襲秦之故智而或過焉者也夫以秦陏惟吏之是師法之是徇目謂其法律之宻督責之峻可以肆其鉗制束縛之術扵朝廷之上故甞以一人狙詐猜忌之心而盡疑天下至於衡石程書衞士傳餐而日有不給及觀其所以為効秦則始皇東廵西狩而郡縣之供調不聞不足陏則文帝黎陽洛口倉庾豐盈而其後猶足以聚數百萬之盗賊而不盡誠可謂極其盛者雖然関東之􅍔至有土崩瓦解之勢而一切諉為䑕竊狗偷之盗而不欲聞曽不旋踵而二代之亡若出一轍是何徳化之不足而刑辟之是用者遂致然㦲然而漢以寛仁攟秦法唐以仁義變陏律盖欲一返乎秦陏之所為是故漸仁摩義淪肌浃髄必也􅚨者為能究之誠有不在乎俗吏持簿書急期㑹務筐篋者之所䏻測識此其創立國法粉飾朝章雖若有媿扵二帝三王忠厚哀怛刑期無刑之夲意至於後世杜張之深刻来侯之羅織戕勦民命傷蹶國脉無所不至然猶幸其夲根莭目之正者尚足以維持調護乎天下之故而不極扵亂於是馬鄭諸儒曽以文律而章句之長孫無忌䓁十九人亦巳因律文而作䟽義或從或革或損或益且酌其中要非苟然而遂巳者故漢嘗引經以㫁獄而深得夫法律之夲唐則每以書判㧞萃取士則猶使之知有法律之實而不為空言此殆􅚨者用丗之功天下致治之効将萬一乎先王明刑弼教之餘而固非秦陏任法用吏之世可遽及也嗚呼古今立法之淺深用刑之䡖重悉巳具見乎此􅚨者何甞不知吏而吏則不可不通􅚨尚徳化者何嘗不任刑辟任刑辟則不可不務乎徳化者也是盖漢唐之所以得秦陏之所以失誠可為後丗之龜鑑矣儉解史有言周髙祖儉者髙祖常服布𫀆寝布被詔天下庶民以上惟聽衣綢綿絲布圎綾紗絹綃葛布九種餘悉禁之予謂髙祖未甞知儉未甞知禁者也夫古之長民者欲齊其民扵是國有異服之禁必使其衣服之不貳而從容有常然而齊王之衣紫鄒君之長纓舉國皆從而效之且至去衣紫㫁長纓而後止髙祖之意固是也乃以人主之至尊至貴布𫀆布𬒳自同於庶民而矯誣扵當丗乎然自元魏周齊之際兵戈日尋民物虚耗髙祖且欲以一儉率先天下使凡奢侈過度者皆有厲禁則國家之經費民庶之藏蓄可以日趋扵富盛而無有不足可謂善矣誠求其如王者之政是猶未得其本之說也夫以天下九州之廣生齒之衆今之世去古逺甚然而國家經費之務常若不給民庶藏蓄之資亦或蕩然無所贏餘上固不容不以儉化其民而民亦當以儉而自化雖然未也當國𥘉時始得河北即議宣課銀綃之數河南猶未下及下河南而江淮呉椘實為財賦貢輸之淵藪猶未能隷度支命将出師運芻餽粟宜若晝変馳駈民人困戹不能供億然亦未聞上下以是而不足天下一統六十餘載經費藏蓄兩無其實又何獨異乎國𥘉之時哉夫漢自文景富庶之餘孝武承之而益以侈大東征西伐則有費修郊祀求神仙則有費興土木造宫室則有費廵㳺般樂則有費卒使言利用事之臣疲民蠧國海内空虚及其末年始欲務農重榖以救之亦幸而有此爾當今之世一遵祖宗之成法邉境無矢鏃之警宫庭無丹臒之飾歲時常祀亦未始欲講封禪而虗務般㳺也然而山林藪澤土力之所産茶塩酒醋民業之所資一皆日増月羡絲分縷析而悉輸扵上西域之羊馬雲南之氈罽青齊之絲纊江淮之粳稻又皆畢入扵天府而無所闕夫何大家亡資中户破産小民嗸嗸曽無衣食之所國家上下終未得如文景之富庶豈或猶有類夫孝武之空虗者乎當是之時上欲常服布𫀆寝布𬒳以一儉而化之且未能化又從而務明上下服色之禁自以為髙祖之良法善意復行於天下孰禁之㦲譚大夫之詩曰西人之子粲粲衣服舟人之子熊罷是裘是故奢侈不法毎形扵上杼柚其空日困於下人主不是之思乃欲自苦其身而往敦天下之俗且曰吾以一儉率先天下是墨子之道也墨子之道是豈聖人君子之所得為哉吾故謂髙祖未嘗知儉未嘗知禁者是猶未得其夲之說也丗之議者每究其夲盖曰國家經費之務必在扵抑横政而莭用民庶藏蓄之資必在於修農事而重榖君民上下貴賤一體貧冨相因感之而民不徒扵從化制之而民不徒於知禁者盍亦反其夲矣昔者齊宣王出獵於社山父老十三人勞王王曰父老苦矣謂左右賜父老田不租賜父老無徭役閭丘生獨不拜宣王恠之閭丘生曰臣聞大王来㳺来勞大王碩得所欲扵大王今大王賜臣田不租是倉廪空虗賜臣無徭役是官府無使非臣所敢望也臣碩大王選良富家子有修行者以為吏平其法度春秋冬夏振之以時無煩擾百姓則臣可以少得所欲焉嗚呼自髙祖之良法善意復行扵天下又必實之以閭丘生之一言則天下郡縣之間選㢘絀貪平法薄賦且将以是為抑横政修農事之本焉是謂知夲是即孟子所謂無仁政不䏻平治天下者也是即吾所謂王者之政也作儉觧以通之春秋傳授譜序春秋之道夲於一離為三家之傳又析而為數十百家之學學日夥傳日鑿道益散天下後世豈或不有全經乎亦在其人而巳矣自孔子沒七十子言人人殊公榖自謂本之子夏最先出左氏又謂古學冝立諸老生從史文傳口說逓相授受彼此若矛盾然自是學一變主公羊者何休主榖梁者范寗主左氏服雯杜元凱或抒已意或愽采众家盖累數十萬言自是學再変公穀微左氏乃孤行不絶說者曽不求决於傳遂􅌹意於訓詁江左則元凱河洛則雯自是學三変間有一二欲考三家之短長列朱墨之同異力破前代專門之學以求復於先聖人義理之極致咸曰唐啖趙氏自是學四變嗚呼言春秋者至於四変可以少定矣予甞觀漢𥘉傳公羊者先顯自胡母子都而下得二十四人次傳榖梁自申培公而下得十五人左氏本於國師劉歆未立博士故傳之尚少而東漢為盛東漢以降學者兮散師說離析非徒捨經而任傳甚則背傳而從訓詁嘵嘵讙咋靡然趍下夫學本非不同夲非不一而末異乃若是此其欲抱十二公之遺經悲千古之絶學彂明三家之傳而去取之者誰歟然予悉得而譜是者四變之極也四變之極必有能反其𥘉者唐啖趙氏盖甞有是志矣繼之者又誰欤古之人不云乎東海西海有聖人出焉此心同此理同也南海北海有聖人出焉此心同此理同也自其此心此理而諗之古之人有與予同者乎不同者乎同者然乎不同者然乎此其沒丗而無聞者多矣顯焉者譜扵此也盖昔唐韋表微曽著九經師授之譜且以譏學者之無師嗚呼人師難逢經師易遇然今經師猶有不可得而遽見者矣則吾是譜之作又豈徒在表微之後乎春秋丗變圖序古之言春秋者自漢至今亡慮數十百家大道之行天下為公一以理㫁之而巳猶未足究當世盛衰離合之変而權之者也雖然孔子嘗論之矣天下有道禮樂征伐自天子出天下無道然後諸侯大夫得以專而用焉逆理愈甚則其失之世數愈速此非通論天下之勢也春秋之勢也然而欲論春秋之理者不外此矣公羊子盖深有得扵理勢之相湏且曰所見異辞所聞異辞所傳聞異辞而漢之學者特昧昧焉乃設孔子髙曽祖父之三世以制所見所聞所傳聞之治亂春秋非孔子家牒也特以是究當世盛衰離合之變而權之者也盖昔陳恒之弑君孔子請討之左氏記其言曰陳恒弑其君民之不與者半以魯之衆加齊之半可克也程子非之盖謂孔子之志必将正名其罪上告天子下告方伯乃幸與國以討之至扵所以勝齊者孔子之餘亊耳豈計魯人之衆寡哉夫以理言魯為齊弱久矣孔子非不知魯之未必勝也務眀君臣之大義以討天下弑逆之大惡因是足以正之周其復興乎若以勢言周室衰矣晋覇微矣魯又弱國也陳氏世掌齊政民私其徳必䖏人倫之大変天理之所不容於是舉吾全魯以繼之則齊之罪人斯得矣是故弑君之賊法所必討者正也專國之姦勢亦有所未易討者然必有以權之者矣人孰不曰事求可功求成是取必於智謀之末也聖人不如是也嗚呼自王政之不綱而後有覇自覇圗之無統而後無霸人情事変雖未甞出於一㝎惟理則無有不定此古之學春秋者所以率論理而不論勢也自今觀之天下之勢在是春秋之理則亦随其勢之所在者而見之春秋之𥘉丗去西周未逺王室猶欲自用焉下及中丗齊晋二覇相繼而起則覇主從而託之耳至其末年王不王覇不覇夷狄弄兵大夫專政是戰國之萌也而世変亦於是乎極公羊子所見異辞所聞異辞所傳聞異辞盖深有得於理勢之相湏者此也漢之學者且曰隱桓逺矣孔子則立乎定哀之間耳逺者亂近者治聖人所以成一王之法也此豈求其說不得而強為此論者哉又幸因其有是而後世得以惟其當丗盛衰離合之変與夫聖人之權者先􅚨盖曰有隱桓荘閔僖之春秋有文宣成之春秋有襄昭定哀之春秋此三者豈非公羊子之遺說哉然則予之所以圖是者非私見也非鑿說也公羊子意也孔子意也春秋舉傳論序黄子讀春秋者四十年老而不􅌒甞著春秋舉傳論一編屏除專門􅊧剔傳䟽使之一歸扵是然後止盖昔者聖人之作春秋也筆則筆削則削咸㫁之於聖心髙第如㳺夏且不能以一辞賛焉公羊榖梁乃謂得之子夏文多瑣碎語又齟齬要之二氏皆未成書特相授受扵一時講師之口說者謂孔子當㝎哀丗多微婉其辞復秘不以教人故諸弟子言人人殊異然自孔子後一廢於戰國嬴秦之亂漢𥘉學者區區收𥙷意其焚殘亡脫之餘不藏之屋壁必載之簡冊非徒出口入耳而巳又况春秋之文數萬獨以口相授受庸詎和不有訛謬者乎濟南伏生治尚書上使掌故眺錯往受之僅一女子述其老耄之語丗謂生齊語齊語多艱澁故今書文亦難属讀然古人之作書者非齊人也柰何若是是則公羊齊學榖梁魯學非二氏誤也學二氏者誤也且孔子又何甞當定哀世多微辞哉苟曰微辞以辟􅍔春秋不必作矣况㝎哀又孔子所見之世也自所聞所傳聞之世一切褒之貶之且及其父祖當丗而輒微之吾恐非聖人意也聖人豈避嫌者㦲不然亂臣賊子僅誅其既死簒弑奪攘無懼扵當世是又豈吾聖人之意哉必也春秋之作未始秘不以敎人西狩之二年孔子卒矣論語禮記諸弟子之問荅殆無一言以及之得其義者盖寡矣然而左氏約經以作傳下訖魯悼知伯之誅在春秋後孔子卒巳久或曰左氏魯人也或曰左氏椘左史倚相後也若其說晋王接則謂别是一書意者當西漢末与公榖二家羊立愽士故又雜立凡例廣采它說以附於經是豈左氏舊哉今黄子舉之皆是也昔者晋劉兆嘗以春秋一經而三家殊塗乃取周官調人之義作春秋調人七萬餘言夫調人之聀掌司萬民之讎而諧和之為春秋者亦欲令三家勿讎将天下之理不恊于克一而後世之議且容其潜藏隠伏于胸中也何以調人為哉故唐啖助趙匡近世劉敞於傳有所去取咸自作書而今黄子又嗣為之可謂聞風而興起者矣非必曰此有所短彼有所長去其所短則見其所長者固可取也不然盡去三家之傳而獨抱聖人之經且自以為必得聖人之心者吾又不信也此則黄子之意也孟子弟子列傳序太史公孟子列傳首孟軻繼鄒衍奭淳于髠慎到荀卿墨翟尸佼長蘆子曰皆在孔子後荀卿可言也彼數子者不同道柰何同傳将以孟子寘諸戦國辨士之流乎是又非不知孟子者也一則曰述唐虞三代之徳二則曰述仲尼之意彼數子者亦有一於此乎當戦國之時士多以㳺說縦横攻戰刑法之說行而時君猶欲好􅚨自飾呉起戰士也乃以􅚨服見魏武侯武侯之子恵王與齊宣王皆卑辞厚幣以聘孟子然徒切扵事功卒以迂緩不合人且謂其好辯而巳􅚨墨並稱百家雜說渾殽之矣豈太史公狃見而溺聞若是乎方其叙孔子世家進之與十二諸侯同列周夲紀十二諸侯世家則又皆書曰孔丘卒尊之也至矣及所載多左氏國語雜事欲以明聖人多能聖人豈果以多能称哉又作七十弟子列傳則徒分裂論語問荅以實之餘徴家語弟子解他悉無所徵是亦孟子列傳類也東漢趙𡵨始注孟子其序曰孟子㓜𬒳慈母三遷之教史不載今猶見故列女傳且言孟子将去齊母老擁楹而嘆有憂色母乃引詩易詔之似与充虞路問時意同𡵨又曰有外書四萹文不能弘深今猶略見劉向說苑所謂人知糞其田而不知糞其心者疑即􅒏善辨中語若他事之逸者雖太史公不能具知况後世乎盖戰國以儒自名者八家而四家最顯子㳺氏子夏氏荀氏孟氏孟子學出於曽子子思荀卿猶從而譏之曰世俗之溝愚瞀儒嚾嚾然略法先王案往舊造說而不知其統我則異焉治則法後王而巳矣至於子㳺子夏亦曰是儒之賤者所重必仲尼子弓子弓未審何人韓子曰仲尼弟子有馯臂子弓漢􅚨林傳商瞿授易仲尼瞿傳魯槁疵子庸子庸傳江東馯臂子弓子弓與仲尼不同時又行事無大卓卓不足以配孔子邢昺論語䟽引王弼說逸民朱張字子弓然弼說又不見有他據也要之孔子甞稱冉雍可使南面且在徳行之科雍字仲弓盖與子弓同是一人如季路又稱子路然也將荀卿之學實出於子弓之門人故尊其師之所自出與聖人同列亦巳浸淫扵異端矣於是孟子之沒者久所謂溝愚瞀儒正指萬章公孫丑之徒也荀卿在戰國號稱大􅚨猶同門異户者如此又况鄒衍奭淳于髠墨翟以下諸子違離恠誕者甚矣何可與同傳哉荀卿既死李斯用事孟子之徒黨盡矣悲夫予故夲太史公孟子列傳刪去諸子且益以髙第弟子萬章公孫丑之徒凡十有九人云宋鐃歌騎吹曲序自宋之南遷說者常欲復中原地盖謂大江之南東至滄海西兼巴蜀而北以淮河為外屏然而禹跡所及但自蜀江而下文王之化亦且止行江漢汝墳之域不及江南春秋列國無慮百數江南惟呉越椘三國椘之始封畢路藍縷以啓山林吳越亦㫁髮文身披草莱以立國大江以南半為山海險阻無人之地此天地之氣化所以極衰於古而併盛於今也嗚呼丗之迂者果不諳國勢達時務哉春秋之世呉最強越乗其弊而蹙吴越王勾踐乃䏻無事於覇而自安於蛮夷及王無疆方聽戦國㳺士之說而欲覇椘遂擊越而赱之東盡吳故地北接齊韓魏之邉西壓巫黔中固大國也曽不旋踵又一折而盡輸於秦子女玉帛犀兕材木終不足以抗秦人天府陸海之饒矣當漢氏盛時江西一境人民户口不滿六萬唐之中丗江淮遂為財賦之淵歲奉朝廷而度支經費猶不能給自今觀之魚塩米粟漕運牧飬灌漑之利過於古乎抑不及也謀不審力不蓄兵不練財不阜欲以空言復中原地不亦難乎盖昔景徳澶淵之変上方以北兵深入兩河震動而不以歲幣講和為虞是固欲捐銀絹數十萬匹兩而弃之苟安而巳宣和亰城受圍未暇一戰巳請和而納幣紹興再造不思其􅍔之已成復踵而行之馴至完顔氏之大壊可以監矣開慶鄂渚之虞且欲遵其覆轍卒以不及踐言而致㓕宋之􅍔自祖宗之世兵弱而不修扵内財匱而復割扵外此其實巳久敝矣當完顔氏大壊人孰不曰時可為機可乗大河東北彼巳委而去之關輔以西随以䧟沒山東十數郡奄為盜有宋之設施號令㡬若可行於青齊然彼以既衰就盡之國猶能遣使来督歲幣遣兵直窺江淮且不得以必勝之也况欲以是當西北方王之氣哉當東都盛時每以天下貢賦之全而憂不足三司條例青苗保甲害民蠧國曽不之恤紹興以後國愈䠞財愈匱山林原隰陂澤之所出一切毫計而縷數之至不足自給東南民物之凋弊者極矣買公田造關子亦猶三司條例之遺也雖然亦何𥙷㦲此盖自守不能難與言戰宋亦不復知有中原地矣故老云理宗在宫中甞𬒳酒上芙蓉閣見淮上有黑祲十有餘年不散南偪江凄然淚下巳而彗星竟天灾異若此徒論春秋戰國時事以鼔其說何世之迃也是豈國勢之不諳時務之不達者歟非耶武夷謝翺臯羽故廬陵文公客也於是夲其造基立極親征遣将東討西伐作為鐃歌騎吹䓁曲文句炫煌音韻雄壮如使人親在短簫皷吹間斯亦足以盡孤臣孽子之心巳嗚呼尚何言㢤𥘉漢曲二十二萹魏晋又更造新曲十二萹但頌國家功徳不言别事大樂氏失聀唐栁宗元﨑嶇龍城山谷之間亦擬魏晋未及肄樂府今翺又擬夫宗元者也鐃歌自日出至上之囬凡十二萹騎吹曲自親征至邸吏謁故主凡十篇云淵穎先生集卷之十一
