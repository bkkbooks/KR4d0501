  text: 淵頴吳先生集卷之十一門人金華宋濂編
  hash: sha256:e7f82e7711eda53ae26c86c2ac32ee5e27666dcbc4cf90104551e5f11815af3f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_011-1a}
body:
  text: 石塘先生胡氏文抄後序鄉豫嘗見永康先生胡公錢唐寓舍每嘆古今道術之異及今覽其所論著則尤得其父兄淵源師友講習是非取舍之或不同者蓋自近世周邵二程始推聖賢理數之學以淑諸人然而學者祕之則謂其學之所出者逺有端緒不言師承而今説者乃稱濂溪之所授受實本於夀崕佛者之徒先生至為論辨以著明之曽不容喙是殆當丗士君子之所深感者也夫以周程理學之盛而邵之數學且不能能以並傳於是朱子乃以東都文獻之餘一傳於閩之延平而又兼講於椘之嶽麓誠可謂集濂洛諸儒之大成矣當是時也二陸復自奮於撫之金溪欲踵孟子曽不以循序漸進為階梯而特以一超頓悟為究竟今則至謂朱為支離陸為簡易必使其直見人心之妙而義理自明然後為學自謂為陸實即禪也故曰丗之學者知禪不知學知學不知禪是豈深溺乎異端外學之故而遂誣其祖乃舉堯舜以來七聖相授洙泗以降四子所傳道而悉謂之禪耶惜乎豫年甚少僅得一再見焉而不得親扣其詳也雖然春秋戰國之丗聖人不作處士橫議天下之雜治方術者不為不多是故老與易並稱儒與墨並譽丗之學者或欲援􅚨而入于彼推彼而附于􅚨卒無益也然亦用是而日雜矣流及後丗秦謂方士􅚨漢謂治黃老者􅚨晉王弼遂用老氏之説以注易唐韓愈至謂孔墨之道同道不同則不足以為孔墨然而佛者徒以西方之傑戎暴入中國言語之不達𬒳服之不合趍向之不正而今乃欲一混而大同之不幾於蕩然而無辨矣哉必也天下人心之義理無古今無彼我無華夷無內外雖欲一混而大同之亦可也此其道術之所在苟或不契於古之聖賢則其所以召夫後丗之嘵辨歡咋者不能遽巳先生曽不此憚而直以此道為已任又著明之豫殆不可得而妄測者也夫自江左始平上即遣使重選南士之賢者士之一時幸脫兵燹擾攘城郭墟莽之後當天下大㝎懷才抱藝不肯一出而少試焉是亦終於潔身亂倫而已矣先生蓋自宋季為渝酒人因得陪四川大幕府末議號稱南中八士及宋內附或以先生妵名薦遂召見意謂先生且大用復出而教授廣陵凡歷數任僅尓沒沒於州縣之下僚不至甚顯然觀其所至教士也必曰嚴恭寅畏其教民也必曰孝弟忠信此其道術之正仕處之合文章之懿政事之著誠有大勝于今人而且不後于古人是豈苟然之故而遂已者哉當豫𥘉見先生時先生嘗語豫面膚黑而多皯唇齶掀而不閉皯則無澤不閉將失氣無澤而又失氣匪夀徴也爾曷不閉汝氣而後瞑且爾獨不見尓家甕之盛酒者乎夜甕或不覆則酒旦失味而不中飲汝之失氣亦猶是也豫固疑先生或得乎攝生養氣之道者及豫自燕南還豫又與鄱陽董仲可會稽方九思福唐髙驥生建安虞光祖及金溪傅斯正五六人者再見先生先生則且指語豫曰丗之觀人者自夫出處進退用舍得喪之際有㝎論矣尓等得無頗有怨尤者乎傅之曽祖父夲學於陸亦喜談陸者自近年科舉行朱學盛矣而陸學殆絶丗之學者玩常襲故尋行擲墨益見其為學術之弊意者其幸彂金溪之故櫝而少濯其心耶曽不數年而先生竟以衣冠沐浴端坐嗒然而遽化豫方無以終事則徒識其遺言撫其墜藁而且繼之以涕泣不能自巳嗚呼臨長川而後嘆逝者尚可得耶尚可得耶范氏莛篿卜法序莛篿卜法者夲椘越間小術也自椘屈原始稱有莛篿之卜越相范蠡頗有其書然今特類後丗術者所託要之亦必古有此法矣當卜時自其所向得草木枝𥘉不計多寡左右手一縱一橫揲之以三而數用其仂然後一時之吉凶從違休咎福禍立可見者達賢君子或棄之而不道或時有可采是豈所謂椘人鬼而越人禨者乎蓋昔越相范蠡曽與大夫文種事濮上計然計然世所號文子者也而蠡種實為楚人而往仕越悉通天地隂陽之紀察日月星宿之會明鬼神幽顯之理達龜筮鈐決之奧治國臨政謀敵用武莫不如其所碩欲越以霸強何蠡種之能有以盡乎其術也豫嘗考之大抵本出于太一六壬玄女遁甲風鳥雲氣之道越王勾踐宦吳吳將赦越蠡占則曰王聞喜時日加戊時加卯功曹為螣蛇青龍在勝先是謂時尅其日用又助之事不利而有傷巳而子胥諌不果赦及越王勾踐歸國越既沼吳而蠡去種占則曰王勿追蠡蠡去時隂畫六陽畫三後入天一前翳神光是謂玄武天空無有止者言則死視則狂巳而蠡去匆復追吳越春秋具載其事而史記特推蠡種之術乃出于計然然自越王勾踐之還臨明堂悉練時日又類後丗五行堪輿叢辰等家脫有不合則指為事犯玉門𥘉未審所謂玉門者果何術也吳越春秋蓋輯于東漢趙曄或時漢季頗以天文讖緯九宫八卦占候之書為內學而曄自以其説勦入之歟不然史記之言隂陽多忌諱而太詳者蠡種毋乃酷似之歟是故丗之學為天目計神孤單閉杜奄迫關格制客主别勝負之術者每託于蠡而行之莛篿之卜特其細也然則陽至而隂隂至而陽陽莭剛強而力疾隂莭安徐而重固又且遊觀乎天地四時贏縮進退以為常是豈但古之善用兵者為然哉雖一恆人之欲卜其動作云為亦不過此而巳夫然故微而思慮之所形著而言行之所廢至以天地之霛變鬼神之幽賾而吉凶悔吝之來若有應焉誠有不容掩其偽者雖微端龜正策旋式布棊人心之皎然常足以先知而預㝎矣又况達賢君子出入起居浩乎與天同運彂號施令窅乎與神俱化然且不能不假是以示諸人也莛篿之細時有可采豈謂其果足以盡乎天人之道者哉雖然越王勾踐之隂謀譎術苟他無所徴纎毫瑣末類出於隂陽時日之占而後用事吾猶恐其未必致霸必也五榖蓄金銀實府庫滿兵甲利然後用是以㝎王心之疑動越民之所欲報讎而威敵者則庶幾焉是故今一恆人之所卜雖以民俗間小事亦必天地之氣應與人事相參乃可以見其成功不然則龜為枯骨蓍為朽幹猶不必泥况莛篿之細者哉豫具録之又足以通知古之多異術矣唐律刪要序豫嘗讀唐律每患其繁賾難省故頗刪其要且務觀乎古今立法之淺深用刑之輕重又從而序論之曰夫古者先王之治人也以德而輔之以刑後丗之治人也德則不足而惟刑辟之是用春秋傳所謂三代之衰然後制刑者也自戰國之丗魏李悝始造法經商君受之以相秦及漢悉踵秦故歷代相因至唐則又承陏開皇之律是蓋唐律夲陏漢律夲秦其實一出于戰國李悝盜賊囚捕之緒餘而巳不復二帝三王忠厚哀怛刑期無刑之夲意矣然以秦之為秦焚滅先代之典籍坑僇􅚨生猜鷙強暴嚴戾刻深而詔天下學法令而師吏惟陏則亦庶幾近之而任法者也蓋當秦之時孔子沒而異端起處士橫議而説客妄售其所自為術是非矛盾紛盩相勝然秦方遺仁恩尚首功而􅚨者又不入冝其一意任法用吏以為治若夫陏氏之初江左齊梁貴淫靡代北周齊習蕃夷天下幸歸于一而風俗未淳朝廷議政之臣類皆俗吏米鹽之徒苛刻煩碎未甚有紀故陏且惡其連萹風雲滿篋月露華而不實者而猶未嘗識夫儒者之真亦宜其一意任法用吏以為治孟子蓋曰言非禮義謂之自暴吾身不能居仁由義謂之自棄秦則不知儒而不用非自暴歟陏則不知真􅚨而不淂用非自棄歟是殆秦之任法雖暴于陏而陏之任律則猶襲秦之故智而或過焉者也夫以秦陏惟吏之是師法之是徇目謂其法律之密督責之峻可以肆其鉗制束縛之術于朝廷之上故嘗以一人狙詐猜忌之心而盡疑天下至於衡石程書衛士傳餐而日有不給及觀其所以為效秦則始皇東巡西狩而郡縣之供調不聞不足陏則文帝黎陽洛口倉庾豐盈而其後猶足以聚數百萬之盜賊而不盡誠可謂極其盛者雖然關東之􅍔至有土崩瓦解之勢而一切諉為鼠竊狗偷之盜而不欲聞曽不旋踵而二代之亡若出一轍是何德化之不足而刑辟之是用者遂致然哉然而漢以寬仁攟秦法唐以仁義變陏律蓋欲一返乎秦陏之所為是故漸仁摩義淪肌浹髓必也􅚨者為能究之誠有不在乎俗吏持簿書急期會務筐篋者之所能測識此其創立國法粉飾朝章雖若有愧于二帝三王忠厚哀怛刑期無刑之夲意至於後世杜張之深刻來侯之羅織戕勦民命傷蹶國脈無所不至然猶幸其夲根莭目之正者尚足以維持調護乎天下之故而不極于亂於是馬鄭諸儒曽以文律而章句之長孫無忌等十九人亦巳因律文而作疏義或從或革或損或益且酌其中要非苟然而遂巳者故漢嘗引經以斷獄而深得夫法律之夲唐則每以書判拔萃取士則猶使之知有法律之實而不為空言此殆􅚨者用丗之功天下致治之效將萬一乎先王明刑弼教之餘而固非秦陏任法用吏之世可遽及也嗚呼古今立法之淺深用刑之輕重悉巳具見乎此􅚨者何嘗不知吏而吏則不可不通􅚨尚德化者何嘗不任刑辟任刑辟則不可不務乎德化者也是蓋漢唐之所以得秦陏之所以失誠可為後丗之龜鑑矣儉解史有言周髙祖儉者髙祖常服布𫀆寢布被詔天下庶民以上惟聽衣綢綿絲布圎綾紗絹綃葛布九種餘悉禁之豫謂髙祖未嘗知儉未嘗知禁者也夫古之長民者欲齊其民于是國有異服之禁必使其衣服之不二而從容有常然而齊王之衣紫鄒君之長纓舉國皆從而效之且至去衣紫斷長纓而後止髙祖之意固是也乃以人主之至尊至貴布𫀆布𬒳自同於庶民而矯誣于當丗乎然自元魏周齊之際兵戈日尋民物虛耗髙祖且欲以一儉率先天下使凡奢侈過度者皆有厲禁則國家之經費民庶之藏蓄可以日趨于富盛而無有不足可謂善矣誠求其如王者之政是猶未得其本之説也夫以天下九州之廣生齒之衆今之世去古逺甚然而國家經費之務常若不給民庶藏蓄之資亦或蕩然無所贏餘上固不容不以儉化其民而民亦當以儉而自化雖然未也當國𥘉時始得河北即議宣課銀綃之數河南猶未下及下河南而江淮吳椘實為財賦貢輸之淵藪猶未能隸度支命將出師運芻餽粟宜若晝變馳驅民人困厄不能供億然亦未聞上下以是而不足天下一統六十餘載經費藏蓄兩無其實又何獨異乎國𥘉之時哉夫漢自文景富庶之餘孝武承之而益以侈大東征西伐則有費修郊祀求神仙則有費興土木造宫室則有費巡遊般樂則有費卒使言利用事之臣疲民蠧國海內空虛及其末年始欲務農重榖以救之亦幸而有此爾當今之世一遵祖宗之成法邉境無矢鏃之警宫庭無丹臒之飾歲時常祀亦未始欲講封禪而虗務般遊也然而山林藪澤土力之所産茶鹽酒醋民業之所資一皆日增月羡絲分縷析而悉輸于上西域之羊馬雲南之氈罽青齊之絲纊江淮之粳稻又皆畢入于天府而無所闕夫何大家亡資中户破産小民嗸嗸曽無衣食之所國家上下終未得如文景之富庶豈或猶有類夫孝武之空虗者乎當是之時上欲常服布𫀆寢布𬒳以一儉而化之且未能化又從而務明上下服色之禁自以為髙祖之良法善意復行於天下孰禁之哉談大夫之詩曰西人之子粲粲衣服舟人之子熊罷是裘是故奢侈不法每形于上杼柚其空日困於下人主不是之思乃欲自苦其身而往敦天下之俗且曰吾以一儉率先天下是墨子之道也墨子之道是豈聖人君子之所得為哉吾故謂髙祖未嘗知儉未嘗知禁者是猶未得其夲之説也丗之議者每究其夲蓋曰國家經費之務必在于抑橫政而莭用民庶藏蓄之資必在於修農事而重榖君民上下貴賤一體貧冨相因感之而民不徒于從化制之而民不徒於知禁者盍亦反其夲矣昔者齊宣王出獵於社山父老十三人勞王王曰父老苦矣謂左右賜父老田不租賜父老無徭役閭丘生獨不拜宣王怪之閭丘生曰臣聞大王來遊來勞大王碩得所欲于大王今大王賜臣田不租是倉廪空虗賜臣無徭役是官府無使非臣所敢望也臣碩大王選良富家子有修行者以為吏平其法度春秋冬夏振之以時無煩擾百姓則臣可以少得所欲焉嗚呼自髙祖之良法善意復行于天下又必實之以閭丘生之一言則天下郡縣之間選廉絀貪平法薄賦且將以是為抑橫政修農事之本焉是謂知夲是即孟子所謂無仁政不能平治天下者也是即吾所謂王者之政也作儉解以通之春秋傳授譜序春秋之道夲於一離為三家之傳又析而為數十百家之學學日夥傳日鑿道益散天下後世豈或不有全經乎亦在其人而巳矣自孔子沒七十子言人人殊公榖自謂本之子夏最先出左氏又謂古學冝立諸老生從史文傳口説遞相授受彼此若矛盾然自是學一變主公羊者何休主榖梁者范寧主左氏服雯杜元凱或抒已意或博采衆家蓋纍數十萬言自是學再變公穀微左氏乃孤行不絶説者曽不求決於傳遂􅌹意於訓詁江左則元凱河洛則雯自是學三變間有一二欲考三家之短長列朱墨之同異力破前代專門之學以求復於先聖人義理之極致咸曰唐啖趙氏自是學四變嗚呼言春秋者至於四變可以少定矣豫嘗觀漢𥘉傳公羊者先顯自胡母子都而下得二十四人次傳榖梁自申培公而下得十五人左氏本於國師劉歆未立博士故傳之尚少而東漢為盛東漢以降學者兮散師説離析非徒捨經而任傳甚則背傳而從訓詁嘵嘵歡咋靡然趍下夫學本非不同夲非不一而末異乃若是此其欲抱十二公之遺經悲千古之絶學彂明三家之傳而去取之者誰歟然豫悉得而譜是者四變之極也四變之極必有能反其𥘉者唐啖趙氏蓋嘗有是志矣繼之者又誰歟古之人不云乎東海西海有聖人出焉此心同此理同也南海北海有聖人出焉此心同此理同也自其此心此理而諗之古之人有與豫同者乎不同者乎同者然乎不同者然乎此其沒丗而無聞者多矣顯焉者譜于此也蓋昔唐韋表微曽著九經師授之譜且以譏學者之無師嗚呼人師難逢經師易遇然今經師猶有不可得而遽見者矣則吾是譜之作又豈徒在表微之後乎春秋丗變圖序古之言春秋者自漢至今亡慮數十百家大道之行天下為公一以理斷之而巳猶未足究當世盛衰離合之變而權之者也雖然孔子嘗論之矣天下有道禮樂征伐自天子出天下無道然後諸侯大夫得以專而用焉逆理愈甚則其失之世數愈速此非通論天下之勢也春秋之勢也然而欲論春秋之理者不外此矣公羊子蓋深有得于理勢之相須且曰所見異辭所聞異辭所傳聞異辭而漢之學者特昧昧焉乃設孔子髙曽祖父之三世以制所見所聞所傳聞之治亂春秋非孔子家牒也特以是究當世盛衰離合之變而權之者也蓋昔陳恆之弒君孔子請討之左氏記其言曰陳恆弒其君民之不與者半以魯之衆加齊之半可克也程子非之蓋謂孔子之志必將正名其罪上告天子下告方伯乃幸與國以討之至于所以勝齊者孔子之餘事耳豈計魯人之衆寡哉夫以理言魯為齊弱久矣孔子非不知魯之未必勝也務眀君臣之大義以討天下弒逆之大惡因是足以正之周其復興乎若以勢言周室衰矣晉霸微矣魯又弱國也陳氏世掌齊政民私其德必處人倫之大變天理之所不容於是舉吾全魯以繼之則齊之罪人斯得矣是故弒君之賊法所必討者正也專國之姦勢亦有所未易討者然必有以權之者矣人孰不曰事求可功求成是取必於智謀之末也聖人不如是也嗚呼自王政之不綱而後有霸自霸圗之無統而後無霸人情事變雖未嘗出於一㝎惟理則無有不定此古之學春秋者所以率論理而不論勢也自今觀之天下之勢在是春秋之理則亦隨其勢之所在者而見之春秋之𥘉丗去西周未逺王室猶欲自用焉下及中丗齊晉二霸相繼而起則霸主從而託之耳至其末年王不王霸不霸夷狄弄兵大夫專政是戰國之萌也而世變亦於是乎極公羊子所見異辭所聞異辭所傳聞異辭蓋深有得於理勢之相須者此也漢之學者且曰隱桓逺矣孔子則立乎定哀之間耳逺者亂近者治聖人所以成一王之法也此豈求其説不得而強為此論者哉又幸因其有是而後世得以惟其當丗盛衰離合之變與夫聖人之權者先􅚨蓋曰有隱桓莊閔僖之春秋有文宣成之春秋有襄昭定哀之春秋此三者豈非公羊子之遺説哉然則豫之所以圖是者非私見也非鑿説也公羊子意也孔子意也春秋舉傳論序黃子讀春秋者四十年老而不􅌒嘗著春秋舉傳論一編屏除專門􅊧剔傳疏使之一歸于是然後止蓋昔者聖人之作春秋也筆則筆削則削咸斷之於聖心髙第如遊夏且不能以一辭贊焉公羊榖梁乃謂得之子夏文多瑣碎語又齟齬要之二氏皆未成書特相授受于一時講師之口説者謂孔子當㝎哀丗多微婉其辭復祕不以教人故諸弟子言人人殊異然自孔子後一廢於戰國嬴秦之亂漢𥘉學者區區收輔意其焚殘亡脫之餘不藏之屋壁必載之簡册非徒出口入耳而巳又况春秋之文數萬獨以口相授受庸詎和不有訛謬者乎濟南伏生治尚書上使掌故眺錯往受之僅一女子述其老耄之語丗謂生齊語齊語多艱澀故今書文亦難屬讀然古人之作書者非齊人也奈何若是是則公羊齊學榖梁魯學非二氏誤也學二氏者誤也且孔子又何嘗當定哀世多微辭哉苟曰微辭以辟􅍔春秋不必作矣况㝎哀又孔子所見之世也自所聞所傳聞之世一切褒之貶之且及其父祖當丗而輒微之吾恐非聖人意也聖人豈避嫌者哉不然亂臣賊子僅誅其既死篡弒奪攘無懼于當世是又豈吾聖人之意哉必也春秋之作未始祕不以教人西狩之二年孔子卒矣論語禮記諸弟子之問答殆無一言以及之得其義者蓋寡矣然而左氏約經以作傳下訖魯悼知伯之誅在春秋後孔子卒巳久或曰左氏魯人也或曰左氏椘左史倚相後也若其説晉王接則謂别是一書意者當西漢末與公榖二家羊立博士故又雜立凡例廣采它説以附於經是豈左氏舊哉今黃子舉之皆是也昔者晉劉兆嘗以春秋一經而三家殊塗乃取周官調人之義作春秋調人七萬餘言夫調人之聀掌司萬民之讎而諧和之為春秋者亦欲令三家勿讎將天下之理不協于克一而後世之議且容其潛藏隱伏于胸中也何以調人為哉故唐啖助趙匡近世劉敞於傳有所去取咸自作書而今黃子又嗣為之可謂聞風而興起者矣非必曰此有所短彼有所長去其所短則見其所長者固可取也不然盡去三家之傳而獨抱聖人之經且自以為必得聖人之心者吾又不信也此則黃子之意也孟子弟子列傳序太史公孟子列傳首孟軻繼鄒衍奭淳于髠慎到荀卿墨翟尸佼長蘆子曰皆在孔子後荀卿可言也彼數子者不同道奈何同傳將以孟子置諸戰國辨士之流乎是又非不知孟子者也一則曰述唐虞三代之德二則曰述仲尼之意彼數子者亦有一於此乎當戰國之時士多以遊説縱橫攻戰刑法之説行而時君猶欲好􅚨自飾吳起戰士也乃以􅚨服見魏武侯武侯之子惠王與齊宣王皆卑辭厚幣以聘孟子然徒切于事功卒以迂緩不合人且謂其好辨而巳􅚨墨並稱百家雜説渾殽之矣豈太史公狃見而溺聞若是乎方其敘孔子世家進之與十二諸侯同列周夲紀十二諸侯世家則又皆書曰孔丘卒尊之也至矣及所載多左氏國語雜事欲以明聖人多能聖人豈果以多能稱哉又作七十弟子列傳則徒分裂論語問答以實之餘徴家語弟子解他悉無所徵是亦孟子列傳類也東漢趙𡵨始注孟子其序曰孟子幼𬒳慈母三遷之教史不載今猶見故列女傳且言孟子將去齊母老擁楹而嘆有憂色母乃引詩易詔之似與充虞路問時意同𡵨又曰有外書四萹文不能弘深今猶略見劉向説苑所謂人知糞其田而不知糞其心者疑即􅒏善辨中語若他事之逸者雖太史公不能具知况後世乎蓋戰國以儒自名者八家而四家最顯子遊氏子夏氏荀氏孟氏孟子學出於曽子子思荀卿猶從而譏之曰世俗之溝愚瞀儒嚾嚾然略法先王案往舊造説而不知其統我則異焉治則法後王而巳矣至於子遊子夏亦曰是儒之賤者所重必仲尼子弓子弓未審何人韓子曰仲尼弟子有馯臂子弓漢􅚨林傳商瞿授易仲尼瞿傳魯稿疵子庸子庸傳江東馯臂子弓子弓與仲尼不同時又行事無大卓卓不足以配孔子邢昺論語疏引王弼説逸民朱張字子弓然弼説又不見有他據也要之孔子嘗稱冉雍可使南面且在德行之科雍字仲弓蓋與子弓同是一人如季路又稱子路然也將荀卿之學實出於子弓之門人故尊其師之所自出與聖人同列亦巳浸淫于異端矣於是孟子之沒者久所謂溝愚瞀儒正指萬章公孫丑之徒也荀卿在戰國號稱大􅚨猶同門異户者如此又况鄒衍奭淳于髠墨翟以下諸子違離怪誕者甚矣何可與同傳哉荀卿既死李斯用事孟子之徒黨盡矣悲夫豫故夲太史公孟子列傳刪去諸子且益以髙第弟子萬章公孫丑之徒凡十有九人云宋鐃歌騎吹曲序自宋之南遷説者常欲復中原地蓋謂大江之南東至滄海西兼巴蜀而北以淮河為外屏然而禹迹所及但自蜀江而下文王之化亦且止行江漢汝墳之域不及江南春秋列國無慮百數江南惟吳越椘三國椘之始封畢路藍縷以啓山林吳越亦斷髮文身披草萊以立國大江以南半為山海險阻無人之地此天地之氣化所以極衰於古而併盛於今也嗚呼丗之迂者果不諳國勢達時務哉春秋之世吳最強越乘其弊而蹙吳越王勾踐乃能無事於霸而自安於蠻夷及王無疆方聽戰國遊士之説而欲霸椘遂擊越而赱之東盡吳故地北接齊韓魏之邉西壓巫黔中固大國也曽不旋踵又一折而盡輸於秦子女玉帛犀兕材木終不足以抗秦人天府陸海之饒矣當漢氏盛時江西一境人民户口不滿六萬唐之中丗江淮遂為財賦之淵歲奉朝廷而度支經費猶不能給自今觀之魚鹽米粟漕運牧飬灌溉之利過於古乎抑不及也謀不審力不蓄兵不練財不阜欲以空言復中原地不亦難乎蓋昔景德澶淵之變上方以北兵深入兩河震動而不以歲幣講和為虞是固欲捐銀絹數十萬匹兩而棄之苟安而巳宣和亰城受圍未暇一戰巳請和而納幣紹興再造不思其􅍔之已成復踵而行之馴至完顔氏之大壞可以監矣開慶鄂渚之虞且欲遵其覆轍卒以不及踐言而致滅宋之􅍔自祖宗之世兵弱而不修于內財匱而復割于外此其實巳久敝矣當完顔氏大壞人孰不曰時可為機可乘大河東北彼巳委而去之關輔以西隨以陷沒山東十數郡奄為盜有宋之設施號令幾若可行於青齊然彼以既衰就盡之國猶能遣使來督歲幣遣兵直窺江淮且不得以必勝之也况欲以是當西北方王之氣哉當東都盛時每以天下貢賦之全而憂不足三司條例青苗保甲害民蠧國曽不之恤紹興以後國愈蹙財愈匱山林原隰陂澤之所出一切毫計而縷數之至不足自給東南民物之凋弊者極矣買公田造關子亦猶三司條例之遺也雖然亦何輔哉此蓋自守不能難與言戰宋亦不復知有中原地矣故老云理宗在宫中嘗𬒳酒上芙蓉閣見淮上有黑祲十有餘年不散南逼江凄然淚下巳而彗星竟天災異若此徒論春秋戰國時事以鼓其説何世之迃也是豈國勢之不諳時務之不達者歟非耶武夷謝翺臯羽故廬陵文公客也於是夲其造基立極親征遣將東討西伐作為鐃歌騎吹等曲文句炫煌音韻雄壯如使人親在短簫鼓吹間斯亦足以盡孤臣孽子之心巳嗚呼尚何言哉𥘉漢曲二十二萹魏晉又更造新曲十二萹但頌國家功德不言别事大樂氏失聀唐栁宗元﨑嶇龍城山谷之間亦擬魏晉未及肄樂府今翺又擬夫宗元者也鐃歌自日出至上之回凡十二萹騎吹曲自親征至邸吏謁故主凡十篇云淵穎先生集卷之十一
