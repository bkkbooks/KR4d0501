front:
  text: 淵穎吳先生集卷之五門人金華宋濂編
  hash: sha256:313ce8aaccb6b975827e1bcd42687ff6e315fc4d8453116c6945b8354f2975a3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_005-1a}
body:
  text: 論倭臣愚不佞揆今之世提封萬里東西止日所出入南北皆􅔄于海邉徼無烽燧之警士卒無矢鏃之費外夷重譯鄉風效順梯山航海莫不來獻方物漢唐之盛所未有也然以倭奴海東蕞爾之區獨違朝化三十餘年奉使無禮恃險弄兵當翦其鯨鯢以為誅首可也而迄今未即誅意者其有説乎臣切即前事觀之海東之地為國無慮百數北起拘耶韓南至耶馬臺而止旁又有夷洲紵嶼人莫非倭種度皆與會稽臨海相望大者户數萬小者僅一二百里無城郭以自固無米粟以為資徒居山林捕海錯以為活漢魏之際巳通中國其人弱而易制慕容嵬曽掠其男女數千捕魚以給軍食其後種類繁殖稍知用兵唐攻百濟百濟借其兵敗于白江口乃逡巡斂甲而退今之倭奴非昔之倭奴也昔雖至弱猶敢拒中國之兵况今之恃險且十此者乎鄊自慶元航海而來艨艟數十戈矛劍戟莫不畢具銛鋒淬鍔天下無利鐡出其重貨公然貿易即不滿所欲燔􅌊城郭抄掠居民海道之兵猝無以應追至大洋且戰且郤戕風鼓濤􅍅湧前後失于指顧相去不啻數十百里遂無奈何喪士氣虧國體莫大于此然取其地不能以益國掠其人不可以強兵徒以中國之大而使見侮于小夷則四方何所觀仰哉唐太宗擒頡利而靺鞨來朝太宗曰靺鞨逺來突厥既服也今倭奴不及于突厥逺甚若其內屬如靺鞨者又多臣恐其有效尤于後也以臣度之倭奴之國去髙麗耽羅不逺今戍髙麗耽羅者當不下數百萬戍慶元海道者當亦不下數百萬比嵗水教以作士卒之氣大艦數百薄海上下然迄未能以兵服之者地絶大海險故之以間往征之三軍之士感激嗚咽誓不再見父母妻子颶風連晝夜大魚跋扈驚觸篙柂徑弩不暇發囓舌相視不幸而有覆艦之虞衣襟結聮溺死枕藉幸而一存拔刀斫舷手指可掬雖親戚不相救援生死尚未能保何暇較勝負哉昔者隋人統五十二萬人伐髙麗髙麗終拒守不下所恃者鴨緑一小江耳今倭奴之強固不如髙麗而大海之險甚于鴨緑水者奚啻幾十倍其人率多輕悍其兵又多銛利性習于水若鳬鴈然又能以攻擊為事而吾海道之兵擐甲而重戍無日不東面望洋而嘆使其恃強不服雖盡得而勦之摧朽拉腐也而彼乃肆然未嘗一懼非恃險也何敢若是吳嘗浮海伐夷洲矣獲其人三千而兵不助強隋嘗浮海伐留仇矣拔其城數十而國不加益何也人非同我嗜欲弗能生也地非接我疆土弗能有也為今之計果出兵以擊小小之倭奴猶無益也古之聖王務修其德不敢勤兵于逺當其不服則有告命之詞而巳今又往往遣使臣奉朝旨飛舶浮海以與外夷互市是有利于逺物也逺人何能格哉魏文帝謂辛毗曰昨張掖獻徑寸大珠今欲求之曷若辛毗對曰聖王惟德之務四夷畢獻方物求而得之不足貴也今不若罷我互市從彼貿易中國免徼利之名外夷知效順之實計莫便于此彼倭奴者心嗜利甚我苟不以利徼之雖不煩兵猶服也何以知其然也漢建安中鮮卑軻比能稍寇遼東三郡其後來朝則詰之曰我雖夷狄亦人也禽獸猶知擇美水草以居况我人乎哉前者守臣數徼我以利使吾不得畜牧吾故叛去今反其法吾故來又况倭奴之人稍知文字豈反不及軻比能耶而獨不知效順者此臣所以日夜扼腕切齒為朝廷惜也臣年長矣每思傅介子班超之所為慨然嘆息使二子不自奮于絶域未免為田里之匹夫功或不成于漢朝至老死亦無聞于後世臣自揆不能如二子之智而欲有二子之功罪不容于死幸而朝廷假臣一命奉其告辭得往喻之亦一竒也議者必曰鄉曽數遣使猶不得要領近自對馬絶景等島渡大海徑趍太宰府髙麗耽羅沮撓百出留使臣不使遽見中夜守護排垣破户喧呶器號兵燧交舉後雖僅得其使介來廷終至渝平而不服意者一泛使之遣未足以服之乎自臣觀之今則髙麗耽羅巳服所未服者倭奴而已然亦不勝其懼矣故今遣使不可與鄉遣使並論也臣必謂其王曰海東之地曽不能當中國一大州其兵衆之多寡可料而知也以今中國之盛不即加誅于海東者天子之德不忍煩兵于逺非有愛于海東也鄉者王之衆航海而來驚我海道之兵且戰且郤王之輜重喪失者太半而我曽不損一毫三軍之士忿然含怒甚唯寐忘之當慶元海道者莫不𬒳堅甲跖徑弩帶利劍飛艦蔽海而東超足距躍輕風濤萬里之險決死生以問罪于王兼之髙麗耽羅之衆其識海道習水性與王國同是王數面受敵也然迄今未即加兵者意王猶有人心欲以禮義服之又不忍煩兵以苦王以故遣使臣來今朝廷攻王之土地非如伐夜郎略朝鮮可以置城守也雖得之越海弗能有也寶珠金帛積如丘山不恃外夷之貢獻也殊方異物來獻于廷又不假王之重貨也罷我之互市從王之貿易是吾土地之所産王反得而用之也然王之名物不譯于舌人也久邉隙一開市易且有禁非王之利也旦夕大兵且來王必悔之王若聽使臣是得效順之美名而免受敵之實患也此臣喻之之説也形釋客有問曰生故􅌒遊也頗有聞于今之世乎泰階既平滄海不波仁漸八荒德𬒳邇遐東陬渺蟠木西紀泝流沙麒麟鳳凰襂褷翕赩徴瑞乎山谷神芝朱草勾萌甲坼納祥于水涯上又招賢良選廉茂訪遺逸舉孝弟開承明廣內之廷設金馬石渠之署髙者登公卿大夫次猶輔文學掌故逺方鄙人詹望歌詠以需進用之日者久矣又豈有卑汚連蹇局縮齷齪不少遇乎生嘗竊志於是少始知學長又益加義理析秋毫辭章掞春華亦既絶江河略青徐東掎齊魯之郊北睨燕趙之都英豪間出俊造交驅指南文苑擩嚌道腴蓋將追蹤乎三五而方駕乎羲蘧然且名不躋仕版身不離樵蘇口不攻辨智足不利走趍誠不能與世之豐衍博碩輕便侈汰者比數乃若此之拘也是何昔者元造肖形之過乎豫則應曰唯唯否否若客所謂知其一未知其二者也乾清坤濁交錯思屈原宋玉王揚司馬支離輪囷綺繢艷冶言文辭者則或蜀而或楚詩書禮樂雕龍炙輠公平正大浮淫奓詡言道術者則或齊而或魯喑嗚則雷震指顧則雲聚立談則谷風發條遄怒則秋雨流潦頎然而長厖然而厚博然其肩背哆然其顴輔出材于山野升俊乎天府窮足憫黎民逹足事聖主猶欲發乎汪罔之封守驅乎昭如之海濵軺車尚有所不能載三馬尚有所不能勝若是乎恢梧倜儻苞容庨􅣲有異于恆人者乃足為國家之用稱天下之珍則豫之不足也知已甚矣今夫豫志氣不剛筋力不強容貌不通于世俗衣冠不合于康莊空洞坌塞而無統繆悠迂誣而不得當處闤闠則心勦形瘵望山林則獸駭鳥行鳥慷慨而長嘯跰􅓷以自鑒且謂夫元造肖形之過也則客將閔宋人之苗而揠之使長乎不然世固有是者矣竦肩而千技攘臂而百變拏棹則凌氷霜膏車則犯雪霰蓋已前鼓金張之虗譽後攀許史之密援王貢彈冠而肯慶蕭朱結綬以互薦是固先聲之所及無論乎么麼眇小血肉之軀而上不許之見也客乃逌然笑惕然謝曰古之人不云乎形之厖也類有德聲之宏也類有能然卒以是致敗而不復振豫不敢復相天下士矣是故鯨鯢蕩而失水雖螻蟻之細微或為之制麋鹿介而離山雖文豹之拳捷或肆其噬晏嬰短而臨災安趙武呐而故絳理沈尹瘠而屈折白公孟嘗眇而招徠多士斯豈非其人乎姑欲激生而使進于此也生今上希道德中效儒墨巧匠之手無曲木而惟其器之用聖人之門無棄人而惟其材之得不究其學之是非乃徒汝形之為惑是且輕詩人之忠厚掩説士之噤吟捨茈葫桔梗于戰國之澤而不收榛楛棫朴于成周之林也不亦左乎改元論上先王之始得天下也必明一代之好尚以新斯民之耳目聞改正朔矣未嘗聞改元也然則啇訓稱元祀春秋書元年者何以哉曰是直史官紀述之常體耳將以志人君之在位久近者也非王者以是為重事也後之説春秋者乃欲以改元為重春秋之𥘉周平王立四十有九年而魯隱公又改稱元年藉令重在改元何不襲稱王者之年傫數而明詔于人哉抑魯以周公之裔且僣改之也苟或僣改必冝誅絶于夫子之筆削又反從而書之獨非撥亂反正之道乎蓋自古未嘗有改元為是説者特出于戰國秦漢之間周之既衰秦與列國爭稱王其𥘉即位時猶以諸矦之爵行國中國人皆稱之曰公及後以王自稱史官欲少異之明其稱王之始故曰某王改元是豈班班然播告于其國者哉徒以書之載籍而巳耳何則秦惠文王孝公之子也立十三年矣十四年乃稱王而秦史改元魏惠王武侯之子也立三十六年矣三十七年乃稱王而汲冡竹書亦改元又十六年而後惠王卒非改元也明秦魏之始稱王也此殆為史官者自志其國之事猶春秋之于魯史也求其説而弗得又大惑焉且謂西伯在啇紂世亦嘗稱王亦嘗改元其兆特因戰國之秦魏秦魏豈果以改元為王者之重事哉説者恆曰為國君者即位之明年必告廟以臨群臣然後改元然以之言告廟則可臨群臣則可以之言改元則未可國君嗣位定于𥘉喪先君之終即嗣君之始若曰緣終始之義一年不二君特臣子之情不忍遽死君父故居喪自稱曰子國內民人之心繫之久矣將為史官者以先君之薨年不得便為嗣君之始年始待其明年告廟之際乃次第以書之如太甲祗見厥祖而元祀之文著于商訓也以事繫日以日繫月以月繫時以時繫年書之以年則又繫于一國之君是皆有不得不然者也故曰直史官紀述之常體耳然則何以變一為元杜預曰人君即位欲其體元而居正故不言一年一月此説善也而後之説春秋者自異焉亦不合于春秋矣改元論下為春秋者曰惟王者然後改元東周之遷王政不行諸侯亦皆改元近而宋魯逺而晉椘下及邾莒滕薛雜小國莫不皆然魯或以是而改曆晉或以是而改正朔秦或以是而創閏月此又似是而實非者也太史公三代本紀有三代世表徴尚書尚書無年故年不可載乃以世紀之十二諸侯世家有十二諸侯年表六國年表共和以下徴春秋左氏內外傳秦始皇以上徵戰國䇿皆有年故既以世紀之又以年實之然或已失其世系失其年代失其名爵矣且先王之世有小史外史以掌邦國四方之志諸侯無私史也晉之乘椘之檮杌魯之春秋至東周而後有是故十二諸矦之年始可得譜然不可得譜者亦多矣燕至惠矦而始有君秦至穆公而始有名椘至若敖而始有年滕薛騶雖文武之褒大封小不足齒他大國當西周之盛亦徒紀之以世而巳近者詳逺者略也非必曰以周之衰而諸矦各自改元推春秋之義此尚得為大一統乎蓋古之王者無改元惟用舊歲季冬頒來歲十二月朔于諸矦諸矦受而藏之祖廟至則以特羊告廟請而行之東周既不頒曆故魯亦作私曆猶私史也若諸矦固自有日御矣秦以僻陋之國邊在戎夷于是始有史官始創閏月則猶魯曆也然三王之正不同而獨夏數得天啇周革命且改正朔以示不相沿襲巡狩承享兵農田獵猶自夏焉故周官有正月有正歲正月夏正正歲周正三正之通于民俗尚矣汲冡竹書雖用夏正以紀晉事抑何嘗有改元之説哉若曰東周諸矦皆改元則此晉事上起殤叔殤叔晉穆侯少子成師也别封曲沃是時文矦昭矦猶在殤叔比晉一大夫耳無緣改元特武公卒併宗國不數文矦直推殤叔以繼穆矦徒志其始封與卒年也太史公漢興以來諸矦世表髙祖功臣矦年表類于每國書某王元年某矦元年方天下大定奉漢法度行漢年號固也又况孝武新建元而輒自改元可乎淮南鴻烈亦稱淮南元年許慎注云淮南王安始封之年也特為史官者欲著每國之名爵年代世系故一以是書之非改元也􅊲之于漢者如此則可見東周諸矦之必不然矣秦誓論上秦穆公因𣏌子之謀以伐鄭鄭人知之既還而晉人又敗之于殽內愧蹇叔外為諸矦所笑咨嗴痛惜發言自誓且以咎其聽言之失而巳欲戰之心固自若也修而車賦警而師徒逞其憤怒求以報復非不欲詢老成棄新進也言猶未已而兵遽出于晉郊然則夫子何以獨列之書乎將不取其悔過乎曰夫人誰無過過而能悔然後能改改過君子之心也以君子之心行王者之事將巳亂非生亂將寡怨非積怨穆公有一于此乎今徒信其區區自誓之言不察其無道用兵之罪雖説春秋者亦不敢少責于秦反以深責于晉是不知秦猶晉也且曰晉人三敗秦師秦之見報人之常情也未至如晉之甚晉人又輒報之則過矣故春秋常情待晉襄王事待秦穆文之四年穆公雖見伐而不報然後可以實其悔過之言是又非也夫以秦之所謂悔過云者吾知其心矣必也追念既往之敗引咎歸已作為言語以自解于國人使國人不徒忘其死傷暴骨之戚且又作其迅奮欲戰之憤封殽地之死骨啓隴西之霸圖蓋巳盡在于自誓之一日是則因敗為勝轉禍為福而鬪士自倍者也若夫文之四年穆公非不欲報伐也兵出纍年民勞國敝又復有事西戎闢國十二固少愒耳未始一飯不在晉也六年之夏穆公卒矣不然晉不先動而秦輒加兵非結怨亂之甚者乎雖以康靈桓景繼體之君出事巳隔世讎猶未釋自僖三十三年殽之戰迄宣十五年輔氏之戰凡幾戰矣三四十年之間和好未嘗協兵釁未嘗解不顧義理之是非而專以干戈為報復夷狄之道也春秋且以是而狄之矣穆公為有以基之者也烏在其能悔過乎雖然自其言而論君子不以人廢言此夫子所以獨列之書也自其事而􅊲二帝三王以來世變至此極矣是未可以王事待之者也齊宣王伐燕而敗慚見孟子而陳賈乃教之以文過由是較之則穆公之所以為賢者豈不逺矣秦誓論下方周之東遷平王之命蓋與成康太平之世無以異于是哀痛慘惻之心亡矣周道不幾於衰乎雖然聖人猶有望于魯魯周公之胄秉禮之國也魯不足望則天下之勢不併于秦而不止是故帝王之末簡而秦魯之誓書附之豫嘗論其不然當春秋之時秦幾霸矣始無與于王室之盛衰自殽之戰大敗于晉兵戈日尋無有寧歲東諸矦不復與盟會又且南合于椘晉椘爭衡秦何有焉晉人曰齊秦椘狄方強今三強服矣敵楚而巳椘人曰捨齊秦他國請相見也是秦不晉椘若也且秦之興始于孝公之用啇鞅成于惠王之取巴蜀地形便兵力壯蠶食六國並吞二周戰國之秦也非春秋之秦也此其去吾聖人之卒也亦久矣雖吾聖人之答子張以百世可知必曰其所因者在乎禮其所損益者在乎制度文為小過不及之間耳非若後世讖緯術數之學也烏知周之必併于秦哉聖人不作諸子雜説並起左丘明國語載史伯之言亦曰夫椘重黎之後也黎為髙辛氏火正昭顯天地以生柔嘉薑嬴荆芈實與諸姬代相干也薑伯夷之後嬴伯益之後也伯夷能禮于神以佐堯伯益能儀于物以佐舜其後皆不失祠而未有興者周衰將起矣又曰武王之子不在應韓必在于晉且使鄭桓公勿逼焉而别寄帑于虢檜然亦何以異嚮所云哉夫西周之末王政舛錯史伯知其必亂則當矣齊固大國也雖晉文矦帥師以救周難猶次國耳椘亦蠻夷蕞尓子男之邑秦仲方入仕于周尚未得𡵨豐地未列于諸矦豈特與諸姬代干也哉必周之東遷齊始霸晉亦相繼而霸秦則桀驁于西椘則暴橫于南而鄭也適居四方之會交南北之衝彼四國者恆困之矣丘明將與魯悼公同時且推其所見而言皆傅會無誠實猶戰國之世見秦之強遂謂聖人敘書之際巳覩其勢之若此而特以感傷之微意寓焉非行事之深切著明者也然則書何以列費誓秦誓曰伯禽𥘉封適有淮夷之寇以修內備以扞外侮井井然各有條法蓋聖人善之者也非有望于魯也若夫秦誓則吾前論及之亦詩之取魯頌啇頌也如是而巳矣孔子不貶季札論春秋吳子使札來聘吳蠻夷之國也君稱爵大夫稱名而不氏因其始通禮蓋未同于中國也是特椘椒秦術一例而書耳説者曰春秋責賢者備吳子使札春秋不稱其公子是貶也然則曷為貶札賢者也本其辭國以生亂故聖人特託其來聘而貶之也是不然夫吳子夀夢有子四人長曰諸樊次曰餘祭次曰夷昧季則札也父知其賢兄弟亦知其賢嘗欲立以為嗣矣又且約以次傳而致國矣然終不肻有其國豈不曰立嫡者以長傳國者以賢苟不顧人道之大倫以成其父兄之志誠不若守匹夫之介節而得其退耕于野之安也何則長幼之序不可紊君臣之分不可姦將巳亂也非生亂也今則諸樊兄弟巳死夷昧之子僚乃立吾將奉嗣君之命而歷聘乎上國豈料魚劍之變驟起于肘腋之間哉聖人固不得以是而豫貶之也闔廬之謀王僚之弒且知季札必不受成國于賊手僅以先君傳授之次第藉口于國人雖常人之情猶得之矣况聖人乎説者則曰太伯奔吳而不返季歷嗣位而不辭武王繼統而受命亦不以配天之業讓伯邑􅊲也是又不然夫太伯之去因古公之欲立其弟季歷嗣位非不辭也端委治吳而不返豈可殞周家已成之業哉若伯邑􅊲則且為御于啇見殺于文王之世矣使太伯返則季歷不肯承西伯之任伯邑􅊲在則武王亦不肻任天下之責太伯之德雖在于讓季歷之賢武王之聖非皆出于不讓也父子世常法也兄弟及則法之始變也陽甲盤庚之間殷以是亂者九世豈獨季子之辭國乃生亂哉説者則曰叔齊之德不越伯夷孤竹舍長而立幼私意也諸樊兄弟無及季札之賢者父兄眷眷焉欲立札公心也是又不然夫伯夷以父命為尊叔齊以天倫為重彼此交致其讓而各盡其心以故聖人賢之然季札又何以知其為公心哉諸樊兄弟欲承父兄之志使有其國盍不于吾魯隱桓之際觀之乎惠公欲以桓為嫡禮之所不得為也惠公縱其邪心而為之隱公又探其邪志而成之秪以自禍而巳夀夢其惠公也諸樊兄弟其隱公也吾見其邪尚何公心之足云哉且謂季札生亂于辭國殊不知使有其國亂益甚矣説者則曰春秋多變例聖筆有特書􅍮椘無大夫而屈完書族王朝下士以人通而子突書字諸矦公子以名著而季友書子母弟之無列者不登其姓名而叔肹書氏皆以賢而特書也若仲尼亦賢季札必依此例而特書矣是又不然夫齊桓召陵之師椘人未有必盟之意也而屈完請服王人救衛之役王室微矣而又使子弟主兵故子突不得有功季子來歸則我公請之于齊而欲以靖魯國之亂叔肹之卒則又或以公弟之貴而世遂為卿聖人之特書者特因四子以主義豈得與季札例言之哉然則春秋之旨主于吳之來聘不主于季札之讓國季子之來聘可見也讓國不可見也吳之始通禮未同於中國吳子之使札是猶椘子之使椒秦伯之使術也聖人一以是書之至若椘之自州而國自國之有君有大夫而後漸同于中國後日椘子之使薳罷君以爵大夫以名氏椘殆盛矣聖人果賢之乎否也今則春秋書之曰札而不稱公子者吳之始通猶未至于椘之􅐛盛故也又况吳子之使聘者一國之事季札之讓國者一家之事春秋魯史也主于吳之聘我者耳若季札之辭國生亂非惟聖人不能于是貶之雖聖人欲于是而稱其讓國之賢亦所不能也要之為此説者公羊則曰賢季子穀梁則曰善使季子夫季子固賢者也春秋亦不以其賢而不名也公羊所謂許夷狄者不一而足是也若以吳子之使札為善札賢而名所以成尊于上椘椒秦術名而非賢也又將何以成其君乎是蓋吳之始通而後有聘賢札貶札聖人不暇論也今又反因二傳之説強附他義且貶為非賢者何哉失聖人之本旨矣與黃明逺第一書論日夜食頃見舉穀梁春秋違失有日夜食之辨及觀劉氏權衡亦謂春秋據見而録不應書日夜食何休難之得矣鄭康成強為文過耳豫嘗􅊲之日月之贏縮有常度則日月之薄蝕者候之亦且有常聖人之作春秋所以宣明曆數而示諸人者固不能必日之不夜食也莊之十有八年三月日食上不著日辰下不稱晦朔是則穀梁求所以解經足以知日之有夜食鄭君知所以驗日之有夜食以故寧分穀梁之過而不辭古者天子有日官諸矦有日御世修其業以攻其術孔子為春秋之故亦修殷之故曆夫曆春秋之所重也後之儒者或造家術或用黃帝以來諸曆必先推􅊲日食以驗春秋何則日之行也有中道月之行也有南北九行當其晦朔之交或食淺或食深或頻月迭食或曠嵗不食是皆後世善算者所能及也何休難曰春秋書日食不言月食日者因其無形也故闕其疑何緣以夜食書乎豫嘗推鄭君之説知日之必有夜食言乎前月之晦日入久矣言乎次月之朔日出而已虧傷蓋天之晝夜以日之出入為分人之晝夜以天之昏明為節此傳所謂因王者之朝日而後見日之有虧傷也今而曰一日一夜合為一日日始出而虧傷未完是朔食也如或不見其虧傷則可謂夜食耳夫自周天三百六十五度有畸者而論之天平運而舒日月則內轉而縮日一日一夜一周天而在天為不及一度若月巳不及十三度有畸以日之速用月之遲退以及之一月之間積二十九日九百四十分日之四百九十九日月一會是則二十九日少半日也天運之參差不齊日食之在晝在夜不可以一定論也必以日之始出則為晝食日之既沒夜行地下則將不得為夜食乎徐邈曰日夜食衆星無光蓋衆星託日以為光者也世之登泰山者夜半觀海出日人世之暗暗猶故也於此而或食謂之食朔可矣晝食未可也又安得不曰夜食乎豫嘗逺徴前代魏永安二年十月已酉日食地下虧從西南角起近據宋世淳熙十二年九月望太史言月食在夜新曆楊忠輔言月食在晝慶元四年九月朔太史言日食在晝草澤陳大猷言日食且在夜月猶有晝食又况穀梁巳有日夜食之傳乎夫曆本春秋之所重者也今而曰孔子從周何嘗􅊲殷曆設􅊲之矣今論語家語禮記中庸皆不見也雖然論語所載詩書禮樂皆嘗討論獨無一語及春秋將謂春秋非孔子作可乎襄之二十有八年書春無冰哀之十有二年書冬十有二月螽不冝有螽而有螽可以有冰而無氷是二者仲尼或指以為司曆之過魯曆差矣則殷曆庸有不􅊲者乎今而又曰杜元凱嘗用劉歆三統曆著春秋長曆亦不曽因推長曆言日夜食雖然元凱長曆晦朔參差甲乙舛錯委曲從傳反謂經必有誤是雖未始明言日食之在夜吾以天運􅊲之則必知日之有夜食不敢謂聖經之必無也抑長曆併􅊲古今十曆乃知三統最踈固不肯因而用之以著長曆長曆大概劉洪乾象曆耳乾象斗分細故不可通于古殷曆斗分粗故不可通于今薑岌有是言也庸詎知春秋不用殷曆乎今而又曰自堯以來因日之出納為晝夜若日出而已虧傷便是晝食不必言夜是故旦則驗日𥘉昏則驗星此説善矣然聖人之作春秋所以宣明曆數而示諸人者將不復以日月薄蝕之故而後定也不然則固不能必日之不夜食也嗚呼天文曆數之學不易言矣聖人之占天也有可以度數求者有不可以度數求者而其理固自行乎其間又豈得以吾耳目之所及者而遽定也哉然今曰日夜食經本無明文惟見于穀梁子穀梁子魯學也至漢鄭君信之晉范寧又信之今之世學者主胡氏胡氏亦信之豫固不敢以不信也然則吾明逺之所舉云者傳之不信而惟何休劉敞之緒論是徴故又敢始終辨之淵頴吳先生集卷之五
