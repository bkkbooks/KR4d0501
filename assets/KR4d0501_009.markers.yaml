  - {type: variant, offset: 8496, length: 0, content: '', WYG: 九欽定四庫全書淵頴集卷十元呉萊撰讀唐太宗帝範初唐太宗帝範一卷十有二篇太宗甞手撰以教太子五代䘮亂書有録而遂闕暨今上征雲南僰夷始出以獻而舊十有二篇復完予聞古今欲治}
  - {type: page-break, offset: 8496, content: '', id: KR4d0501_WYG_010-1a, image: WYG1209/WYG1209-0169a.png}
  - {type: variant, offset: 8497, length: 1, content: 九, WYG: 主不世出甞必立為治天下之法使其後嗣子孫有以世守之而不敢失墜不幸而一旦昬庸懦弱之主或繼其後亦得有所扶持憑藉不至於甚亂而僅存此雖三代聖人創基垂統立經陳紀而務欲定為法度典章者然亦不過數傳則已自弃其先祖之訓䠞國敗家接踵而有夏之太康商之帝甲武乙周之幽厲宜若無異於漢唐之季世然猶幸賴其法度典章之炳然播於宗廟布在有司賢聖之君復有赫然而振起者有此具也自是以來漢承秦亂而高祖立漢家之法唐受隋亂而太宗設唐室之制嗚呼漢法逺矣盖惟唐制傳之未久而天下多事邊徼侵凌藩鎮䟦扈盗賊相挺而起莫之能救此其故何哉當隋氏大壊太宗始鋭然盡舉天下於盗手即議立國法粉飾朝章誠欲創其基業於前而特垂其統緒於後使後嗣子孫得以繼續而行且將有恃於此而不害於無所守者是故職官之任定以常員師徒之備設以府衛用以授田則口分世業之法均度以斂財役民則田租身庸户調之制不紊自古者聖賢之道不作而一切霸强苟簡之術用大宗乃能慨然庶㡬乎先王仁義之意而務成貞觀二十餘年治平之功自漢以來可謂古今欲治不世出之主矣然而太宗每知太子之仁孝慈懦恐不足以任國而僅述古昔聖賢之遺訓帝王之常法强而敎之謂為帝範及至太子即位曽不㡬時内則惑於嬖后外則斥逐賢相則夫天下國家紛紜變故之迭至曽不可以思患而預防者卒至於易姓改號殺僇宗姓而後已然猶幸其有所扶持憑藉且不至於盡亂而僅存者賴有法也惜乎當時太宗立法之際身教則從言教則訟每求其所以致然者自其法度典章之中或不能自免其瑕釁間隙之可議書有之曰丕顯哉文王謨丕承哉武王烈佑啟我後人咸以正罔缺太宗之為治無乃文謨武烈一本於正又能無缺者豈或猶有可憾者耶何則太宗親定宇内盖因隋氏高麗䘮師之後而得之自其即位北㓕突厥薛延陀西制高昌徙其種人編置沿邉州郡而蕩然無有蕃漢内外之防及其晚年又且東征高麗瀕死而弗已是雖高宗之慈懦猶襲其故深異乎漢孝元之議罷珠崖者降及數世而明皇繼之君臣晏安邉隙數動至竭天下之兵委之西北付以藩臣中國空虛大盗承之而遽起由是天下多故藩鎮盤錯奚契丹深入河北吐蕃囬鶻連陷秦隴震驚都邑師徒撓敗土境日䠞而唐室之號令所及曽不出淮浙巴廣數十郡地而遂已職官之任師徒之備授田之法斂財役民之制大抵悉改於其舊此豈非當世邉境用兵之或過遂致蔓延於中國而不少熄哉然以唐之子孫昬庸懦弱或危或微不絶若綫是雖太宗之法守之有未盡替得以扶持憑藉不至於甚亂而僅存誠求其所以致是亦由太宗平日貪勝好名之過瑕釁間隙實有以先開其源而漸熾其禍是則太宗前者包括四海指麾羣夷適足以為當今屈己和親敗軍卻境之效不可救已夫然故唐之一代天下之致治莫如太宗天下之致亂亦或自於太宗而後世議者不之覺也嗚呼予觀太宗之志嘗欲法三代欲行周禮遂絀封徳彛之説而専用魏徴之仁義貞觀之治夫豈近世所可遽及使其當時立法之際而其身之所行者一本於正無復可議則雖三代聖人創基垂統立經陳紀之道何異於是然而太宗終以不能逺及者是亦貪勝好名之一過也詎不信夫詰玉靈辭予少嘗有四方志既長而益病且惜其志之或不我遂也於是假爾泰龜用以卜其出處行藏之决者而玉靈無所徴雖然古之龜書則久而不傳於世矣作詰玉靈辭予昔日之有事兮曽端䇿乎元龜䖍揭我以吉繇兮曰逺行之不疑志因循而弗立兮年偃蹇以失時祗自奮而復蹶兮豈玉靈之獨吾欺惟玉靈之神聖兮諒天道之秉為練時日之臧否兮佩國家之安危何嘉林之飬夀兮撫芳苓以敖嬉遽清江之授節兮竟豫且之見羈將靈繹其果獵兮爰眡髙乎卜師矧梁卵及夫焍黄兮幸鑚灼而無遺真古今之至寳兮實誠敬以自持曷玉兆之罔信兮匪巫咸其孰能詰斯嗟童耆之我恪兮展素書以延竚歴壯志之未及少試兮迄環堵之恒處彼周路之砥平兮喜掉鞭而騰翥此嵓谷之險幽兮閟蓬蒿以羇旅况卑汚而蹇淺兮久屈蟠於泥土廼虛夸而誕慢兮謂音節之恊夫宫羽言無徴而悉合兮行無實而畢舉用静作之在人兮何㝠頑之不吾告語緬天高而地下兮聿依附以相成尚祁寒與暑雨兮或怨咨以為聲當耘耨而務植兮迨負儋則資贏每叫號而衒鬻兮競馳騖以交争紛燕南而越北兮特踡跼而不行頋秦肥而楚瘠兮恍肝膽之相攖窮心思其恣横兮罄利欲之搶攘使太虚之日以百變兮曽不足以應夫萬有之異情粤隂陽之雜糅兮肇品庶之憑生宜洪纎動植之散殊兮實豫定其翅足與根莖何自知之不徹兮却釁祓乎厥靈苟厥靈之伊赫兮僅枯骨之我鏗胡文}
