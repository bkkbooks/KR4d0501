  - {type: line-break, offset: 0, content: '', id: KR4d0501_SBCK_005-1a01}
  - {type: variant, offset: 0, length: 2033, content: 淵穎呉先生集卷之五門人金華宋濂編論倭臣愚不佞揆今之世提封萬里東西止日所出入南北皆􅔄于海邉徼無烽燧之警士卒無矢鏃之費外夷重譯郷風効順梯山航海莫不来獻方物漢唐之盛所未有也然以倭奴海東蕞爾之區獨違朝化三十餘年奉使無禮恃險弄兵當翦其鯨鯢以為誅首可也而迄今未即誅意者其有說乎臣切即前事觀之海東之地為國無慮百數北起拘耶韓南至耶馬臺而止旁又有夷洲紵嶼人莫非倭種度皆與㑹稽臨海相望大者户數萬小者僅一二百里無城郭以自固無米粟以為資徒居山林捕海錯以為活漢魏之際巳通中國其人弱而易制慕容嵬曽掠其男女數千捕魚以給軍食其後種類繁殖稍知用兵唐攻百濟百濟借其兵敗扵白江口乃逡廵歛甲而退今之倭奴非昔之倭奴也昔雖至弱猶敢拒中國之兵况今之恃險且十此者乎鄊自慶元航海而来艨艟數十戈矛劍㦸莫不畢具銛鋒淬鍔天下無利鐡出其重貨公然貿易即不滿所欲燔􅌊城郭抄掠居民海道之兵猝無以應追至大洋且戰且郤戕風鼔濤􅍅湧前後失扵指顧相去不啻數十百里遂無柰何䘮士氣虧國體莫大扵此然取其地不能以益國掠其人不可以強兵徒以中國之大而使見侮扵小夷則四方何所觀仰㦲唐太宗擒頡利而靺鞨来朝太宗曰靺鞨逺来突厥既服也今倭奴不及扵突厥逺甚若其内屬如靺鞨者又多臣恐其有効尤扵後也以臣度之倭奴之國去髙麗躭羅不逺今戍髙麗躭羅者當不下數百萬戍慶元海道者當亦不下數百萬比嵗水教以作士卒之氣大艦數百薄海上下然迄未能以兵服之者地絶大海險故之以間徃征之三軍之士感激嗚咽誓不再見父母妻子颶風連晝夜大魚䟦扈驚觸篙柂勁弩不暇發囓舌相視不幸而有覆艦之虞衣衿結聮溺死枕藉幸而一存㧞刀斫舷手指可掬雖親戚不相救援生死尚未能保何暇較勝負㢤昔者隋人統五十二萬人伐髙麗髙麗終拒守不下所恃者鴨緑一小江耳今倭奴之強固不如髙麗而大海之險甚扵鴨緑水者奚啻幾十倍其人率多輕悍其兵又多銛利性習扵水若鳬鴈然又能以攻擊爲事而吾海道之兵擐甲而重戍無日不東面望洋而嘆使其恃強不服雖盡得而勦之摧朽拉腐也而彼乃肆然未嘗一懼非恃險也何敢若是吳嘗浮海伐夷洲矣獲其人三千而兵不助強隋嘗浮海伐留仇矣㧞其城數十而國不加益何也人非同我嗜欲弗能生也地非接我疆土弗能有也爲今之計果出兵以擊小小之倭奴猶無益也古之聖王務脩其徳不敢勤兵扵逺當其不服則有告命之詞而巳今又往往遣使臣奉朝旨飛舶浮海以與外夷互市是有利扵逺物也逺人何能格㢤魏文帝謂辛毗曰昨張掖獻徑寸大珠今欲求之曷若辛毗對曰聖王惟徳之務四夷畢獻方物求而得之不足貴也今不若罷我互市從彼貿易中國免徼利之名外夷知効順之實計莫便扵此彼倭奴者心嗜利甚我苟不以利徼之雖不煩兵猶服也何以知其然也漢建安中鮮卑軻比能稍㓂遼東三郡其後来朝則詰之曰我雖夷狄亦人也禽獸猶知擇美水草以居况我人乎㦲前者守臣數徼我以利使吾不得畜牧吾故叛去今反其法吾故来又况倭奴之人稍知文字豈反不及軻比能耶而獨不知効順者此臣所以日夜扼腕切齒為朝廷惜也臣年長矣毎思傅介子班超之所為慨然嘆息使二子不自奮扵絶域未免為田里之匹夫功或不成扵漢朝至老死亦無聞扵後世臣自揆不能如二子之智而欲有二子之功罪不容扵死幸而朝廷假臣一命奉其告辭得徃喻之亦一竒也議者必曰郷曽數遣使猶不得要領近自對馬絶景䓁島渡大海徑趍太宰府髙麗耽羅沮撓百出留使臣不使遽見中夜守護排垣破户喧呶器號兵燧交舉後雖僅得其使介来廷終至渝平而不服意者一泛使之遣未足以服之乎自臣觀之今則髙麗躭羅巳服所未服者倭奴而已然亦不勝其懼矣故今遣使不可與郷遣使並論也臣必謂其王曰海東之地曽不能當中國一大州其兵衆之多寡可料而知也以今中國之盛不即加誅扵海東者天子之徳不忍煩兵扵逺非有愛扵海東也郷者王之衆航海而来驚我海道之兵且戰且郤王之輜重䘮失者太半而我曽不損一毫三軍之士忿然含怒甚唯寐忘之當慶元海道者莫不𬒳堅甲蹠勁弩帶利劍飛艦蔽海而東超足距躍輕風濤萬里之險决死生以問罪扵王兼之髙麗躭羅之衆其識海道習水性與王國同是王數面受敵也然迄今未即加兵者意王猶有人心欲以禮義服之又不忍煩兵以苦王以故遣使臣来今朝廷攻王之土地非如伐夜郎略朝鮮可以置城守也雖得之越海弗能有也寳珠金帛積如丘山不恃外夷之貢獻也殊方異物来獻于廷又不假王之重貨也罷我之互市從王之貿易是吾土地之所産王反得而用之也然王之名物不譯扵舌人也乆邉隙一𨳩市易且有禁非王之利也旦夕大兵且来王必悔之王若聴使臣是得効順之美名而免受敵之實患也此臣喻之之說也形釋客有問曰生故􅌒㳺也頗有聞扵今之世乎泰階既平滄海不波仁漸八荒徳𬒳邇遐東陬渺蟠木西紀泝流沙麒麟鳳凰襂褷翕赩徴瑞乎山谷神芝朱草勾萌甲坼納祥于水涯上又招賢良選廉茂訪遺逸舉孝弟開承明廣内之廷設金馬石渠之署髙者登公卿大夫次猶𥙷文學掌故逺方鄙人詹望歌詠以需進用之日者乆矣又豈有卑汚連蹇局縮齷齪不少遇乎生嘗竊志於是少始知學長又益加義理析秋毫辭章掞春華亦既絶江河畧青徐東掎齊魯之郊北睨燕趙之都英豪間出俊造交驅指南文苑擩嚌道腴盖將追蹤乎三五而方駕乎羲蘧然且名不躋仕版身不離樵蘇口不攻辨智足不利走趍誠不能與世之豐衍博碩輕便侈汰者比數乃若此之拘也是何昔者元造肖形之過乎予則應曰唯唯否否若客所謂知其一未知其二者也乾清坤濁交錯, WYG: ''}
