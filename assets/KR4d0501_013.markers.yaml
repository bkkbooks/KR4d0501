  - {type: variant, offset: 390, length: 3, content: 誤卷第, WYG: 主一邑丞則賛治而但掌農田水利主簿惟掌簿書尉則惟督盗賊令亦不勞獨議其政之當否而已今自一命而上皆出於吏部遇一事公堂完署甲是乙否吏或因而為姦勾稽文墨補苴罅漏塗擦嵗月填塞辭欵而益不能以盡民之情状至於唐世之賦上供送使留州自有定額兵則郡有都試而惟守之所調遣宋之盛時嵗有常貢官府所在用度贏餘過客往来禀賜豐厚故士皆樂於其職而疾於赴功兵雖不及於唐義勇民丁團結什伍衣裝弓弩坐作擊刺各保鄉里敵至即發而郡縣固自兼領者也今則官以錢糧為重不容盗臣常俸至不能自給或多贓吏兵則自近戍逺既為客軍尺籍伍符各有統帥但知坐食郡縣之租稅然已不復繫守令事矣夫辟官涖政理財治軍郡縣之}
