  - {type: variant, offset: 1269, length: 0, content: '', WYG: 以賑救而坐致流亡是以言涖事而事權不在於郡縣言興利而利權不在於郡縣言治兵而兵權不出於郡縣尚何以復論其富國裕民之道哉嘗求其故自我國家起自北土經理中原中原豪傑擅動甲兵保有鄉里因而降附使據其境土如古諸侯大開幕府辟置官屬錢糧獄訟一皆専制於已而不復有闗乎上已而山東猘子地富兵强跳踉負固卒貽征誅殱滅而後天下郡縣一命之官悉歸於吏部錢粮獄訟類皆闗白奏讞而不敢少自専焉由是郡縣守令之職始輕而不得自重矣必也辟官涖政理財治軍四者之權一歸於郡縣則守令必稱其職國可富民可裕而兵農各得其業矣此予所謂重郡縣之選嚴守令之職者盖視唐宋之故典為然實當今之急務也於是本歐陽子之所集為疏其古今郡縣之沿革與夫政令之設施不同者以序之雖然此固非歐陽子之意也予亦過論矣哉樂府類編後序初太原郭茂倩次古今樂府但取標題無時世先後紛亂厖雜摹擬蹈襲層見間出厭人視聽今姑就茂倩所次辨其時代且選其所可學者使各成家又從而論之曰古之言樂者必本於詩詩者樂之辭而播於聲者也太史采之太師肄之世道之盛衰時政之治亂盖必於詩之正變者得之詩殆難言矣乎自秦變古詩樂失官至漢而始欲脩之燕代荆楚稍恊律吕街衢巷陌交相唱和當世學者司馬相如之徒徒以西蜀雕蟲篆刻之辭而欲立漢家一代之樂府傳及魏晉流風寖盛而其所謂樂者亦止於是嗚呼今之去漢則又逺矣故今或觀樂府之詩者一切指為古辭雖其浮淫鄙倍不敢芟夷殘訛缺漏不}
