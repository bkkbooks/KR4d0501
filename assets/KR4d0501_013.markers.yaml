  - {type: variant, offset: 319, length: 0, content: '', WYG: 漢初黄老盛行至武帝又好神仙文成五利之徒迃誣恠譎之士神光巨跡千變百幻雖嘗一致橋山之祠欲追黄帝之遺風者獨不及老子神仙方技豈又與道家戾歟東漢以來世之儒者方以天文卦侯為内學而為天子公卿之所賔禮甚則自陷於鬼道左慈啟之葛𤣥紹之𤣥之後則有鄭君鄭君之後則有葛洪葛洪之後則有陶𢎞景洪與𢎞景本儒者當天下多故欲自縱於方外逸民之間一傳而王逺知再傳而潘師正三傳而呉筠司馬子微考其學今天隠子之所述已盡之矣予觀天隠子冲澹而閒曠虚靚而寡欲黄老之遺論耳然而龍虎鉛汞抽添吐納之事未之及也豈或秘而不言歟夫以老子之脩道養夀雖太史公猶不盡信又况後世之迃誣恠譎者可必得而悉徴之歟自今道家而言彼謂性宗儒者則曰此心也必主於覺彼謂命宗儒者則曰此氣也必保其純一天人逹性命因其血肉口鼻之粗而得與造化溟涬同入於無盡藏之妙此古之人所以長生而不死者豈或别有其術歟不然天隠子之學亦止於是而已歟或曰孔子甞師老子吾聖人盖尸假者也特以語恠而不言故曰述而不作敏而好古竊比於我老彭老則老耼彭則彭祖也雖然老子東周一柱下史耳幽王時有伯陽父顯王時有史儋本是二人且不與老子同時老子固夀矣太史公欲合伯陽父史儋為一人且為老子則亦疑弗能定也彭祖本大彭氏國陸終氏第三子當堯時始封又國語曰大彭豕韋則商滅之注謂在武丁時自堯至武丁中興上下且七八百年亦無縁大彭之國自興至滅止當彭祖一世世之言彭祖夀者吾又可得而必信之歟盖孔子所言老彭自是商之賢大夫不謂老耼彭祖也老子甞問禮矣彭祖者竟何為耶豈或果有養生之説耶嗚呼吾聖人未甞言養生然亦未甞不養生禮者所以節其動容周旋樂者所以發於詠歌舞蹈禮樂不斯須去身無非養也固未甞以養生言也天地隂陽闔闢屈伸之變亦何所不有夫又何謂乎尸假矣哉嗚呼天隠子逺矣吾將東往海上庚桑而問焉庶㡬果有所遇而必得之者耶歐陽氏急就章解後序歐陽子急就章一卷盖據元豐九域志作也自唐失其御天下分為}
