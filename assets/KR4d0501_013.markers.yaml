  - {type: variant, offset: 1276, length: 1, content: 字, WYG: 為左氏忠臣哉休固陳蕃客也自謂妙得公羊本意故今有公羊墨守十}
  - {type: punctuation, offset: 1277, content: /, id: KR4d0501_krp_013-bkkpn489}
  - {type: variant, offset: 1278, length: 2, content: 行匆, WYG: 卷榖梁廢疾三卷左氏膏肓十卷北海鄭康成獨反之學者多篤信康成今猶見甯所集榖梁解又服䖍自有左氏三家之説後出者皆傳於今殊不知胡母生江公劉子駿諸人}
  - {type: page-break, offset: 1278, content: '', id: KR4d0501_WYG_012-25a, image: WYG1209/WYG1209-0207c.png}
  - {type: punctuation, offset: 1279, content: ), id: KR4d0501_krp_013-bkkpn490}
  - {type: variant, offset: 1281, length: 2, content: 追匆, WYG: 云何也藉令諸人所説不廢至今並傳孰能有以大公至正之道一正之哉不然猶治亂絲益棼之也訛日以訛舛日以舛不以聖人之經觀經而徴諸傳不以賢者之傳解傳而又徴諸何氏范氏杜氏獨何歟幸今三家之説尚未泯則唐陳岳之折衷此也庶有得乎盖昔漢儒甞以春秋斷獄予謂非徒經法可以斷獄而獄法亦可以斷經何者兩造之辭具備則偏聽之惑無自而至矣揚子雲曰衆言淆亂折諸聖讀春秋者曽不明漢晉諸儒之遺論又何貴乎學者之知經也哉春秋權衡意林後題劉子作春秋權衡自言書成世無有能讀者至意林猶未脱藁多遺闕盖昔左氏言孔子作經從諸國赴告故又慱採他事以附經今劉子乃據閔因叙謂聖人悉徴百二十國寳書傳者從之將}
  - {type: page-break, offset: 1281, content: '', id: KR4d0501_WYG_012-25b, image: WYG1209/WYG1209-0207d.png}
  - {type: page-break, offset: 1281, content: '', id: KR4d0501_WYG_012-26a, image: WYG1209/WYG1209-0208a.png}
  - {type: punctuation, offset: 1282, content: (, id: KR4d0501_krp_013-bkkpn491}
