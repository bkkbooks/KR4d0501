  - {type: variant, offset: 9, length: 1, content: 第, WYG: 間為予占考其法則曰聖人之立卦者八故天下之物苟合於數者亦不過八吾則本其所值之數輒以八乗除之或以身之所處定其坐作動静之殊或以字之所畫測其向背俯仰之異八而已矣自八而六十有四自六十有四而四千九十有六用此道也嗚呼生之於易勤矣要之特京房之法耳生則又曰是固本之希夷氏者也豈彼生者希夷氏之遺裔歟先天四圖吾聖人之學也生盍歸而務求其要歟}
  - {type: page-break, offset: 9, content: '', id: KR4d0501_WYG_012-7b, image: WYG1209/WYG1209-0198d.png}
