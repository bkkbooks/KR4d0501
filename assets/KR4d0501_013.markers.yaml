  - {type: punctuation, offset: 17, content: ), id: KR4d0501_krp_013-bkkpn3}
  - {type: variant, offset: 17, length: 8, content: 憢􅌊憢疑燒七葉後, WYG: 者尚矣幽贊乎神道發揮乎天理是豈無其故乎特未甞膠於多忌}
  - {type: punctuation, offset: 19, content: (, id: KR4d0501_krp_013-bkkpn4}
