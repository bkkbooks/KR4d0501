  - {type: punctuation, offset: 1270, content: (, id: KR4d0501_krp_013-bkkpn487}
  - {type: variant, offset: 1270, length: 1, content: 衍, WYG: 附益頋獨何哉誠以古辭重也魏晉以降盖惟唐人頗以詩自名家而樂府至雜用古今體當其初年江左齊梁官闈粉黛之尚存及其中世代北蕃夷風沙戰伐之或作是則古之所謂亂世之怨怒亡國之哀思者而唐人之辭為盡有之欲求其如漢魏之古辭者少矣雖然漢承百王之敝治不及古唐之於漢則又不及於漢者逺甚是故秦虢列第國忠秉政妖淫蠱惑養成禍亂而天下之俗日趨於弊蕃戎搆難隴右陷沒侵陵侮辱䠞我疆埸而天下之勢卒以日趨於危擐甲執兵無有休息唐之盛時雖若未見其䘮敗亂亡之戚及其既衰而遂不能救然則唐世之治固有以致之而唐人之辭亦於是乎有以兆之者矣嗚呼世道之盛衰時政之治亂盖必於詩之正變者得之豈不然哉然而上自朝廷下至閭閻委巷苟觀其詩者則又必因其言辭之所至聲音之所發而悉悟其心術之所形氣數之所至予聞唐有宋沉者開元宰相璟之曽孫每太常樂工奏伎即能揣其樂聲之休咎遇有工善篳篥者且曰彼將神逰墟墓伎雖善至尊不宜近已而果然衆工大驚夫以春秋之世鄭之七子嘗賦古詩而趙孟欲以觀其志之所向然今宋沉乃能以其善樂之故察人死生貴賤不遺毫髮何其神哉嗚呼詩本所以為樂也詩殆難言矣乎今之學者深沉之思不講而講為麄疎鹵莽之語中和之節不諧而益為寂寥簡短之音此其心術之所形氣數之所至不惟趙孟知之是皆見誚於宋沉者也予故論之使後之讀是編而欲學是詩者可不慎哉春秋釋例後題春秋左氏漢初本無傳者劉子駿始建明之欲立學官諸儒莫應然傳之者亦已衆多賈景伯服子慎並為訓解及晉而杜元凱又作經傳集解三十卷釋例四十卷且歴詆劉賈之違獨不言服氏豈或不見服氏書乎亦不應不見也世族譜本之劉向世本地志本之泰始郡國圖長厯本之劉洪乾象厯世多言其天文星厯為長然説經多依違以就傳似不得為左氏忠臣者南北分裂館陶趙世業家有服氏春秋是晉永嘉舊寫華隂徐生徃讀之遂撰春秋義章以教學者是永嘉時猶未尚杜氏青州刺史杜坦及其弟驥世傳其業故齊地亦多習之坦元凱之𤣥孫也姚文安秦道静初亦學服氏後更兼講杜説劉蘭張吾貴之徒則又隠括兩家同異義例無窮嗚呼漢初習經者専門而今河洛習傳者宗服子慎江左尚杜元凱矣晉劉兆始取公榖及左氏説作春秋調人而今蘭吾貴又㑹服杜之説矣聖人之道不自是而愈散哉自唐孔穎逹春秋正義}
