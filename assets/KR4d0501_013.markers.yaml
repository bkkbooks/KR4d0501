  - {type: variant, offset: 1284, length: 0, content: '', WYG: 時諸國所赴告者各有書也抑此豈即墨子所稱百二十國春秋乎東遷以來晉有乘楚有檮机魯有春秋秦世家文公以後始有史以紀事王道衰諸侯力政二百}
