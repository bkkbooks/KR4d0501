  - {type: indent, offset: 8, content: 　, id: KR4d0501_krp_013-bkkind2}
  - {type: variant, offset: 8, length: 0, content: '', WYG: 題曰桑海遺録且以待太史氏之采擇古詩考録後序予嘗從黄子學詩黄子集漢魏以来古詩凡數十百篇詩之作尚矣盖古今之言詩者異焉古之言詩主於聲今之言詩主於辭辭者聲之寓也昔者孔子自衛反魯乃與魯太師言樂樂既正矣而後雅頌各得其所史遷則曰古詩三百餘篇聖人特取其三百而被之弦歌所謂洋洋盈耳者不獨主於聲也或因其斷章取義而欲以導其言語之所發或本其直指全體而務以約其性情之無邪是又不以其辭哉制氏世世在大樂官盖頗識其鐘鼓之鏗鏘而不能言其義鹿鳴騶虞伐檀文王四調猶得為漢雅樂之所肄且混於趙燕楚代之謳者無㡬自其辭言古今義理之極致一也自其聲言則樂師矇瞍之任未必能勝夫齊魯韓毛四家之訓詁者也雖然古之安樂怨怒哀思之音盖將因其辭之所寓者而盡見之故當時之聞韶者則從容和緩觀武者則發揚蹈厲是獨非以其聲辭之俱備然哉自漢魏以來誠不可以望古三百篇至於上下千有餘載作者間出如以其聲則沈休文之樂志王僧䖍之技録自能辨之苟以其辭則今無越乎黄子之所集者吾猶恐古之言詩不専主於聲而今之言詩亦不専主於辭也何則古之言詩本無定聲亦無定韻聲取其諧韻取其恊平固未始嘗為平仄固未始嘗為仄清固未始不叶為濁濁固未始不叶為清自近世王元長沈休文之徒始著四聲定八病無復古人深意新安呉棫材老乃用是而補音補韻先儒亦嘗取是而叶詩叶離騷盖古今之字文不同南北之語言或異而音韻隨之是雖不待於叶而自能叶焉者也故當觀其辭然則古之言詩者辭而言樂者則聲也采詩之官不置樂府之署不設吾無以聲為也若夫今之言詩既曰古近二體古體吾不敢知而近體乃謂之為律者何也又安得不求夫聲辭之俱備而後為至哉考乎古者考此足矣試以是而復之黄子序于末編陳氏大衍易數後序凡天下之物必有理而後有象有象而後有數數始於一有一而後有二一者竒二者耦而後有隂陽老少之變七八九六之䇿䇿三變而成爻爻六變而成位此聖人所以觀變而立卦考象數而建卜筮者也易曰大衍之數五十其用四十有九自其大衍之五十者總之則又合於太極之一是皆天地自然之運又豈待乎人力之强為者哉何則一定者理也雖其體甚實所該無形未始有定者事也雖其跡本虚因應乃有理在是數亦不外乎是欲求其極則天地之開闢人物之消盡且可以數莖之蓍參兩而盡决之者吾聖人固未肯輕為之説也是何世之喋喋者然哉自秦滅六經易以卜筮故存漢儒林傳孔子六傳至菑川田何易道大興魏郡太守京房則又受學外黄焦延壽不與何同漢初河内女子始獻易説卦盖與老子同藏於風雨屋牆之間京房之説互相出入故世之稽吉凶刺休咎者徵焉是果吾聖人之遺意哉它則進退以㡬而為一卦之主者為世對待以世而為其主之相者為應世之所位而隂陽之所肆者為飛肇乎所配而隂陽終不脫其本者為伏起乎世應周乎内外終終始始而後動爻互體五行納甲之變無不具者人自以為能探河洛圖書之頥家自以為能發周孔爻象之藴餘則或入於淫瞽方技之流與易大相逺矣先正盖有見焉必以名理論易而或不以象數論易雖然是又可得而盡廢者哉栝蒼陳生嘗出大衍易數一}
