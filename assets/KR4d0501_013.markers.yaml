  - {type: variant, offset: 370, length: 1, content: 葉, WYG: 路外制兩國遼得燕雲三闗之險夏制靈武河西之饒大河東北陜西五路之民嵗窘於兵不暇自救一旦而南遷呉㑹荊襄兩淮又為邉面而應敵重以山東張林李全之變淮甸空虚蜀本最險平世金珠錦繡之美衣被中國金房假道徒示夾攻黎嶲竒兵竟成斡腹由是兵燹相仍創殘不振則亦非復舊矣然惟呉㑹近畿之境自唐五代以來呉越世奉正朔保境息民盖至宋移蹕江閩嶺海之所犇輳及其既亡又未嘗苦操尺寸之兵而拒敵故今人物之所聚土地之所産猶足以為天下最雖若一城百里之縣至或升為散州上秩以治之國家經費度支資給陸輦海運動至百萬豈民力之果裕哉此猶富家萬金之産田連阡陌粟盈倉廥要亦取之有窮用之有竭初不可以富强恃而不惟安飬之是務也嗚呼豈惟東南一隅雖㠯西北休飬生息之餘亦不可以不深加其意矣是故當今之務欲富國者必在於養民欲飬民者又必在於重郡縣之選嚴守令之職苟重其選將任之以久而可成功苟嚴其職將權有所歸而易集事今之世每以三嵗為守令滿秩曽未足以一新郡縣之耳目而已去又况用人不得専辟臨事不得専議錢糧悉拘於官而不得専用軍卒弗出於民而不得}
