  - {type: variant, offset: 41, length: 98, content: 行呼嘑呼當十作嗚葉後二行噌泓泓疑吰十一葉之誤後六行儵魚儵當八作鯈行逃晴晴當作睛卷第二二葉前八行石璧璧當三葉前作壁五行突奥突疑穾六葉後之誤十一行載藉藉當七作籍葉前一行匾當後九作行邦瀆邦疑刋八葉後之誤, WYG: 次度數}
