  - {type: 'kr:non-cjk', offset: 1272, content: ○, id: KR4d0501_krp_013-bkkkrnonc96}
  - {type: variant, offset: 1272, length: 0, content: '', WYG: 用杜氏非徒劉賈之説不存服義亦不盡見固不若兩存之以見服杜之為孰愈也今釋例具在有劉蕡序蕡太和中對賢良䇿譏切人主斥罵宦者文極激學一本春秋與漢董生天人}
  - {type: variant, offset: 1273, length: 1, content: 葉, WYG: 䇿相為上下蕡亦自擬董生且曰昔董仲舒為漢武帝言之未盡者今臣復為陛下言之壯哉蕡乎至為此序獨不類唐文之衰至此極矣春秋纂例辨疑}
  - {type: page-break, offset: 1273, content: '', id: KR4d0501_WYG_012-23a, image: WYG1209/WYG1209-0206c.png}
  - {type: punctuation, offset: 1275, content: /, id: KR4d0501_krp_013-bkkpn488}
  - {type: variant, offset: 1275, length: 0, content: '', WYG: 題自唐世言文者一變而王楊盧駱再變而燕許三變而韓栁雖其文振八代之弊及見當世經生攻訓詁治義疏則深敬之太常殷侑新注公羊退之欲為之序幸得掛名經端以蘄不朽及寄詩盧仝又言其抱遺經束三傳然仝所著春秋摘微一卷間見一二亦未甚為學者輕重惟子厚荅元饒州書恒願掃於陸先生之門執弟子禮㑹先生病子厚出邵州竟不克卒業先生盖河東陸淳元冲也與子厚同郡且云先生師天水啖助及趙匡知聖人之㫖兼用二帝三王法至先生大備春秋集注纂例辨疑微指等書包羅旁魄轇轕上下一出於正於是乎春秋有啖趙陸氏之學徃予北㳺京師始從國子學見陸氏纂例十卷是金泰和間禮部尚書趙秉文手本太原板行後又得陸氏辨疑七卷微指二卷而集注乆闕自唐世學者説經一本孔氏正義及宋之盛説者或不用正義六經各有新注争為一已自見之論而欲求勝於先儒已成之説宋子京傳唐書猶不滿於啖助者豈啖助實有以開之故歟雖然啖趙陸氏未可毁也後之學者自肆於藩籬閫域之外口傳耳剽而不難於議經者必引啖趙陸氏以自解是或未之思也夫春秋折衷後題自西漢學者専門之習勝老儒經生世守訓詁不敢少變繼而舊説日以磨滅新傳之後出者獨傳於今春秋一經始立公羊氏學又立榖梁氏學東漢左氏學又盛行古傳後出者日勝後儒注古傳而世亦取後出者為宗公羊氏有胡母生嚴彭祖顔安樂而後何休獨有名榖梁氏有江公尹更始而後范甯獨有名左氏前有劉子駿賈逵服虔後有杜預故預亦獨有名嗚呼豈預必}
  - {type: page-break, offset: 1275, content: '', id: KR4d0501_WYG_012-23b, image: WYG1209/WYG1209-0206d.png}
