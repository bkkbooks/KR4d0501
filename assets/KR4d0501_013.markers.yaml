  - {type: punctuation, offset: 25, content: /, id: KR4d0501_krp_013-bkkpn5}
  - {type: variant, offset: 26, length: 1, content: 誤, WYG: 學欲肆其一定之説也苟曰乾坤開闔莫非一造化亭毒之妙某言必有某徵某事必有某應喜樂好惡出於人之情豐饑華泄雹興於天之治天人兩間似皆有以潜囬其機宻運其軸而無難者是管窺蠡測而已矣自劉向言皇極之建不建京房又推易卦直日用事董仲舒眭孟之徒又分春秋二百四}
  - {type: punctuation, offset: 27, content: /, id: KR4d0501_krp_013-bkkpn6}
  - {type: variant, offset: 29, length: 0, content: '', WYG: 年灾異之驗或身遽以死或國隨以䠞迄不少救然而天文月令䜟緯術數百家雜起不曰龜龍河洛洞幽靈之府必曰鈐决㝠奥覈祻福之源蠭談而涌辨唘穴而鑿牖秪足以長姦偽而甚不足以祛邪惑者大率欺世世主以是論政儒生以是論學何其泥也子不語恠力亂神又曰性與天道不可得而聞也庸詎有若是云云者乎當東方朔陳是説時上始為微}
  - {type: page-break, offset: 29, content: '', id: KR4d0501_WYG_012-8b, image: WYG1209/WYG1209-0199b.png}
  - {type: punctuation, offset: 30, content: ), id: KR4d0501_krp_013-bkkpn7}
  - {type: variant, offset: 30, length: 4, content: 縣薄薄當, WYG: 行暴肆侈越制亡度舉盩厔鄠杜陸海之饒廣上林苑東征西伐軍旅數起黎民失業父子相食斯其為人禍也酷矣天人一理也吾知修吾事以畏天可也日蝕地震冬雷夏霜蒙氣還風早乾水溢天之為也人何與焉天豈若世之小丈夫然哉沾然喜頩然怒人人而欲應之以吉凶妖孽之决也一日之頃雖千技百變而為之亦不足矣要之天為天人為人母相瀆也至其所以兼統而一貫之者昭昭冥冥理無變氣有變也然上初即位天表已多變闗東大饑風赤如血齊楚二十九山同日崩考之人事則猶未有可感者變何自作哉將人子未嘗有過父母乃先作色以待其有過固不可也使朝廷多欲之心一窒文景富庶之政未改是且委之天運之適然者歟抑亦君徳之勝為足以銷天變之迭至者歟不然未可知也而今乃欲以膚學謏聞者盡之則非矣揚子雲曰通天地人曰儒通天地而不通人曰伎嗚呼伎而止者此非黄帝書也甘石諸人所為託之者也雖然觀是者又可無畏乎哉王氏範圍要訣後序天文星厯五行之説尚矣黄帝風后漢河上公有三命一家藝文志不著録也梁陶𢎞景始述三命抄略唐僧一行桑道茂劉孝恭咸精其術韓退之言李虛中善用人年月日時知人命貴賤壽夭者是已貞元初李弼乾又推十一星行厯後傳終南山人鮑該曹士蒍世肄之星厯所謂十一星者日月五星四餘是也然而天體至圓二十}
