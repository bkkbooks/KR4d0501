  - {type: indent, offset: 0, content: 　, id: KR4d0501_krp_013-bkkind1}
  - {type: variant, offset: 0, length: 3, content: 淵穎吳, WYG: 桑海遺録序頃予嘗從鄉}
  - {type: variant, offset: 5, length: 0, content: '', WYG: 學見福唐劉汝鈞貽書栝蒼呉思齊子善論文丞相宋瑞事云自江西初起時﨑嶇山谷購募義徒畊甿洞丁造轅門請甲㐲不啻數萬而尹玉實為驍將大衣冠指麾衆皆詣闕感泣求效死已而當國二揆交沮用兵帥無宣諭卒無犒賞盤桓月餘僅令守姑蘇一路張彦提重兵居毗陵且有叛志尹玉竟以絶太湖弔橋首尾不救而溺死未㡬獨松告急朝廷四詔政府六書趣弃聊攝援根本一日一夜倉惶就道及至行都而獨松隨以破陷復令駐兵餘杭守獨松朝議不一衆心離散㑹有尹京之命餘慶遽奪其印不予漢輔遁徳剛遁北軍入城與權又絶江遁乃即日拜樞使又拜右揆補與權處且令往軍前講解毅然請行及被拘以北中道奔迸收}
  - {type: page-break, offset: 5, content: '', id: KR4d0501_WYG_012-1b, image: WYG1209/WYG1209-0195b.png}
  - {type: page-break, offset: 5, content: '', id: KR4d0501_WYG_012-2a, image: WYG1209/WYG1209-0196a.png}
  - {type: variant, offset: 6, length: 1, content: 札, WYG: 亡散無兵無粮天下大勢去矣帝霸交馳正偽更作是不一姓當世之為大臣元老者視易姓如閲傳郵况當滄海横流之際而彼乃以異姓未深得朝廷事權欲隻手障之至死不屈微箕二子且有愧色於宗國矣其書大略如此予後又獲見淮隂龔開所作文宋瑞陸秀夫二傳盖益詳焉方五代之季藩鎮䟦扈武臣驕矜君臣父子之義不明而土地甲兵之强類無不欲黄屋左纛自為者先宋知其然一旦踐大位即罷諸節度兵符遽用儒臣以為治終不足以盡復乎石晉所割之境土迨乎宣和衰亂北兵南下急若建瓴曽不得乗一障設一堠而遂至奔亡不守後宋再造東南區區山海之間内政不修外猶恃夫江淮以為固久之南北夾攻而汴蔡之藩籬自撤其蔽荆襄受圍鄂渚有警巴蜀侵陷廣西之烽燧亦不絶此其國勢垂盡受兵處多殆如囊中探丸圍中逐鹿無復有潜藏隠伏地矣所可幸者天下學士大夫二三百年祖宗培飬作成之澤薰蒸者久忠臣義子或死節或死事盖無媿焉卒之宋瑞秀夫前後死國精忠激烈誠有在於天地而不在於古今者嗚呼呉晉陳隋之變豈復有一人若是哉龔開者字聖予少嘗與秀夫同居廣陵幕府及世已改多往來故京家益貧故人賔客候問日至立則沮洳坐無几席一子名浚每俯伏榻上就其背按紙作唐馬圖風騣霧鬛豪骭蘭筋備盡諸態一持出人輙以數十金易得之藉是故不飢然竟無所求於人而死志節既峻儀觀甚偉文章議論愈高古至為此二傳大率類司馬遷班固所為陳壽以下不及也此其人殆亦無負於秀夫者哉予故私列二傳以發其端詢之故老徵之雜}
