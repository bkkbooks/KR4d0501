  - {type: variant, offset: 315, length: 0, content: '', WYG: 則有常月五星臣象也行則無常盖日之常行也則有中道厯冡所謂黄道是已月五星既無常行乍南乍北或贏或縮且或不出於周天二十八宿黄道之度而襍犯乎河漢内外諸星此又豈可以區區算數少測之哉它則紫氣以祥彗孛以妖羅㬋計都以蝕神首尾古未嘗與七政並列春秋之書星孛或入北斗或在大辰本是妖星為異老子之出函谷紫氣臨闗亦是氣祲雜占王朴五代欽天厯又謂蝕神首尾僅行於民間小厯而已今其説一本之都利聿斯經都利盖都頼也西域康居城}
  - {type: page-break, offset: 315, content: '', id: KR4d0501_WYG_012-11b, image: WYG1209/WYG1209-0200d.png}
  - {type: variant, offset: 316, length: 2, content: 令令, WYG: 都頼水上則今所謂聿斯經者婆羅門術也李弼乾實婆羅門伎士而曹士蒍又作民間小厯者此其為術固異於甘石之舊矣以天地隂陽之合散而庶人庶物莫之能遺氣賦之形理賦之性性之體本粹然至善者也氣之運譬之草木春而榮秋而槁倏而凝聚忽而澌盡亦其宜者苟不推之以一理之同而徒役之以多術之異不亦末乎嚴陵王生乃以範圍要訣一卷示予其法皆原於易又有過於三命十一星之外者列之以千百十零附之以氣名體性尤與潜虚擬𤣥者合也此其最近於理者歟将其人之創為是法者亦且有得於河洛圖書之奥者歟故予又特采别説以序之司馬子㣲天隠子注後序司馬子㣲天隠子注一卷八萹天隠子亡其姓族邑里或曰子微託之者也夫黄老之説始自黄帝老子太史公老子列傳則稱其以自隠無名為務至其道乃曰無為自化清净自正無它異也}
