  - {type: variant, offset: 1312, length: 3, content: 八葉前, WYG: 年之間凡經傳之可見者}
  - {type: punctuation, offset: 1315, content: /, id: KR4d0501_krp_013-bkkpn506}
  - {type: variant, offset: 1316, length: 0, content: '', WYG: 百一十七國晉地理志且引夏商時國二斟豕韋過戈之屬非周舊也齊桓晉文之盛朝聘盟㑹侵伐敗亡者無慮數十而附庸小邑蠻夷雜種又豈悉有書可徴乎史稱魯君資孔子之周因老耼觀書周室且歴聘七十國又云與魯君子左丘明觀史記自隠公訖于獲麟要之春秋固魯史也因麟出而虚其應故取而修之非本書獲麟者觀書周室事亦鮮所見周史孔子世家孔子嘗徃来齊宋衛陳蔡之郊晉故霸國也聞趙簡子殺竇犫鳴犢至河而弗渡楚亦欲以書社七百里地封之子西靳不可又輙反於魯將所聘者又未必有七十國也然亦何暇悉徴其書乎墨子戰國人妄稱有百二十國春秋耳非聖人之遺言也何則杞宋王者後其稱公皆大國也宋頗存王禮而杞乃以辟陋而用夷孔子曰文獻不足故也足則吾能徴之矣唯古之官名得之郯子它無見也雖然聖人作春秋但因魯事以寓王事隠桓之初王政不}
  - {type: page-break, offset: 1316, content: '', id: KR4d0501_WYG_012-26b, image: WYG1209/WYG1209-0208b.png}
  - {type: page-break, offset: 1316, content: '', id: KR4d0501_WYG_012-27a, image: WYG1209/WYG1209-0208c.png}
  - {type: punctuation, offset: 1317, content: ), id: KR4d0501_krp_013-bkkpn507}
  - {type: variant, offset: 1317, length: 1, content: 鉛, WYG: 而魯與齊鄭宋衛交齊桓肇伯而魯事齊晉文繼伯而魯又事晉襄昭以降伯統將絶而魯又事呉楚故經之所載類不出此數國事然則春秋固魯史也魯史所不載聖人誠不得而筆削之又何待悉徴百二十國之書乎嗚呼閔因之説是亦無徴而弗信者矣春秋通㫖後題自宋季徳安之潰有趙先生者北至燕燕趙之間學徒從者殆百人嘗手出一二經傳及春秋胡氏傳故今胡氏之説特盛行胡氏正傳三十卷傳外又有總貫條例證據史傳之文二百餘章子寜集之名曰春秋通㫖輔傳而行}
  - {type: page-break, offset: 1317, content: '', id: KR4d0501_WYG_012-27b, image: WYG1209/WYG1209-0208d.png}
  - {type: punctuation, offset: 1318, content: (, id: KR4d0501_krp_013-bkkpn508}
  - {type: 'kr:non-cjk', offset: 1319, content: ○, id: KR4d0501_krp_013-bkkkrnonc99}
  - {type: variant, offset: 1319, length: 10, content: 九葉前作汞八行太河太, WYG: 胡氏傳春秋時光堯南渡父讎未報國歩日䠞將相大臣去戰主和寖忘東京官闕西京陵寢而不有者是故特假春秋之説進之經筵且見内晉外楚若是之嚴主辱臣死若是之酷冀一悟主聽則長淮不至於自畫江左不可以偏安此固非後世學春秋之通論也然而胡氏傳文大槩本諸程氏程氏門人李參所集程説頗相出入胡氏盖多取之欲觀正傳又必先求之通㫖故曰史文如畫筆經文如化工若一以例觀則化工與畫筆何異惟其隨事而變化則史外傳心之要典聖人時中之大權也世之讀春秋者自能知之固不可以昔者歆向之學而異論矣趙先生者諱復字仁甫國初南伐攻徳安潰之仁甫遭獲遇姚文獻公軍中文獻與言信竒士仁甫方以國破家殘不欲北且蘄死㑹夜月出即逃乃亟被鞍躍馬號積尸間見其解髮脱屨仰天呼泣盖欲求至水裔而未溺也文獻曉以徒死無益乃還然後盡出程朱性理等書及諸經傳故今文獻與許文正公遂為}
