  - {type: punctuation, offset: 11, content: (, id: KR4d0501_krp_013-bkkpn1}
  - {type: variant, offset: 11, length: 0, content: '', WYG: 中造化心上經綸盡在是矣泰階六符經後序泰階六符經者本黄帝有熊氏世不傳當漢建元之間東方朔始陳其説欲以觀天表之變定上心之侈者應劭仲逺又疏其文頗類甘石諸人所為託之者也盖古昔聖人之論隂陽}
  - {type: page-break, offset: 11, content: '', id: KR4d0501_WYG_012-8a, image: WYG1209/WYG1209-0199a.png}
  - {type: variant, offset: 12, length: 4, content: 葉後十三, WYG: ''}
