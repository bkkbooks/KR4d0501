  - {type: variant, offset: 10804, length: 508, content: 如龍之蜿我獵我人非畋之盤既顯諸用如鷹斯䎒發揚蹈厲亦揔其干惟古之道孰測其端勿謂伊人漁釣是奸我懐于今不古是觀已雖不能民之艱難有磻斯石惟溪之湍我勒我銘昭示不刋試劍石銘有序呉故呉墟也自閶門東出十里許有白虎之丘王闔閭試劍石在焉悼靈物之不可見銘斯作惟崚之鑠惟銛之斮山靈奉鐔白虎司鍔神威剿剛殺氣纏錯攻堅瑕破發邇逺畧汾洮乘軺郊郢弛柝風斯輕剽志用驕虐睋然兕駭歘爾龍躍我思古人吁不可作蚩尤讃元氣肇開鴻荒斯闢凡兹庶民詎有兵革人禽攫齟草木菑翳奚靈不鑿既躶罔衛蚩尤者出始搆禍端雍狐是資涿鹿相殘掀鑪挾鞴鎔精瀉液舍我耝耰行彼劍㦸惟聖制物與天同符君子慎術小人改圗豈伊樹兵爰使絶輿匪嶄頭角終殞肩髀覇王迭起仁義無稱揣摩捭闔㧞擊橫行夫何攻戰尚汝禱禡九嬰乘城窫窳在野善師不陳時靡有争曽不是戢曷維其寜天生五材莫偃匪武我賛蚩尤敢達祈父盗跖讃我觀古人我讃惟跖彼何人斯去順効􅊇盗本有道殺人以矜横行魯國按劍東陵榛奥是栖閒巇是鑿投骨起齗見金思攫世不予善居恒有循分均我義後出吾仁􅉃汝刀㦸機汝罟擭汝曰不然俾晝作夜我盗何盗取非我有不盗之盗人不汝咎聖人不作大盗日争所恃者力相擒以兵上行下效僥倖邪侈因之而攘愍不畏死人豈齊豹地非萑苻誰生禍首卒化盗區跖斯可讃為善者惕於乎哀㢤尚謹罔極, WYG: 闕}
