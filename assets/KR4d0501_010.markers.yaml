  - {type: variant, offset: 0, length: 1433, content: 淵穎吳先生集卷之十門人金華宋濂編讀唐太宗帝範初唐太宗帝範一卷十有二萹太宗甞手撰以教太子五代䘮亂書有錄而遂闕暨今上征雲南𤏡夷始出以獻而舊十有二萹復完予聞古今欲治之主不丗出甞必立為治天下之法使其後嗣子孫有以丗守之而不敢失墜不幸而一旦昬庸懦弱之君或繼其後亦得有所扶持馮藉不至於甚亂而僅存此雖三代聖人制基垂統立經陳紀而務欲㝎為法度典章者然亦不過數傳則巳自弃其先祖之訓䠞國敗家接踵而有夏之太康商之帝甲武乙周之幽厲宜若無異扵漢唐之季丗然猶幸賴其法度典章之炳然播扵宗廟布在有司賢聖之君復有赫然而振起者有此具也自是以来漢承秦亂而髙祖立漢家之法唐受陏亂而太宗設唐室之制嗚呼漢法逺矣蓋惟唐制傳之未乆而天下多事夷狄侵凌藩鎮䟦扈盜賊相挺而起莫之能救此其故何哉當陏氏大壊太宗始銳然盡舉天下扵盜手即議立國法粉飾朝章誠欲創其基業於前而特垂其綂緒於後使後嗣子孫得以繼續而行且将有恃於此而不害扵無所守者是故職官之任㝎以常貟師徒之備設以府衛用以授田則口分丗業之法均度以歛財役民則田租身庸户調之制不紊自古者聖賢之道不作而一切覇強苟簡之術用太宗乃能慨然庶㡬乎先王仁義之意而務成貞觀二十餘年治平之功自漢以来可謂古今欲治不丗出之主矣然而太宗毎知太子之仁孝慈懦恐不足以任國而僅述古昔聖賢之遺訓帝王之常法強而敎之謂爲帝範及至太子即位曾不㡬時内則惑於嬖后外則斥逐賢相則夫天下國家紛紜変故之迭至曽不可以思患而預防者卒至扵易妵改號殺僇宗姓而後巳然猶幸其有所扶持馮藉且不至於盡亂而僅存者頼有法也惜乎當時太宗立法之際身教則從言教則訟每求其所以致然者自其法度典章之中或不能自免其瑕釁間隙之可議書有之曰丕顯哉文王謨丕承哉武王烈佑啓我後人咸以正罔缺太宗之為治無乃文謨武烈一夲於正又能無缺者豈或猶有可憾者耶何則太宗親㝎㝢内盖因陏氏髙麗喪師之後而得之自其即位北㓕突厥薛延陀西制髙昌徙其種人編置㳂邉州郡而蕩然無有蕃漢内外之防及其晚年又且東征髙麗瀕死而弗巳是雖髙宗之慈懦猶襲其故深異乎漢孝元之議罷珠崖者降及數丗而眀皇繼之君臣宴安邉隙數動至竭天下之兵委之西北付以藩臣中國空虗大盜承之而遽起由是天下多故藩鎮槃錯奚契丹深入河北吐蕃囬鶻連䧟秦隴震驚都邑師徒撓敗土境日䠞而唐室之號令所及曽不出淮浙巴廣數十郡地而遂巳聀官之任師徒之備授田之法歛財役民之制大抵悉改於其舊此豈非當丗邉境用兵之或過遂致蔓延於中國而不少熄㦲然以唐之子孫昬庸懦弱或危或微不絶若綫是雖太宗之法守之有未盡替得以扶持馮藉不至於甚亂而僅存誠求其所以致是亦由太宗平日貪勝好名之過瑕釁間隙實有以先開其源而漸熾其禍是則太宗前者包括四海指麾群夷適足以為當今屈己和親敗軍郤境之効不可救巳夫然故唐之一代天下之致治莫如太宗天下之致亂亦或自於太宗而後丗議者不之覺也嗚呼予觀太宗之志嘗欲法三代欲行周禮遂絀封徳彛之說而専用魏徴之仁義貞觀之治夫豈近丗所可遽及使其當時立法之際而其身之所行者一本於正無復可議則雖三代聖人創基垂統立經陳紀之道何異於是然而太宗終以不能企及者是亦貪勝好名之一過也詎不信夫詰玉霛辞予少甞有四方志旣長而益病且惜其志之或不我遂也於是假爾泰龜用以卜其出䖏行藏之决者而玉霛無所徵雖然古之龜書則久而不傳於丗矣作詰玉霛辞予昔日之有事兮曽端䇿乎元龜䖍掲我以吉繇兮曰逺行之不疑志囙循而弗立兮年偃蹇以失時祗自奮而復蹶兮豈玉霛之獨吾欺惟玉霛之神聖兮諒天道之秉為練時日之臧否兮佩國家之安危何嘉林之飬夀兮撫芳苓以敖嬉遽清江之授莭兮竟豫且之見覊将霛繹其果獵兮爰眡髙乎卜師矧梁米及夫稊黄兮幸鑚焌而無遺真古今之至寳兮, WYG: ''}
