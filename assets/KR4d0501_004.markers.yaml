  - {type: variant, offset: 16093, length: 0, content: '', WYG: 方何所觀仰哉唐太宗擒頡利而靺鞨來朝太宗曰靺鞨逺來突厥既服也今倭奴不及扵突厥逺甚若其内屬如靺鞨者又多臣恐其有效尤扵後也以臣度之倭奴之國去髙麗眈羅不逺今戍髙麗眈羅者當不下數百萬戍慶元海道者當亦不下數百萬比嵗水教以作士卒之氣大艦數百薄海上下然迄未能以兵服之者地絶大海險故之以間往征之三軍之士感激嗚咽誓不再見父母妻子颶風連晝夜大魚䟦扈驚觸篙柂勁弩不暇發囓舌相視不幸而有覆艦之虞衣衿結聮溺死枕藉幸而一存㧞刀斫舷手指可掬雖親戚不相救援生死尚未能保何暇較勝負哉昔者隋人統五十二萬人伐髙麗髙麗終拒守不下所恃者鴨緑一小江耳今倭奴之強固不如髙麗而大海之險甚扵鴨緑水者奚啻幾十倍其人率多輕悍其兵又多銛利性習扵水若鳬鴈然又能以攻擊為事而吾海道之兵擐甲而重戍無日不東面望洋而嘆使其恃強不服雖盡得而𠞰之摧朽拉腐也而彼乃肆然未甞一懼非恃險也何敢若是吳甞浮海伐夷洲矣獲其人三千而兵不助强隋甞浮海伐留仇矣㧞其城數十而國不加益何也人非同我嗜欲弗能生也地非接我疆土弗能有也為今之計果出兵以擊小小之倭奴猶無益也古之聖王務脩其徳不敢勤兵扵逺當其不服則有告命之詞而已今又往往遣使臣奉朝㫖飛舶浮海以與外夷互市是有利扵逺物也逺人何能格哉魏文帝謂辛毘曰昨張掖獻徑寸大珠今欲求之曷若辛毘對曰聖王惟徳之務四夷畢獻方物求而得之不足貴也今不若罷我互市從彼貿易中國免徼利之名外夷知效順之實計莫便扵此彼倭奴者心嗜利甚我苟不以利徼之雖不煩兵猶服也何以知其然也漢建安中鮮卑軻比能稍冦遼東三郡其後來朝則詰之曰我雖外裔亦人也禽獸猶知擇美水草以居况我人乎哉前者守臣數徼我以利使吾不得畜牧吾故叛去今反其法吾故來又况倭奴之人稍知文字豈反不及軻比能耶而獨不知效順者此臣所以日夜扼腕切齒為朝廷惜也臣年長矣每思傅介子班超之所為慨然嘆息使二子不自奮扵絶域未免為田里之匹夫功或不成扵漢朝至老死亦無聞扵後世臣自揆不能如二子之智而欲有二子之功罪不容扵死幸而朝廷假臣一命奉其告辭得往喻之亦一竒也議者必曰鄉曽數遣使猶不得要領近自對馬絶景等島渡大海徑趨太宰府髙麗眈羅沮撓百出留使臣不使遽見中夜守䕶排垣破户喧呶叫號兵燧交舉後雖僅得其使介來廷終至渝平而不服意者一泛使之遣未足以服之乎自臣觀之今則髙麗眈羅已服所未服者倭奴而已然亦不勝其懼矣故今遣使不可與鄉遣使並論也臣必謂其王曰海東之地曽不能當中國一大州其兵衆之多寡可料而知也以今中國之盛不即加誅扵海東者天子之徳不忍煩兵扵逺非有愛扵海東也鄉者王之衆航海而來驚我海道之兵且戰且卻王之輜重䘮失者太半而我曽不損一毫三軍之士忿然含怒甚唯寐忘之當慶元海道者莫不被堅甲蹠勁弩帶利劍飛艦蔽海而東超足距躍輕風濤萬里之險决死生以問罪扵王兼之髙麗眈羅之衆其識海道習水性與王國同是王數面受敵也然迄今未即加兵者意王猶有人心欲以禮義服之又不忍煩兵以苦王以故遣使臣來今朝廷攻王之土地非如伐夜郎畧朝鮮可以置城守也雖得之越海弗能有也寳珠金帛積如丘山不恃外夷之貢獻也殊方異物來獻于廷又不假王之重貨也罷我之互市從王之貿易是吾土地之所産王反得而用之也然王之名物不譯於舌人也久􅁁隙一開市易且有禁非王之利也旦夕大兵且來王必悔之王若聽使臣是得效順之美名而免受敵之實患也此臣喻之之說也形釋客有問曰生故倦㳺也頗有聞於今之世乎泰階既平滄海不波仁漸八荒徳被邇遐東陬𣺌蟠木西紀泝流沙麒麟鳯凰襂褷翕赩徴瑞乎山谷神芝朱草勾萌甲拆納祥于水涯上又招賢良選㢘茂訪遺逸舉孝弟開承明廣内之廷設金馬石渠之署髙者登公卿大夫次猶補文學掌故逺方鄙人瞻望歌詠以需進用之日者久矣又豈有卑汚連蹇局縮齷齪不少遇乎生嘗竊志於是少始知學長又益加義理析秋毫辭章掞春華亦既絶江河畧青徐東掎齊魯之郊北睨燕趙之都英豪間出俊造交驅指南文苑擩嚌道腴盖將追蹤乎三五而方駕乎羲蘧然且名不躋仕版身不離樵蘇口不攻辯智足不利走趨誠不能與世之豐􅄛博碩輕便侈汰者比數乃若此之拘也是何昔者𤣥造肖形之過乎予則應曰唯唯否否若客所謂知其一未知其二者也乾清坤濁交錯紛絪吹隂煦陽坱圠無垠洪纎髙庳肥瘠異倫抽機掣鍵斡化陶鈞則且或入於堯禹之聖與夫桀跖之不仁轇轕氣運雜遝形質鳬短鶴長烏黔鵠白卒不可變已尚能復逃其真乎然則大有所不及小有所不取材有所不任力有所不負䀶􅍃傎倒鹵莽明足以察錐末或者泰山之不睹魁壘卓犖精悍壯武勇足以敵千鈞或者蟬翼之不舉王良扶輿造父執轡必將驂蜚黄馭騕褭犇騰追逐過都歴國然後知滇僮僰騎曽不得以供騶䇿易牙調羮屠蒯侍酒必將截肥胾湛清醥淋淫酺醊式歌且舞然後知瓦缶䙝味曽不得以厠鼎爼鄼侯定律稷嗣制禮必將考圖籍列茅蕝竒瑋特逹危談抗論然後知窮鄉曲學曽不得以施廊廟子猶以是病也盍獨不觀夫世之務進而不已者乎峨髙弁曳長珮從容而逰豫尭行而舜步摉古文摘竒字穿鑿以附儷周情而孔}
