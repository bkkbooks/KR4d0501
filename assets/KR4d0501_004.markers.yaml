  - {type: variant, offset: 16092, length: 0, content: '', WYG: 丗提封萬里東西止日所出入南北皆底於海􅁁徼無烽燧之警士卒無矢鏃之費外夷重譯鄉風效順梯山航海莫不來獻方物漢唐之盛所未有也然以倭奴海東蕞爾之區獨違朝化三十餘年奉使無禮恃險弄兵當翦其鯨鯢以為誅首可也而迄今未即誅意者其有說乎臣竊即前事觀之海東之地為國無慮百數北起拘耶韓南至耶馬䑓而止旁又有夷洲紵嶼人莫非倭種度皆與㑹稽臨海相望大者户數萬小者僅一二百里無城郭以自固無米粟以為資徒居山林捕海錯以為活漢魏之際已通中國其人弱而易制慕容廆曽掠其男女數千捕魚以給軍食其後種類繁殖稍知用兵唐攻百濟百濟借其兵敗扵白江口乃逡巡斂甲而退今之倭奴非昔之倭奴也昔雖至弱猶敢拒中國之兵况今之恃險且十此者乎鄉自慶元航海而來艨艟數十戈矛劍㦸莫不畢具銛鋒淬鍔天下無利鐵出其重貨公然貿易即不滿所欲燔焫城郭抄掠居民海道之兵猝無以應追至大洋且戰且卻戕風鼓濤洶湧前後失扵指顧相去不啻數十百里遂無奈何䘮士氣虧國體莫大扵此然取其地不能以益國掠其人不可以强兵徒以中國之大而使見侮扵小夷則}
