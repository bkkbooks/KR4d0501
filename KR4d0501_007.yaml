front:
  text: 淵穎吳先生集卷之七門人金華宋濂編
  hash: sha256:4b147391cc1d6d9d7b41dd519b40c27c473d122b59b6ceaadc6497f3272100e3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_007-1a}
body:
  text: 與黃明逺苐三書論樂府雜説昨出古詩􅊲録自漢魏以下迄于陳隋上下千有餘年正聲微茫雅韻廢絶未有慨然致力于古學者但所言樂家所採者為樂府不為樂家所採者為古詩遂合樂府古詩為一通以定作詩之法不無疑焉竊意古者樂府之説樂家未必􅌹取其辭特以其聲為主聲之徐者為本疾者為解解者何樂之將徹聲必疾猶今所謂闋也漢書云樂家有制氏以雅樂世世在大樂官苐能識其鐘鼓鏗鏘而巳不能言其義此則豈無其辭乎辭者特聲之寓耳故雖不究其義獨存其聲也漢𥘉因秦雅人以制樂韶為文始武為五行房中有夀人夀人後易名安世其辭十有九章乃出于唐山夫人之手文始五行有聲無辭後世又皆變名易服以示不相沿襲其聲實不全殊也及武帝定郊祀立樂府舉司馬相如等數十人作為詩賦又採秦椘燕代之謳使李延年稍協律吕以合八音之調如以辭而巳矣何待協哉必其聲與樂家抵牾者多然孝惠二年夏侯寬巳為樂府令則樂府之立又未必始于武帝也豈武帝之世特為新聲不用舊樂耶自漢世古辭號為樂府沈約樂志王僧虔技録則具載其辭後世巳不能悉得其聲矣漢魏以降大樂官一皆賤隸為之魏三祖所作及夫歌章古調率在江左雖若淫哇綺靡猶或從容間雅有士君子之風陏文聽之以為華夏正聲當時所有者六十四曲及鞞鐸巾拂等四舞皆存唐長安中工技漸缺其能合于管絃去吳音浸逺議者謂冝取之吳人使之傳習開元以後北方歌工僅能歌其一曲耳時俗所知多西􅋽龜兹樂倘其辭之淪缺未必止存一曲豈其聲之散漫巳久不可復知耶奈何後世擬古之作曽不能倚其聲以造辭而徒欲以其辭勝齊梁之際一切見之新辭無復古意至于唐世又以古體為今體宫中樂河滿子特五言而四句耳豈果論其聲耶他若朱鷺雉子斑等曲古者以為標題下則皆述别事今返形容二禽之美以為辭果論其聲則巳不及乎漢世兒童巷陌之相和者矣尚何以樂府為哉傳有之興于詩立于禮成于樂蓋詩之與樂固為二事詩以其辭言者也樂府以其聲言者也今則欲毀樂府而盡為古詩以謂既不能歌徒與古詩均耳殆不可令樂府從此而遂廢也又聞學琴者言琴操多出乎椘漢或有聲無辭其意輒髙逺可喜而有辭者反不逮是則樂家未必􅌹取其辭而特以其聲為主者又明矣嘻今之言樂府者得無類越人之歌而椘人之説乎昔者鄂君子晳之泛舟新波之中也榜枻越人歌之曰濫兮抃草濫豫昌柢澤豫昌州州􅳗州焉乎秦胥胥縵豫乎昭澶秦喻慘惿隨河湖鄂君子晳曰吾不知越歌子試為我椘説之乃召越譯而椘説之曰今夕何夕兮搴中洲流今日何日兮得與王子同舟蒙羞𬒳好兮不訾詬耻心幾頑而不絶兮知得王子山有木兮木有枝心説君兮君不知其聲則越其辭則椘椘越之相去也不逺猶不能辨又况自今距古千有餘年而欲究其孰非孰是不亦難乎昔唐史臣吳兢有樂府解題近世莆田鄭樵又為樂府正聲遺聲然性愛竒卒無所去取兢則列敘古樂而復引吳均輩新曲均豈可與漢魏比倫哉若樵又以天時人事鳥獸草木各附其類無時世先後而欲以當聖人所刪之逸詩是亦無異乎文中子之續詩也今欲一定作詩之法且以􅊲古自名古樂府之名不可以不存存之則其辭是也擬之則其聲非也不然吾碩以李杜為法太白有樂府又必摹擬古人巳成之辭要之或其聲之有似者少陵則不聞有樂府矣幸悉以教我母多讓焉三墳辨三墳書近出偽書也世或傳大抵言伏羲本山墳而作連山神農本氣墳而作歸藏黃帝本形墳而作坤乾無卦爻有卦象文鄙而義陋與周官太卜所掌三易異焉三易者一曰連山二曰歸藏三曰周易周易古矣天地定位山澤通氣雷風相薄水火不相射此先天之易伏羲之所畫者也文王修之伏羲豈以連山為易又首艮乎夫連山蓋列山也列山本神農之舊國首艮又有重山之象連山非屬之神農而誰乎歸藏本黃帝之别號𥘉坤𥘉乾𥘉離𥘉坎𥘉兊𥘉艮𥘉震𥘉巽乃歸藏之初經歸藏非他易也坤乾是巳又何析而為一乎唐藝文志連山十卷唐始出今亡歸藏三卷晉薛貞注今或雜見他書頗類焦贛易林非古易也世之説曰易占以變故其數但用九六而尚老連山歸藏占以不變故其數但用七或用八而尚少乾一兊二離三震四巺五坎六艮七坤八是先天之易也連山七而首艮歸藏八而𥘉坤亦不過踵吾伏羲之舊及推其所用之䇿連山三十有六歸藏四十有五易則四十有九又若不相為用者而今三墳書獨不聞焉方孔子未刪書之先周官外史掌三皇五帝之書椘左史倚相又能讀三墳五典矣太史公所謂搢紳先生難言之者也孔安國尚書序始以伏羲神農黃帝之書謂之三墳墳者大也言大道也苟言大道孔子不刪孔子刪之此其文誠不雅馴矣東漢以來説者所指三皇之號又不一劉恕乃謂古無三皇五帝而周官特出于漢儒之手耳此其書果何賴乎嗚呼三墳自三墳三易自三易亦無緣合而為一也外有紀姓者敘上古帝王之世襄陽羅泌頗加采用以著路史泌乃據丹壺名山記吕梁碑及輶軒使者方言却疑三墳書膚淺不可徴亦但差錯其世次改易其名號而已紀者何非括提合雒連通敘命之類乎姓者何非三姓六姓四姓二十一姓之類乎大率與路史合也泌又雜引春秋河洛圖緯及山海經等書亦巳博矣然亦何異三墳之膚淺乎莆田鄭樵且謂東漢諸儒尚喜讖三墳書雖近出庸不猶愈于讖乎乃引柴霖之傳而上置諸古易經之列以為非後世所可及終亦不能掩其偽也嗚呼孔子殁天下言人人殊荀卿子激焉至言性出于聖人之偽卒併詩書六藝之正者一卑秦火而雜燒之又豈不以其偽之勝乎古人嘗有言曰食肉不食馬肝未為不知味是則稽古而不究鴻荒摽鹿之世亦未為不知學也哉伯夷辨豫讀吕氏春秋伯夷自北海而歸周至歧陽文王巳卒武王即位使召公奭盟微子使周公旦盟膠鬲由是伯夷去之以自潔隱焉而餓死豈其然乎當紂之世天下紛亂伯夷之欲為聖人氓者久矣聞善養老而往就飬歧梁之間固不在文王將卒之秋也且武王𥘉政又豈果有勝殷殺紂之心哉膠鬲紂賢臣也嘗與之約戰矣雖天甚雨猶不欲失期往救其死况先使周公要之以加冨就官之盟乎將巳有篡弒一定之謀必陷賢臣于死地乎不然膠鬲非賢者乎又微子遭時之變猶念念不忘宗國雖不得已而去未肯自通於周以為已他日利世為長侯守殷祭祀召公亦何以有是盟乎武王克殷復立武庚不幸三監之流言共為王室之不靖成王周公然後起而殺之也不然則請後七廟世守天子之禮樂豈有待于東夏之别封乎夫如是微子膠鬲二盟皆非也二盟既非則伯夷嘗至周而就養矣孟子曰天下之大老歸之文王蓋未卒也藉令武王繼之紂而改行將先天下率諸侯修朝事未嘗欲推亂而易暴也殺牲埋書而煩褻鬼神行貨要利而離間天子左右伯夷當聞其風不入其境豈暇到歧陽而後去哉去之以自潔隱焉而餓死扣馬諫伐之後也然則雖受文王之養亦且必受武王之養矣太史公迷于文王受命改元作伯夷列傳有曰父死不葬爰及干戈此又以為不見文王而遽去胥失之矣樂正子徴鼎辨齊伐魯魯平齊索岑鼎魯以其贋往齊人曰贋也盍使樂正子徴之使樂正子樂正子曰必以岑鼎往魯君曰吾愛吾鼎樂正子曰臣亦愛臣之信豫謂樂正子未知信者也夫信者本一夫之私行而欲以應天下之變天下之變萬不同且使其拘一曲執小諒者以應之鮮不自賊者矣蓋此有所謂權焉權者何義是也行苟合義雖言不徴不害為信義一不合徒務徑情以直行是則尾生之抱柱也今夫齊魯相攻擊危急旦暮耳一鼎豈敵一國家哉然而宗廟之重器不敢輕以與人也彼方以不義徼吾信吾則以贋奪真亦兩相當者何必若是憗憗然哉設或求鼎不已又求割地與求斬大將首與求太子為質而後退師於是使樂正子徴之且一一徇之乎抑違之也夫不能裁度事理以適于義而欲徒以執一行之是則用吾拘滯膠固之見而徴夫無所稽􅊲之器且不可又况欲以聖人體道之大權而維持天下之變故失之跬步則憂在千里之外矣故曰大人者言不必信行不必果惟義所在此孟子之言也彼樂正子非孟子之徒歟其相魯也孟子喜而不寐人問之則曰善人也信人也嗚呼是亦信之小者耳今也不信一國之信而惟信樂正子之信則樂正子見重于齊魯也久夫既自信其信而君又愛鼎不若以實告齊曰鼎固贋也然是鼎吾先君之分器將以是奉犧牲供祭祀而周公太公實與享之不然則二公之盟不云乎後丗子孫母相害也吾先大夫展禽嘗以是言却君師矣夫吾國不能下人以禮而至用其世守之器君亦不能以禮服人而欲奪人之所有皆君之所惡者也為此計者內不失鼎而我之信義加於鄰國彼必恱服而去之信之大者也夫又何取乎一夫之私行為哉然樂正子儒者其為人也好善且善改過惟他書載徴鼎一事不類故深辨之否則戰國傾危險詐之士踵相接也孰謂樂正子者非賢哉甬東山水古迹記昌國古會稽海東洲也東控三韓日本北抵登萊海泗南到今慶元城三百五里泰定元年夏六月自慶元桃葉渡覔舟而東海際山童無草木或小僅如筯輒刈以煮鹽東逼海有招寶山或云他處見山有異氣疑下有寶或云東夷以海貨來互市必泊此山山故有炮臺曽就臺跖弩射夷人矢洞船猶入地尺又别作大筒曵鐡鎖江水夷舟猝不得入前至浹口怪石嵌險離立南曰金雞北曰虎蹲又前則為蛟門峽束浪激或大如五石斗甕躍入空中却墮下碎為氛雨或逺如雪山氷岸挾風力作聲勢崩擁舟蕩蕩與上下一僧云此特其小小者耳秋風一作海水又壯排空觸岸杳不辨舟楫所在獨帆檣上指潮東上風西來水相鬪舟不能尺咫一撞嶕石且靡解不可支持又前則為三山大洋山多磁石舟板釘鐵或近山則膠制不動昌國境也昌國中多大山四面皆海人家頗居篁竹蘆葦間或散在沙墺非舟不相往來田種少類入海中捕魚蝤蛑蛇母彈塗傑步腥涎褻味逆人鼻口嵗或仰榖他郡東從舟山過赤嶼轉入外洋望岸峉山山出白艾地多蛇東到梅岑山梅子真煉藥處山梵書所謂補怛洛迦山也唐言小白花山自山東行西折為觀音洞洞瞰海外巉中裂大石壁紫黑旁罅而兩岐亂石如斷圭積伏蟠結怒潮摐擊晝夜作魚龍嘯吼聲又西則為善財洞峭石囓足泉流滲滴懸纓不斷前入海數百步有嶕土人云曽有老僧秉燭行洞穴且半里山石合一竅有光大如盤盂側首睨之寬弘潔白非水非土逺不辨涯際凡自山北轉得盤陀石山粗怪益髙壘石如垤東望窅窅想像髙麗日本界如在雲霧蒼莽中日𥘉出大如米篩海盡赤跳踊出天末六合奣然鮮明及日光照海薄雲掩蔽空水弄影恍類鋪僧伽黎衣或現或滅南望桃花馬秦諸山嵌空刻露䇄立巨浸如世疊太湖靈壁不著寸土尺樹天然可愛東南望東霍山山多大樹徐市蓋駐舟此土人云自東霍轉而北行盡昌國北界有蓬萊山衆山四圍峙立旋繞小嶼屹如千尺樓臺而中處又有紫霞洞與山為鄰中畔通明方如大車之輿潮水一退人可入或云人不可到隱隱有神仙題墨漫不能辨又有沙山細沙所積海日照之有芒手攫則霏屑下漸成窪穴潮過又補終不少損旁有石龍蒼白角爪鱗鬛具蜿蜒跨空亘三十里舟徑其下西轉别為洋山中多大魚又北則為朐山岱山石蘭山魚鹽者所聚又自北而南則為徐偃王戰洋世言偃王既敗不之彭城而之越棄玉几硯會稽之水又南則為黃公墓黃公赤刀厭虎厭不行為虎所食者也夫昌國本禹貢島夷後乃屬越曰甬句東越王句踐欲使故吳王夫差居之然不至也海中三山安期羡門之屬或避秦亂至此方士特未始深入或云三山在水底或云山近則風引舟去蓋妄説也東晉人士每愛會稽山水故稱入會稽者為入東抱朴子亦云古仙者之藥登名山為上海中大島嶼如會稽之東翁洲者次之今昌國也是年秋八月自昌國回姑疏山海竒絶處明晉人之不妄時一展玩宗少文卧逰不是過矣周正如傳􅊲序豫每觀左氏春秋王周正月釋者曰言周以别夏殷也及尋公羊穀梁二傳又雜引諸經讖緯孔子𥘉無明説後之儒者頗用黃帝以來七曆求春秋時曆卒不盡合杜征南長曆反謂經必有誤經未嘗有誤也是豈夏正周正之果異哉蓋曰王者受命受之于天不受之于人故徙居處易服色殊徽號變犧牲異器械而改正朔其一也此固然也董仲舒曰道之大原出于天天不變道亦不變堯舜禹本一揆也何獨至于湯武而遽革之哉世之説者嘗謂當周之丗春秋必用周正春秋尊王之書也隱公元年之正月是即平王四十九年之正月也然而前徵乎啇則元祀為十二月而月不改後據乎秦則元年為冬十月而時不易春王正月似乎冬十有一月也而聖人易之以證其行夏之言程子所謂正月非春假天時以立義也自程子之意則曰夏正寅春也周正子非春也是改正者必改月也故曰假天時而巳自今説者之説則改正者又不改月不獨假天時也雖王月亦假矣當又自異于程子也至其所自為説且謂夏數得天百王所同商周革命特示不相沿􅊞巡守承享兵農田獵猶自夏焉果是則聖人又何必以是為顔淵告哉或者又謂古之改正者必改月啇周之正月非春也伊訓元祀太甲三祀下不紀時泰誓一月召誥二月上亦不係時將以時自天時月自王月故也然而秦漢之際每年之首必以冬書十月之上顔帥古漢書注且以為孝武時改太𥘉曆後乃追正前代正月為冬十月者抑難信矣至若孔安國之於書鄭康成之於詩禮且言古之改正改月者年首必係之以正正月必係之於春天開于子地闢於丑人生於寅三代蓋迭建之皆可以為正則皆可以為春矣豈不以子丑二月陽氣萌動雖謂之為春也亦可矣魏景𥘉時楊偉造新曆請復用啇正且以是年十二月為孟春次年三月為孟夏本鄭説也然則奉若天道敬授民時又不常有一月二月之參差哉今之説書者蔡氏父子亦謂如孔鄭之説則四時改易尤為無藝三代之改正者必不改月啇周之革命者特不過用其子丑之月以為歲首耳周官正嵗周正建子歲首也正月夏正建寅月數也春秋之正雖用周正而月數不改每年之首截前兩月以屬之上年之尾誠若是則隱公之元年魯史必書之曰冬十有一月而聖人自削之也蔡氏父子以之言書則或可從以之言春秋則猶未可從也或者又謂三代之世三正之通于民俗尚矣魯用周正吾于春秋魯史見之曲沃用夏正吾于汲冡竹書見之是故左氏雜採諸國之史以為傳或用夏正或用周正互有不同昭公之三十三年十月晉人會諸侯之大夫于狄泉定公之元年正月又曰會于狄泉是重出也魯太史辨火出之候亦曰于夏為三月于啇為四月于周為五月又一證也雖然王者之大政必叶時月而正曰是豈容以一代之間而三正之並用者哉世之説者或曰易有之帝出乎震自伏羲神農之世蓋異建矣次而數之堯建子舜建丑夏建寅而甘誓且載其急棄三正之文者本此也然自顓頊以來始以民事命官而歲月自當以人為紀先王為是推策迎日治曆明時民之析因夷隩鳥獸之孳革毨􅩝無一不得其居之冝與其氣之順者堯舜禹三聖輒因之而不敢變也意者秦漢之際鄒衍張蒼五德相生相勝之緒論歟或又曰天地人三統子丑寅三正古無有聖人所不道三代之改正特改人君即位之𥘉年為元而巳雖然此謂改元非改正也而改元者又非春秋之重事也將是數説吾亦孰信而孰從之哉番陽董生始出夏時考正二卷云此巴川陽恪先生作也恪之先君從涪陵㬊淵而淵又授業于朱子蓋嘗舉朱子之言曰三王之正不同周用天正豳風之詩又皆以人為紀是則改正者改歲首也未嘗改月數也上卷專論春秋下卷雜論他經及傳一切附著已説最為明了考正之作實朱子意也然而朱子四書集注詩集傳自用周正周月臨江張洽朱門髙第春秋集注且謂周正建子即以為春聖人雖欲行夏之時而春秋因史作經方尊周而一天下不可遽改之也朱子之意豈果􅊲正之意哉豫蓋歸而質之黃君景昌君則曰左氏魯人也使其不與孔子同時亦當近在孔子後左氏信矣若夫豳風之詩周公所作是固追𫐠公劉居豳之事當夏世用夏正者也未可以説春秋乃作周正如傳考二卷以辨考正之不然今兩書具在豫故并識異説者以復于董生為何如古職方録序鄉豫嘗治春秋左氏傳及太史公書稍觀黃帝以來王者都邑及春秋諸國交爭時分地山川城邑較之禹貢巳多乖盩不可徴自孔子作春秋魯君子左丘明為之傳丘明魯人也尤識周魯典故莊僖以前特言齊鄭襄昭之後特舉晉椘餘大國頗及宋衛陳蔡若燕秦又以絶逺無赴告甚略太史公采世本戰國䇿作三代本紀十二諸侯世家其云舜稷契臯陶伯夷柏翳之裔詳矣垂益夔龍則曰其後不知所封又曰滕薛騶小不足齒周武王時侯邑尚千餘江黃胡沈之屬不可勝計故弗采著然則周制害巳諸侯悉去其籍雖曰頒爵與祿孟子猶不能詳况他人乎方堯遭洪水使禹平治州分為九及舜攝位冀分為三青分為二至禹而後合堯之舊班固云黃帝方制萬里畫野分州得百里之國萬區然以禹貢九州計之五服相距方五千里僅得黃帝之半説者且疑九州之外黃帝亦嘗畫野分州舜之十有二州亦猶此也然周禮自王畿而次之别有九服服别五百里方而計者則為萬里漢地理志亦云漢之境土東西九千三百二里南北一萬三千三百六十八里其所紀山川大抵與禹貢不異何其里數若是之縣絶哉或曰尚書據虛空窵路方直而取之漢志乃因著地人迹屈曲而量之或曰禹之聲教所及地盡四海其疆理所治制止五服若夫荒服之外則又有區畫者存非若周漢且盡其地之所及者而疆理之也何以言之王制四海之內截長輔短方三千里是天子壤地之實也故周禮雖稱九服周官止曰六服群辟又曰六年五服一朝是則侯衛以降聖人雖制之服而不必其來若職方氏掌天下之圗辨其邦國都鄙必兼夷衛之𥘉封人民氏族王田分器至詳至悉未有一言及附庸者宋仲幾嘗言滕薛郳為宋役而薛宰竟不從焉况附庸者朝從於衛夕入于鄭西通于秦南屈于椘蓋有之矣當世曷嘗以此為疆界之􅏠離者哉然又有一説焉夫冀禹之所都冀之比境自雲中九原二千五百里且至于沙漠不毛之地周之東遷洛陽為土中曹去王城八百里猶在甸服鄭在河南密縣百七十里巳為男服蓋曹順流極便而鄭則成臯虎牢之險夫豈五服之制非若畫棋局然以定逺邇也是故幽州邇于碣石而共工流蒼梧逺于衡山而虞舜狩若謂周之斥大土疆又皆不出于蒼梧竭石之外不然夏后塗山之會執玊帛者萬國至周僅千八百國母乃夏后之盛猶愈于成周之盛乎將此萬國者特舉成數而言非實至萬也然鄊所言黃帝方制萬里而得百里之國萬區者夫苟一國而方百里矣至于萬區則不止方制萬里以謂方制萬里則萬區之國每國以開方之法計是亦不過每國四里而已何有百里哉且國猶邑也鄭取十邑河南即􅉑檜等小國椘敗四邑郊郢即隨絞等小國方里而井井四為邑故小曰邑大曰都萬區猶萬邑也舉不及百里之數者凡以一邑四里也齊魯之𥘉封也孟子亦稱儉于百里儉者不足也不足于百里也戰國時乃方百里者五必曰當在所損以復于先王之舊若明堂位言魯七百里出于成王之特賜是徒漢儒習見戰國之魯非成周之魯也漢儒所以言此者由周禮公地方五百里之説誤之也然周之西都僅四百里東得洛陽六百里乃合千里三公公爵也采地將不方五百里乎苟方五百里則天子亦無地以自容魯一侯爵耳藉令成王未賜亦當得四百里以一州千里計僅封侯國二而有餘三而不足將以何地而給千八百國之君乎是豈魯之侯爵百里而止非七百里也周禮又討論于漢儒之手故以其封國之誤者攙入之遂變而為斥大土疆廣為封建之説殊不知禹服猶周服也黃帝之萬國舜之十有二州亦猶周服也若謂盡其地之所及而疆畫之者恐不可以論周止可以論漢漢之盛時東置玄菟樂浪北度隂山西盡西域南窮交廣儋耳且有非古九州之域者故豫每謂封國當從王制百里之國不加多也州域當從禹貢五服之地不加廣也如是而巳耳昔者晉陳夀嘗撰古國志五十篇世逺書無可徴於是本禹貢采周職方用敘前古帝王公侯名氏都邑之不同者餘及四夷種類亦繁夥矣合之以秦漢以來郡縣且志其成敗興滅之端知者詳之否則或闕使後之博古君子覽觀焉後序自古者帝王公侯都邑名氏興滅之故紛乎夥矣豫少時嘗疏其一二曰古職方録且序之然猶有可疑者蓋孔子之序書也自唐虞始荀卿曰五帝以前無傳人其文野及孔安國書序又言古有三墳五典八索九丘徴椘左史倚相吾誰信哉信聖人而巳矣夏后氏承唐虞之盛塗山之會執玉帛者萬國殷湯革命存者三千武王克殷大封同姓餘蓋一千八百是果何以驗其然耶又曰湯資三千諸侯以絀夏武王資八百諸侯以伐殷何不思之甚也湯始征自葛十一征而無敵于天下及有事於桀雖亳衆尚憚于征役且諭之以弔伐之不得巳又况其他文王三分天下有其二猶率殷之叛國以事紂武王豈得因六州之衆以往脅于君哉及大會盟津陳牧野率用西人不曰西土有衆必曰我西土君子下及庸蜀八小國耳他無見也要之是説又因王制周禮之異妄言之耳王制公侯田方百里伯七十里子男五十里禮大司徒公侯之田則以一男當之推而極于五百里之廣及總天子寰內與八州所建之國無地可容鄭康成云自周公攝政致太平斥大九州增加諸國之地故禮與王制不合王制又殷制也春秋變周之文從啇之質合伯子男為一公侯伯三等而巳至周乃更立五等然禹貢所設男爵小邦已在侯服之內實有出于殷人之先者春秋亦未嘗不書五等之爵也孔穎逹云馬融依周禮包咸依王制各有所據難以質其是非雖然王制豈殷制哉坊記曰制國不過千乘左氏傳曰列國一同或攤算或紐算自實其所載九州千八百國之數比之王制地又加倍者説禮家𥿄上文耳近丗説者知禮與王制不可合言自夏啇以來分土無過三等班爵則必立五等至周而封疆少異而實不異公五百里其所食者二百五十里侯四百里其所食者百三十里有畸伯三百里其所食者一百里子二百里其所食者五十里男一百里其所食者二十五里自其所食者求合王制獨侯爵之百里子爵之五十里公則贏而男則不足者半又謂終周之世此爵往往設而不封公爵一宋是巳男爵二許宿是巳虞􅉑則三公之公也驪戎男則夷狄之長也雖然陳舜之後𣏌禹之後周之𥘉封當與宋並爵為公胡公東樓公猶班班然見于史陳之為侯𣏌之為伯後世之自降也任宿須句顓臾風姓濟水上小國微乎微者也與盟于宋來訃於魯亦得託于春秋餘豈無類宿者爵之以男乎天子三公之田視公侯雖虞􅉑以外諸侯入仕王朝既曰公矣未有不受公爵者驪戎固夷狄也推其地必在西周畿內豈自夏而變夷者耶且姬姓也曲禮曰其在東夷北狄西戎南蠻雖大曰子無稱男者然又曰職方之制邦國千里封公則四封男則伯特建國之率也豫于是始有悟焉王制九州千七百七十三國亦總數也意若曰州方千里建國若干九州之內則以之建若干國也不然天子之寰內公卿大夫與王之子弟咸食采其中所餘之地亦幾何哉春秋之𥘉王政廢壞侯度放紛非西周比也公侯列國猶可見者一百一十七國求其大者才十一二附庸小邑夷狄雜種悉充其數齊負東海椘據方城之南晉雄其北而秦又崛起于西獨未至流沙之極大􅔰自號曰霸朝聘盟會侵伐之所及者比之千八百國之數十八分之一也何大相遼絶如此耶然則九州所建未必實有千八百國或封或未封封則實有是國未封則虗是國以待可封之人如宣王之封申伯封則曰申國未封則猶曰謝邑或即以其虗國為諸國之加地如宋鄭之間有六邑不屬諸侯則自掌于天子之吏是故公爵自百里而加至五百里男爵自五十里而加至百里非盡然也特以是而為建國之率不得過也鄭康成不察於此乃謂周實有十八百國每國實有五百里至一百里之地非斥大九州之界則亦不能容是若干國也此其失也蓋惟子朱子嘗謂孟子班爵祿之言巳與周禮王制不合而王制又自與周禮不合近世説者乃曰馬融之本周禮者自其軍賦而言之也包咸之依王制者自其田賦而言之也制田制軍縱橫準算必使周禮王制之不合者而必合于一也然以孟子當赧王之際周禮巳不復存王制之作本出于漢之博士而周官又出于劉歆雖朱子亦固不能無疑矣闕之可也豫故特附其臆説于是録之後併以俟夫知者而就正焉關子明易傳後序豫始讀文中子中説頗載關朗子明事後得天水趙蕤所注關子易傳十有一篇大槩易上下繫之義疏耳首𫐠其出處本末次分卜百年數别為一篇似皆出之王氏或曰王氏中説本於阮逸關氏易傳肇于戴師愈師愈江東老儒也觀其傳統言消息盈虗爻象䇿數之類獨與張彛相問答彛嘗薦之魏孝文而王氏之贊易世傳關氏學也是又豈盡假託而後成書歟夫易之道大矣世之言易者往往不求其道之一卒使其學鑿焉而各不同是故談理致者多溺于空虛守象數者或流于讖緯此豈聖人之意哉蓋天地之初未始有物也聖人特因其自然之理故推而為七八九六之數非苟畫焉將以著其未畫之妙而巳後之儒者苟造其理而過為其畫之求太玄準易者也洞極則又擬玄者也玄之數起于三而洞極之數亦起于三生以配天育以配地資以配人猶易所謂三極之道也故凡三體九變三九二十有七始于萌而實訖于幾正且通焉今其書世見之者亦少中説所載殆未嘗及此然而王氏每尊其學之所自且欲自當逹者以為聖人復出王道復行而洙泗禮樂之教復明于斯世毋乃徒託于此而侈言之歟至於􅊲之以典禮稽之以龜策即人事以申天命懸曆數以示將來關氏之學蓋深於易者也雖然昔者子張嘗欲知來聖人怛言其既往者以告之是故三代常因其禮之大體而或損益其制非謂王者有是禮也必過其所卜之數夏以金王得數之生啇以水王周以木王得數之成聖人不敢知也為其説者尊周漢廢介􅈶且以明真主正統之所歸後世讖緯之流耳楚靈欲併天下既不得卜則投龜而詬天孫皓亦命尚廣卜焉且曰庚子之歲青蓋入洛彼二君者曽不悟其已之不修而徒欲惟天之決故天命吉凶命歷年必以其類應亦可見其概耳元魏以下爭奪擾攘乃若灼然親睹其事無有少差忒者張彛之殺亂端見矣曽不告之以辟禍者何也其數也耶銓削選格排沮武人不可謂之數也果其理有以召之故耶雖然法自此立命由此出聖人人而合天者也關氏每拳拳于天人相與之際今之言天者類曰是莫之為而為者終至于廢人事而不之􅊰嗚呼關氏之學殆孤矣吾故欲削其不合者而著其舍者且書此以質夫人焉妄針我相我心圜中竅外一身之主百骸之會孰心弗真乃以妄害孰心弗正不與妄對倐而氣盈忽以質薤衝為機張湧作鼓鞴貧將急當粱肉粗糲賤欲速貴姬薑菅蒯窮思何益巧算何賴本根不守萌蘖徒汰擫目出光螢爝猶沫塞耳有聲暴若雷礚一真尚迷衆妄弗退卒與妄居毋俾正敗我曰不然職用自劾朂言敬茲永佩妄戒躁針昔我先哲有理無欲後民多欲理返不足當其躁起熾彼炎熇不燥則藏積為鴆毒豈心爾恬念在奔逐豈貌爾夷陷若溪谷狐狸器呼鰌鱔跳曲匪飈薄天匪浪豗陸何能爾動動則相觸豈不或靜拯爾迷復內省邪幾童牛之牿外惇正行羸豕弗躅繄沈與冥不自表襮雖躁勿躁敢不斂束昭然陽明窒爾隂濁惟是躁心我告匪瀆敖針人可敖乎敖不可長孰使子敖敖其焉往惟昔孔孟豈不或然敖其所可乃人之愆既辭以疾又鼓豫瑟留亦不止几隱豫几哀今之人𣣔一以敖詆欺窮陋矜説華好狂歟黠歟自謂過人過猶不及迄喪其身毋謂人言無足去取吉人之辭不在頰輔毋謂人行無足是非守之以正動與俗違人寧敖豫豫必自省彼何人斯敖焉是逞惰針惟我之惰我何以生我生之微曷敢荒寧莫健匪天晝夜不息繫之星辰厥有贏縮人之一身從幼及老疢疾憂患惕焉以保人寧幾何開口笑言曽不警戒日趨宴安周公作書是曰無逸求其艱難務在稼穡糞墻朽木嘗責宰我聖人尚云夫豈我可念慮之萌惰或弭之事為之著惰或弛之我告子惰惰乃不改習與性成後慎毋悔鹽官針廓惟東南瀛海之府乾靈輸波坤奧孕鹵燉之炎上瀉以潤下五味之長百殽之主豈伊廣斥禹服有貢物因天産利許民共豈伊乕形周官有職禮存國容醎佐王食時惟管生乃始榷之圖霸何急奪民所資秦益其侈漢承其醨將衆是濟豈吾之私舟車交載水陸間道牢盆斯給漕􅞮斯考口稽饔人家具竈媪苛碎已甚惕焉不保卓哉漢昭亦或罷榷云何可徴議在文學法如張弓利若舐刃刃銛則傷弓滿則窘貧以近寶寶不可即冨以斂怨怨何能克吁今之人汔可小息敢告所司敬之毋慝庸田針惟林其生亦夥斯植凡厥庶民我藝􅎟稷祗命農父飭是滔人井田之畫溝洫以均均以其流畫以其絡仁施暵乾利化磽埆在山者激過顙斯搏寧順其行勿私汝鑿胡水之洚微禹其魚胡水之汚陸海以腴曰漳曰涇克釃汝渠曰史曰白史不絶書胡可滅裂胡可鹵莽田畯之功水庸與􅌋厥有墻屋汝謂撤之厥有田􅍒汝謂割之慎毋輕民民乃邦本生養必遂務在蔍蓘慎毋去食食乃民天儲蓄必贏否則瘠捐自利利民豈止川瀆非汝之苛我民之足我民不足其何能榖丗無父誰踵其躅韶石銘逖矣上古帝在有虞時巡于南曰至蒼梧有巉者石岌彼海隅我奏我韶耆定爾區或搏或拊或戞或擊從之則純成也以繹明哉惟人幽哉惟神我祖我考我臣我鄰來汝之舞我功之敘勸汝之歌我政之和前瞻無前後顧無後出三代上居百王首孰強非嬴式訛人心孰淫非鄭卒聵古音嶺嶺斯深潏潏斯廣魚龍不波鳳鳥焉往有巉者石雙闕之峨誰使洞庭不張咸池丘曰盡善札云蔑加非帝之思我銘謂何秦坑銘惟嬴之虐自任不儒彼哉坑者曰焚我書書日以壞嬴日以跌竹帛煙起干戈流血邈矣上古無書可徴所徴者何刻木結繩神羲繼天肇造書契智如倉頡文字轉熾啓我混沌闓陽闔隂天愁鬼哭喪厥人心孰墳而三孰典而五素王不作萬丗一瞽微言如線橫議溢廛鈎鈲析亂不撲益烻出王入霸儒墨相駮徒兩業之何有禮學豈曰不焚動相詆譏收合遺燼顛倒是非汝塗汝塞拘汝奔赱還我古𥘉匪愚黔首有書無人與無書同激銘嬴氏我將適從春秋臺銘惟汶之東古稱中都其西匯如巨野所瀦于昭魯侯言出于狩曽不登厥聖聖應在藪彼芻者子乃獲斯醜繄聖是惻愚者以赱嗟嗟宗周岌岌嶪嶪禮墜樂壞兵戈日接齊強而據晉悍而讋頑夷相陵弱邑􅈬壓惟理與欲夫既析之惟亂與賊不其戚而其褒伊何卑以絺繢其貶伊何齊斧弗貸彼瞽左生史編是徴惟髙及赤口説相承一之弗協式用沸騰夸矛譽盾執鼓以興屹與者臺繄聖是處豈圓蹄肉角復出榛莽徘徊預瞻逖矣中土嗚呼吾銘永鎮鄒魯磻溪銘有瀏斯溪惟石之磻誰歟漁者伯夷之孫自彼東海曰徂周原我志非魚我人之完天錫有周君臣相歡爰底于牧爰取厥殘我咨我謀皇旅嘽嘽既定周鼎却開齊藩方韜汝光如龍之蜿我獵我人非畋之盤既顯諸用如鷹斯䎒發揚蹈厲亦揔其干惟古之道孰測其端勿謂伊人漁釣是姦我懷于今不古是觀已雖不能民之艱難有磻斯石惟溪之湍我勒我銘昭示不刋試劍石銘有序吳故吳墟也自閶門東出十里許有白虎之丘王闔閭試劍石在焉悼靈物之不可見銘斯作惟崚之鑠惟銛之斫山靈奉鐔白虎司鍔神威剿剛殺氣纏錯攻堅瑕破發邇逺略汾洮乘軺郊郢弛柝風斯輕剽志用驕虐睋然兕駭歘爾龍躍我思古人吁不可作蚩尤讃元氣肇開鴻荒斯闢凡兹庶民詎有兵革人禽攫齟草木災翳奚靈不鑿既裸罔衛蚩尤者出始搆禍端雍狐是資涿鹿相殘掀爐挾鞴鎔精瀉液舍我耝耰行彼劍戟惟聖制物與天同符君子慎術小人改圗豈伊樹兵爰使絶輿匪嶄頭角終殞肩髀霸王迭起仁義無稱揣摩捭闔拔擊橫行夫何攻戰尚汝禱禡九嬰乘城窫窳在野善師不陳時靡有爭曽不是戢曷維其寧天生五材莫偃匪武我贊蚩尤敢達祈父盜跖讃我觀古人我讃惟跖彼何人斯去順效􅊇盜本有道殺人以矜橫行魯國按劍東陵榛奧是栖間巇是鑿投骨起齗見金思攫世不豫善居恆有循分均我義後出吾仁􅉃汝刀戟機汝罟擭汝曰不然俾晝作夜我盜何盜取非我有不盜之盜人不汝咎聖人不作大盜日爭所恃者力相擒以兵上行下效僥幸邪侈因之而攘愍不畏死人豈齊豹地非萑苻誰生禍首卒化盜區跖斯可讃為善者惕於乎哀哉尚謹罔極延州來季子觀周樂頌我之懷矣惟我季札來從勾吳歷聘上國王綱墮壞侯度傾側日尋干戈不德以力大音橢窳二氣苛慝禮樂不興繄誰之則我奉我幣我車北東懿彼諸姬曰至魯邦魯侯賔之自郊徂宫魯俟享之式命瞽宗首以二南繼以國風載雅載頌商魯攸同申以象簫文德之容亦有大武允奏武功淵乎蕩乎泱泱渢渢或秉以籥或綴以崇上際湯禹虞舜之隆曰濩曰夏韶簫以終嗚呼四代一日備舉參聲知政閎覽博古或登或降踧踖傴僂夫何自鄶乃不及魯公卑私強寖棄厥緒或僣以佾或雍或旅襄磬武鼗方叔之鼓踰河蹈海散亂無所先王之盛究彼始基器之尚存去道逺而仲尼有云周公其衰豈獨郯子學在四夷邈矣千載詩亡樂缺設而不御矇瞍失列日趍淫哇恆用鴂呐宣榭既焚本實先撥我之懷矣心焉孔怛作此頌章昭示來哲漢武帝南巡射蛟頌惟漢六丗大展巡狩于南服自尋陽浮江而出親射蛟江中獲之猗歟壯哉蓋夫荆楊之域水土墊隘淫􅖈蛇行風雨怒作掀艫蕩繂睒瞪􅋏愕莫之敢攖上乃御黃間挾剛挂朱韘闓體而騰􅋆白羽應弦以砰䃗霜批鱗頰霧鬐鬛肉淵髓硤披角劙耳于是海童闢路川后清宫神靈恪虔耋老歡抃信帝王之英略天下之竒觀巳人莫不曰齊臣驂擊吕梁雷轟楚士劒揮江水血變彼一材官直制其死命烏足以動萬乘也哉夫豈區宇寧謐四夷奔竄掩沙漠之貪鷙刜篁竹之炎鬱強無有不弱堅無有不瑕拒之者如撓沸劘之者如拉朽將信威乎鞮譯又何獨快意于鱗介嗚呼材之尚氣之徑邇之悅逺之懾雲鳥之散沒魚鱉之顓顓殆有不必勞弓而挫鏑者臣乘臣朔臣助臣夀王躬睹盛美獨闕歌頌千載之下默默不文豫故特迹史氏之舊作是頌頌曰大漢之興兮丗繼其烈言巡東南兮略彼揚越一江撗匯兮陂障險隘有蛟崛起兮中路洶絶驚拏齚攫兮渤潏作􅖈上之頩怒兮彂我獷厲起施猛彀兮鬐角盡九嶷曉出兮矯立嶻􅑖舳艫暮拔兮波濤疊雪上神且武兮䠨仰桓撥功負不丗兮威振有截舟車所通兮職貢用戾龍沙不揚兮瘴海枯竭上飛無所逃兮下走無所脫嗚呼漢之廣大兮古未之制百里奚讃我思古人惟百里子自其知學亦聿既仕出干宋遊弗克離祉移事周頽復柅我軌我告我蹇我從于虞蹇謂不可我遄其驅鄍門不啓虢道是輸孰云我智我諌我愚豈伊一身終顯西土我肥我牛庸俟五羖相業弘闢霸圖超距國中行遊童叟笑舞勿曰我耄耄無壯時勿曰我賤賤者貴基勾萌甲坼稚好之姿干霄合抱貴有宜施嗟哉時命萬丗一厄矧兹白徒曽罔黃馘太公屠釣何晚弗獲繄我人斯老死誰惕接輿讃古有狂者曰惟接輿辟丗不仕祼身以趨放言嵬行神則內居鳥驚獸駭雖聖弗徒聖人于行荆楚是屆救時斯亟從政者殆矧麟未躨何鳳之翽曷違我真迄受丗害繄聖所可彼猶不然曰父曰母曰人曰天執心既一抱道弗權視兹犬彘獨不天淵夫何山谷卒遁名姓蕪菁是食駟鎰枉聘聿和其光克性爾性髙飈不群隱德之鏡我友者扈曽弗服裳豈無汚濁譏我踽涼既馳且騖滿國若狂古狂不作俾也可忘古碣石辭古碣石者本禹貢冀州之域蓋今東南海運自海而北逹漳河實出乎此豫喜其上符唐虞之舊制也勒之以辭惟聖建國實曰冀都北極之運萬邦作孚宫廷烿赫峙彼中居士女和會溢廛塞郛江檣白粲淮耜黃淤聿官有漕竟海其艫偉哉碣石枕我海隅表此水道長為委輸上蟠乾奧下結坤區割流豯養披秀醫閭日月播蕩星辰盤􆁰怪神罔象鼉鰐龍魚帆扶纜守翼奮鱗驅悉輦國用來通帝家自國有貢或河而渠或砥斯鑿或絶或踰繭絲紈帛金寶象珠搜毫竭縷滿稇壓車矧兹米粟誠係藏儲得一圭撮懸萬命軀漢乖轉挽唐厄征需于穆我后仰承唐虞按之圖籍實以德符普天率土瞻戴罔渝偉哉碣石厥狀屹如若柱斯植若甬斯塗𬈑漲如席濁漳以趨削巉勒辭永代是模白雲先生許君哀頌辭古之學者必有師丗之説者嘗曰經師易遇人師難淂嗚呼經師豈易得哉自嬴秦焚滅經籍之餘漢以來老師宿儒失其本經不惟口以傳授則或新出于風雨壞屋之所藏是以惟傳經久而不差者為最難至于人之所以為人示之以德義道之以言語則之以動作威儀是將使人觀感興起而易至于不自覺者無非教也雖然捨經則又何以為人師哉然以古今經訓學術之變迭興而師道之所自來者寖逺蓋惟伊洛諸老先生實始倡為道統而後知有所謂義理之學已而考亭繼之古今經訓學術之變至此而遂定必也誠明兩盡知行並進可以深造夫三代聖賢之閫域不然則經有傳之益久而愈差者矣是故古之學者常淂其師傳每因經以明道後之學者既失其師傳苟非明道則固不能以知經經既明矣吾則又知人之所以為人之道不外乎此也嗚呼經師豈易淂哉惟我許君昔從蘭溪金君履祥學金君本于王文憲公柏何文定公基而王何二公則又本于黃文肅公幹蓋此實朱學也然君天資深厚學力純至手抄口誦志行彌篤而且樂與人為善家故貧常僦屋以居逹人大官踵門候謁交剡論薦而曽不為之少動山東兩河江淮閩海之間賔客弟子擔簦負笈執經請業又必為之搜擲明白斟酌飽滿而後去𥘉未嘗見其有惰容是以終日危坐學徒環列無憮無敖無嬉笑無訾謷昏瞀者革心浮躁者易貌而日就于漸摩變化之歸嗚呼考其師友淵源之所自來君信可謂淂夫師道之重矣此蓋丗之所共見而無間言者也君諱謙字益之丗為婺之金華人家居教授凡若干年年六十八以沒豫適以事不及哭而君平日遇豫極厚于是特疏哀頌一萹以泄豫情此豫所以深痛夫人師之難遇而經師之尤不昜淂也嗚呼悲夫頌曰夫天下之生也衆矣其生如醉而未醒其死若夢而弗蛻何經籍之可聞豈聖賢之能對倐焉蠛蠓之起滅曶爾蠅蚋之攢嘬將一歸于澌盡卒無怪其厖昧惟古之大儒君子涵養省察戰兢惕厲道不遠人則天理民彛之所存經以載道則王綱聖髓之攸賴冝身名之並立獨不與年夀而俱壞嗚呼許君博學無方篤志不懈上追洙泗之本原前泝伊洛之宗派昭日星之訓則理全而無疵闢荆棘之途則辭逹而罔礙矧肅容而正襟恆睟面而盎背學徒麇來賔客滿座咸曰吾見其人矣吾聞其語矣是其車轍之同門户之正者彂之于難疑答問之頃形之于動作威儀之際實足使人心悟而神會吾固知其人物之標表經學之沾溉誠亦可以閎其中而肆其外矣己而天不愸遺曽不使之多有夀考而奄然長逝庭巷兮虗閴書䇿兮塵壒會稽先賢失豫砥柱襄陽耆舊奪我蓍蔡宋屈穀之瓠剖而無竅則渡者日溺鄭昭文之琴彈而無聲則聼者斯聵此蓋我許君之所以警新學鎮末俗者遼乎邈矣自不可求之于一時而欲罄之于千載者也嗚呼青山如屏流水如帶惜哉遺烈閟此幽隧死而不朽炯然若盡死而可作則巳莽兮黃土白雲之蕪穢矣奈之何哉其亦有可悲也夫其亦有可慨也夫張定傳張定者諸暨人𥘉以武學優等賜苐從軍建康犘清流潛江令端平間史嵩之制置荆湖孟珙帥軍夾攻蔡州奉香朝謁八陵定以受給錢糧從守鄧州時河南始通豪桀義士歲食官廩者僅萬人及兩淮進兵改湖北制置司計議官出江陵措置邊防團結水寨權守峽州將羸卒萬餘對壘生擒回紇頭目夷梓公奪馬五十四騎俘數千人遂以功換閣門宣贊舍人知泰州纍疏論清野利害不報去職復江東總𬋩建康駐劄兼沿江制置司計議官召守融州廣西經略司言左右江有警融據其衝欲調外軍定曰本土自有洞丁欵丁耳目便捷器械鋭利若能團紏調用皆精兵也可以應敵外軍懸入不諳水土惡弱不熟溪洞險阻無適于用坐受罷弊乃大置酒教場亭上鳴鼓一呼萬甲蟻集經略司聞而大驚遂劾罷定吳潛當國起知通州改守德安府開慶間賈似道開都督府定往謁曰德安地小不足展布四體勢須假吾一命圖得要領歸報幕下會北兵十萬越閩嶺而東别屯黃陂陽臺定亟言德安城壁單阤合盡徙居民保漢陽都統制劉炎遽引所部禦之陽臺矢下如雨兵猝不淂進似道命移德安治吳王磯頭定曰兵法先彂者制人後彂者制于人今幕府無先彂之兵而德安移治彼進我退異日將無地投足遂單騎詣轉運使趙葵稟議曰夫南人貴舟北人貴騎今聞北兵更用舟師鄂漢兵單弱不敵宜亟團捕魚湖船虗張旗幟部令不測使出沒炫耀江北洲渚間則大江徑渡之謀可少戢也不然一旦渡江復以鐡騎蹂我鄂漢必危葵怒曰長江天塹北兵豈易渡哉君郡守知不離德安一步言及鄂漢何脅也定曰德安小郡鄂漢荆閫要害今則北兵破沙洋泊陽羅洑掠取漁船斫改鞦幫旦莫斧斤不絶整兵練衆意在渡江萬一舉鞭徑渡東南閧動吾豈能獨受誤國罪哉葵怒愈厲曰漁舟如葉江濤渺然我轉運使也毋欺我定力爭不巳曰事勢至此謀議不信嘻吾死矣已而北兵渡滸潢洲葵遂殺定定死鄂漢大抵陷沒如定言為説者曰豫嘗到諸暨過定所居處得墓隧間故碑刪為傳方史孟之夾攻蔡州蔡下故所失地歸我子女玉帛悉輦而趨北朝廷持其議曰今幸淂一空城是徒有受地之名而又無兵無糧以實其地終亦不守史與孟皆報罷北兵復起于是趙葵許戡等出軍河南大兵迎敵我軍隨潰遂割唐鄧海泗以請和當是時定守鄧州竟無與成功者巳而襄樊破鄂漢有警磨些善闡之兵又搗貴象奪辰沅抵長沙取滸潢北渡與鄂漢兵合丞相賈懼開督進戰遣使乞解而定復為之用且欲倣佛乎荆軻秦武陽之遺風非其道矣自是北兵南下由郢之沙洋攻陽羅洑直渡江至鄂南門丞相賈統兵扼蕪湖孫虎臣前鋒對陳夏貴挾戰船二千五百橫亘江中丞相賈將後軍殿亂射北船執縛邏騎且挑戰北兵集將樹炮擊其中堅雷鼓大振呼曰宋人敗矣丞相賈即倉皇失措舳艫簸蕩乍分乍合北兵麾小旗率輕鋭橫擊深入殺溺蔽江圗籍印符悉巳遺失軍資器仗狼藉不可勝計丞相賈東走楊州孫夏並降當是時定言悉驗然定死巳久矣或曰葵與賈不協故置定死地或曰定使間到北𣣔翻漢陽城誘覆其衆失期一日故棄城出奔葵殺之也或曰賈至鄂許納歲幣而北兵退復有隂謀懼泄故欲殺定託之葵也嗚呼當滄海橫流之際人材國勢一至于此豈不重可哀憐也哉淵穎吳先生集卷之七
