front:
  text: 淵頴吳先生集卷之九人金華宋濂編
  hash: sha256:a3267e4f9355b820dc705307b3665c8d424556bc0e28fc70582719db2625139f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_009-1a}
body:
  text: 古琴操九引曲欹辭始豫少嘗學琴學之數日曽不能布指爪而辨徴角甚矣哉琴道之逺也蓋豫每思古人之去我者久不可復見徒欲想其遺聲遺韻而庶幾或得其心術之所存情緒之所託終以不克而後止是以常咏其辭樂家諸書又或不載或有載者多非其舊且至有聲而無辭甚矣哉琴道之逺也古者琴有五曲十二操九引五曲者鹿鳴伐檀騶虞鵲巢白駒本詩也漢魏以降惟鹿鳴一調僅存十二操者將歸旑蘭龜山越裳拘幽岐山履霜雉朝飛别鵠殘形水仙襄陵古辭或存或亡而存者類出彼丗之傅會漢蔡中郎及唐韓吏部曽作十操水仙襄陵且以其繫於樂工琴師不復採用故今特因琴操九引復輔其曲辭是數曲者頗本於婦人女子仇讎羈旅幽憂抑鬱之懷君子猶得以少返于古是則所謂琴道之逺者誠有異于閭閻下俚折揚黃華聽之則􅯳然而大笑者矣夫何逺哉遂從而具録其辭烈女引椘樊姬作詹巫山兮崔嵬又江水兮委夷草木兮芬芳鳥獸兮號悲孟冬十月兮森然樹羽野火霓揚兮袒裼暴虎君王耽樂兮妾心獨苦妾心獨苦兮無使罪子嗟嗟兮國之無人莽莽兮雲夢有洲甘酒兮厲生淫獸兮􅍔來君王耽樂兮樂滂沛妾處深宫兮焉知外嗟鹿與女兮自古戎之君王亟歸兮匪妾之私伯姬引魯紀伯姬作北風兮喈喈雨雪兮漉瀌我心兮殷憂東海泱泱兮大邦為仇平原何有兮廣澤有樹鴻鴈哀鳴兮麋鹿騰騖兵車轔轔兮在彼行路疆事弗靖兮委儀章而謀去我生而存兮曰蹙我國我死不瞑兮愳不血食父母既沒兮歸又不得周公有鬼兮曷􅗲豫福我泛兮柏舟蕩蕩兮中河時嵗不與兮可奈何遭此鞠訩兮奈若何貞女引魯􅃮室女作春木兮含英野花兮幽香我何所嘆兮我何所憶主少國􅋏兮使我悲惻嗟彼女子兮婉婉令姿盛年不出兮老將逮之嗟彼女子兮無非無儀肉食者謀兮汝何憂為我藝我葵兮我藩我圃過客馬逸兮莫之或禦藩拔葵踐兮飢哺無所廟堂失策兮婦女為虜悠悠蒼天兮天道惡盈知我謂我兮秉心獨貞陽和幾時兮霰雪其零懷貞見疑兮曷其可懲思歸引齊衛女作麥秀嶄兮禾黍油油越有鳴雉兮粥粥道周朝陽烜然兮雲霧塞天中道徘徊兮喪我好逑紅顔摧頽兮欲飛復止縞衣入吊兮既悲且毁禮有未答兮不敢徇死先王之懷兮敢辱王子父母鞠我兮胡然棄之宫庭嚴邃兮乃閟於斯身微莭大兮涅不可緇創巨痛仍兮隕命為期我思古人兮我敢失正天命早寡兮匪汝豫聘我歸之思兮渺哉河梁誰謂衛逺兮歸我其航霹靂引椘商梁子作步出郭門兮一何蕭蕭念彼古澤兮興言來遊山長水濶兮曠無儔侣天地晦冥兮霹靂警豫玄雲兮沍凝急雨兮滂沱氷雹兮交加蛟螭兮湧波捷捷業業兮天何我駴軯軨騞虩兮道不可以咫危顛疾蹶兮物無不靡側身慎行兮庶無罪悔神龍之歸兮肅然川坻雷公上天兮挾輈以馳昔何噓兮今何怒為巫咸去我兮誰其得知走馬引秦樗里牧子作白楊刀兮宛魯矛枕戈待旦兮思報父仇父仇既報兮義不共戴亡命不出兮遁我于隘山髙無人兮上無日星夜聞有馬兮繞屋嘶聲天不祐我兮愳追我兵橫尸都市兮國有常刑我徊以徨兮莫履我彂沂澤瀰漫兮道路超曶我啼斯漆兮我軀斯厲所處何危兮命幾一髮追兵既逺兮孰知其然馬迹在地兮莫辨東西父不可見兮我志獲伸我死得死兮嗚呼終天箜篌引漢霍里子髙妻麗玉作浩浩兮洪河有叟一人兮攜壺赴波我急爾止兮無楫迎汝爾竟汝渡兮爾何所苦龍伯兮馮陵鮫魚兮參差戕風奔騰兮霧雨渺瀰磨牙吮血兮制汝殭尸尓死于渡兮奈何乎我我亟從汝兮我死其可毁容惡服兮志不可回理魂隕骨兮委命黃泥碣石嶄巖兮望不可測精衛䘖石兮曷海之塞曷海之塞兮恨與之平和我如此兮不如無生琴引秦屠門子作山嵯峨兮我車之將水泱􅐯兮莫之或梁丗而溷濁兮黑白不明干戈日尋兮武夫顔行天寒而燠子厥有瓜瓞士賤以拘兮不敢容恱黔首之愚兮爾乃自愚謂儒可僇兮儒則何辜長纓兮縵胡瞋目兮語難堯舜逺而兮旦不復旦豺虎咬人兮潔身去亂商雒有山兮曄紫芝嗟彼美人兮跋子望之何世之不偶兮曰安其危而利其災天道至此兮我命之衰龍丘引楚龍丘子作春花兮亂開秋葉兮滿階時不再來兮我憂用老久行懷思兮我歸無所鳥則有翼兮魚則有鬐灊霍有嶽兮江漢斯波徘徊不進兮厄彼路岐僕夫告病兮飢馬囓其我夢之歸兮吾鄉我里門闕依稀兮墟墓則邇魂神惝恍兮一夕九徙父母何在兮敢及妻子天隂歲莫兮北風之寒曰我無衣兮坐不能餐我拊我膺兮摧我肺肝閔天嗴嗟兮喟其增歎三彭傳昔在天地未判之初混混沌沌玄玄黃黃載清載濁實隂實陽水火交運曰星乃光爰有神人厥名曰突實生其間吞吸元精孕胚巨霛上顱下趾肩髀成形口味鼻羶目色耳聲一機既闢萬化則行次有三子受氏惟彭孟琚仲質季矯是名相其居處託彼衆氓私其喜樂潛覷默爭吉凶紏纏􅍔福搶攘無有唇齒讒言其興無有刀橶積不相能人類用殄鬼怪為朋天下雜擾而欲以聽直於明庭於是黃帝乃召天老而問曰朕治天下嘗以為天下巳治矣三光齊明萬物順軌教流民人德洽逺邇昆蟲喙息草木靃靡華夏蠻貃率我綱紀彼獨童狡嚚昏頑鈍椎鄙機心曰滋嗜欲鋒起是何人情之大不美也彼三子者何以敢于亂始歟天老對曰臣不識也帝盍即是而詰焉孟琚率爾而前曰自臣之生茫無識知秉心多欲觸事即思揣靡傎倒神去鬼來佪翔無象捩轉九垓莫髙匪山墮若阜莫浚匪淵規我沼池貪贏務嗇乘間抵巇巧窮毫髮枚數根荄他人富利視若己私叢為怨府襲作􅍔媒墨㦿注睛舑舕流漦已苟可得靡有匕遺仲質戚乎其容以次進曰自臣有行獨我勞苦頩然變色赫尓齎怒狹中淺量捁臟鞣腑言槍暴彂氣鞴交鼓霆砰電毄燀穫禾火蜂午草搖風動淫毒齊弩恌浮嚄唶嗀唾喑噁誚譏是非傎錯橫竪孰蛙睅眸孰螳攘股妄恃我強一與時忤千金解仇睚目柴為虜世不我容胡寧可數季矯後至奮而稱曰嗟乎異哉伯仲之言臣殆不敢以默巳自臣之北肆其殺殘按膝危踞瞋目語難犀渠鶴膝蛇矛筡􅗋嚼肌泄憤鍥骨求瘢力可扼乕雄狡弗完射則命中飛走欲殫一言相加六親無歡兵在其頸髮上衝冠精神熛彂魂魄遁奔積骸為丘流血成丹戰聲未衄敵膽巳寒志在我勝疇測吾端于是黃帝窅若有聞黯然不怡起顧天老復極其辭巳而彼三子者逡巡拱立錯愕失次同辭而進曰惟帝清問下民鰥寡無益臣雖不言帝之視聽可盡蔽歟蓋臣聞之人生一世本自化樞孰不百年我謂斯須倐其童幼馴至老枯何頭不秃何體不臞貴榮賤辱利害爭驅死喪病瘦悲嘆囚拏開口笑言能得幾娛縱情恣欲豈我過踰方其賦形我有軀幹曰忲美目清揚雄髯佼大肩背豐厚手足輕快語音如簧容止若畫市童興嗟鄰竊睞是皆自然罔有過害至若疲癃連蹇痀瘻盲聵步趍如縶顔面弗靧視臣之全生而抱形者百不逢一孰可倚賴飢羸危窘菲惡困殆褐裘不充藜藿弗嘬視臣之順適而愜體者千不遭一復何怨悔古人嘗有言曰天生時而地生財人則用之山丘之髙川澤之卑肖翹蠉蠕華實葉枝時至氣來各有所宜是以人為萬物之霛而實用夫萬物豈我之私然則世之所有天之所樂但知􅒏情何有規彠名車駿乘鞍韉轡絡芳醪美饌鼎飪羃杓竒聲異伎絃筝粉澤任口醲鮮隨身煜爚此殆臣兄弟之所喜聞而時俗之所謂憂謔者也嗟乎人不可以無權權髙則廓權降則韄人不可以無勢勢盛則爍勢傾則縛惟泉濫觴而必達惟火燎原而必灼順臣者得志而相矝閼臣者逆天而自蠚是故思之不得而至怒怒之不巳而成僇臣猶恐其未足以竭平生之志騁一己之欲徒大期俯仰而向盡此所以終歲奔跳而藺轢者歟雖然彼凶而暴世之下愚罹法受戮殘辱狗豬當其生存恣意所如此通而睿聖人之徒黃馘稿項飢餓體膚及其沒身併盡丘墟是蓋天下之雜擾者或修或短或黔或晢或夀或夭或遭病患或遇􅍔謫各有天命弗勞人力恆自困於昏睡反謂臣之讒賊而彼衆人方欲以是而聽直於帝庭也孰為直歟於是黃帝乃召天老而告曰自朕之治天下帝榆無道侵欲諸侯蚩尤暴起兵亂冀州太一奉符天一獻謀一戰而勝涿鹿是都橧巢營窟風雨漂搖果蓏蚌蛤臭穢腥臊民人告病我是用憂制彼藥餌務為民逑彼三子者呌嚻雜遝兵之不可藥之不及雖欲本其致亂之故用以變之毋乃天下終未能盡治歟天老對曰臣聞上古開物之時天髙地下風氣漸張醴泉瀵注地膚馨香上飛下行身有光芒歲久念食嘉穟穰穰民有爭心變生粳爭之不巳殊厥井疆天人既離善惡乃彰彼三子者始得以自肆其姦而莫之或攘然臣嘗稔其言矣琚也多思宜於長顧而却慮質也多怒宜於憤世而嫉邪矯也多殺宜於徑情而直行是誠有害於聖人大公至正之道者臣則請帝杜其宴安之毒敜其蹶痿之機浣其腐腸之食齾其伐􅒏之媒則彼三子者之致亂猶可及止巳何謂天下之未能盡治歟於是黃帝乃即齋宫纍月不親政事經年不邇聲色恍兮惚兮而或與方宇謵朋等問道具茨合苻釡山且又神遊於華胥氏之國天下大治由是三彭不振遂至於亡為説者曰豫聞祝融之子厥有大彭實居彭城是為彭姓至周有彭人别居庸蜀微盧之間非其後也蓋今三彭氏本在於黃帝之世則又異矣雖然大彭之後有彭祖曽以雉羮享帝帝錫之夀考至八百嵗而彼三子者乃幸人之有過出讒于帝以求享而人用是􅍔患夭札者相繼此則又與彭祖者果異歟悲夫潘生傳潘生者富陽人丗業農幼喪父獨與兩弟奉毋居間出與人執塓甓治筐筥又為善工大德間江南大飢人民道墐者相望自度無所得食曰吾終無以給母則母子俱死等死盍若用吾強壯少延母旦夕活乎即以母屬兩弟自傭回鶻人乃告母曰兒當傭錢塘數月得錢米活家且自活母勿憂既回鶻人得轉賣遼東遼東大家軍户遣代戍虎北口會上有詔江淮子女流徙者衆禁人母得轉掠飢民使悉還鄉土遂從遼東給過所道遇一女子鴉鬟尾行問之則曰淮産也昨因飢父母棄我轉徙數家今主家使我歸君南人儻挾我得同歸乎于是日即操瓢道乞夜泊茅葦中雖顛沛流落親䵒日久曽無一語少及亂渡淮曰我家通州今近矣君盍送我到莊乎及女子上堂見父母攬涕泣起相抱持詰門外同來者何人即引生更衣具酒炙樂飲酒半執盞跪曰吾女幸完骨肉韙見鄉里免罹霜露盜賊君力也今吾女猶處子君誼聲暴淮椘間且君去家久母不知在亡嵗丁荐飢鄉閈必離析廬舍必墟莽雖有兄弟亦恐不能自存活吾家尚薄有園田給􅊡粥吾女實君箕帚妾也君必無歸生則毅然謝曰吾何敢以若女為利哉吾雖賤不讀書且義不敢取况吾母固衰耄度尚可活萬一母死兩弟儻或有一存今遂不歸是吾遽死吾母也吾又何忍即安此土乎遂告歸母死者蓋三載兩弟亦死生追制服復食其故技于鄉以終為説者曰凡人自立天地間夫妻子母天屬也人子事親候顔色具甘膬鞠躬盡力雖生死不暫違去今生自棄其身飢莩中規奉其母母幸粗延數日命猶念母終身可不謂孝乎丗衰民散雜男女或強暴侵陵或謡諑善淫鮮能自合于禮法者今生偶以塗路相遇皎皎不汚卒辝其婚可不謂義乎嗚呼世之不及此者衆矣一恆人乃凛然類古獨行君子尚可謂世為無人邪然生終以老死沒視彼妄夸姦佼反以義俠特聞嗚呼此又何為者耶韓蒙傳韓蒙者永豐人家本江東大姓善賈至蒙益蓄善田踰數萬畒計􅒏樹惇常低首下氣類懦夫女子未嘗敢出纎芥語鉗制人視歲貧窶鶉餒給鹽米炭死或給棺蒙鄉里時蒙舉火者或數十家蒙每售田田必過直與錢且追舊劵自算曰某售某田彼欲速我貨今我入榖田實上腴我欲久有我業又乘人之時詘恣贏于巳母乃為過貪巳乎復召與錢蒙既老謀卜山以葬鄉人有山最吉即獻山蒙不可蒙諸子遽割園田與山多寡埒蒙又不可曰我死歸我骨免烏鳶免螻蟻山泉樹木悉為我有且彼豈或不能自為竁顧藏我乎復估山所直與錢鄉人不肻受召與飲強授錢乃巳自是鄉里童耋見蒙出必歡曰吾長者凡在東阡西隧田芃然茂園菀然蕃池孳巨魚山養嘉木蒙曾不待防護程督利日歸蒙然蒙頗以財自衛無有妬蒙而思欲撓奪之者故蒙卒以富饒終其身嗚呼丗所謂大富家者豈盡蒙比耶自其乘時射利血牙臘毒不至于溪壑屬厭不肯巳終不免自陷其身為刑僇之民自蒙處之誠不肯頃刻安寢食彼方亟肆其術肥家而瘠鄉恫疑噤喝持鄉社輕重搖脣鼓筆挾州縣短長徒以爭強競得于一時不恤其後或一世二丗三丗子孫既巳凋喪廬舍既巳摧落田園易主丘木斬伐罔有遺蘖至使鄉里衆人追數其既往之愆尤曰天定者勝人視蒙獨不可愧耶嗚呼吾每觀數十年來丗衰俗下田力頓耗泉脈寖竭歲無美禾山恆蒿然池多眢衊不得孳鯤鮞是豈天時人事相為上下本其人一以貪殘剽磔之行自戾于天不有天災必有人殃而天特有以默勝之耶然而天下多故閭里益騷粳籺不充口裳褐不掩脰悲憤姦悍而欲競泄其毒以逞莫之底止是果丗無富民長者耶嗚呼幸使吾鄉里知有蒙也可以勸為説者曰豫聞穎川白晉言如是晉嘗宦遊其鄉至蒙家蒙具水陸鮮薨時新𬞞蓏醯醬蔥泄烹瀹調齊執酒漿獻酳拜跪恆中禮一彂言必及于善毋躗遇它過客盡然此殆富而好禮者乎晉北産惇朴不妄人也故蒙之行事實可傳會稽傅氏夏小正注後序夏小正本古書殘缺近會稽傅嵩卿頗就大戴禮校讎刋注刻在會稽學宫蓋昔孔子嘗曰我欲觀夏道是故之𣏌𣏌不足徴也吾得夏時焉説者則謂夏時夏小正也聖人當春秋之丗每告顔淵以王者百丗通行之道首曰行夏之時殆取其歲時之正政事之善也此豈果謂夏小正之一書哉周公之時訓吕不韋之月令類若一本于夏小正而又加詳漢魏以降嘗建讀時令之官凡以夏禹周公之典丗宜守之而不敢有逸故也後丗儒者乃欲舉時訓月令而盡黜之且曰天時之運行有常而王政之設施者無常起居號一令慶賞刑威惟其所值而即行之誠不可以非時而暫廢苟不即行而暫廢則天下多滯事矣豫試論之天之與人一理與氣而巳蓋惟理常為主而氣之所運一屈一伸一開一闔暑焉而土山焦爍寒焉而川澤凝沍天下肖翹蠉蠕根茇浮生之物無不熏蒸融液周流交灌而舉不得逃焉理固在是也聖人之所以為人每全其理之所賦而又順其氣以行之不敢少逆因時制法按月布政春夏陽舒而賞慶行秋冬隂慘而刑威作是皆悉本乎天之一屈一伸一開一闔而固非我有作為于其間萬一有逆乎此而天道遽為之變一言之彂與某休協一事之動與某咎應春秋洪範家類能言之而後儒或譏其泥者此猶嚮謂時訓月令之可盡黜者也嗚呼夏禹周公之典不幾于遽逸矣乎夫夏后氏之政典嘗曰先時者殺無赦不及時者殺無赦然所謂先時不及時者豈有它哉春飬狐子秋食耆先每事不敢有違其時者是謂經制盛夏非行師之期而出師窮冬非肆眚之日而肆赦則是一時之所值有不容不舉其事者是謂權術自天道而觀雷霆霜雪一切各以時至者則理之常不以其時至者則氣或有以激之而理則非常聖人之典亦道其常者而巳矣今而曰天時之運行有常而王政之設施者無常起居號令慶賞刑威惟其所值而即行之誠不可以非時而暫廢是徒苟用乎一時之權術而終不得乎王者之經制且夏禹周公之丗因時制法按月布政天下亦何嘗多滯事哉為此説者始不究乎天人之一致而務欲裂而二之者也然而古者聖人之道每與天地之化相為流通泊然而神明內居窅然而氣化外變是故冬而振雷夏而造氷宜若或違于天而天固不能違之此不可以一槩論也自惟聖人知其理之若是而必道其常以垂丗立教陽氣一通則鑽燧出火隂氣一斂則築室藏氷觀其所以彌綸匡贊節宣調變于天地隂陽之間者豈為無所用其心哉達賢君子治其一身且順天地四時之變調其居處莭其飲食禁其嗜欲適其志意一國之政辟之治身則又大矣傳不云乎周歲多燠秦年多寒是特昧乎夏禹周公之典或流于舒縱遲緩或陷于嚴酷刻深而不自覺焉者也由此觀之孔子嘗有取于夏時者天時與王政相參王政得則天道自應後丗儒者乃欲舉時訓月令而盡黜之則先聖人不謂其嵗時之不正不謂其政今之善哉嗚呼此亦不得其説矣南海山水人物古迹記南海蓋禹貢揚州之南境春秋戰國時地本百越至秦始通而尉他王者五丗漢元鼎中南越平立南海等郡屬交州治蒼梧建安中徙治南海吳孫權𥘉割交州立廣州而南海郡屬廣晉因之宋以後江左州郡析置不一至唐即以南海郡立廣州永徽後嶺南五管悉隸廣府咸通中復分嶺南為東西道廣為東道唐末迄五代南漢劉氏據之及宋𥘉而後平今廣州上路領縣七番禺秦縣南海增城漢縣新會清逺陏縣東莞唐縣香山宋縣廣大府也山水人物古迹之灼然可紀者夥矣粗載其大略于萹畨禺山在畨禺東近城兩山相屬髙丈餘山海經黃帝生禺號禺號生禺京處南海一曰二禺山或云黃帝二庶子善音律南採崑崙竹制黃鍾宫遂隱此山五仙觀山在子城內椘髙固時有五仙人人持榖穗一莖六出乘羊衣羊具五方色遺穗州人羊化石仙人騰空去南海廣利王廟在畨禺南廟有唐韓文公碑玉簡玉硯象鞭精緻鄭絪出鎮時林靄守髙州獻銅鼓面濶五尺臍隱起海魚蝦蟆周匝今藏廟中宋真宗賜南海玉帶蕃國刻金書表龍牙火浣布並存浮丘山在南海西本羅山朱眀之門户浮在水中篙痕宛然今去海四里有葛洪珊瑚井洪煉丹海神獻珊瑚中宿峽一曰峽山在清逺東山對峙江中秦趙胡曾鈞得金鯉可重百斤貢之秦王有釣鯉臺東有尉他萬人城南有標幡嶺唐大曆間哥舒晃叛廣州討晃夢神人謂曰見幡即回及晃平回師山頂有挂幡白雲山在畨禺東山髙無泉有龍化為九童子泉遽涌時有五色小蛇蜿蜒下為大小水簾洞秦安期生隱處始皇嘗遣人訪安期生或云子城東有安期生蒲澗溪澗中産菖蒲一寸九莭食之仙任囂墓山在西城內囂秦二世時南海尉病召龍川令趙他使行尉事嚻死秦亂他竟自王越王臺在大城北尉他築西有越王朝漢臺嵗時望漢拜兩臺踞山巔屹然山有達磨泉達磨自天竺航海至指其地曰地有黃金萬餘兩貪者力鑿得泉達磨曰是可銖兩計哉令海水鹵鹹泉最冽越王趙他墓山在南海南自雞籠岡北至天井連岡接嶺他葬輀車四出棺塴無定處吳黃武中交州從事吳瑜訪他墓莫能得獨得王嬰齊墓珠𥜗玉匣玉繭金印三十六銅劒三爛若龍文悉璃玉押金飾後瑜携劒經贛上飛上江水南越王弟建德故宅在西城內吳虞翻移交州時有園池唐六祖慧能剃髮受戒寺有壇壇有菩提樹房相國融譯楞嚴經有筆授軒大硯融自刻大唐神龍改元七月七日天竺僧般刺蜜諦自廣譯經出此硯堅潤可愛藏殿內有屈眴布西天衣繡內相大如兩指越井岡在南海南一曰趙他井一曰鮑姑井鮑姑葛稚川妻嘗行灸南海善灸贅疣唐崔煒遇姑得越井岡艾南漢劉龔號玉龍泉禁民不得汲石門在南海北山夾江對峙如門漢樓船將軍揚僕討南越先將精卒陷尋峽破石門東有貪泉晉昊隱之刺廣州酌泉賦詩處隱之北歸家人攜沈香一斤覺投香江中漢徴士董正墓山在畨禺東正州人清白不群晉隆和中太守袁彥伯求其後旌之馬鞍山在畨禺北秦時望氣者言南海有王氣彂卒千人鑿山狀如馬鞍漢伏波將軍馬援嘗駐兵山岡每風雨晦冥聽之若有軍聲殷然盧循故城在畨禺南城南小洲狀如方壼蓋循故居處仐盧亭夷人男女椎髻俗採魚蠣藤竹又有龍户一曰蛋户舊傳循字元龍此恐循遺種五月一日禁水蛋户不設網罟石鼓山在東莞南山有石如鼓鼓鳴丗亂兵起盧循東寇隱隱有聲金牛潭在增城南本增江水潭有金牛晉羅公釣得金繂牛從繂出見人復沒斷其繂得一尺義熙中周霛甫勇掣得三尺唐韓文公宿增江口有詩示姪湘甘溪在南海東晉廣州刺史陸自西北百餘里築堤瀦水給城南漢劉氏闢甘泉苑泛杯池南有陸公亭故基夾溪種刺桐木綿花開殷艷如畫博大山在畨禺東山有盧循母檀氏墓東南有盧堠循浮海與吳隱之戰立烽堠處山下溪有神鼎唐劉道錫刺廣州遣人係鼎耳出鼎耳斷鼎沒執鄉者耳盡痛馮盎墓山在新會北盎丗為南越首領祖父寶守髙涼聘譙國夫人洗氏寶死洗懷集百越斬歐陽紇陳紿洗鼓吹麾幢至盎三丗武德中盎將南越衆附唐赤石岡在畨禺西南山色赤如火然唐有扶南人請以黃金萬鎰市山彂寶藏刺史韋明曰南州鎮山也弗許景泰山在番禺東北山巍然聳拔下為越溪唐景泰禪師卓錫處古有七仙人守山後彂得石履二古鏡一紹興間風雨山裂又得唐天寶時銅鐘並藏寺中黃雲山在新會北唐一行禪師來遊此山黃雲自山出如金輝映衣袖遂卓菴山巔弟子至者餘五百人寶莊嚴舍利塔在西城內梁大同間曇俗法師奉武帝命求釋迦舍利創千佛塔唐髙宗時廣州都督李重建王勃記有古井九繞塔內有古䁀藏劍一鏡一銛瑩下彂得佛牙舍利似是梁代故物金芝巖在清逺北唐天寶間望氣者言南海東南內有霛山彂金草遣使得金芝二十四莖錚然作金鐵聲黃巢磯在清逺南黃巢寇廣州殺李紹覆舟處西樵岩在南海西南岩有石室石珠飛瀑如瀉下為玉女淘沙灘漉梨泉龍泓九真洞嵗時恆禱龍龍泓占風雨雲氣南漢時有烏利仙迹鎮象塔在東莞西南漢禹餘宫使邵廷㻆造廷㻆劉氏愛將嘗告劉鋹曰漢承唐亂幸天下有故干戈弗及漢寖驕今諸國悉珍寶奉中國漢不可後否則宜斂兵自守已而宋師至廷㻆將舟師出洸口鋹疑廷㻆必叛殺廷㻆禹餘宫漢離宫九曜石在西城內城有湖長百餘丈水凝緑列石嵌竒突兀類太湖霛壁者九南漢劉氏集方士煉丹處蘇文忠公古舍利塔在東莞西資福寺羅漢閣狀若覆盂文理類巴焦五色備具蓋古佛䐉骨也比丘祖堂夜夢赤蛇吐珠白壁上旦果得舍利建塔公自作銘以實之東坡泉在西城內天慶觀蘇文忠公𥘉鑿得一石狀如龜泉涌出號龜泉清冽亜達磨泉淳祐間經略使方大琮浚泉護以㝎林廢寺鐵井欄大琮有鐵井欄銘仙女灣在香山南海中宋益王是南遷泊仙女灣丞相陳宜中欲奉是奔占城颶作是殂葬香山宜中遁殿帥蘇劉義追宜中不及夜有火燒仙女灣舟櫓幾盡崖山在新會南山有兩崖對峙海潮出入宋紹興間嘗置成衛王昺南遷結營崖山海中海水鹹級道斷天狗墮海聲隆隆如雷丞相陸秀夫朝服抱衛王沈海文武嬪御從死者萬數大奚山在東莞南大海中一曰碙州山有三十六嶼山民業魚鹽不農宋紹興間招其少壯置水軍嘯聚遂墟其地今有數百家徙來種薯芋射麋鹿時載所有至城易醯米去為説者曰東陽李生自海上回為言南越事山川風土悉有可考者夫南越本一州地自秦漢以來始通尉他之自王劉龑之􅌹制亦嘗自同中州崛強數代至于天下盡一而後能有定豈不以其山海之險逺故哉當今廣為大府自江嶺而上經大庾關隘之髙峻自閩徼而入過潮陽嵐路之稀逺自牂牱而下則又將歷灕江湟水瀧石之嵓崿黃茅青草炎瘴襲人毒蛇猛􅍑山谷盤踞是故丗之仕者恆未嘗碩至至則常數期日而或不足以償其苟且塞責之心然而晴天勝景山霾開而海氣伏珍禽嚶鳴異草叢生花有素馨朱槿果有荔支龍眼檳榔蒟醬之屬芬香艷冶鮮甜爽脆魚雞蜆菜堆積于市酒支數年苟能順其風氣時其調適宜若無間于中州至于控制山獠壓服海外大蠻夷嵗時蕃舶金珠犀象香藥雜産之富充溢耳目抽賦帑藏蓋不下巨萬計又必賴夫涕泣還金之吏而後有以愧夫輕生好貨之俗厥任至重故常劇于他郡而必欲其稱聀是又豈得以其險逺之故毒瘴乘之而或略于民事者哉然則世之仕者勿以其險逺可忘必圖其政山海之氓勿以其險逺自恃必奉其法度此則天豫堂陛之間即為廣府誠不可以不慎也雖然自秦漢通路以還南越幅貟數千里莫不自歸于經理撫綏之中至唐而後列為五府廣府實大山深洞惡民頑俗獷草搖風動常必德懷而威懾之然後自巳間者一時山洞顓顓無所覺知之氓弄兵潢池假息湯釡至使父兄子弟修城柵繕壕塹晝夜鉦鼓凛焉若巨敵之壓境訛言相驚繼之朝廷以是而厲法令警盜賊修馬政禁兵器是雖一指疥瘍之微而遍身猶或為之不寧者蓋久而後克有定此豈可以輕視南越一區之地而不深戒其山海之險遠者哉嗚呼今之所紀者山川故在人物則悉巳往而不可復追矣遂因及其風土政事之槩者著于末簡苟有觀者曾可謂為晉宋少文之卧遊云尓哉豫故得以具論之淵穎吳先生集卷之九
