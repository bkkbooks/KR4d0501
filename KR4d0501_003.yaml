front:
  text: 淵穎吳先生集卷之三門人金華宋濂編
  hash: sha256:d40a8848353207d466f61fa5e90bc94d63c492267aae317d8b67b22d8943bcc8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_003-1a}
body:
  text: 蜂分白日照我牗群蜂亂飛揚胡然立國邑意各擅侯王細腰峙窟宅修股負糇糧搜尋百花叢吮飲靈露漿長雄據要劇孫子孕蕃昌班茅寧建社娖隊欲殊疆秦年賤親戚強壯遽分張唐朝富丁口寬狹或徙鄉嗟兹大寰內一是爭鬩場物生豈不微翾優乃其常龍伯數千丈巨軀果何藏鵠人僅三尺么麼具冠裳肖翹本殊異􅒏命可比方中心苦見役外患復難防當時一割裂在處幾披猖杯圈置鴆毒突奧彂刀槍龍號聲殷雷乕鬪齒嚙霜紛紜彼楚漢倣佛此燕􅋽螻蟻尚有知槐檀互相攘蜾裸祝它蟲㗸浞穴枯桑天機久巳泄世網孰為綱委形混衆萬觀物詎能詳歲寒野草死寒菊弄餘芳群蜂我爾恤矯首慨以慷客夜聞琵琶彈白翎鵲白翎鵲東海來十里五里何摧穨一飛飛上青霄際再飛飛墮黃沙堆少年臂名鷹齊出跨駿馬放鷹一馳躍與鵲相上下身佩木弓射必命中中疊雙蹀血芟毛天欲雪摩雲壓草地多風衝突三邊有意氣指揮八極無英雄白翎鵲西海去千里萬里何軒翥一飛飛上賀蘭山再飛飛過鐵門關少年領強兵乘勝即轉戰戟頭吹火光旗幟舞秋練手持生鐵刀空城鳥雀盡死鏖麋鹿瘡痍無處避角貒躑躅向人號收拾廣輪奠郡邑肅清星嶽靜波濤白翎鵲東海西海都驅霩太常召見日月山治定禮行功成樂作大雅清商久寂寥鵾雞邏逤多弦索上林花開早浮艷榆塞葉落終廽薄一聲髙一聲低一聲懾懦百乕豹一聲束縛千鯨鯢白頭漢士聞先拍青眼胡兒聽却啼君不見康昆崘羅黑黑開元絶藝傾一國若還睹我白翎辭二十四絃彈不淂陳彥理昨以漢石經見遺令承寄詩索石鼓文答以此作橫山先生多古玩太學石經分我半魏公世藏資州本金石録中還𣪚亂當時愛竒巧收拾茟畫昭回映雲漢流傳到我乃不逺虬甲鳳毛真可惋自從淂此未有報歧右石鼓天下觀昔則𫾣火今斷臼駱駝載歸石盡爛倉沮以後即史籕先代遺寶列圭瓉中郎變篆生八分二者不敵何足算先生嗜書出法帖青桐堊壁手脫掔漆書科斗不通俗蛇蚓蟠結強塗竄先生博學抱聖經焚膏繼晷目耽玩韋編鐵擲只紙傅鄒魯精髓合淹貫國子門開塵沒城蓬萊閣廢草堆岸春秋徒聞壁可假道德詎信鵝能換古今所重在周典周史面目極聖心不死不在石日月行天旦復旦吾家故紙本不惜驪頷有珠吾欲煆向來見辱亦云然焦尾之餘爭免㸑先生安坐幸勿躁歲晚相逢笑拍案屏除許事不須説好與吾儒峙楨幹小園見園丁縛花我嗟衆草木髙出陵雲端叢生或滿地品彚可不完山園我栽蒔作此小屈蟠龍頭何其蠢鳯翼乃若干胡然贊化育任意騁雕剜勾萌欲旁達莭目終液樠縈廽挾煙彩刻剝獻雨瘢立身既不直生理寢凋殘春陽彼一時花彂黃白丹歌謳雜舞吹酒炙飫杯柈歲晚忽焉至北風吹汝寒皮膚早蝎蝕骨髓愳枯乾聖人治天下萬國無不歡視民本如傷動植總相安刑名威雪雹劒戟血波瀾廟堂苟失策閭里轉窮殫彼哉彼園子此况􅚨爾冠人生但心勦若處淂體胖我方即移汝前有蒼蘚壇世非郭槖駝何以垂鑒觀題錢君輔𬗋芝圖我聞錢子古丈夫早歲喪親伏墓廬血淚迸空百草枯神芝挺彂黃土壚一莖三秀燁以敷圎釘寶蓋屹相扶醴泉灌注含膏腴𬗋雲覆護連根㧣山靈地媪侈厥苻鳥啁獸躅助號呼削杖苴絰麻布𥜗毀容惡服絶復蘇孝悌有王貫斗樞卉木榮華孝之餘里閭耇長起嘆吁痛心疾首矧可摹夫孰非親堂上居日嚴秖敬本一軀夫孰非子膝下娛風樹悲撓弗待豫愛生戚死自古初德鉏誶帚俗易趨刳分宦奧類向隅較計絲粟遽異儲𬒳薪委壑餧鳶烏酣酒嗜炙酗杯杅衰雖在身孝巳渝天薦厥祉天亦誣信哉純孝與世殊史茟值此合特書素冠所刺今不無朱草有神錫爾孤琅玕玉樹豈淂知岱衡恆華五嶽都玄黃赤白擁趾顱列仙山澤或療臞瑞不為孝徒區區天寒歲晚霜霰踈慎終追逺在我儒匪丹伊青繪此圗後有過者尚式車題天台山張莭婦卷古人重首教夫婦係民彛自從𥘉御輪禮有親結縭百年主家室中饋務倡隨溘先苟不待從一幸無虧世途日趍下貞莭誰肯持于焉見菅蒯早歲哭繐帷荼毒守几席惡笄毁容儀旦夕執酳奠春秋動悲思病姑坐堂上躬飬我巵匜稚孩倚床側慈訓我書詩奉老當以終撫孤敢如遺白頭誓不爽黃圡詎有知我生何惻惻我死乃吾期惜哉歡娛際捐我少艾時鸞鏡塵巳蝕錦衾淚還緇史管獨不煒春裳忍為私因之念三季似此實女師谷風或棄背行露且陵欺詠歌可勸諷開卷益嗟咨從來桑濮地不廢柏舟辭題彭雲溪南安軍新建東坡載酒堂南粵故墟篁竹鄉東坡舊逰海渺茫蠻山蛋水環為疆生黎熟獠共翺翔良辰勝日㗸杯觴踐蛇茹蠱盤腥薌前列荔丹與蕉黃峨嵋英氣壓四方自來金馬與玉堂豪邁絶俗觚櫝將雄跨九州若毫芒唾視一世孰雁行顔駟蹇剝白首郎趙一坎壈抱剛腸天欲勞爾使望洋一身去國不淂藏山川煙霧與耿光詩名道價極焜煌有美一人婉清揚俯仰陳迹闢新堂歲時桂酒酳椒漿飊輪羽蓋顧蒸嘗和丘鳳鳥翼方􅋮汪野龍魚負鞶囊嗚呼使君漢循良嗚呼使君唐辭章髙山景行屹相望一時短矣千載長超然𬒳髮下大荒貞女引記豫所聞于蘭溪錢彥眀者北方有逹者官守託閩壖一笑侍盥􅌨千金淂嬋姢晨歌雲母幌夜舞荔枝筵春桃獨不艷秋栁遽無年于焉榛笄毁遂以檟櫬遷音容詎可睹涕泣空餘漣墓埏但未殉床第更誰妍越鸞悲掩鏡齊雉痛鳴弦人子當盡道妾生敢移天手澤尚不忍家風豈其愆吾何惜吾軀汝懼辱爾先郡庭給過所江驛遞歸船郵兵即前防纜卒𣸪後牽時時數叉珥處處閲槖氈心堅務玉白鼻截愧瓦全指波著重誓抗莭脫飢涎世故日巳下民彛孰能然狹邪情比絮桑濮步安蓮閼氏弄琵琶青冢俗曷鎸昭儀出感業椒壁孽多羶况兹大丈夫自許古聖賢百行偶一敗反經欲稱權疇知生死間便見粲與淵吁嗟此貞女儻或繼史編得大人書喜聞秋未自𣪚不刺復回大都賦寄宣彥髙一紙江南到屋扉髙秋漠北奉宮闈金微駐蹕踰唐塞鐵勒鳴弰接漢畿綿蕞行朝因贄玉蹛林望祭類遊衣眀年草賦呈親去想像汾隂扈從歸次韻栁博士五泄山紀逰首路東岡幾屈蟠青天束峽望來慳林多鹿豕山為國瀑有蛟龍海共寰客子杖藜依樹石神仙樓閣幻茅菅吾知此處宜招隱詎減淮南大小山日曉行呼野鶴群山溪五級洗巗氛虹霓射壁從空現霹靂搜潭到地聞桑苧茶鐺遺凍雪偓佺藥杵落晴雲飄然早已同仙術老我曽探嶽瀆文一點剛風削玉蓉仙山肺腑閟重重眼穿上界成官府舌捲西江淂祖宗鷲嶺雞峰渾未到龍湫雁蕩豈多逢年來卧病吾環堵負却詩家九莭笻古越名山最阻修遙空縛下𬗋金虬孫生隱在聞長嘯屈子騷成賦逺逰魚鳥從容還自得龍蛇混雜不同流自今便欲鎸嵓石俗駕能來尚掩羞方景賢回聞吳中水潦甚戲效方子清儂言客來自吳土示我吳儂言吳儂歲苦水謂是太湖翻太湖四萬頃三江下流泄疏瀹久無人􅙹汙與海絶東風一鼓蕩暴雪如頽城屋扉蚌蛤上畦畎魚龍爭嘉種不得入種亦悉爛死民事何所成食天俱在水富豪僅藏蓄官府更急糧貧窶徒囏餒妻子易徙鄉𣪚行向淮壖隨處拾稆粟雖然逺鄉土恐可完骨肉東吳本冨盛數歲偶凋殘世非欲繭絲官曷任乕冠國家自充實財賦有淵藪給復當我及安寧到雞狗何人講平凖何人議河渠荒政固有典水利復有書龍蛇方未驅鴻雁尚在澤縱令可還定何計免溝壑何時水幸退我得刈稻禾水退泥盡出草屫更撈蝦我思告朝廷來歲不可待母庸水爭地便放江達海客今聽我言我欲解儂憂所爭但一水民氣庶今􅪜自從唐季來吳越無兵棫至于宋南徙淮蜀此都會大田連阡陌居苐擬侯王錦衣照車騎玉食溢酒漿居然甲東南遂以侈濟侈掊克自此多凋瘵亦以起天寧不汝恤有此水潦淫要令沃土瘠民得生善心豈惟生善心且用戒掊克采詩觀民風願踵太史職題毗陵承氏家藏古錢我觀泉志頗識錢古今錢品不一傳𩔶山鑄金史靡紀泉府職幣開其前五銖半兩日以變揄莢鵝眼爭相緣重輕子母信有制周郭肉好俱完全吾知聖人利丗用要在百貨得懋遷農夫紅女置不易尺布斗粟儲為淵嗟哉後王弊自此竟使匹庶握利權剪皮鑿鍱偽莫禁執籖障簏慳稱賢國儲何當調度足民食矧是虀鹽先潛交鬼神欲著論臭衒富貴仍開鄽冶卒銅工各鼓鞴偏爐盜鑄多煙烻一朝變通别改幣餘盡沉朽徒埋船承君好古此收拾寶玩有若編埒然大貝南金特嗇厚元圭博壁同瑛鮮漢官受一潔簠簋晉士挂百酣杯棬白水真人笑有讖上清童子猜非仙古錢勿用幸久聚古貨難賣空精甄時能撫摩却穢夢坐與叨濁收饞涎世間萬楮褁可盡床腳一甕踏欲癲試看營室鎖星處何似揚州騎鶴年送宣彥昭北赴亰師去年春風來我巳送子兄今年春風來我復送子行大江多波浪雨雪塞路程老河貫梁椘汴泗割濁清梁山匯為濼荷藕欲抽莖漳流直達海葭菼莽縱橫飲饌去鄉異市逢寒食餳遊從到處闊騎聽上林鶯帝都示四方賔客聚百城白獸耀戟瞂紅鸞擁旗旌乍見須璧馬再談遽公卿終然鳯鵷集恥作蝦蟹并况子昔我學自期可俊英平時撫硯匣盡夜對燈檠古今更成敗舉舌即深評北南幾水陸肆意勿遐征子兄特精幹胸次有甲兵𬒳服抗俠窟躋攀接侯鯖笑披鷹鶻論絛鏇手所擎錯金琵琶槽絃索發竒聲二難苟若此何地不鏗轟貢生彈冠待王粲倒屣迎上書合自衒趣召使衆驚尚期施展間歸作閭巷榮嗟吾久抱疢望子但目瞪因之念吾兒遲子謁國黌吾兒早失學所至類孩嬰幸令淂好友庶免諡愚氓前園川海棠𬗋蔓亂垂瓔起揮雙玉壷暢此孤劒情當知子願欲本不慕肥輕行哉自此逺谷口吾躬耕白鼻騧白鼻騧白鼻騧當軒逈立噴風沙名驥留良定北土蹇􅐒索價猶東家青松縛栁曉安皂紅錦裁韀春映草攴遁心機愛神駿伏波骨力輕衰老去年禁馬無馬騎天下括馬數馬皮浮湛鄉閭萬里足笑傲品秩千金羈幸哉漢武重修政往矣劉聰真覆鏡立防戰備要馬稀藏冨民寰須馬盛向來河隴色為群目極川原亂若雲庶人徒行未足恤出間醇駟何由淂宋景濂鄭仲舒同遊龍湫五泄豫病不能往為賦此知爾能携一短笻寺前突屼㝎何峰九天管籥來飛鶴三島樓臺守蟄龍間欲嘯歌先目往病嫌登陟轉身慵西源山石東源水豈但渠家有赤松諸暨北郭潘莭婦卷後題天地昔立極聖人本有防辟之制洪水瀦蓄以為常不然遽汜溢隨處恣披猖終將大莭撓寢我彛倫傷南州彼何人北郭淂新孀盛年喪所天臨鏡毀舊粧春秋奉饋祀暇乃治蠶桑豈惟育稚幼抑且禮尊嫜尊嫜日巳老稚幼儼成行託孤生當盡從一死則臧乘時或棄背促嫁更衣裳疇悲膏沭容畢命松柏岡世人如輕塵風至即飄揚我身類完玉火烈愈耀光自來菅蒯姿曽不異姬薑母寧窈窕化孝敬著一鄉一鄉尚謂狹千載顧不長吾其撫野草可但感嚴霜起撡膝間瑟彈作雙鳳凰鳳凰不再下寒月照屋梁送鄭浚常北遊亰師浚常浦江人其家自沖素處士綺至今九丗同居人以一家三代稱焉治世日少事朝廷正求賢信哉男兒志觀此萬里天一行夲不易當路即翩翩親朋送糗糒傔從戒舟船自裁適時服年貌逞餘妍起吟俠遊傳賔客務相先功名抗雲表氣槩貫斗躔心馳上谷塞望極黃河壖向來全燕地碣石逺相連只今帝王都閶闔􅌂在前嵯峨廣寒殿嶱􅣈神嶽巔金陂水流雪翠嶼花滿煙楊栁十二街人家競鞦韆騏驥八尺龍官曺耀鞍韉熒煌許霍勢燦爛春嘗權傾身漸風動炙手遽電烻奏書善衒鬻希寵巧攀緣匪文説禮律伊武學兵鋋牛毛豈不多麟角獨爾專屠狗或隱市探驪盍沉淵世方重孝義瓜􅚩况綿延家規既建立門榜復旌蠲族居且百口僮指亦及千迹兹乃政令得不貴貂蟬吾知魯􅚨生文物但炳然美哉萬石君惇檏最可傳須令便繻棄勿直待硯穿歸乘使者傅踏却别時莚嗟豫日以倦一夕三四遷病餘兩足弱無異夔憐蚿治田徒欲疏服賈特肇牽里閭不過此磨滅疇能鎸喻東泉學道止酒自書止酒詩座右戲寄何故欲止酒自吟止酒詞酒何負于人杯杓遽不持我雖不解飲見飲輒喜之何疑酒亂性屏去無醇醨乃言執道要危坐息奔馳行思駕羽輪久矣夢肉芝鳯鸞守爐鼎龍乕擅崛竒狂酲不我毒痛飲非吾師終然彼先酒昔者祀狄儀笑揮金叵羅倒著白接籬常人溺妄境世慮動棼絲爭如醉酩酊淂以混希夷神仙矧多幻狡獪無不為遨逰市舍長調謔酒家姬唱歌便爛熳冠珮任傾欹吾知麻姑過解與陽都期惕哉學仙侣身若稿木枝云胡千瓢量政類斷乳兒歡伯却恨訴麴生亦嗟咨丹室尚恍惚醉鄉終棄遺萬一君上天酒星恐君疑抑且若淂封酒泉併須移竹溪清風處栗里落照時二子豈不飲千秋長若斯栁博士寄詩張如心朱仲山方夀父蓋憫鄉扮之凋瘁而嘆友道之寂寥也借韻和呈憶昔獻賦蓬萊宫蓬萊聖人日月容雖隨賢材集北闕竟與隱逸歸東蒙朝耕暮耘但力穡羮藿飯菽空尸饔俗方同流見踽踽國有𩔶騁聞渢渢遨逰自知喜俠行學業何得親儒宗多年僅守薜荔雨昨夜䆮感梧桐風私嗟泮芹幸可采况𣸪鄉梓宜吾恭齗然秪覺洙泗異巋尓孰謂靈光同略去皮毛馬埒貴賈餘角距雞場雄似公講眀特造理愧我篆刻真雕蟲前修近曽數粵謝大耋逺或傳淮龔典胄終推道德富銘功更許辭章豐惟其草玄志準易肻以乞巧比送窮孫康雪檠敢我廢雷煥星劍須相從當令耆英詎幾在獨不教載繄吾逢千里黃河屹砥柱一聲霹靂鞭群龍韓吉父座上觀漢陽大别山禹柏圗大别名山如伏鼇大别古柏如立猱舊聞夏后手所植直軋南國無蓬蒿洪水曽當洚洞極聖躬乃此胼胝勞乘舟荆衡地可盡作貢雲夢天爭髙一時栽榯託所𩔶千載摩撫繄其遭本根盤拏屹肩屭枝葉挺拔森旌旄礙日吟風聳楚阻欺霜傲雪鏖秦叨夜行夏首影弄月曉艤鄂澨聲吹濤信哉冥靈欲等夀材比杶幹終稱豪屏除椔翳􅍑豹泣鎮斷夔魍蛟龍逃匠石徘徊却喪斧篙工睥睨寧維舠吾知嘉木辨爾雅但惜芳草遺離騷平生環轍苦未到幸此畫筆何從撡豈非神眀護正直使在方漢雄城壕樓桑出墻尚久特臣櫟蔽社猶堅牢惟兹所重有聖德坐見餘物真秋毫自來劉李冨宮室命下荆蜀刮土毛一榮一枯驗世道勿翦勿伐臨江臯穆滿蒼范黃竹詠重華慘淡蒼梧號逖然萬古萬萬古西望嘆息同霑𫀆寄吳正傳日晚天寒攬敝裘西南目盡瀫江流養生有論空成懶招隱無騷却好遊鷹鵠吟風燈照機蛟龍躍雪劒鳴韝平生自笑飛騰暮幸矣心猶與道謀觀莆田劉公掖垣日記後題炎正昔中潰王者遂南服四眀有史氏三世秉國軸人君恩稠疊祖父勢熏熇傾家幾攀附快意即誅戮幸兹遭大變何苦圗起復雖然承天寵淂不覆公餗諌官奏疏上胄子伏闕哭所當終衰絰弗許覲黃屋時惟我劉公草制方儤宿掖垣備日記宸聽煩再瀆相門恆出相耕釣亦可卜國事非家事孝忠同一躅北風吹天地滄海翻嶽瀆浩也議不戰長江境彌蹙彼嵩乃弦張名閫將鹿逐夾攻既通使恢算豈遺鏃指麾及燕晉洗蕩到瀍榖兵威偶小振相業竟難續宴安爾江沱顓擅我姑孰人材遽如此王氣合終籙從來論國是獨不懼國覆蓋棺久自定荆棘忽蔽目望斷八公山功髙九州督回首百年間逺哉遷固録樓彥珍北遊亰師豫病不及往餞歲脫有懷并寄彥昭浚常日晚北風起少年方逺遊徘徊上谷塞眺望黃河流峥嶸十月冰朔色壓九州熒煌大眀殿御道接龍樓時巡向灣水臘雪擁薊丘前驅鸞鳳旗後乘貂鼠裘尚食豐宴飫教坊樂箜篌百官𣪚城邑駝馬盡歸休自今帝王都想爾觀覽周却疑書傳間不謂秦漢優何家非許史無客不抆鄒投輪即雨集揮𬒮遽雲浮東航扶桑隂西笮昆崘陬變化指傾異芻蕘立言收文物彼洛禊土音吾越謳私將竊祿志勇赴隨陽謀隨陽即澤鷹竊祿豈梁鶖美玉獻劍璏精金鏤帣韝出門亟裝束行路肻滯留布韋謾老耋鄉里惟田疇功名幸一遇螻蟻尚公侯學問敢強飾黍稷待鋤耰當令竹帛上直與先逹侔母使螢爝光肅然寸草秋嗟豫久抱疢餞酒弗及芻念尓忽萬里征蘿或見求宣生頗俊逸鄭子復綢􅓎趾髙有捷步胸正無昏眸早看拜家慶共許動宸旒傳車定不礙關鑰便若抽杏花開如錦楊栁滿陌頭去時小兒女來詫真驊騮偶閲昌國志賦得輔怛洛迦山圖甬東東際控東荒蓬萊北界跨石梁天風吹來黑水國海雨灑過青龍洋寶陀山髙此孤絶善財洞近爭巉裂黃金沙土結香雲白玉樹花飄瘴雪扶桑島上接鯷人棋子灣頭望馬秦安期先生脫赤舄羲和女子扶朱輪晨雞鳴聲日觀立老蜃樓臺潮候急釋迦方域舶船通娑竭世家宮殿濕君不見海人稽首扣海磯鮫鼉不動護仙衣𬗋竹旃檀何處所毗陵頻伽獨飛舞送俞觀光學正赴調亰師崑崘東南禹九州山髙海闊峙以流齊秦相襲一分丘梁魏何有真浮漚天邑當中控四陬先生去矣不可留二十起家今白頭獨騎麒麟誦春秋我無糧食無車舟出門笑看雙吳鈎神氣化作青金虬大江有路通淮洲汴河急下蛟黿愁呂梁奔谼壓黃樓故墟荒草項與劉澤蛇臺馬一戰收東連巨野荷花稠泰山鳬澤倚魯鄒北泝衡漳冰凌浮滹沱碣石帶白溝田光荆軻尚夷猶擲蛙屠狗何煩求天門蕩蕩開長楸日暮道逺吾驊騮誰歟遇者多公侯眼中勞苦問所由南土有客非常儔百年文獻尚汝優公車奏櫝幸早投孔姬禮樂正傍搜齊椘辨智虗前籌祖朝肉藿豈異謀庾信詩賦俱雕鎪朔風吹塵織卉裘炕床煤炭手足柔韭虀豆粥却滿甌真珠滴槽酒或篘伐狐燖兔進庶羞妖歌慢舞陳箜􅔃老當益壯在此遊選曺已似執劵酬皂雕一飛即掣韝先生去矣聽我謳悠然獨酌更馬周長安索米母庸憂送宋景濂樓彥珍二生歸里我生本孤陋偶到越江頭如何彼二子直泝越江流子來我欲去子去我仍留留子子不住送子使人愁我且與子酒西風吹子裘問子何所學將通魯春秋聖心久不白聖髓空旁搜聖經但至正賢傳相戈矛晉臣忠如預漢士讖有休彂揮一王法褒絀五等侯經筌未可棄墨守或為讎我今豈謂能子幸與經謀嗟哉我何學半世成倦遊焚膏政自苦奏櫝不見收我迂世所誚我病我難􅪜子何不即逺説我東家丘我寧不及子請子更歸求母徒挺岧嶤亦莫變浮漚山雞伏鵠㲉我尚與此侔勗哉敢不力前路無停騶同陳櫪夀登卧龍山望海亭却觀賈相故宅或云越大夫種墓在山上昨日新雨巳行登卧龍岡征衣忽我薄絶頂極寒涼鑑湖水自涸蓬島屹相望神鴉弄落景海蜃連扶桑前朝尚未逺列甸或稱疆王孫只草緑相府空蓮香髙眀豈有瞰土木竟為殃興衰一以變貴富何能常山靈司霸轍古隧閟兵防毋寧甲楯棲卒使良弓藏哀哉大夫種直不脫劍鋩荒雲但墓穴鳥喙却悲傷功成偶不退苦膽不思嘗炙手既可熱重奎果何光史文幸眀白忠死斯不亡蕭然北風樹為攪鐵石腸脈望天地常育物爾何為蠧魚魚形不在澤蠧我萬卷書于兹亥豕間偶值神仙字咀穿以百餘變化何容易多應直如髮亦或圜中規天星必降氣仰望固不移惟人萬物靈耳目鼻口具曽不如彼蟲政由不學故童年便有習白矣尚難精人書兩無涉物我每相爭誰其希聖賢竟自雜奴虜聖人不汝藥使作聾與瞽太虗但一理元造豈停機竹蜩因雨蛻橘蠧淂風飛神仙非凡人物化乃罔測何哉我瀛蓬獨不插羽翼張郎不解事強欲學神仙醉生且不悟夢死更茫然起看蠧魚瓶眀月秋滿機汝母聽我歌笑倒抱朴子同吳心傳詠龔巖叟小兒髙馬圗北平爰臂久不侯伏波矍鑠空持矛并州小兒十歲許雙足捷走真驊騮金鞍玉勒絲轡絡肉鬣風􅐢雪齗齶郊衢一躍自矜驕血氣未完先躪躒漢皇神武駕英雄西極飛來八尺龍城東鬪雞尓尚可磧外鳴劍吾無功𥘉陽却照長楸道白髮奚官泣枯草悠悠翠蓋與鸞旗老矣驊騮那得知浦陽十景仙華巖雪手倚晨扃一渺漫山神擁出玉巑岏光侵道者柌星室迹破樵家斫藥壇石笋撑空穿宿暝天機織素挂餘寒俄然喚醒西南夢怕作松州徼外看白石湫雲獨上南山最上頭朝隮一點便成湫巖腰動石風𥘉起海眼輸泉雨欲流􅔼蝪含珠光照夜靊霳捲鐵黑沈秋眀當去抉騎龍叟直到扶桑第幾洲龍峰孤塔老眼前頭尺五天真龍角上正攀緣規橅白馬馱經過想像玄鰻護塔眠𣑽唄將回知磬絶神珠欲隕見燈懸何妨宴坐𥘉禪界蠛蠓紛飛即大千寶掌冷泉乍撥山亭木葉堆老僧千歲喝巗開天從白石雲根出地帶青泥雪髓來竹影自深斜映月魚腥不到半凝苔世間夢渴知多少可待金莖露一杯月泉春誦古木叢中息世喧老生力學掩溪門危絃未絶人須聽蠧蕳多忘我欲溫白兔流光分石色蒼龍擁沫驗沙痕從今更浚源頭水莫待投膠與救渾潮溪夜漁昨夜寒潮與此通荒溪尚趂百川東行依桕樹林頭月釣拂蘆花嶼畔風插竹侵沙魚扈短篝燈映草蟹崎空太公逺矣吾將隱赤鯉何書在腹中南江夕照偶出官橋倚落曛詩家觸景謾紛紛彈琴在峽驚聞瀑罨畫為溪喜得雲竹篠晚深樵弛擔莎根秋短牧歸群道旁更有枌榆社欲脫簔衣藉酒醺東嶺秋隂幾點晴雲著樹梢寒山蒼莽類城壕雞豚日落聲相接􅔏鶴風涼勢自高小徑殘榛分嶺脊平疇淨緑帶溪毛朝來雨足多秋意井上無人事桔橰深􅒁江源半繞山根但一窪真源鑿破杳無涯清澄灌或於陵圃窈窕尋猶博望槎積雨衝隄蝸自國微煙羃渚鷺専沙欲行復坐皆雲水只屬騷人與釣家昭陵仙迹一掌嵯峨是玉京連峰欲向鼎湖傾髙張黼座龍隨下靜擁珠軿虎獨行白雪松扉雙立影清風藥井倒吹聲長歌為問西王母却把荷花與送迎雨晴久雨雨不絶長嗟春暮時梨花一片雪楊桞但青枝日出𣪚我步間雲結幽姿山嵐撲小牗澗水激中坻對景且歡樂逢年須􅎮飢蕭條併日食嘆息東門麋救災幸亟救移粟將疇移吏商自有計錢虜渠何私物情正凛凛淫潦乃見欺空甔本汝舊美麥尚今兹我生頗好古當務獨不知母寧坐復起得誦詩與書古人不我待去矣安能追我不識古人陳言果為誰撥書既自笑撫席更深思逖逖千載後此心誰我期盜發亞父塜楚王昔尊楚亞父楚人今發亞父墓南山鑿石下懸棺寶氣燭天知劍處當年奉劍重朣光左右膝走諸侯王劍鋒掃秦柄奪漢梁楚闢作馳兵場起撞玉斗唉豎子戰肉烏鳶骨螻蟻烏江得死不得葬憤膽冤腸終不死東陵老盜曽膾肝丞相摸金仍置官大儒揮椎小儒唱竒寶拔窆蛟龍寒君不見秦皇一死驪山改亞父猶能數千載我今豈識亞父誰鳬雁秋風𣪚銀海劉龍子歌劉龍子龍子出山龍母死一雙赤鯉媵來多玄黿獨戰翻天河山頭種楓髙不淂楓葉落波秋正黑潛遊蟹斷島無人飽啖蝦鬚汊作國巢湖龜眼看欲紅卭都魚頭闢為宫絶磴懸梁但一勺雲綃霧縠餘長風劉龍子龍子為龍猶念母杯江沼海歸何所硯中墨水吾乞汝昨夜蛇醫送飛雨劉仲卿上升歌金華山金華山有古洞天遙問射聲何校尉憶從修煉淂神仙神仙之人夲英傑老弱移家家洞穴乘軿曉結芝草雲擊莭秋飛鶴翎雪溪間白石齒齒嶺畔赤松無枝呼􅎷不逢玉女牧羊乃見小兒嗟洞髙兮高若崖嗟洞深兮深若并中心一念能滅情夾脊雙關遽朝頂七月十五神仙來天樂自響石廪開風伯吹塵萬萬里月光幻出瓊瑶臺玄霜寶露瀉一杯麒麟鳯皇兩徘徊上夀等天地下夀直到耇與台翩然𬒳髮遊蓬萊簷下曝背聽客話吕安撫夏貴雜事老翁曝日坐頭髮亂如絲𩔶言前朝事恍似震業時東南立國久天子重西陲長江一户限巨敵千熊羆吕家好兄弟身擁襄漢危圍深救不至望絶但孤師戈兵空鶴膝部伍尚魚麗居民併習戰結束類鮮卑炮車燒樓櫓斤斧遽已施榷場謾互市軍壘竟登陴夏貴夲小校戎行早驅馳當街苦醉酒袒跣受鞭笞雙瞳夜照路面刺鬪鋒旗積功到大閫綾誥疊若坻沭熏乃淂見感激有涕洟英雄頗用術血死矧敢辭上流忽以潰淮椘屹不枝終同祖約走恨比劉琨雌蕪湖十三萬鉦鼓且棄之人力不至此百年知者誰衛將軍歌聞有得漢衛青玉印者賦之昔聞衛將軍起自衛子夫姊為皇后弟為奴親提漢兵北擊胡旌旗劍戟羅熊貙指麾六郡良家子輸給三邉幕府租血流余吾斷斥候魂駭老上燒穹廬天子召見錫印符鐃歌騎吹凱入都椎牛釃酒啓鞠室饗士論功懸箭箶平陽故侯丈二殳寡主忸怩膝走趨兩兒佩綬光耀軀外虓內煽絶代無荆玉寸方溫且腴古文􅓎篆姓名俱螭尾壓紐巧盤拏楯鼻磨墨急檄書史傳數𥿄丘山如王侯螻蟻但須臾土花苔葉空糢糊何人手曾秉鈞樞何人身巳返隸孥昔貧今富鼠作乕昔富今貧鵠化鳬感時撫舊嘆以吁淮隂鍾室彭越𦵔良弓獈狗諺不誣衛青玉印千載餘珍重漢皇宏逺摹五泄東源有地度可十數畞後負山前則石河如帶幽敻深窈蓋隱居學道者可築室偶賦一詩屬陳彥正越中五泄古名山東源峻嶺空雲間老石崚嶒欲見骨天河瀉破莓苔灣蛟龍縮身似􅔼蝪魑魅出沒司神姦雷公一聲忽下擊鳥迹不到猶重關青華仙真舊治所碧落侍從登清班穴疑綵狻據一柱户想銅獸㗸雙鐶鳳馭鸞鞭白羽瓘芝樓菌閣朱莖殷梯梁未絶或可值洞府寖逺多愁顔嚮曽褰衣淂揭涉别擬鑿徑通茅菅寬弘頗占十數畞敻靜粗覺非人寰澗流帶綰玉繚繞巒翠髻擁花斕斒截斷塵埃與世隔構成棟宇寧吾慳陳君尋常有道力况此跬步臨幽潺虗室光眀白不動寶爐溫養丹將還丈夫出處我巳定馳字早寄孤飛鷴休拘崑崙併漲海遇有勝處同躋攀樓光逺家觀宋綏景德鹵簿圗東朝盛文物四海極豐富粉飾郊祀間馳驅漢唐舊奉常夙有掌鹵簿列前後車軨麾飛黃戟盾服錯繡啓胠龍乕動扈衛鴛鷺簉嵯峨屹丘嶽灼爚羅星宿陳兵吉利隊擇馬騊駼廄嚴須呵人神喜欲􅫉百獸祖宗所繼承宇宙遍包覆上公敬執籩天子親獻酎靈光旍旗林縟典禮樂囿威儀一以慗瑣碎無不究時惟正垂拱國幸息戰鬪玉䇿恐人聞帛書疑鬼授紛紜務欺阿制作窮刻鏤老幼咸駿奔穹示揔歆臭中誠乃根夲外貌特膚腠封寧重䃭繩饗或貴型餾居安昧危機致治啓亂竇文華終耗財武弱益招寇雖然喧一朝孰淂燕末胄五輅忽巳沒三亰杳難救惜其𥘉討論盍不返朴陋臨風披此圗歎息我臣綬雙林寺觀傅大士頂相舍利及耕具故物古稠大山趍古原古寺突兀倚山根小溪前流未及渡白塔岋起髙蹲蹲傅公故宅奉香火厦屋萬間周四垣梁朝到今數百載兜率説法天中尊世曾出世役妻子家或漁扈隨犂犍道冠儒履忽一變胡膜𣑽唄爭駿奔蕭衍老公坐玉殿捨身建剎開祇園花幡亂飛欲滿席拍板歌唱聞槌門雲光靈異竟何有仉䁈怪神寧復言藕絲袈裟上所賜竒錦照耀扶桑暾龍宮四萬八千卷寶藏一轉百鬼掀貝多遺文白㲲像經律論疏洪其源黃羅繡褥褁頂骨舍利五色摩尼燉一牛眠雲巳化石雙鶴覆雨仍軒鶱劫風吹地日漸壞樓閣樹林無半存青檮並聳碧宇上落葉𣪚到人家村浮屠仁祠始自漢文罽華蓋何翻翻梁時佞佛特太甚宗祀斷血徒饔飱父兄子弟且學佛絶滅恩愛生讎冤臺城矗天或死守虜騎乘釁真遊魂幸災樂禍却圜視入室操戈攻嚙吞蠟鵝厭埋冡難逺烏幔囚辱兵氛昏人天小果豈不有宇宙缺疇能藩一朝佛出救不淂滄海攪作黃河渾傅公家居自天屬時復耕耨不憚煩朝廷聰眀顧不及塔廟湧出如雲屯長干空迎佛爪髮滿國欲飽民膏腱群僧無功併仰食我佛獨不憂黎元惜哉後王永不窹前後喪亂同一轅後民皈嚮復未巳拱手禮跪駢肩跟呪口波瀾豈祝蟒禪心寂默猶拘猿終然百欺幾一遇世俗瑣瑣吾何論題方景賢護法寺壁枯木竹石山從昆崘西北來北經黃河積石到碣石南亘青城峨嵋萬里壓南嶽天台南嶽山頭夜見日天台絶頂下視東海如一杯仙奕壇開纎篁掃雨嫋嫋碧神丹䁀冷老檜拔出號風叱雷􅈬中一片頑皮凍骨老石塊勢若千百歲後突兀偃蹇角起相磓山人前身夲在南嶽祝融峰下住踏上天台石橋看瀑布東峰月上學寫影山精野魅哀號涕泣愛惜枯樹白道猷拄杖拄開蛇口起不淂蛟子龍孫盤旋紏結塞滿行路硯泓一滴淡墨水漲作玄雲黑雨歸無處槎槎牙牙蒙蒙茸茸蜻蜓翼薄但如縠螳蜋臂硬欲張弓盤根錯節蝕倒千尋樗櫟粗枝大葉蔽殺三尺蒿蓬崑崘山前回龍顧祖有此勝絶景覩史天上天光照著下土境界缺缺齾齾不辨西東東海老仙笑上面桑田海水海水桑田翻翻覆覆眼曽親見秦皇漢武修宮廣室盡寫巴蜀材大如梁柱小似薪槱何嘗識遍帝令混沌七日死天下盲聾見草恱見豺戰未問神龍有力時飛入長安城中載宮殿金華山遊雙龍冰壷二洞欲往朝真洞晚不可到金華三十六洞天髙崖臣壑多風煙老石斗甕寒鳴泉蠻花鐵樹森戈鋋鳥獸絶迹鬼魅􅗻清􅖨􅌄窱巢神仙虗泓囓趾蟇頥然怪鑿霩落闢屋櫋􅋽飊倒鞴吸欲穿凍乳冰髓傴􅈬船熒光爥冥竹炬㸐積蘚躂屩跣却䟒危棟結宇深扃鍵曲房密閣極邃延囷倉斂穧列町𤲬椸架韣捲冠裳懸鐘欒鼓簴屹不遷􅊮霞寶蓋爛瑛鮮蜚幢舞莭恍後前乖龍夭矯角鬛全穹龜絡蛇白以玄狻頭象腳伏㺦猭蟾蜍蝕月囚重潫霙霜霰雪凝真鉛靈溪流潺截中邊祕穴漆黑局背肩神閽峻拒亟我旋暗井瞰腹抱豁圎仰竅斷繘矚或顛妖蛟産假卯滑吐涎冰簾灑空萬琲聮馮夷海國瀦為淵窺覘欲下手足拳悔懼咋舌恐有愆谽其奧室别據巔蔦蘿藤蔓亂紏纏蝙蝠翅股挂復翾蜥蝪弄雹窟宅􅌹𣑽質蕃飾垂蹁蹮寶纓珠珞窮雕鎸精英象物淂氣先上踞下伏總一甄齾磴陟絶愁攀緣嗟豫學道苦未堅起搴昌陽望延年乾堪坤輿自方寰稟生受有吾拘攣羽毛鱗分正或偏飛潛動植過百千宮居竈食類蟻蝝酸醎淡澀朽臭羶揭鑑照面益削朘運劍剖腹猛滌湔貪嬴嗇厚務死權息黥輔劓吁誰賢我疑神仙住渺綿黃庭鬱璘內景烻芙蓉城闕麒麟軿蓬萊樓閣魚龍鞭服閭賣瓜俗骨痊道華啖棗彭仇捐白河照耀踏斗躔滄海攪碎觀桑田盍獨閟此使世癲我卜我筮還筳篿喝開二洞薄八埏翩然直駕鶴與鳶景陽宫登𥘉陽臺謁抱朴子墓人生擾擾間頗覺天地窄我憶抱朴子髙臺睨空碧𥘉陽出山上照破萬古石丹光動鼎鐺霧氣浮冠舄遺書上下卷道妙或黃白老衰及病瘦􅉝苦為形役豈伊鳯鸞姿終以狐兔宅尸解本無形肉飛寧復迹鄭君曽有傳勾漏恍所𩔶降子倘可問稚川特未隔幽林來魍魎缺井守蜥蝪神仙果何人海兵長戲劇世傳老聃死吾謂方朔謫虛墳誰所為怪樹獨悲激滿前湖與山秋色落几席因兹些尓魂目送雲邊翮大佛寺問秦皇繫纜石手撫一片石昔為滄海滣始皇或繫纜萬里浩無津世間本妖妄何處有仙真蓬萊不可到弱水空飊輪徐生忽以去方士先避秦童男繼童女五榖雜貨珍島嶼止不返蛟龍化其民非惟長年藥永隔戰馬塵人君却未悟望匕轉東巡山鬼覺將死海魚祠作神侯生奉圗籙譏諌極所陳驪山閟鳬鷹金槨竟沈淪惜兹鑒不逺遺迹留千春經營大屋覆刻斫青蓮身漢唐幾英主覆轍猶尓遵我恐石有語神仙多誤人湖北岸小寺問參寥泉古寺湖水上寺門但菰蒲一泉湛如玉巖骨旱不枯粵從參寥鑿淂與蓋壤俱東坡或茗宴西嶺猶松竽人誰問詩侣世頗笑酪奴瓦甃縱然在木瓢知巳無汲古宜汲深塵心非轆轤别禪勝别味俗舌空醍醐老僧久不識香灺冷宿盂卓哉郡太守遺像擁肩鬚間來試我酌霧雨變須臾尚持金芙蓉便踏赤鯶魚戒珠寺後登蕺山謁王右軍遺像小立天地窄前登萬山阻越王采蕺處秋緑空榛莽古祠復何人遺像寄𣑽宇栁老題扇橋荷香弄鵝浦典午當衰亂神州渺淮楚經略欲馳兵保障期按堵姦溫多大志誕浩却浪許護軍曽參綜箋疏極心膂廟謀不可勝野戰徒爭武內外未協和英雄豈豪舉泗口聊進屯譙城遽奔沮事勢日趨異朝廷孰撑拄去官寧忤違誓墓獨酸苦父子但法書功勳總塵土青緗每收拾綵筆餘圗譜草隸俱入妙雲龍競掀舞崔蔡須抗行羊殷特奴虜一鷖或有識野鶩紛難數平生破布被謾以指畫肚起扣故墨池長鯤戰風雨射的山龍瑞宮問陽眀洞天洞蓋是禹穴意行得古洞忽到陽眀天人傳是禹穴愧我匪史遷上摩青冥出湧作美蓉巔下開巨石窟鬱以藤蘿纏自昔乘四載于兹理百川嶽瀆通脈絡蛟螭𬒳拘攣真長或可待宛委空風煙衣冠竟一窆簡札猶遺編世間後百世龍鬼巧相挻安能洗滌盡却見鴻荒前惜哉不可及恐此復偶然黃庭或祕景絳府尚靈仙精英倚怪木狡獪戲神泉無論鳳文舄肻降狐鳥莚長嘯望天末白雲年復年次韻胡仲申雲門紀行會稽多名山乘興我欲去忽携一日糧便踏青蘿路前峰如鴻鶱後嶺類鵠舉吾知杖藜間肻負鞋襪句有湖但一曲天影餘秋宇有涇曽載樵石齒亂蜂午紺花吹淡香琪樹動幽慕何哉廓落洞得不精靈聚長吟空人我曠視渺今古候神軒轅久藏蕳宛委暮老簷雲倚龍丹甃雪凝乳詩亭了如𥘉茟塜將化土間挑苔窟泉靜爇柏爐霧荒涼相劒客錯寞賣扇姥紛其塵迹改恍爾煙霏護起追千載懷髙縱太遐步私嗟勾踐世保國深且阻膽薪苦或嘗犀練勇如赴復疑始皇時刻頌岑絶處鮑臭尚求仙蛇妖徒泣嫗沉埋九寶鼎笑傲兩芒屨交豫支道林侣我許玄度興亡鳥呼風富貴鬼嘯雨穢墟幸有遭盤谷誰爭所行從篔簹徑坐泊菡蓞浦白鶴杳未攀𬗋騮驕可伍搜竒本自茲濟勝吾巳屢秦崦或西枝郢江猶北渚鏡虗忘往來輪轉繫成住平生幾心期終夜真夢語桂榛方招隱芝蕊不藥痼身尤出處難地以窮通悟一目須見羅四鍭竟如樹推材宜鄉里選德固庠序修名實之賓慎動靜有主人思佛可佞我謂儒非腐山嶽何屹然事功急先務執輿且周流沮溺却問渡信兹我孔孟直不老鄒魯逺遊吾爾俱滄海極東泝韓蘄王花園老卒歌蘄王手種紅錦花十載不挂鐵錏煆花園老卒守花樹睡著花磚聞曙鴉白頭白盡身無事古塞沙塵戰餘騎多士如雲足健兒一竒在腹終憔悴青銅萬緡滿地光寶函矯節賜夷王宮粧粉豔去酣酒海貨珠賝歸壓檣王家舍兒驚吐舌御府珊瑚碎飛雪口猶乳臭却帳前矍鑠一翁嗟棄捐君不見天下英雄本奴虜左鼻成龍右鼻虎頸血淋漓思釁鼓史傳沉埋誰比數花落花開幾風雨觀姚文公集記趙江漢舊事江左一丸國北兵臨鄂城鄂城小不敵圍塹泣孤􅑱趙公本儒士皓首困欃槍老身念未死勢肯舉降旌坐隨清野民虜入驃騎營凄其盡忠義憤使釁鼓鉦長揖上堂階五弦偶鏗鍧黃鬚何鮮卑指下尚正聲中原真有人大將世豪英幕府喜致汝軍師豈徒驚終然類脫兔夜即葬修鯨兩目嗔欲裂汨羅我同貞和門遽出令邏卒復縱橫扶持返舊路慰勞賜冠纓古今多分潰光嶽極戰爭干戈自有責黼􅒐合祼亰演疇庶不憚經瀆孰重輕從知道在巳詎用死易生汴土久不守金源遂交撑紛紛戎馬間務以儒術鳴遺經益南徙義理却後瞪繁章僅北往禮樂要抗衡平陽賣瓜叟立教繪國􅓺詩書得箋疏江漢卑律程當時乃世運何士非我楨楚材仍與晉漢學特逃嬴藏劍或徴氣鼓筐須播精熒煌一工事卓犖千載成陸機但辨語庾信空哀情我且用我法吁嗟我仁卿病動牽掎蜚揚恨不鳥兩翅跐蹈恨不百足豸浮湛里閈曷時巳顧瞻形骸吁可鄙我披我書我欲禠思為穆滿執鞭弭泰山滄海步我跬歲月邁矣我搏髀遊俠者非仙者是流蕩忘返獨不耻長笻化龍機化麂芝草琅玕森茷靃我來丹臺述仙史泛觀八極從此始滿天白月無塵滓題畫墨梅北風吹倒人古木化為鐵一花天下春萬里江南雪題趙大年林塘秋晚圖老景青黃茟砥收晴鳬冷鴈共汀洲王孫畫學空花竹不到銅駝陌上秋淵穎吳先生集卷之三
