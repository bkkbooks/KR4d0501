front:
  text: 淵穎吳先生集卷之十門人金華宋濂編
  hash: sha256:177b6555e51e35484f800cf5c031f81551815c20f785982901c79684d0cdb13d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_010-1a}
body:
  text: 讀唐太宗帝範初唐太宗帝範一卷十有二萹太宗嘗手撰以教太子五代喪亂書有録而遂闕暨今上征雲南𤏡夷始出以獻而舊十有二萹復完豫聞古今欲治之主不丗出嘗必立為治天下之法使其後嗣子孫有以丗守之而不敢失墜不幸而一旦昏庸懦弱之君或繼其後亦得有所扶持馮藉不至於甚亂而僅存此雖三代聖人制基垂統立經陳紀而務欲㝎為法度典章者然亦不過數傳則巳自棄其先祖之訓蹙國敗家接踵而有夏之太康商之帝甲武乙周之幽厲宜若無異于漢唐之季丗然猶幸賴其法度典章之炳然播于宗廟布在有司賢聖之君復有赫然而振起者有此具也自是以來漢承秦亂而髙祖立漢家之法唐受陏亂而太宗設唐室之制嗚呼漢法逺矣蓋惟唐制傳之未久而天下多事夷狄侵凌藩鎮跋扈盜賊相挺而起莫之能救此其故何哉當陏氏大壞太宗始鋭然盡舉天下于盜手即議立國法粉飾朝章誠欲創其基業於前而特垂其統緒於後使後嗣子孫得以繼續而行且將有恃於此而不害于無所守者是故職官之任㝎以常貟師徒之備設以府衛用以授田則口分丗業之法均度以斂財役民則田租身庸户調之制不紊自古者聖賢之道不作而一切霸強苟簡之術用太宗乃能慨然庶幾乎先王仁義之意而務成貞觀二十餘年治平之功自漢以來可謂古今欲治不丗出之主矣然而太宗每知太子之仁孝慈懦恐不足以任國而僅述古昔聖賢之遺訓帝王之常法強而教之謂為帝範及至太子即位曾不幾時內則惑於嬖后外則斥逐賢相則夫天下國家紛紜變故之迭至曽不可以思患而預防者卒至于易妵改號殺僇宗姓而後巳然猶幸其有所扶持馮藉且不至於盡亂而僅存者賴有法也惜乎當時太宗立法之際身教則從言教則訟每求其所以致然者自其法度典章之中或不能自免其瑕釁間隙之可議書有之曰丕顯哉文王謨丕承哉武王烈佑啓我後人咸以正罔缺太宗之為治無乃文謨武烈一夲於正又能無缺者豈或猶有可憾者耶何則太宗親㝎宇內蓋因陏氏髙麗喪師之後而得之自其即位北滅突厥薛延陀西制髙昌徙其種人編置沿邉州郡而蕩然無有蕃漢內外之防及其晚年又且東征髙麗瀕死而弗巳是雖髙宗之慈懦猶襲其故深異乎漢孝元之議罷珠崖者降及數丗而眀皇繼之君臣宴安邉隙數動至竭天下之兵委之西北付以藩臣中國空虗大盜承之而遽起由是天下多故藩鎮槃錯奚契丹深入河北吐蕃回鶻連陷秦隴震驚都邑師徒撓敗土境日蹙而唐室之號令所及曽不出淮浙巴廣數十郡地而遂巳聀官之任師徒之備授田之法斂財役民之制大抵悉改於其舊此豈非當丗邉境用兵之或過遂致蔓延於中國而不少熄哉然以唐之子孫昏庸懦弱或危或微不絶若線是雖太宗之法守之有未盡替得以扶持馮藉不至於甚亂而僅存誠求其所以致是亦由太宗平日貪勝好名之過瑕釁間隙實有以先開其源而漸熾其禍是則太宗前者包括四海指麾群夷適足以為當今屈己和親敗軍郤境之效不可救巳夫然故唐之一代天下之致治莫如太宗天下之致亂亦或自於太宗而後丗議者不之覺也嗚呼豫觀太宗之志嘗欲法三代欲行周禮遂絀封德彛之説而専用魏徴之仁義貞觀之治夫豈近丗所可遽及使其當時立法之際而其身之所行者一本於正無復可議則雖三代聖人創基垂統立經陳紀之道何異於是然而太宗終以不能企及者是亦貪勝好名之一過也詎不信夫詰玉霛辭豫少嘗有四方志既長而益病且惜其志之或不我遂也於是假爾泰龜用以卜其出處行藏之決者而玉霛無所徵雖然古之龜書則久而不傳於丗矣作詰玉霛辭豫昔日之有事兮曽端䇿乎元龜虔揭我以吉繇兮曰逺行之不疑志因循而弗立兮年偃蹇以失時祗自奮而復蹶兮豈玉霛之獨吾欺惟玉霛之神聖兮諒天道之秉為練時日之臧否兮佩國家之安危何嘉林之飬夀兮撫芳苓以敖嬉遽清江之授莭兮竟豫且之見羈將霛繹其果獵兮爰視髙乎卜師矧梁米及夫稊黃兮幸鑽焌而無遺真古今之至寶兮章之不鼓汝譽兮抑智慮之不渴汝精信乎不內而務外兮故卒與俗而咸諡為氓自玉霛之有言兮庸一泯於至默雖吹菙而我瀆兮恐告猶而弗食孰方功而義弓兮孰體色而墨坼楚霛投詬而終不汝卑兮關朗豫占而任德兹一息之尚存兮幸五官之識職諒用舍之無與於己兮庶藏修之是力奈自治之不勇兮敢罔稼而欲穡毋謂龜策之不能以知事兮極神霛之不可測竄宜楙辭豫自一二年來病既久而日以嗜睡睡又多夢或謂豫古有善睡者其神名曰宜楙盍竄之乎豫每怪夫病之亟矣惟睡為能少息夫病也然而晝之所思夜夢見之紛拏膠擾不遑少止是則甚非學道者之所宜有也作竄宜楙辭伊我生之多病兮乃獨處而向隅爰有托于假寐兮僅身心之舒愈幸丗紛之刋落兮寄吾夢之宴如等百年為一指兮謂八極其蘧廬昔宰豫之在聖門兮曽譏斥其不可雕杇何警戒之遽忌兮恐宴安之或踰豈宜楙之每為我祟兮竟淫荒昏其逃誅豫誠與汝而並丗兮敢自陷于非夫惟枯瘠之若兹兮卒戰兢而自勵凛形骸之欽肅兮召魂魄之迷潰竦志矛而汝擊兮充氣楯以為衛抗稿梧之不復瞑兮麾狂藥而弗嚌拔妄華之根撥兮敜邪壘之譏誡尸蟲穢雜而不黨兮病竪纒綿而何瘵歘天地之一清兮赫聖賢之吾對湛霛扄之寂然兮藴妙賾之無外精思慮其若一兮致事為之弗閡信兹魔之釁逐以不返兮吾益見其通明而罔害嗟早歲之我痼兮奈平居之鮮歡固精神之耗蝕兮漸榮衛之疲殘迄旦為之見梏兮徒夜寢之能胖曷卑我以窅嗼兮思濟身之艱難當日用之不遑少息兮紛俗變之相干顧嗒然而欲一隱其几兮懼純素之弗完文儒或弛其名譽兮劍士􅐛喪其怒瞋尚喧豗拏攫之盡去兮寧呻吟啽囈而增昏信默默而時化兮直綿綿而道存吾何負而我逺兮雖自訟其奚殫彼隂陽之交會兮特感變之所起宜正噩之有占兮實祲輝之相倚緬古莽之睡矇兮復阜落之跳䚦豈幻化之往來兮孰夢覺之非是歘吹爇乎死灰兮恍撓淆於止水雖形接而謂夫皮膚兮竟神通于骨髓何今魚而昔烏兮且我蝶而彼蟻方雲霧之倐為飛滅兮又雷霆之鳴燬貧何患而或盈倉庾兮賤何辱而遽躋朱𬗋信苦樂之相乘兮罔動靜之可弭謂靜㝎之可以自勝兮卒勦勞而弗巳誠道真之不至兮故徒與丗妄而同軌目我病而益病兮匪宜楙其誰尤肆操存而不舍兮收視聽而與謀儼聰眀之不我壅蔽兮愈泮奐而優遊要虗懵之盡黜兮俾災孽之日瘳惟真人之無夢兮在一默而何求縱我夢之或可少徴兮吾又何得乎黃帝與孔丘盻晴窗而笑傲兮彂蠹簡以歌謳願宜楙之一竄以不復兮用稽首于玄都葛天氏牛尾八闋樂歌辭古者葛天氏之丗丗道治矣而人民康乂樂是用作始教人操牛尾投足而歌之是亦天地之間自然之至音也然而樂辭不傳後有博古閎覽者惜古樂之日閟不顯託而輔其辭凡八章載民一於赫皓穹降厥生民生民如何群物與淪俗無上下親孰父子爾騃爾狉孰綱孰紀泊乎無名淡乎無聲天地無作聖人化成我民自化帝不汝淂是曰載民我民之則玄鳥二玄鳥來矣我民其興氣以陽彂質以隂凝玄鳥歸矣我民曰息靜安其􅒏動職是聀爾居爾巢禽獸蟲蛇爾食爾火蚌蛤果蓏我利我養相時制宜匪政匪教尚安所施遂草木三邈矣上古元氣肇萌彼浮斯茇庶草彚生孰闢我區孰豐尓茁樏山砅川􅠡皮採實火無爁炎水無浩洋狡蟲斯伏鷙鳥弗翔允哉樂兹草木蕃廡嗟吾何思維聖之琽舊五榖四孟春正月我出于田矧我勞勩愳我瘠捐揉木耒之剡鐡耜之天雨澮之時風耔之維糜維芭維稻維粱弗尓穢莠亦弗災蝗五榖告熟民人率育育焉熟焉自古有年敬天常五太元伊始風氣日開天有常道生養死埋犬雞巷中麻麥畒首貨財既來什器孔有卧則呿呿食則吁吁飢則求食飽則棄餘於乎不顯孰不念聽日監在兹奈何不敬建帝功六昔在秦皇君臣道生君有五期輔有三名上昭天光鳥獸文章下協地符龜馬圖書一人在位萬邦順軌無幽弗爥無險弗砥黎獻共臣蚑蠕畢從匪帝之功伊誰之功依地德七我望兩海中有昆崘天霛𬒳迹乾曜合元孰來蜚龍孰度七囿人禽並擾庶品蕃育乾以易知坤以簡能甲曆既正機矩迭乘帝豫何言天地之德我民之依俾民弗忒總萬物之極自有聖人我革鴻荒何毛何血曷辨弗裳維聖人富維聖人夀聖人之厚萬物之阜熙熙乎和皥皡乎大道有自然德無疆界爰命樂師投足握氂欽兹念哉天下攸歸右葛天氏八闋樂歌辭凡八章蓋豫嘗讀吕氏春秋頗載葛天氏之樂名而不聞其樂辭豫故夲其樂名特輔其缺樂則古矣樂辭今也古今之樂殆不可以遽同者也然今之天下猶古之天下是雖邈乎逺在數千百載之下何獨不如葛天氏之丗乎古之説者每稱上古之丗代曆紀者尚矣自皇雄以來伯牛受禪迄于葛天氏十有餘傳歷年之久近都邑之建徙要皆不能以必得其實者况其樂哉然以古之王者道合乎上德依乎下恬淡而神明內顯恭默而政教四達煦焉而春彂凛焉而秋肅隂陽之氣畜積而舒布民物之俗優遊而康樂由是天地自然之音出之於口而成歌天地自然之莭動之於手足而成舞舞必三人歌必八闋操之必以牛尾播之必及於帝功民事吾知其莭八音行八風屈伸綴兆俯仰參錯而具有其容矣吾又知其沐浴膏澤歌詠勤苦聲文音律安徐和緩而務合乎法矣皇雄之琴女媧之笙朱襄之瑟伊耆之籥前後相耀彼此相襲是蓋近而英咸韶濩逺而巾拂鞞鐸之所自出者也近古以降大樂官失聀古樂日廢然而五音七音六律六十律四清聲八十四正調之法度猶有賴乎西域龜兹之所傳唐末五代之亂又從而殘缺不備訛謬失莭至使蜀一黥卒而欲立一代之樂府鎔金鏤石崇牙列簴足以極衆工之選雖若名儒巨子學不聞古樂無其師竟無有一舉口議其可否而請以更張者於是古之所以吟咏其􅒏情動蕩其血脈消融其查滓者無復可見而淫藝邪僻驕慢輕剽之風日競月增靦不之恤子女􅚽擾舉聲號器杯盤狼籍頓足跳踊則巳雜出于鄉邦聚會賔客宴飯之間矣鳴呼古今之樂其信不可以遽同者耶此豫重有取乎葛天氏之樂名而特輔其樂辭者也後有聞者得而歌之且將惕然有感于古樂之不作矣又何愧乎樂辭之今也哉然以黃帝以下六代之樂與夫成周之九夏唐元結皮日休乃得而盡輔其缺鼚乎鼓之軒乎舞之或者當百王之末造而猶可以得返太古之遺聲乎嗚呼逺矣豫是以特録其辭而又論之尚庶幾乎大樂官之採擇嚴陵馬君仲珍父誄辭維元統二年月日嚴陵馬君仲珍父卒家凡歷六期始克葬于新亭里先人墓側我二三子追慜其遺行之不昭於時乃作兹誄用相其哀詳曰於歎馬君厥妵維嬴是曰造父別封趙城趙之既王奢也善兵爰邑焉服開國秩卿丗降炎劉北州籍名援介戚里融振儒聲逖焉巨唐重績治經孰揚天朝燧握莭旌信兹苗㣧何代弗榮播尓宗譜百丗一程故汴之遷視杭作京靖念尓祖策科騰英􅏡歷州縣執持憲刑鴻蹌鳯翥五潔氷清徑躋法從領袖明廷端紳搢挺實棟國傾維言維行流風盛行曰孫曰子夥有簮纓丗祿日逺家氊相承如何君子異我編氓維君自幼鍾厥豐偉長而好學耽玩書史昭兹六經卓有根柢老􅚨後先搜擲章指孰王非綱孰聖弗髓彂揮義殊談論蜂起恣觀百家􅍱獵衆技􅚨墨交橶德刑迭燬鴻荒迄今王霸臧否薄海內外華戎遐邇孰詩孰賦鏗合宮徴或玄或竺彪别邪詖我常謂多君謂道咫泓涵浸潤岋峢崺君不自能蔚為秀士立辭摛藻聞者風靡自君既壯聿有時譽矧學之谹弗據要路緬尓祖德敢懵我故熾尓學業肻墮我素名埸大開百郡充賦匪閩伊楚矜􅋏奔騖彼晳此黧揮霍吞吐聚焉風雨散若雲霧孰玉弗雕孰金弗鑄匠般何人文梓弗遇唶哉數竒得此遲暮誰非退鷁誓不脫兔我擔我簦爰告我渡我吏其􅚨律我章句彼賢非賢孰妬弗嫮菰城甫里雪浪煙樹人皆􅚨顯我獨􅚨誤君何不淑復奪君遽豈無文學尚寐無寤千載一朝卑彼丘墓伊昔大化乃形尓身既具四體孰儲尓神何言何默既笑既顰何冠何履𬒳服褼褼孰贏尓學使尓有聞孰嗇尓仕忍不少延維其生之夭閼弗完豈如無生窅漢自然我問元宰孰司其權紛綸變易渺是天淵愚蒙者夀智勇則顛卑汚者寵藻麗弗宣顏駟蹇剝至老乃遷劉晝擯斥厥有詆言言念君子過彼二賢嗟嗟奄迫命不可攀蓋豫羈丱曽奉顏色爰受君詩僅識繩墨君不鄙夷忘我年德我心尓諧略我儀飾我來自東我病殊極君苦我留撫兹祍席陳薦酒肴翻倒琴策一年一集歌咏忘食云何遽離久不我即我邸于西遇君逼側大江作潮我溝我洫鸒鳩搶地我覆我翼曽是兹秋嘉莭是逼奈以賞心強欲登陟滿天隂雨𬒳簑著屐故交何有獨不遑息剨然長嘯嵓谷罔覿慘悽中人展轉病極君生窮窶君死豪特新亭之里痛此窀穸我今誄兹玄石弗泐嗚呼珍父是用哀惻春秋胡傳輔説序春秋之學自近丗夲河南程氏程氏曾有春秋傳序而傳未完武夷胡公安國蓋又特出于程門之後而私淑艾之故今胡傳多與程説相為出入吾固知胡氏之傳春秋夲程氏學也然而隱桓之際訓釋頗詳襄昭以降遺漏甚衆又况光堯南渡而胡氏以經筵進講至於王業偏安父讎未報則猶或未免乎矯枉而過正也宗人正傳間者嘗讀胡傳乃因傳説之未備從而輔之此仍有益于學者曩余嘗論春秋之大凡欲以彂明胡傳之一二而正傳先之故敢私序其説于正傳所論次之後曰夫春秋者魯史爾自魯史而為春秋則春秋乃史外傳心之要典而特為聖人命德討罪之書矣然自唐虞以來典禮教化有人心感彂之妙爵賞刑罰有政事勸懲之嚴伯夷之降典播刑臯陶之明刑弼教何莫而非此道也惜乎春秋之丗文武周公之舊典禮經曽不復赫然振起于天下而天下公侯五等之國亦莫能考禮正刑一德以尊事天子惟吾聖人蓋有聰明睿知之德而無其位于是獨持其命德討罪之筆而欲以定天下之邪正也吾賞焉而賞非私與邪也吾罰焉而罰非私怒此其陽舒隂慘舉直錯枉之間先後有倫衆體有要是謂經制持循凖的不容少紊人情之輕重不同丗故之治亂亦異是謂權義洊移前却必得其宜要之堯舜文武之治未墜於地而吾聖人所以務盡其祖述憲章之道者至矣實聖人時中之大法也夫然故春秋聖人之法書丗之學者猶議法之吏惟其知聖人之道揆而宅心忠恕然後可以通聖人之法守而立説坦夷雖然學者徒以其一曲支離淺中狹量之資求之未易以及此也或曰春秋新王聖人因之粉飾太平而多褒至治之丗曽無姦暴之俗而惟以德化者也或曰春秋衰丗聖人且以為舉國不可勝誅而多貶始亂之俗雖以微小之罪而必舉其法者也是故舒之而遂縱者陵遲廢弛無法而益亂操之而愈亟者煩苛刻戾淂不至於秦人恃法而寖濫乎嗚呼二或之論誠非所以識吾聖人時中體道之大權者矣又將何以窮經而致用哉自王安石以丞相説經春秋乃廢詆不用丗之學者往往多自為説至於意有穿鑿巧為傅會分裂聖人大體乖異先儒成説漫有精義至當之論一説之外不知其復有一説也蓋惟程氏為能通乎制事之權衡揆道之模範又無完書丗之盛行胡傳而巳胡傳夲乎程氏之學程氏之學又信乎聖人時中之大法也然而猶有所未備者焉今也正傳乃從而輔之誠是也正傳其真議法之吏哉雖然前王之律昭然甚明後王之令紛然雜出宏綱大指既無其統微辭碎義蓋浩乎多若參商矛循之不相合者吾益懼焉卒以待吾正傳而後定也昔季氏使陽膚為士師問於曽子曽子曰上失其道民散久矣如得其情則哀矜而勿喜善哉言乎學者又當自是而求之此其必有合於春秋者矣吳氏戰國策正誤序戰國策十有一卷凡言周秦六國宋衛中山之事古有髙誘注最為疏略近丗縉雲鮑彪乃復分拆章數竄易字文悉令可讀而不致有噤口敝舌之虞雖然古意䆮巳失矣要之古今之字義曽不一同南北之方言或隨以異而彪欲以後丗窮鄉曲學而盡通之吾知其必至於穿鑿粉飾而強其所不可通則反不若誘之疏略也宗人正傳嗜古書嘗以國策之多誤暇日則取太史公史記及戰國諸子所自著書前後比較既又考夫近丗劉攽錢藻姚宏等本參伍錯求然後有以見其語言之殊異傳寫之缺訛而是正之蓋頗貴乎誘之近古而深惜乎彪之妄作也於是丗之讀國策者文從字順不失其真戰國君臣從橫遊説之事併可得而極論矣蓋夫古者先王之丗道德同教化行而風俗一士之有賢材學業者修之于身著于其國或以德舉或以言􅏡要皆可以考名核實而趍事赴功無或敢為熒惑變亂而懵乎是非黑白之混淆也然而聖人當夫天下極治之丗每有慮焉蓋曰朕堲讒説殄行震驚朕師豈不以丗之讒人傷絶善人之事震駭衆人之聽邪僻自此焉而進用矯偽自此焉而假託出入起居彂號施令將無所往而不盩于道苟謂丗為極治而慮不及此吾恐其漸為始亂之基矣是故聖人深以讒邪之説有未易化而且有以教之必使其遷善改過而後承之庸之否則威之夫然後士之有德有言者各稱其任而天下之欲趍事赴功者亦皆實有所稽而無慊矣自戰國以來先王之治日以逺甚聖人之教若罔聞知士之紛騰馳驟于天下者曽無常有之善心而惟磨厲其舌肆為讒説莫之能恤析言則離于理破律則壞於法亂名則喪其實改作則反其常此固先聖王之所必誅而不以聽者而戰國之世乃安然而行之孱君弱將纎兒佞妾劫之以敗降殺戮之苦誘之以聲色狗馬之好情知非是巧為文飾勢欲離合強相傾陷卒使上丗元德顯功之胄日就淪亡而後已嗚呼讒邪之説有可畏哉蓋昔孔子曽用於魯未幾而即有少正卯之誅徒謂其言行之偽而不由於誠學順之非而不由於是雖吾孟子亦甚惡夫處士之橫議異端之並起詖淫邪遁不可勝窮惜乎孔孟之道久矣不明于丗戰國之士不復知有義理之當然而惟以利害相勝故今斷斷然悉以為古之讒説可堲者也然今誘也注之彪也釋之吾正傳乃從而是正其誤又豈不以國策之言為不可廢歟雖然正傳學孔孟之學者也自先王道德教化之治夲諸人心播於簡册充衍洋溢逺而未斬是故春秋之丗鄭之賢大夫且能善于辭令應對諸侯鮮有敗事聖門言語之學達如子貢亦或一出于魯而彼齊晉吳越等國為之有變至于排難解紛成疆取霸而後定焉前乎此矣於是而後公孫衍張儀陳軫樓緩蘇秦秦第代厲之流揣摩捭闔權謀術數浩乎若江海之浸恍乎若鬼神之不可端倪雖其讒邪之説罔知義理而傎倒錯繆之一時口頰之移人固有非後丗膚見謏聞者之所可遽及嗚呼先聖王道德教化之澤一旦而遂至於此言之可為于邑矣然自其文辭言語而觀之惟椘漢戰爭之丗尚為近焉已不能盡及它則曹魏鼎足而割據李唐參布而分藩交兵之際奉使往來權術相傾議臣蜂起曽無異于戰國椘漢紛紜之時者竟未嘗有一言語之􅋏動一文辭之譎勝雖以當世史臣極力摹擬而為之亦且羞濕畏懦衰耗促數無復有昔時辨士説客之遺風矣是故世之讀國策者卓然自為先秦之古書不可廢也必也本之以心術之公約之以義理之正謹之以辭令之彂戰國其文而非欲戰國其學也此則正傳之志也又在乎丗之學者善讀焉而巳矣石陵先生倪氏雜著序自東都文獻之餘天下士大夫之學日趍于南或推皇帝王霸之略或談道德􅒏命之理彬彬然一時人材學術之盛不可勝紀蓋東菜吕公夲其伊洛義理之學且精於史永康陳公同父方與之上下頡頏其議論而獨貴於事功夫以國家兵戈離析之久王業偏安人心不固紀綱廢壞風俗蕩焉而失防意將自有酌古凖今知時識務之士雄豪智勇闓爽穎茂而出于其間或者猶慮其古方新病之不能以救亟也當此之時同父嘗陳征討大計石陵倪先生朴實先後同父草書萬言欲以兵戰自效不下同父然同父因其才力氣岸之豪中陷于罪釁至老才得髙第終以不得馳騁于中原而遂至淪沒先生方自以其學勝亦且不能于鄉里至以罪廢徒筠陽故雖有志焉而終以寒窶而老死蓋豫每觀先生之書則為之沈吟痛惜而不能自巳先生嘗夲其兵戰之所自出備知天下山川險要户口虛實著為輿地會元四十卷又推古今華夷內外境土徼塞之逺近繪以為圖張之屋壁而預定其計策逆料其戰守者不一而足是將碩出為當丗有用之學而不欲僅為􅚨者陳腐無實之空言當時之士惟同父為能知之先生亦惟寄示同父而不遑以他及者也然使先生之志且與同父獲用于丗天下之兵蜂集蟻聚勝負雖未可知必也人心國論之既㝎于一力守東南以為保障専意西北以謀進討江淮襄漢日以寧謐秦鳯陜虢之間遺民襁負義士壷簞尚不為無輔於萬一者是則後丗所以深有取乎樂毅之常生而重恨曹蜍之淹淹待盡也夫自南北兮裂士之學者方守于一隅而禹迹之所𬒳者率不能以遍歷黃河之源出於昆崘黑水之流播于南海而近丗地理之家茫無據依逺相億度蓋今海內混一重譯萬里黃河自星宿海彂源歷九渡河而後北會於臨洮積石之西黑水復流其西界而徑趨于滇越之外境若可以燭照而數計者譬如談天文者每以洛陽居天地之中然而南至比景北踰鐵勒斗極出沒髙下之度殊不可以常度凖又豈得徒溺乎羲和渾天之器而獨不少究乎周髀勾股之法哉是故先王輿地會元之書兹既不能以復見至于華夷內外境土徼塞之圖則猶未免乎參差矛盾而未盡善者此殆古今祖述編類之一疵也雖然先生之學誠可謂博而有用者矣嘗吕公云亡先生貽書同父謂宜力學以紹吕公後而同父咈然不恱是其一時人材學術之盛卒不肯俯首以隨人下而欲自表表于丗自今觀之前輩老成凋喪俱盡新學小生鹵莽不學是以一切墮於黃茅白葦而欲以為同竊其殘膏剩馥而不敢有異至其立言箝口結舌而無所彂明臨事則亦玩時愒日偷懦憚事而不足以赴其鼓舞作興之機者此皆見棄於先生者也藉令先生之學夲之以伊洛之義理而又無貴乎永康之事功則其所就且將不止于此雖然今之學者尚可及耶吾固未易以王道霸術之並行而遽少之也初武夷謝翶臯羽嘗因先生之書選為一編今始得其全帙號曰雜著者觀之又嘗過其所居則山洞湮塞棟宇傾蕩蕘兒牧竪悲歌蹴踘猶能示其故墟而亦不能詳也况其所著之書耶嗚呼士無當丗之功業而徒務于有言不至于此不極也是又古今文士著録藝文者之一歎也悲夫淵頴吳先生集卷之十
