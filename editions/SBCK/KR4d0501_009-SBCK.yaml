front:
  text: 淵頴呉先生集卷之九人金華宋濂編
  hash: sha256:8909bc220be062ea60b2f383f9f24630fa369b70bbd9d6d9bf516f1c64b7e977
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_009-1a}
body:
  text: 古琴操九引曲欹辭始予少嘗學琴學之數日曽不䏻布指爪而辨徴角甚矣哉琹道之逺也盖予毎思古人之去我者乆不可復見徒欲想其遺聲遺韵而庶㡬或得其心術之􅀁存情緒之􅀁託終以不克而後止是以常咏其辞樂家諸書又或不載或有載者多非其舊且至有聲而無辞甚矣哉琴道之逺也古者琴有五曲十二操九引五曲者鹿鳴伐檀騶虞鵲巢白駒本詩也漢魏以降惟鹿鳴一調僅存十二操者􅀅㱕旑蘭􅀛山越裳拘幽岐山􅂂霜雉朝飛别鵠殘形水仙襄􅁜古辞或存或亡而存者􅀋出彼丗之傅㑹漢蔡中郎及唐韓吏部曽作十操水仙襄􅁜且以其繫於樂工琴師不復採用故今特因琴操九引復􅀘其曲辞是數曲者頗本於婦人女子􅄷讎覊旅幽憂抑欝之懐君子猶得以少返扵古是則􅀁謂琹道之逺者誠有異扵閭閻下俚折􅀭黄華聴之則􅯳然而大􅀏者矣夫何逺哉遂􅀙而具錄其辞烈女引椘樊􅁎作􅉟巫山􅀆崔嵬又江水􅀆委夷草木􅀆芬芳鳥獸􅀆􅃅悲孟冬十月􅀆森然􅀣羽野火霓􅀭􅀆􅃝裼暴虎君王躭樂􅀆妾心獨苦妾心獨苦􅀆無使罪子嗟嗟􅀆國之無人莽莽􅀆雲夢有洲甘酒􅀆厲生淫獸􅀆􅍔来君王躭樂􅀆樂滂沛妾䖏深宫􅀆焉知外嗟鹿與女􅀆自古戎之君王亟歸􅀆匪妾之私伯􅁎引魯紀伯􅁎作北風􅀆喈喈雨雪􅀆漉瀌我心􅀆殷憂東海泱泱􅀆大􅀖為仇平原何有􅀆廣澤有􅀣鴻鴈哀鳴􅀆麋鹿騰騖兵車轔轔􅀆在彼行路􅆠事弗靖􅀆委儀章而謀去我生而存􅀆曰䠞我國我死不瞑􅀆愳不血食父母既沒􅀆歸又不得周公有􅀑􅀆曷􅗲予福我泛􅀆柏舟蕩蕩􅀆中河時嵗不與􅀆可柰何遭此鞠訩􅀆柰若何貞女引魯􅃮室女作春木􅀆含英野花􅀆幽香我何􅀁嘆􅀆我何􅀁憶主少國􅋏􅀆使我悲惻嗟彼女子􅀆婉婉令姿盛年不出􅀆老􅀅逮之嗟彼女子􅀆無非無儀􅁏食者謀􅀆汝何憂為我蓺我葵􅀆我藩我圃過客馬逸􅀆莫之或禦藩㧞葵踐􅀆飢哺無􅀁廟堂失筞􅀆婦女為虜悠悠蒼天􅀆天道􅁖盈知我謂我􅀆秉心獨貞陽和㡬時􅀆霰雪其零懐貞見疑􅀆􅂚其可懲思歸引齊衞女作麥秀嶄􅀆禾黍油油越有鳴雉􅀆粥粥道周朝陽烜然􅀆雲霧塞天中道徘􅆦􅀆喪我好逑紅顔摧頽􅀆欲飛復止縞衣入吊􅀆既悲且毁禮有未荅􅀆不敢狥死先王之懐􅀆敢辱王子父母鞠我􅀆胡然棄之宫庭嚴􅃉􅀆廼閟於斯身微莭大􅀆涅不可緇創巨痛仍􅀆隕命為期我思古人􅀆我敢失正天命早寡􅀆匪汝予聘我歸之思􅀆渺哉河梁誰謂衞逺􅀆歸我其航霹􅆮引椘商梁子作歩出郭門􅀆一何蕭蕭念彼古澤􅀆興言来㳺山長水濶􅀆曠無儔侣天地晦㝠􅀆霹􅆮儆予玄雲􅀆沍凝急雨􅀆滂沱氷雹􅀆交加蛟螭􅀆湧波捷捷業業􅀆天何我駴軯軨騞虩􅀆道不可以咫危顛疾蹷􅀆物無不靡側身慎行􅀆庶無罪悔神龍之歸􅀆肅然川坻雷公上天􅀆挾輈以馳昔何嘘􅀆今何怒為巫咸去我􅀆誰其得知走馬引秦樗里牧子作白楊刀􅀆宛魯矛枕戈待旦􅀆思報父􅄷父􅄷既報􅀆義不共戴亡命不出􅀆遁我扵隘山髙無人􅀆上無日星夜聞有馬􅀆繞屋嘶聲天不祐我􅀆愳追我兵横屍都市􅀆國有常刑我􅆦以徨􅀆莫履我彂沂澤㳽澷􅀆道路超曶我啼斯漆􅀆我軀斯厲所䖏何危􅀆命㡬一髮追兵既逺􅀆孰知其然馬跡在地􅀆莫辨東西父不可見􅀆我志􅀗伸我死得死􅀆嗚呼終天箜篌引漢霍里子髙妻麗玉作浩浩􅀆洪河有叟一人􅀆􅂝壺赴波我急爾止􅀆無檝迎汝爾竟汝渡􅀆爾何􅀁苦龍伯􅀆馮􅁜鮫魚􅀆叅差􅆷風奔騰􅀆霧雨渺㳽磨牙吮血􅀆制汝殭屍尓死扵渡􅀆柰何乎我我亟􅀙汝􅀆我死其可毁容􅁖服􅀆志不可囬理魂隕骨􅀆委命黄􅅺碣石嶄巖􅀆望不可測精衞䘖石􅀆􅂚海之塞􅂚海之塞􅀆恨與之平和我如此􅀆不如無生琴引秦屠門子作山嵯峨􅀆我車之􅀅水泱􅐯􅀆莫之或梁丗而溷濁􅀆黒白不明干戈日尋􅀆武夫顔行天寒而燠子厥有瓜瓞士賤以拘􅀆不敢容恱黔首之愚􅀆爾乃自愚謂儒可僇􅀆儒則何􅇳長纓􅀆縵胡瞋目􅀆語難堯舜逺而􅀆旦不復旦豺虎咬人􅀆㓗身去亂商雒有山􅀆曄紫芝嗟彼美人􅀆􅉥子望之何世之不偶􅀆曰安其危而利其菑天道至此􅀆我命之衰龍丘引楚龍丘子作春花􅀆亂開秋葉􅀆滿堦時不再来􅀆我憂用老乆行懐思􅀆我歸無􅀁鳥則有翼􅀆魚則有鬐􅏦霍有岳􅀆江漢斯波徘􅆦不進􅀆戹彼路岐僕夫告病􅀆飢馬囓其我夢之歸􅀆吾郷我里門闕依稀􅀆墟墓則迩魂神惝怳􅀆一夕九徙父母何在􅀆敢及妻子天隂􅀊莫􅀆北風之寒曰我無衣􅀆坐不䏻湌我拊我膺􅀆摧我肺肝閔天嗴嗟􅀆喟其増歎三彭傳昔在天地未判之初混混沌沌玄玄黄黄載清載濁實隂實陽水火交運曰星乃光爰有神人厥名曰突寔生其間吞吸元精孕胚巨霛上顱下趾肩髀成形口味鼻羶目色耳聲一機既闢萬化則行次有三子受氏惟彭孟琚仲質季矯是名相其居䖏託彼衆甿私其喜樂潜覷黙争吉凶紏􅆞􅍔福搶攘無有唇齒讒言其興無有刀橶積不相能人􅀋用殄􅀑恠為朋天下雜擾而欲以聽直於明庭於是黄帝乃召天老而問曰朕治天下嘗以為天下巳治矣三光齊明萬物順􅁤教流民人徳洽逺迩昆蟲喙息草木􅓂靡華夏蛮貃率我綱紀彼獨童狡嚚昬頑鈍椎鄙機心曰滋􅄝慾鋒起是何人情之大不美也彼三子者何以敢于亂始欤天老對曰臣不識也帝盍即是而詰焉孟琚率爾而前曰自臣之生茫無識知秉心多慾觸事即思揣靡傎倒神去􅀑来佪翔無象捩轉九垓莫髙匪山􅈥若阜莫浚匪淵規我沼池貪贏務嗇乗間抵􅇖巧窮毫􅄠枚數根荄他人富利視若己私叢為怨府襲作􅍔媒墨㦿注睛舑舕流漦已苟可得靡有匕遺仲質慼乎其容以次進曰自臣有行獨我勞苦頩然變色赫尓齎怒狭中淺量捁臓鞣腑言槍暴彂氣鞴交鼓霆砰電毄燀􅜱蠭午草搖風動淫毒齊弩恌浮嚄唶嗀唾喑噁誚譏是非傎錯横竪孰蛙睅眸孰螳攘股妄恃我強一與時忤千金解仇睚􅻃為虜世不我容胡寕可數季矯後至奮而称曰嗟乎異哉伯仲之言臣殆不敢以黙巳自臣之北肆其殺殘按膝危踞瞋目語難犀渠鶴䣛蛇矛筡􅗋嚼肌􅂥憤鍥骨求瘢力可㧖乕雄狡弗完射則命中飛走欲殫一言相加六親無驩兵在其頸􅄠上衝冠精神熛彂魂魄遁奔積骸為丘流血成丹戰聲未衂敵膽巳寒志在我勝疇測吾端扵是黄帝窅若有聞黯然不怡起顧天老復極其辞巳而彼三子者逡廵拱立錯愕失次同辞而進曰惟帝清問下民鰥寡無益臣雖不言帝之視聽可盡蔽欤盖臣聞之人生一世本自化樞孰不百年我謂斯須倐其童㓜馴至老枯何頭不秃何體不臞貴榮賤辱利害争驅死䘮病瘦悲嘆囚拏開口􅀏言􅀎得㡬娱縦情恣欲豈我過踰方其賦形我有軀幹曰忲美目清􅀭雄髯佼大肩背豐厚手足䡖快語音如簧容止􅀂畫市童興嗟隣􅀼睐是皆自然罔有過害至若疲癃連蹇痀瘻盲聵歩趍如縶顔面弗靧視臣之全生而抱形者百不逢一孰可􅀝頼飢羸危窘菲惡困殆􅄄裘不充藜藿弗嘬視臣之順適而愜體者千不遭一復何怨悔古人嘗有言曰天生時而地生財人則用之山丘之髙川澤之卑肖翹蠉蠕華實葉枝時至􅂔来各有􅀁宜是以人為萬物之霛而寔用夫萬物豈我之私然則世之􅀁有天之􅀁樂但知􅒏情何有規彠名車駿乗鞍韉轡絡芳醪美饌鼎飪􅇈杓竒聲異􅇊絃筝粉澤任口醲鮮随身煜爚此殆臣兄弟之􅀁喜聞而時俗之􅀁謂憂謔者也嗟乎人不可以無權權髙則廓權降則韄人不可以無􅀔􅀔盛則爍􅀔傾則縛惟泉濫觴而必達惟火燎原而必灼順臣者得志而相矝閼臣者逆天而自蠚是故思之不得而至怒怒之不巳而成僇臣猶恐其未足以竭平生之志騁一己之欲徒大期俛仰而向盡此􅀁以終􅀊犇跳而藺轢者欤雖然彼兇而暴世之下愚罹法受戮殘辱狗猪當其生存恣意􅀁如此通而睿聖人之徒黄馘槁項飢餓體膚及其没身併盡丘􅇕是盖天下之雜擾者或脩或短或黔或晢或夀或殀或遭病患或遇􅍔讁各有天命弗勞人力恒自困於昬睡反謂臣之讒賊而彼衆人方欲以是而聴直於帝庭也孰為直欤於是黄帝乃召天老而告曰自朕之治天下帝榆無道侵欲諸侯蚩尤暴起兵􅅍冀州太一奉符天一獻謀一戰而勝涿鹿是都橧巢營窟風雨漂揺果蓏蚌蛤臭􅁾腥臊民人告病我是用憂制彼藥餌務為民逑彼三子者呌嚻􅄂遝兵之不可藥之不及雖欲本其致􅅍之故用以變之毋乃天下終未䏻盡治欤天老對曰臣聞上古開物之時天髙地下風氣漸張醴泉瀵注地膚馨香上飛下行身有光芒􅀊久念食嘉穟穰穰民有争心変生穅争之不巳殊厥井疆天人既離善惡乃彰彼三子者始得以自肆其姦而莫之或攘然臣甞稔其言矣琚也多思宜於長頋而却慮質也多怒宜於憤世而嫉邪矯也多殺宜於徑情而直行是誠有害於聖人大公至正之道者臣則請帝杜其宴安之毒敜其蹷痿之機浣其腐腸之食齾其伐􅒏之媒則彼三子者之致亂猶可及止巳何謂天下之未䏻盡治欤於是黄帝乃即齋宫累月不親政事經年不迩聲色怳􅀆惚􅀆而或與方㝢謵朋等問道具茨合苻釡山且又神㳺於華胥氏之國天下大治由是三彭不振遂至於亡為􅀃者曰予聞祝融之子厥有大彭寔居彭城是為彭姓至周有彭人别居庸蜀微盧之間非其後也盖今三彭氏本在於黄帝之世則又異矣雖然大彭之後有彭祖曽以雉羮享帝帝錫之夀考至八百嵗而彼三子者乃幸人之有過出讒于帝以求享而人用是􅍔患殀札者相繼此則又與彭祖者果異歟悲夫潘生傳潘生者富陽人丗業農㓜䘮父獨与两弟奉毋居間出与人執塓甓治筐筥又為善工大徳間江南大饑人民道墐者相望自度無所得食曰吾終無以給母則母子俱死等死盍若用吾強壮少延母旦夕活乎即以母属两弟自傭囬鶻人乃告母曰児當傭錢塘數月得錢米活家且自活母勿憂既囬鶻人得轉賣遼東遼東大家軍户遣代戍虎北口㑹上有詔江淮子女流徙者衆禁人母得轉掠饑民使悉還郷土遂􅀙遼東給過􅀁道遇一女子鴉鬟尾行問之則曰淮産也昨因饑父母棄我轉徙數家今主家使我歸君南人儻挟我得同歸乎扵是日即操瓢道乞夜泊茅葦中雖顛沛流落親䵒日乆曽無一語少及􅅍渡淮曰我家通州今近矣君盍送我到㽵乎及女子上堂見父母􅄃涕泣起相抱持詰門外同来者何人即引生更衣具酒炙樂飲酒半執醆跪曰吾女幸完骨􅁏韙見郷里免罹霜露盗賊君力也今吾女猶䖏子君誼聲􅁀淮椘間且君去家久母不知在亡嵗丁荐饑郷閈必離析廬舎必􅇕莽雖有兄弟亦恐不􅀎自存活吾家尚薄有園田給􅊡粥吾女實君箕帚妾也君必無歸生則毅然謝曰吾何敢以若女為利哉吾雖賤不讀書且義不敢取况吾母固衰耄度尚可活萬一母死两弟儻或有一存今遂不歸是吾􅃍死吾母也吾又何忍即安此土乎遂告歸母死者盖三載两弟亦死生􅇷制服復食其故技扵郷以終為說者曰凡人自立天地間夫妻子母天属也人子亊親􅀱顔色具甘膬鞠躬盡力雖生死不暫違去今生自棄其身饑莩中規奉其母母幸粗延數日命猶念母終身可不謂孝乎丗衰民散雜男女或強暴侵陵或謡諑善淫鮮􅀎自合扵禮法者今生偶以塗路相遇皦皦不汚卒辝其㛰可不謂義乎嗚呼世之不及此者衆矣一恒人乃凛然􅀋古獨行君子尚可謂世為無人邪然生終以老死􅃿視彼妄夸姦佼反以義侠特聞嗚呼此又何為者􅁘韓蒙􅀓韓蒙者永豐人家本江東大姓善賈至蒙益蓄善田踰數萬畒計􅒏樹惇常低首下氣􅀋懦夫女子未甞敢出纎芥語鉗制人視􅀊貧窶鶉餒給鹽米炭死或給棺蒙郷里時蒙舉火者或數十家蒙毎售田田必過直與錢且追舊劵自􅈫曰某售某田彼欲速我貨今我入榖田實上􅃾我欲久有我業又乗人之時詘恣贏扵巳母乃為過貪巳乎復召與錢蒙既老謀􅁲山以葬郷人有山㝡吉即獻山蒙不可􅀩諸子􅃍割園田與山多寡埒蒙又不可曰我死歸我骨免烏鳶免蝼蟻山泉樹木悉爲我有且彼豈或不􅀎自爲竁頋藏我乎復估山所直與錢郷人不肻受召与飲強授錢乃巳自是郷里童耋見蒙出必讙曰吾長者凡在東阡西隧田芃然茂園菀然蕃池孳鉅魚山養嘉木蒙曾不待防護程􅇂利日歸蒙然蒙頗以財自衞無有妬蒙而思欲撓奪之者故蒙卒以富饒終其身嗚呼丗􅀁謂大富家者豈盡蒙比耶自其乗時射利血牙腊毒不至扵谿壑属厭不肯巳終不免自䧟其身爲刑僇之民自蒙䖏之誠不肯頃刻安寝食彼方亟肆其術肥家而瘠郷恫疑噤喝持郷社輕重揺脣鼓筆挾州縣短長徒以争強競得扵一時不䘏其後或一世二丗三丗子孫既巳凋䘮廬舎既巳摧落田園易主丘木斬伐罔有遺蘖至使郷里衆人追數其既往之愆尤曰天定者勝人視蒙獨不可愧耶嗚呼吾每觀數十年来丗衰俗下田力頓耗泉脉寖竭􅀊無美禾山恒蒿然池多眢衊不得孳鯤鮞是豈天時人事相為上下本其人一以貪殘剽磔之行自戾扵天不有天菑必有人殃而天特有以黙勝之耶然而天下多故閭里益騷糠籺不􅂶口裳􅄄不掩脰悲憤姦悍而欲競洩其毒以逞莫之底止是果丗無富民長者耶嗚呼幸使吾郷里知有蒙也可以勸為􅀃者曰予聞穎川白晋言如是晋甞宦㳺其郷至蒙家蒙具水陸鱻薨時新􅂼蓏醯醬䓗㳿烹瀹調齊執酒􅄴獻酳拜跪恒中禮一彂言必及扵善毋躗遇它過客盡然此殆富而好禮者乎晋北産惇樸不妄人也故蒙之行事實可傳㑹稽傅氏夏小正注後序夏小正本古書殘缺近㑹稽傅崧卿頗就大戴禮校讎刋注刻在㑹稽學宫盖昔孔子甞曰我欲􅀚夏道是故之􅂎􅂎不足徴也吾得夏時焉􅀃者則謂夏時夏小正也聖人當春秋之丗每告顔淵以王者百丗通行之道首曰行夏之時殆取其􅀊時之正政事之善也此豈果謂夏小正之一書㦲周公之時訓吕不􅅊之月令􅀋􅀂一本扵夏小正而又加詳漢魏以降甞建讀時令之官凡以夏禹周公之典丗宜守之而不敢有逸故也後丗儒者乃欲舉時訓月令而盡黜之且曰天時之運行有常而王政之設施者無常起居􅃅一令慶賞刑威惟其所值而即行之誠不可以非時而暫􅆸苟不即行而蹔􅆸則天下多滯事矣予試論之天之與人一理與氣而巳盖惟理常為主而氣之􅀁運一屈一伸一開一闔暑焉而土山焦爍寒焉而川澤凝沍天下肖翹蠉蠕根茇浮生之物無不熏蒸融液周流交灌而舉不得逃焉理固在是也聖人之􅀁以為人每全其理之􅀁賦而又順其氣以行之不敢少逆囙時制法按月布政春夏陽舒而賞慶行秋冬隂􅃤而刑威作是皆悉本乎天之一屈一伸一開一闔而固非我有作為扵其間萬一有逆乎此而天道􅃍為之變一言之彂与某休恊一事之動与某咎應春秋洪範家類􅀎言之而後儒或譏其􅅺者此猶嚮謂時訓月令之可盡黜者也嗚呼夏禹周公之典不㡬扵􅃍逸矣乎夫夏后氏之政典嘗曰先時者殺無赦不及時者殺無赦然所謂先時不及時者豈有它哉春飬狐子秋食耆先每事不敢有違其時者是謂經制盛夏非行師之期而出師窮冬非肆眚之日而肆赦則是一時之所值有不容不舉其事者是謂權術自天道而觀雷霆霜雪一切各以時至者則理之常不以其時至者則氣或有以激之而理則非常聖人之典亦道其常者而巳矣今而曰天時之運行有常而王政之設施者無常起居􅃅令慶賞刑威惟其􅀁值而即行之誠不可以非時而暫􅆸是徒苟用乎一時之􅁠術而終不得乎王者之經制且夏禹周公之丗因時制法按月布政天下亦何甞多滯事㢤爲此􅀃者始不究乎天人之一致而務欲裂而二之者也然而古者聖人之道每與天地之化相爲流通泊然而神明内居窅然而氣化外変是故冬而振雷夏而造氷宜若或違扵天而天固不䏻違之此不可以一槩論也自惟聖人知其理之􅀂是而必道其常以垂丗立教陽氣一通則鑚燧出火隂氣一歛則築室藏氷􅀚其􅀁以弥綸匡賛節宣調変扵天地隂陽之間者豈爲無􅀁用其心哉達賢君子治其一身且順天地四時之変調其居䖏莭其飲食禁其嗜欲適其志意一國之政辟之治身則又大矣傳不云乎周􅀊多燠秦年多寒是特昧乎夏禹周公之典或流扵舒縦遲緩或䧟扵嚴酷刻深而不自覺焉者也由此􅀚之孔子甞有取扵夏時者天時與王政相叅王政得則天道自應後丗儒者乃欲舉時訓月令而盡黜之則先聖人不謂其嵗時之不正不謂其政今之善哉嗚呼此亦不得其􅀃矣南海山水人物古蹟記南海盖禹貢􅀭州之南境春秋􅀾國時地本百越至秦始通而尉佗王者五丗漢元鼎中南越平立南海等郡属交州治蒼梧建安中徙治南海吴孫權􅀄割交州立廣州而南海郡属廣晋因之宋以後江左州郡析置不一至唐即以南海郡立廣州永徽後嶺南五管悉􅀠廣府咸通中復分嶺南為東西道廣為東道唐末迄五代南漢劉氏據之及宋􅀄而後平今廣州上路領縣七番禺秦縣南海増城漢縣新㑹清逺陏縣東莞唐縣香山宋縣廣大府也山水人物古蹟之灼然可紀者夥矣粗載其大略于萹畨禺山在畨禺東近城两山相属髙丈餘山海經黄帝生禺􅃅禺􅃅生禺京䖏南海一曰二禺山或云黄帝二庶子善音律南採崑崙竹制黄鍾宫遂隠此山五仙觀山在子城内椘髙固時有五仙人人持榖穂一莖六出乗羊衣羊具五方色遺穂州人羊化石仙人騰空去南海廣利王廟在畨禺南廟有唐韓文公碑玉簡玉硯象鞭精緻鄭絪出鎮時林靄守髙州獻銅鼓面濶五尺臍􅀮起海魚蝦蟆周匝今藏廟中宋真宗賜南海玉帶蕃國刻金書表龍牙火浣布並存浮丘山在南海西本羅山朱眀之門户浮在水中篙痕宛然今去海四里有􅁑洪珊瑚井洪煉丹海神獻珊瑚中宿峡一曰峡山在清逺東山對峙江中秦趙胡曾鈞得金鯉可重百斤貢之秦王有釣鯉􅄗東有尉佗萬人城南有標幡嶺唐大暦間哥舒晃叛廣州討晃夢神人謂曰見幡即囬及晃平囬師山頂有掛幡白雲山在畨禺東山髙無泉有龍化為九童子泉􅃍涌時有五色小蛇蜿蜒下為大小水簾洞秦安期生􅀮䖏始皇嘗遣人訪安期生或云子城東有安期生蒲磵溪磵中産菖蒲一寸九莭食之仙任􅅝墓山在西城内􅅝秦二世時南海尉病召龍川令趙佗使行尉事嚻死秦􅅍佗竟自王越王䑓在大城北尉佗築西有越王朝漢䑓嵗時望漢拜兩䑓踞山巔屹然山有達磨泉達磨自天竺航海至指其地曰地有黄金萬餘兩貪者力鑿得泉達磨曰是可銖兩計哉令海水鹵鹹泉最冽越王趙佗墓山在南海南自鷄籠岡北至天井連岡接嶺佗􅁙輀車四出棺塴無定䖏吴黄武中交州􅀙事吴瑜訪佗墓莫能得獨得王嬰齊墓珠􅃭玉匣玉蠒金印三十六銅劒三爛若龍文悉璃玉押金飾後瑜携劒經贛上飛上江水南越王弟建徳故宅在西城内吴虞翻移交州時有園池唐六祖慧䏻剃􅄠受戒寺有壇壇有菩提􅀣房相國融譯楞嚴經有筆授軒大硯融自刻大唐神龍改元七月七日天竺僧般刺􅁡諦自廣譯經出此硯堅潤可愛藏殿内有屈眴布西天衣繡内相大如兩􅃌越井崗在南海南一曰趙佗井一曰鮑姑井鮑姑􅁑稚川妻甞行灸南海善灸贅疣唐崔煒遇姑得越井岡艾南漢劉龔􅃅玉龍泉禁民不得汲石門在南海北山夹江對峙如門漢樓舡􅀅軍􅀭僕討南越先􅀅精卒䧟㝷峡破石門東有貪泉晋昊􅀮之刺廣州酌泉賦詩䖏隠之北歸家人􅂝沈香一斤覺􅄬香江中漢徴士董正墓山在畨禺東正州人清白不群晋隆和中太守􅀽彦伯求其後旌之馬鞍山在畨禺北秦時望氣者言南海有王氣彂卒千人鑿山状如馬鞍漢伏波􅀅軍馬援甞駐兵山岡毎風雨晦㝠聽之若有軍聲殷然盧循故城在畨禺南城南小洲状如方壼盖循故居䖏仐盧亭夷人男女椎䯻俗採魚蠣藤竹又有龍户一曰蜑户舊􅀓循字元龍此恐循遺種五月一日禁水蜑户不設網􅅈石鼓山在東莞南山有石如鼓鼓鳴丗􅅍兵起盧循東㓂􅀮隠有聲金牛潭在増城南本増江水潭有金牛晋羅公釣得金繂牛􅀙繂出見人復没㫁其繂得一尺義熈中周霛甫勇掣得三尺唐韓文公宿増江口有詩示姪湘甘溪在南海東晋廣州刺史陸自西北百餘里築堤瀦水給城南漢劉氏闢甘泉􅁐汎杯池南有陸公亭故基夹溪種刺桐木綿花開殷艶如畫愽大山在畨禺東山有盧循母檀氏墓東南有盧堠循浮海與吳隠之戰立烽堠䖏山下溪有神􅂦唐劉道錫刺廣州遣人係鼎耳出鼎耳㫁鼎没執郷者耳盡痛馮盎墓山在新㑹北盎丗爲南越首領祖父寳守髙􅈵聘譙國夫人洗氏寳死洗懐集百越斬歐陽紇陳紿洗鼓吹麾幢至盎三丗武徳中盎􅀅南越衆附唐赤石岡在畨禺西南山色赤如火然唐有扶南人請以黄金萬鎰市山彂寳藏刺史􅅊明曰南州鎮山也弗許景泰山在番禺東北山巍然聳㧞下爲越溪唐景泰禅師卓錫䖏古有七仙人守山後彂得石􅂂二古鏡一紹興間風雨山裂又得唐天寳時銅鐘並藏寺中黄雲山在新㑹北唐一行禪師来㳺此山黄雲自山出如金輝映衣䄂遂卓菴山巔弟子至者餘五百人寳荘嚴舎利塔在西城内梁大同間曇俗法師奉武帝命求釋迦舎利創千佛塔唐髙宗時廣州都􅇂李重建王勃記有古井九繞塔内有古䁀藏劍一鏡一銛瑩下彂得佛牙舎利似是梁代故物金芝巖在清逺北唐天寳間望氣者言南海東南内有霛山彂金草遣使得金芝二十四莖錚然作金鉄聲黄巢磯在清逺南黄巢宼廣州殺李佋覆舟䖏西樵岩在南海西南岩有石室石珠飛瀑如瀉下為玉女淘沙灘漉梨泉龍泓九真洞嵗時恒禱龍龍泓占風雨雲氣南漢時有烏利仙迹鎮象塔在東莞西南漢禹餘宫使邵廷㻆造廷㻆劉氏愛􅀅甞告劉鋹曰漢承唐􅅍幸天下有故干戈弗及漢寖驕今諸國悉珎寳奉中􅀦漢不可後否則宜歛兵自守已而宋師至廷㻆􅀅舟師出洸口鋹疑廷㻆必叛殺廷㻆禹餘宫漢離宫九曜石在西城内城有湖長百餘丈水凝緑列石嵌竒突兀類太湖霛壁者九南漢劉氏集方士煉丹䖏蘇文忠公古舎利塔在東莞西資福寺羅漢閣状若覆盂文理􅀋巴焦五色備具盖古佛䐉骨也比丘祖堂夜夢赤蛇吐珠白壁上旦果得舎利建塔公自作銘以實之東坡泉在西城内天慶􅀚蘇文忠公􅀄鑿得一石状如􅀛泉涌出􅃅亀泉清冽亜達磨泉淳祐間經略使方大琮浚泉護以㝎林廢寺鐵井欄大琮有鐵井欄銘仙女灣在香山南海中宋益王昰南遷泊仙女湾丞相陳宜中欲奉昰犇占城􅄓作昰殂塟香山宜中遁殿帥蘇劉義追宜中不及夜有火燒仙女湾舟艣㡬盡崖山在新㑹南山有兩崖對峙海潮出入宋紹興間甞置成衛王昺南遷結營崖山海中海水鹹級道㫁天狗堕海聲隆隆如雷丞相陸秀夫朝服抱衞王沈海文武嬪御􅀙死者萬數大奚山在東莞南大海中一曰碙州山有三十六嶼山民業魚塩不農宋紹興間招其少壮置水軍嘯聚遂􅇕其地今有數百家徙来種藷芋射麋鹿時載􅀁有至城易醯米去爲􅀃者曰東陽李生自海上囬爲言南越事山川風土悉有可考者夫南越本一州地自秦漢以来始通尉佗之自王劉龑之􅌹制亦甞自同中州崛強數代至扵天下盡一而後䏻有定豈不以其山海之險逺故哉當今廣爲大府自江嶺而上經大庾關隘之髙峻自閩徼而入過潮陽嵐路之稀逺自䍧牱而下則又􅀅歴灕江湟水瀧石之嵓崿黄茅青草炎瘴襲人毒蛇猛􅍑山谷盤踞是故丗之仕者恒未嘗􅂅至至則常數期日而或不足以償其苟且塞責之心然而晴天勝景山霾開而海氣伏珎禽嚶鳴異草叢生花有素馨朱槿果有荔支龍眼㯽榔蒟醤之属芬香艶冶鮮甜爽脆魚鷄蜆菜堆積扵市酒支數年苟䏻順其風氣時其調適宜􅀂無間扵中州至扵控制山䝤壓服海外大蛮夷嵗時蕃舶金珠犀象香藥雜産之富充溢耳目抽賦帑藏盖不下鉅萬計又必頼夫涕泣還金之吏而後有以愧夫䡖生好貨之俗厥任至重故常􅇵扵他郡而必欲其稱聀是又豈得以其險逺之故毒瘴乗之而或略扵民事者㢤然則世之仕者勿以其險逺可忘必圖其政山海之氓勿以其險逺自恃必奉其法度此則天予堂陛之間即為廣府誠不可以不慎也雖然自秦漢通路以還南越幅貟數千里莫不自歸扵經理撫綏之中至唐而後列為五府廣府寔大山深峒惡民頑俗獷草揺風動常必徳懷而威懾之然後自巳間者一時山峒顓顓無􅀁覺知之氓弄兵潢池假息湯釡至使父兄子弟脩城栅繕壕塹晝夜鉦皷凛焉若鉅敵之壓境訛言相驚繼之朝廷以是而厲法令儆盜賊修馬政禁兵器是雖一指疥瘍之微而徧身猶或為之不寕者盖乆而後克有定此豈可以輕視南越一區之地而不深戒其山海之險遠者哉嗚呼今之􅀁紀者山川故在人物則悉巳往而不可復追矣遂囙及其風土政事之槩者著于末簡苟有觀者曾可謂為晋宋少文之卧㳺云尓哉予故得以具論之淵穎呉先生集卷之九
