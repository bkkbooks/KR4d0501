front:
  text: 淵穎呉先生集􅃃之十二門人金華宋濂編
  hash: sha256:d3082c8c2cb9e5483722e77a2261b1863e2a43ca6db536de606a22206b1b6cb3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_012-1a}
body:
  text: 桒海遺録序頃予嘗􅀙郷先生學見福唐劉汝鈞貽書括蒼吳思齊子善論文丞相宋瑞事云自江西􅀄起時﨑嶇山谷購募義徒畊甿洞丁造轅門請甲仗不啻數萬而尹玉實為驍􅀅大衣冠指麾衆皆􅍗闕感泣求效死巳而當國二揆交沮用兵帥無宣諭卒無犒賞􅋥桓月餘僅令守姑蘇一路張彦提重兵居毗􅁜且有叛志尹玉竟以絶太湖吊槗首尾不救而溺死未㡬獨松告急朝廷四詔政府六書􅃐弃聊攝援根本一日一夜倉皇就道及至行都而獨松随以破䧟復令駐兵餘杭守獨松朝議不一衆心離散㑹有尹京之命餘慶􅃍奪其印不予漢輔遁徳剛遁北軍入城與􅁠又絶江遁乃即日拜樞使又拜右揆􅀘与􅁠䖏且令往軍前講解毅然請行及􅀍囚以北中道奔迸􅀵集亡散無兵無粮天下大勢去矣帝覇交馳正偽更作是不一妵當世之爲大臣元老者視易妵如閱傳郵况當滄海橫流之際而彼乃以異妵未深得朝廷事􅁠欲􅃗手障之至死不屈微箕二子且有愧色於宗國矣其書大略如此予後又􅀗見淮隂龔開􅀁作文宋瑞陸秀夫二傳盖益詳焉方唐末五代之季藩鎮䟦扈武臣驕矜君臣父子之義不明而土地甲兵之強􅀋無不欲黄屋左纛自爲者先宋知其然一旦踐大位即罷諸莭度兵符􅃍用􅚨臣以爲治終不足以盡復乎石晋􅀁割之境土迨乎宣和衰乱北兵南下急􅀂建瓴曽不得乗一障設一􅀱而遂至奔亡不守後宋再造東南區區山海之間内政不修外猶恃夫江淮以爲固乆之南北夾攻而汴蔡之藩籬自撤其蔽荆㐮受圍鄂渚有警巴蜀侵䧟廣西之烽燧亦不絶此其國勢垂盡受兵䖏多殆如囊中探丸圍中逐鹿無􅂧有潜藏隠伏地矣􅀁可幸者天下學士大夫二三百年祖宗培飬作成之澤薰蒸者久忠臣義子或死莭或死事盖無媿焉卒之宋瑞秀夫前後死國精忠􅈭烈誠有在於天地而不在於古今者嗚呼呉晋陳陏之変豈復有一人若是哉龔開者字聖予少甞與秀夫同居廣􅁜幕府及世巳改多往来故亰家益貧故人賔客􅀱問日至立則沮洳坐無几席一子名浚每俯伏榻上就其背按紙作唐馬圖風騣霧鬛豪骭蘭筋備盡諸態一持出人􅂺以數十金易得之藉是故不飢然竟無􅀁求於人而死志莭既峻儀􅀚甚偉文章議論愈髙古至爲此二傳大率􅀋司馬􅁶班固􅀁爲陳夀以下不及也此其人殆亦無􅀒扵秀夫者哉予故私列二傳以彂其端詢之故老徴之雜記題曰棄海遺錄且以待太史氏之采擇古詩考錄後序予甞􅀙黄子學詩黄子集漢魏以来古詩凡數十百萹詩之作尚矣盖古今之言詩者異焉古之言詩主扵聲今之言詩主於辞辞者聲之寓也昔者孔子自衞反魯乃與魯太師言樂樂既正矣而後雅頌各得其􅀁史􅁶則曰古詩三百餘萹聖人特取其三百而􅀍之弦歌􅀁謂洋洋􅄹耳者不獨主扵聲也或因其㫁章取義而欲以導其言語之􅀁彂或夲其直􅃌全體而務以約其􅒏情之無邪是又不以其辞哉制氏世世在大樂官盖頗識其鐘鼓之鏗鏘而不能言其義鹿鳴騶虞伐檀文王四調猶得為漢雅樂之􅀁肄且混扵趙燕椘代之謳者無㡬自其辞言古今義理之極致一也自其聲言則樂師矇􅸴之任未必䏻勝夫齊魯韓毛四家之訓詁者也雖然古之安樂怨怒哀思之音盖􅀅因其辞之􅀁寓者而盡見之故當時之聞韶者則􅀙容和緩􅀚武者則彂揚蹈厲是獨非以其聲辞之俱備然哉自漢魏以来誠不可以朢古三百萹至於上下千有餘載作者間出如以其聲則沈休文之樂志王僧䖍之技録自能辨之苟以其辞則今無越乎黄子之􅀁集者吾猶恐古之言詩不專主扵聲而今之言詩亦不專主於辞也何則古之言詩本無㝎聲亦無㝎韻聲取其諧韻取其恊平固未始甞為平仄固未始甞為仄清固未始不叶為濁濁固未始不叶為清自近世王元長沈休文之徒始著四聲㝎八病無復古人深意新安呉棫材者乃用是而􅀘音􅀘韵先􅚨亦甞􅂑是而叶詩叶離騷盖古今之字文不同南北之語言或異而音韵随之是雖不待於叶而自能叶焉者也故當􅀚其辞然則古之言詩者辞而言樂者則聲也采詩之官不置樂府之署不設吾無以聲為也若夫今之言詩既曰古近二體古體吾不敢知而近體乃謂之為律者何也又安得不求夫聲辞之俱備而後為至哉考乎古者考此足矣試以是而復之黄子序于末編陳氏大衍易數後序凡天下之物必有理而後有象有象而後有數數始於一有一而後有二一者竒二者耦而後有隂陽老少之変七八九六之筞筞三變而成爻爻六變而成位此聖人􅀁以􅀚変而立卦考象數而建卜筮者也易曰大衍之數五十其用四十有九自其大衍之五十者緫之則又合於太極之一是皆天地自然之運又豈待乎人力之強為者㦲何則一定者理也雖其體甚實􅀁􅔜無形未始有定者事也雖其跡本虚因應乃有理在是數亦不外乎是欲求其極則天地之開闢人物之消盡且可以數莖之􅆱參兩而盡决之者吾聖人固未肯䡖爲之􅀃也是何丗之喋喋者然㢤自秦㓕六經易以卜筮故存漢􅚨林傳孔子六傳至菑川田何易道大興魏郡太守亰房則又受學外黄焦延夀不与何同漢初河内女子始獻易􅀃卦盖与老子同藏於風雨屋􅉹之間京房之􅀃互相出入故世之稽􅁻凶刺休咎者徴焉是果吾聖人之遺意哉它則進退以㡬而爲一卦之主者爲丗對待以丗而爲其主之相者爲應世之􅀁位而隂陽之􅀁肆者爲飛肇乎􅀁配而隂陽終不脫其本者爲伏起乎丗􅀿周乎内外終終始始而後動爻互體五行納甲之変無不具者人自以爲􅀎探河洛圖書之􅄨家自以爲能彂周孔爻象之藴餘則或入於淫瞽方技之流与易大相逺矣先正盖有見焉必以名理論易而或不以象數論易雖然是又可得而盡􅆸者哉括蒼陳生甞出大衍易數一􅃃間爲予占考其法則曰聖人之立卦者八故天下之物苟囿扵數者亦不過八吾則夲其􅀁值之數􅂺以八乗除之或以身之􅀁䖏定其坐作動静之殊或以字之􅀁畫測其向背俯仰之異八而巳矣自八而六十有四自六十有四而四千九十有六用此道也嗚呼生之於易勤矣要之特亰房之法耳生則又曰是固本之希夷氏者也豈彼生者希夷氏之遺裔欤先天四圖吾聖人之學也生盍歸而務求其要欤一中造化心上經綸盡在是矣秦階六符經後序泰階六符經者本黄帝有熊氏丗不傳當漢建元之間東方􅃋始陳其􅀃欲以􅀚天表之変定上心之侈者應劭仲逺又䟽其文頗􅀋甘石諸人􅀁為託之者也盖古昔聖人之論隂陽五行者尚矣幽賛乎神道彂揮乎天理是豈無其故乎特未甞膠扵多忌之學欲肆其一定之􅀃也苟曰乾坤開闔莫非一造化亭毒之妙某言必有某徴某事必有某應喜樂好悪出扵人之情饑華泄雹興於天之治天人兩間似皆有以潜囬其機宻運其軸而無難者是亦管窺蠡測而巳矣自劉向言皇極之建不建亰房又推易卦直日用事董仲舒睦孟之徒又分春秋二百四十二年灾異之驗或身􅃍以死或國随以䠞迄不少救然而天文月令䜟緯術數百家雜起不曰􅀛龍河洛洞幽靈之府必曰鈐决㝠奥覈􅍔福之源蠭談而角辯啓穴而鑿牖秖足以長姦偽而甚不足以祛邪惑者大率漢世世主以是論政儒生以是論學何其􅅺也子不語恠力亂神又曰性與天道不可淂而聞也庸詎有􅀂是云云者乎當東方􅃋陳是􅀃時上始為微行行暴肆侈越制亡度舉盩厔鄠杜陸海之饒廣上林苑東征西伐軍旅數起黎民失業父子相食斯其為人痾也酷矣天人一理也吾知修吾事以畏天可也日蝕地震冬雷夏霜蒙氣還風旱乾水溢天之為也人何與焉天豈􅀂世之小大夫然哉惉然喜頩然怒人人而欲應之以吉凶妖孽之决也一日之頃雖千技百変而為之亦不足矣要之天為天人為人母相瀆也至其􅀁以兼統而一貫之者昭昭冥冥理無変氣有変也然上􅀄即位天表巳多変關東大饑風赤如血齊椘二十九山同日崩考之人事則猶未有可感者変何自作哉􅀅人子未甞有過父母乃先作色以待其有過固不可也使朝廷多欲之心一窒文景富庶之政未改是且委之天運之適然者欤抑亦君徳之勝為􅁕以銷天變之迭至者歟不然未可知也而今乃欲以膚學謏聞者盡之則非矣􅀭子雲曰通天地人曰儒通天地而不通人曰􅇊嗚呼􅇊而止者此非黄帝書也甘石諸人􅀁為託之者也雖然觀是者又可無畏乎哉王氏範圍要訣後序天文星暦五行之􅀃尚矣黄帝風后漢河上公有三命一家藝文志不著録也梁陶􅊼景始述三命抄略唐僧一行桒道茂劉孝恭咸精其術韓退之言李虚中善用人年月日時知人命貴賤夀夭者是巳貞元􅀄李弼乾又推十一星行暦後傳終南山人鮑該曹士蒍世係之星暦􅀁謂十一星者日月五星四餘是也然而天體至圎二十八宿與之為經日月五星皆動物也且相循環運轉乎三百六十五度有畸之内與之為緯尚書堯典考四仲中星各以時異秦漢以來諸儒又推十二次度數十二國兮野及􅀁入州郡􅄤次乃若有一定不可易之䖏是何天運之常旋地維之不動者又若是參􅏔不齊也哉晋天文志天東南有十二國星其星有変各以其國􅀅天之􅀁覆至廣華夏之􅀁占特東南牛女二宿之下欤此十二國星又与前十二國之分野異矣意者牛女二宿當十二次則爲玄枵星紀之交當十二國則爲齊呉濵海之地天運之常旋者夲不常居地維之不動者固有㝎属也雖然北極居天之中常在人北北斗實爲帝車運乎中央亦䖏人北盖甞北至幽州碣石之野斗極且當人上北過居庸西渡滦水北斗巳南迤而下人且背之而馳矣由是觀之華夏之􅀁占者豈直東南十二國星哉未可以一槩論也日君象也行則有常月五星臣象也行則無常盖日之常行也則有中道暦家􅀁謂黄道是巳月五星既無常行乍南乍北或嬴或縮且或不出於周天二十八宿黄道之度而雜犯乎河漢内外諸星此又豈可以區區算數少測之哉它則紫氣以祥彗孛以妖羅㬋計都以蝕神首尾古未嘗与七政並列春秋之書星孛或入北斗或在大辰夲是妖星爲異老子之出函谷紫氣臨􅀜亦是氛祲雜占王朴五代欽天暦又謂蝕神首尾僅行於民間小暦而巳今其􅀃一本之都利聿斯經都利盖都頼也西域康居城當都頼水上則今􅀁謂聿斯經者婆羅門術也李弼乾實婆羅門伎士而曹士蔿又作民間小暦者此其爲術固異於甘石之舊矣夫以天地隂陽之合散而庶人庶物莫之䏻遺氣賦之形理賦之􅒏􅒏之體本粹然至善者也氣之運譬之草木春而榮秋而槁倐而凝聚忽而凘盡亦其宜者苟不推之以一理之同而徒役之以多衍之異不亦末乎嚴􅁜王生乃以範圍要訣一􅃃示予其法皆原於易又有過於三命十一星之外者列之以千百十零附之以氣名體性尤與潜虗擬玄者合也此其㝡近扵理者欤􅀅其人之創爲是法者亦且有得於河洛圖書之奥者欤故予又特采別􅀃以序之司馬子微天隠子注後序司馬子微天隠乎注一􅃃八萹天􅀮子亡其妵族邑里或曰子微託之者也夫黄老之􅀃始自黄帝老子太史公老子列􅀓則称其以自隠無名為務至其道乃曰無為自化清净自正無它異也當漢􅀄黄老盛行至武帝又好神仙文成五利之徒迃誣恠譎之士神光巨跡千変百幻雖嘗一致槁山之祠欲追黄帝之遺風者獨不及老子神仙方技豈又與道家戾歟東漢以来丗之􅚨者方以天文卦􅃸為内學而為天子公卿之􅀁賔禮甚則自䧟於􅀑道􅀹慈啓之􅁑玄紹之玄之後則有鄭君鄭君之後則有葛洪􅁑洪之後則有陶弘景洪與弘景本􅚨者當天下多故欲自縦扵方外逸民之間一傳而王逺知再傳而潘師正三傳而呉筠司馬子微考其學今天􅀮子之􅀁述巳盡之矣予觀天隠子冲澹而閑曠虚靚而寡欲黄老之遺論耳然而龍􅍑鉛汞抽添吐納之事未之及也豈或秘而不言欤夫以老子之􅁱道飬夀雖太史公猶不盡信又况後世之迃誣恠譎者可必得而悉徴之欤自今道家而言彼謂􅒏宗􅚨者則曰此心也必主於􅁴彼謂命宗􅚨者則曰此氣也必保其純一天人達􅒏命囙其血􅁏口鼻之粗而得與造化􅈚涬同入於無盡盡之妙此古之人􅀁以長生而不死者豈或別有其術欤不然天隠子之學亦止於是而巳欤或曰孔子甞師老子吾聖人盖尸假者也特以語恠而不言故曰述而不作敏而好古􅀼比於我老彭老則老聃彭則彭祖也雖然老子東周一柱下史耳幽王時有伯陽父顯王時有史儋夲是二人且不與老子同時老子固夀矣太史公欲合伯陽父史儋爲一人且爲老子則亦疑弗能㝎也彭祖本大彭氏國陸終氏苐三子當堯時始封又國語曰大彭豕􅅊則商㓕之注謂在武丁時自尭至武丁中興上下且七八百年亦無縁大彭之國自興至㓕止當彭祖一世世之言彭祖夀者吾又可得而必信之欤盖孔子􅀁言老彭自是商之賢大夫不謂老聃彭祖也老子甞問禮矣彭祖者竟何爲耶豈或果有飬生之說耶嗚呼吾聖人未甞言養生然亦未甞不飬生禮者􅀁以莭其動容周旋樂者􅀁以彂於詠歌舞蹈禮樂不可斯湏去身無非養也固未甞以養生言也天地隂陽闔闢屈伸之変亦何􅀁不有夫又何謂乎尸假矣哉嗚呼天隠子逺矣吾将東往海上廣桒而問焉庶㡬果有􅀁遇而必得之者耶歐陽氏急􅈬章解後序歐陽子急􅈬章一卷盖㩀元豐九域志作也自唐失其御天下分爲十數至宋而復合然猶不足以復唐世之土宇曽未㡬何南北乕争光岳氣裂兵戈日尋生靈涂击􅁅於是我朝興焉一麾而克有中原再舉而底㝎江左然當大軍百戰之後閭里蕭條荆榛滿目户口凋瘵流轉異郷雖以昔日大藩列府控制局面今則徒􅀋附庸雄城壮縣顯著版籍今則不聞建置甚者至以東南財賦之嬴而往濟西北之不足頋獨何哉嘗聞古稱秦雍為天府齊地􅀒海亦􅃅東秦唐丗頗稱楊一盖二而東西秦寖為不及宋承唐季􅅍離之緒内緫二十三路外制兩國遼淂燕雲三關之險夏制靈武河西之饒太河東圵陜西五路之民􅀊窘於兵不暇自救一旦而南􅁶呉㑹荆襄兩淮又為邉面而應敵重以山東張林李全之変淮甸空虚蜀夲㝡險平世金珠錦繡之美衣􅀍中國金房假道徒示夾攻黎嶲竒兵竟成斡腹由是兵燹相仍創殘不振則亦非復唐舊矣然惟呉㑹近畿之境自唐五代以来呉越世奉正朔保境息民盖至宋移蹕江閩嶺海之􅀁犇輳及其既亡又未嘗苦操尺寸之兵而拒敵故今人物之􅀁聚土地之􅀁産猶􅁕以為天下㝡雖􅀂一城百里之縣至或升為散州上秩以治之國家經費度支資給陸輦海運動至百萬豈民力之果􅁉哉此猶富家萬金之産田連阡陌粟􅄹倉廥要亦取之有窮用之有竭􅀄不可以富強恃而不惟安養之是務也嗚呼豈惟東南一隅雖㠯西北休養生息之餘亦不可以不深加其意矣是故當今之務欲富國者必在於養民欲養民者又必在扵重郡縣之選嚴守今之職苟重其選􅀅任之以久而可成功苟嚴其職􅀅權有􅀁歸而易集事今之世每以三􅀊為守令滿秩曽未足以一新郡縣之耳目而巳去又况用人不得􅌹辟臨事不得専議錢糧悉拘扵官而不得専用軍卒弗出扵民而不得与聞盖古之治郡者自辟令丞唐世之大藩亦多自辟幕府僚属是故守主一郡之事或司金榖或按刑獄各有分職守不煩而政自治雖令之主一邑丞則賛治而但掌農田水利主簿惟掌簿書尉則惟􅇂盜賊令亦不勞獨議其政之當否而已今自一命而上皆出扵吏部遇一事公堂完署甲是乙否吏或因而為姦勾稽文墨􅀘苴罅漏塗摖􅀊月填塞辭欵而益不􅀎以盡民之情状至於唐世之賦上供送使留州自有㝎額兵則郡有都試而惟守之􅀁調遣宋之盛時􅀊有常貢官府􅀁在用度贏餘過客往来禀賜豐厚故士皆樂扵其職而疾於赴功兵雖不及扵唐義勇民丁團結什伍衣装弓弩坐作擊刺各保郷里敵至即彂而郡縣固自兼領者也今則官以錢糧為重不容盜臣常俸至不􅀎自給或多􅂍吏兵則自近戍逺既為客軍尺籍伍符各有統帥但知坐食郡縣之租稅然巳不復繫守令事矣夫辟官涖政理財治軍郡縣之四權也而今皆不淂以専之是故上下之體統雖􅀂相維而令不一法令雖􅀂可守而議不一為守令者既不得其職􅀅欲議其法外之意必且玩常習故辟嫌碍例而皆不足以有為又况三時耕稼一時講武不復古法之便易而兵農益分遇􅀊一儉郡縣之租稅悉不及額軍無見食東郍西挟倉廥空虗而郡縣無復贏蓄以待用或者水旱洊至閭里蕭然農民菜色而郡縣且不能以賑救而坐致流亡是以言涖事而事􅁠不在於郡縣言與利而利權不在於郡縣言治兵而兵􅁠不出於郡縣尚何以復論其富國􅁉民之道哉嘗求其故自我國家起自北土絲理中原中原豪傑擅動甲兵保有郷里因而降附使據其境土如古諸侯大開幕府辟置官属錢糧獄訟一皆􅌹制扵已而不復有􅀜乎上巳而山東猘子地富兵強跳踉負固卒貽征誅殱㓕而後天下郡縣一命之官悉歸於吏部錢粮獄訟􅀋皆關白奏讞而不敢少自専焉由是郡縣守令之職始䡖而不得自重矣必也辟官涖政理財治軍四者之􅁠一歸於郡縣則守令必稱其職國可富民可􅁉而兵農各得其業矣此予􅀁謂重郡縣之選嚴守令之職者盖視唐宋之故典為然實當今之急務也於是夲歐陽子之􅀁集為䟽其古今郡縣之沿革與夫政令之設施不同者以序之雖然此固非歐陽子之意也予亦過論矣哉樂府􅀋編後序􅀄太原郭茂倩次古今樂府但取標題無時世先後紛􅅍􅮭雜摹擬盗襲層見間出厭人視聽今故就茂倩所次辨其時代且選其􅀁可學者使各成家又􅀙而論之曰古之言樂者必夲扵詩詩者樂之辞而播於聲者也太史采之太師肄之世道之盛衰時政之治􅅍盖必於詩之正変者得之詩殆難言矣乎自秦変古詩樂失官至漢而始欲脩之燕代荆椘稍恊律吕街衢巷陌交相唱和當丗學者司馬相如之徒徒以西蜀雕蟲􅂐刻之辞而欲立漢家一代之樂府傳及魏晋流風䆮盛而其􅀁謂樂者亦止於是嗚呼今之去漢則又逺矣故今或􅀚樂府之詩者一切指為古辭雖其浮淫鄙倍不敢芟夷殘訛缺漏不能附益頋獨何哉誠以古辞重也魏晋以降盖惟唐人頗以詩自名家而樂府至雜用古今體當其􅀄年江左齊梁宫闈粉黛之尚存及其中世代北蕃夷風沙戰伐之或作是則古之􅀁謂􅅍丗之怨怒亡國之哀思者而唐人之辞為盡有之欲求其如漢魏之古辞者少矣雖然漢承百王之敝治不及古唐之於漢則又不及扵漢者逺甚是故秦虢列苐國忠秉政妖淫蠱惑養成禍􅅍而天下之俗日趋於􅁦蕃戎搆難隴右䧟􅃿侵􅁜侮辱䠞我場疆而天下之勢卒以􅀊䖏於邉擐甲執兵無有休息唐之盛時雖􅀂未見其䘮敗亂亡之戚及其既衰而遂不􅀎救然則唐丗之治固有以致之而唐人之辞亦於是乎有以兆之者矣嗚呼世道之盛衰時政之治􅅍盖必於詩之正變者得之豈不然哉然而上自朝廷下至閭閻委巷苟􅀚其詩者則又必因其言辞之􅀁指聲音之􅀁彂而悉悟其心術之􅀁形氣數之􅀁至予聞唐有宋沆者開元􅈗相璟之曽孫每太常樂工奏􅇊即􅀎揣其樂聲之休咎遇有工善篳篥者且曰彼􅀅神逰墟墓􅇊雖善至尊不宜近巳而果然衆工大驚夫以春秋之丗鄭之七子嘗賦古詩而趙孟欲以􅀚其志之􅀁向然今宋沉乃􅀎以其善樂之故察人死生貴賤不遺毫􅄠何其神哉嗚呼詩本􅀁以為樂也詩殆難言矣乎今之學者深沉之思不講而講為麁踈鹵莽之語中和之莭不諧而益為􅄫寥簡短之音此其心術之􅀁形氣數之􅀁至不惟趙孟知之是皆見誚於宋沉者也予故論之使後之讀是編而欲學是詩者可不慎哉春秋􅇚例後題春秋左氏漢􅀄夲無傳者劉子駿始建明之欲立學官諸儒莫應然傳之者亦巳衆多賈景伯服子慎並為訓解及晋而杜元凱又作經傳集解三十􅃃􅇚例四十􅃃且歴詆劉賈之違獨不言服氏豈或不見服氏書乎亦不應不見也世族譜夲之劉向世夲地志夲之泰始郡國圖長暦夲之劉洪乾象暦世多言其天文星暦為長然􅀃經多依違以就傳似不得為左氏忠臣者南北分裂館陶趙世業家有服氏春秋是􅀳永嘉舊冩華隂徐生往讀之遂撰春秋義章以教學者是永嘉時猶未尚杜氏青州刾史杜坦及其弟􅂹丗傳其業故齊地亦多習之坦元凱之玄孫也姚文安秦道静􅀄亦學服氏後更兼講杜􅀃劉蘭張吾貴之徒則又隠括兩家同異義例無窮嗚呼漢􅀄習經者専門而今河洛習傳者宗服子慎江左尚杜元凱矣晋劉兆始取公榖及左氏􅀃作春秋調人而今蘭吾貴又㑹服杜之􅀃矣聖人之道不自是而愈散哉自唐孔穎達春秋正義一用杜氏非徒劉賈之􅀃不存服義亦不盡見固不若兩存之以見服杜之為孰愈也今􅇚例具在有劉蕡序蕡太和中對賢良筞譏切人主斥罵䆠者文極􅈭學一夲春秋與漢董生天人三筞相為上下蕡亦自擬董生且曰昔董仲舒為漢武帝言之未盡者今臣復為陛下言之壮哉蕡乎至為此序獨不􅀋唐文之衰至此極矣春秋纂例辨疑後題自唐世言文者一變而王楊盧駱再變而燕許三變而韓栁雖其文振八代之􅁦及見當世經生攻訓詁治義䟽則深敬之太常殷侑新注公羊退之欲爲之序幸得掛名經端以蘄不朽及􅀉詩盧仝又言其抱遺經束三傳然仝􅀁著春秋摘微一􅃃間見一二亦未甚爲學者䡖重惟子厚荅元饒州書恒願掃於陸先生之門執弟子禮㑹先生病子厚出邵州竟不克卒業先生盖河東陸淳元冲也與子厚同郡且云先生師天水啖助及趙匡知聖人之􅈲兼用二帝三王法至先生大備春秋集注纂例辨疑微􅃌䓁書苞羅旁魄轇轕上下一出於正於是乎春秋有啖趙陸氏之學住予北㳺亰師始􅀙國子學見陸氏纂例十􅃃是金泰和間禮部尚書趙秉文手夲太原板行後又得陸氏辨疑七􅃃微指二卷而集注久􅏱自唐世學者􅀃經一夲孔氏正義及宋之盛􅀃者或不用正義六經各有新注争爲一己自見之論而欲求勝扵先儒巳成之􅀃宋子亰傳唐書猶不滿扵啖助者豈啖助實有以開之故欤雖然啖趙陸氏未可毁也後之學者自肆扵藩籬閫域之外口傳耳剽而不難於議經者必引啖趙陸氏以自解是或未之思也夫春秋折􅂨後題自西漢學者專門之習勝老儒經生世守訓詁不敢少変􅁇而舊􅀃日以磨㓕新傳之後出者獨傳於今春秋一經始立公羊氏學又立穀梁氏學東漢左氏學又盛行古傳後出者日勝後􅚨注古傳而世亦取後出者為宗公羊氏有胡母生嚴彭祖顏安樂而後何休獨有名榖梁氏有江公尹更始而後范􅇞獨有名左氏前有劉子駿賈逵服虔後有杜預故預亦獨有名嗚呼豈預必􅀎為左氏忠臣哉休固陳蕃客也自謂妙得公羊本意故今有公羊墨守十四卷榖梁􅆸疾三卷左氏膏肓十􅃃北海鄭康成獨反之學者多篤信康成今猶見􅇞􅀁集榖梁解又服雯自有左氏􅇚痾一卷不見也雖然公榖左氏三家之􅀃後出者皆傳扵今殊不知胡母生江公劉子駿諸人復云何也藉令諸人􅀁􅀃不􅆸至今並傳孰􅀎有以大公至正之道一正之哉不然猶治􅅍絲益棼之也訛日以訛舛日以舛不以聖人之經􅀚經而徴諸傳不以賢者之傳解傳而又徴諸何氏范氏杜氏獨何歟幸今三家之說尚未泯則唐陳岳之折􅂨此也庶有得乎盖昔漢儒甞以春秋㫁獄予謂非徒經法可以㫁獄而獄法亦可以㫁經何者兩造之辞具備則偏聴之惑無自而至矣􅀭子雲曰衆言淆􅅍折諸聖讀春秋者曾不明漢晋諸儒之遺論又何貴乎學者之知經也哉春秋權衡意休後題劉子作春秋權衡自言書成世無有􅀎讀者至意林猶未脫藁多遺􅊴盖昔左氏言孔子作經􅀙諸國赴告故又愽採他事以附經今劉子乃據閔因叙謂聖人悉徴百二十國寳書傳者􅀙之􅀅當時諸國􅀁赴告者各有書也抑此豈即墨子􅀁稱百二十國春秋乎東遷以来晋有乗椘有檮杌魯有春秋秦世家文公以後始有史以紀事王道衰諸侯力政二百四十二年之間凡經傳之可見者一百一十七國晋地理志且引夏商時國二斟豕􅅊過戈之属非周舊也齊桓晋文之盛朝聘盟㑹侵伐敗亡者無慮數十而附庸小邑蠻夷雜種又豈悉有書可徴乎史稱魯君資孔子之周因老聃觀書周室且歴聘七十國又云與魯君子左丘眀觀史記自􅀮公訖于􅀗麟要之春秋固魯史也因麟出而虚其應故取而修之非夲書獲麟者􅀁書周室事亦鮮無􅀚周史孔子丗家孔子甞往来齊宋衞陳蔡之郊晋故霸國也聞趙簡子殺竇犫鳴犢至河而弗渡椘亦欲以書社七百里地封之子西靳不可又􅂺反扵魯􅀅􅀁聘者又未必有七十國也然亦何暇悉徵其書乎墨子戰國人妄稱有百二十國春秋耳非聖人之遺言也何則杞宋王者後爵称公皆大國也宋頗存王禮而杞乃以辟陋而用夷孔子曰文獻不足故也足則吾䏻徴之矣唯古之官名得之剡子它無見也雖然聖人作春秋但囙魯事以寓王事隠桓之􅀄王政不行而魯與齊鄭宋䘙交齊桓肇伯而魯事齊晋文􅁇伯而魯又事晋襄昭以降伯統􅀅絶而魯又事吴椘故經之􅀁載􅀋不出此數國事然則春秋固魯史也魯史􅀁不載聖人誠不得而筆削之又何待悉徴百二十國之書乎嗚呼閔因之􅀃是亦無徴而弗信者矣春秋通􅈲後題自宋季徳安之潰有趙先生者北至燕燕趙之間學徒􅀙者殆百人嘗乎出一二經傳及春秋胡氏傳故今胡氏之􅀃特盛行胡氏正傳三十卷傳外又有緫貫條例證據史傳之文二百餘章子寜集之名曰春秋通􅈲輔傳而行當胡氏傳春秋時光堯南渡父讎未報國歩日䠞􅀅相大臣去戰主和寖忘東京宫闕西亰􅁜寝而不有者是故特假春秋之􅀃進之經筵且見内夏外夷若是之嚴主辱臣死􅀂是之酷冀一悟主聽則長淮不至於自畫江左不可以偏安此固非後丗學春秋之通論也然而胡氏傳文大槩夲諸程氏程氏門人李參􅀁集程􅀃頗相出入胡氏盖多取之欲觀正傳又必先求之通旨故曰史文如畫筆經文如化工若一以例􅀚則化工與畫筆何異惟其随事而変化則史外傳心之要典聖人時中之大權也世之讀春秋者自䏻知之同不可以昔者歆向之學而異論矣趙先生者諱復字仁甫國􅀄南伐攻徳安潰之仁甫遭擄遇姚文獻公軍中文獻與言信竒士仁甫方以國破家殘不欲北且蘄死㑹夜月出即迯乃亟􅀍鞍躍馬􅃅積尸間見其解􅄠脫􅋰仰天呼泣盖欲求至水裔而未溺也文獻曉以徒死無益乃還然後盡出程朱性理䓁書及諸經傳故今文獻與許文正公遂為當代􅚨宗仁甫為有以彂之也先正有云世之去聖日逺故學者惟傳經􅇰難仁甫當天下擾攘之際乃䏻盡彂先􅚨傳䟽而傳之不亦難乎上在濳邸嘗召見曰我欲取宋卿可導之乎對曰宋父母國也未有引他人之兵以伐父母者故仁甫雖在燕久常有江漢之思誠􅀂是則吾仁甫亦無愧乎胡傳之學矣淵穎呉先生集􅃃之十二
