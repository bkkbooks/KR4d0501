body:
  text: 淵頴吳先生文集序太上有立徳其次有立功其次有立言三者不同苟有焉皆足以立乎天地之間而無愧於為人矣自丗之言者陋文章之習而髙徳行之士伸一人於千萬人之上其意􅀅以懲夫末流之敝云爾非􅀁以顯道神徳行也古之聖人徳脩於身矣而又欲天下皆如吾身之脩也豈惟天下皆如吾身之脩哉而又欲後丗皆如吾身之脩也天下盡乎人矣吾身可以及之後丗非止乎今也吾身烏得而及之是則吾徳之􅀁􅀍而吾功之􅀁樹者亦斬矣然聖人必欲使天下後丗皆有以及焉則立言其可少哉六經聖人之文也􅀁以為天地立心為生民立命為萬丗開太平者非細故矣由是以降苟非申韓之刑名管商之功利儀秦之捭闔孫呉之隂謀楊朱墨翟老莊􅇚氏之􅁋辭邪􅀃則凡是非不詭於聖人者其於人心丗教豈盡無􅀁禆益哉翰甞讀賈諠董仲舒之文而恨當丗不能盡用及觀揚雄之太玄法言又歎時人少有知者以為豪傑之不遇大率如斯故不待論其言之傳否而深為有國者惜之南北混一以來朝廷太平之治垂及百年仁恩福澤結在人心而紀綱法度􅎊不能無弛先生當延祐天暦之間甞慨然有志當丗之務矣其擬諭日本書蓋其十八時􅀁作也人謂其有終軍王褒之風其論守令鹽筴楮幣事逮今十有餘年執政者􅁵而正之徃徃多如其􅀃先生析辭􅃌事援筆頃刻數百言馳騁上下要不失乎正雖處山林未甞忘情天下使其在官守言責之列推眀古者􅀁以立極成化之道為吾君吾相言之當不止是也而先生命不與時偶器不求人售素又羸弱多疾未中􅀊而蚤卒今之著于篇者殆猶未盡其緼也初浦江有宋儒者曰方韶父先生師法為學宻院都事前進士青田劉基序浦陽仙華諸峰蒼翠萬仞其嶄絶峻㧞之形瑰詭䧺特之状金華北山不能過也故其氣之清㳤􅂕秀蜿蟺磅薄而鍾為名世文儒者固宜有之若存雅先生方公翰林待制栁公則其人也最後深􅒁先生吴君立夫出焉立夫氣禀尤異負􅅸倫之才自其少時讀書日記􅁆千百言下茟為文如雲興水湧二先生深􅀁畏愛者也故方公以孫女妻之而且盡􅀓其學焉凡天文地理井田兵術禮樂刑政隂陽律暦下至氏族方技􅇚老異端之書靡不窮考含其英咀其華扵經史之學益研精䆒其指歸故彂為議論文章滔滔汨汨一瀉千里如長川大山之宗夫海嶽也如千兵萬馬㗸枚疾馳而不聞其聲也嗚呼壮㢤他人恒苦其淺陋立夫獨患其宏博者也庸詎非仙華神秀之􅀁鍾而能若是耶惜其蚤世莫淂少見于時僅嘗一用春秋薦不弟遂隠居講學􅀙逰甚衆凡經指授悉有可觀扵是大肆其力扵學問文章而卓乎不可及矣嗟夫彼其僥倖一官乗時射利而無片言􅃗字可􅀓于世者其視吾立夫䧺文偉論馳騁于司馬子長劉向揚䧺之間者是果孰為失得㢤必有能辨之者今門人髙苐宋君景濂不忘其師子雲之侯芭昌􅀺之李漢也􅀵拾遺文若干卷徴予序引夫文豈待序而􅀓者㢤然玉韞石輝珠蔵川媚異時僊華山下有光燭天者必遺文􅀁在也尚何患其不􅀓㢤承事郎太常博士􅆀仕東陽胡助謹序淵頴呉先生集序人之􅀁以成名者三曰道徳文章技藝皆不可以無師道徳以為之根榦文章技藝以為之葩華枝葉生而知之者間世或出人不能皆也苟無師焉如矢之無弓如汲之無綆如醫之無方如車之無御如越人之燕而無為之導矢無弓雖見而不􅀎造汲無綆雖欲而不能得醫無方雖知病而不能療車無御雖有馬而不􅀎同越人之燕而無為之導則不阻扵江河必迷扵岐路雖抗其心神羸其筋骨終不􅀎以徑達故噐備矣必諧之以律呂然後可以成聲音物有矣必􅀅之以禮樂然後可以致􅄦神兵足矣必律之以曲制然後可以平邦國是故摶土為尊而畫之與犧象不異而不可以盛酒未嘗由乎鈞陶也削木為弓而􅃮之與彤玈不異而不可以穿革未嘗由乎􅕍括也人之欲成名而無師焉亦是之􅀋矣予甞悲今之為文章者皆不如古及見宋君景濂而心服之甞為敘其文集以命後進又每慨歎輿圗之廣生養休息非一二世何太平遺老􅈬盡漠乎無有􅁇者而天獨私扵宋君也及今年宋君以其師呉先生之遺文若干卷示予予一讀而駭再讀而敬三讀而不知神與之接融融瀁瀁不知其旨之樂之詠之歎之也扵是乎乃知宋君之􅀁以過人者有自来也昔者孟子謂離婁之明公輸子之巧不以䂓矩不能成方圎師曠之聦不以六律不能正五音堯舜之道不以仁政不􅀎平治天下唐栁子謂今之世不聞有師予雖與呉先生同為浙東人而各里其里無事不相来往不及見吴先生今得偶宋君扵覉旅且囙宋君而得見呉先生之文乃知浙河之東以文章鳴扵世者無時而乏故竊自慶而為之序且陳其不可無師之􅀃庶有禆扵後来者㢤文林郎江浙䓁䖏行樞者􅀁宗知名之士如侍講黄公待制柳公皆出其門晚得先生􅀹竒其才而以斯文望焉先生貌􅃦陋言語􅀂不出諸口而敏悟過人得於天性少甞從族父㓜敏家􅀼取書觀之族父知而叩之靡不成誦博聞强記與之㳺者皆自以爲不及㑹有司舉進士遂以春秋中郷試北至燕東浮于海好爲􅉞竒雄偉之觀見人固守章句意頗陋之然則先生之􅀁負抱者爲何如哉惜其學不見於用而丗之知者鮮也門人宋濂懼其泯而不傳廼彚次其詩文爲集􅀂干卷俾翰爲之序烏乎翰昔受教於先生􅀼觀先生之􅀁以用其心者期以立乎天地之間無愧於爲人焉耳烏暇較一丗之短長哉故論而序之信是集之不可不傳也先生諱萊字立夫至正十有二年秋八月二十六日門人金華胡翰謹序淵穎呉先生集目録苐一卷大㳺賦觀日賦羅浮鳯賦歎疾賦起病鶴賦狙賦定命賦尚志賦索居賦貧女賦苐二卷觀星君像圗讀列子雜題送鄭獻可并􅀉周公甫􅀚宋季崖山事蹟早秋􅀉宋景濂泰山髙􅀉陳彦正胡仲申至觀景拄杖歌􅀚鄒嶧山刻石墨本讀謝玄卿遇仙記送鄭氏􅅩姪北㳺應仲章􅀉書至題富春􅀜􅀅軍廟題張麗華侍女汲井圗題寳津􅀐士校馬射圗題姚文公草書杜詩問五臓題清莭䖏士卷白髪辭黒海青歌􅀚林霆致日經大食缾時儺大人自􅊐南囬望黄眀逺墓宜􅄥子觧渇水歌六祖蔵髪甕子圗歌聽李仲宏􅀃石門貪泉北方巫者降神歌花蘂石茟架歌題醉􅅮乕圖題巴船出峡圗􅀚眀皇羯鼔錄􅀚古鏡記夘山石螺子歌􅀚龔氏􅀁脩古棋􅀴劉無雙歌倭人摺疊􅀞扇歌題劉琨鷄鳴舞劒圗讀書飲酒黄布幬歌夜􅀚古樂府憶黄眀逺􅀚沈玢續仙􅀓􅂵􅁝盛露嚢歌題蓮葉舟及海槎二圗憶方子清椀珠伎宋度宗書慶夀宮扇􅀚吴中􅄂詩及愽古圗憶吴伯雍摘阮􅀉歌苐三卷蜂分客夜聞琵琶弹白翎鵲陳彦理以石􅀴見􅀉見園丁􅅞花題􅂵芝圗題張莭婦卷題東坡載酒堂貞女引得大人書賦􅀉宣彦昭次栁博士五􅂥紀㳺韻效方子清儂言題承氏家蔵古錢送宣彦昭北㳺白鼻騧宋景濂㳺五洩題潘莭婦卷送鄭浚常北㳺喻東泉學道止酒次栁博士􅀉友詩韵􅀚禹柏圗􅀉吴正􅀓􅀚掖垣日記送樓彦珎并􅀉宣鄭二生賦􅀘怛洛迦山圗送俞􅀚光赴調亰師送宋景濂樓彦珎歸里登卧龍山望海亭脉望詠小児髙馬圗浦陽十景雨晴盜彂亞父塚劉龍子歌劉仲卿上昇歌聽客話呂安撫夏貴雜事衞􅀅軍歌五洩可築室賦此属陳彦正題宋綬㬌徳鹵簿圗􅀟林觀傅大士頂相題護法寺壁枯木㳺金華山三洞謁抱朴子墓秦皇繫纜石叅􅋁泉謁王右軍遺像陽眀洞次胡仲申雲門紀行韻花園老卒歌讀趙江漢舊事讀穆天子􅀓題􅀞墨梅題林塘秋晚圗苐四卷宮人戲嬰圗粤山白鵲聴揚元度􅀃宣和内宴􅀉喻國輔張宜之閱李鐵槍本末讀漢武内􅀓題温日觀蒲萄懐戴子夀􅀉翁君授眀月泉􅁻祥寺病齒王滹南太山石室閱先賢圖及漢雜碑􅀉陳生題鄭北山雪竹賦西域種羊皮書褥歌􅀚管子内業題漢一字石經和陶淵眀咏貧士望會稽山次定海候濤山泊道隆觀次韵姚思淂泛海書􅀁見初海食望馬秦桃花諸山􅀚張循王􅀾䖏人問海上事以詩荅之讀叅同契􅀓子建夢淂句為續此詩聞虞紹宗為文學􅁺杜䳌行題韓蘄王湖上􅀐驢圖萝巖南老人山中人尋􅇚子若空不遇畫馬行效梁簡文宫体桺博士訪宿山中送俞子􅄾赴鄱陽柳博士示欎金三脊茅蓍草三物江南曲鞦韆行讀諸子荔枝行􅀉王善父明月行􅀉張子長書都城舊事姑蘇臺歌􅀉方飬心遣兒諤就學􅀚梁四公記書忠忠蕳公家􅀓瓊花引哭妙觀上人婁約法師玻瓈瓶歌昭華琯歌古侠客行觀昭􅁜六駿圗東呉行女殺乕行揚子江頭遇仙行送典史楊文仲烈婦行月出東林窓上疑梅花影秋日􅄂詩和黄明逺栁林罷獵都城寒食􅀙丞相花園入慶夀寺漷州滄州次韵􅀓適道乕陂閘舟中思仙詞乗月渡荆門閘新開河口望東嶽皂角林􅀚劉錡戰䖏風雨渡楊子江送方飬心歸餘姚聞胡汲仲先生没􅀉栁博士􅀉吴正􅀓一咲范蠡宅烏震古錢聽客話熊野山徐市廟題青山白雲圖題李西臺詩苐五卷論倭形釋改元論改元論下秦誓論上秦誓論下孔子不貶季札論與黄眀逺論日夜食書苐六卷与黄眀逺論左氏二事与傅嘉父論杞讀戰國筞讀韓非子讀公孫龍子讀孔子集語書張良􅀓哀喬生辭哀張生辭哀趙季良辭李仲舉岑尚周哀誄哀史生辭哀趙子有辭朱氏新注隂符􅀴後序苐七卷与黄眀逺論樂府雜􅀃三墳辨伯夷辨樂正子徴鼎辨甬東山水古蹟記周正如􅀓攷序古職方錄序古職方錄後序関子眀易􅀓後序妄箴躁箴敖箴惰箴塩官箴庸田箴韶石銘秦坑銘春秋臺銘磻溪銘試劒石銘􅃖􅀹賛盜跖賛季子觀周樂頌漢武帝射蛟頌百里奚讃接輿賛古碣石辭許先生哀頌張定􅀓苐八卷釋迦方域志後序春秋繁露後題胡氏管見栁宗元封建論後題大樂玄機賦論後題續琴操哀江南大蜡樂歌辭黄􅀮君哀頌􅀚生堂銘樓玉汝墓碣苐九卷古琴操三彭􅀓潘生􅀓韓䝉􅀓􅀓氏夏小正注後序南海山水人物古蹟記苐十卷讀唐太宗帝􅚘詰玉靈辭竄宜楙辭􅁑天氏牛尾八闋樂歌馬仲珎誄春秋胡􅀓補􅀃序吴氏􅀾國筞正誤序石陵􅌼氏雜著序苐十一卷石塘胡氏文抄後序范氏筳篿卜法序唐律删要序儉觧春秋􅀓授譜序春秋世變圗序春秋舉􅀓論序孟子弟子列􅀓序宋鐃歌􅀐吹曲序苐十二卷桒海遺録序古詩攷錄後序陳氏大衍易數後序泰階六符􅀴後序王氏􅚘圍要訣後序天􅀮子注後序急就章觧後序樂府􅀋編後序春秋􅇚例後題春秋繤例辨疑後題春秋折衷後題春秋􅁠衡意林後題春秋通旨後題附錄一卷淵穎先生碑謚議淵頴呉先生集目録右先公遺槀以卷而計者賦一詩三文則八総為一十有二而目録附錄别又各為卷先公平生銳意立言雖疾病􅅶緜而未嘗一日廢其業故其蕳編日􅄹而月繁先公之殁至是盖二十六年矣中更兵燹之變士諤恒􅀒之以竄山谷間然􅄑靈物撝訶單牘片削皆無霣墜今干戈稍定士諤與弟士謐年皆半百䈥力日衰恐一旦即死愳或􅆀泯没輙謀思有以刻諸梓先公之門人唯金華胡翰仲申宋濂景濂􅀙㳺為最乆仲申逺寓太末莫克􅆀之適景濂抱疢家居因槖其槀以屬焉景濂遂摘其有􅀜學術論議之大者以􅀁作先後為序備勒如上餘未刻者其多不啻三之二物力單微而不􅀎俱也復繕謄之以蔵于家嗚呼先公之文可謂至矣語其深厚則海涵而地負語其變化則風霆行而蛟龍升語其雅且古也則商敦在庭而竹書出冡四方之士􅀋能言之有非末學之􅀁能盡賛唯刋騭次苐不可不知也囙僣陳諸萹首以諗夫後之人焉男前婺州路金華縣儒學教諭士諤再拜謹識金華後學宋璲謄冩
