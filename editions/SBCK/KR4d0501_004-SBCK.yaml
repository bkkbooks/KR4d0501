front:
  text: 淵穎吴先生集􅃃之四門人金華宋濂編
  hash: sha256:79d3de09170250e57a44e9308a99cd72d5e139b7255dd89b53ef3f3ba664ed4d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_004-1a}
body:
  text: 古屏上宮人戯嬰圗我愛古宮掖岧嶤􅇒碧空羙人拂旦起殘月愁簾櫳小鬟捧香立飄作烟霧􅄥弄嬰偶一咲舞鶴遽來同新花正炫晝側手碎繁紅亦有􅀟蛱蝶踉蹡撲深叢豈其聖賢書行墨曾未通儼然􅂁笏具意氣早稱䧺云胡歉汝内但􅂑華厥躬塵凝孔鸞扇綉蹙鸚鵡籠紛紜争旗鼔出入雜冠童凡諸􅃧玩物色色各論功太平忽巳久天地廽春風能群禮序鴈􅅸妬詩歌螽常嗟汝齒壮得不苦乃公却令十六院弗及少􅀙戎心知一以痼鼻息徒長虹世故多變易家居果癡聾惜㦲歳月老千里吹蒿蓬為撫腰下玦烏啼洛城東粤山白鵲陳彦理同賦粤山白鵲何毿毿今􅀁驟見古􅀁談滿地蓬蒿出復沒凡禽豈或同鳩䳺如何天然有此潔直以日浴無餘黔金精煉成向月窟縞夜飛過􅇒霜潭靈湏駕河恍若一静欲繞􅀣驚能三玉臼藍橋質巳蛻霓裳水殿神猶酣休徴不使畢弋得異羽未許樊籠諳􅒏耿終随䖏士􅀓音和盍趂弥陀龕鴻䧹寒門但郷北鷓鴣祼壌空思南晋人禽經此或載蕭氏瑞志吾􅀅叅情知太古至徳世謂巢可俯􅑹可探投詩與君且一􅀏􅄑勿緇涅令渠慙夜聽楊元度􅀃宣和内㝠雜事北風吹庭柯秋士􅆭不恱頗懐炎徳衰一旦幅貟裂當思付􅂌重但孕驕􅁋􅖈中宮日沈湎内􅇊增舞列聖人自鳴筝丞相齊按莭竒花入綱運法酒􅀙流歠􅀞圗恍有見帷薄知甚藝辭寕廽波奏賦豈好色設君心既巳蕩國歩驚欲蹶妖狐空獻顰倖䑕不塞穴坐令汴河冰變作燕塞雪玉鉉乃一震金甌可無缺由来治􅅍間一是興亾轍豐侯早著戒褒姒竟為厲乹坤獨不大甕盎相起滅扵兹聞十愆得不仰前􅈒􅀉喻國輔張宜之手挾殘編只蠧塵山林著我最閑身槁梧可㩀暝湏熟華􅁰雖亡􅀘欲真危坐但看燈作暈逺㳺還􅁴劍生鱗相思正是多風雨滄海無涯可問津檢故庋得故洪貴􅅩􅀁書李鐵槍本末􅀉洪徳噐天地昔未一朔南遂分􅆠中原乆䘮􅅍白刃皎如霜李全本崛強手挟但鐵槍山東數十城叱作古戰場茫然即㫁指設􅊎如刳羊一朝與旌節正面􅀅假王云何引盗賊遽尓升堂隍豈其弱能立當彼驕則亡日落山海暗群龍血玄黄陳安偶􅀙晋侯景徒旤梁扵人欲使詐在國湏謀長大福豈無妄佳兵終不祥誰令送死䖏竟以抱甲僵漢盤忽巳折周鼎􅃚能常吁兹撫舊墨我涕徒為􅒔俛仰千古意悲風嘯枯桑讀漢武内􅀓􅀉戴仲㳺我問學仙子神仙何􅀁求翩然王毋使特降五城樓白雲起復㓕丹掖戒􅈵秋黄麟雜赤乕旌幟欎蚴蟉上元三角髻聞命亦来㳺玉女列左右容眸眄如流神光乃上爥衆樂彂空謳益易尚可化奢􅁋直難抽􅀙知扶廣受或用柏梁􅀵五嶽􅄱巳秘靈飛籙仍幽毋􅀅刳尓命但欲返諸柔一洗狐鳥爼長辭蟪蛄丘向時恍有見方士殊悠悠平準暴海内彂兵困遐陬琪花栖倒景瑤草隔玄洲終成泄道要寖使增愆尤鄙夫忽自咲穨俗奚其媮機􅀜出鬼蜮利欲生螟蟊崐崘一萬里得去􅄼能㽞為尓遣此什塵簮早湏投同喻國輔題人温日觀蒲萄佛者本西域蒲萄亦来西柰何此善􅀞無或渠􅀁携我曾考其故􅀄與漢使偕上林乃有館葱􅊐何湏梯天時自不同地氣忽以迷結子且磊磊懸藤更髙低先㡬日巳露薄徳不及稽終令白㲲像逺􅀙雙狻猊􅀙兹故國木伴尓禅家栖幽心恍有得爛墨研為泥宜㢤一揮灑遽若無町畦依稀可少辨變作天􅄬蜺萬古空朔色南山竟朝躋􅀞工尚逸品㳺戯徒筌蹄豈伊吾無人何往非耄􅌼豈伊吾無物桃李緫成蹊此皆外􅀁産敢與中州齊為尔撫此卷長􅁔欲驚嘶歳晚懐戴子夀就􅀉翁君授東南大海吹長波􅅍山㡬曡堆嵯峨我􅀁思􅀆欲如何戴子謂我不我過四眀學官列象犠書則稽古詩猗􅄼六􅀴聖髄工漸摩倉頡字林考􅀠科青燈掛壁豈有他黄虀苦澁餘醎鹺平湖沆瀣足芰荷目力可及彂詠歌慈溪先生雙􅁂皤小出乃為礼􅀁羅曲䑓淹中􅁍不頗擩嚌道真得者多先生昔曾舉漢科我亦同徃超江河仰窺天門光可劘豁然叱落千丈坡就中乖龍卧為梭掀雲噴雹輸蛟鼉吕梁懸水無盤渦况肻遽數􅈉與蠃彼㢤貧女凝秋蛾地窄袖短空傞傞郄鐘毁釡不必和靈談􅄦嘯衆􅀁呵北行何有塵沒靴南歸詎可夢駱駞一朝竟撤碼碯珂獨立吾今衣薜蘿芝湌竹飲皆沉痾十載未復仍委蛇先生一再来揮戈坐􅀅挾箸嘗其膰大松偃蹇徒髙歌小草樂育尚菁莪清廟梁柱可堊磨萬世學術􅀙丘軻文風自振祛煩苛士論况辨仡與番分正句讀嗟吾訛丘園嵗暮猶婆娑明當沭􅄠陽之阿􅀙公共飽天山禾更不去理墻頭莎浦陽舊有眀月泉乆而不應今乃䟽道其源似頗與弦望晦朔之間相為消長者遂作是詩大區何渾淪元氣乃潜洩忽然為山水無往不融結遥天偶一照􅌋地空餘冽盈􅀅光共生涸與魄同滅玄機自消長至理誰圓缺彂揮雖有在窺測尚未决枯查曾㡬棲斷洑遽中裂半􅀝嵐翠雲微通海潮雪昔人来推求扵此淂表蕝虗亭奚其敞静甃獨不囓歳年竟悠逺沙石漸填􅍋寕加䟽瀹功肯使見聞䙝恍疑合圗􅀴環坐到稚耊倘非􅈉投碕㡬􅀋鮒䖏轍纎纎浮晶彩湛湛浸􅋁泬舊􅀚方尓還真源可吾􅓟争言彼月行豈為兹泉設蕭丘胡長寒漢井或再熱逝尋白兎公直探神龍穴狂歌水仙詞擊碎如意鐵吉祥寺一昔逢寒食行吟採物華風生􅃻檻竹雨濕堕船花曲塢青龍樹長灘白鷺沙囬看江上水直去到吾家病齒我生本多病一瘦恒踽踽試問玉隴君何為忍吾苦自其初齔時排次巳不伍毎聞編貝如方朔僅虗語信㦲骨之餘􅀁託車與輔舌神乃中居猶賴汝疆圉有身竟攻殘元氣徒啙窳母庸蠧斯蝕尚謂剛可吐尋常薄滋味勢不勞吞咀麄殽及硬餅錯列空七爼豈伊􅀋門樞不動固先腐軟糜􅄑能湌梨栗稀復睹我思天地間民物揔胞與尓自本属吾安􅀎遽秦楚齟齬或更生華池仍彂乳當樅真我師為􅀃養生主今年吾壮強三十逾六五更後三十年零落何足數起呼白驢公堇酒且酌􅂑誰欤劉師服髙詠􅂓戯侮王滹南太山石室我􅀅呼巨鰲滄海欲掀播扵兹玉鼎淪遽使金甌破兵氛塞中原卦氣恊大過誰封凾谷􅀜便掃太微座長矛左右盤劲矢五十箇歌鳳㡬能来􅘳騾吾得莝當其一手麾豈止千夫和力須坼老拳事且居竒貨真儒雖有材用武竟無佐青雲飛遐心白羽洒寳唾撫時乃紛綸結客仍轗軻人生􅁕窮通世故更弔賀熒然凍霧中仰見眀星大宜哉泰階平返汝雲壑卧専門尚吾醇致幣徒尓蓌既爲梁鴻逃復戹龔勝餓􅀙知大耄嗟肯以􅁋威挫抆淚且泣歧聞風猶起懦滹河自波濤石室今堀堁寥寥紓我哀苦語不成些樓光逺出示先賢圗像及漢季石本雜碑世人不好古我獨思古先居然圖像間得見古聖賢逺之或千載近亦數百年精神果何在面貌猶爾妍凡民一其生覆幬乃同天紛紜日就滅委棄随烏鳶矧兹丹青筆巧􅀋造化甄惟心却不死匪繪尚能􅌹豈伊祝畏壘仍似􅀞􅇒􅃄衣冠􅀙代改爼豆與周旋前人後􅀁哀後者復爲前展轉哀未盡蒼茫但長川我今己後古古碣空餘鎸水石乆欲泐蛟虯起相􅆞當風遽堕淚詎减峴山巔庶以名徳在終爲日星懸􅀉陳生落日未落山􅢋􅢋我􅀁思􅀆抗嶄巖豈其徒行固不可亦有健馬可着銜胡然獨䖏不我即坐以魯史攻詀諵更疑弄茟彂古帖先漢癈碣求鎸劖扵兹孰不我傾倒但或嗜好殊酸醎結交似子乃有得肯使繫属非斿縿今年一出本浪􅀾滿地挿棘疇能監􅎷盧大劍區冶鑄靈􅄦夜泣蛟龍函早是鉊銛不我辨彎弧􅔄用窺熒􅍴縦尓竒文聚怪鷸政如􅅸力鞭神羬邯鄲道上尚故歩我要我襋空餘㩥母寕容刀與墨水柱使衆口相爲䜛秋風吹江晚正急薄暮􅈳去懸蒲帆自期共作制勝䇿酷􅀋田父􅀵盧㺥杏花一色直不逺繡線巧蹙行春衫黄精苗枯不足惜白木敢負吾長鑱嗟㢤鹵莽又滅裂但有荑稗無人芟待教􅀅投乃壷哨猶􅂲未陳即鼓儳參乎賜也必貫一曰啖曰陸俱通凡尋常可力自不力不畏天顯兼民嵓子来不来我亦别深褭深䖏多松檆臨萹草草遽報我愁思滿臆何庸緘􅀉相仲積求􅀚鄭北山雪竹賦并􅀞卷古人不可作雪竹有竒思鄭公詠騷詞或者攻繪事向來拈筆間才士巧相值誰􅀙嵗寒窺便得瑚璉噐東國正擾攘靖康更元二上天忽同雲大地惟朔吹玄隂知巳凝積羽忍不墜狂曾鵝炙求困及蟻􅄴饋離眀乃煌煌劲莭特一致􅁗􅀜􅀵甲兵蜀閫擁旗幟毎疑一寸心長挺千畞翠學行尚吾時窮達䓁墨戯相君本弥甥年耄常拭眥自應守遺文重襲在篋笥滿山蒼竹林凡木緫顦顇因之􅀉君詩為洒懐古淚西域種羊皮書褥歌􅀉李仲羽波斯谷中神夜語波斯牧羊供雜虜當道剚刀羊可食土城留種羊胚骨四圍築垣聞杵聲羊子還􅀙脛骨生青草叢抽臍未斷馬蹄踣鐡繞垣行羊子跳踉􅁍在草鼠王如拳不同老飫􅁏筵開塞饌􅏂裁皮祳作書林寳南州侠客遇西人昔得手褥今無倫君不見冰蚕之錦欲􅄹尺康洽年来貧不貧同方子清􅀚􅃹子内業之人東隣居為彂架上齒吁嗟管夷吾遺我以内業古書本少見古道終不跲遺文久灰燼􅃈語特枝葉為儒每更端務學多渉獵逺馳盍求心近眩􅀅失睫紛綸諸子間變􅅍聖王法百家各為主一理寕足攝彼㦲􅀁施教何得不我恊士郷自冝然伯政吾甚捷當其觧而囚豈謂射中脇利源魚鹽開兵武劍㦸接私疑聃荘言或混孔孟牒􅄦神通幽奥詩禮借光曄操存􅒏情常食飲精􅂔浹扵焉覈天人不獨滕齒頰楊朱􅀃力命列子亦巳雜管氏役􅁠謀聖門詎容躐茫茫大江流可望不可楫朝来有微雲􅁍􅀝青岌嶪陳彦理有漢一字石經云是王魏公家故物予得其六紙盖石文剥落者太半紙尾猶存蔡邕馬日磾字先聖去巳久世􅀓惟六籍後儒各専門穿鑿多變易蔡邕在季漢章句攻指擿八分自為書刋定乃勒石太學諸老生講論頗充斥逺方競来􅀚摹倣無不獲東亰忽䘮􅅍盜賊恣跳躑古碑四十六兵火空餘迹熹平㦄正始洛土重求索衛侯師邯鄲三體精茟畫煌然立其西學者常嘖嘖史書竟差舛一字㡬不覿北都如遷鼎西國􅀋蔵璧䂡柱或淪亡随宫猶作磶扵兹特􅀠科早巳䓁瓦礫寕知一字遺不與中郎隔唐人試書學小學彂光􅄨魏公蓄紙本六􅁓忍捐釋糢糊千莓苔紏結萬􅔼蜴聖文空往燼聖髄尚餘􅄋粤􅀙秦以来儒術經五厄到今厄者㡬日月愈輝赫甚㢤石為􅀴争似􅀴在壁此石不獨存吾心竟誰惕和陶淵眀詠貧士長吟望天地宛轉無􅀁依豈不有達者窮櫩少光輝此心未􅀎信何力求奮飛生雖百夫特死共一貉歸行尋靈芝草不救歳晚飢去矣甔石竭焉知溝壑悲大道忽巳䘮翻然念羲軒今我去之久十年躬灌園存者耿日月餘如飄風􅃄身名易汨沒文字勤磨研磨研何􅀁事先覺有遺言楊朱談力命列子亦稱賢山日凄以夕起弹緑綺琴清㢤積雪曲自昔無知音世間紛且擾貧與憊相尋春江變作酒野鳥令人斟敝衣時􅀁棄華駟衆争欽不有丈夫氣徒為行路心上天無停曜日月會降婁山林少過轍二鳥鳴相酬亦有五采鳯飛来為岐周􅁎公世不作白屋多懐憂逢時倘一用華士非吾儔函谷空逐客傅巖乃旁求人生自沉静豈得非意干宜㢤􅀭執㦸三丗不徙官窮冬無完􅄄盡日止一餐美芹終不獻晨曝尚餘寒手種老松樹蒼然霜雪顔政尓有佳思清風吾掩􅀜舉世尚馳騖飄如風中蓬上書爭眩鬻言語自稱工誰歟持清莭乃見楚兩龔黄塵随手掃白月與心同有榮方覺辱無屈豈求通誓追遼海鶴挿翅以相􅀙少小負竒志常思􅀚九州垂成捨冠冕去結巢許儔朝餐秋柏實夕漱醴泉流長貧士之常獨往非我憂求馬但得骨尚䏻千金酬日望芳草長毋煩怨􅂕􅁱望會稽山自我行至越囙之成越吟會稽乃巨鎮䧺拔天東南東南誰􅄏闢大禹世􅀁欽外夷鳥嶼接支子祧廟臨磬鞀或聲諌欙橇惟力任􅀵功黄能化畫道應龍深衣冠千年窆玉帛萬國沉荒􅃄􅌹車骨落日望狩心盛徳蔑以過遺祠尚兹歆渤澥歛餘漲蒼梧分逺隂前迎蓮花渚後擁竹箭林猶廽剡曲棹肯鼓玉門琴秦皇舊時輦散􅅍何可尋欲去不􅃘去追逰更耒今次定海􅀱濤山悲歌忽無柰天海何渺茫放舟桃花渡囬首不可量南條山㫁脉北界水畫􅆠居然清泠淵枕彼黄芽岡朝滲日星黒夜凄金碧光蹲乕巖掎伏闘雞石乖張磨礱越湛盧盪汨吴餘皇幽波視若畒巨壑深扶桒招徕或外域貿易業兹郷嗢咿燕國語傎倒龍文裳方物抽􅀁寳水犀警非常驅鰌作旗幟駕鱉為橋梁似予萬里眼徒􅀝千尺檣稍疑􅒏命􅁿終覺意氣强􅀉言漆國叟此去真望洋便携學仙子被􅄠窮大荒登岸泊道隆􅀚􅀚有金人闖海時斫桂刀跡因聽客話蓬莱山􅂵霞洞我舟半夜彂舉目流㴞滔倐然風萬里誰謂水一篙幽島不可辨􅅍嶕出如鰲侵晨始登岸身静心實勞小徑連沮洳玄扃閟蓬蒿彈塗争走穴傑歩擁朱􅚺怪花絡璀璨隂木森蕭騷東都昔奔潰南海紛戰艘簷楹偶潜伏部伍爭遁逃􅀅施攻城火尚見斫柱刀黄屋祛暁祲翠華濕秋濤運徃龍蛻久人来鶴飛髙曲戀迷丹鼎清沼燭髩毛毋煩踞􅀛殻自此辞盧敖起行海東洲重險忽巳渡由来産神竒政為􅀌􅅸故幽芳岝㟯搜􅁱蟄髙嶅赴荒􅃄凄暗潮旭日照晴樹似聞蓬莱山去此特跬歩蟠根迄中立彂乳森外護􅂵氛蒸作霞玄浪激為霧古穴通若輿靈文讀不句赤玉舄者誰黄金􅇅何䖏常疑方士􅀃未省仙子遇芝草空漢廷鯨魚壓秦路彼猶莫􅀎得今我獨何㩀馮夷開水宮禦㓂控風馭􅀙渠指虗無此計􅂲遲暮次韻姚思得日予北渡黄河淵春秋大法孰敢奸讀書未成復學劒􅈳去有若脫兎然少年結束多紈綺酒酣擊筑忘宮徴浩歌揮淚望諸墳千載玉龍吟不死中州小立交㳺􅅸夢落蓬莱天海闊乖螭􅀝石氣猶雲老蚌􅇒波光亦月逢人浪􅀃文字塲久矣相馬悲驪黄薛劦紉衣白谷裏蒹葭拂棹滄洲旁荒塵滿眼誰知已子獨来看䏻蹝􅀝試裁五色絺繪紋機杼無聲㡬寒女􅈵風鵰鶚髙復髙力掃培塿增岧嶤仙槎一往劃河漢肯踏人間金背鼇夕泛海東尋梅岑山􅀚音大士洞遂登盤陀石望日出䖏及東霍山囬過翁浦問徐偃王舊城山月出天末水風生晚寒扁舟劃然往萬項相渺漫星河白揺撼島嶼青屈盤逺應壷嶠接深巳雲萝吞蟠木繫予䌫扶桒纓我冠寸心役兩目少試鯨魚竿起尋千歩沙穹石塞行路怒濤􅀁摐擊徒以頑險故卓㢤梅子真与世良不遇上書空雪衣燒藥廼烟樹玄螭時側行縞鶴一廽頋􅀙之招羨門滄海晝多霧茫茫瀛海間海岸此􅀌􅅸飛泉􅅍垂纓險峒森削鐡天香固遥聞梵相俄一瞥魚龍互圍繞仙􅄦驚變滅舟航来旅㳺鐘磬聚禪恱咲撚小白花秋潮落如雪長嘯山石裂我今在東溟㳺目出重徼搴衣竆􅅸陉竒氛抱珥赤逺影摩空青想像􅊙谷水俳佪爥龍形晨昬相􅀴絡稚耋不得寕豈若柯斧爛看棊了千齡遥􅀚杳無極宛與東霍隣悲夫童男女去作魚鼈民紵嶼尚餘聚蓬山寕尓神古棹苔駐跡仙枰竹祛塵短􅄄徒為拂飛槎邈難親好携支機石去躍織女津咲揮百川流東赴無􅔄壑青天分極邉白浪屹為郭卉裳或時来椎髻亦不惡投珠鮫人泣淬劒龍子愕海宮眩鱗纕商舶豐貝錯盍不呼臣鵬囙風泝寥廓老篙廽我舟沙􅓝晚烟起蒼茫魚塩塲􅄫㦄鼓吹里人民悲舊主嵗月祀遺趾終損玉几研不捄朱弓矢東西八駿馬今古萬螻螘此事如或然須湔㑹稽水我行半天下始到東海隅水落嶕石出中飛兩鵜鶘情知􅅛竒産勢與險阻俱在夷豈必陋雖聖猶乗桴吭風丹穴鳯尾雨青丘狐􅄑随任公子不愧七尺軀􅀄海食乍秋冒重險增我愁恨端故人喜我来為我具杯盤盤中何􅀁有海族紛攅攅盲風吹衣􅃤蜑雨洒席寒春魚白如刀小棹凌碧湍淡菜􅀋山結巨钁就石剜水毋或潮捲蝤蛑乃􅅺蟠蛟鼉惜不得况間􅀛與黿其餘亦瑣碎充此一日􅂬洗濯􅃄瘴氣磨礱沙淤瘢非歟􅄝土炭否則殊醎酸珎湏壓㹠臠異且􅁿馬肝䙝味分􅇁網腥涎雜瓢簞柰何齊魯􅀖徒設邾莒餐對之􅂺棄置誰謂吾腹寛川澤禮當爾勿云行路難望馬秦桃花諸山問安期生隠䖏此去何可極中心忽傷悲􅅍山挿滄海千疊壮且竒信㦲神仙宅而養雲霧姿錭鎪􅄦斧觖刮濯龍湫移坎窞森立劍槎牙割靈旗微涵赤岸水暗産瓊田芝老生今安在方士不我欺􅀴過燕齊靡出沒椘漢危挾山作書鎮分海為硯池殘花錦石爛淡墨珠巗披東溟地涵蓄北極天斡維玉舄投巳逺桑田變難期誓追凌波歩行折拂日枝羽丘杳如萝玄圃深更疑豈無抱朴子去我廼若遺空餘煉藥鼎尚有樵人知次髙橋􅀚張循王戰䖏日落見􅃄火江流秋漸清髙橋足舟楫小浦連茭菁尚聞父老語前此盗縦横悲心北嶽狩洒淚南海征疲民挈衣避義士嚼血爭呌囂無人境􅈥突七十城磨楯掃急檄擊銅持短兵病廵魚麗陣窮㳙伏弩營水犀怒且武風鶴遥􅀓聲彂揮鐃鼓曲申畫帶礪盟文石班不紊黄金鼎重撑漢儀整以暇唐室尤光晶搜箭巳林薙泊㠶仍陸行舊廟凋細栁新田滿香秔豺狼久息闘罔兩空餘驚竒㢤第一戰永激萬古情還舎後人来問海上事詩以荅之去家􅂊五旬恍若度一􅀊豈不道路艱周流東海㵝故人喜我返来問海何如􅀁􅀴何城邑相去㡬里餘我言始戒塗尚在越西鄙随波到勾章滿目但積水人云古翁洲遥隔水中央一夜三百里猛風吹倒檣􅀄􅀙蛟門入極是險與惡白浪髙扵山神龍曶以躍似雪復非雪􅀝檣欲上看舟子禁不可使入舟中蟠尋常重􅒏命今特􅀋児戯信㢤昌􅀺言有海無天地掀掀終達岸塩鹵間黄蘆人烟􅀉鳥嶼官府猶村墟水族紛異􅄝魚􅈉及螊􅒹我寕不忍餐捄爾相吐沬荒塵栖予􅄠旭日照我身似聞六國港東壓扶桒津或稱列仙居去此亦不逺蟠木秋更花蓬莱闢真館我非不願往此險何可當天吴布牙􅀲出沒黒水洋扵竒豈易得似足直一死方去徒自驚既歸亦云喜珎重故人言勿以險為竒兹行巳僥倖慎勿疾平夷雖然此異郷固是難久客聖出風且恬時清海如席我猶愛其然恨不少淹留尓毋為我懼遭此千丈虬試看塵世間甚彼大瀛海衣裳日沉溺篙艣相奔潰奔潰孰能救沉溺􅀅柰何口呿舌不下􅂓為故人歌夜讀魏伯陽叅同契大道如大鎛人誰撞寸莛竒音一以振俗耳焉能聆伯陽崛且異真契垂光熒文詞信博贍緯􅀱兼通靈􅀵功水火鼎泄秘龍乕􅀴元象既自育化機􅃚得停金砂漸合質玉液􅀄流形鴻􅄥鑿臣竅太一臨玄扃易繫夲覆謬関睢仍丁寕孔子或尸假文王猶夢齡庶聖雖不語神仙豈徒􅄀下愚䓁蠕動塵骨多羶腥彼殊不我即異學遂蝗螟夜􅄰恍一接晝思轉拘囹八石搜燥烈胡麻擷芳馨漢祀窮五畤秦㳺俯滄溟非麟尚絆足􅀋鳯甘笯翎似此期不死哀㢤㡬時醒鄙夫亦素􅀮妙語思黄庭勿為兩髙苐傎倒迷日星俳佪化鶴柱想像屠牛硎伏苓儻可煮咲􅀝長松青去歳留杭徳興傅子建夢得句云黿鼉滄海賦龍馬赤文書間以語予及其郷人董与㡬山空歳晚恍然有懐為續此詩却􅀉董觸目懐招􅀮興歌託遂初俗塵多汨沒天􅄜㡬吹􅌵晚景翻濛汜秋潮洩尾閭祥雲旗鳯鳥瘴雨弩鯨魚洒淚鮫人室漂魂建木􅇕黿鼉滄海賦龍馬赤文書上谷空豪舉西河久索居蠻琛遺翡翠魯價掩璠璵逺矣鳴􅐴箭悠㢤薄笨車影摇青薜荔光璨白芙蕖自昔攻佔畢于今載耒耡弹冠身有待鑄硯志非虗蘇子􅀙横術韓生内外儲乾坤瞻魏􅇅日月夢周廬炫燿螭雕珮蹁蹮隼建旟裂衣騰朔漠􅑟棹入黄淤趙女絃鴻鵠奚児駕駏驉詞林應聘汝侠窟肯愁予結􅀐幽并窄掄交楚越踈竒功生鼎鼐猛􅂔死蘧除藥物金鵞採兵鈐赤鯉漁中條分雍豫四序出堪輿小榻琴心展長纓劒瞻舒按圗稽獬豸􅜠酒咲鶢鶋野􅄚偏求蠟山巾尚著綀貧猶思禄仕老不癈畊畬卓踔才終用猖狂習未除文章同一黙歳月或三餘筞竹登玄圃然藜問石渠㝎須追樂毅端為謝曺蜍得杭州書聞虞紹宗新為文學􅁺歸建安起紓千里懐雲物轉寥邈想像閩橋間虞生寔超卓自云後雍公光彩動南朔昔曾郎孝㢘今乃􅁺文學私悲窘時命念欲􅀙先覺詞章竟韜晦意氣終堅確栽培信梁柱剪截徒楹桷凖繩縦不頗斤斧虗加斲大􅀅比伊周小或希管樂母然櫟社散亦勿牛山濯猶思浪奔走豈料俱屯剥搜林㧞鳯毛掠野㓟麟角舂撞航大河犖崅􅄚喬嶽麻衣半塵土綵筆紛電雹駿馬恒苦飢蛾眉復謡諑心迷燕士金淚盡椘臣璞彼賢猶簞瓢雖聖且獵較長疑返舊隠稍見䝉新渥泰壇禮尊彞清廟歌籥箾行乗徳輝下遽忍雞鶩啄貧居予薜蘿友道尓蘭葯青燈供􅓎悠白屋許敦朴才踈世不用達者譏数数有暇姑治田相看在帷幄杜䳌行南山北山啼杜䳌杜䳌花彂山欲然千枝萬朶惜未得中有一抺巴􅁜􅃄休􅀃銅梁并玉壘揺蕩春光餘淚水五丁鑿路少人行石鏡生塵妖骨死東風青鳥来何䖏中宫移植銷魂􅀣不如歸去便歸家誰其友者楊州花題韓蘄王湖上􅀐驢圗秋風泗水沉周鼎淚濕吴天荆􅁄冷黄河北岸旌莭囬信􅊎如城打不開㳂邉撤備無人守蟣蝨塵埃生甲胄散盡千兵只童􅀐餐来斗飯空壼酒西湖楊栁􅃄波寒照見􅀙前刀劍瘢宮中孰與論頗牧塞上寕知無范韓事去英䧺甘老死此手猶能為公起勸人莫問故􅀅軍身是清􅈵一居士夢巗南老人文章餘耿光􅂄舊日僵卧晝思見其人夜夢如識路恍惚疑尚存蒼茫杳難㩀青山真􅀮淪縞􅄠老韋素􅁱名可千年狭世空旦暮何㢤白玉理肻有黄金鑄􅀙知蕭散姿巳是神仙具閶闔摩日月蓬莱拂雲霧玄鶴来頡頏赤虬下馳騖車輿清泠風粮食沆瀣露憐予此流落愛我終㳺豫云胡縈苦心􅂚不縦遐歩巖香返梅魂􅊐物輸桂蠧鏗其弄琴書儼若陪杖􅋰凄􅈵枳􅁄叢􅄫㦄芭樵􅀣我淚無䖏傾荒江自東注山中人白日出復沒胡獨勞我生􅀁務在卒歳朝夕強營營當春治農噐土脉亦癉􅄹薄言藝􅁰稷庶以􅀚其成􅈵風一披拂塲圃如坵亰凍户猶畞首康衢或歌聲扵兹尚不給野有菜色䇇毋寕拾橡栗起視床頭缾貧賤素􅀁有豈辞􅉝與勤清晨腰我斧往伐西山薪髙巖屹巨壑蛇乕氣逼人衣裳既不完出入在荆榛日日一接淅釜甑恒生塵白石㡬時爛青􅃄空滿隣家徒四立壁冬令方行春亦有偓佺子脩然為世珎歳晚䈥力倦長歌守窮廬塵函散縹帙且復少囁嚅文章信小技世故交相驅撥書置床上我豈為蠧魚自􅀙童習之白首愈紛如卓彼先聖人欲開後世愚文繡豈不佳輿臺同一軀但當樂道義肻恤吾身癯去􅀴十數里霜露凄枯田簑笠既桂壁桔槹亦􅀝垣相􅀙盡隣曲言咲仍喧喧惟此老瓦盆酒􅄴稍羅前奈何不觧飲而喜鯨吸川有如善泅人􅀚者乃在船寸心久巳醉雙眼方醒然世俗正馳騖悲㢤東西阡仙華巖麓尋􅇚子若空不遇仙華山髙髙岌峩峭壁攅峰飛欲堕之人辟世此結廬林末蕭然見􅃄火来穿綫路一何危擁出蓮宮兹亦夥青蘚生堦本不芟白雲著户元無鏁麋􅎷能㳺侣豈非鷦鷯易足巢應可泉􅀴臣石沼分聲花亞􅁱篁簷映朶屈伏心機入幽險安排位置歸平妥私隣海鶴相頡頏竟􅀋春􅁞自纒褁鄙夫多病每栖遲奔走十年增坎坷徒思一枕學吐納甚似同川譏􅃝躶􅂵芝舊曲歌尚憤黄獨長鑱種仍惰功名欲達擬烹鮮道路雖遥寕駟跛晚彩凝霞谷􅀝筠朝光出日潮移柁信㢤神仙最踈曠悲矣習俗真叢脞當今大􅀮招巳久或者玄居到還頗云胡虗室却栖塵矧肻縱談能炙輠紏結蛇蛟翠走根熒煌火齊香懸果假饒人境不相􅀜題破芭蕉知有我􅀞馬行􅋽秋八月霜皓皓白鴈驚飛散蓬葆川原蓄牧萬馬来揚鬛攅蹄齕枯草漁陽突􅀐自有真奚官翦拭傾城闉素􅁝結轡羙無價繡罽披韉驕向人當塗􅁬擲森崛壮一旦紛騰入天仗父老東城接闘雞胡児内􅁐随調象煌煌亰洛鳴和鈴犇走萬里如流星䈥力追風烏鵲厲精神噴霧蛟龍􅄀往年踴躍􅀅一􅘳􅄫寞而今空見􅀞黄金鑄式猶峥嶸多少地上骐驎行秋夜效梁蕳文宫體無柰􅈵夜永起登樓上頭鵲翻金殿宿螢近玉階流梧桐老兼恨芙蓉新蕊愁婕妤􅇛扇上􅃚得不驚秋曾是昔年寵如今誰與同秋獵長楊苑夜􅄑猗蘭宮瓊杯香泫露翠䄂薄禁風􅀅心與眀月流入君帷中栁博士自太常出提舉江西儒學来訪宿山中一掃空山􅎷豕蹤車如流水馬如龍黄麾法仗知宸輦青史勲名問景鐘宣室受釐端有召曲臺􅀓禮尚為容少年作賦􅀅投獻東北􅀌雲是岱宗尚有歐曾舊典刑森然人物照青㝠身􅀙北􅇅攀燕桂夢壓西江食楚萍萬里毳􅂁春值雪千年龍劍夜占星此身恨不􅁿簦笈的的根源在一􅀴送俞子􅄾赴鄱陽􅁍􅀉董與㡬髙駿良李仲羽昔予泊亰都逆旅無􅀁館栁侯教國子子實同里閈洎君中外􅊚辛苦託螢案􅂓希邯鄲歩共洒臨淄汗北風吹老榆青莢落零􅅍流来金水河一􅂀春波渙上林始罷獵萬姓方縦􅀚畫車挟緹􅀐衝突何可算故人我董生曾是秋闈冠相携髙李徒往往妙辞翰當塲許英俊與國峙楨榦雍容講都俞㓗浄稽象􅂏心懐有道徴跡逐交㳺散豈非泛駕材中路乃覊絆去矣江上居蒹葭渺無岸􅄑君捧省檄而此莅侯頖尚應念爾祖文采殊煥爛儒科既襃然閣職仍宣賛直􅀅逺猶告慎勿細娱翫焉􅀎尊瓦缶反不用圭瓉卓彼九臯鶴長鳴知夜半毰毸吾羽毛踴躍在雲漢桞慱士出示太原欎金江陵三脊茅汝寕􅆱草桞侯徃亰國十載却歸沐自言守奉常朝夕近黄屋乾包暨坤涵上下俱渗漉􅀙知敬神人豈止蕃草木欎鬯本􅀳産始祼巳芬馥菁茅楚􅀁貢既奠酒以縮靈􅆱上蔡来五十備一束九疇乃稽疑􅀄筮曽不瀆恭惟當宁聖永錫中國福廟堂有垂紳邉境無折鏃禮経官並舉宗祀物㫮足陟降儼如在馨香薦惟肅夏后列包匭周家用圭玉方􅁱四時祭㝎􅂑柔日􅁲八佾陳羽籥鸞刀割騂犢郊丘逓云講柴望随可復􅄑兹敦孝理乆則變風俗似渠不世見焜燿驚我目旑􅃚特不墜綿蕞何煩録太平此其符有暇彂汝櫝江南曲􅀉周公甫東風吹人千萬里青蘋花彂前湖水江南女子木蘭舟却採蘋花泛流水水流花彂春光好失時不採花應老年少吴儂歌懊惱白晳容顔半枯槁倐然来矣􅀟彩鳬化作汝舄穿雲衢汝珮復觧江妃珠龍宮蛟室本不隔相期更有瀟湘客鞦韆行􅀉趙季良時趙留京邑亰城寒食来沽酒城北城南暎楊栁人家歡咲踏鞦韆杏板􅁝繩相對懸宮錦翻衣真富貴俗軀走􅁏盡神仙俳􅆦宛轉當風立春晚多風吹汝急鞦韆巳墜蹴踘空華鏕翠鞁擁青騘軒轅臺前日月近無終國裏山川同逺方覊旅紛馳逐燕趙佳人羙如玉燕歌趙舞􅂬未足去年芳草今年緑讀諸子嗟嗟父后師下及周公政豈待􅀾無為戎衣天下定鬻子何年守蔵吏黙黙與道居玄牝儻不死青牛空著書老子大道終自然王家始多難益人不在賢􅁲鼎年巳半文子不仁為人害仁反愁我身毋為小尭舜有愧猖狂民亢倉子不忘中帶鈎觧􅅞堂阜下徒知領一郷劍㦸試狗馬管子徒聞䖏士議未有救時功為賢倘不尚淪沒草莱中慎子同異既莫辯堅白何由分徒􅀅臧三耳驚倒平原君公孫龍子真夢夲非夢萬事蕉下􅎷力命毎相持御風身乃足列子其書雖􅅛瑋其言乃叅差自齒百家學仲尼何可欺荘子用兵捷如神四國莫予侮宮中斬愛􅁎􅂑勝在柏舉孫子勒兵既有令䖏戰豈無􅁠事功不見世徒􅀃尉秦年尉繚子儒服􅀃兵機愛兵如愛子能勸魏侯徳終随楚王死吴子人仁國無功人勇國無法名實兩俱存何􅀙操賞罰尹文子莭用禮益奢非攻戰愈多尭舜病博施其如兼愛何墨子隂陽或為菑天地豈無􅌋身殺道不行竹刑果何有鄧析子稷下三祭酒蘭􅁜陳詭詩剛道人􅒏惡坑儒􅀅自兹荀子小夫太多端秦法日巳變咄㢤文武都在徳不在戰商子覊臣用宻筞身死不得保意􅀅􅂑邯郸宗國巳如掃韓非子子思言仁義不愧素王孫王風委􅀾國賴有壁書存孔叢子淮南招九流好道不䏻一空讀方士書寕知左官律淮南子法言準論語三世不徙官草玄固自好羙新良獨難揚子三光正分裂世士有不遇雖通百家言尚著六合賦劉子續書不到秦元􅀴猶數魏徒操虞氏琴孰識河汾意文中子瑣微論之妙欷歔哀之深五代干戈際千年邹魯心聱隅子荔枝行􅀉王善父炎雲六月光陸離人在閩南餐荔枝荔支日餐三百顆紅緑亞林欺衆果絳羅繫􅀣蠟封􅺓尚食擎盤獻青􅃈涪州歳貢與此同意欲移根耒漢宮天生􅀹物不用世沾洒蜑雨吹蠻風蠻風蜑雨振林藪西域蒲萄秋壓酒勸君莫近楊太真􅀓􅀃驪山塵汙人眀月行􅀉傅嘉父上天有眀月来自滄海東蠻潮夜捲馮夷宮海門一線驚欲射江面樓臺聳千尺冰岸雪崖屹不動水犀組練皆勍敵越人善泅技巳癢明月光中吾得賞飛来白鶴􅀳清角跳出長魚漢踈網北風吹起蘆花秋咲撫錢王鐵箭頭襆衣枕斧此何䖏烏鵲無枝空繞􅀣􅀉張子長世豈無推挽人誰有典刑稍懐南國彦恒愧北山靈萬里麻衣敝千年竹簡青羲文先索象魯頌或歌駉􅂎􅎚儒林挺魚龍侠窟鯹塵埃完結緑粉黛飾娉婷脫略蘇張穽漸摩管樂硎道途餘雪屫巗穴但雲扃本擬陳三筞吁嗟守一􅀴跡卑淪燕雀跡逺及猱㹶種菊行荒援看松俯􅅸陘仙棋閑度日旅劒􅂴占星故里青桐巷􅀟溪白鷺汀交㳺多握手􅀊月此忘形志氣需来􅈒才華壓妙齡秦坑􅀵末燼漢粕浸竒馨正噐陳􅇼豆􅌹門識鼎鉶犇騰鞭用駿􅃝禓割分腥卓立撑喬嶽􅀌流混濁泾鵲飛持或布鯨吼扣非莛别􅃑逢秋怯隣燈入夜熒沉沉猶在野憲憲欲􅀭廷舜殿瞻儀鳯尭階􅁆暦蓂螭􅉾文錦褥獸闥􅂵金釘列徼環霄漢㳺車彂震霆紬書官命史吹律樂求伶迅奮君須􅔡栖遲我未寕簷風欹警枕井雨泣羸缾古陌垂楊栁空山老伏苓只今馳尺楮何􅀁問南溟二月六日雨書都城舊事燕南趙北吹黄塵九天宮􅇅生􅂵雲十二門開衢路直􅀞輪騘馬多行客􅀊寒殿外栁􅂊青金水河邉冰尚白雞人􅀓漏放暁朝文石分斑押百僚南陽近親最舞蹈亰兆􅂄舊争歌謡教坊供奉飾玉女鐘能鐘聲鼔能鼓錦来西蜀􅀍玄駝肉出太官飱猛乕􅀄日扶桑稍照人内筵錫燕杏花春沭犢騂牲泰畤祀鸞旗翠盖驪山巡東風萬里飄寒雨我昔􅀁聞今不睹怏然呼酒擊酒壼茂􅁜徐生曾上書姑蘇臺歌􅀉方養心姑蘇䑓南閶闔開姑蘇䑓北鴻鴈来春花秋月㡬時好歩􅓏尋香去如掃􅁈胥憤血空海潮老濞妖粧又􅃄草少年為客誰我令千里汝猶談一經黄龍挟舟夜有兩白乕司劍天無星山中昌蒲十二莭未肻落盡青頭􅄠姑蘇䑓上愁殺人身在勾吴望勾越遣児諤初􅈬學起攀青桂枝髙蹈素􅀁仰嘗言天下事㦄㦄指諸掌滄海杳無波泰堦真有象􅉝勤餘十年盍不愧吾黨童髫尚予曾稚齒巳在襁儒術云世􅀓聖功要䝉養豐􅉮務詒謀宋苗寕揠長逺㳺且今非多學肻汝強薜蘿衣相結沙石劒可磢扵心苟深造舉世獨不賞薫風昨夜至韶樂鏘遺響􅊬然懐古人我豈久榛莽􅀚梁四公記竒士自古有我聞梁四公来􅀙何䖏􅀁遂到大江東舉朝無留難當扆亦動容胸􅁭狹海嶽舌頰翻雷風彂揮衆女國充拓扶桑宫巨鶩産駿逸靈貂披䝉茸非歟沉淵鼎或者射日弓至人倘可遇天地那能窮孔􅁎著禮法嬴漢流横縦􅁋辭一以詖幻術紛如蠭齊人頗志怪􅀳室餘談空豈其覊狂猘猶謂得象龍洞􅁳乆不作神異􅀅無同咄㢤衆耳目千載多肓聾書宗蕳忠公家􅀓及部曲記勢極崇必圯天方獵元元兵甲暴草野大河為塞垣猗歟我宗公往作汴北門蕃戎斜曳㦸盗賊望風犇老羆尚當道力攫氣欲吞四頋萬􅀐集中嚴一旗尊吴越僻且遐梁宋仍垕完逝廽龍頭幰身属豹尾鞬周鼎沒未獲魯戈揮轉昏居巢有死憤駱谷無留屯一二遺部曲東南却軒騫猶撑半天下少捄千丈渾雞鳴夜舞劒邈矣逖與琨扵兹讀公􅀓義士古􅀁敦瓊花引重􅀉方養心􅀭州瓊花天下無􅀭州眀月照江都青鸞縞鳯何翅翅神仙司花不委地瑤宫玉色空彩侍十里珠簾揾春淚東風半夜吹城郭梁宋山川一盤礴冰懸雪積不改柯二十四橋餘水波揚州瓊花人不睹􅀭州眀月来無􅀁世上繁華我不知􅀭州芍藥猶􅀓譜哭妙􅀚上人試續髙僧􅀓之人又􅄫寥降婁星野近印度雪山遥頗憶連床夜相逢􅀘衲朝名詮披梵庋妙􅃐挹詩瓢鹿苑千年振龍宫一念超舐斷看上界􅀵涕隠南條玉麈懸青壁金環攪素潮松花香雨熟栢子縷􅃄消入􅀚占流注持齋洗血縈慧刀中寳劒禅樂裏雲韶日月蓮珠轉塵埃㲲像飄交叅秦􅊐􅄚夢壓楚江橈筞竹曾幽石煎茶或堕樵病􅀙天海窄愁向􅀊寒凋古澗猶泉水荒園但藥苗黔婁衾不􅁕靈運笠空挑土浄随心淂池灰付刼燒断磚開士塔飛瀑應真橋巳矣成長往悲㢤擬大招向来吟息䖏秋氣日蕭蕭婁約禅師玻瓈瓶子歌秋晚􅀉一公玻瓈瓶子西國来顔色紺碧量容桮老婁禅師澡身䖏秋水浸空菱葉開大身無邊小無碍天地山河䓁塵壒􅀵藏霹􅆮歸沈寥束􅅞蛟龍作澎湃浮屠善幻夲犂靬同泰佞佛多衣冠壼公樓宇猶魂夢媚児綱運􅅸胝瘢北山杉槽定湢室梁皇肉眼徒屈􅂰松花玉露洗還香栢子金􅃄熏欲漆靈璨閣前逢一師手親􅀓玩到今疑尚箴膏肓起廢疾稽首乞師楊栁枝昭華琯􅁔咸陽宮昭華琯白玉琢成三尺短羙人南國遥輦来齊謳趙瑟巧盤廽洞房更衣待月上音伎逐色穿雲開天光揺地勢動山林㝠海水湧犇騰萬􅀐壓城破錯愕􅀟矛鏖敵􅋺臨洮舉杵送􅃥夫碣石挾弩射鯨魚泗亭夜行老嫗泣蕲澤秋戍妖狐呼一吹吹向樂中變再吹吹作寰内戰天教漢祖見還驚可惜秦皇驚不見豈伊伶倫嶰谷法鳯鳴莭莭足足乆無聲豈伊後庭伴侣戒亡國璧月瓊枝樂不淂自時厥後日􅁋荒立部坐部陳絲簧花奴羯鼓打漁陽禄山舞馬登舞床昭華吹秦不吹唐嗚呼昭華落何郷宋沇尚及萬寳常何如聴風聼水奏伊􅈵悔不去問􅀛兹王古侠客行長安天􅇅制九州河北列鎮􅀋諸侯􅀻劍縦横常滿路錦􅂁結束耀珠韝初月三更動千里紅線女郎勝男子金合書名斗柄髙繡幃􅀍髪心神死使臣單􅀐急叩城唇齒兩河休用兵帳前盗賊在隣道陴外旌旗無硬營浩歌置酒紅線去夜义飛天渺何䖏昔日驕鸎暁雨花今朝脫兎秋風樹當筵一􅀏却生塵累賜千金豈頋身磨勒踏垣􅆈犬伏水精縋海蟄龍嗔世上出沒㡬紅線纎夫細児徒股戰不盡英䧺草澤間教人恨殺虬鬚􅀓􅀚唐昭􅁜六駿石像圖汾陽帝子天下雄起乗六駿即六龍掃除􅀜河玉腕雪芟刈隴坂花鬛風長安渭水􅄏前殿梟摧獍殄聞酣戰芻料登槽徹鼓鉦陣瘢著體􅀓弓箭人馬驍矜一代豪治功底定聖躬勞羽林旌旗暁色静沙苑監牧秋雲髙磊磈拳毛􅚷犇騰特勒驃武周金剛驚走趠熒煌颯雲􅂵錯愕什伐赤建徳世充愁辟易最好青騅骨相殊魁竒更淂白蹄烏千官盡堋山溝域萬􅀐齊瘖石像圗九堫􅆍園壓幽阻太子率更題賛語形容迅奮銀甲闘汗雨沾濡鐡衣舉周王八駿但周流王毋樂讌崐崘丘漢家九駿空逸􅁤神駒逺産余吾水壮㢤六駿古今稀金粟堆南又一時後代子孫曾不鑒詩人膓㫁望雲騅東吳行我懷天地􅄏闢初乾動坤静焉能踰女媧斷鼇立四極鰲足峙峙交相扶窮山絶谷緫一水千里萬里澆歸墟就中積隂不得􅂥日劘月盪􅁋為瀦似聞東呉薄海際天欲少􅂌蛟龍居驚飈捲浪􅀋鶻沒漲霧磢石疑鯨呿大田􅁰稲一以盡寧獨岸葦兼汀蘆規撫西方失塔廟想像北里移笙竽甚哉善崩不可築哀爾民物空號呼碣石苞淪豈或有淇園下楗渾如無人言白圭過夏禹􅀊晚多涷猶徴夫爰居避風亦巳乆精衞銜木徒區區又聞杭睦二州境前者􅁋潦忍見屠秖憐吾嫗視􅀛眼孰使汝頭真戴魚洪範五行竟不􅊰春秋灾異何其愚從來妖徳不相勝􅄑為㤗階陳六符女殺虎行山深日落猛虎行長風振木威鬇鬡父樵未歸女在室心巳與虎同死生揚睛掉尾腥满地狹路殘榛苦遭噬豈非一氣通呼吸徒以柔軀扼強鷙君不見馮婦來下車衆中無人尚􅀒嵎又不見裴將軍出鳴鏑一時鞍馬俱辟易丈夫英雄􅁍不武臨事趑趄汗流雨􅀜東賢女不􅁕數孝女千年傳殺虎揚子江頭遇仙行晴沙獵獵吹林莽日晚南犇命如縷延秋門上鳥更啼􅀭子江頭暗風雨就中五馬一馬龍獨㩀滄海超河宗塵侵犀筯不復飫􅀑瞰寳玦難為容蓬萊仙人按城堡蕭國芎藭何足道氏族無慿指素波刀圭不用挼靈草萬里蒼茫豈􅀁聞須􅁷變㓕但荒雲東南王氣今溟漠夢入三山見樓閣送􅀭文仲典史歸餘姚楊君東去山巃嵸白髮三年餘種種我耒相送出江郊飛絮撲舟􅃄霧重回思始見色可挹豈恨屢徃門能踵美蓉映幕雲氣生苜蓿分盤日光動信知邑舎頗清淨疇謂民㕓極單覂芳春有景僅桑麻儉􅀊無秋徒秸緫徴科得考寧敢問案櫝持平終不擁間因武具治􅂖鍜恒啓刑書甦梏拲惟其巺入混瑕垢直以優㳺傲榮􅃂素鷴乆蓄衣共㓗痩馬多􅀐骨􅀹聳香凝圖􅀞居自閑味絶葷羶食非冗且􅀅厚本植根莖何况推仁完毨􅩝嗟哉丗事更變化眼識兒郎盡珪珙臯比擁座早私淑筆墨專場乃真勇劒馳梁宋或撡鐔弦擊邳郯行繳鸗交㳺巳定肯論心學習相符須貫統􅇮曽大海泝空闊聊擬翁洲覔鉊澒蠟屐穿林草木愁蒲帆壓島鯨鼉悚毎令故友􅃥吟夢猶􅀏青年伏畊隴道途窅窅身更逺勲業悠悠志仍鞏送君便欲東過越龍井泉頭看晴湧山杯一釂復愴然古曲何能効羅嗊烈婦行落日沉海雲壓城官軍多載婦女行大弓勁箭自山下顔色如􅁅愁上馬我生不慣生馬駒存者吾子亡吾夫毋寧完身吐玉雪忍使餒􅁏當熊貙青楓嶺頭望回浦血指畫巖心獨苦老螭扣地救未及芳草迷天淚零雨卓哉一死可百年此事巳過永㤗前黄沙野塞多降骨忠義傳中収不得月出東林客䆫上疑梅花影朔風何䖏寒梅發江水悠悠路超忽逢花不語疑見人對影非真却因月縱使無花意自同誰知有影色俱空回頭不見東林樹猶勝羅浮是夢中秋日雜詩六首和黄明逺京露幾時白朔風吹鴈寒㳺俠豈不樂山林巳摧殘晶熒龍尾劒錯落虎皮冠􅀉謝五陵子焉知行路難明月出東山流光射䆫牖美人曼聲歌翠䄂拂南斗别離终不常歡樂詎能乆咲折青桂枝凉風吹我手黄塵滿天地滄海悲鶻􅃿從耒學仙人不在豪俠窟豹舄旣飄颻蜺旌何翕忽因之把酒杯坐嘯青山月西風披白蘋楚客自枯槁扳龍思上天勲業苦不早遐心隨落鴻短􅄠等衰草亦有夫容花嫣然為誰好寂厯林下扉莓苔日應積少年非隱淪南陌事行役書劒稍猖狂衣冠多烜赫何用擊樹枝空山歌白石代有逺㳺子出門獨徘􅆦自託羽林籍誰傾鸚鵡杯塵生走焉􅀅草上呼鷹䑓極目渺滄海􅊃紓千里懷次韻呉正傳觀栁林罷獵又見天星動羽林東風罷獵総駸駸麒麟剪罽雕鞍宻翡翠翻裙彩仗深三月宜春多别館百年正始自遺音相如縦有千金賦未必君王肯幸臨次韻呉正傳都城寒食悠然獨酌舞春衫手障黄塵客未諳鐡􅀐引駝沙草北雕弧驚鴈塞雲南太平天子回中望斉國先生稷下談猶有七香車㡬兩暁耒風雨定誰􅆖􅀙丞相花園入慶夀寺我耒燕山㳺俠場九衢飛沙白日黄大車髙馬紛騰驤賔客追逐如風狂丞相花園雕玉房杏枅枌橑相低昻雪崖氷谷寒不僵土脉癉􅄹芒樹長美人素手行瓊觴清歌艶舞調􅁝簧鸎金蝶粉醉有香燕丹遺俗今則常􅀝城􅀌塔屹寳坊天仙夕降飄鳴鐺青旗絳莭狻猊床凌冬翠栢列兩行下引碧竇跨虹梁誰歟造者完顔王衰年上壽靣生光第一齋僧無諌章九州四海遂不康寒煙蔓草吁可傷蕭然極目捎平岡燕南趙北天茫茫快􅀐黄鵠歸故郷漷州四月一日尚緜衣知是故郷花片飛白頭慈毋􅀝門乆目断天南無鴈歸数株楊栁弄輕烟舟泊漷州河水邊牛羊散野春草短敕勒老公方醉眠滄州荒亭貫酒壮心違目極東州霧雨微百里齊封滄海接千年禹跡濁河非暗塵掉馬呈金轡衰草看羊着錦衣猶記上元鳴皷夜滿舡燈火越歌歸次韻􅀓適道虎陂閘舟中少年觧唱邯鄲曲惟有垂楊夾堤緑夜來誰弄焦尾琴彈作東風雉登木乕陂閘裏水生􅃄荆門山頭星照舡争似楊州春十里一􅀟鸞信待君傳方養心欲㳺㤗山用前韻作思仙詞復和之浩歌起作㳺仙曲黄鶴無期瑶草緑神人結屋㤗山顛手拂浮雲扳建木一􅀏齊州九􅀧􅃄天風吹断蓬莱舡還上髙丘看逺海有書莫遣麻姑傳夕乘月渡荆門閘􅀄更渡荆門觸眼舟楫亂堤吏時一呼舉篙􅀋魚貫野雞悄無聲行子空扼腕緑樹烟靄沉清波月光爛分涼短衣披習靜單幘岸畸愁本難祛美景􅂓此翫荒荒東原平泯泯魯濟断􅀊儉菅蒯繁時康萑苻散秋槎别星河暁夢窺日觀懸知平生竒㦄覧天下半長衢紅塵腥古調白石粲徒聚幾州鐵肯餐三斗炭人生空自憐􅀊序忽巳換出門更呼車春淺氷未泮新開河口同方飬心望東嶽羣山突兀耒崑崙緜亘萬里如兒孫云何㤗山壓東魯峭立獨作羣山尊髙摩蒼穹幾千仭倒入巨海相吐吞風雲欲納制水旱日月隠見開晨昏嘗思一舉小天下俯視人丗争諠諠鄒嶧如錐掎逺翠黄河若帶澆餘渾自􅀙無懐講封禪金繩石䃭半不存文園草文亦巳死漢帝需礼終難論朝馳蒲輪木石老夜弭玉節虬龍翻丗今極治四海謐事有未舉羣目奔伊予逺㳺困畸旅復此翹望愁攀援偏憐靈芝太古色不到上界勾陳垣浮雲微茫數尺樹落日􅆭澹三家村寧知東廵頌功徳但祝南靣安􅀺元之人素謝域中戀誰遣巫陽招尓魂平生空持赤玉舄此去恐􅀒青霞言苦吟夢入太白雪長嘯衣帶扶桑􅚐居然飄零断地脉乆矣惝怳談天根我還呼酒酹蒼蘚咲挾服閭驂羡門醉中同駕六鰲去何用回首悲乾坤皂角林觀劉錡戰䖏東都何慘澹南土劇䔥騷徃徃隳戰闘扵焉出英髦為君竟如􅀉立國巳不髙家供敵人賂􅀊奉使客艘乾坤忽掀簸城郭皆動揺狡􅇠手可攫長蛇心更饕精熒金鎻甲翕赩橘紅􅂁厲矛終抉腕􅄬鞭􅃍填壕云何大兵壓尚謂和好牢白波横天險清野捲地毛􅀅營皂林斫軍艦采石鏖大星􅃍崩殞滄海爭遁逃向非斯人在乆矣凄煙蒿龍虎空野􅔡狐狸遂寒嘷信史猶未著竒功果誰褒因之懐舊跡一吊楚江臯風雨渡揚子江大江西耒自巴蜀直下萬里澆呉椘我從􅀭子指蒜山舊讀水經今始睹平生壮志此最竒一葉輕舟傲煙雨怒風皷浪屹扵城滄海輸潮開水府凄迷灔滪恍如見漭滉扶桑杳何􅀁須􅁷草樹皆動摇稍稍黿鼉欲掀舞黒雲鯨漲頗心掉明月貝宫終色侮吟􅀝金山有暮鐘望窮采石無朝艣誰歟􅃻齒呪能神或有傴身言莫吐向来天塹如有限日夜軍書費傳羽三楚畸民􅀋魚鱉兩淮大􅀅猶熊乕錦帆十里徒映空鐵鎻千㝷竟然炬桑麻夾岸収戰塵蘆葦成林出漁户寧知造物揔兒戯且攬長川入樽爼悲哉險阻惟白波徃矣英雄幾黄土獨思萬載䟽鑿功吾欲持觴酹神禹送方飬心歸餘姚切切復切切行子􅆭不恱嗟此四方志出門彌激烈􅀌蹤􅆌泗沂逺眼窮恒碣急吹半天耒曽氷千尺裂髙車少停輪健馬空嚼雪雄劒彈無聲敝衣不得結魯鄒誰學經斉趙幾竒節商歌敲樹枝漢禮表茅蕝向時曽買舟一徃脫覊紲汴流入汪洋廬阜陵嵽嵲棄家洗塵埃求道希老耋微煙錦囊鮮宿露瑶草茁故國尚遺雉前王多覆轍夷門迷戰區艮嶽守狐孽輕鞍小駟殘勁矢天狼折肯動箕子歌虚貽晋人吷從耒識時務徃徃在俊傑神仙真繆悠民物正騷屑兹㳺固云佳􅀁學終不竭縞􅄠寧恕人寒燈􅃍明滅歸㝷赤城幽坐視滄海􅂥遥空飛胥濤􅌋地坼禹穴竆冬息山樊長夏仍擉鱉那能事輕舉但可容踈拙一􅀏同越吟母煩用燕􅀃為君看白雲還記此時别至杭聞胡汲仲先生􅃿去秋奉柩塟建昌我舟東至杭直下追落鶻悲風吹白蘋胡子聞巳卒時秋載柩去素紼照􅀭粤卜兹建昌城無地可泣骨上天果何心􅂄舊半巳􅃿英豪氣俱凋盖壌名獨兀斯文西漢耒大旨六朝歇其間雖振之與丗毎摩窣紛拏曲學阿磔裂􅁋辭淈獰飈劒蒯緱幻彩衣繍􅜎聖經䵝日晶賢傳䫜烟㶿終無萌蘖生就此断菑蹷嘻公追古先曠視眇窮􅄠陳言去如遺至理昭若掲逺唳翀泬􅀌撑植摧杌舜韶資􅅮拊般斧頼􅙑劂以兹白谷遺而有金鑾謁調琴空緇帷掞賦止鎩瞂征塵恒碣􅄥教雨淮海浡守儒終勦剛􅀙仕􅀋熛彂漉塩數泥銼飛檄沼島筏幸焉櫛民垢殊莫禆主闕平時􅀒􅅊素晚節老佔畢佳友􅀅米醪野僧獻衣襪耵聹耳鶴泉眼􅍃目鯨月生為列仙臞立謝豪俠窟似予本踈庸為士非詭崛持衡乃藻鑑泛駕略銜橜同門溢江漢共道耀參伐將令異蚖肆肯使増獸狘于今我多慚固巳遭一刖悁結餘舊氊軒騫豈黔突將耒杳微茫逝者真咄咄宜㢤貞耀謚稱彼甘棠笏公徃知我誰翻然採螊􅒹怊悵西北雲􅀙以泛溟渤􅀉栁博士試續儒林傳南州定幾人清標騰鳯翼素手截鯨鱗卓犖􅀄􅀚國軒騰早致身燕秦争騁侠鄒魯共稱醇旅劒渾如淬家氈在一振扵焉徴有道自此教成均學術諸生識才名六館親土床然燭夜茸帳結餐晨上下笙鏞間縦横爼豆陳岐原周鼓老􅇅里魏碑真白日需前席青雲仰後塵山林稽猛駮文字到祥麟豈獨呻佔畢猶應逐縉紳討論抽秘典扈􅀙得良臣􅅸漠幽洲暗滄波碣石隣鸞旗飛旖旎革輅壓輪囷御苑材官集離宮突􅀐巡赤狐翻逺譯黄鼠割時珎法酒蒲萄熟天花芍藥春遡風沙鶻健衝雪野駞馴北海誰求隠東都或對賔三􅀜寕設險八極揔歸仁悵望懐今古賡歌邁䓁倫短衣曽見寵長鋏每􅁯貧共往仍聮駟同吟更接茵玉山森巨石金水濯芳津夲擬追枚乗終然愧郤詵􅎷鳴来巳再鵬擊去何囙色挺淮王桂香生楚客蘋聖朝􅀄薦士江漢有垂綸􅀉吴正􅀓自昔携手燕南門長風洒雪衣不温向来􅀁見夢一覺今縦欲語舌復吞日斜忼慨與子别班馬跳躍東西奔色摩中州翠嶽聳波濯列壌黄河渾指麾齊秦擊快鶻􅇒厲楚漢抽枯黿彼雖失矣􅄑得此英氣挟酒猶飛騫常憶仲春大羽獵九衢絃直歸乗轅綵女紛行引樂伎材官夾道羅弓鞬湏􅁷紛騰一萬􅀐足􅀁未及塵爲昬中使計功促莚秩崑崙玄圃惟目存威􅃫文章倐能集祥麟郊藪􅀅不諠信知天邑自壮麗誰使㳺士争扳援悲㢤小草有逺志随即大挫栖丘樊恢竒俊偉莫子若便可上拂勾陳垣来乗東楚又一載此地聞舊稱䧺藩居民雜作他郡劇治道小試平生言秋行荒壖翠稲實夜艤巨濼眀珠燉定應矯首謂予􅂴青桂無花能返魂幽􅄚穿林鸞鵠唳大瓢挹海魚龍掀達湏出仕窮且􅀮肯以一腐終乾坤一咲一咲長竿折徒憐大海魚文章猶醤瓿塵土只鹽車白日燕􅄗劒清風禹穴書上林誰獻賦愁􅅸馬相如范蠡宅淡淡寒雲􅔏影邉荒山故宅忽千年大夫巳賜平吴劍西子還随去越船白石撑空留㒺象青松落井化蜿蜒徒憐此地無章甫只觧區區學計然烏震古錢烏震何年自鑄錢偏爐彂冶光燭天方圜肉好本不變百萬戍卒横戈鋋鎮州城南塵霧起雖有忠臣無孝子殘膚毁鼻遣還軍老毋孱妻傾淚水一時富貴千載兇摹爲􅀐􅀅空英䧺天子真􅀓内蔵竭小臣别賜銅山銅似此頗期􅀖國活􅁍囙貨利􅌹生殺但能擲地作金聲九府終存太公法聴客話熊野山徐市廟大瀛海岸古紀州山石萬仞挿海流徐市求仙乃得死􅂵芝老盡令人愁􅈬中滿載童男女南面稱王自民伍蒼劔凌天化曉雲鐡舡赴壑沉秋雨琅琊􅄗上望欲空日出未出扶桑紅魂漂三神入夢幻淚洒萬􅄦争英䧺真人獨見阜郷舄奉使遥􅀓鎬池壁桃源草樹同一香紵嶼蛟龍􅄆無迹古往今来亦可憐世間何䖏有神仙文成五利猶騰􅀃不惜秦年惜漢年題米元暉青山白雲圗一簇空􅄥杳靄間嵓花穴枼闘斕斑若為看盡雲生㓕還我青然萬古山題李西䑓真蹟去矣昭陵􅄟帖空西䑓茟力到江東知渠尚賴毛錐子􅂔壓長槍大劍中淵穎吳先生集卷之四
