body:
  text: 淵穎吳先生集札記卷第一五葉後十三行憢􅌊憢疑燒七葉後之誤十二行縣薄薄當八葉前作簿十二行呼嘑呼當十作嗚葉後二行噌泓泓疑吰十一葉之誤後六行儵魚儵當八作鯈行逃晴晴當作睛卷第二二葉前八行石璧璧當三葉前作壁五行突奥突疑穾六葉後之誤十一行載藉藉當七作籍葉前一行匾當後九作行邦瀆􅀖疑刋八葉後之誤十二行壁月壁疑璧九葉後之誤三行操瓢瓢當十二葉作觚前六行孔璧璧當十三葉作壁前一行繪禳繪當十五葉作禬前四行上膏上當五作土行龍疑斑十七葉之誤後十行綿屏綿疑錦十八葉前之誤十二行沉理理當二十葉後作埋十三行扶桑􅚐􅚐當作暾卷第三一葉前九行突奥突疑突十一之誤行㘅浞浞當二葉前作泥二行令承令疑今六之誤行歧右歧當十二作岐行壁可假壁當八葉後作璧九行白接籬籬當九葉前作䍦十二行當令令當十三作今行教載教當十葉後作數九行灣水灣疑灤十三葉之誤前三行白矣矣疑首十五葉之誤前十行詩與書當作書二十三葉與詩前十一行鼓筐筐疑篋之誤工事工疑王之誤卷第四二葉前四行暝須熟暝疑暝五葉後之誤九行柱使柱當八葉後作枉十一行漆國國當作園九葉前十行迄中立迄疑屹十葉後之誤六行遺趾趾疑址十三葉之誤後三行閩橋橋疑嶠之誤十四葉後六行芭樵樵當十五葉作蕉前七行桂壁桂當後二作挂行臣石臣當十作巨九葉後十三行分斑斑疑班二十葉後之誤十二行肓聾肓當二十二葉作盲後十行􅆈犬熬疑獒之誤二十五葉後六行馬捋捋當二十六葉作埓前四行枌撩撩當後四作橑行貫酒貫當作貫二十七葉後八行扶桑􅚐􅚐當三十一葉作暾後三行鎬池壁壁當作璧卷第五四葉後六行十鈞十當十一作千行廓廟廓當八葉後作廊一行干殽干當十三葉作于前十一行九行九疑凡之誤卷第六二葉後一行轅陶塗陶當五作濤行諸俟俟當十三作侯行使也使下疑四是之字葉後十三行名名當作六葉前若名九行析衷析當十葉後作折四行密子賤密當十八作宓葉前四行令則無令當後十作今一行鶴􅌁􅌁當作氅卷第七三葉前十二行析而爲一一當十葉前作二八行授業授疑受十一葉之誤前十行境上上當作土十二葉前二行竭石竭當十六葉前作碣十二行怛言怛當十七葉作但前四行管蒯管當作菅十八葉後一行滔人滔當九作稻行父父上疑二十一葉是召字前七行魯俟俟當二作侯十二葉前八行䠨仰䠨當二十四葉作瞻後九行礙當十作罔行䴢來䴢疑麇之誤卷第八六葉後六七行春亂春當七葉前作秦十行黎園􅀺當八葉前作棃十二行久沙沙當九葉作涉前七行戒服戒當十三葉後作戎十三行拘馬拘當十四葉作狗前一行古音古疑舌之誤卷第九一葉前九行旖蘭旑當二葉前作猗十三行麥秀嶄兮嶄當後十作漸行騞虩􅊒疑之誤五葉前十三行顏面弗當八葉前作靧八行時蒙時當十葉前作待六行狐平孤當作孤耆先先當後二作老行始不究乎始疑殆十一葉之誤前二行政今今當後十作令一行鈞得金鯉鈞當十二葉作釣後一行玉蠒蠒當十五葉作璽前三行嘗置成成當十作戍六葉前十行宋少文宋疑宗之誤卷第十一葉前八行制基制當三葉前作創十三行梁米梁當四葉前作粱一行不渴渴疑竭六之誤葉前十行維糜糜當七葉後作穈十行查滓查疑渣十二之誤行讌飯飯當十三作飮行鳴呼鳴當九葉後作嗚二三行􅏫悽􅏫當十葉前作慘八行吾賞焉吾上當重十一葉正也二字前五行矛循循當作楯十二葉後十行成疆疆當十二作彊行秦第第當作弟卷第十一一葉前九行且不能能衍一三葉後能字四行匆復追匆當四葉前作勿三行所廢廢當作十葉後發七行高第第當作弟卷第十二八葉前一行鉛當九葉前作汞八行太河太當十葉後作大八行言與利與當十作興行絲理絲當十二葉作經前一行埸疆當作十五葉疆埸後七行剡子剡當十六葉作郯前二行甞乎出乎疑手之誤附錄一葉後八九行至終第第疑篇之誤是書初印用明嘉靖祝鑾覆元刻本戊辰重版蕭山朱翼盦先生出其家藏宋璲寫刻本借印璲字仲珩文憲仲子此集寫于元至元間卽祝氏覆刻之祖本也祝刻文字毎有臆改如三墨改爲三􅒡黃能改爲黃熊不一而足取對此本方見眞面書貴舊刻有誠然者仲珩工篆隸手寫此集字多古體迥異坊刻其間字畫差池誤在手民落葉几塵所不能免因成此記取便讀者罣漏之誚不敢辭也己巳夏日閩縣林志烜
