front:
  text: 淵頴吴先生集卷之二門人金華宋濂編
  hash: sha256:ad37540faccb656a086555ee27899cae11fa5cccb3e8a2e9749ebf6eb919fa60
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_002-1a}
body:
  text: 觀孫太古周天二十八宿星君像圗大圜杳何極鼇柱屹不傾日月光㝡耀衆星莽縦横周天二十八錯粲各有名荒㢤審厥象晃奪目睛東垣青龍崛西圉白乕獰翾飛鳥隼状偃伏􅀛蛇精􅂵宮自然拱銀漢無復聲五行􅀁經緯甘石知性情上界􅁕官府神人居穆清韡曄逞幻怪顤顟振鏗轟跳踉􅄦脚捷舑舕獸面頳裳衣互躶襲角鬛紛披鬇豈其太白變嬉戲􅀋孲孾或者熒惑動威怒流欃槍照臨多芒角􅄤次在縮贏揣摩過人料綵繪匪世程伊誰駕一氣得以導九坑想像􅁜倒景觀㳺撫澮城虗空何宮宇蒼莽孰莭旌毋寕秉筆際溘此埃風征凡夫本狹見四頋惟寰瀛夜义冰澨呀羅刹炎徼瞠鮫女賣綃出狗夫㗸筯争祗疑列宿質却混殊方氓山神對我􅀶刻石華山陘海神靳我畫浪捲滄海鯨天神詎可識萬古欺聾盲星占丗有軄畫史吾奚評病起讀列子冲虚至徳真經雜題八首太虚無停運萬化緫一區機鈴妙出入氣質夐然殊春鳥春花艷秋蟲秋草枯榮華豈我有變滅僅須􅁷彭殤何夀夭堯跖孰賢愚生年甘肉食死骨委鳶烏吾知形骸在坐此力命拘扢扢焉得已悲㢤天地爐世間豈有極海外猶齊州日月更出没江河却同流本娥追即死章亥步􅂚周蠓蚋生不乆鯤鵬背吾㳺神瀵湧滋穴巨鼇戴蓬丘想像或可到徘􅆦獨懐憂南方祝髪祼北國鞨巾裘逍遥特爾分智者善自謀黄帝居大庭華胥甞黙存穆王望西極肆意㳺崐崘虗空乃不閡夢覺􅅸無垠感變互起滅精神遽飛騫魯儒乆迷錯周役恒囈昬蕉鹿真未辯爥龍妄相燉古莾多睡眠阜落但歩犇幻化自来往至人寧汝論世人有至巧何者能自然作衺出技藝行險弄機權孔周神劒光偃師舞倡妍泰豆計木塗甘蠅觀蝨懸氣鈞但一􅚘物化匪吾鎸洪纎各以正動植悉根天公輸制雲梯墨翟獻飛鳶微矣執䂓矩彼夫惡得賢神巫善相人壷子如濕􅁅扁鵲巧發藥季梁病弗治一形苟脫落純氣固委虵随火出石壁泳珠没􅁋隈彼或蜩翼得此猶漚鳥疑中心既怵殆外物盡坑谿幹殻即木葉皮膚􅀋嬰孩逺矣列姑射吾為榮啓期古人合神物螭魅􅊖􅀅迎蟲蛾亦麇至鷹鵰即旗旌分廬通異􅀋禽獸觧音聲牧正得乕心狙公識狙情羲農状牛蛇聖徳泊無名㢘来挟犀象暴行恣狺争淳澆日以􅄆物我兩相驚後世自魚肉傷兹横目氓大道無崛曲多岐竟忘羊窮通偶然值􅀝伏焉可防枯梧元若險白犢詎非祥棄車儒著盗墜䑕俠攻倡情慾心不滅䆠㛰迭相攘君臣道未息服食􅔡犇亡日暄疑狐貉芹枲勝􅁏梁宜㢤爰旌日喀喀死路􅅖此日忽過隙居人恒鮮歡毫毛􅊖為我體莭欲求完大盜竊名爵小㢘捨豆簞熊魚徒兩得利義肻兼安馬醫自不辱燕技毋庸干時勢苟未至事功良獨難蕭條白麻􅂂􅃤澹青蘚冠長嘯荅鳴鶴北風江水寒送鄭獻可南歸莆田􅀉周公甫自昔道術本一原後来雜沓乃異轅粤􅀙西漢始立傅獨守章句稱􅌹門唐人䟽義不改舊宋代理學交相敦吾知衆儒此間出遂指濂洛為䧺藩當時莆田有先達信爾夾漈好弟昆彂揮聖賢本根殖評駁遷固枝葉繁典禮會通尚可志儀章噐數疇能言居然韋編塞篋笥旋用束帛徴丘園恵施五車却陿隘方翔千櫝徒飛騫公車奏上欠大用屋壁蔵在傅諸孫世家相承㡬譜系宗庿􅀁重真璵璠馬圗隂陽太極秘麟史衮斧天王尊文苑儒林各突奥父風祖徳猶光燉一朝便簉列宿次何事夐隔勾陳垣􅀊晚東㳺􅄑我接江城極論餘空樽海上山川恍可到閩中􅂄舊嗟無存考亭過􅀙即􅊴里麗澤講習或艾軒至正須求汝墨斵大和定許吾箎塤微飊翾翻剔橘蠧積霰呌嘯招梅魂别懐未盡苦竹雨歸路亟趂扶桑暾周君故人我同病名郡重席特爾温尺劍母令􅂵氣􅀮寸􅑟􅂚救黄流渾子魚舟通牡蠣浦丹荔樹暗桄榔村摛箋送客復有憶卓矣人物撑乾坤新得南海志觀宋季崖山事蹟故國今安在新營忽此山藩王􅀵未燼義􅀅扞􅁁關典禮存周法威儀復漢班開衙旗幟動結寨舳艫環莭制通江邏槍牌集洞蠻瀧濤多擊磢􅊐嶠半榛菅置陣移官港惟宮泊女灣狗流疑尾掃龍殞莫髯攀奠殯須求􅁇驅馳獨任艱搶攘殘戍屋殺僇罄居闤玳瑁洲仍隔􅃢瑚島併跧乹餐烓竈减鹵飲轆轤慳道㫁無前援民哀有老鰥􅄓掀雲赤暈鯨闘雹朱殷大業􅀙舟盡元戎棄仗閑炎丘朝服襲貝􅊴御弓彎􅉏僕随冠冕嬌孾泣劒鐶駃騠衝柵象精衞避籠鷴敗氣徒延湍英飊欲起孱一沈知有决再􅅞懼何顔去矣曽青盖行㢤彼翠鬟城危嗟唄閙井辱痛脂斑出􅇂空懸令廽軍却算鍰蜀瀘家失奥襄漢國忘􅗚月照丹心苦風楊白骨頑䛕儒輕戰勇􅁾史進降姧世逺神終在天髙淚或澘綺羅歸北府疆理混南寰毒浪悲潺内􅃄氛蒼莽間一時磨石䖏萬里凱歌還早秋偶然作􅀉宋景濂我病三月乆問言此何時山林日揺落草木欲變衰忽来臨青鏡何故摘白髭千里復萬里逺㢤鴻雁期去年憶吾父覉客在廣州今年憶吾父官属大長秋漢宮戒服御周典進膳羞惜兹不得去目㫁五城樓西風吹梧桐一葉兩葉積故書翻有塵䧺劍掛在壁時非合窮困事到即輝赫除却雙鹿行門前少人跡故人三兩人江北乆覉旅尋香古􅈳風歩屧􅁱廊雨􅐜鱸㝡有味稲􅈉紛難数我欲往􅀙之蠻潮正掀舞悠悠秋夜長夢􅁴秋月霽有材寕及人無學敢求蛻揮来河水絃削作泰山礪吁嗟祁孔賔得失毫髪際士欲知自重今人猶古人馬卿志封禪揚子述羙新當時文字間萬丗寵辱伸董京不可作愁􅅸麟乎麟北山有古寺􅁱竹炎天􅈵蛟龍踞兩澗鸛鶴鳴層岡心臺月照白鼻􅀚􅃄通香可思未可到詠此招􅀮章陳生愛神仙百日常病十手攀琪樹枝口誦蕊珠笈山衣縦横披石廪傴僂入何如一尊酒自觧憂思集自来閑作詩瘦島與窮郊瘦􅀅􅊴粱􅁏窮或潜榛茅水流苔間石花亞竹外梢聖愚緫灰滅何苦彂咲嘲往者東入海飄然任􅀁如大風􅆷波浪飛雪洒舳艫壮志昔尚少狂㳺今併無誓登盤陀石重望扶桑墟泰山髙􅀉陳彦正泰山一何髙髙㢤極青天世人欲上不可上層巗峭壁徒攀縁望中􅅸頂路巳斷石穴上出鐵鎖下絙㦄趢相鈎連誰歟愛竒者歩歩喜若癲一心不頋死􅃗手捩長􅃄毛群驚逥少乕豹羽族跕堕多烏鳶浩氣剛風􅅮結虗空作世界蜚龍捷􅄦鑿開混沌巢神仙道逢四五叟含咲使来前黄冠皓髪傲凡榻野菜素粥鋪盤筵自非爾願力何計此留連當知仰扣曖昧雲霄有頂䖏淂不俯懾嶃巗箐棧無窮淵嗟兹大凢夫行尸走肉真腥羶叚䂮思家㝡可惜李紳戀俗終難鎸舉頭告神人苦乏風馬与電鞭藤蘿束􅅞即縋下但見松柏櫹槮数萬仞石􅏢突屼横戈鋋古来秦漢東封不到此惟問梁父併肅然日􅀚嵯峨恍在下蓬莱浩渺空樓船彼云鯨可射此謂狗􅀎牽安期羡門一往不復返文成五利受寵驟貴祈長年仙人自有真至道何由􅀓逖焉龍漢延康紀去授金璫玉珮萹胡仲申至自予與子别三載不㡬見白雲日髙飛恍若覿子面我病乆不出衡門􅀉函夐子来尚予思􅊐路踏蒼蒨當軒坐甫定咲語起我倦新文十餘萹茟墨擅百錬口􅀓彂秦壁竹簡鑿晋竁考論無差爽風雅有正變丗􅚨弄俗學雅曲極熒衒群羊雖冒乕草恱豺則戰誰其制横潰或者􅪜瞑眩牛毛獨不多麟角時一現朝廷方太平炎海忽馳箭人材需更急巗谷遽乗􅀓終然務􅆂蓄可以待推薦問子古丈夫何人乆貧賤首峩逺逰冠雙眼爛如電西上石頭城大江流一線䄂中羽獵賦雲氣擁宮殿燕山去子咫萬里障冰霰壮㢤子此志我喜手脚旋撫劒爲子歌張燈趣予宴俄其送子歸贈子端溪硯行行􅂲自今宛轉異郷縣天霜􅀍四野老馬困蒿菣聖人猶待時中道匪狂狷蠧魚不負子籖架三萬卷我豈犇競􅀙東勞復西鷰􅀚陳彦正觀景拄梜歌山人拄杖手自携滿杖刻畫􅀋土圭春秋星辰本不錯彼啓我閉疇􅀎齊日出扶桑照濛汜南北廣輪定㡬里老羲奉駕何太速三􅁕神烏爲之使旦朝舉杖向天移插表測景少叅􅆧騏􅂹過隙不踰晷蟾蜍􅄍波同報時世間惜把天機􅂥杖底強稱量日月蛟螭變去甲鱗生霹􅋬搜来光彩滅自従宣夜無法􅀓紛然周髀與渾天嵩髙窺候尚一律二極􅀮見仍分􅄤日南交愛通海陸海中諸星却未瞩雁門寰蔚􅅸龍沙鐡勒湏􅁷羊胛熟天髙地逺渺緲紘章亥竪亥脚力争出入安穹􅁕議論絰營鮮洛空璣衡我朝華戎早一統山梯海航萬國共火嵪尾閭侵暑􅀬骨橋魑魅壓氷凍古今陽城一岳臺三十六度増减来郭公新製十五表天下日影無纎埃吾知渾天爲中國東南海際殊傾側周髀夲囙勾股淂崐崘當中標四極茫茫堪輿一氣浮邹衍九州復九州蚍蜉蟻子託大樹大樹􅀁託終難求嗟㢤周渾􅀃未定拄杖在手与日􅔡一行暦術久成書康莭算學知何如􅀚秦丞相斯邹嶧山刻石墨夲碑邹嶧之山在何䖏始皇立石改名􅃅史籀古文相斯變蛟龍盤崛獨精到自都咸陽制六合曰救黔首烹強暴盭深擅更秦新法繁縟盡剗周未造掃除井田設斗角盪滅封建癈圭瑁􅀵兵鑄鐻銷㐫噐斥塞築城斮梟驁當時大開阿房殿萬世永戴黄屋纛胡亥矜慢不改轍趙髙指麾豈謂孝四極巡㳺何功徳群臣刻頌直羿奡金乕淪亡竟不守白蛇劒死徒驚譟荀卿著書本性惡弟子承學愈言耄古今聖賢使閣束五三載藉遭煨爆越人鳥駭汝苦兵蘄卒狐呼汝召盜宜㢤東市得具刑矧痛吾儒有名教太平真君一拽倒枯篁野莾火􅈬燥􅂐家法妙尚鈎勒􅀥木字肥略顔貌陽冰石經欲􅑹乳楚金䖝匾猶躇蹈文章䛕佞合鎸削茟墨􅉞􅅸強則傚小齋客至無寒具眀窓浄几急洒掃後代續刋縦膚淺先秦遺跡信堂奥鵝鼻峰頭不可上魑魅晝泣駭熊豹會尋碣石探之罘乗興去浮滄海櫂觀齊謝玄卿五洩山遇仙記􅀉題五洩山寺􅇮聞一竒士深入五洩行五洩何䖏􅀁長溪遶崇岡微風生天籟急瀑洒石梁金磬夐欲響縞衣爛廽光綺妓開朱閣靈仙坐玉堂傴僂即進謁裵􅏆遽鳴璫􅄑汝得大藥扵兹赴玄郷玄郷且留宴􅁾臓勿彂狂髙座瓊煇施碧幃琳華張芝英雜桂腦螭髄間鳯􅄴太容揮四弦王母彈八琅羽旗素蜺騫黼轂螣蛇􅋮眼珠便爽朗肌骨遂馨香日星恍在下海嶽極緲茫嗟予頗探勝古路但縦横青童邈不見寳刹屹相望山峰挿􅃄霧潭級跳氷霜螻螘小窟穴蜉蝣亂飛揚終然雲錦笈照以乕鞶嚢千年或頃刻萬里忽扶桑謝卿自獨往矯首盍囬翔咲採金眀草浮顔安可常送鄭彦貞仲舒􅅩姪北㳺亰師鄭君系本自義門門首植表孝義敦祖孫九世􅀋一日聚族千指通晨昏酒食巵匜口共飫衣裳椸架身同温家宜富饒積粟布里或饑窶資饔飱大宗小宗寖以邈東眷西眷疇尋源復除􅂚下省府令延譽靡間郷閭言禮俗興衰頋不重風聲勸慕猶兹存䄂中懐文扣􅀁部行矣望􅊴期軒騫燕然何許水陸隔越驛踰月舟車犇邹嶧邳山岱嶽竦蜀江􅀖瀆河流渾榆關崇墉峙乕駮碣石漲海澆蛟黿北州塵沙遽萬里天邑氣象䧺㣲垣昇平多年正黼扆郡國麇至駢肩跟五柞長楊劍㦸接控弦突􅀐旌旗翻鴻鴈飛鳴羽未肅魚龍變化光相燉世塗人事豈可測儒術政理須攀援嗟予昔者忝俊造翹􅁕到今勞萝魂乗時一去欲迅奮枹病日劇徒丘園阮郎竹林夕並秀韋氏花樹春仍繁榮親顯已在此舉惜不往餞空罍樽嚴􅁜應仲章自杭􅀉書至賦此荅之故舊何懸􅅸閑居欲反招幽并風雪緊楚越水雲遥短􅄄緇塵破長鐔寳氣銷門垣成􅀮􅇣茟櫝到畊樵逆旅呼燈夕􅁱闈􅜂棘朝嚢書題薈蕞彂論獻蒭蕘舌熖真熏灼胸兵劇鍜􅂖乗軒南國鶴觧鏇朔庭鵰斡運天垂斗蜚騰海作潮荃蘭騷地變橘柚貢年凋色采黄朱黻音聲徴角韶潜身甘蟄蠖賦命􅀋茗鷯筮仕􅀛無兆攻經教有條秦灰完竹帛漢粕味簞瓢畫品翎毛貴鷄塲􅀲距驕文章通政理道義勝官僚􅀊月嗟悠乆湖江耐􅄫􅋁花濃携酒榼栁霽賣餳簫制乕揺金錫驅黿駕赭橋流連光景賞播蕩别離謡世咲烏非鵲吾憐狗續貂呼􅃅三跀􅒄忼慨五􅁜鑣落落山中桂叢叢澗底苗依然百􅀅略付与霍嫖姚富春新創􅀜􅀅軍廟成吴子中携卷索題吴生病起有怪聞萝中識淂髯􅀅軍香火乞靈自此掲廟門釃酒㯶櫚雲我曽乆讀名􅀅􅀓􅂵金熖眼頳玉面漢鼎􅏠離强分割楚鋒剽狡輕攻戰天荒地老路不通魂升魄降骴秋蓬神仙負劒乃兵觧巫覡􅀓芭真􅄦䧺壮夫夲合荆州死嚴祀何㢤富春里只今江左四祠無狄公髯乎髯乎獨不恨見孫江東題錢舜舉張麗華侍女汲井圗景陽宮中景陽井手出銀盤牽素綆鉛華不御面生光寳帳垂綃花妬影臨春結綺屹層空壁月瓊枝狎客同鴛鴦戯水池塘雨蛱蝶尋香殿閣風日髙歡宴驕若訴床脚表章昬不窹吴兒白􅂁戰鼔死洛􅁟青盖降船渡井􅅺無波井欄缺半􅀧胭脂汙緋雪蕙心蘭質吹作塵目㫁寒江鎻江鐵題李伯時寳津􅀐士校馬射圗東都天子􅄑寳津左右突􅀐多近臣少年㩀鞍即齊􅁕青栁絳綃不遺鏃前手引弰如附枝後手放箭箭不知羽林劒客塵霧瀰蘭䈥蕙腕雹聲馳先朝射技兵恨弱舊柵毬門馬驚躍軍書到夏風噴河使莭通遼雪跑幕南宮試士親見来茟下俊􅇣真龍媒澄心一􅁓依俙在畫家六法猶神彩誰歟醇駟誰牛車􅀵盡騏􅂹筞蹇驢男児虗用懸門弧嗚呼壮㢤彼武夫題姚文公草書杜少􅁜詩手軸崔仲徳􅀁蔵彭蠡東流白泱泱匡廬五老青開張我公宴坐展詩史燈下搦管草􅁆行目瞭手熟快掣電茟銛紙􅉒眀含霜鸞鳳盤廽恣舞躍蛟龍崛強髙騰􅋮當知􅀁貴務道徳况復不朽􅀓文章中州故家胄子出累代􅂄夀真儒光搢挺端紳尚色正操瓢染櫝仍謀長藉令鍾王可退譲勢與董賈同翶翔大兵昔者潰漢鄂南士何䖏潜茅篁北風􅀍髪亟死水眀月􅘳馬勞追亡程朱學術此􅎯蘖姚許論次極審詳立舘過庭竟兩得蒐􅀴摭􅀓疇殫量聖朝混一闢海嶽勲武雜還銘旂常麟閣鐫詞照百世鷄林定價驚殊方紺宇琳宮鼎負力豐碑鉅碣戈垂鋩英華熛彂永不滅翰墨㳺戲􅂓徜徉崔君妙年􅄑侍坐安陸遺槀曽􅂑􅀅半披丹繪乆舒卷滿幅縈綰苦襲蔵吾觀河汾數来往敢愧藉湜或汙僵􅁱杗短桷未收拾巳矣我公今棟梁問五臓我問昔生我繫胎果何神上顱下負趾五臓交錯陳胎􅀴巳不􅁕乳湩復不匀黔䨓不我職粉飾强為人自宜多菑害無以保命真元氣日啙敗客邪作艱屯彼何瓠而肥言貌勇若震此何黴而瘠肢骨弱不伸嗟夫賦命間豈不汝由因我誠不汝慊贏嗇胡不均五精􅀍我惱訴我蒼蒼旻恍然欲我荅天道汝當遵粤自汝有生􅄤次逆星辰矧􅀙汝生後􅆷賊逯汝身心􅀆夲中居與汝相主賔汝何不秪敬狂役􅀋風輪坎離漸違行龍乕起戰嗔一元竟不守􅄆入萬微塵惟脾制水􅂖四體承華津肴胾噤汝口酒􅄴􅅸沾唇司禄不上計畀汝藜藿貧飢賜常九回苦吻添荆榛何天不汝錫服用無箱囷抑汝弗事天􅆍食失鼎茵天夲不病汝汝實使病臻汝仍不耐病虗躁復善顰内虧但外飬衆藥聚毒芬金石草木蟲􅅍投劇斧􅚙五精恒不寧􅆾沴積相熏寒増􅀬或壮頃刻異氷薪當知汝五臓獨不與汝親何庸汝反詰闘我似越秦吁㢤一臓損五臓遽不醇齒牙漸凋䘌膚肉還削皴汝徒軄汝軄軀殻有君臣天曽盡賦汝造化匪不仁我聞五精言鑿鑿緫有倫曰人夲之天辟若泥在鈞一時巧相值萬物混無垠聖愚且同臝毛介與角鱗我惟有心肝是􅃅横目民心肝既属我榮衞盍絪緼徧㦄􅏫濕滑備嘗酸醎辛虐汝重役汝汝淂我緇磷蚯蚓尚無臓静夜觧唱呻蝴蝶亦復然翾飛媚陽春彼寜心肝具物性各有循鏐納或􅁟化死生僅昬晨自今我即安無往不寵珎忍令百􅀊後銷變爲􅃄燐曲肱便莞簟就口􅂑膮臐五精速歸臓大宅雧靈氛張毅喜犇赱􅀬中果如焚單豹好容顔饑乕特汝隣二者乃天道我􅀅何􅀁云作詩示同黨􅂓以􅀶咲忻題永嘉唐氏清莭䖏士卷永嘉古郡控海隈東望萬里連蓬莱龍湫噴天作雪下雁蕩㧞地穿雲開自宜􅇣人此遁跡表以清莭無留埃吾知出䖏本一􅁤肯使物我長相猜昔人可仕㝡觧􅀮圭竇不掃蔵崔嵬醉閬􅀐馿或市過吟逋放鶴終船廽今人可􅀮獨願仕駑馬並駕駈喧豗蘭臺文章与世変梓澤賓客随塵来就中好髙欲逺引否則希進􅀅難媒路途九折􅁕險惡巗壑千疊多風雷直􅀙黄流屹砥柱净洗黒月􅀵炲煤道義榮華果異趣夷齊跖蹻徒驚鎚扵焉􅄀心混標鹿况復曠眼窮紘垓春秋栽花色擁砌伏臘醸黍香浮杯何山樵蘇採茷蒨某水釣泳航湾洄平居苟求食飲遂至樂奚問容顔摧伊予頗讀􅀮􅇣􅀓恨不􅈳躡􅃄霞堆素行􅀓家即政令虗名掩實湏根荄晴窓撫卷盡達者秃茟落紙誰詩材人生大莭要礌又慎勿枉築懐清臺白髮辭􅀉荅陳時父昔予頭燥􅄠未茁今我頭枯􅄠先折童心尚在顔貌改滿􅁂蒼華􅀧霜雪朝来抱鏡看未真鏡裏相逢􅀋兩人東都貧孟嘆􅀌劒西邱老康悲故茵烏髭每怕不淂素素􅌨何庸問衰暮楓林葉底変風􅃄藥草莖􅁁虗雨露自非神仙劉阮儔世間容有㡬春秋情知􅔏鶴長朱頂淂見鴛鴦㑹白頭黒海青歌越山山有黒海青長拳快眼徤羽翎三年籠飬未得飽萬里驍俊猶飛星黄蘆老葦日摧折白鷺文鶬看磔裂腥沾石磧吹逺風髄擊寒岡􅄆􅁿雪伊人脫手夲凡禽􅀊晩連絛到上林鉗奴素賤多侯骨􅀐士虗豪即侠心晋宮邱􅆸身􅁒死燕國雲銷草如砥嗟非鵉鳯髙杳􅄀望盡狐狸衆披靡當時奉使探逺巢兩徼馳兵聞勇鏖南土誰知此鷙猛北州驟見争驚􅃅天鵞薄天垂尓翼海青雖黒打可得太平八極無不通函谷何問􅀜西東小至日􅀚三山林霆􅃱日􅀴作昔在江左國閩人有林霆白衣召上殿口誦􅆀日􅀴卦爻遽可驗聲樂洞吾􅄀爕調乆不軄民物􅀅何寕前朝百䘮􅅍四鄙長羶腥辟王真贅旒兵釁劇建瓴􅂄􅀛強占决福極矧兆形一元不汝體萬蟄安􅀎醒自今彂孔璧兹欲論漢廷春秋紀菑害河洛㩲奥靈日星夲照燿川嶽恒流停犇騰狗吠野播盪鯨翻溟扵丗或間有匪天誰􅀁令天功巧旋斡聖造務徳刑勾萌草荄甲氄􆈯鳥羽翎和風􅁕氣運化景多年齡私疑彼磬錯否者此鍾莛徴冬即花綻羽夏囙雪零隂陽特揮霍律吕暫聽熒毋庸緹室琯便叶茅堦蓂嗟予偶撫卷黙坐但空㕔亞􅀊肇曆數祥雲滿郊坰羲和不可作蠧蕳猶餘青董生尚爾溺霆也吾鎸銘大食缾西南有大食國自波斯傳兹人㝡觧寳厥土善陶埏素缾一二尺金碧燦相鮮晶熒龍宫獻錯落􅀑斧鎸粟紋起􅀧綴花穟蟠蜿蜒定州譲巧薄卭邑闘清堅脫指滑欲堕凝瞳冷􅀅穿逖㢤賈胡力直致鮫鰐淵常嗟古噐物頗爲世􅀁􅂢襆衫易冠衮盤盎改豆􅇼礼圗日以變戎索豈其然在時苟適用重譯悉来前大寰􅄑混一四海際幅貟縣度􅅞繩絙娑夷航革船鑿空彂使莭随俗混民編漢玉堆櫝笥蕃羅塞鞍韉城池信不隔服食柰渠遷輪囷即上㩀鼎釜疇能肩挿葩奪􅃩冶盛酪添馨羶當筵特見異􅀶識無庸詮蔵之或論價裹此猶吾氈􅃢瑚尚可擊磧路徒飛􅃄彼還彼互市我且我桮圈角貒獨不出記􅂑征西年時儺古人重儺疫時俗事繪禳􅀊陽欲改律輿􅄦䆮耀鋩厲神乃恣肆魃􅈮併猖狂侲徸􅄑成列巫覡陳禁方􅍑頭眩金目玄製炳赤裳桃弧􅇌菑沴豆礫斃癉剛八靈悉震慴六合髙褰張清寕信不害動静維吾常丗塗頗險盭人魅更跳梁狐䑕戴介幘䕫魖􅀼香嚢煎熬到膏髄擊剥成疕瘍乗風作國蠧抵隙為民殃自􅀙九鼎没誰使百怪蔵瘃寒服禠帛饑窶食􅐬糧蘆花敝汝体橡栗饞吾腸地膚竟捲去天孽俱凋傷神荼欲呀啖蟠木蔓不長䝉倛強顔貌枯竹無耿光聖言謂近戲五祀徒驚惶惜㢤六典癈述此時儺章歳􅀄喜大人囬自嶺南遂携児諤北行送之乍喜吾親返還携稚子行風沙千里道雨露九重城舊㠶江潮逺新装􅊐瘴清長秋官属盛去可接簮纓此去知何䖏飄然惜爾年塵飛馳馬埒雪擁讀書氈日􅀚躋攀外雲臺獻納􅁁文園寕乆病要奏上林萹溪行望故友黄眀逺槐塘新墓往代衣冠日已賖故山棺槨此為家􅀴荃義闢中州魯樂調辭譏下里巴涕淚無􅀙餘宿草文章可惜䓁風花嗟兹便􅁒酬鷄絮目駐前溪有落霞􅊐南宜濛子觧渇水歌廣州園官進渇水天風夏熟宜􅄥子百花醖作甘露􅄴南國烹成赤龍髄棕櫚亭髙内撤餐梧桐井壓滄江乾柏􅀚金莖擎未濕藍橋玉臼擣空寒小甖封出香覆錦古鼎貢餘聲撼䆮酒客心情辟酒兵茶僧手叚侵茶品阿瞞口酸􅄼淂梅茂􅁜肺消誰賜桮液奪胡酥有氣味波凝海椹無塵埃向来暑殿評湯物沉木􅂵蘇聞弟一􅊐南六祖禪師菩提樹下蔵髪甕子圗歌蕲州黄梅峙佛塲新州獦獠識水香菩提樹間好宴坐五色頭􅄠騰毫光金刀剔落受法戒瓦甕􅄟藏􅀓不壊捩廽萬夫矗梁棟陶冶千聖掀爐鞴南海標来刹十圍北宗望㫁六銖衣塵鏡本空空即夲風幡非動動還非山僧礼拜山􅄦護一花五葉開如故寳縷青懸雪􅊐􅃄神珠紺結丹丘露世人長物合剃除謝公枉矣施髭鬚唐年􅀞筆石未泐大鑒壇􅀴誰讀淂夜聽李仲宏􅀃廣州石門貪泉大粤控南海茫然天地陬石門屹有限巗瀑蓄為湫何㢤清㓗名坐与貪濁侔使軺一杯飲蠻賄即繭抽金珠混寳蛤孔翠爛相繆烏文暎呿陀噐物窮雕鎪㓟鬐蛟龍悚織毳乕豹愁島屿刮欲竭民夷起争􅄷聖王不忘逺姧暴合汝郵靈若尚嗇貨惡風無時休嚵波半桮杓渇沫萬㦸矛氣機乃日変棓克非人謀私疑勢至極實尓釁􅀁由妖巫挾左道峒䝤称豪酋支祁妄觧鏁蝘蜓怒翻舟人鮓或併命吏商豈良籌逝􅀅尋泉源纎滓忽不㽞復思漱泉瀨麄􅁾悉以􅪜洗除崐崘窟䟽瀹渤澥流一塵了不動六合嚴如秋嗟吾此身小􅄑獨為國憂従兹斥聚歛矧彼畜羊牛馬援空薏苡王陽但衣裘百世不易操嗚呼我賢侯北方巫者降神歌天深洞房月􅃮黒巫女擊鼔唱歌彂髙梁鐵鐙懸半空塞向墐户䟽不通酒肉􅒔沱静几席筝琶朋掯凄霜風暗中鏗然􅄼敢觸塞外祅神喚来速隴坻水草肥馬群門巷光輝燿狼纛舉家側耳聴語言出無入有􅇒崐崘妖狐聲音共呌嘯徤鶻影勢同飛翻甌脫故王大獵䖏燕支癈磧黄沙樹休屠􅀵像接秦宮于闐請騧開漢路古今世事一渺茫楚禨越女㡬災祥是邪非邪降靈塲麒麟􅀍髮跨地荒天台山花蕊石茟架歌天台髙山屹蒼空山神染石填青紅良工􅅣之手運風閣我綵茟虗玲瓏勾芒香動上膏彂蓬莱髄流花作骨一雙粉蝶迷宿魂五色斑龍蛻幽窟古硯南披黯淡灘摩挲鴝眼映豬肝低窺墨池渤澥碧仰􅀝書鎮嵩峰寒滿案層巒何䖏􅀁宛􅁜老兎論功緒錦繡心膓吐有雲莓苔面貌凝為雨翰林學士花生茟亰洛新来花様出浮花浪蕊一掃間嘆息揚䧺白我玄題南平王鍾􅀓酌搏乕圗南平酒行山險巇日暮猛乕相抱持㒒夫辟易不敢近雙手現出十狻猊口乾大喊眼光爍腰無寸鐵起徒搏沙飛石走風爪牙草折林摧雪齦齶人強獸勇盡力争形格勢禁過用兵英䧺變化動霹􅋬冨貴偪拶􅀵欃槍老羆當路叱貉子指揮六州稱刺史摩挲乕鬚淮甸闘啖嚼虎膽閩城靡少年本是貧少年狂卒成功䓁醉癲盜應有道􅄑竊柄王竟不死還横鋋一時豪特誰與畫千古畫圗専􅁕戒投弓弃箭浪紛紛馬上愧殺裴􅀅軍題􅀽子仁􅀁蔵巴船出峡圗巴山一帶髙崔嵬巴江萬里􅀙天来前夫疾挽後夫摧黄牛白狗遽船開曉風東囬水西上􅁋澦堆頭伏如象盤旋鳥道怕張帆汨沒龍淵驚掉槳世人性命重濤波吴鹽蜀麻得利多怪石急流湏勇退貪夫險魄謾悲歌神禹釃江江更惡五丁鑿路空巗崿舟船可坐尚髮危棧閣能行終淚落嗟兹舉目無不然直愁平地即山川至喜亭邉􅂓酹酒長年三老好攤錢觀唐眀皇羯鼓錄後賦歌上皇天寳全盛年花奴抱鼓踏御莚頭如青山屹不動手似白雨㪣圎棬大聲嘈嘈忽放肆都曇答臘矧敢前小聲籠籠復嘌殺耶婆色雞最可憐風吹宮墻欲罷笛月照邏逤徒揮絃纎蘿不起見秋爽萬杏争彂催春妍雅琴清商却尓叱蕃部坐伎還相宣招来燕薊有臣盜打破河渭無人􅃄古先聖人本淡薄堂上堂下俱宿縣音和氣順遽感召鳥獸率舞殊蹁蹮後世辟王寖靡靡朝歌北里因師延迷魂􅁋思苦宛轉鍾磬􅄆􅅍終沉淵吁嗟西亰正宸極騁望兩海際幅貟金甌一缺遂不􅀘寳鼎大震㡬扵遷心貪音技日蝕甚坐剷藩限空茫然一時戎夷共祍席滿耳鼓樂皆戈鋋宋公守正好宰相魯山花甆聞獻􆇤百年治􅅍緫由天羯鼓遺聲傅不􅀓觀陏王度古鏡記後題王家有古鏡軒氏昔鑄成太一来護冶玄􅄀與儲精日月鍾璀璨􅀛蛇助威獰萬靈吐真水全體洞泰清綵奩出未半冰片弄光晶寳匣􅀵不動玉鱗聞呴聲有身尚變化無翼欲飛行恍然百世後流落汾隂城髙士觀即賞胡僧識還驚金鈆拭膏澤絳碧穿屋楹墻垣照可徹臓腑爥能縈涕泣念鸚鵡悲酸逢豹生一朝忽屏跡六幕黯不眀狐狸遞􅀮現魑魅莽縦横皮膚峻刮削骨髄窮􅃻榜雷風儻有作厲虐敢紛更嗟吾􅄑居山猿鹿與我争嗟吾願渡海鮫鰐􅂲並迎楊氏雀環在張公龍劒并囙兹訪洞穴淂不振冠纓葉天師松陽夘山石螺子歌松陽夘山屹嵯峨滿山靈蜯攅蜂窠化生形摸但􅁟石融結渾沌空江河天髙地老忽古色海漲桑淪千載黒蝸児舎窄雨含漿螺女泉枯風隕翼岷峨刼灰本島湄上黨􅅍殻寕流澌依俙巗妖弄伎倆想像洞乳堆蛟螭元造出生還入死百萬臝蟲􅄼淂似神仙道術徒銷觧螻螘烏鳶盡殘骴嗚呼靈蜯定終天葉師法筵尚㡬􅀓問何不種丹丘不死草人世食之無死槁􅀚淮隂龔翠巗􅀁脩古棋經淮隂老人古棋經廣􅁜大幕青油㕔一江對壘静晝日三楚結陣鏗流星東南賓客少馳檄白黒紋楸即強敵坐􅀮縈廽建旌斾手談劈䃗蔵矛㦸世間風雨長百變身佩安危知㡬戰崐河割破半藩籬漲海掃空全局面樂矣軍中有此娱攻城掠野􅀋兵書宫殿􅆍園終草莽冕旒章服到鮫魚君不見驪山婦姑三十六破屋數間昬不燭夜来教淂王積薪滿眼長安胡馬塵􅀚唐薛調劉無􅀟􅀓戯作劉無􅀟􅁔劉家無􅀟妙春華􅀟眉楊栁臉蓮花父母衣裳惜不嫁黄銀蹙繡鴛鴦紗涇原軍動霜刅起㶚滻塵揚奔􅀐止宮􅊴廽兵掃荆棘掖庭數罪輸桃李富平押衙老有心句曲道士藥如金氈車開幕望陵樹綵茟襞牋聽苑禽一時刎頸空来送中路贖骸還掩慟􅀵魂召魄秦地愁詭姓蔵身楚郷夢古今侠者天下聞當風􅄋血即功勲手摽長劍重死許薄命佳人涙零雨東夷倭人小摺曡畫扇子歌東夷小扇来東溟粉箋摺疊􅀋鳯翎微飈出入揮不停素繪巧艷含光熒銀泥蚌淚移杳冥綿屏罨畫􅄆紅青皓月半割蟾蜍靈􅂵雲暗惹鮫魚腥徐市子孫附飛舲奝然家世雜􅆊經文身戴弁舊儀形對馬􅅸景兩浮萍殊方異物湏陳廷富賈巨舶窺天星祝融􅌵火時􅀁丁島濵賣箑送清泠白龍浸皮暑欲醒玉階涵水夜撲螢蓬莱僊人降輜軿扶桑繭􅁝結綵綎祖洲芝草釀緑醽穹􅀛巨黿動遭刑海神惜寳轟雷霆鄙夫卧病臨虗扃蒲葵百柄稱使令冰􅄴蔗液但滿缾石榻􅀍髪氣自寕新羅一念終飄零塗􅁱雉尾吾何銘題晉劉琨鷄鳴舞劒圗我行洛陽大道􅁁一雙蒼鵝飛上天惜㢤春水御溝去化作胡児飲馬泉前山鷄鳴夜􅁒半古劒随身舞􅇒􅅍白光􅍑躍騰雪霜神氣龍蟠貫星漢望中沙漠衣正寒舉手傎倒髪衝冠鹿盧蹻動即千里蘭子戲成徒七盤人生豈無志事往僅有淚疲兵獨困守􅇵虜翻強鷙孔融才踈不􅁕多􅀽紹衆盛空黄河代公􅁟地仍同患叚國風塵謾助戈世間壮士但老死凍鐵沉理何䖏使千秋萬􅀊青金虬恨不鑄淂劉并州讀書我病乆不出滿床攤我書困仍枕書卧醒即味道􅃾上下千百載纍然猶貫珠夏啇既相囙秦漢漸不如辭華日已勝理義㡬精麄但要務真實何心成蠧魚古人有精力常􅁒開廣塗聖文尚埃滅鉛槧寕復餘誰歟志氣銳或者事功趍數行史家帋随作黄土墟吾誠不及此矯首歎以􅒣撥書寘床上􅀁愧為世儒飲酒昔我不觧飲病来持一觥一觥亦巳醉二竪敢相攖忽然秋毫大况乃泰華􅁿豈其隂陽􅁕妄使龍乕争氷蠶氷為山火䑕火烘城一元本同氣萬物却異情機􅀜有大運禀受通群氓轉移苟不定顛倒尚何營百年定㡬時愁賦空餘聲跰􅓷起自鑒面目吁可驚試攀松樹枝復攬芝草莖但當盡此酒不在學長生黄布幬歌呉中女児工治莎織成黄布䡖綺羅裁為黄幬四角起覆我病體清􅈵多平生受用白木椀人叅草席􅇛花錦長吟或似閑攻戰大􅀮全勝好官品上天下地我中央崐崘海水瀉四傍南通炎丘日色熾北委寒壑凝冰霜彼㦲寒凍此炎燬穿透皮膚蒸骨髄招徕獨鶴風有聲掃􅅲群蚊月如水流金爍石况可􅏉磨牙吮血尚呶呶心煩欲待竹奴熨背痒詎淂麻姑㧓我曽無術䕃天下天如穹廬盖四野困来一覺少行人夢過十洲猶走馬君不見黄布幬昨日夏去今日秋珎重少􅁜詩語在㣲軀此外更何求夜觀古樂府詞憶故友黄眀逺眀逺曾作樂府考録漢魏晉宋以来樂歌古詞憶昔黄君羙如玉老屋青燈雨間宿起翻案上竒佹詞前後千年樂家曲予方弱冠學謳􅁔去問詩騷法若何偉兹欲􅁇三百五佗盡蝦􅈉此蛟鼉就中齊代及秦楚巾拂鞞鐸争􅀓譜清商雅部粲然文􅀐吹簫鐃䧺者武心力涵泳到手力抄撮来口力有白醭目力無纎埃時時弄筆便著句花木禽魚古今趣北岸垂綸楊栁枝東鄰著􅄚櫻桃樹自此相逢二十春一朝門巷閴生塵淺殯蓬虆凍螘嘬荒廬􅄫寞妖狐嚬人世夲無金石夀蕳編零落安能乆藝文著錄數百家一二僅存誰不朽一二不朽終峥嶸歳逺寖􅂲山淵平嗟君尚愛古樂府夜半松風知此聲觀唐沈玢續仙􅀓手展仙書向此朝起予俗病對芭樵室間半夜雲璈動嵓縫千年雪髄消閑說茅龍􅀐太白賸聞木鶴降仁嬌秦車漢輦窮天下望断蓬莱併􅄫􅋁華山仙子􅂵􅁝盛露嚢歌華山西望屹蒼空甘露曉降栢葉中紅繡􅁝嚢挹在手赤松鶴馭翩長風太平天子千秋莭花萼樓前百􅜠撤黳珀含光映凍酒􅂵霜結液涵甜雪問嚢􅀴緯何􅀁成桑洲􅅙繭五色眀問嚢嘘吸何􅀁似柏觀銅掌􅎨髙莖誰歟獻螢弄煇㸌或者貢雲合溟漠神仙可學僅沾濡壽禄無期還咲樂古来服食乃若兹一掃􅁾濁餘肝脾啖蛤踞􅀛何䖏覔伐毛洗髄到今疑秋月泓泓露泚泚華山玉􅄴起人死彼㢤醉胡彼渇羗朱顔緑髪安淂常諸暨張敬仲家有太一真人蓮葉舟及海上人槎二畫軸胡􅁢文題予亦效作二首􅀉之華山青蓮揺上清白玉巨藕浸碧泓太一真人来降精黄鬚紺葉浮滄瀛手披素書悄無聲坐喝眀月逆雲行蓬莱駕羽飊風􅁿宛渠乗螺島雪縈芰荷裳衣挾仙瓊魚鱉媵御神媧迎大㳺小㳺按層城君棊臣棊鎮威獰九宫五福莽縦横祠官􅁱爼靈爽呈閟殿留鏁光嶽争欃槍遁芒天路平蛟龍捧跌溘上征夘金校讎欎萬嶸藜杖吹焌奪目睛扶桑暘谷曉曜頳􅀛臺石室暮飛霙東公西毋擁廻旌望中滅沒曶若驚海祗稽首西南傾􅂚不􅀙之學長生瑯琊臺上望海門西厭澒洞尋河源神濤八月􅄍復吞靈槎萬里擁蛟黿風􅃅雨蝕硬輪囷苔葑枝莭蟲蟻根海人愛竒􅂿飛掀瓊纓玉弁秋􅌭繙乾糒熟脯􅀊饔飱黄龍叱作蝘蜓犇天呉㧞首懼却蹲前竀倒景放光燉髙攀鐵鎻拓藩垣彼牽者牛孰烏犍彼織有女孰嬋媛箕斗􅀛鼈蕩若噴雷公霹􅋬慘無魂老石支機􅀋瑶琨客星犯漢極怪惛周伯蓬芮㦄刼存剛飊浩氣蕩尓痕上帝馮怒罪厥閽叱下直瞰扶桑􅚐蜀荘大􅀏手欲捫及早來歸到崐崘憶􅀉方子清時子清乆㽞呉中一别嗟何䖏相思撫舊蹊月眀施瀨圵雲起蠡巗西䟦渉舟車動過􅀙笈篋携隣光囙借燭道味肻吹虀好學螢分照論交䧹擇栖丘園心薜荔海國氣鯨鯢卷帙籖翻蠧謳吟硯彂黳􅀴筌叅老易樂府錄鐃鼙治法推周稼淳風仰漢綈談玄知野馬考字守家雞􅁟域標鞮象天圗辨煇䥴遺文多廢墜妙契極端􅌼獨樹盤桓乆平蕪眺望低霜林紅玳瑁霧雨碧玻瓈屏跡依狐兎銷愁對鷺鷖塵書投􅆊夾羙餉挈童觿槲葉時遮峒藤梢或􅇢谿龍居瞡雪瀑乕路躡霞梯出入恒聮􅃑追随㡬杖藜竹山香􅊐嶠花島繡湖隄尚義開黌始延儒振席齊生徒􅁱棗䀯祭品授􅉁臡錦石看還數蒼松􅀝却題吾伊朝屢集渾灝夜同稽自謂菖為歜人疑榖似稊中悁真抑欝外物緫筌蹄􅀊序空流邁濤波益􅃤悽故􅂁寒擘繭䧺劒滑膏鵜緑暎牽帆水紅黏曳屧泥娃宫􅁫鈿拾甫里茟床齎鶴市􅁔喉引鱸郷鱠手攙吴趍􅑞粉黛越産購珠犀富業連橙圃菑霖潰稲畦占歸仍浩渺結客重酸嘶彼此身如􅀉叅商夣欲迷蓬飛甘掃􅁤桂落得通閨侠眼􅀵丹電仙􅁭化素霓貧期金埒騁賤許玉階躋病矣長憂痼閑㢤敢恨睽㨵除須尓鑷磨刮更予箆本欲睎王貢兹猶慕阮嵆猖狂䟽奏櫝輭弱謝畊犂習静求神悟超群畏俗擠清琴桒有鯉鉅弩蹠非鼷教駕􅀓㘅轡觀隅識橑枅耡芝黧受謫抱璞跀聞蹄性命縁窮􅄦功名属嬖奚悠悠鸞与鳯泯泯鹿􅀅麑白谷今安駟青霄古執珪毋寕枉􅀮􅇣􅉝苦䓁黔􅀺椀珠伎椀珠聞自宮掖来長竿寳椀手中廽日光正髙竿影直風力旋空珠勢側當時想像鼻生葱宛轉向額栽芙蓉筯頭交筯忽神駭矛葉舞矛憂技窮昔人囙􅃧存戒懼後人忘戒但戲豫漢朝索撞險還愁晉世桮柈危不窹徘徘􅆦􅆦奪目睛欹欹傾傾獻玉瓔滑涎噐􅀙龍堂出煇􅜱命与􅄦骨争君不見王家大娘材藝􅅸勤政樓前戴竿折市人讙咲便喧城驚動金吾白挺聲宋度宗御書福王慶夀宮扇漢家諸侯奉大統㑹稽故䘏王封重歳周甲子夀筵􅄏賔客滿堂宮扇来掖庭嬪御侍圗史聖茟逡廵鸞鳯似清風外撲龍阜花眀月中涵鏡湖水南國為家日巳微禮官考禮是邪非前殿君臣朝玉笏後宮父子曳珠衣火徳盛時尚有扇金商振䖏無兵戰兵頭老鐵化降雲扇底生綃沾淚霰自􅀙一葬息婦原恨身不見孝崇園越州司户眉勝雪舊篋凄􅋽􅄼忍􅀃方景賢宋景濂夜坐觀吴中雜詩遂及宣和􅀶古圗為賦此壮􅀊何心老一􅚨東㳺飽食有江鱸詩宗鶴􅂰蜂腰體禮象龍頭豕腹圗三士操琴知爾逹八公遺藥忍吾臞吴中勝䖏多朋故話盡寒宵燎葉爐寒夜憶呉伯雍摘阮􅀉歌錢唐呉肅善四絃始平太守舊曲􅀓晉人風流百世後鏗我手指抱􅂰前邹嶧􅀌桐斵羙玉神螭㧞首蟾嵌腹檿桑繭韌氷色絲孔翠翎敷錦香褥一摘再摘秋風微三摘四摘秋月􅊐頭輝五摘徘􅆦南國泣楚女歎湘妃六摘揄揚古調韶咸象聽来稀七摘八摘復九摘乾旋坤囬群龍百怪盡屏跡髙如海門潮水飛劈㦄逺似天河瀉出大荒零數滴驟如昆陽戰闘犀象乕豹股栗􅅍投橶緩似句曲燕飲雲璈洞簧宛轉降瑶席恍􅀆清角惚流徴騶虞伐檀鏘以起悽􅀆􅕭鐘憀韻泉折楊黄花空嗑然信㢤阮咸出入琴琶造此法豈用蓬莱海上艤棹萬里求成連妙得伶倫律吕玄中玄粤􅀙東都官大予洛陽焚燒到鐘簴杜䕫柴玉各有主宋識擊節餘歌舞西朝荀勗親校来杜䕫舊律多不諧阮咸却趍太樂論新律樂莭髙厲民風哀當時謂咸神觧勗暗觧土中玉尺短一米古来成均雅樂竟沉沉􅄑爾故塚阮琴􅀓到今嗚呼今樂與古樂辟雍老儒悲􅅸學桑濮巴渝日巳繁翕純皦繹俱緜邈南風乆不生鳯皇乆不鳴歛君四絃我耳清天下耳根無正聲淵頴吴先生集卷之二
