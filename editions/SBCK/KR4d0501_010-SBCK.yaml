body:
  text: 讀唐太宗帝範初唐太宗帝範一卷十有二萹太宗甞手撰以教太子五代䘮􅅍書有錄而遂闕暨今上征雲南􅈎夷始出以獻而舊十有二萹復完予聞古今欲治之主不丗出甞必立為治天下之法使其後嗣子孫有以丗守之而不敢失墜不幸而一旦昬庸懦弱之君或繼其後亦得有所扶持馮藉不至於甚􅅍而僅存此雖三代聖人制基垂統立經陳紀而務欲㝎為法度典章者然亦不過數􅀓則巳自弃其先祖之訓䠞國敗家接踵而有夏之太康商之帝甲武乙周之幽厲宜􅀂無異扵漢唐之季丗然猶幸賴其法度典章之炳然播扵宗廟布在有司賢聖之君復有赫然而振起者有此具也自是以来漢承秦􅅍而髙祖立漢家之法唐受陏􅅍而太宗設唐室之制嗚呼漢法逺矣蓋惟唐制傳之未乆而天下多事夷狄侵凌藩鎮䟦扈盜賊相挺而起莫之能救此其故何哉當陏氏大壊太宗始銳然盡舉天下扵盜手即議立國法粉飾朝章誠欲創其基業於前而特垂其綂緒於後使後嗣子孫得以繼續而行且􅀅有恃於此而不害扵無所守者是故職官之任㝎以常貟師徒之備設以府衛用以授田則口分丗業之法均度以歛財役民則田租身庸户調之制不紊自古者聖賢之道不作而一切覇強苟簡之術用太宗乃能慨然庶㡬乎先王仁義之意而務成貞觀二十餘年治平之功自漢以来可謂古今欲治不丗出之主矣然而太宗毎知太子之仁孝慈懦恐不􅁕以任國而僅述古昔聖賢之遺訓帝王之常法強而敎之謂爲帝範及至太子即位曾不㡬時内則惑於嬖后外則斥逐賢相則夫天下國家紛紜変故之迭至曽不可以思患而預防者卒至扵易妵改號殺僇宗姓而後巳然猶幸其有􅀁扶持馮藉且不至於盡􅅍而僅存者頼有法也惜乎當時太宗立法之際身教則􅀙言教則訟每求其􅀁以致然者自其法度典章之中或不能自免其瑕釁間􅂩之可議書有之曰丕顯哉文王謨丕承哉武王烈佑啓我後人咸以正罔缺太宗之為治無乃文謨武烈一夲於正又􅀎無缺者豈或猶有可憾者耶何則太宗親㝎㝢内盖因陏氏髙麗喪師之後而得之自其即位北㓕突厥薛延陀西制髙昌徙其種人編置㳂邉州郡而蕩然無有蕃漢内外之防及其晚年又且東征髙麗瀕死而弗巳是雖髙宗之慈懦猶襲其故深異乎漢孝元之議罷珠崖者降及數丗而眀皇􅁇之君臣宴安邉􅂩數動至竭天下之兵委之西北付以藩臣中國空虗大盜承之而􅃍起由是天下多故藩鎮槃錯奚契丹深入河北吐蕃囬鶻連䧟秦隴震驚都邑師徒撓敗土境日䠞而唐室之號令所及曽不出淮浙巴廣數十郡地而遂巳聀官之任師徒之備授田之法歛財􅃥民之制大抵悉改於其舊此豈非當丗邉境用兵之或過遂致􅕃延於中國而不少熄㦲然以唐之子孫昬庸懦弱或危或微不絶􅀂綫是雖太宗之法守之有未盡替得以扶持馮藉不至於甚􅅍而僅存誠求其􅀁以致是亦由太宗平日貪勝好名之過瑕釁間􅂩實有以先開其源而漸熾其禍是則太宗前者包括四海􅃌麾群夷適􅁕以為當今屈己和親敗軍郤境之効不可救巳夫然故唐之一代天下之致治莫如太宗天下之致􅅍亦或自於太宗而後丗議者不之覺也嗚呼予觀太宗之志嘗欲法三代欲行周禮遂絀封徳􅃔之􅀃而専用魏徴之仁義貞􅀚之治夫豈近丗所可􅃍及使其當時立法之際而其身之􅀁行者一本於正無復可議則雖三代聖人創基垂統立經陳紀之道何異於是然而太宗終以不􅀎企及者是亦貪勝好名之一過也詎不信夫詰玉霛辞予少甞有四方志旣長而益病且惜其志之或不我遂也於是假爾泰􅀛用以卜其出䖏行藏之决者而玉霛無所徵雖然古之􅀛書則久而不傳於丗矣作詰玉霛辞予昔日之有事􅀆曽端䇿乎元􅀛䖍掲我以吉繇􅀆曰逺行之不疑志囙循而弗立􅀆年偃蹇以失時祗自奮而復蹶􅀆豈玉霛之獨吾欺惟玉霛之神聖􅀆諒天道之秉為練時日之􅆇否􅀆佩國家之安危何嘉林之飬夀􅀆撫芳苓以敖嬉􅃍清江之授莭􅀆竟豫且之見覊􅀅霛繹其果獵兮爰眡髙乎卜師矧梁米及夫稊黄兮幸鑚焌而無遺真古今之至寳􅀆章之不鼓汝譽􅀆抑智慮之不渇汝精信乎不内而務外􅀆故卒與俗而咸謚為氓自玉霛之有言􅀆庸一泯於至默雖吹菙而我瀆􅀆恐告猶而弗食孰方功而義弓􅀆孰體色而墨坼楚霛􅄬詬而終不汝􅂌􅀆關朗豫占而任徳兹一息之尚存􅀆幸五官之識職諒用舍之無与於己􅀆庶藏脩之是力柰自治之不勇􅀆敢罔稼而欲穡毋謂􅀛筞之不能以知事􅀆極神霛之不可測竄宜楙辞予自一二年来病旣久而日以嗜睡睡又多夢或謂予古有善睡者其神名曰宜楙盍竄之乎予毎恠夫病之亟矣惟睡為䏻少息夫病也然而晝之所思夜夢見之紛拏膠擾不遑少止是則甚非學道者之􅀁宜有也作竄宜楙辞伊我生之多病􅀆廼獨䖏而向隅爰有托扵假寐􅀆僅身心之舒愉幸丗紛之刋落􅀆􅀉吾夢之宴如䓁百年為一􅃌􅀆謂八極其蘧庐昔宰予之在聖門􅀆曽譏斥其不可雕杇何儆戒之􅃍忌􅀆􅂲宴安之或踰豈宜楙之毎為我祟􅀆竟淫荒昬其迯誅予誠與汝而並丗􅀆敢自䧟扵非夫惟枯瘠之若兹􅀆卒􅀾兢而自勵凛形骸之欽肅􅀆召魂魄之迷潰竦志矛而汝擊􅀆充氣楯以為衞抗槁梧之不復􅉂􅀆麾狂藥而弗嚌㧞妄華之根撥􅀆敜邪壘之譏誡尸􅆉穢雜而不黨兮病竪纒綿而何瘵歘天地之一清􅀆赫聖賢之吾對湛霛扄之􅄫然􅀆藴妙􅄨之無外精思慮其若一􅀆致事為之弗閡信兹魔之釁逐以不返􅀆吾益見其通明而罔害嗟早歳之我痼􅀆柰平居之鮮懽固精神之耗蝕􅀆漸榮衞之疲殘迄旦為之見梏􅀆徒夜寝之䏻胖􅂚􅂌我以窅嗼􅀆思濟身之艱難當日用之不遑少息􅀆紛俗変之相干頋嗒然而欲一隠其几􅀆懼純素之弗完文儒或弛其名譽􅀆劍士􅐛喪其怒瞋尚喧豗拏攫之盡去􅀆寕呻吟啽囈而増昬信默默而時化􅀆直緜緜而道存吾何負而我逺􅀆雖自訟其奚殫彼隂陽之交㑹􅀆特感変之􅀁起宜正噩之有占􅀆實祲輝之相􅀝緬古莽之睡矇􅀆復阜落之跳䚦豈幻化之往来􅀆孰夢覺之非是歘吹􅅡乎死􅁅􅀆恍撓淆於止水雖形接而謂夫皮膚􅀆竟神通扵骨髄何今魚而昔烏􅀆且我蝶而彼蟻方雲霧之倐爲飛㓕􅀆又雷霆之鳴燬貧何患而或􅄹倉􅁃􅀆賤何辱而􅃍躋朱􅂵信苦楽之相乗􅀆罔動静之可弭謂静㝎之可以自勝􅀆卒勦勞而弗巳誠道真之不至􅀆故徒与丗妄而同􅁤目我病而益病􅀆匪宜楙其誰尤肆操存而不舎􅀆􅀵視􅃪而与謀儼聦眀之不我壅蔽􅀆愈泮奐而優游要虗懵之盡黜􅀆俾菑孽之日瘳惟真人之無夢􅀆在一默而何求縦我夢之或可少徴􅀆吾又何得乎黄帝与孔丘盻晴牎而咲傲􅀆彂蠹簡以歌謳願宜楙之一竄以不復􅀆用稽首于玄都􅁑天氏牛尾八闋楽歌辞古者􅁑天氏之丗丗道治矣而人民康乂楽是用作始教人操牛尾投足而歌之是亦天地之間自然之至音也然而楽辞不傳後有愽古閎覧者惜古樂之日閟不顯託而􅀘其辞凡八章載民一於赫顥穹降厥生民生民如何群物與淪俗無上下親孰父子爾騃爾狉孰綱孰紀泊乎無名澹乎無聲天地無作聖人化成我民自化帝不汝淂是曰載民我民之則玄鳥二玄鳥來矣我民其興氣以陽彂質以隂凝玄鳥㱕矣我民曰息静安其􅒏動職是聀爾居爾巢禽獸蟲蛇爾食爾火蚌蛤果蓏我利我養相時制宜匪政匪敎尚安􅀁施遂草木三邈矣上古元氣肇萌彼浮斯茇庶草彚生孰闢我區孰豐尓茁樏山砅川􅠡皮採實火無爁炎水無浩洋狡蟲斯伏鷙鳥弗翔􅁢哉楽兹草木蕃廡嗟吾何思維聖之琽舊五榖四孟春正月我出于田矧我勞勩愳我瘠􅂢揉木耒之剡鐡耜之天雨澮之時風耔之維糜維􅉮維稲維􅆝弗尓􅁾莠亦弗菑蝗五榖告熟民人率育育焉熟焉自古有年敬天常五太元伊始風氣日開天有常道生養死埋犬雞巷中麻麥畒首貨財旣来什器孔有卧則呿呿食則吁吁飢則求食飽則棄餘於乎不顯孰不念聴日監在兹柰何不敬建帝功六昔在秦皇君臣道生君有五期輔有三名上昭天光鳥獸文章下恊地符􅀛馬圖書一人在位萬􅀖順軌無幽弗爥無險弗砥黎獻共臣蚑蠕畢􅀙匪帝之功伊誰之功依地徳七我望兩海中有崐崘天霛􅀍跡乾曜合元孰来蜚龍孰度七囿人禽並擾庶品蕃毓乾以易知坤以簡能甲暦既正機矩迭乗帝予何言天地之徳我民之依俾民弗忒緫萬物之極自有聖人我革鴻􅂽何毛何血􅂚弁弗裳維聖人富維聖人夀聖人之厚萬物之阜熈熈乎和皥皡乎大道有自然徳無疆界爰命樂師投足握氂欽兹念哉天下攸歸右􅁑天氏八闋樂歌辞凡八章盖予甞讀吕氏春秋頗載葛天氏之樂名而不聞其樂辞予故夲其樂名特􅀘其缺樂則古矣樂辞今也古今之樂殆不可以􅃍同者也然今之天下猶古之天下是雖邈乎逺在􅁆千百載之下何獨不如􅁑天氏之丗乎古之說者毎称上古之丗代暦紀者尚矣自皇䧺以来伯牛受禪迄于葛天氏十有餘傳歴年之久近都邑之建徙要皆不􅀎以必得其實者况其樂哉然以古之王者道合乎上徳依乎下恬澹而神明内顯恭默而政敎四達煦焉而春彂凛焉而秋肅隂陽之氣畜積而舒布民物之俗優㳺而康樂由是天地自然之音出之於口而成歌天地自然之莭動之於手􅁕而成舞舞必三人歌必八闋操之必以牛尾播之必及於帝功民事吾知其莭八音行八風屈伸綴兆俯仰叅錯而具有其容矣吾又知其沐浴膏澤歌詠勤苦聲文音律安徐和緩而務合乎法矣皇䧺之琴女媧之笙朱㐮之瑟伊􅂄之籥前後相耀彼此相襲是盖近而英咸韶濩逺而巾拂鞞鐸之􅀁自出者也近古以降大樂官失聀古樂日􅆸然而五音七音六律六十律四清聲八十四正調之法度猶有頼乎西域􅀛兹之􅀁傳唐末五代之􅅍又􅀙而殘缺不備訛謬失莭至使蜀一黥卒而欲立一代之樂府鎔金鏤石崇牙列簴􅁕以極衆工之選雖􅀂名儒鉅子學不聞古樂無其師竟無有一舉口議其可否而請以更張者於是古之所以吟咏其􅒏情動盪其血脉消融其查滓者無復可見而淫藝邪僻驕􅗦輕剽之風日競月増靦不之恤子女􅚽擾舉聲􅃅噐杯盤狼籍頓足跳踊則巳雜出扵郷􅀖聚㑹賔客讌飯之間矣鳴呼古今之樂其信不可以􅃍同者耶此予重有取乎􅁑天氏之樂名而特􅀘其樂辞者也後有聞者得而歌之且􅀅惕然有感扵古樂之不作矣又何愧乎樂辞之今也哉然以黄帝以下六代之樂与夫成周之九夏唐元結皮日休乃得而盡􅀘其缺鼚乎鼔之軒乎舞之或者當百王之末造而猶可以得返太古之遺聲乎嗚呼逺矣予是以特録其辞而又論之尚庶㡬乎大樂官之採擇嚴􅁜馬君仲珎父誄辞維元統二年月日嚴􅁜馬君仲珎父卒家凡歴六朞始克􅁙于新亭里先人墓側我二三子􅇷慜其遺行之不昭於時乃作兹誄用相其哀詳曰於歎馬君厥妵維嬴是曰造父別封趙城趙之既王奢也善兵爰邑焉服開國秩卿丗降炎劉北州籍名援介戚里融振儒聲逖焉鉅唐重績治經孰􅀭天朝燧握莭旌信兹苗㣧何代弗榮播尓宗譜百丗一程故汴之􅁶視杭作京靖念尓祖筞科騰英􅏡歴州縣執持憲刑鴻蹌鳯翥五㓗氷清徑躋法􅀙領䄂明廷端紳搢挺實棟國傾維言維行流風盛行曰孫曰子夥有簮纓丗祿日逺家氊相承如何君子異我編氓維君自㓜鍾厥豐偉長而好學耽翫書史昭兹六經卓有根柢老􅚨後先捜擿章指孰王非綱孰聖弗髄彂揮義殊談論蠭起恣􅀚百家􅍱獵衆技􅚨墨交橶徳刑迭燬鴻􅂽迄今王覇􅆇否薄海内外華戎遐迩孰詩孰賦鏗合宮徴或玄或竺彪别邪詖我常謂多君謂道咫泓涵浸潤岋峢崺君不自􅀎蔚為秀士立辞摛藻聞者風靡自君旣壮聿有時譽矧學之谹弗㩀要路緬尓祖徳敢懵我故熾尓學業肻堕我素名􅂣大開百郡充賦匪閩伊楚矜􅋏犇騖彼晳此黧揮霍吞吐聚焉風雨散􅀂雲霧孰玉弗雕孰金弗鑄匠般何人文梓弗遇唶哉數竒得此遲暮誰非退鷁誓不脫兎我擔我簦爰告我渡我吏其􅚨律我章句彼賢非賢孰妬弗嫮菰城甫里雪浪煙􅀣人皆􅚨顯我獨􅚨誤君何不㳤復奪君􅃍豈無文學尚寐無寤千載一朝􅂌彼丘墓伊昔大化乃形尓身既具四體孰儲尓神何言何默既咲旣顰何冠何􅂂􅀍服褼褼孰贏尓學使尓有聞孰嗇尓仕忍不少延維其生之夭閼弗完豈如無生窅漢自然我問元宰孰司其權紛綸変易􅄅是天淵愚蒙者夀智勇則顛卑汚者寵藻麗弗宣顏駟蹇剥至老乃遷劉晝擯斥厥有詆言言念君子過彼二賢嗟嗟奄迫命不可攀盖予覊丱曽奉顏色爰受君詩僅識繩墨君不鄙夷忘我年徳我心尓諧略我儀飾我来自東我病殊極君苦我留撫兹祍席陳薦酒肴翻倒琴筞一年一集歌咏忘食云何􅃍離久不我即我邸于西遇君逼側大江作潮我溝我洫鸒鳩搶地我覆我翼曽是兹秋嘉莭是逼柰以賞心強欲登陟滿天隂雨􅀍簑著􅄚故交何有獨不遑息剨然長嘯嵓谷罔覿􅏫悽中人展轉病極君生窮窶君死豪特新亭之里痛此窀穸我今誄兹玄石弗泐嗚呼珎父是用哀惻春秋胡􅀓􅀘說序春秋之學自近丗夲河南程氏程氏曾有春秋傳序而傳未完武夷胡公安國盖又特出扵程門之後而私㳤艾之故今胡傳多与程􅀃相為出入吾固知胡氏之傳春秋夲程氏學也然而隠桓之際訓􅇚頗詳襄昭以降遺漏甚衆又况光堯南渡而胡氏以經筵進講至於王業偏安父讎未報則猶或未免乎矯枉而過正也宗人正傳間者甞讀胡􅀓乃因􅀓􅀃之未備􅀙而􅀘之此仍有益扵學者曩余甞論春秋之大凡欲以彂明胡􅀓之一二而正傳先之故敢私序其􅀃扵正傳􅀁論次之後曰夫春秋者魯史爾自魯史而為春秋則春秋乃史外􅀓心之要典而特為聖人命徳討罪之書矣然自唐虞以来典禮教化有人心感彂之妙爵賞刑罰有政事􅂆懲之嚴伯夷之降典播刑臯陶之明刑弼教何莫而非此道也惜乎春秋之丗文武周公之舊典禮經曽不復赫然振起扵天下而天下公侯五䓁之國亦莫能考禮正刑一徳以尊事天子惟吾聖人盖有聦明睿知之徳而無其位扵是獨持其命徳討罪之筆而欲以定天下之邪正也吾賞焉而賞非私與邪也吾罰焉而罰非私怒此其陽舒隂􅃤舉直錯枉之間先後有倫衆體有要是謂經制持循凖的不容少紊人情之䡖重不同丗故之治􅅍亦異是謂權義洊移前却必得其宜要之堯舜文武之治未墜於地而吾聖人􅀁以務盡其祖述憲章之道者至矣實聖人時中之大法也夫然故春秋聖人之法書丗之學者猶議法之吏惟其知聖人之道揆而宅心忠恕然後可以通聖人之法守而立說坦夷雖然學者徒以其一曲支離淺中狭量之資求之未易以及此也或曰春秋新王聖人囙之粉飾太平而多褒至治之丗曽無奸暴之俗而惟以徳化者也或曰春秋衰丗聖人且以為舉國不可勝誅而多貶始􅅍之俗雖以微小之罪而必舉其法者也是故舒之而遂縦者􅁜遲􅆸弛無法而益􅅍操之而愈亟者煩苛刻戾淂不至於秦人恃法而寖濫乎嗚呼二或之論誠非􅀁以識吾聖人時中體道之大􅁠者矣又􅀅何以窮經而致用哉自王安石以丞相􅀃經春秋乃􅆸詆不用丗之學者往往多自為說至於意有穿鑿巧為傅㑹分裂聖人大體乖異先儒成說漫有精義至當之論一說之外不知其復有一說也盖惟程氏為能通乎制事之􅁠衡揆道之模範又無完書丗之盛行胡􅀓而巳胡􅀓夲乎程氏之學程氏之學又信乎聖人時中之大法也然而猶有􅀁未備者焉今也正􅀓乃􅀙而􅀘之誠是也正傳其真議法之吏哉雖然前王之律昭然甚明後王之令紛然雜出宏綱大􅃌既無其統微辞碎義盖浩乎多若叅商矛循之不相合者吾益懼焉卒以待吾正􅀓而後定也昔季氏使陽膚為士師問於曽子曽子曰上失其道民散久矣如得其情則哀矜而勿喜善哉言乎學者又當自是而求之此其必有合於春秋者矣呉氏戰國筞正誤序戰國筞十有一卷凡言周秦六國宋衞中山之事古有髙誘註㝡為䟽畧近丗縉雲鮑彪乃復分拆章數竄易字文悉令可讀而不致有噤口敝舌之虞雖然古意䆮巳失矣要之古今之字義曽不一同南北之方言或随以異而彪欲以後丗窮郷曲學而盡通之吾知其必至於穿鑿粉飾而強其􅀁不可通則反不􅀂誘之䟽略也宗人正􅀓嗜古書甞以國筞之多誤暇日則取太史公史記及􅀾國諸子􅀁自著書前後比較既又考夫近丗劉攽錢藻姚宏䓁本叅伍錯求然後有以見其語言之殊異􅀓寫之缺訛而是正之盖頗貴乎誘之近古而深惜乎彪之妄作也於是丗之讀國筞者文􅀙字順不失其真􅀾國君臣􅀙横㳺說之事併可得而極論矣盖夫古者先王之丗道徳同敎化行而風俗一士之有賢材學業者脩之扵身著扵其國或以徳舉或以言􅏡要皆可以考名覈實而趍事赴功無或敢為熒惑変􅅍而懵乎是非黒白之混淆也然而聖人當夫天下極治之丗毎有慮焉盖曰朕堲䜛說殄行震驚朕師豈不以丗之䜛人傷絶善人之事震駭衆人之聴邪僻自此焉而進用矯偽自此焉而假託出入起居彂􅃅施令将無􅀁往而不盭扵道苟謂丗為極治而慮不及此吾恐其漸為始􅅍之基矣是故聖人深以䜛邪之說有未易化而且有以教之必使其遷善改過而後承之庸之否則威之夫然後士之有徳有言者各稱其任而天下之欲趍事赴功者亦皆實有􅀁稽而無慊矣自􅀾國以来先王之治日以逺甚聖人之教若罔聞知士之紛騰馳驟扵天下者曽無常有之善心而惟磨厲其舌肆為䜛說莫之能恤析言則離扵理破律則壊於法􅅍名則喪其實改作則反其常此固先聖王之􅀁必誅而不以聴者而戰國之世乃安然而行之孱君弱􅀅纎児佞妾刼之以敗降殺戮之苦誘之以聲色狗馬之好情知非是巧為文飾􅀔欲離合強相傾䧟卒使上丗元徳顯功之胄日就淪亡而後已嗚呼䜛邪之說有可畏哉盖昔孔子曽用於魯未㡬而即有少正卯之誅徒謂其言行之僞而不由於誠學順之非而不由於是雖吾孟子亦甚惡夫䖏士之横議異端之並起詖淫邪遁不可勝窮惜乎孔孟之道久矣不明扵丗戰國之士不復知有義理之當然而惟以利害相勝故今㫁斷然悉以為古之䜛說可堲者也然今誘也注之彪也􅇚之吾正傳乃􅀙而是正其誤又豈不以國筞之言為不可􅆸欤雖然正傳學孔孟之學者也自先王道徳敎化之治夲諸人心播於簡􅁽充衍洋溢逺而未斬是故春秋之丗鄭之賢大夫且能善扵辞令應對諸侯鮮有敗事聖門言語之學達如子貢亦或一出扵魯而彼齊晋呉越䓁國為之有変至扵排難觧紛成疆取覇而後定焉前乎此矣於是而後公孫衍張儀陳軫樓緩蘇秦秦第代厲之流揣摩捭闔􅁠謀術數浩乎􅀂江海之浸恍乎􅀂􅀑神之不可端􅌼雖其䜛邪之說罔知義理而傎倒錯繆之一時口頬之移人固有非後丗膚見謏聞者之􅀁可遽及嗚呼先聖王道徳敎化之澤一旦而遂至於此言之可為扵邑矣然自其文辞言語而觀之惟椘漢戰争之丗尚為近焉已不􅀎盡及它則曹魏鼎足而割㩀李唐叅布而分藩交兵之際奉使往来權術相傾議臣蠭起曽無異扵戰國椘漢紛紜之時者竟未甞有一言語之􅋏動一文辞之譎勝雖以當世史臣極力摹儗而為之亦且羞濕畏懦衰耗促數無復有昔時辨士說客之遺風矣是故世之讀國筞者卓然自為先秦之古書不可􅆸也必也本之以心術之公約之以義理之正謹之以辞令之彂戰國其文而非欲􅀾國其學也此則正傳之志也又在乎丗之學者善讀焉而巳矣石􅁜先生倪氏雜著序自東都文獻之餘天下士大夫之學日趍扵南或推皇帝王覇之略或談道徳􅒏命之理彬彬然一時人材學術之盛不可勝紀盖東菜吕公夲其伊洛義理之學且精於史永康陳公同父方與之上下頡頏其議論而獨貴於事功夫以國家兵戈離析之久王業偏安人心不固紀綱􅆸壊風俗蕩焉而失防意􅀅自有酌古凖今知時識務之士雄豪智勇闓爽穎茂而出扵其間或者猶慮其古方新病之不􅀎以救亟也當此之時同父甞陳征討大計石􅁜倪先生朴實先後同父草書萬言欲以兵戰自效不下同父然同父因其才力氣岸之豪中䧟扵罪釁至老􅂊得髙第終以不得馳騁扵中原而遂至淪􅃿先生方自以其學勝亦且不􅀎扵郷里至以罪癈徒筠陽故雖有志焉而終以寒窶而老死盖予毎􅀚先生之書則為之沈吟痛惜而不能自巳先生甞夲其兵􅀾之􅀁自出備知天下山川險要户口虚實著為輿地㑹元四十卷又推古今華夷内外境土徼塞之逺近繪以為圖張之屋壁而預定其計筞逆料其戰守者不一而足是􅀅􅂅出為當丗有用之學而不欲僅為􅚨者陳腐無實之空言當時之士惟同父為䏻知之先生亦惟􅀉示同父而不遑以他及者也然使先生之志且與同父􅀗用扵丗天下之兵蜂集蟻聚勝􅀒雖未可知必也人心國論之既㝎于一力守東南以為保障専意西北以謀進討江淮襄漢日以寕謐秦鳯陜虢之間遺民襁負義士壷簞尚不為無􅀘於萬一者是則後丗􅀁以深有取乎樂毅之常生而重恨曹蜍之淹淹待盡也夫自南北兮裂士之學者方守扵一隅而禹跡之􅀁􅀍者率不䏻以徧歴黄河之源出於崐崘黑水之流播扵南海而近丗地理之家茫無據依逺相億度盖今海内混一重譯萬里黄河自星宿海彂源􅊗九渡河而後北㑹於臨洮積石之西黑水復流其西界而徑趋扵滇越之外境􅀂可以燭照而數計者譬如談天文者毎以洛陽居天地之中然而南至比景北踰鉄勒斗極出沒髙下之度殊不可以常度凖又豈得徒溺乎羲和渾天之器而獨不少究乎周髀勾股之法哉是故先王輿地㑹元之書兹既不􅀎以復見至扵華夷内外境土徼塞之圖則猶未免乎叅差矛盾而未盡善者此殆古今祖述編􅀋之一疵也雖然先生之學誠可謂􅀶而有用者矣甞吕公云亡先生貽書同父謂宜力學以紹吕公後而同父咈然不恱是其一時人材學術之盛卒不肯俯首以随人下而欲自表表扵丗自今觀之前軰老成凋䘮俱盡新學小生鹵莽不學是以一切堕於黄茅白葦而欲以爲同􅀼其殘膏剰馥而不敢有異至其立言箝口結舌而無􅀁彂明臨事則亦玩時愒日偷懦憚事而不足以赴其鼔舞作興之機者此皆見棄於先生者也藉令先生之學夲之以伊洛之義理而又無貴乎永康之事功則其􅀁就且􅀅不止扵此雖然今之學者尚可及耶吾固未易以王道覇術之並行而􅃍少之也初武夷謝翶臯羽甞因先生之書􅃟為一編今始得其全帙􅃅曰雜著者觀之又甞過其􅀁居則山洞湮塞棟宇傾蕩蕘児牧竪悲􅁔蹴踘猶䏻示其故􅇕而亦不能詳也况其􅀁著之書耶嗚呼士無當丗之功業而徒務扵有言不至于此不極也是又古今文士著録藝文者之一歎也悲夫淵頴呉先生集卷之十
