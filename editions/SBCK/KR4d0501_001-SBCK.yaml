front:
  text: 淵頴吴先生集卷之一門人金華宋濂編
  hash: sha256:2fba479a490d9341808e5093ac2fa0c7b71e828670eadd12b11de3dfaeedeb8c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_001-1a}
body:
  text: 大㳺賦并序毗陵道士盛􅁢升東㳺㑹稽予聞其風神頴異􅀍服蕭爽盖􅀅自是而汗漫六合者也張君子長約同送之賦用是作遂題曰大㳺夫何一髙士􅀆獨曠視乎八區朝吾車之夙駕􅀆夕予至扵清都仰天路之迢遞􅀆挾陵陽而與俱遡剛風而頫倒景􅀆浮沆瀣而噏青霞蜚㢘起而前導􅀆􅌛靊霳使後驅素蜺夭矯而為纓茀子神鳯離褷以掲旟恍大㳺之􅀁㦄􅀆撫四海其無家唶塵濁之不可以止息􅀆吾􅀅抵乎崐崘之遺􅇕嗟東轅之我蹞􅀆探宛委之嵌穴帝禹告予以􅀁蔵􅀆彂濤江之漲雪登桐柏之嶄巖􅀆瞰赤城之嶱􅣈飊􅅾嶠而我欲徑到􅀆􅂲蜃樓之明滅歘南轉而弭莭􅀆過􅏦霍之層峰放盛唐之匯怒􅀆梁魚鼈而踊蛟龍掎巫峡之􅄗觀􅀆莽峨嵋之雲松泝丹丘予㝎不死􅀆躋羽國以􅀙容曶浩歌而西邁􅀆適金天之沃野遵黄河而趿石室􅀆王母􅀍髪以嘯䖏尋泰一與九􅉄􅀆貫華隂之幽岨招韓衆而許度世􅀆固􅁏人之弗遑遽覩廼北折而亟去􅀆出鴈門之嚴寒恒嶽緜亘乎不􅅸􅀆縋碣石扵㳽漫捜赤舄扵遺榛􅀆簸樓船乎狂瀾候鷄鳴而直上日觀􅀆吾特痛夫僊學之艱難伊天地之晦冥􅀆倐陵谷之遷徙邅女媧之陮阜􅀆頋嵩少之􅕲起經陽都之酒家􅀆嚌王屋之石髄披河上之靈筌􅀆擿􅃮園之奥指惟小别而千齡􅀆復一瞬以萬里劃狐鳥之丘垤􅀆洞蟪蛄之年紀心委蛇而自神􅀆形曠蕩其離滓信吹萬之不同􅀆恒抱一以終始胡乆居乎寰内􅀆欲􅅸出扵大荒扳建木而與爲􅕾降􅀆絙鐵鏁扵無􅅖瞻帝車之中運􅀆闖閶闔以上征屈軒轅之踡伏􅀆耿招揺之燿鋩引弧井之壘落􅀆炫奎璧之圗章繙龍漢之寳暦􅀆徹欝繿之神郷􅄑寘身扵一氣􅀆卒齊夀扵三光宜凡夫之􅁾濁􅀆又孰契夫大道而翶翔自放懐扵天外􅀆眇累塊扵千億惕世途之嶮巇􅀆戹蠭螘之營役豈耽名而嗜利􅀆或酣酒而溺色諒金石之銷泐􅀆竟丘壟之堆積唉􅁻雲之鉅藪􅀆緤歩景而我服歎甘露之靈罋􅀆和水玉以為食彼筞精之有書􅀆吾尚懼夫骨籙之弗得􅀅蘂珠之不逺􅀆盡蝌蚪而莫識懿周流而至此􅀆聿􅀏傲以言旋樂自然之日月􅀆􅄃無鞅之風煙壓洞庭之浩渺􅀆屣林屋之聮緜龍威蚴蟉而跱踞􅀆寳鎮晃而瑛鮮廼霄峥之欲枿􅀆􅁴鼎竈之猶燃爥大還而蟾蛻􅀆擊小有以鶴翩躬虗無而不宅􅀆味澹泊以為淵䓁古今扵一􅁤􅀆混生死其同􅆵儼坐在而立蜕􅀆藴執􅃑与拍肩真山澤之一臞􅀆夫豈論乎三墨暨九仙固道術之􅀁􅆀􅀆􅂚曲謏而䆒旃馳箋語而往訣􅀆却永存扵上玄海東洲磐陀石上􅀚日賦粤東㳺乎海􅗲􅀆得偉􅀚扵陽阿登盤陀之疊石􅀆路㟪􅪾以巍峩天雞􅃅而夜半􅀆暾欲出扵重波恍玄幕之沉黒􅀆惚火輪之蕩摩緬羲和之有御􅀆扶木㷸其􅀅花渺湯谷之不可以里􅀆届髙春其㡬何嗟世寰之安在􅀆尚昧㝠而未旦睹帝車之邪迤􅀆耿星宿扵霄漢漸島屿之奣鮮􅀆益淼茫而㳽澷􅂲闤闠之猶尓夢􅄰􅀆􅀋蟄蟲之惽亂胡乾極之牽掣􅀆儼機軸之翕張固隂泉之龡烱􅀆煥􅑒燧之奮颺煒踆烏之㸌煟燦爛􅀆渇喙解羽藐以迭碭戫爥龍之燬焫颯昱􅀆熾頟煽目其方􅋮縣燔鏡之熒灼炭熺􅀆鮫人泉客劀濯有光振赬鼓之焱熽炫煇􅀆北落壁壘嶙前行指綵虹之抱戴珥璚􅀆璀錯爣􅓎綢遹皇想朱鳥之次舎􅁤度􅀆豁逹藺轢閜燿鋩乗寒澇潮水之傎倒推盪􅀆散曉赮霞氣之轇轕彩章廼蜚騰扵􅋁霩􅀆竟瞑眩扵混􅃼繄髙􅎨乎氛曀􅀆僅啓眀之獨爍歘逺麾之黂爝􅀆遽群動之盡躩川后潜精而窟蔵􅀆海童覷曜以犇愕鮫鼉揚鬐撥鬛以悠漾􅀆鴻鶴刷毛挟翅而􅁜薄莽琅琊之躋􅄗􅀆㴐鯨山而晝其􅜱也閴羅浮之瞷井􅀆滉蜃穴而夜其爚也迅夸娥之杖䇿􅀆懼追逐而莫之跳逴也怒魯陽之揮戈􅀆恠盤礡之弗吾䂓彠也惟圭臬之可測􅀆奈􅂩駒之焉託恒鞠眀而䆒曛􅀆遂壮凋而老鑠昔聖賢之有法􅀆寔盖渾之同天矧錬石而凝質􅀆復㫁鼇而鎮淵􅀅渤澥之鑿竁􅀆淪谷底而迭燃抑崐崘之峙􅀆繞巖腹而互旋豈文身黒齒之俯迩􅀁出􅀆貫祼壌以相連或崦嵫濛汜之逺壓􅀁没􅀆罄汃國之窮壖歎嚴冰與嬲雪􅀆曠古莽之鮮􅁴常眠惕重蒸与疊􅅡􅀆焮炎丘之毒瘴霾􅃄諒衆人之懵陿􅀆特蜂螘之撲縁偉小児之辯智􅀆雖睿哲而勿宣彼凡俗之多故􅀆遇􅍼朝而即􅔡誠旦晝之梏亡􅀆嚮晦昬而暫定紛仕學之攘争􅀆集農商之􅃲迸􅁋末作以相資􅀆侈利心之百穽儻桑榆之不復滅沒􅀆盡奪時而力政願欝儀之恒若溟涬􅀆庶保躬而固命噐曉籌而催闢􅀆警宵柝而告静信舉筴而豫知􅀆幸聞鍾而深省何觀瞻之不􅁕􅀆重徙􅀝以盤桓光巳通扵一躍􅀆影奚候扵三竿逯層溟之畢露􅀆屹東霍之巖峦念列仙之獨往􅀆扼羡門扵波瀾劃􅀌嘯而陟降􅀆撤蒙蔀以忻歡頋秦越之邈不相及􅀆又焉論夫逺近扵長安羅浮鳯賦并序羅浮鳯者海南小禽也家君自嶺嶠囬挈之北上予嘉其身負文采㧞去幽阻而欲自售其羽儀也是知士之抱道徳懐文章無微不聞無逺不達豈肯乆滯扵天涯海角之墟而遂已乎雖然予愧多矣乃為賦曰惟海邦之異産挺羽族之光華育火徳而有燿控離垣以為家迆赤土之重漲眇丹丘之僻遐頋性命之淺薄特般桓扵􅃄霞原夫自南自北載蜚戴止蜚不妄集捿必倒跱青飾衣衿紺流爪觜信鳳薮之多竒􅀋􅀛􅄗之􅀁使吮夕秀扵􅂵芝嚼寒香扵瓊蘤雖斥鷃之同羣固鸞皇之䓁羙扵是本山川之迢逓羡體氣之自然胡虞衡之弗及隔瘴癘以能全戒羅氏而弋舉命鳥夷以籠遷望上林而奉進䟦神嶽以増妍念安期之蓄養受抱朴之矜憐守一枝扵􅊐木得數粒扵嵓泉曶獸圈之可近任虵􅗲之長􅂢尚􅅾蒿之改􅀚何鼎爼之容羶當其􅃡南國之蒸爍泝古龍之沉隘冝禀賦之尔殊渺狼􅍃之昬昧祼黒質而無繒甕鱗軀以弗靧柰屋居之何有望魚鼈而犇沛胡鷦之種族獨黼黻以藻繪矧鞦莎而臆蘭匪距金與羽芬獻麗容而自媒炫靈表而冈害􅀅􅀹物之移人豈凢禽之一槩若乃考黔嬴之􅀁毓鍾品彚而降祥負英姱而可貴閟草莽而愈彰心恒馳扵北􅊴跡􅂚屏扵東崗薦董賈之術業熾淵雲之辭章偉畎谷之文翟諒備采而有光逖炎洲之孔鷸􅂉聚冠以見􅆷􅄑全生而特遇肯䖏逺以囬翔儻遲延扵歳月􅂲滅没扵殊荒然則偶時景之和暢䟦閶闔以凝竚稽師曠之􅀘經驗冶長之辨語感軒閣之㘅圗副舜庭之率舞聲格磔而應弦勢盤旋而列簴祠爰居而眩惑奏鶡雀以咲侮卵條支而必􅆀毛拂菻而􅂚舉彼尋常之猥陋雖籬落其若阻相盛徳之休眀謂萬里而来覩是故士當貴而自重世何嫌扵䖏卑罄山谷之巢穴奓朝廷之羽儀仰天地之廣大㧞聖賢扵窮覉極英材之衒鬻忍道徳之擲遺惻朔風以吹壄􅃤寒雪以刮肌屹碧梧而弗實挺篁竹以無枝鼓乗􅀓之壮志藴弃繻之妙姿柰負貳之乆梏窘侏儒之長飢庶飛􅅮扵鵬路終飲啄扵龍池尚兹鳥之吐數遂厯言而詠斯歎疾賦伊天地之常運􅀆何我生之遘屯罹終􅀊之竒蹇􅀆斵一元之㳤醇莽門徑其委草􅀆凄户牗以疑塵寘冠衣而不理􅀆念動􅂂之艱辛揆世寰之有植􅀆本胎氣之禀育粤襁抱而多戹􅀆謂乳湩之不􅁕胡肌髄之朘削􅀆僅側身而于陸矧食飲之稀薄􅀆略餔麋扵鼎餗頋廬伍之同䖏􅀆雜悲􅂬与􅃤哭唶寒暑之中人􅀆逞菑􅁋而瘅毒諒􅑟轕之無已􅀆竟沉痼而反覆尚何藥之起予􅀆幸我神之来復惟聖人之􅀁慎􅀆儼前訓之􅆱􅀛信軀命之寔切􅀆􅂚􅀾兢而自持柰衰風之竊彂􅀆挟沴血以侵欺漸黄槁而痿蹶􅀆致漦泗以殿屎髙山其傷陽􅀆痛壊木之無枝廣澤淤而積隂􅀆懼窮魚之弗移儻湔腸而浣胃􅀆特湯齊之我遺庶扶形而矯摩􅀆固􅁷扁之可期當田野之蕭索􅀆曶雪霜之交摯彼蠢翹之有知􅀆廼坯蟄而日閟龍何潜而弗蜚􅀆蠖何屈而弗肆相昆蚑之各以其時􅀆豈長臝之多懟晝犇躩而亟思􅀆夜睅鰥以􅁯􅄰人痾攻螫而􅆷賊􅀆世恙灌熏而顛躓煽狐狸之老姧􅀆舞􅀑蜮之遺智􅂲病危之或然􅀆臨淵谷而増惴紛遂古之􅄏物􅀆實鉅靈之毓龢精日月之照爥􅀆竅風雷之􅌵呀寘頭顱而上峙􅀆象山嶽之巍峩縣肺臓以中居􅀆通脉絡若江河盖全軀而至貴􅀆冝攝􅒏以享遐肯莭宣之􅆾逆􅀆恣榮衞之慝訛􅅮羽苞而覔燧􅀆殆憢焫之見加揚􅇒桮以攪沸􅀆雖金石其謂何彼衆人之豐碩􅀆胡衰我而黴瘠舉世競扵塗隧􅀆獨床祍以栖息矧一旦之即安􅀆置事功而弗獲􅂲後日之併無此身􅀆虚名實而冈績緬嵩少之有􅀮􅀆曰􅃄霞之膏肓指􅀛筴之可簭􅀆懐􅎛醑而降祥彭祖傴僂而下窺􅀆尚援藤乎若驚接輿跰􅓷以自鑒􅀆窘霖雨而肆狂漢史病而留滯􅀆感封禅之􅀙行唐傑憊而悲憤􅀆賦棠梨以惋傷頋真材之豈不爾遇􅀆恍景燿之弗彰笯鸞翎而使飛􅀆􅔗􅂹􅁕以待􅋮况我躬之蹭蹬􅀆愈遲暮以潜蔵惜脩名之未立􅀆􅀏髩􅄠之先霜􅎨龍文之鼎鼐􅀆擿􅍑首之鞶嚢吾尚擬夫列仙之可學􅀆佩丹訣而不敢􅁯起病鶴賦并序予少多病嘗作病鶴賦以自况盖言呐然如不出口身退然如不勝衣後雖稍自振扵時亦不克也然其槀巳不存矣嗚呼予病乆且痼其尚可以未起乎起之在我而巳扵是復作起病鶴賦并以示知我者伊元造之播物有九臯之靈禽禀幽心扵藻質􅄆縞翅与玄衿掎嵩丘之石室瞰􅅾島之清潯眇八紘扵一舉曠千里之遥臨然而山多歳隂野積氷雪老松無柯百草肅殺圎吭塞喑弱胫摧折赤精眵昬纎趾蹩􅍷胡志向之殊卑尚光儀之迥㓗匿平林而羃迷壓臣壑之谺裂是以前詹怳􅐞後顧襂褷投蹤灌木憇影沙坻静非馴擾動若􅎗覊俳佪蕭索躑躅險􅇖奈世氛之混濁憶天路之孤危望鴻鶬而不及慜燕雀之􅁜欺俯争枝扵斥鷃逺􅅸􅁤扵長離頋雲海之日隔窘稲􅆝之恒飢幸樊籠之匪觸豈繒繳之来施亦何恙之不巳廼厯年而留兹至若髙歩自怡嘯呼同侣拉颯思奮踉蹡起舞風生則虗曠露隕則凄楚拊青田之故巢睨華表之遺柱夷采薇扵嵓谷憲含糗扵環堵駟蹇剥而罕逢鴻􅈭亢以多忤唏胎化之尚然睠帝郷而延竚抗衆彚而不群懼終身之畸旅扵是韜養既乆栖跱載寜土木内蓄火金外形梳理碎玉劀除殘腥羡門許其彳亍玄俗惜其竛竮擿武丁之寓􅂐彂緱􅊐之蔵經服仙人之上乗擁太古之遐齡故能一洗塵滓直遡􅋁廓仰拂􅂵宮廽翔金閣過夷羊扵南維窺壁壘扵北落濯長河之奔流􅇒倒景之照爚導素蜺之飄掦攖鶉鳥以距攫􅄤建木之􅅸標嚌神芝之竒藥然後希一真而永固超無極而磅礴曰復予之本􅀄竟誰辨其􅀁至之垠鄂惟天地之一指忽古今之紛更人何窮而不逹物何悴而不榮􅀅人物之多變豈禽鳥之異情苟相時而能動雖䖏困而必亨是故邦治身出身顯道行奉周廬扵旦夕視萬乗若友生負文章之綺麗馳論議之崇谹一賜則眀珠白璧再竉則三事九卿方觧兹之舊縶庶息我之前黥可無心扵禄位終不日而蜚鳴大舜来鳯扵樂奏宣尼致麟扵文成􅂓援毫而興起又孰不仰徳而聞聲狙賦我觀世間何異厥狙狙公執技役我庭除投􅀲齕果豢飬飽􅃾牽繩拽鏁奮躑嘯呼側身舑舕􅂲􅋏足跗項矐矆變幻首顱動囙頥指静􅀋橜株怳惚錯愕滿堂盧胡粤自童㓜􅀍彩弄雛長跳短躩嬉戲有餘忽然壮强精幹猛軀急操襲􅂑智慮畢輸亦復病苦顦顇困臞徉顛詐死靈藥在壷豈􅂉老衰涕泗垢洿曲顒傴臏鳩杖給扶相彼仕逹綽有時譽巧張郷評䧺􅘳宦衢文馳觚櫝武執㦸殳横施爪距憤磔牙鬚髙門縣薄伺候趑趄豪戚􅀔卿語話囁嚅白􅍑獻議銅龍握樞摸稜唐手霹􅋬漠苻升堂踞坐呵喝擁驅弃律舞法鞭梏刻刳神姧出沒拉􅇾扼貙頑貪奊戾盗鹿攘羭貴与利期貨貝其儲寵則驕至䟦躓同塗􅑟目塞耳禠冠裂􅅂行遭僇辱泣赴刑辜載􅀚冨盛擅尓里閭經營家室粉飾體膚連檣白粲負郭黄淤沼池魚鼈塒檻鴨豬業可必得事在必啚姱奢服􅂂湎液杯杅窮聲􅁝竹極色麗姝弗農崇廥匪賈積帑自晨及暮鴻弋􅇠罦分房割奥誶帚徳耡齒霜㘖齾舌電嘘侵貧併弱欺懵侮愚春花秋葉更菀逓枯先咲後􅃅去車就􅞁胡然比附竟作暌􅀌餒㢤氣力孰不丘墟當其為人尚有以娱殘骸㫁胔螻螘鳶烏􅂉者為􅄦抑又可歔鱗肌角鬛魑魅䕫魖一時之頃􅄑不汝拘衆人盡然殆不我誣周公之衣勉强曳婁呉王之矢巧捷速殂身何置䋄手且捋荼疇云智譎有是勤劬假靈木客通怪山都雖則多幻盍􅁯爾􅀄呼嘑兹世莽矣一區視其有作意在覬覦悲驩交禪福禍並趍小苛可略山嶽弗殊治安何玩兵􅅍卒瘏暴秦殄楚劲越􅆷吴三國鼎立材勇與俱龍􅍑鳥蛇陽陣隂謀五胡雲擾􅆧羯相屠弓弩甲旗北􅀐南艫椎􅌛㪣批却􅑆骨軱攻戰圍噤形勢亢虚塞􅀜在前慎不可踰衺孽在後淪胥以鋪時風哀樂史筆賞誅醫國無術鑄人􅂚模天開地闢四海蘧廬人消物盡萬世斯􅁷惟狙抜己盤踞自如昔非刻狗今豈乗狐我思丗故何計有無緝之成賦用戒薄夫定命賦昔岐周之懿哲􅀆垂末躅扵勾吴延州来之閎博􅀆秉世徳以作摹予既禀此羙質􅀆叅兩間而與俱日礲礪以頡頏􅀆違陋巷而適通都膺文華之􅀍體􅀆結儁逸以先驅翩黄鵠之千里􅀆烱驪龍之吐珠掎山丘其峻峭􅀆汨河海之盤盓竒材未得以自致兮􅂲薄俗之淪胥叱玄夫為予枚卜􅀆徴吉繇以弗渝曰心逺而跡滯􅀆何時命之獨拘怊怊其曠懐􅀆惕惕以深省收群囂扵一黙􅀆守不動扵真静䂓豪舉扵鴻冥􅀆混牧芻乎鹿町胡魁梧之數竒􅀆彼樸鈍則猶天幸遵大路豈不可􅀆莽荆棘使吾騁亦欲􅏉扵空虗􅀆走赤日􅀅焉避影聿軒騫以有行􅀆仍轗軻甘􅀁屏離當世之紛紜􅀆合自然扵溟涬羗造化之無象􅀆妙機關之翕張叢生植之各異􅀆肖智愚以何常役中心之閧雜􅀆煽六鑿之披猖朝奔騰靡􅀁止􅀆夕偃息怳若有亡洒屏翳之淋漓􅀆吹招揺之耿光曶而出扵神竒􅀆儵又臭腐不得當邈自古之若兹􅀆哀吾生之不㳤畸汝形而益臞􅀆怪汝志之弥䠞言謇澀以少味􅀆歩跰􅓷無􅀁投􅁕奮骹䶗而衆㘖􅀆割肯綮以㫄觸惟先儒之談王􅀆固卓立以忤俗環車轍而至老􅀆陳詭詩以遭逐問蘭􅁜悲芳草􅀆登邹嶧感喬木慊素􅂨之陻戹􅀆緜千祀其芬馥彼瞢闇之弗思􅀆行狭邪如平陸託黄老而險盭􅀆攻春秋以阿曲􅅍鳬鶴之短長􅀆衝涇渭之清濁不率循扵中正􅀆毎僥倖以􅃱夫顛覆豈昔吾之自奮􅀆今獨有此沉憂託松柏之幽䕃􅀆招鹿麋而與儔俯環堵之湫隘􅀆猶采椽之彫鎪駕柴車之朴素􅀆亦炫燿其華輈䓁羮藜乎􅆝肉􅀆齊衣敝扵貂裘窮匪通其不鄙􅀆賤無貴以何羞嗤予音之寡和􅀆譽汝噐之無不周斯視聽之既狹􅀆曽不遇曠与婁麒麟出而野死􅀆鳴鸞鳯之啾啾幸定分之有在􅀆肯他岐之往謀何艶陽之駘蕩􅀆破寒谷之颼飀諒勾􅎯之畢逹􅀆雖壅閼其無由不吾用則亦巳􅀆况斗􅅸扵荒陬終越秣以燕刷􅀆夫何􅁕以自疑尚志賦惟太區之􅋁霩􅀆紛庶物之馮生藐予身之中䖏􅀆欎予志而不得逞􅀼獨嗜此古學􅀆指前哲以作程味詩書之醇粹􅀆獵道徳之精英悼世俗之馳騖􅀆吾何有乎我行􅀅􅀊月之不我与􅀆兀淹留而無􅀁成沉憂以氣索􅀆却立而質䪥攻蹩􅍷而狹歩􅀆守耵聹謂真聵䁇瞭目以霧披􅀆焱竒肱而風厲堕㤗華以施簮􅀆縮長河約之帶翔矞皇之晻藹􅀆叱麒麟使承盖神若唏而犇騰􅀆劒黿鼉乎濤瀬招屏翳予擗帷􅀆斬􅃖􅀹以褰斾折建木以指麾􅀆唉曜靈之西邁􅀅欲往彼鴻濛􅀆授予筴乎霄漢亦􅂉悲此骯髒􅀆彂商歌扵達旦溘世氛之溷濁􅀆嘘天籟乎崖􅑆薄髙丘以闖逺海􅀆恒􅐞怳而不頋返何儃佪以難進􅀆曰而則然顔子黙而樂道􅀆曽不滿夫一簞原生澹其居貧􅀆尚􅅾蒿之没垣彼豈不談王術􅀆甘窮櫩之藐艱秉中心之皦日􅀆輕外物若浮雲諒當時之謂憊􅀆猶千載􅁛其賢阽吾生之沉抑􅀆􅀅有􅁇乎古先炳予室之虚白􅀆纚予文扵太玄莽歙歘与時化􅀆希噌泓而道存棄騏􅂹而蹀􅉜􅀆登蹇􅐒乎前軒􅁋桑濮之嘈雜􅀆九韶嗼焉無聞固泰豆之不世出􅀆又何見夫榮猨彼何人哀時命􅀆每嗟卑而嘆屈􅂚不尚予之志􅀆仰孟氏之遺則繄老農之力田􅀆且多種而鮮穫矧竒士之環轍􅀆雖凍餒其奚䘏増螢爝以日晶􅀆積埃􅅽而山嶷向汙􅅺求夜光􅀆經刼火見垂棘惟􅀓險之版築􅀆扳南箕以興國亦有漁厥磻溪􅀆擢赤鯉以予翼挺尔躬之豪崛􅀆肯受人之覉勒惇鄒魯之雅言􅀆建燕趙之姱莭糅瓊靡而我餐􅀆羅翡翠以為服秉􅙑劂而剸裁􅀆鏘和鵉以㳺息撫鴻荒其若今􅀆􅀚六合為予窄齊窮達扵一塗􅀆与聖賢而同域翩丹穴之蜚鳯􅀆粲九苞之翕赩􅀅乗之以覲舜文􅀆孰知予情之至極索居賦粤吾生之寡好􅀆恒􅀌陋以索居歩中庭以自念􅀆心抑欝而不舒阽予身之兀䖏􅀆撫萬化之殊塗豈寰區之汝陿􅀆杳不知其􅀁趍惟世氛之溷濁􅀆尚蓬藋之蔵匿􅀅奮迅而􅈭昻􅀆又邅廽以沉黙去衆人之佻巧􅀆膺泰樸以堅飭紛荆棘之柅行􅀆謂卭崃其繩直肩重任之迢遥􅀆固邪軤之不力儻泛駕之有求􅀆䇿罷駑且焉止息廵簷隙而詠歌􅀆撼户􅗚以悲惻何􅀄日之成言􅀆乃棄予而不我即彼昔㳺之為豪舉􅀆曽同䖏乎險囏羌結交以鼓勇􅀆肯覊圉之遑安抗沙塵而志得􅀆巍弁冕之星攅既文虉之炳燿􅀆嗤薜蘿以為寒仰睇逺而弗及􅀆莽浮雲之㳽澷俯聽幽而若来􅀆哀風激夫溪湍汨􅋁其無景􅀆甘崛強以此蟠徒離群以蕭颯􅀆庶神氣之我完折松枝而拂石􅀆又植之以青蘭宜道義之擩嚌􅀆肯肥癯之異􅀚董生之談王􅀆且有稱扵不遇賈􅁩之眀治􅀆謫長沙而徑去􅀅屠販之汙下􅀆􅂲紛紛而改度逮曲學之肆行􅀆使吾儒之愆素古固有此渾肴􅀆矧予今之馳騖寕窮達之措懐􅀆曰羙人之遲暮循自然之天運􅀆芳草藹其彂榮􅀝㠝岏之􅅸壁􅀆臨萬仭之潭泓欵淺渚以澹泞􅀆樂儵魚之不驚構危巢其惴慄􅀆恍若聞乎鼯鼪非山林之􅁯反􅀆柰世務之􅀁嬰手不得以竪指􅀆目又何能以􅏉晴因㯉􅄆之乏用􅀆託考槃之遺聲永言抱此幽獨􅀆庸詎釋夫我怦貪女賦并序予春秋二十有二嘗偃蹇不得志囙讀史記感甘茂貧女分輝隣燭之語故作是賦以廣之伊太鈞之坱圠􅀆敷動植扵八紘兹女􅏝其居貧􅀆乃困苦而不得生惟室家之蕭索􅀆属多難之来并空展轉其窹􅄰􅀆魂惕惕如有驚頋儋石之不儲􅀆支墻屋之欹傾印䑕跡扵床塵􅀆网蛛􅁝扵門楹胡藍縷而不完􅀆又機杼之無聲凛寒風之中人􅀆感促織之宵鳴拂敗奩之殘蠧􅀆舊鏡黯以羞眀銅􅁫折其半股􅀆􅅍鬟髩之縦横拈竹筐之素縷􅀆箴欲澀而不行亦何心扵組紃􅀆况鴛鴦之􅀎成挾故絮以假􅄰􅀆耿寒熖扵孤檠誰哀吾之窈窕􅀆􅄑自保其堅貞嗟父母之鞠我􅀆羙裳衣而蔵匿矧櫛風而沐雨􅀆身乃罹扵荆棘忍須􅁷扵溝壑􅀆豈敢休乎􅅙織欲一眩其盛年􅀆縦粉黛而無色羌鑚穴與踰垣􅀆謂善􅁋之為惑庶容徳之可全􅀆雖凍餒其奚䘏彼隣􅁎之纎巧􅀆日靚粧以登樓綴木難之充耳􅀆揷翡翠之搔頭騁兹心之􅯾冶􅀆學趙舞與齊謳佩堦蘭以求媚􅀆祇怨曠之懐憂信怙寵以取樂􅀆盡夙夜扵衾禂飛瓊觴以嬌醉􅀆秉銀燭而懽逰恨兀兀以獨䖏􅀆欲􅀙汝以為謀細娱聿其可翫􅀆重桑濮之貽羞寫予心扵溝水􅀆􅂲年華之遲暮甘蓬葆而不恥􅀆豈蛾眉之見妬且􅅸世而特立􅀆逮傾城而弗窹廼蕉萃之或弃􅀆縦效顰而罔頋紛来彼之柔桑􅀆䡖擲金扵行路苟力操乎井臼􅀆微􅀮徳吾誰慕繄二南之彂政􅀆由夫婦之􅀁椎化尚及扵草木􅀆獨不撫乎􅑱嫠利遺秉与滯穗􅀆豈年登而啼飢儻卒􅀊之無􅄄􅀆何功裘之􅁕為慨兹道之愈逺􅀆指古人以自期􅂓援瑟而一鼓􅀆遂聲之以為詩詩曰有羙一人􅀆東鄰子耀金珠􅀆列紈綺弄姿飾髩􅀆匪桃伊李朝為春風􅀆暮則流水曰妍曰醜􅀆云誰之使見肘決踵􅀆我樂乎此樂吾之樂􅀆勿傷吾貧寵之一失􅀆金屋生塵固榮艶之匪望􅀆又何必怨夫陽春淵穎吴先生集卷之一
