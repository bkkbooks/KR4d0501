front:
  text: 章之不鼓汝譽兮抑智慮之不竭汝精信乎不内而務外兮故卒與俗而咸諡為氓自玉靈之有言兮庸一泯於至黙雖吹菙而我瀆兮恐告猶而弗食孰方功而義弓兮孰體色而墨坼楚靈投詬而終不汝畀兮闗朗豫占而任徳茲一息之尚存兮幸五官之識職諒用舎之無與於已兮庶藏脩之是力奈自治之不勇兮敢罔稼而欲穡母謂龜䇿之不能以知事兮極神靈之不可測
