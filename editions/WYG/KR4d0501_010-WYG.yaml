body:
  text: 竄宜􅨔辭予自一二年来病既久而日以嗜睡睡又多夢或謂予古有善睡者其神名曰宜􅨔盍竄之乎予每恠夫病之亟矣惟睡為能少息夫病也然而晝之所思夜夢見之紛拏膠擾不遑少止是則甚非學道者之所宜有也作竄宜􅨔辭伊我生之多病兮廼獨處而上隅爰有托扵假寐兮僅身心之舒愉幸世紛之刋落兮寄吾夢之晏如等百年為一指兮謂八極其蘧廬昔宰予之在聖門兮曽譏斥其不可雕杇何儆戒之遽忘兮恐宴安之或踰豈宜􅨔之每為我祟兮竟淫荒昬其逃誅予誠與汝而並世兮敢自陷扵非夫惟枯瘠之若茲兮卒戰兢而自勵凛形骸之欽肅兮召魂魄之迷潰竦志矛而汝擊兮充氣楯以為衛據槁梧之不復瞑兮麾狂藥而弗齊㧞妄華之根撥兮敜邪壘之譏試尸蟲穢雜而不黨兮病骨纒綿而何瘵􅘒天地之一清兮赫聖賢之吾對湛靈扃之寂然兮藴妙賾之無外精思慮其若一兮致事為之弗閡信茲魔之釁逐以不返兮吾益見其通明而罔害嗟早嵗之我痼兮奈平居之鮮懽固精神之耗蝕兮漸榮衛之疲殘迄旦為之見梏兮何夜寢之能安曷畀我以窅漠兮思濟身之艱難當日用之不遑少息兮紛俗變之相干頋嗒然而欲一隠其几兮懼純素之弗完文儒或弛其名譽兮劍士寖喪其怒瞋尚喧豗拏攫之盡去兮寧呻吟啽囈而増昬信黙黙而時化兮直緜緜而道存吾何負而我逺兮雖自訟其奚殫彼隂陽之交㑹兮特感變之所起宜正噩之有占兮實祲煇之相倚緬古莽之睡矇兮復阜落之跳䚦豈幻化之往來兮孰夢覺之非是􅘒吹爇乎死灰兮恍撓淆於止水雖形接而謂夫皮膚兮竟神通於骨髓何今魚而昔烏兮且我蝶而彼蟻方雲霧之倐為飛滅兮又雷霆之鳴燬貧何患而或盈倉庾兮賤何辱而遽躋朱紫信苦樂之相乗兮罔動静之可弭謂静定之可以自勝兮卒勦勞而弗已誠道真之不至兮故徒與世妄而同軌自我病而益病兮匪宜􅨔其誰尤肆操存而不舎兮収視聴而與謀儼聰明之不我壅蔽兮愈泮奐而優游要虛懵之盡黜兮俾菑孽之日瘳惟真人之無夢兮在一黙而何求縱我夢之或可少徴兮吾又何得乎黄帝與孔丘盼晴牕而笑傲兮發􅗜簡以謳歌冀宜􅨔之一竄以不復兮用稽首于𤣥都葛天氏牛尾八闋樂歌辭古者葛天氏之世世道治矣而人民康乂樂是用作始敎人操牛尾投足而歌之是亦天地之間自然之至音也然而樂辭不傳後有愽古閎覽者惜古樂之日閟不顯託而補其辭凡八章載民一於赫顯穹降厥生民生民如何羣物與淪俗無上下親孰父子爾騃爾狉孰綱孰紀泊乎無名澹乎無聲天地無作聖人化成我民自化帝不汝得是曰載民我民之則𤣥鳥二𤣥鳥來矣我民其興氣以陽發質以隂凝𤣥鳥歸矣我民曰息静安其性動職是職爾居爾巢禽獸蟲蛇爾食爾火蚌蛤果蓏我利我養相時制宜匪政匪教尚安所施遂草木三邈矣上古元氣肇萌彼浮斯茇庶草彚生孰闢我區孰豐爾茁樏山砅川􅠡皮採實火無爁炎水無浩洋狡蟲斯伏鷙鳥弗翔允哉樂兹草木蕃廡嗟吾何思維聖之緒奮五穀四孟春正月我出于田矧我勞勩愳我瘠損揉木耒之剡鐡耜之天雨澮之時風耔之維穈維芑維稻維粱弗爾穢莠亦弗菑蝗五榖告熟民人率育育焉熟焉自古有年敬天常五太𤣥伊始風氣日開天有常道生養死埋犬雞巷中麻麥畝首貨財既来什器孔有卧則呿呿食則吁吁飢則求食飽則棄餘於乎不顯孰不念聴日監在茲奈何不敬達帝功六昔在泰皇君臣道生君有五期輔有三名上昭天光鳥獸文章下恊地符龜馬圖書一人在位萬邦順軌無幽弗燭無險弗砥黎獻共臣蚑蠕畢從匪帝之功伊誰之功依地徳七我望兩海中有崐崘天靈被跡乾曜合元孰來蜚龍孰度七囿人禽並擾庶品蕃毓乾以易知坤以簡能甲厯既正機矩迭乗帝予何言天地之徳我民之依俾民弗忒總萬物之極八自有聖人我革鴻荒何毛何血曷弁弗裳維聖人富維聖人夀聖人之厚萬物之阜熈熈乎和皥皥乎大道有自然徳無疆界爰命樂師投足握氂欽茲念哉天下攸歸右葛天氏八闋樂歌辭凡八章盖予嘗讀吕氏春秋頗載葛天氏之樂名而不聞其樂辭予故本其樂名特補其缺樂則古矣樂辭今也古今之樂殆不可以遽同者也然今之天下猶古之天下是雖邈乎逺在數千百載之下何獨不如葛天氏之世乎古之説者每稱上古之世代厯紀者尚矣自羲軒以来柏皇受禪迄于葛天氏十有餘傳歴年之久近都邑之建徙要皆不能以必得其實者况其樂哉然以古之王者道合乎上徳依乎下恬澹而神明内顯恭黙而政教四逹煦焉而春發凛焉而秋肅隂陽之氣畜積而舒布民物之俗優㳺而康樂由是天地自然之音出之於口而成歌天地自然之節動之於手足而成舞舞必三人歌必八闋操之必以牛尾播之必及於帝功民事吾知其節八音行八風屈伸綴兆俯仰參錯而具有其容矣吾又知其沐浴膏澤歌詠勤苦聲文音律安徐和緩而務合乎法矣皇羲之琴女媧之笙朱襄之瑟伊耆之籥前後相耀彼此相襲是盖近而英咸韶濩逺而巾拂鞞鐸之所自出者也近古以降大樂官失職古樂日廢然而五音七音六律六十律四清聲八十四正調之法度猶有賴乎西域龜茲之所傳唐末五代之亂又從而殘缺不備訛謬失莭至使蜀一賤卒而欲立一代之樂府鎔金鏤石崇牙列虡足以極衆工之選雖若名儒鉅子學不聞古樂無其師竟無有一舉口議其可否而請以更張者於是古之所以吟咏其性情動盪其血脉消融其渣滓者無復可見而淫藝邪僻驕慢輕剽之風日競月増靦不之恤子女獶優舉聲號器杯盤狼籍頓足跳踊則已雜出扵鄉邦聚㑹賔客讌飲之間矣嗚呼古今之樂其信不可以遽同者耶此予重有取乎葛天氏之樂名而特補其樂辭者也後有聞者得而歌之且將惕然有感於古樂之不作矣又何愧乎樂辭之今也哉然以黄帝以下六代之樂與夫成周之九夏唐元結皮日休乃得而盡補其缺鼚乎鼓之軒乎舞之或者當百王之末造而猶可以得返太古之遺聲乎嗚呼逺矣予是以特録其辭而又論之尚庶㡬乎大樂官之採擇嚴陵馬君仲珍父誄辭維元統二年月日嚴陵馬君仲珍父卒於家凡歴六朞始克𦵏于新亭里先人墓側我二三子追愍其遺行之不昭於時乃作茲誄用相其哀誄曰於嗟馬君厥姓維羸是曰造父别封趙城趙之既王奢也善兵爰邑馬服開國秩卿世降炎劉北州籍名援分戚里融振儒聲逖焉鉅唐重績治經孰揚天朝燧握節旌信茲苗裔何代弗榮播爾宗譜百世一程故汴之遷視杭作京靖念爾祖䇿科騰英敭歴州縣執持憲刑鴻蹌鳯翥玉㓗氷清徑躋法從領袖明廷端紳搢珽實棟國傾維言維行流風盛行曰孫曰子夥有簮纓世禄日逺家氊相承如何君子異我編氓維君自㓜鍾厥豐偉長而好學耽翫書史昭茲六經卓有根柢老儒後先搜擿章指孰王非綱孰聖弗髓發揮義殊談論蠭起恣觀百家渉獵衆技儒墨交㦸徳刑迭燬鴻荒迄今王霸臧否薄海内外華戎遐邇孰詩孰賦鏗合宫徴或𤣥或竺彪别邪詖我常謂多君謂道咫泓涵浸潤岋峢君不自能蔚為秀士立辭摛藻聞者風靡自君既壯聿有時譽矧學之谹弗據要路緬爾祖徳敢懵我故熾爾學業肻墮我素名場大開百郡充賦匪閩伊楚矜􅌶犇騖彼晳此黧揮霍吞吐聚焉風雨散若雲霧孰玉弗雕孰金弗鑄匠般何人文梓弗遇唶哉數竒得此遲暮誰非退鷁誓不脫兎我儋我簦爰告我渡我吏其儒律我章句彼賢非賢孰妬弗嫮菰城甫里雪浪煙樹人皆儒顯我獨儒誤君何不淑復奪君遽豈無文學尚寐無寤千載一朝畀彼丘墓伊昔大化乃形爾身既具四體孰儲爾神何言何黙既笑既顰何冠何履被服褼褼孰贏爾學使爾有聞孰嗇爾仕忍不少延維其生之夭閼弗完豈如無生窅漠自然我問𤣥宰孰司其權紛綸變易渺是天淵愚蒙者夀智勇則顛卑汚者寵藻麗弗宣顔駟􅏝剥至老乃遷劉晝擯斥厥有詆言言念君子過彼二賢嗟嗟奄迫命不可攀盖予羈丱曽奉顔色爰受君詩僅識䋲墨君不鄙夷忘我年徳我心爾諧略我儀飾我來自東我病殊極君若我留撫茲衽席陳薦酒肴翻倒琴䇿一年一集歌咏忘食云何遽離久不我即我邸于西遇君逼側大江作潮我溝我洫鸒鳩搶地我覆我翼曽是茲秋嘉節是逼奈以賞心强欲登陟滿天隂雨被蓑著屐故交何有獨不遑息剨然長嘯嵓谷罔覿慘悽中人輾轉病極君生窮窶君死豪特新亭之里痛此窀穸我今誄茲𤣥石弗泐嗚呼珍父是用哀惻春秋胡傳補説序春秋之學自近世本河南程氏程氏曽有春秋傳序而傳未完武夷胡公安國盖又特出扵程門之後而私淑艾之故今胡傳多與程説相為出入吾固知胡氏之傳春秋本程氏學也然而隠桓之際訓釋頗詳襄昭以降遺漏甚衆又况光堯南渡而胡氏以經筵進講至於王業偏安父讎未報則猶或未免乎矯枉而過正也宗人正傳間者甞讀胡傳乃因傳説之未備從而補之此誠有益於學者曩余甞論春秋之大凡欲以發明胡傳之一二而正傳先之故敢私序其説於正傳所論次之後曰夫春秋者魯史爾自魯史而為春秋則春秋乃史外傳心之要典而特為聖人命徳討罪之書矣然自唐虞以来典禮教化有人心感發之妙爵賞刑罰有政事勸懲之嚴伯夷之降典播刑皋陶之明刑弼教何莫而非此道也惜也春秋之世文武周公之舊典禮經曽不復赫然振起於天下而天下公侯五等之國亦莫能考禮正刑一徳以尊事天子惟吾聖人盖有聰明睿知之徳而無其位於是獨持其命徳討罪之筆而欲以定天下之邪正也吾賞焉而賞非私與邪也吾罰焉而罰非私怒此其陽舒隂慘舉直錯枉之間先後有倫衆體有要是謂經制持循凖的不容少紊人情之輕重不同世故之治亂亦異是謂權義洊移前却必得其冝要之堯舜文武之治未墜於地而吾聖人所以務盡其祖述憲章之道者至矣實聖人時中之大法也夫然故春秋聖人之法書世之學者猶議法之吏惟其知聖人之道揆而宅心忠恕然後可以通聖人之法守而立説坦夷雖然學者徒以其一曲支離淺中狹量之資求之未易以及此也或曰春秋尊王聖人因之枌飾太平而多褒至治之世曽無奸暴之俗而惟以徳化者或曰春秋衰世聖人且以為舉國不可勝誅而多貶始亂之俗雖以微小之罪而必舉其法者也是故舒之而遂縱者陵遲廢弛無法而益亂操之而愈亟者煩苛刻戾得不至於秦人恃法而寖濫乎嗚呼二或之論誠非所以識吾聖人時中體道之大權者矣又將何以窮經而致用哉自王安石以丞相説經春秋乃廢詆不用世之學者徃徃多自為説至於意有穿鑿巧為傳㑹分裂聖人大體乖異先儒成説漫有精義至當之論一説之外不知其復有一説也盖惟程氏為能通乎制事之權衡揆道之模範又無完書世之盛行胡傳而已胡傳本乎程氏之學程氏之學又信乎聖人時中之大法也然而猶有所未備者焉今也正傳乃從而補之誠是也正傳其真議法之吏哉雖然前王之律昭然甚明後王之令紛然雜出宏綱大指既無其統微辭碎義盖浩乎多若參商矛盾之不相合者吾益懼焉卒以待吾正傳而後定也昔孟氏使陽膚為士師問於曽子曽子曰上失其道民散久矣如得其情則哀矜而勿喜善哉言乎學者又當自是而求之此其必有合於春秋者矣呉氏戰國䇿正誤序戰國䇿十有一卷凡言周秦六國宋衛中山之事古有高誘註最為疏畧近世縉雲鮑彪乃復分析章數竄易字文悉今可讀而不致有噤口敝舌之虞雖然古意寖已失矣要之古今之字義曽不一同南北之方言或隨以異而彪欲以後世窮鄉曲學而盡通之吾知其必至於穿鑿粉飾而强其所不可通則反不若誘之疏畧也宗人正傳嗜古書甞以國䇿之多誤暇日則取太史公史記及戰國諸子所自著書前後比較既又考夫近世劉攽錢藻姚宏等本參伍錯綜然後有以見其語言之殊異傳冩之缺訛而是正之盖頗貴乎誘之近古而深惜乎彪之妄作也於是世之讀國䇿者文從字順不失其真戰國君臣從横㳺説之事併可得而極論矣盖夫古者先王之世道徳同敎化行而風俗一士之有賢材學業者修之於身著於其國或以徳舉或以言敭要皆可以考名覈實而趨事赴功無或敢為熒惑變亂而懵乎是非黒白之混淆也然而聖人當夫天下極治之世每有慮焉盖曰朕堲讒説殄行震驚朕師豈不以世之讒人傷絶善人之事震駭衆人之聴邪僻自此焉而進用矯偽自此焉而假託出入起居發號施今將無所徃而不盭於道苟謂世為極治而慮不及此吾恐其漸為始亂之基矣是故聖人深以讒邪之説有未易化而且有以敎之必使其遷善改過而後承之庸之否則威之夫然後士之有徳有言者各稱其任而天下之欲趨事赴功者亦皆實有所稽而無歉矣自戰國以来先王之治日以逺甚聖人之教若罔聞知士之紛騰馳驟於天下者曽無常有之善心而惟磨厲其舌肆為讒説莫之能恤析言則離於理破律則懐於法亂名則喪其實改作則反其常此固先聖王之所必誅而不以聴者而戰國之世乃安然而行之孱君弱將纎兒佞妾刼之以敗降殺戮之苦誘之以聲色狗馬之好情知非是巧為文飾勢欲離合强相傾陷卒使上世元徳顯功之胄日就淪亡而後已嗚呼讒邪之説有可畏哉盖昔孔子曽用於魯未㡬而即有少正卯之誅徒謂其言行之偽而不由於誠學順之非而不由於是雖吾孟子亦甚惡夫處士之横議異端之並起詖淫邪遁不可勝窮惜乎孔孟之道久矣不明於世戰國之士不復知有義理之當然而惟以利害相勝故今斷斷然悉以為古之讒説可堲者也然今誘也注之彪也釋之吾正傳乃從而是正其誤又豈不以國䇿之言為不可廢歟雖然正傳學孔孟之學者也自先王道徳教化之治本諸人心播於簡冊充衍洋溢逺而未斬是故春秋之世鄭之賢大夫且能善於辭令應對諸侯鮮有敗事聖門言語之學逹如子貢亦或一出於魯而彼齊晉呉越等國為之有變至於排難解紛成彊取霸而後定焉前乎此矣於是而後公孫衍張儀陳軫樓綏蘇秦秦弟代厲之流揣摩捭闔權謀術數浩乎若江海之浸恍乎若鬼神之不可端倪雖其讒邪之説罔知義理而傎倒錯繆之一時口頰之移人固有非後世膚見謏聞者之所可遽及嗚呼先聖王道徳教化之澤一旦而遂至於此言之可為於邑矣然自其文辭言語而觀之惟楚漢戰争之世尚為近焉已不能盡及它則曹魏鼎足而割據李唐參布而分藩交兵之際奉使徃來權術相傾議臣蠭起曽無異於戰國楚漢紛紜之時者竟未甞有一言語之􅌶動一文辭之譎勝雖以當世史臣極力摹擬而為之亦且羞澁畏懦衰耗促數無復有昔時辯士説客之遺風矣是故世之讀國䇿者卓然視為先秦之古書不可廢也必也本之以心術之公約之以義理之正謹之以辭令之發戰國其文而非欲戰國其學也此則正傳之志也又在乎世之學者善讀焉而已矣石陵先生倪氏雜著序自東都文獻之餘天下士大夫之學日趨於南或推皇帝王霸之畧或談道徳性命之理彬彬然一時人材學術之盛不可勝紀盖東萊吕公本其伊洛義理之學且精於史永康陳公同父方與之上下頡頑其議論而獨貴於事功夫以國家兵戈離析之久王業偏安人心不固紀綱廢壊風俗蕩焉而失防意將自有酌古凖今知時識務之士雄豪智勇闓爽頴茂而出於其間或者猶慮其古方新病之不能以救亟也當此之時同父甞陳征討大計石陵倪先生朴實先後同父草書萬言欲以兵戰自效不下同父然同父因其才力氣岸之豪中陷於罪釁至老纔得高第終以不得馳騁於中原而遂至淪沒先生方自以其學勝亦且不能於鄉里至以罪廢徙筠陽故雖有志焉而終以寒窶而老死盖予每觀先生之書則為之沈吟痛惜而不能自已先生甞本其兵戰之所自出備知天下山川險要户口虛實著為輿地㑹元四十卷又推古今華夷内外境土徼塞之逺近繪以為圖張之屋壁而預定其計䇿逆料其戰守者不一而足是將願出為當世有用之學而不欲僅為儒者陳腐無實之空言當時之士惟同父為能知之先生亦惟寄示同父而不遑以他及者也然使先生之志且與同父獲用於世天下之兵蜂集蟻聚勝負雖未可知必也人心國論之既定于一力守東南以為保障専意西北以謀進討江淮襄漢日以寜謐秦鳯陜虢之間遺民襁負義士壺簞尚不為無補於萬一者是則後世所以深有取乎樂毅之常生而重恨曹蜍之淹淹待盡也夫自南北分裂士之學者方守於一偶而禹跡之所被者率不能以徧歴黄河之源出於崐崘黒水之流播於南海而近世地理之家茫無據依逺相億度盖今海内混一重譯萬里黄河自星宿海發源歴九渡河而後北㑹於臨洮積石之西黒水復流其西界而徑趨於滇越之外境若可以燭照而數計者譬如談天文者每以洛陽居天地之中然而南至比景比踰鐡勒斗極出沒高下之度殊不可以常度凖又豈得徒溺乎羲和渾天之器而獨不少究乎周髀勾股之法哉是故先生輿地㑹元之書茲既不能以復見至於華夷内外境土徼塞之圖則猶未免乎參差矛盾而未盡善者此殆古今祖述編類之一疵也雖然先生之學誠可謂慱而有用者矣當吕公云亡先生貽書同父謂宜力學以紹吕公後而同父咈然不悦是其一時人材學術之盛卒不肯俯首以隨人下而欲自表表於世自今觀之前軰老成凋喪俱盡新學小生鹵莽不學是以一切墮於黄茅白葦而欲以為同竊其殘膏剰馥而不敢有異至其立言䈤口結舌而無所發明臨事則亦玩時愒日偷懦憚事而不足以赴其鼓舞作興之機者此皆見棄於先生者也藉令先生之學本之以伊洛之義理而又無貴乎永康之事功則其所就且將不止於此雖然今之學者尚可及耶吾固未易以王道霸術之並行而遽少之也初武夷謝翺臯羽甞因先生之書選為一編今始得其全帙號曰雜著者觀之又甞過其所居則山洞湮塞棟宇傾蕩蕘兒牧豎悲歌躑躅猶能示其故墟而亦不能詳也况其所著之書耶嗚呼士無當世之功業而徒務於有言不至于此不極也是又古今文士著録藝文者之一歎也悲夫淵頴集卷十欽定四庫全書淵頴集卷十一元吳萊撰
