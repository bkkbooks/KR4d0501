body:
  text: 改元論上先王之始得天下也必明一代之好尚以新斯民之耳目聞改正朔矣未嘗聞改元也然則商訓稱元祀春秋書元年者何以哉曰是直史官紀述之常體耳將以志人君之在位久近者也非王者以是為重事也後之說春秋者乃欲以改元為重春秋之初周平王立四十有九年而魯隱公又改稱元年藉令重在改元何不襲稱王者之年累數而明詔於人哉抑魯以周公之裔且僣改之也苟或僣改必冝誅絶於夫子之筆削又反從書之獨非撥亂反正之道乎盖自古未嘗有改元為是說者特出於戰國秦漢之間周之既衰秦與列國争稱王其初即位時猶以諸侯之爵行國中國人皆稱之曰公及後以王自稱史官欲少異之明其稱王之始故曰某王改元是豈班班然播告於其國者哉徒以書之載籍而已耳何則秦恵文王孝公之子也立十三年矣十四年乃稱王而秦史改元魏恵王武侯之子也立三十六年矣三十七年乃稱王而汲冡竹書亦改元又十六年而後恵王卒非改元也明泰魏之始稱王也此殆為史官者自志其國之事猶春秋之於魯史也求其說而弗得又大惑焉且謂西伯在商紂世亦嘗稱王亦嘗改元其兆特因戰國之秦魏秦魏豈果以改元為王者之重事哉說者恒曰為國君者即位之明年必告廟以臨羣臣然後改元然以之言告廟則可臨羣臣則可以之言改元則未可國君嗣位定於初喪先君之終即嗣君之始若曰縁終始之義一年不二君特臣子之情不忍遽死君父故居喪自稱曰子國内民人之心繫之久矣將為史官者以先君之薨年不得便為嗣君之始年始待其明年告廟之際乃次第以書之如太甲祇見厥祖而元祀之文著於商訓也以事繫日以日繫月以月繫時以時繫年書之以年則又繫於一國之君是皆有不得不然者也故曰直史官紀述之常體耳然則何以變一為元杜預曰人君即位欲其體元而居正故不言一年一月此說善也而後之說春秋者自異焉亦不合於春秋矣改元論下為春秋者曰惟王者然後改元東周之遷王政不行諸侯亦皆改元近而宋魯逺而晉楚下及邾莒滕薛雜小國莫不皆然魯或以是而改厯晉或以是而改正朔秦或以是而創閏月此又似是而實非者也太史公三代本紀有三代世表徵尚書尚書無年故年不可載乃以世紀之十二諸侯世家有十二諸侯年表六國年表共和以下徵春秋左氏内外傳秦始皇以上徴戰國䇿皆有年故既以世紀之又以年實之然或已失其世系失其年代失其名爵矣且先王之世有小史外史以掌邦國四方之志諸侯無私史也晉之乗楚之檮杌魯之春秋至東周而後有是故二十諸侯之年始可得譜然不可得譜者亦多矣燕至惠侯而始有君秦至穆公而始有名楚至若敖而始有年滕薛鄒雖文武之褒大封小不足齒他大國當西周之盛亦徒紀之世數而已近者詳逺者畧也非必曰以周之衰而諸侯各自改元推春秋之義此尚得為大一統乎盖古之王者無改元惟用舊嵗季冬頒來嵗十二月朔於諸侯諸侯受而藏之祖廟至則以特羊告廟請而行之東周既不頒厯故魯亦作私厯猶私史也若諸侯固自有日御矣秦以僻陋之國􅁁在裔夷於是始有史官始創閏月則猶魯厯也然三王之正不同而獨夏數得天商周革命且改正朔以示不相沿襲廵狩烝享兵農田獵猶自夏焉故周官有正月有正嵗正月夏正正嵗周正三正之通于民俗尚矣汲冡竹書雖用夏正以紀晉事抑何嘗有改元之說哉若曰東周諸侯皆改元則此晉事上起殤叔殤叔晉穆侯少子成師也别封曲沃是時文侯昭侯猶在殤叔比晉一大夫耳無緣改元特武公卒併宗國不數文侯直推殤叔以繼穆侯徒志其始封與卒年也太史公漢興以來諸侯世表髙祖功臣侯年表類於每國書某王元年某侯元年方天下大定奉漢法度行漢年號固也又况孝武新建元而輙自改元可乎淮南鴻烈亦稱淮南元年許慎註云淮南王安始封之年也特為史官者欲著每國之名爵年代世系故一以是書之非改元也考之於漢者如此則可見東周諸侯之必不然矣秦誓論上秦穆公因杞子之謀以伐鄭鄭人知之既還而晉人又敗之于殽内愧蹇叔外為諸侯所笑咨嗟痛惜發言自誓且以咎其聽言之失而已欲戰之心固自若也修而車賦儆而師徒逞其憤怒求以報復非不欲詢老成棄新進也言猶未已而兵遽出於晉郊然則夫子何以獨列之書乎將不取其悔過乎曰夫人誰無過過而能悔然後能改改過君子之心也以君子之心行王者之事將已亂非生亂將寡怨非積怨穆公有一於此乎今徒信其區區自誓之言不察其無道用兵之罪雖說春秋者亦不敢少責於秦反以深責於晉是不知秦猶晉也且曰晉人三敗秦師秦之見報人之常情也未至如晉之甚晉人又輙報之則過矣故春秋常情待晉襄王事待秦穆文之四年穆公雖見伐而不報然後可以實其悔過之言是又非也夫以秦之所謂悔過云者吾知其心矣必也追念既往之敗引咎歸已作為言語以自解於國人使國人不徒忘其死傷暴骨之戚且又作其迅奮欲戰之情封殽地之死骨啟隴西之霸圖盖已盡在於自誓之一日是則因敗為勝轉禍為福而鬬士自倍者也若夫文之四年穆公非不欲報伐也兵出累年民勞國敝又復有事西戎闢國十二固少愒耳未始一飯不在晉也六年之夏穆公卒矣不然晉不先動而秦輙加兵非結怨亂之甚者乎雖以康靈桓景繼體之君出事已隔世讎猶未釋自僖三十三年殽之戰迄宣十五年輔氏之戰凡幾戰矣三四十年之間和好未甞恊兵釁未嘗解不顧義理之是非而專以干戈為報復非正之道也春秋且以是而狄之矣穆公為有以基之者也烏在其能悔過乎雖然自其言而論君子不以人廢言此夫子所以獨列之書也自其事而考二帝三王以來世變至此極矣是未可以王事待之者也齊宣王伐燕而敗慚見孟子而陳賈乃教之以文過由是較之則穆公之所以為賢者豈不遠矣秦誓論下方周之東遷平王之命盖與成康太平之世無以異扵是哀痛慘惻之心亡矣周道不幾於衰乎雖然聖人猶有望於魯魯周公之胄秉禮之國也魯不足望則天下之勢不併於秦而不止是故帝王之末簡而秦魯之誓書附之予嘗論其不然當春秋之時秦幾霸矣殆無與於王室之盛衰自殽之戰大敗於晉兵戈日尋無有寧嵗東諸侯不復與盟㑹又且南合於楚晉楚争衡秦何有焉晉人曰齊秦楚狄方强今三强服矣敵楚而已楚人曰捨齊秦他國請相見也是秦不晉楚若也且秦之興始於孝公之用商鞅成於惠王之取巴蜀地形便兵力壯蠶食六國併吞二周戰國之秦也非春秋之秦也此其去吾聖人之卒也亦久矣雖吾聖人之荅子張以百世可知必曰其所因者在乎禮其所損益者在乎制度文為小過不及之間耳非若後世䜟緯術數之學也烏知周之必併於秦哉聖人不作諸子雜說並起左丘明國語載史伯之言亦曰夫楚重黎之後也黎為髙辛氏火正昭顯天地以生柔嘉姜嬴荆􅇗實與諸姬代相干也姜伯夷之後嬴伯益之後也伯夷能禮於神以佐堯伯益能儀於物以佐舜其後皆不失祀而未有興者周衰將起矣又曰武王之子不在應韓必在邘晉且使鄭桓公勿偪焉而别寄帑於虢檜然亦何以異嚮所云哉夫西周之末王政舛錯史伯知其必亂則當矣齊固大國也雖晉文侯帥師以救周難猶次國耳楚亦蠻夷蕞爾子男之邑秦仲方入仕于周尚未得岐豐地未列於諸侯豈得與諸姬代干也哉必周之東遷齊始霸晉亦相繼而霸秦則桀驁於西楚則暴横於南惟鄭也適居四方之㑹交南北之衝彼四國者恒困之矣丘明特與魯悼公同時且推其所見而言皆傅㑹無誠實猶戰國之世見秦之強遂謂聖人叙書之際已覩其勢之若此而特以感傷之微意寓焉非行事之深切著明者也然則書何以列費誓秦誓曰伯禽初封適有淮夷之冦以修内備以扞外侮井井然各有條法盖聖人善之者也非有望於魯也若夫秦誓則吾前論及之亦詩之取魯頌商頌也如是而已矣孔子不貶季札論春秋呉子使札來聘呉蠻夷之國也君稱爵大夫稱名而不氏因其始通禮盖未同於中國也是特楚椒秦術一例而書耳說者曰春秋責賢者備呉子使札春秋不稱其公子是貶也然則曷為貶札賢者也本其辭國以生亂故聖人特託其來聘而貶之也是不然夫呉子夀夢有子四人長曰諸樊次曰餘祭次曰夷昧季則札也父知其賢兄弟亦知其賢嘗欲立以為嗣矣又且約以次傳而致國矣然終不肯有其國豈不曰立嫡者以長傳國者以賢苟不顧人道之大倫以成其父兄之志誠不若守匹夫之介節而得其退耕于野之安也何則長㓜之序不可紊君臣之分不可奸將已亂也非生亂也今則諸樊兄弟已死夷昩之子僚乃立吾將奉嗣君之命而歴聘乎上國豈料魚劍之變驟起於肘腋之間哉聖人固不得以是而豫貶之也闔廬之謀王僚之弑且知季札必不受成國於賊手僅以先君傳授之次第藉口於國人雖常人之情猶得之矣况聖人乎說者則曰太伯犇呉而不返季歴嗣位而不辭武王繼統而受命亦不以配天之業讓伯邑考也是又不然夫太伯之去因古公之欲立其弟季歴嗣位非未辭也端委治呉而不返豈可隕周家已成之業哉若伯邑考則且為御於商見殺於文王之世矣使太伯返則季歴不肯承西伯之任伯邑考在則武王亦不肯任天下之責太伯之徳雖在於讓季歴之賢武王之聖非皆出於不讓也父子世常法也兄弟及則法之始變也陽甲盤庚之間殷以是亂者九世豈獨季子之辭國乃生亂哉說者則曰叔齊之徳不越伯夷孤竹舍長而立㓜私意也諸樊兄弟無及季札之賢者父兄眷眷焉欲立札公心也是又不然夫伯夷以父命為尊叔齊以天倫為重彼此交致其讓而各盡其心以故聖人賢之然季札又何以知其為公心哉諸樊兄弟欲承父兄之志使有其國盍不於吾魯隱桓之際觀之乎恵公欲以桓為嫡禮之所不得為也惠公縱其邪心而為之隱公又探其邪志而成之秪以自禍而已壽夢其惠公也諸樊兄弟其隱公也吾見其邪尚何公心之足云哉且謂季札生亂於辭國殊不知使有其國亂益甚矣說者則曰春秋多變例聖筆有特書荆楚無大夫而屈完書氏王朝下士以人通而子突書字諸侯公子以名著而季友書子母弟之無列者不登其姓名而叔肸書氏皆以賢而特書也若仲尼亦賢季札必依此例而特書矣是又不然夫齊桓召陵之師楚人未有必盟之意也而屈完請服王人救衛之役王室㣲矣而又使子弟主兵故子突不得有功季子來歸則我公請之於齊而欲以靖魯國之亂叔肸之卒則又或以公弟之貴而世遂為卿聖人之特書者特因四子以生義豈得與季札例言之哉然則春秋之㫖主於呉之楚聘不主於季札之讓國季子之來聘可見也讓國不可見也呉之始通禮未同於中國呉子之使札是猶楚子之使椒秦伯之使術也聖人一以是書之至若楚之自州而國自國之有君有大夫而後漸同於中國後日楚子之使薳罷君以爵大夫以名氏楚始盛矣聖人果賢之乎否也今則春秋書之曰札而不稱公子者呉之始通猶未至於楚之寖盛故也又况呉子之使聘者一國之事季札之讓國者一家之事春秋魯史也主於呉之聘我者耳若季札之辭國生亂非惟聖人不能於是貶之雖聖人欲於是而稱其讓國之賢亦所不能也要之為此說者公羊則曰賢季子穀梁則曰善使季子夫季子固賢者也春秋亦不以其賢而不名也公羊所謂許夷狄者不一而足是也若以呉子之使札為善札賢而名所以成尊於上楚椒秦術名而非賢也又將何以成其君乎是盖呉之始通而後有聘賢札貶札聖人不暇論也今又反因二傳之說強附他義且貶為非賢者何哉失聖人之本㫖矣與黄明逺第一書論日夜食頃見舉穀梁春秋違失有日夜食之辨及觀劉氏權衡亦謂春秋據見而録不應書日夜食何休難之得矣鄭康成強為文過耳予嘗考之日月之贏縮有常度則日月之薄蝕者候之亦宜有常聖人之作春秋所以宣明厯數而示諸人者固不能必日之不夜食也荘之十有八年三月日食上不著日辰下不稱晦朔是則穀梁求所以解經足以知日之有夜食鄭君知所以驗日之有夜食以故寧分榖梁之過而不辭古者天子有日官諸侯有日御世修其業以攻其術孔子為春秋之故亦修殷之故厯夫厯春秋之所重也後之儒者或造家術或用黄帝以來諸厯必先推考日食以驗春秋何則日之行也有中道月之行也有南北九行當其晦朔之交或食淺或食深或頻月迭食或曠嵗不食是皆後世善筭者所能及也何休難曰春秋書日食不言月食日者因其無形也故闕其疑何緣以夜食書乎予嘗推鄭君之說知日之必有夜食言乎前月之晦日入久矣言乎次月之朔日出而已虧傷盖天之晝夜以日之出入為分人之晝夜以天之昏明為節此傳所謂因王者之朝日而後見日之有虧傷也今而曰一日一夜合為一日日始出而虧傷未完是朔食也如或不見其虧傷則可謂夜食耳夫自周天三百六十五度有竒者而論之天平運而舒日月則内轉而縮日一日一夜一周天而在天為不及一度若月已不及十三度有竒以日之速用月之遲退以及之一月之間積二十九日九百四十分日之四百九十九日月一㑹是則二十九日少半日也天運之參差不齊日食之在晝在夜不可以一定論也必以日之始出則為畫食日之既沒夜行地下則將不得為夜食乎徐邈曰日夜食衆星無光盖衆星託日以為光者也世之登泰山者夜半觀海出日人世之闇闇猶故也於此而或食謂之食朔可矣晝食未可也又安得不曰夜食乎予嘗逺徵前代魏永安二年十月己酉日食地下虧從西南角起近據宋世淳熈十二年九日望太史言月食在夜新厯楊忠輔言月食在晝慶元四年九月朔太史言日食在晝草澤陳大䣭言日食且在夜月猶有晝食又况榖梁已有日夜食之傳乎夫厯本春秋之所重者也今而曰孔子從周何嘗考殷厯設考之矣今論語家語禮記中庸皆不見也雖然論語所載諸書禮樂皆嘗討論獨無一語及春秋將謂春秋非孔子作可乎襄之二十有八年書春無冰哀之十有二年書冬十有二月螽不冝有螽而有螽可以有冰而無氷是二者仲尼或指以為司厯之過魯厯差矣則殷厯庸有不考者乎今而又曰杜元凱嘗用劉歆三統厯著春秋長厯亦不曽因推長厯言日夜食雖然元凱長厯晦朔參差甲乙舛錯委曲從傳反謂經必有誤是雖未始明言日食之在夜吾以天運考之則必知日之有夜食不敢謂聖經之必無也抑長厯併考古今十厯乃知三統最踈固不肯因而用之以著長厯長歴大槩劉洪乾象厯耳乾象斗分細故不可通於古殷厯斗分粗故可不通於今姜岌有是言也庸詎知春秋不用殷厯乎今而又曰自尭以來因日之出納為晝夜若日出而已虧傷便是畫食不必言夜是故旦則驗日初昏則驗星此說善矣然聖人之作春秋所以宣明厯數而示諸人者將不復以日月薄蝕之故而後定也不然則固不能必日之不夜食也嗚呼天文厯數之學不易言矣聖人之占天也有可以度數求者有不可以度數求者而其理固自行乎其間又豈得以吾耳目之所及者而遽定也哉然今曰日夜食經本無明文惟見於穀梁子穀梁子魯學也至漢鄭君信之晉范甯又信之今之世學者主胡氏胡氏亦信之予固不敢以不信也然則吾明逺之所舉云者傳之不信而惟何休劉敞之緒論是徵故又敢始終辨之淵頴集卷五欽定四庫全書淵頴集卷六元吳萊撰
