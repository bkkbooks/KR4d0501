front:
  text: 思屈原宋玉王揚司馬支離輪囷綺繢艶冶言文辭者則或蜀而或楚詩書禮樂雕龍炙輠公平正大浮淫奓詡言道術者則或齊而或魯喑嗚則雷震指顧則雲聚立談則谷風發條遄怒則秋雨流潦頎然而長厖然而厚博然其肩背哆然其顴輔出材於山野升俊乎天府窮足憫黎民逹足事聖主猶欲發乎汪罔之封守敺乎昭如之海濵軺車尚有所不能載三馬尚有所不能勝若是乎恢梧倜儻包容庨豁有異於恒人者乃足為國家之用稱天下之珍則予之不足也知已甚矣今夫予志氣不剛筋力不強容貌不通扵世俗衣冠不合於康荘空洞坌塞而無統繆悠迂誣而不得當處闤闠則心勦形瘵望山林則獸駭鳥忼慨而長嘯跰􅓷以自鑒且謂夫𤣥造肖形之過也則客將閔宋人之苗而揠之使長乎不然世固有足者矣竦肩而千技攘臂而百變拏棹則凌氷霜膏車則犯雪霰盖已前鼓金張之虚譽後攀許史之宻援王貢弹冠而肯慶蕭朱結綬以互薦是固先聲之所及無論乎么麽眇小血肉之軀而上不許之見也客乃逌然笑惕然謝曰古之人不云乎形之厖也􅁼有徳聲之宏也類有能然卒以是致敗而不復振予不敢復相天下士矣是故鯨鯢蕩而失水雖螻螘之細㣲或為之制麋鹿介而離山雖文豹之拳捷或肆其噬晏嬰知而臨菑安趙武呐而故絳理沈尹瘠而屈折白公孟嘗眇而招徠多士斯豈非其人乎姑欲激生而使進於此也生今上希道徳中效儒墨巧匠之手無曲木而惟其器之用聖人之門無棄人而惟其材之得不究其學之是非乃徒汝形之為惑是且輕詩人之忠厚掩說士之噤吟捨茈葫桔梗於戰國之澤而不收榛楛棫樸於成周之林也不亦左乎
