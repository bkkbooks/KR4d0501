body:
  text: 淵頴先生碑浦陽江之上有大儒曰淵頴先生呉公以精深𤣥懿之學發沈雄竒絶之文闔隂闢陽出神入鬼縱横變化其妙難名生雖弗克顯融以伸其志既沒而言立浩浩穰穰其書滿家信一代之偉人足以播芳猷於弗朽者也先生諱萊字立夫姓呉氏其先毗陵人一遷于睦三遷婺浦江之新田唐乾寧初有諱公飬者又遷縣西之呉溪實徳政鄉尊仁里也高祖諱聞贈中奉大夫福建道宣慰使䕶軍追封渤海郡公妣盛氏追封渤海郡夫人曽祖諱蕃累贈資善大夫太常禮儀院使上䕶軍追封渤海郡公妣沈氏追封渤海郡夫人祖伯紹累贈翰林學士承㫖榮祿大夫柱國追封缺國公妣金氏追封缺國夫人父諱直方集賢大學士榮禄大夫致仕妣盛氏初盛夫人懐娠始七月翰林公忽夢西域神人飛空而來直止夫人之寢心異之越翼日先生遂生因名曰來夫人頗知書年四嵗授以孝經論語春秋榖梁傳隨口成誦七嵗善屬文有奴僕命騷之言嵓南先生方公鳯見而竒之曰此邦家材也取南山有臺詩中語更今名族父㓜敏家素多書先生時出與羣童敖私挾一編以歸盡夜讀竟又復往易或以聞于㓜敏迫而觀之乃班固漢史也幼敏指谷永杜鄴傳謂曰爾竊觀吾書能記是當不爾責先生琅然誦之至終篇一字不遺㓜敏以為偶熟此卷三易他編其誦皆如初乃盡出藏書畀之讀巖南益異之許以孫女妻焉且授易書詩三經義暨秦漢而下諸文章大家先生一覽即悉其指趣巖南退謂人曰明睿如呉某雖汝南應世叔正不足多也自是以來先生博極羣書至於制度沿革隂陽律厯兵謀術數山經地志字學族譜之屬尤無所不通矣時朝廷將有事于東方即自奮曰此小醜耳何必上勤王師使某持尺書諭之足矣因撰疏論其事㑹病不果上延祐間貢舉法行有司以先生名上豫章熊公朋來巴西鄧公文原及吾郡胡公長孺主去留士此三數公軰行老成學術淹貫自非博古該今明體適用咸懼不得在茲選而先生與焉於是東經齊魯梁楚之郊北抵燕每遇中原竒絶處輙瞪然長視平岡灌莽一望千里昔人歌舞戰争之地壹皆前迎後却畢在塵沙霜露中遂與當塗李翼餘姚方九思臨川傅斯正貰酒高歌天寒風急毛髪上豎自謂綽有司馬子長遺風尋以論議不合於禮官退歸田里出㳺海東洲歴蛟門峽過小白華山登盤陀石著觀日賦以見志還寓同縣陳士貞家士貞之居與龍湫五洩鄰榛篁蒙羃似不類人世先生日嘯咏其中暢然自得或至暮忘返㳺覽之暇不廢纂述重取春秋傳五十餘家各隨言而逆其意一以理折衷之譬猶法家奏讞傅逮爰書既得其情而曲直真偽無所隠至若繁露釋例纂例辨疑微㫖折微權衡意林通㫖之類皆有論著復謂孟子乃亞聖人大才司馬遷不當使與鄒衍奭淳于髠慎到荀卿墨翟尸佼長盧同傳因刪去諸子益以萬章公孫丑之徒作孟子弟子列傳古今樂府不同郭茂倩不當但取標題無時世先後就其所次辨其時代使各成家名樂府類編古之賦學専尚音必使宫商相宣徴羽迭變自宋玉而下唯司馬相如揚雄柳宗元能調協之因集四家所著名楚漢正聲其他著述若此者衆不能殫舉也四方學士慕其聲光多負笈從之㳺先生遇之恒若撫子姓饈服有不給者周之監察御史許君克學行部浙東以茂才薦署饒州路長薌書院山長未行而疾作衺風挾沴血交襲顔面壅黒兩脛罷孱不可越戸限重紀至元六年先生年四十四棲遲衽席愈不自振忽夢作重汪踦贊覺謂人曰汪踦殤者也予自嬰疾以來何藥不嘗而勢革若此今嵗殆不起邪夏四月九日竟卒于家遺命治䘮不用浮屠法諸生胡邦翰鄭銘等來相治後事二子士諤士謐以至正元年十一月二十四日奉柩窆鄉之盉塢去家南五里而近及門之士以其經義𤣥深而文辭貞敏也私諡曰淵穎先生郡太守縣大夫復各祠之於學官云先生自少有大志専思澤物不欲以文士名每慕張宣公為人推明義利雖一毫不苟取表裏一致與人㳺驩然有恩愈久愈固身雖羸弱若不勝衣雙瞳碧色爛爛如巖下電見者改容鑒裁精絶人以古詩文試之先生察其辭氣即知其為某代某人所作當其賦咏捷如雨風一日於故人家見几上推剡紙數十畨戯為長歌頃刻而盡屬對嚴巧文采縟麗觀者驚以為神謂非人所能及所著書有尚書標説六卷春秋世變圖二卷春秋傳授譜一卷古職方錄八卷孟子弟子列傳二卷楚漢正聲二卷樂府類編若干卷唐律刪要若干卷文藁六十卷别如詩傳科條春秋經説胡氏傳攷誤未完失自文氣日卑士無真識徃徃倚人之論以為低昻其推古之作者則曰雄渾贍富唯有漢之文為然淳質雅奥亦唯有漢之文為然今之從事藝文者如之何可及也嗚呼豈其然哉苟以先生諸作寘之司馬遷相如劉向王褒之間吾知其未必有愧也第以數與時違弗沾一命以至於死不大顯白于世所幸雄篇鉅冊彪炳烜著有如日星尚當藏諸名山以俟後世之知揚子雲者銘曰大火焞焞司于南辰重明宣昭神之伸也有赫厥靈郁紛輪囷敷為至文降于人也斧藻交横黼黻斯皇變化凌厲動無方也雲流猋行品彚咸亨於􅋫其光寂無聲也胡積之腴不顯其施返于混茫朱鳥之區也騎箕之精上為列星發天之符合地靈也石室之藏雄文吐芒鬼神呵衛禁不祥也泰華嶙峋長河奫沄永世有耀與之俱存也門人前史官金華宋濓撰諡議傳曰物生而後有象象而後有滋滋而後有數數成而文見矣是則文者固囿乎天地之中而實能衛翼乎天地品裁六度叶和三靈敷陳五彛開道四徳何莫非文之所為而所謂文者非他道而已矣故聖人載之則為經學聖人者必法經以為文譬之於木經其軀幹者歟文其柯條者歟安可以岐而二之也自史氏失職以訓詁列之儒林以辭章書之文苑雖欲昭後之世而失之古義盖逺矣有如長薌書院山長呉公先生風裁峻明才猷允茂潄六藝之芳潤為一代之文英纂述之勤汗簡日積於詩書則科分脉絡而標其凡於春秋則脱略三傳而發其藴於諸子則研覈真偽而極其言於三史則析分義例而嚴其斷藻繢所及無物不華汪如長江峻如喬嶽激如雷電和如春陽其妙用通于造化其變通莫拘若應龍之不可羈觀其所志真欲等秦漢而上之凡流俗剽竊無根之學孱弱不振之章皆不足闖其藩垣而逐其軌轍者也嗚呼盛哉門生學子僉曰經義𤣥深非淵而何文辭貞敏非頴而何於是私諡曰淵頴先生云門人金華宋濓等謹議淵頴集附錄
