front:
  text: 淵穎吳先生集卷之十二門人金華宋濂編
  hash: sha256:bb6102e4447b563e263c1ed1230cc0ea2dba8726e93c55fc05ba63c782649c00
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0501_SBCK_012-1a}
body:
  text: 桑海遺録序頃豫嘗從鄉先生學見福唐劉汝鈞貽書括蒼吳思齊子善論文丞相宋瑞事云自江西𥘉起時﨑嶇山谷購募義徒耕氓洞丁造轅門請甲仗不啻數萬而尹玉實為驍將大衣冠指麾衆皆詣闕感泣求效死巳而當國二揆交沮用兵帥無宣諭卒無犒賞盤桓月餘僅令守姑蘇一路張彥提重兵居毗陵且有叛志尹玉竟以絶太湖吊槗首尾不救而溺死未幾獨松告急朝廷四詔政府六書趣棄聊攝援根本一日一夜倉皇就道及至行都而獨松隨以破陷復令駐兵餘杭守獨松朝議不一衆心離散會有尹京之命餘慶遽奪其印不豫漢輔遁德剛遁北軍入城與權又絶江遁乃即日拜樞使又拜右揆輔與權處且令往軍前講解毅然請行及𬒳囚以北中道奔迸收集亡散無兵無糧天下大勢去矣帝霸交馳正偽更作是不一妵當世之為大臣元老者視易妵如閲傳郵况當滄海橫流之際而彼乃以異妵未深得朝廷事權欲隻手障之至死不屈微箕二子且有愧色於宗國矣其書大略如此豫後又獲見淮隂龔開所作文宋瑞陸秀夫二傳蓋益詳焉方唐末五代之季藩鎮跋扈武臣驕矜君臣父子之義不明而土地甲兵之強類無不欲黃屋左纛自為者先宋知其然一旦踐大位即罷諸莭度兵符遽用􅚨臣以為治終不足以盡復乎石晉所割之境土逮乎宣和衰亂北兵南下急若建瓴曽不得乘一障設一候而遂至奔亡不守後宋再造東南區區山海之間內政不修外猶恃夫江淮以為固久之南北夾攻而汴蔡之藩籬自撤其蔽荆襄受圍鄂渚有警巴蜀侵陷廣西之烽燧亦不絶此其國勢垂盡受兵處多殆如囊中探丸圍中逐鹿無𣸪有潛藏隱伏地矣所可幸者天下學士大夫二三百年祖宗培飬作成之澤薰蒸者久忠臣義子或死莭或死事蓋無愧焉卒之宋瑞秀夫前後死國精忠激烈誠有在於天地而不在於古今者嗚呼吳晉陳陏之變豈復有一人若是哉龔開者字聖豫少嘗與秀夫同居廣陵幕府及世巳改多往來故亰家益貧故人賔客候問日至立則沮洳坐無几席一子名浚每俯伏榻上就其背按紙作唐馬圖風騣霧鬛豪骭蘭筋備盡諸態一持出人輒以數十金易得之藉是故不飢然竟無所求於人而死志莭既峻儀觀甚偉文章議論愈髙古至為此二傳大率類司馬遷班固所為陳夀以下不及也此其人殆亦無負于秀夫者哉豫故私列二傳以彂其端詢之故老徴之雜記題曰棄海遺録且以待太史氏之采擇古詩考録後序豫嘗從黃子學詩黃子集漢魏以來古詩凡數十百萹詩之作尚矣蓋古今之言詩者異焉古之言詩主于聲今之言詩主於辭辭者聲之寓也昔者孔子自衛反魯乃與魯太師言樂樂既正矣而後雅頌各得其所史遷則曰古詩三百餘萹聖人特取其三百而𬒳之弦歌所謂洋洋盈耳者不獨主于聲也或因其斷章取義而欲以導其言語之所彂或夲其直指全體而務以約其􅒏情之無邪是又不以其辭哉制氏世世在大樂官蓋頗識其鐘鼓之鏗鏘而不能言其義鹿鳴騶虞伐檀文王四調猶得為漢雅樂之所肄且混于趙燕椘代之謳者無幾自其辭言古今義理之極致一也自其聲言則樂師矇􅸴之任未必能勝夫齊魯韓毛四家之訓詁者也雖然古之安樂怨怒哀思之音蓋將因其辭之所寓者而盡見之故當時之聞韶者則從容和緩觀武者則彂揚蹈厲是獨非以其聲辭之俱備然哉自漢魏以來誠不可以望古三百萹至於上下千有餘載作者間出如以其聲則沈休文之樂志王僧虔之技録自能辨之苟以其辭則今無越乎黃子之所集者吾猶恐古之言詩不專主于聲而今之言詩亦不專主於辭也何則古之言詩本無㝎聲亦無㝎韻聲取其諧韻取其協平固未始嘗為平仄固未始嘗為仄清固未始不叶為濁濁固未始不叶為清自近世王元長沈休文之徒始著四聲㝎八病無復古人深意新安吳棫材者乃用是而輔音輔韻先􅚨亦嘗取是而叶詩叶離騷蓋古今之字文不同南北之語言或異而音韻隨之是雖不待於叶而自能叶焉者也故當觀其辭然則古之言詩者辭而言樂者則聲也采詩之官不置樂府之署不設吾無以聲為也若夫今之言詩既曰古近二體古體吾不敢知而近體乃謂之為律者何也又安得不求夫聲辭之俱備而後為至哉考乎古者考此足矣試以是而復之黃子序于末編陳氏大衍易數後序凡天下之物必有理而後有象有象而後有數數始於一有一而後有二一者竒二者耦而後有隂陽老少之變七八九六之策策三變而成爻爻六變而成位此聖人所以觀變而立卦考象數而建卜筮者也易曰大衍之數五十其用四十有九自其大衍之五十者總之則又合於太極之一是皆天地自然之運又豈待乎人力之強為者哉何則一定者理也雖其體甚實所􅔜無形未始有定者事也雖其迹本虛因應乃有理在是數亦不外乎是欲求其極則天地之開闢人物之消盡且可以數莖之蓍參兩而盡決之者吾聖人固未肯輕為之説也是何丗之喋喋者然哉自秦滅六經易以卜筮故存漢􅚨林傳孔子六傳至災川田何易道大興魏郡太守亰房則又受學外黃焦延夀不與何同漢初河內女子始獻易説卦蓋與老子同藏於風雨屋牆之間京房之説互相出入故世之稽吉凶刺休咎者徴焉是果吾聖人之遺意哉它則進退以幾而為一卦之主者為丗對待以丗而為其主之相者為應世之所位而隂陽之所肆者為飛肇乎所配而隂陽終不脫其本者為伏起乎丗應周乎內外終終始始而後動爻互體五行納甲之變無不具者人自以為能探河洛圖書之賾家自以為能彂周孔爻象之藴餘則或入於淫瞽方技之流與易大相逺矣先正蓋有見焉必以名理論易而或不以象數論易雖然是又可得而盡廢者哉括蒼陳生嘗出大衍易數一卷間為豫占考其法則曰聖人之立卦者八故天下之物苟囿于數者亦不過八吾則夲其所值之數輒以八乘除之或以身之所處定其坐作動靜之殊或以字之所畫測其向背俯仰之異八而巳矣自八而六十有四自六十有四而四千九十有六用此道也嗚呼生之於易勤矣要之特亰房之法耳生則又曰是固本之希夷氏者也豈彼生者希夷氏之遺裔歟先天四圖吾聖人之學也生盍歸而務求其要歟一中造化心上經綸盡在是矣秦階六符經後序泰階六符經者本黃帝有熊氏丗不傳當漢建元之間東方朔始陳其説欲以觀天表之變定上心之侈者應劭仲逺又疏其文頗類甘石諸人所為託之者也蓋古昔聖人之論隂陽五行者尚矣幽贊乎神道彂揮乎天理是豈無其故乎特未嘗膠于多忌之學欲肆其一定之説也苟曰乾坤開闔莫非一造化亭毒之妙某言必有某徴某事必有某應喜樂好惡出于人之情飢華泄雹興於天之治天人兩間似皆有以潛回其機密運其軸而無難者是亦管窺蠡測而巳矣自劉向言皇極之建不建亰房又推易卦直日用事董仲舒睦孟之徒又分春秋二百四十二年災異之驗或身遽以死或國隨以蹙迄不少救然而天文月令讖緯術數百家雜起不曰龜龍河洛洞幽靈之府必曰鈐決冥奧核􅍔福之源蜂談而角辨啓穴而鑿牖秖足以長姦偽而甚不足以祛邪惑者大率漢世世主以是論政儒生以是論學何其泥也子不語怪力亂神又曰性與天道不可淂而聞也庸詎有若是云云者乎當東方朔陳是説時上始為微行行暴肆侈越制亡度舉盩厔鄠杜陸海之饒廣上林苑東征西伐軍旅數起黎民失業父子相食斯其為人痾也酷矣天人一理也吾知修吾事以畏天可也日蝕地震冬雷夏霜蒙氣還風旱乾水溢天之為也人何與焉天豈若世之小大夫然哉惉然喜頩然怒人人而欲應之以吉凶妖孽之決也一日之頃雖千技百變而為之亦不足矣要之天為天人為人母相瀆也至其所以兼統而一貫之者昭昭冥冥理無變氣有變也然上𥘉即位天表巳多變關東大飢風赤如血齊椘二十九山同日崩考之人事則猶未有可感者變何自作哉將人子未嘗有過父母乃先作色以待其有過固不可也使朝廷多欲之心一窒文景富庶之政未改是且委之天運之適然者歟抑亦君德之勝為足以銷天變之迭至者歟不然未可知也而今乃欲以膚學謏聞者盡之則非矣揚子雲曰通天地人曰儒通天地而不通人曰伎嗚呼伎而止者此非黃帝書也甘石諸人所為託之者也雖然觀是者又可無畏乎哉王氏範圍要訣後序天文星曆五行之説尚矣黃帝風后漢河上公有三命一家藝文志不著録也梁陶弘景始述三命抄略唐僧一行桑道茂劉孝恭咸精其術韓退之言李虛中善用人年月日時知人命貴賤夀夭者是巳貞元𥘉李弼乾又推十一星行曆後傳終南山人鮑該曹士蒍世係之星曆所謂十一星者日月五星四餘是也然而天體至圎二十八宿與之為經日月五星皆動物也且相循環運轉乎三百六十五度有畸之內與之為緯尚書堯典考四仲中星各以時異秦漢以來諸儒又推十二次度數十二國兮野及所入州郡躔次乃若有一定不可易之處是何天運之常旋地維之不動者又若是參差不齊也哉晉天文志天東南有十二國星其星有變各以其國將天之所覆至廣華夏之所占特東南牛女二宿之下歟此十二國星又與前十二國之分野異矣意者牛女二宿當十二次則為玄枵星紀之交當十二國則為齊吳濵海之地天運之常旋者夲不常居地維之不動者固有㝎屬也雖然北極居天之中常在人北北斗實為帝車運乎中央亦處人北蓋嘗北至幽州碣石之野斗極且當人上北過居庸西渡灤水北斗巳南迤而下人且背之而馳矣由是觀之華夏之所占者豈直東南十二國星哉未可以一槩論也日君象也行則有常月五星臣象也行則無常蓋日之常行也則有中道曆家所謂黃道是巳月五星既無常行乍南乍北或嬴或縮且或不出於周天二十八宿黃道之度而雜犯乎河漢內外諸星此又豈可以區區算數少測之哉它則紫氣以祥彗孛以妖羅㬋計都以蝕神首尾古未嘗與七政並列春秋之書星孛或入北斗或在大辰夲是妖星為異老子之出函谷紫氣臨關亦是氛祲雜占王朴五代欽天曆又謂蝕神首尾僅行於民間小曆而巳今其説一本之都利聿斯經都利蓋都賴也西域康居城當都賴水上則今所謂聿斯經者婆羅門術也李弼乾實婆羅門伎士而曹士蒍又作民間小曆者此其為術固異於甘石之舊矣夫以天地隂陽之合散而庶人庶物莫之能遺氣賦之形理賦之􅒏􅒏之體本粹然至善者也氣之運譬之草木春而榮秋而稿倐而凝聚忽而澌盡亦其宜者苟不推之以一理之同而徒役之以多衍之異不亦末乎嚴陵王生乃以範圍要訣一卷示豫其法皆原於易又有過於三命十一星之外者列之以千百十零附之以氣名體性尤與潛虗擬玄者合也此其最近于理者歟將其人之創為是法者亦且有得於河洛圖書之奧者歟故豫又特采別説以序之司馬子微天隱子注後序司馬子微天隱乎注一卷八萹天隱子亡其妵族邑里或曰子微託之者也夫黃老之説始自黃帝老子太史公老子列傳則稱其以自隱無名為務至其道乃曰無為自化清淨自正無它異也當漢𥘉黃老盛行至武帝又好神仙文成五利之徒迃誣怪譎之士神光巨迹千變百幻雖嘗一致稿山之祠欲追黃帝之遺風者獨不及老子神仙方技豈又與道家戾歟東漢以來丗之􅚨者方以天文卦候為內學而為天子公卿之所賔禮甚則自陷於鬼道尤慈啓之葛玄紹之玄之後則有鄭君鄭君之後則有葛洪葛洪之後則有陶弘景洪與弘景本􅚨者當天下多故欲自縱于方外逸民之間一傳而王逺知再傳而潘師正三傳而吳筠司馬子微考其學今天隱子之所述巳盡之矣豫觀天隱子沖淡而間曠虛靚而寡欲黃老之遺論耳然而龍􅍑鉛汞抽添吐納之事未之及也豈或祕而不言歟夫以老子之修道飬夀雖太史公猶不盡信又况後世之迃誣怪譎者可必得而悉徴之歟自今道家而言彼謂􅒏宗􅚨者則曰此心也必主於覺彼謂命宗􅚨者則曰此氣也必保其純一天人達􅒏命因其血肉口鼻之粗而得與造化𬈑涬同入於無盡盡之妙此古之人所以長生而不死者豈或別有其術歟不然天隱子之學亦止於是而巳歟或曰孔子嘗師老子吾聖人蓋尸假者也特以語怪而不言故曰述而不作敏而好古竊比於我老彭老則老聃彭則彭祖也雖然老子東周一柱下史耳幽王時有伯陽父顯王時有史儋夲是二人且不與老子同時老子固夀矣太史公欲合伯陽父史儋為一人且為老子則亦疑弗能㝎也彭祖本大彭氏國陸終氏苐三子當堯時始封又國語曰大彭豕韋則商滅之注謂在武丁時自堯至武丁中興上下且七八百年亦無緣大彭之國自興至滅止當彭祖一世世之言彭祖夀者吾又可得而必信之歟蓋孔子所言老彭自是商之賢大夫不謂老聃彭祖也老子嘗問禮矣彭祖者竟何為耶豈或果有飬生之説耶嗚呼吾聖人未嘗言養生然亦未嘗不飬生禮者所以莭其動容周旋樂者所以彂於詠歌舞蹈禮樂不可斯須去身無非養也固未嘗以養生言也天地隂陽闔闢屈伸之變亦何所不有夫又何謂乎尸假矣哉嗚呼天隱子逺矣吾將東往海上廣桑而問焉庶幾果有所遇而必得之者耶歐陽氏急􅈬章解後序歐陽子急􅈬章一卷蓋據元豐九域志作也自唐失其御天下分為十數至宋而復合然猶不足以復唐世之土宇曽未幾何南北乕爭光嶽氣裂兵戈日尋生靈塗擊灰於是我朝興焉一麾而克有中原再舉而底㝎江左然當大軍百戰之後閭里蕭條荆榛滿目户口凋瘵流轉異鄉雖以昔日大藩列府控制局面今則徒類附庸雄城壯縣顯著版籍今則不聞建置甚者至以東南財賦之嬴而往濟西北之不足顧獨何哉嘗聞古稱秦雍為天府齊地負海亦號東秦唐丗頗稱楊一蓋二而東西秦寖為不及宋承唐季亂離之緒內總二十三路外制兩國遼淂燕雲三關之險夏制靈武河西之饒太河東圵陜西五路之民歲窘於兵不暇自救一旦而南遷吳會荆襄兩淮又為邉面而應敵重以山東張林李全之變淮甸空虛蜀夲最險平世金珠錦繡之美衣𬒳中國金房假道徒示夾攻黎嶲竒兵竟成斡腹由是兵燹相仍創殘不振則亦非復唐舊矣然惟吳會近畿之境自唐五代以來吳越世奉正朔保境息民蓋至宋移蹕江閩嶺海之所奔輳及其既亡又未嘗苦操尺寸之兵而拒敵故今人物之所聚土地之所産猶足以為天下最雖若一城百里之縣至或升為散州上秩以治之國家經費度支資給陸輦海運動至百萬豈民力之果𥙿哉此猶富家萬金之産田連阡陌粟盈倉廥要亦取之有窮用之有竭𥘉不可以富強恃而不惟安養之是務也嗚呼豈惟東南一隅雖以西北休養生息之餘亦不可以不深加其意矣是故當今之務欲富國者必在於養民欲養民者又必在于重郡縣之選嚴守今之職苟重其選將任之以久而可成功苟嚴其職將權有所歸而易集事今之世每以三歲為守令滿秩曽未足以一新郡縣之耳目而巳去又况用人不得􅌹辟臨事不得専議錢糧悉拘于官而不得専用軍卒弗出于民而不得與聞蓋古之治郡者自辟令丞唐世之大藩亦多自辟幕府僚屬是故守主一郡之事或司金榖或按刑獄各有分職守不煩而政自治雖令之主一邑丞則贊治而但掌農田水利主簿惟掌簿書尉則惟督盜賊令亦不勞獨議其政之當否而已今自一命而上皆出于吏部遇一事公堂完署甲是乙否吏或因而為姦勾稽文墨輔苴罅漏塗摖歲月填塞辭欵而益不能以盡民之情狀至於唐世之賦上供送使留州自有㝎額兵則郡有都試而惟守之所調遣宋之盛時歲有常貢官府所在用度贏餘過客往來稟賜豐厚故士皆樂于其職而疾於赴功兵雖不及于唐義勇民丁團結什伍衣裝弓弩坐作擊刺各保鄉里敵至即彂而郡縣固自兼領者也今則官以錢糧為重不容盜臣常俸至不能自給或多贓吏兵則自近戍逺既為客軍尺籍伍符各有統帥但知坐食郡縣之租稅然巳不復繫守令事矣夫辟官涖政理財治軍郡縣之四權也而今皆不淂以専之是故上下之體統雖若相維而令不一法令雖若可守而議不一為守令者既不得其職將欲議其法外之意必且玩常習故辟嫌礙例而皆不足以有為又况三時耕稼一時講武不復古法之便易而兵農益分遇歲一儉郡縣之租稅悉不及額軍無見食東郍西挾倉廥空虗而郡縣無復贏蓄以待用或者水旱洊至閭里蕭然農民菜色而郡縣且不能以賑救而坐致流亡是以言涖事而事權不在於郡縣言與利而利權不在於郡縣言治兵而兵權不出於郡縣尚何以復論其富國𥙿民之道哉嘗求其故自我國家起自北土絲理中原中原豪傑擅動甲兵保有鄉里因而降附使據其境土如古諸侯大開幕府辟置官屬錢糧獄訟一皆􅌹制于已而不復有關乎上巳而山東猘子地富兵強跳踉負固卒貽征誅殱滅而後天下郡縣一命之官悉歸於吏部錢糧獄訟類皆關白奏讞而不敢少自専焉由是郡縣守令之職始輕而不得自重矣必也辟官涖政理財治軍四者之權一歸於郡縣則守令必稱其職國可富民可𥙿而兵農各得其業矣此豫所謂重郡縣之選嚴守令之職者蓋視唐宋之故典為然實當今之急務也於是夲歐陽子之所集為疏其古今郡縣之沿革與夫政令之設施不同者以序之雖然此固非歐陽子之意也豫亦過論矣哉樂府類編後序𥘉太原郭茂倩次古今樂府但取標題無時世先後紛亂􅮭雜摹擬盜襲層見間出厭人視聽今故就茂倩所次辨其時代且選其所可學者使各成家又從而論之曰古之言樂者必夲于詩詩者樂之辭而播於聲者也太史采之太師肄之世道之盛衰時政之治亂蓋必於詩之正變者得之詩殆難言矣乎自秦變古詩樂失官至漢而始欲修之燕代荆椘稍協律吕街衢巷陌交相唱和當丗學者司馬相如之徒徒以西蜀雕蟲篆刻之辭而欲立漢家一代之樂府傳及魏晉流風䆮盛而其所謂樂者亦止於是嗚呼今之去漢則又逺矣故今或觀樂府之詩者一切指為古辭雖其浮淫鄙倍不敢芟夷殘訛缺漏不能附益顧獨何哉誠以古辭重也魏晉以降蓋惟唐人頗以詩自名家而樂府至雜用古今體當其𥘉年江左齊梁宫闈粉黛之尚存及其中世代北蕃夷風沙戰伐之或作是則古之所謂亂丗之怨怒亡國之哀思者而唐人之辭為盡有之欲求其如漢魏之古辭者少矣雖然漢承百王之敝治不及古唐之於漢則又不及于漢者逺甚是故秦虢列苐國忠秉政妖淫蠱惑養成禍亂而天下之俗日趨於弊蕃戎搆難隴右陷沒侵陵侮辱蹙我場疆而天下之勢卒以歲處於邉擐甲執兵無有休息唐之盛時雖若未見其喪敗亂亡之戚及其既衰而遂不能救然則唐丗之治固有以致之而唐人之辭亦於是乎有以兆之者矣嗚呼世道之盛衰時政之治亂蓋必於詩之正變者得之豈不然哉然而上自朝廷下至閭閻委巷苟觀其詩者則又必因其言辭之所指聲音之所彂而悉悟其心術之所形氣數之所至豫聞唐有宋沆者開元宰相璟之曽孫每太常樂工奏伎即能揣其樂聲之休咎遇有工善篳篥者且曰彼將神逰墟墓伎雖善至尊不宜近巳而果然衆工大驚夫以春秋之丗鄭之七子嘗賦古詩而趙孟欲以觀其志之所向然今宋沉乃能以其善樂之故察人死生貴賤不遺毫髮何其神哉嗚呼詩本所以為樂也詩殆難言矣乎今之學者深沉之思不講而講為麁踈鹵莽之語中和之莭不諧而益為寂寥簡短之音此其心術之所形氣數之所至不惟趙孟知之是皆見誚於宋沉者也豫故論之使後之讀是編而欲學是詩者可不慎哉春秋釋例後題春秋左氏漢𥘉夲無傳者劉子駿始建明之欲立學官諸儒莫應然傳之者亦巳衆多賈景伯服子慎並為訓解及晉而杜元凱又作經傳集解三十卷釋例四十卷且歷詆劉賈之違獨不言服氏豈或不見服氏書乎亦不應不見也世族譜夲之劉向世夲地志夲之泰始郡國圖長曆夲之劉洪乾象曆世多言其天文星曆為長然説經多依違以就傳似不得為左氏忠臣者南北分裂館陶趙世業家有服氏春秋是晉永嘉舊寫華隂徐生往讀之遂撰春秋義章以教學者是永嘉時猶未尚杜氏青州刾史杜坦及其弟驥丗傳其業故齊地亦多習之坦元凱之玄孫也姚文安秦道靜𥘉亦學服氏後更兼講杜説劉蘭張吾貴之徒則又隱括兩家同異義例無窮嗚呼漢𥘉習經者専門而今河洛習傳者宗服子慎江左尚杜元凱矣晉劉兆始取公榖及左氏説作春秋調人而今蘭吾貴又會服杜之説矣聖人之道不自是而愈散哉自唐孔穎達春秋正義一用杜氏非徒劉賈之説不存服義亦不盡見固不若兩存之以見服杜之為孰愈也今釋例具在有劉蕡序蕡太和中對賢良策譏切人主斥罵宦者文極激學一夲春秋與漢董生天人三策相為上下蕡亦自擬董生且曰昔董仲舒為漢武帝言之未盡者今臣復為陛下言之壯哉蕡乎至為此序獨不類唐文之衰至此極矣春秋纂例辨疑後題自唐世言文者一變而王楊盧駱再變而燕許三變而韓栁雖其文振八代之弊及見當世經生攻訓詁治義疏則深敬之太常殷侑新注公羊退之欲為之序幸得挂名經端以蘄不朽及寄詩盧同又言其抱遺經束三傳然同所著春秋摘微一卷間見一二亦未甚為學者輕重惟子厚答元饒州書恆願掃於陸先生之門執弟子禮會先生病子厚出邵州竟不克卒業先生蓋河東陸淳元沖也與子厚同郡且云先生師天水啖助及趙匡知聖人之旨兼用二帝三王法至先生大備春秋集注纂例辨疑微指等書苞羅旁魄轇轕上下一出於正於是乎春秋有啖趙陸氏之學住豫北遊亰師始從國子學見陸氏纂例十卷是金泰和間禮部尚書趙秉文手夲太原板行後又得陸氏辨疑七卷微指二卷而集注久闕自唐世學者説經一夲孔氏正義及宋之盛説者或不用正義六經各有新注爭為一己自見之論而欲求勝于先儒巳成之説宋子亰傳唐書猶不滿于啖助者豈啖助實有以開之故歟雖然啖趙陸氏未可毁也後之學者自肆于藩籬閫域之外口傳耳剽而不難於議經者必引啖趙陸氏以自解是或未之思也夫春秋折衷後題自西漢學者專門之習勝老儒經生世守訓詁不敢少變繼而舊説日以磨滅新傳之後出者獨傳於今春秋一經始立公羊氏學又立穀梁氏學東漢左氏學又盛行古傳後出者日勝後􅚨注古傳而世亦取後出者為宗公羊氏有胡母生嚴彭祖顏安樂而後何休獨有名榖梁氏有江公尹更始而後范寧獨有名左氏前有劉子駿賈逵服虔後有杜預故預亦獨有名嗚呼豈預必能為左氏忠臣哉休固陳蕃客也自謂妙得公羊本意故今有公羊墨守十四卷榖梁廢疾三卷左氏膏肓十卷北海鄭康成獨反之學者多篤信康成今猶見寧所集榖梁解又服雯自有左氏釋痾一卷不見也雖然公榖左氏三家之説後出者皆傳于今殊不知胡母生江公劉子駿諸人復云何也藉令諸人所説不廢至今並傳孰能有以大公至正之道一正之哉不然猶治亂絲益棼之也訛日以訛舛日以舛不以聖人之經觀經而徴諸傳不以賢者之傳解傳而又徴諸何氏范氏杜氏獨何歟幸今三家之説尚未泯則唐陳嶽之折衷此也庶有得乎蓋昔漢儒嘗以春秋斷獄豫謂非徒經法可以斷獄而獄法亦可以斷經何者兩造之辭具備則偏聽之惑無自而至矣揚子雲曰衆言淆亂折諸聖讀春秋者曾不明漢晉諸儒之遺論又何貴乎學者之知經也哉春秋權衡意休後題劉子作春秋權衡自言書成世無有能讀者至意林猶未脫藁多遺闕蓋昔左氏言孔子作經從諸國赴告故又博採他事以附經今劉子乃據閔因敘謂聖人悉徴百二十國寶書傳者從之將當時諸國所赴告者各有書也抑此豈即墨子所稱百二十國春秋乎東遷以來晉有乘椘有檮杌魯有春秋秦世家文公以後始有史以紀事王道衰諸侯力政二百四十二年之間凡經傳之可見者一百一十七國晉地理志且引夏商時國二斟豕韋過戈之屬非周舊也齊桓晉文之盛朝聘盟會侵伐敗亡者無慮數十而附庸小邑蠻夷雜種又豈悉有書可徴乎史稱魯君資孔子之周因老聃觀書周室且歷聘七十國又云與魯君子左丘眀觀史記自隱公訖于獲麟要之春秋固魯史也因麟出而虛其應故取而修之非夲書獲麟者所書周室事亦鮮無觀周史孔子丗家孔子嘗往來齊宋衛陳蔡之郊晉故霸國也聞趙簡子殺竇犫鳴犢至河而弗渡椘亦欲以書社七百里地封之子西靳不可又輒反于魯將所聘者又未必有七十國也然亦何暇悉徵其書乎墨子戰國人妄稱有百二十國春秋耳非聖人之遺言也何則杞宋王者後爵稱公皆大國也宋頗存王禮而杞乃以辟陋而用夷孔子曰文獻不足故也足則吾能徴之矣唯古之官名得之剡子它無見也雖然聖人作春秋但因魯事以寓王事隱桓之𥘉王政不行而魯與齊鄭宋衛交齊桓肇伯而魯事齊晉文繼伯而魯又事晉襄昭以降伯統將絶而魯又事吳椘故經之所載類不出此數國事然則春秋固魯史也魯史所不載聖人誠不得而筆削之又何待悉徴百二十國之書乎嗚呼閔因之説是亦無徴而弗信者矣春秋通旨後題自宋季德安之潰有趙先生者北至燕燕趙之間學徒從者殆百人嘗乎出一二經傳及春秋胡氏傳故今胡氏之説特盛行胡氏正傳三十卷傳外又有總貫條例證據史傳之文二百餘章子寧集之名曰春秋通旨輔傳而行當胡氏傳春秋時光堯南渡父讎未報國步日蹙將相大臣去戰主和寖忘東京宫闕西亰陵寢而不有者是故特假春秋之説進之經筵且見內夏外夷若是之嚴主辱臣死若是之酷冀一悟主聽則長淮不至於自畫江左不可以偏安此固非後丗學春秋之通論也然而胡氏傳文大槩夲諸程氏程氏門人李參所集程説頗相出入胡氏蓋多取之欲觀正傳又必先求之通旨故曰史文如畫筆經文如化工若一以例觀則化工與畫筆何異惟其隨事而變化則史外傳心之要典聖人時中之大權也世之讀春秋者自能知之同不可以昔者歆向之學而異論矣趙先生者諱復字仁甫國𥘉南伐攻德安潰之仁甫遭虜遇姚文獻公軍中文獻與言信竒士仁甫方以國破家殘不欲北且蘄死會夜月出即逃乃亟𬒳鞍躍馬號積尸間見其解髮脫屨仰天呼泣蓋欲求至水裔而未溺也文獻曉以徒死無益乃還然後盡出程朱性理等書及諸經傳故今文獻與許文正公遂為當代􅚨宗仁甫為有以彂之也先正有云世之去聖日逺故學者惟傳經最難仁甫當天下擾攘之際乃能盡彂先􅚨傳疏而傳之不亦難乎上在濳邸嘗召見曰我欲取宋卿可導之乎對曰宋父母國也未有引他人之兵以伐父母者故仁甫雖在燕久常有江漢之思誠若是則吾仁甫亦無愧乎胡傳之學矣淵穎吳先生集卷之十二
