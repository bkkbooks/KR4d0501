body:
  text: 淵頴先生碑浦陽江之上有大儒曰淵穎先生吳公以精深玄懿之學彂沉雄竒絶之文闔隂闢陽出神入鬼縱橫變化其妙難名生雖弗克顯融以伸其志既沒而言立浩浩穰穰其書滿家信一代之偉人足以播芳猷于弗朽者也先生諱萊字立夫姓吳氏其先􅴡陵人一遷于番再遷于睦三遷婺浦江之新田唐乾寧𥘉有諱公飬者又遷縣西之吳溪實德政鄉尊仁里也髙祖諱聞贈中奉大夫福逮道宣慰使護軍追封渤海郡公妣盛氏追封渤海郡夫人曽祖諱蕃纍贈資善大夫太常禮儀院使上護軍追封渤海郡公妣沈氏追封渤海郡夫人祖諱伯紹纍贈翰林學士承旨榮祿大夫柱國追封渤國公妣金氏追封渤國夫人父諱直方集賢大學士榮祿大夫致仕妣盛氏初盛夫人懷娠始七月翰林公忽夢西域神人飛空而來直止夫人之寢心異之越翼日先生遂生因名曰來夫人頗知書年四歲授以孝經論語春秋穀梁傳隨口成誦七歲善屬文有奴僕命騷之言嵓南先生方公鳯見而竒之曰此邦家材也取南山有臺詩中語更今名族父幼敏家素多書先生時出與群童敖私挾一編以歸盡夜讀竟又復往易或以聞于幼敏迫而觀之乃班固漢史也幼敏指谷永杜鄴傳謂曰尓竊觀吾書能記是當不爾責先生琅然誦之至終苐一字不遺幼敏以為偶熟此卷三易他編其誦皆如初乃盡出所藏書卑之讀巖南益異之許以孫女妻焉且授易書詩三經義暨秦漢而下諸文章大家先生一覽即悉其指趣巖南退謂人曰眀睿如吳某雖汝南應世叔政不足多也自是以來先生博極羣書至于制度沿革隂陽律曆兵謀術數山經地志字學族譜之屬尤無所不通矣時朝廷將有事于東夷即自奮曰此小醜耳何必上勤王師使某持尺書諭之足矣因撰疏論其事會病不果上延祐間貢舉法行有司以先生名上豫章熊公朋來巴西鄧公文原及吾郡胡公長孺主去留士此三數公輩行老成學術淹貫自非博古該今眀體適用咸懼不得在兹選而先生與焉于是東經齊魯梁楚之郊北拞燕每遇中原竒絶處輒瞪然長視平岡灌莽一望千里昔人歌舞戰爭之地一皆前迎後却畢在塵沙霜露中遂與當塗李翼餘姚方九思臨川傅斯正貰酒髙歌天寒風急毛髮上竪自謂綽有司馬子長遺風尋以論議不合于禮官退歸田里出遊海東洲𩔶蛟門峽過小白華山登盤陀石著觀日賦以見志還寓同縣陳士貞家士貞之居與龍湫五泄鄰榛篁蒙羃似不類人世先生日嘯咏其中暢然自得或至暮忘返遊覽之暇不廢纂述重取春秋傳五十餘家各隨言而逆其意一以理折衷之譬猶法家奏讞傳逮爰書既得其情而曲直真偽無所隱至若繁露釋例纂例辨疑微旨折衷權衡意林通旨之類皆有論著復謂孟子乃亞聖之大才司馬遷不當使與鄒衍奭淳于髠慎到荀卿墨翟尸佼長盧同傳因刪去諸子益以萬章公孫丑之徒作孟子弟子列傳古今樂府不同郭茂倩不當但取標題無時世先後就其所次辨其時代使各成家名樂府類編古之賦學􅌹尚音必使宫啇相宣徴羽迭變自宋玉而下唯司馬相如揚雄栁宗元能調協之因集四家所箸名椘漢正聲其他著述若此者衆不能殫舉也四方學士慕其聲光多負笈從之遊先生遇之恆若撫子姓羞服有不給者周之監察御史許君克學行部浙東以茂才薦署饒州路長薌書院山長未行而疾作邪風挾沴血交襲顏面壅黑兩脛罷孱不可越户限重紀至元六年先生年四十四棲遲衽席愈不自振忽夢作重汪踦贊覺謂人曰汪踦殤者也豫自嬰疾以來何藥不嘗而勢革若此今歲殆不起邪夏四月九日竟卒于家遺命治喪不用浮屠法諸生胡邦翰鄭銘等來相治後事二子士諤士謐以至正元年十一月二十四日奉柩窆鄉之盉塢去家南五里而近及門之士以其經義玄深而文辭貞敏也私諡曰淵穎先生郡太守縣大夫復各祠之于學官云先生自少有大志専思澤物不欲以文士名每慕張宣公為人推眀義利雖一毫不苟取表裏一致與人遊歡然有恩愈久愈固身雖羸弱若不勝衣雙瞳碧色爛爛如巖下電見者改容鑒裁精絶人以古詩文試之先生察其辭氣即知其為某代某人所作當其賦咏捷如雨風一日于故人家見几上堆剡紙數十畨戲為長歌頃刻而盡屬對嚴巧文采縟麗觀者驚以為神謂非人所能及所著書有尚書標説六卷春秋世變圗二卷春秋傳授譜一卷古職方録八卷孟子弟子列傳二卷楚漢正聲二卷樂府類編若干卷唐律刪要若干卷文稿六十卷别如詩傳科條春秋經説胡氏傳考誤未完夫自文氣日卑士無真識往往倚人之論以為低昂其推古之作者則曰雄渾贍富唯有漠之文為然淳質雅奧亦唯有漢之文為然今之從事藝文者如之何可及也嗚呼豈其然哉苟以先生諸作置之司馬遷相如劉向王褒之間吾知其未必有愧也苐以數與時違弗沾一命以至于死不大顯白于世所幸雄萹巨册彪炳烜著有如日星尚當藏諸名山以俟後世之知掦子雲者銘曰大火焞焞司于南辰重眀宣昭神之伸也有赫􅍏靈郁紛輪囷敷為至文降于人也斧藻交橫黼黻斯皇變化凌厲動無方也雲流猋行品彚咸亨於燁其光寂無聲也胡積之腴不顯其施返于混茫朱鳥之區也騎箕之精上為列星彂天之符合地坤也石室之藏雄文吐􅉭鬼神呵衛禁不祥也泰華嶙峋長河奫沄永世有耀與之俱存也門人前史官金華宋濓撰諡議傳曰物生而後有象象而後有滋滋而後有數數成而文見矣是則文者固囿乎天地之中而實能衛翼乎天地品裁六度叶和三靈敷陳五彛開道四德何莫非文之所為而所謂文者非他道而已矣故聖人載之則為經學聖人者必法經以為文譬之於木經其區幹者歟文其柯條者歟安可以𡵨而二之也自史氏失職以訓故列之儒林以辭章書之文苑雖欲昭後之世而失之古義蓋逺矣有如長薌書院山長吳公先生風裁峻明才猷允茂潄六藝之芳潤為一代之文英纂述之勤汗簡日積於詩書則科分脈絡而標其凡於春秋則脫略三傳而彂其藴於諸子則研核真偽而極其言於三史則析分義例而嚴其斷藻繢所及無物不華汪如長江峻如喬嶽激如雷電和如春陽其妙用通于造化其變通莫拘若應龍之不可羈觀其所志真欲等秦漢而上之凡流俗剽竊無根之學孱弱不振之章皆不足闖其藩垣而逐其軌轍者也嗚呼盛哉門生學子僉曰經義玄深非淵而何文辭貞敏非頴而何於是私諡曰淵頴先生云門人金華宋濓等謹議附録一卷吳淵穎集十二卷濓溪宋學士編録古人于師弟之誼甚篤於此可見然淵穎之學誠不愧乎一日之長而春秋猶其長也及門高弟有濓溪烏傷二公皆肖集行世余日思一覩為而無資置之中惟悒悒不知何時得遂斯志也近以虞山太史教天下讀書風尚漸以復古放濓溪吳孛懷麓歸震川文集世頗宗之今年太史己殁主持文教者蓋難乎其人惟誦其遺言而流傳其教而巳矣追溯淵源淵穎之集不可不反𣸪誦之也時康熙甲長嵗夏六月草三日葉石君重裝于成軒并跋
